.cta{margin:16px;padding:14px;border-radius:8px;background:#222;color:#fff;text-align:center;font-size:14px;font-weight:500;cursor:pointer}

.mdl p.d{margin:0 0 14px;font-size:12.5px;color:#8c8c8c;line-height:1.7}

.ck .tt{flex:1}

.ck .rq{font-size:11px;color:#c9376a}
.ck .op{font-size:11px;color:#8c8c8c}

.mdl .cta{margin:16px 0 0}
.mdl .esc{text-align:center;margin-top:10px;font-size:12px;color:#a0a0a0;cursor:pointer}

.alisheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 24px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}

.botb .av:after{content:"";position:absolute;left:3px;top:13px;width:14px;height:10px;border-radius:50%;background:#fff}
.bobody{display:flex}
.side{width:185px;flex:0 0 185px;background:#fff;border-right:1px solid #f0f0f0;padding:6px 0 30px}

.empty-row td{text-align:center;color:#a6a6a6;padding:46px 0}

/* 폰 틀: 통합 시안 고객 화면 iframe 과 같은 380px · 모서리 18 · 테두리 그림자. transform 으로 fixed 요소(하단 버튼 · 창)가 폰 기준이 된다 */
.ph.rph{width:380px;height:812px;border:0;border-radius:18px;box-shadow:0 0 0 1px #d4d4d8;background:#fff;transform:translateZ(0);overflow:hidden;display:flex;flex-direction:column}
.ph.rph .bd{flex:1;overflow:auto;overflow-x:hidden;background:#fff}
.rph .rf{min-height:0;color:#2d2d2d;font-size:14px;line-height:normal}
.rph .rf-ov{position:static;min-height:0}
/* 화면 높이 값(100dvh)은 폰 높이로 */
.rph .BookingInformationPage-module-scss-module__oG4JGG__page{min-height:756px}
.rph .AccountSettingsPage-module-scss-module__Fx5xia__page{min-height:756px}
.rph .pb-done{min-height:756px}
.rph .BookingUnavailablePage-module-scss-module__MOQRtq__page{min-height:812px}

.rph .pb-mp-tab a{font-size:10px}
.rph .pb-mp-tab{z-index:4}

.rf .AccountSettingsPage-module-scss-module__Fx5xia__field input::placeholder,.rf .AccountSettingsPage-module-scss-module__Fx5xia__messengerInputRow input::placeholder{color:#c6c6c6}
.rf .AccountSettingsPage-module-scss-module__Fx5xia__field{align-items:stretch}
.rf .AccountSettingsPage-module-scss-module__Fx5xia__messengerInputRow input{flex:1}
.rf .AccountSettingsPage-module-scss-module__Fx5xia__messengerTypeSelect{flex:0 0 120px}
.rf .AccountSettingsPage-module-scss-module__Fx5xia__phoneInputRow>input{flex:1}

.rf input[readonly]{cursor:pointer}
.rf textarea{cursor:text}
/* 회원 정보 · 알리페이 계정 채움 표시와 회색 안내(통합 시안 pb-autotag · pb-fohint 와 같은 값) */
