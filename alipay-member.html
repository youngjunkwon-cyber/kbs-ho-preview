<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알리페이 채널 회원 · 동작 시안</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:#262626;background:#f5f6f8}

/* ── 시안 껍데기 ── */
.wrap{max-width:1500px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:8px 14px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#434343}
.tab:hover{border-color:#e8537a;color:#e8537a}
.tab.on{background:#e8537a;border-color:#e8537a;color:#fff}
.state{background:#fff;border:1px solid #f0f0f0;border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.state b{font-weight:600}
.state .kv{color:#595959}
.state .kv em{font-style:normal;color:#e8537a;font-weight:600}
.state button{font-family:inherit;font-size:12px;padding:4px 10px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer}
.cap{font-size:13px;color:#8c8c8c;line-height:1.7;margin:0 0 14px}

/* ── 어드민 ── */
.adm{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.adm .phd{padding:20px 24px 0}
.adm h2{margin:0 0 4px;font-size:22px;font-weight:700}
.adm .pdesc{color:#8c8c8c;font-size:13px}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 24px}
.sel,.inp{padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;font-family:inherit;font-size:13px;color:#434343}
.sel.new,.grpbtn.new{border-color:#e8537a;box-shadow:0 0 0 2px rgba(232,83,122,.12)}
.btn{padding:6px 14px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;color:#434343;font-family:inherit;font-size:13px}
.btn:hover{border-color:#e8537a;color:#e8537a}
.btn.blue{background:#1677ff;border-color:#1677ff;color:#fff}
.card{margin:0 24px 24px;border:1px solid #f0f0f0;border-radius:6px}
.card>.hd{padding:14px 18px;font-weight:700;font-size:16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.grpbtn{border:1px solid #d9d9d9;border-radius:4px;padding:5px 10px;font-size:12px;color:#595959;cursor:pointer;background:#fff;display:flex;gap:8px;align-items:center}
.grpbtn span.g{padding:1px 6px;border-radius:3px;background:#fafafa;border:1px solid #e8e8e8}
.grpbtn span.g.on{background:#fff0f4;border-color:#f7c3d2;color:#e8537a}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 9px;border-bottom:1px solid #f0f0f0;text-align:left;font-size:12.5px;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#434343;font-size:12px}
th.grp{text-align:center;border-bottom:1px solid #f0f0f0}
tbody tr:hover td{background:#fcfcfc}
td.c,th.c{text-align:center}
.newcol{background:#fffaf2}
th.newcol{background:#fff4e6}
.dash{color:#bfbfbf}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11.5px;border:1px solid #d9d9d9;background:#fafafa;color:#595959}
.pill.ali{background:#fff0f4;border-color:#f7c3d2;color:#c9376a}
.pill.yes{background:#f6ffed;border-color:#b7eb8f;color:#389e0d}
.pill.no{background:#fff1f0;border-color:#ffa39e;color:#cf1322}
.foot{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;align-items:center;color:#8c8c8c;font-size:12px}

/* ── 모바일 ── */
.phones{display:flex;gap:24px;flex-wrap:wrap}
.ph{width:390px;background:#fff;border:1px solid #e8e8e8;border-radius:10px;overflow:hidden;position:relative;height:812px;display:flex;flex-direction:column}
.ph .st{height:40px;flex:0 0 40px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:12px;color:#222}
.ph .hd{height:48px;flex:0 0 48px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #f4f4f4}
.ph .hd .t{font-size:15px;font-weight:500}
.ph .hd .i{font-size:18px;color:#222}
.ph .bd{flex:1;overflow:auto}
.sec{padding:18px 16px 10px}
.sec>.h{font-size:15px;font-weight:500;margin-bottom:10px}
.box{border:1px solid #eee;border-radius:10px;padding:16px;background:#fff}
.nm{font-size:15px;font-weight:500}
.sub{font-size:12px;color:#8c8c8c;line-height:1.7;margin-top:4px}
.fld{margin-top:12px}
.fld .l{font-size:12px;color:#8c8c8c;margin-bottom:6px}
.fld .in{border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:13px;color:#262626;background:#fff}
.fld .in.ph{color:#b0b0b0}
.fld .in.auto{background:#fafafa}
.autotag{display:inline-block;margin-left:6px;font-size:11px;color:#c9376a;background:#fff0f4;border:1px solid #f7c3d2;border-radius:3px;padding:0 5px}
.note{padding:0 16px 6px;font-size:12px;color:#8c8c8c;line-height:1.7}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #f4f4f4;font-size:14px}
.mrow:last-child{border-bottom:0}
.mrow .a{color:#c0c0c0}
.cta{margin:16px;padding:14px;border-radius:8px;background:#222;color:#fff;text-align:center;font-size:14px;font-weight:500;cursor:pointer}
.cta.ghost{background:#fff;color:#262626;border:1px solid #d9d9d9}
.cta.dis{background:#e8e8e8;color:#aaa;cursor:not-allowed}
.lnk{font-size:13px;color:#c9376a;text-decoration:underline;cursor:pointer}
.gone{padding:14px 16px;margin:0 16px 12px;border:1px dashed #e0e0e0;border-radius:8px;color:#b0b0b0;font-size:12.5px;line-height:1.7;background:#fcfcfc}

/* 모달 */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.mdl{width:100%;background:#fff;border-radius:12px;padding:20px;max-height:100%;overflow:auto}
.mdl h3{margin:0 0 6px;font-size:16px}
.mdl p.d{margin:0 0 14px;font-size:12.5px;color:#8c8c8c;line-height:1.7}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f4f4f4;font-size:13px;cursor:pointer}
.ck:last-of-type{border-bottom:0}
.ck input{margin:2px 0 0;width:16px;height:16px;accent-color:#c9376a}
.ck .tt{flex:1}
.ck .rq{font-size:11px;color:#c9376a}
.ck .op{font-size:11px;color:#8c8c8c}
.ck .vw{font-size:12px;color:#b0b0b0;text-decoration:underline}
.mdl .cta{margin:16px 0 0}
.mdl .esc{text-align:center;margin-top:10px;font-size:12px;color:#a0a0a0;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="state" id="state"></div>
  <p class="cap" id="cap"></p>
  <div id="stage"></div>
</div>

<script>
/* ────────────────────────────────────────────────
   상태. 한 사람의 알리페이 회원 한 명을 따라간다
   ──────────────────────────────────────────────── */
var S;
function resetDB() {
  S = {
    joined:   false,   // 필수 동의를 마쳐 회원이 되었는가
    agTerms:  false,   // 이용약관
    agPriv:   false,   // 개인정보처리방침
    agProf:   false,   // 알리페이 프로필 제공 (선택)
    agAd:     false,   // 광고성 정보 수신 (선택)
    permit:   true,    // 알리페이 회원정보 조회 권한 개통 여부
    wallet:   'CN',    // CN 중국 / HK 홍콩
    email:    '',      // 예약에서 입력하면 채워진다
    view:     'fo09'
  };
}
resetDB();

/* 알리페이가 주는 값. 프로필 제공에 동의했을 때만 온다 */
var ALI = { name: '왕샤오메이', sex: '여성', birth: '1996-03-12', nation: '중국', id: '2088_9f31c07a' };
var LANG = { CN: '중국어 간체', HK: '중국어 번체' };

var VIEWS = [
  ['fo09', 'FO-CH-09 진입 동의 창'],
  ['fo10', 'FO-CH-10 로그인 영역 정리'],
  ['fo11', 'FO-CH-11 마이페이지'],
  ['fo12', 'FO-CH-12 회원 탈퇴'],
  ['fo13', 'FO-CH-13 예약 입력'],
  ['bo11', 'BO-CH-11 회원 관리']
];
var CAPS = {
  fo09: '알리페이에서 식별자를 받은 직후 한 번 뜹니다. 회원을 만들기 전입니다. 이용약관과 개인정보처리방침에 모두 체크해야 동의 버튼이 켜집니다. 거부하거나 닫으면 회원을 만들지 않고 로그인하지 않은 상태로 둘러봅니다.',
  fo10: '알리페이 채널에서는 자체 로그인 경로를 숨깁니다. 점선 박스가 웹 채널에는 있고 알리페이 채널에는 없는 자리입니다.',
  fo11: '프로필 제공 동의 여부에 따라 내 정보가 달라집니다. 비밀번호가 없는 계정이라 비밀번호 변경이 없고, 웹 계정과 별개라는 안내를 예약 내역 위에 둡니다.',
  fo12: '마이페이지의 기존 탈퇴 경로를 그대로 씁니다. 알리페이 연결도 함께 끊기고 다시 들어오면 새 회원이 됩니다.',
  fo13: '이메일은 예약 필수 항목인데 알리페이 회원은 회원 정보에 값이 없어 입력칸이 뜹니다. 프로필 제공에 동의했으면 국적·성별·생년월일이 채워집니다. 여권 영문명은 채우지 않습니다.',
  bo11: '어드민 회원 메뉴의 정보조회 화면입니다. 회원 상세 화면은 없습니다. 주황색이 이번에 늘어나는 자리입니다. 가입 경로 필터와 알리페이 정보 칼럼 그룹이 신설입니다.'
};

/* ── 유틸 ── */
function h(s) { return s == null ? '' : String(s); }
function dash(v) { return v ? h(v) : '<span class="dash">-</span>'; }
function go(v) { S.view = v; render(); }

/* ────────────────────────────────────────────────
   FO-CH-09 진입 동의 창
   ──────────────────────────────────────────────── */
function fo09() {
  var ready = S.agTerms && S.agPriv;
  var rows = [
    ['agTerms', '이용 약관', true],
    ['agPriv', '개인정보 처리방침', true]
  ];
  if (S.permit) rows.push(['agProf', '알리페이 프로필 제공', false, '이름, 성별, 생년월일, 국적을 가져옵니다.']);
  rows.push(['agAd', '광고성 정보 수신', false]);

  var body = rows.map(function (r) {
    return '<label class="ck">' +
      '<input type="checkbox" ' + (S[r[0]] ? 'checked' : '') + ' onchange="S.' + r[0] + '=this.checked;render()">' +
      '<span class="tt">' + r[1] + ' ' +
      (r[2] ? '<span class="rq">필수</span>' : '<span class="op">선택</span>') +
      (r[3] ? '<div class="sub">' + r[3] + '</div>' : '') + '</span>' +
      '<span class="vw">보기</span></label>';
  }).join('');

  var inner = S.joined
    ? '<div class="sec"><div class="h">동의가 끝났습니다</div>' +
      '<div class="box"><div class="sub">회원이 만들어지고 로그인되었습니다. 다음 진입부터는 이 창이 뜨지 않습니다.</div></div></div>' +
      '<div class="cta ghost" onclick="go(\'fo11\')">마이페이지 보기</div>'
    : '';

  return phone('K-Beauty Station', inner,
    '<div class="dim"><div class="mdl">' +
      '<h3>시작하기 전에 동의가 필요합니다</h3>' +
      '<p class="d">알리페이 계정으로 바로 이용하실 수 있습니다. 따로 가입하실 필요는 없습니다.</p>' +
      body +
      (S.permit ? '' : '<p class="d" style="margin-top:12px">프로필 제공 항목은 조회 권한이 열리기 전까지 표시하지 않습니다.</p>') +
      '<div class="cta ' + (ready ? '' : 'dis') + '" ' + (ready ? 'onclick="S.joined=true;render()"' : '') + '>동의하고 시작하기</div>' +
      '<div class="esc" onclick="S.joined=false;go(\'fo10\')">닫기 (회원을 만들지 않고 둘러보기)</div>' +
    '</div></div>', 'K-Beauty Station', true);
}

/* ────────────────────────────────────────────────
   FO-CH-10 로그인 영역 정리
   ──────────────────────────────────────────────── */
function fo10() {
  return phone('마이페이지',
    '<div class="gone">알리페이 채널에서는 이 자리가 없습니다<br>로그인 / 회원가입</div>' +
    '<div class="gone">알리페이 채널에서는 이 자리가 없습니다<br>카카오·구글·라인으로 계속하기</div>' +
    '<div class="gone">알리페이 채널에서는 이 자리가 없습니다<br>비밀번호를 잊으셨나요?</div>' +
    '<div class="note">알리페이 식별이 로그인을 대신합니다. 숨김이지 차단이 아니라서 로그인 주소로 직접 들어오면 마이페이지로 보냅니다.</div>' +
    (S.joined
      ? '<div class="sec"><div class="box"><div class="nm">' + (S.agProf ? ALI.name : '회원 ' + '10241') + '</div>' +
        '<div class="sub">알리페이 계정으로 이용 중입니다.</div></div></div>'
      : '<div class="sec"><div class="box"><div class="nm">로그인하지 않은 상태</div>' +
        '<div class="sub">둘러보기는 그대로 됩니다. 예약처럼 회원이 필요한 자리에서 동의 창을 다시 띄웁니다.</div>' +
        '</div></div><div class="cta" onclick="go(\'fo09\')">예약하기 (동의 창 다시 띄우기)</div>'));
}

/* ────────────────────────────────────────────────
   FO-CH-11 마이페이지
   ──────────────────────────────────────────────── */
function fo11() {
  var prof = S.agProf
    ? '<div class="nm">' + ALI.name + '</div><div class="sub">' + ALI.sex + '<br>' + ALI.birth + '<br>' + ALI.nation + '</div>'
    : '<div class="nm">회원 10241</div><div class="sub">프로필 제공에 동의하지 않아 이름과 국적이 비어 있습니다.</div>' +
      '<div class="cta ghost" style="margin:12px 0 0" onclick="S.agProf=true;render()">알리페이에서 불러오기</div>';

  var mail = '<div class="fld"><div class="l">이메일</div>' +
    '<div class="in ' + (S.email ? '' : 'ph') + '">' + (S.email || '예약 확인을 받을 이메일') + '</div></div>';

  var rows = ['예약 내역', '채팅', '언어 설정', '이용 약관', '개인정보 처리방침']
    .map(function (t) { return '<div class="mrow"><span>' + t + '</span><span class="a">›</span></div>'; }).join('') +
    '<div class="mrow" onclick="go(\'fo12\')" style="cursor:pointer"><span>회원 탈퇴</span><span class="a">›</span></div>';

  return phone('마이페이지',
    '<div class="sec"><div class="h">내 정보</div><div class="box">' + prof + mail + '</div></div>' +
    '<div class="note">알리페이 계정으로 이용 중입니다. 웹에서 만든 계정과는 별개라 그쪽 예약 내역은 보이지 않습니다.</div>' +
    '<div class="gone">알리페이 채널에서는 이 자리가 없습니다<br>비밀번호 변경</div>' +
    '<div class="sec">' + rows + '</div>');
}

/* ────────────────────────────────────────────────
   FO-CH-12 회원 탈퇴
   ──────────────────────────────────────────────── */
function fo12() {
  return phone('회원 탈퇴',
    '<div class="sec"><div class="h">탈퇴하면 이렇게 됩니다</div>' +
    '<div class="box"><div class="sub" style="margin-top:0">' +
    '· 알리페이 계정과의 연결이 끊깁니다.<br>' +
    '· 예약 내역과 채팅 기록을 볼 수 없습니다.<br>' +
    '· 다시 들어오면 같은 알리페이 계정이라도 새 회원으로 시작합니다.<br>' +
    '· 알리페이 앱 쪽 계정에는 아무 영향이 없습니다.' +
    '</div></div></div>' +
    '<div class="note">보관과 파기는 개인정보처리방침을 따릅니다.</div>' +
    '<div class="cta" onclick="resetDB();S.view=\'fo09\';render()">탈퇴하기</div>' +
    '<div class="cta ghost" onclick="go(\'fo11\')">돌아가기</div>', '', '‹');
}

/* ────────────────────────────────────────────────
   FO-CH-13 예약 입력
   ──────────────────────────────────────────────── */
function fo13() {
  function fld(label, val, opt) {
    opt = opt || {};
    var cls = opt.auto ? 'in auto' : (val ? 'in' : 'in ph');
    return '<div class="fld"><div class="l">' + label +
      (opt.auto ? '<span class="autotag">회원 정보에서 채움</span>' : '') + '</div>' +
      '<div class="' + cls + '">' + (val || opt.ph) + '</div></div>';
  }
  var auto = S.agProf;
  return phone('예약하기',
    '<div class="sec"><div class="h">예약자 정보</div><div class="box">' +
    fld('여권 영문명', '', { ph: '여권에 적힌 영문 이름' }) +
    fld('국적', auto ? ALI.nation : '', { auto: auto, ph: '국적 선택' }) +
    fld('성별', auto ? ALI.sex : '', { auto: auto, ph: '성별 선택' }) +
    fld('생년월일', auto ? ALI.birth : '', { auto: auto, ph: '생년월일 선택' }) +
    fld('이메일', S.email, { ph: '예약 확인을 받을 이메일' }) +
    fld('휴대폰 번호', '', { ph: '문자 인증이 필요합니다' }) +
    fld('연락 메신저', '', { ph: '위챗 아이디' }) +
    '</div></div>' +
    '<div class="note">' + (auto
      ? '프로필 제공에 동의해 국적·성별·생년월일이 채워졌습니다. 이용자가 고칠 수 있습니다.'
      : '프로필 제공을 거부해 전부 직접 입력합니다.') +
