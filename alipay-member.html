  var head = '<tr><th>회원번호</th><th>가입일</th>' + (BOQ ? '<th>탈퇴일</th>' : '') + '<th>마지막 로그인</th><th>알리페이 식별자</th><th class="c">월렛</th>' +
    '<th>닉네임</th><th>이름</th><th>성별</th><th>생년월일</th><th>국적</th><th>주소</th><th>언어</th><th>연락처</th><th>여권명</th><th class="c">예약</th><th class="c">노쇼</th><th>프로필 동의 일자</th><th class="c">마케팅 수신 동의</th><th>마케팅 동의 일자</th></tr>';
  var rows = list.map(function (m) {
    return '<tr><td class="mono">' + m.no + (m.self ? ' <span class="pill ali">보는 중</span>' : '') + '</td><td>' + m.join + '</td>' + (BOQ ? '<td>' + dash(m.quit) + '</td>' : '') +
      '<td>' + dash(m.last) + '</td><td class="mono">' + m.aid + '</td><td class="c">' + (m.wallet === 'CN' ? '알리페이 중국' : '알리페이 홍콩') + '</td>' +
      '<td>' + dash(m.nick) + '</td><td>' + dash(m.name) + '</td><td>' + dash(m.sex) + '</td><td>' + dash(m.birth) + '</td><td>' + dash(m.nat) + '</td><td>' + dash(m.addr) + '</td><td>' + dash(m.lang) + '</td><td>' + dash(m.tel) + '</td><td>' + dash(m.pp) + '</td>' +
      '<td class="c">' + m.bk + '</td><td class="c">' + m.ns + '</td><td>' + dash(m.profd) + '</td><td class="c"><span class="pill ' + (m.mkt === '동의' ? 'yes' : 'no') + '">' + m.mkt + '</span></td><td>' + dash(m.mktd) + '</td></tr>';
  }).join('');
  var sel = function (cur, opts, fn) { return '<select class="sel new" onchange="' + fn + '=this.value;render()">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>'; };
  return '<div class="adm"><div class="phd"><h2>알리페이 회원</h2><div class="pdesc">알리페이 계정으로 만들어진 회원입니다. 기존 회원과 별개로 관리합니다.</div></div>' +
    '<div class="filt"><select class="sel"><option>가입 기간</option></select><input class="inp" placeholder="가입 시작일" style="width:110px"><input class="inp" placeholder="가입 종료일" style="width:110px"><select class="sel"><option>미탈퇴</option></select>' +
    sel(BOW, [['all', '월렛 (전체)'], ['CN', '알리페이 중국'], ['HK', '알리페이 홍콩']], 'BOW') + '<input class="inp" placeholder="검색어" style="width:150px"><button class="btn blue">검색</button></div>' +
    '<div class="card"><div class="hd"><span>회원 목록</span><span class="grpbtn"><span class="g' + (BOQ ? ' on' : '') + '" onclick="BOQ=!BOQ;render()">탈퇴정보</span></span></div>' +
    '<div class="tblwrap"><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="foot">검색어는 알리페이 식별자, 닉네임, 이름, 연락처를 봅니다. 식별자는 완전 일치로 찾습니다. 빈 값은 알리페이 계정에 값이 없던 항목입니다.</div></div></div>';
}

function phone(title, body, overlay, leftIcon, noMenu) {
  return '<div class="phones"><div class="ph"><div class="st"><span>9:41</span><span>●●●</span></div>' +
    '<div class="hd"><span class="i">' + (leftIcon === '‹' ? '‹' : '☰') + '</span><span class="t">' + title + '</span><span class="i">' + (noMenu ? '' : '⚙') + '</span></div>' +
    '<div class="bd">' + (body || '') + '</div>' + (overlay || '') + '</div></div>';
}

function render() {
  document.getElementById('tabs').innerHTML = VIEWS.map(function (v) { return '<div class="tab' + (S.view === v[0] ? ' on' : '') + '" onclick="go(\'' + v[0] + '\')">' + v[1] + '</div>'; }).join('');
  document.getElementById('state').innerHTML =
    '<b>지금 상태</b>' +
    '<span class="kv">회원 <em>' + (S.joined ? '생성됨' : '아직 아님') + '</em></span>' +
    '<span class="kv">필수 셋 <em>' + (S.agTerms && S.agPriv && S.agProf ? '동의' : '미동의') + '</em></span>' +
    '<span class="kv">알림 수신 <em>' + (S.joined ? (S.notifGranted ? '허용' : '거부') : (S.agNotif ? '체크' : '미체크')) + '</em></span>' +
    '<span class="kv">마케팅 <em>' + (S.agMkt ? '동의' : '거부') + '</em></span>' +
    '<span class="kv">원본 휴대폰 권한 <em>' + (S.plaintext ? '승인' : '미승인') + '</em></span>' +
    '<span class="kv">월렛 <em>' + (S.wallet === 'CN' ? '중국' : '홍콩') + '</em></span>' +
    '<button onclick="S.plaintext=!S.plaintext;if(S.joined){S.tel=S.plaintext?ALI.phone:\'\';S.telVerified=S.plaintext;S.telEdited=false;}render()">원본 권한 ' + (S.plaintext ? '미승인으로' : '승인으로') + '</button>' +
    '<button onclick="S.wallet=(S.wallet===\'CN\'?\'HK\':\'CN\');render()">월렛 바꾸기</button>' +
    '<button onclick="S.blocked=\'fail\';S.step=\'blocked\';S.view=\'fo08\';render()">식별 실패</button>' +
    '<button onclick="S.blocked=\'prof\';S.step=\'blocked\';S.view=\'fo08\';render()">프로필 거부</button>' +
    '<button onclick="S.blocked=\'consent\';S.step=\'blocked\';S.view=\'fo08\';render()">동의 거부</button>' +
    '<button onclick="var pt=S.plaintext;resetDB();S.plaintext=pt;render()">처음으로</button>';
  document.getElementById('cap').textContent = CAPS[S.view] || '';
  var m = { fo09: fo09, fo08: fo08, fo10: fo10, fo11: fo11, fo12: fo12, fo13: fo13, bo11: bo11 };
  document.getElementById('stage').innerHTML = m[S.view]();
}
render();
</script>
</body>
</html>
