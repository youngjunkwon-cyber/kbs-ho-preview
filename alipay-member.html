<script>
/* 상태. 한 사람의 알리페이 회원 한 명을 따라간다 */
var S;
var GEN = 0;   // 탈퇴 뒤 다시 들어온 횟수. 다시 들어오면 회원번호·가입일이 새로 매겨진다
/* 시안 시각. 회원이 새로 만들어질 때마다 한 시간 뒤로 민다 (off = 가입 시각에서 몇 분 뒤) */
function clk(off) { var t = 542 + GEN * 60 + (off || 0); return '2026-09-15 ' + ('0' + Math.floor(t / 60)).slice(-2) + ':' + ('0' + t % 60).slice(-2); }
/* keepRows: 탈퇴 때만 true. 탈퇴로 남긴 회원 행과 다시 들어온 횟수를 지우지 않는다 */
function resetDB(keepRows) {
  if (!keepRows) { GEN = 0; if (MEM) MEM = MEM.filter(function (m) { return !m.snap; }); }
  BOW = 'all'; BOQ = false; BOQF = 'in'; BOM = true; BOMF = 'all';
  S = {
    joined: false,        // 회원 생성
    agTerms: false, agPriv: false, agProf: false,   // 필수 셋
    agMkt: false,                   // 선택 둘
    open: {},
    step: 'consent',      // consent(우리 창) → perm(알리페이 권한 창) → age(생년월일 없는 회원만, 만 14세 확인 창) → done | blocked
    blocked: '',          // '' | consent | prof | fail
    plaintext: true,      // 알리페이가 원본 휴대폰 권한을 승인해 준 상태인가 (담당 확인 결과에 따라 갈린다)
    phoneGranted: true,   // 알리페이 권한 창의 휴대폰 번호 원본 (승인된 동안 필수, 거부하면 차단)
    wallet: 'CN',
    tel: '', telVerified: false, telEdited: false, telSrc: '',
    mtel: '', mtelSrc: '', mtelSaved: false, mtelDraft: '',   // 회원 정보에 저장된 인증 번호와 마이페이지 수정 중 번호
    passport: '', passportSaved: '', msg: '',
    userSet: {},          // 예약 입력 화면에서 이용자가 직접 넣은 칸
    birthMode: 'adult',   // adult(생년월일 있음, 만 14세 이상) | none(생년월일 없음) | minor(생년월일로 만 14세 미만)
    agAge: false,         // 만 14세 확인 창의 만 14세 이상입니다 (생년월일 없는 회원만)
    contactGranted: true, // 알리페이 권한 창의 연락처 (필수 권한)
    toast: '',
    booked: 0,            // 이 시안에서 보낸 예약 요청 수 (알리페이 회원 목록의 예약 칸)
    prof: null,           // 회원 정보에 저장된 프로필 (수정 가능)
    sub: 'home',          // 마이페이지 안의 화면: home(마이페이지) | acct(계정 설정)
    draft: null,          // 계정 설정에서 편집 중인 값(저장을 눌러야 회원 정보에 들어간다)
    mktDate: '',          // 마케팅 정보 수신 동의·변경 시각
    rmsg: '',             // 예약 입력 화면의 연락 메신저 (회원 정보에서 채우지 않는다)
    done13: false,        // 예약 요청을 보낸 뒤 (현행 예약 완료 화면 자리)
    agreed: false,        // 동의 창에서 동의하고 시작하기를 누른 뒤인가 (식별 실패의 다시 시도가 권한 창부터 띄운다)
    noNick: false,        // 알리페이 계정에 닉네임이 없는 경우 (마이페이지 닉네임 자리에 알리페이 회원)
    minor13: '',          // 예약 입력에서 고른 만 14세 미만 생년월일 (회원 정보에 저장하지 않는다)
    f13: 'book',          // FO-CH-13 화면: book(예약 입력) | consult(상담접수 폼)
    cd: null,             // 상담접수 폼에서 편집 중인 값
    doneC: false,         // 상담접수를 보낸 뒤 (현행 접수 완료 화면 자리)
    view: 'fo09'
  };
}
resetDB();

var TERMS_FULL = [

    '<span class="kv">원본 휴대폰 권한 <em>' + (S.plaintext ? '승인' : '미승인') + '</em></span>' +
    '<span class="kv">들어온 앱 <em>' + (S.wallet === 'CN' ? '알리페이 중국' : '알리페이 홍콩') + '</em></span>' +
    '<span class="kv">생년월일 <em>' + ({ adult: '있음', none: '없음', minor: '만 14세 미만' })[S.birthMode] + '</em></span>' +
    '<span class="kv">닉네임 <em>' + (S.noNick ? '없음' : '있음') + '</em></span>' +
    '<button' + (S.joined ? ' disabled' : '') + ' onclick="S.plaintext=!S.plaintext;if(S.joined){S.tel=S.plaintext?ALI.phone:\'\';S.telVerified=S.plaintext;S.telEdited=false;S.telSrc=S.plaintext?\'ali\':\'\';S.mtel=S.tel;S.mtelSrc=S.telSrc;S.mtelDraft=\'\';S.mtelSaved=false;S.telSaved=false;}render()">원본 휴대폰 ' + (S.plaintext ? '미승인으로' : '승인으로') + '</button>' +
    '<button' + (S.joined ? ' disabled' : '') + ' onclick="S.wallet=(S.wallet===\'CN\'?\'HK\':\'CN\');render()">' + (S.wallet === 'CN' ? '홍콩 앱으로 들어온 경우 보기' : '중국 앱으로 들어온 경우 보기') + '</button>' +
    '<button onclick="if(!S.joined){S.birthMode=({adult:\'none\',none:\'minor\',minor:\'adult\'})[S.birthMode];S.agAge=false;if(S.step===\'age\')S.step=\'perm\';}render()"' + (S.joined ? ' disabled' : '') + '>생년월일 바꾸기</button>' +
    '<button onclick="if(!S.joined){S.noNick=!S.noNick;}render()"' + (S.joined ? ' disabled' : '') + '>' + (S.noNick ? '닉네임 채우기' : '닉네임 비우기') + '</button>' +
    '<button onclick="S.blocked=\'fail\';S.step=\'blocked\';S.view=\'fo08\';render()"' + (S.joined ? ' disabled' : '') + '>식별 실패</button>' +
    '<button onclick="S.agTerms=true;S.agPriv=true;S.agProf=true;S.agreed=true;S.blocked=\'prof\';S.step=\'blocked\';S.view=\'fo08\';render()"' + (S.joined ? ' disabled' : '') + '>프로필 거부</button>' +
    '<button onclick="S.agTerms=false;S.agPriv=false;S.agProf=false;S.agreed=false;S.blocked=\'consent\';S.step=\'blocked\';S.view=\'fo08\';render()"' + (S.joined ? ' disabled' : '') + '>동의 창 닫기</button>' +
    '<button onclick="S.birthMode=\'minor\';S.agAge=false;S.blocked=\'minor\';S.step=\'blocked\';S.view=\'fo08\';render()"' + (S.joined ? ' disabled' : '') + '>만 14세 미만</button>' +
    (S.view === 'fo13' ? '<span class="kv">FO-CH-13 화면 <em>' + (S.f13 === 'consult' ? '상담접수 폼' : '예약 입력') + '</em></span>' +
      '<button onclick="setF13(S.f13===\'consult\'?\'book\':\'consult\')">' + (S.f13 === 'consult' ? '예약 입력 보기' : '상담접수 폼 보기') + '</button>' : '') +
    '<button onclick="var pt=S.plaintext;var bm=S.birthMode;var w=S.wallet;var nn=S.noNick;resetDB();S.plaintext=pt;S.birthMode=bm;S.wallet=w;S.noNick=nn;render()">처음으로</button>';
  document.getElementById('cap').textContent = CAPS[S.view] || '';
  var m = { fo09: fo09, fo08: fo08, fo10: fo10, fo11: fo11, fo12: fo12, fo13: fo13, bo11: bo11 };
  var st = document.getElementById('stage'), key = [S.view, S.sub, S.done13, S.step, S.blocked, S.f13, S.doneC].join('/'), keep = {}, sels = ['.ph .bd', '.mdl', '.tblwrap'], FQ = 'input,select,textarea';
  sels.forEach(function (q) { var e = st.querySelector(q); if (e) keep[q] = [e.scrollTop, e.scrollLeft]; });
  var ae = document.activeElement, fi = (ae && st.contains(ae)) ? [].indexOf.call(st.querySelectorAll(FQ), ae) : -1;
  st.innerHTML = m[S.view]();
  if (key === LASTKEY) {
    sels.forEach(function (q) { var e = st.querySelector(q); if (e && keep[q]) { e.scrollTop = keep[q][0]; e.scrollLeft = keep[q][1]; } });
    if (fi >= 0) { var fe = st.querySelectorAll(FQ)[fi]; if (fe) fe.focus(); }
  }
  LASTKEY = key;
}
render();
</script>
</body>
</html>
