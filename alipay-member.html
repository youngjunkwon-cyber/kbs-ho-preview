   ──────────────────────────────────────────────── */
function phone(title, body, overlay, leftIcon, noMenu) {
  return '<div class="phones"><div class="ph">' +
    '<div class="st"><span>9:41</span><span>●●●</span></div>' +
    '<div class="hd"><span class="i">' + (leftIcon === '‹' ? '‹' : '☰') + '</span>' +
      '<span class="t">' + title + '</span><span class="i">' + (noMenu ? '' : '⚙') + '</span></div>' +
    '<div class="bd">' + (body || '') + '</div>' +
    (overlay || '') +
  '</div></div>';
}

/* ────────────────────────────────────────────────
   렌더
   ──────────────────────────────────────────────── */
function render() {
  document.getElementById('tabs').innerHTML = VIEWS.map(function (v) {
    return '<div class="tab' + (S.view === v[0] ? ' on' : '') + '" onclick="go(\'' + v[0] + '\')">' + v[1] + '</div>';
  }).join('');

  document.getElementById('state').innerHTML =
    '<b>지금 상태</b>' +
    '<span class="kv">회원 <em>' + (S.joined ? '생성됨' : '아직 아님') + '</em></span>' +
    '<span class="kv">약관·처리방침 <em>' + (S.agTerms && S.agPriv ? '동의' : '미동의') + '</em></span>' +
    '<span class="kv">프로필 제공 <em>' + (S.agProf ? '동의' : '거부') + '</em></span>' +
    '<span class="kv">마케팅 수신 <em>' + (S.agMkt ? '동의' : '거부') + '</em></span>' +
    '<span class="kv">이메일 <em>' + (S.email || '없음') + '' + '</em></span>' +
    '<span class="kv">월렛 <em>' + (S.wallet === 'CN' ? '중국' : '홍콩') + '</em></span>' +
    '<button onclick="S.wallet=(S.wallet===\'CN\'?\'HK\':\'CN\');render()">월렛 바꾸기</button>' +
    '<button onclick="S.permit=!S.permit;render()">조회 권한 ' + (S.permit ? '끄기' : '켜기') + '</button>' +
    '<button onclick="resetDB();render()">처음으로</button>';

  document.getElementById('cap').textContent = CAPS[S.view] || '';

  var m = { fo09: fo09, fo10: fo10, fo11: fo11, fo12: fo12, fo13: fo13, bo11: bo11 };
  document.getElementById('stage').innerHTML = m[S.view]();
}
render();
</script>
</body>
</html>
