<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영시간 설정 시안 (로직 확인용)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;color:#333;background:#f5f5f5}
button,input,select{font-family:inherit;font-size:13px}
.ctl{position:sticky;top:0;z-index:50;background:#1f1f1f;color:#ddd;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
.ctl .t{font-weight:600;color:#fff;margin-right:4px}
.ctl .g{display:flex;gap:4px;align-items:center;padding:0 6px;border-left:1px solid #444}

.ctl .b.on{background:#1677ff;border-color:#1677ff;color:#fff}
.ctl input{padding:3px 6px;border:1px solid #666;background:#2b2b2b;color:#fff;border-radius:4px}

.app{display:flex;min-height:calc(100vh - 44px)}
.sb{width:180px;flex:0 0 180px;background:#fff;border-right:2px solid #e8537a;padding:14px 0}
.sb .logo{color:#e8537a;font-weight:700;font-size:14px;padding:4px 16px 16px}
.sb .m{padding:8px 16px;color:#333;font-size:12px}
.sb .m.on{color:#e8537a;background:#fbf0f3}

.main{flex:1;min-width:0;padding:22px 24px;display:flex;gap:20px;align-items:flex-start}
.col{flex:1;min-width:0}
h1{font-size:18px;margin:0 0 2px}
.sub{color:#7a7a7a;font-size:12px;margin:0 0 14px}
.anch{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e8e8e8;margin-bottom:16px;padding-bottom:0}
.anch .tab{padding:8px 2px;font-size:12px;color:#8c8c8c;border-bottom:2px solid transparent}

.pri{background:#1677ff;color:#fff;border:0;border-radius:6px;padding:7px 18px;cursor:pointer}

.sec{background:#fff;color:#444;border:1px solid #d9d9d9;border-radius:6px;padding:6px 14px;cursor:pointer}

.hint{color:#8c8c8c;font-size:12px;margin:4px 0 10px}
.row{display:flex;align-items:flex-start;gap:12px;padding:6px 0}
.row .lb{width:64px;flex:0 0 64px;padding-top:8px;color:#333}
.row .lb.off{color:#bfbfbf}
.row .body{flex:1;min-width:0}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pk{display:inline-flex;align-items:center;gap:6px;border:1px solid #d9d9d9;border-radius:6px;padding:0 8px;height:34px;background:#fff}
.pk.err{border-color:#ff4d4f}
.pk input[type=time]{border:0;outline:0;width:84px;background:transparent;color:#333}
.pk input[type=time]:disabled{color:#bfbfbf}
.pk .ar{color:#8c8c8c}
.badge{font-size:11px;color:#8c8c8c;border:1px solid #e5e5e5;border-radius:4px;padding:1px 6px}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.sel{height:34px;border:1px solid #d9d9d9;border-radius:6px;padding:0 8px;background:#fff;color:#333}
.brk{color:#8c8c8c;font-size:12px}
.x{border:0;background:none;color:#8c8c8c;cursor:pointer;font-size:14px;padding:0 4px}
.add{border:1px solid #d9d9d9;background:#fff;border-radius:6px;padding:0 10px;height:30px;cursor:pointer;color:#444;font-size:12px}
.msg{color:#ff4d4f;font-size:12px;margin:4px 0 0 2px}
.ex{color:#8c8c8c;font-size:12px;margin:4px 0 0 2px}
.zone{margin-top:22px}
.zone h3{font-size:14px;margin:0 0 4px}
.zone .zs{color:#8c8c8c;font-size:12px;margin:0 0 10px}
.zone h4{font-size:12px;color:#8c8c8c;font-weight:500;margin:12px 0 6px}
.empty{color:#bfbfbf;font-size:12px;margin:6px 0}
.rule{border:1px solid #f0f0f0;border-radius:6px;padding:10px 12px;margin-bottom:8px}
.chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid #d9d9d9;border-radius:14px;padding:3px 10px;background:#fff;cursor:pointer;font-size:12px;color:#333}
.chip.on{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid #d9d9d9;border-radius:14px;padding:3px 6px 3px 10px;font-size:12px;background:#fff;margin:0 6px 6px 0}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;align-items:center;gap:6px;cursor:pointer}
.form{border:1px solid #f0f0f0;border-radius:6px;padding:12px;margin:8px 0;background:#fafafa}
.form .fr{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.form .fl{width:56px;color:#8c8c8c;font-size:12px}
.form input[type=date],.form input[type=number]{height:32px;border:1px solid #d9d9d9;border-radius:6px;padding:0 8px}
.form .fb{display:flex;gap:8px;justify-content:flex-end}
.list{max-height:300px;overflow:auto;border-top:1px solid #f0f0f0}
.mh{font-size:12px;color:#8c8c8c;padding:10px 0 4px}
.sr{display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.sr .d{width:150px}
.sr .v{flex:1}
.side{width:420px;flex:0 0 420px;display:flex;flex-direction:column;gap:14px}
.pv{background:#fff;border:1px solid #efefef;border-radius:8px;padding:14px 16px}
.pv h3{font-size:12px;color:#8c8c8c;margin:0 0 10px;font-weight:500;display:flex;align-items:center}
.pv h3 .sp{flex:1}
.fo{border:1px solid #eee;border-radius:8px;padding:14px;width:375px;font-family:"Noto Sans KR",sans-serif}
.fo .ttl{font-size:13px;color:#333;margin-bottom:8px}
.fo .stat{font-size:19px;font-weight:700;color:#111}
.fo .aux{font-size:14px;color:#777;margin-top:2px}
.fo .spc{margin:10px 0;border:1px solid #eee;background:#fafafa;border-radius:6px;padding:8px 10px;font-size:13px}
.fo .tg{margin-top:10px;background:none;border:0;color:#555;cursor:pointer;padding:0;font-size:13px}
.fo table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.fo td{padding:4px 0;vertical-align:top}
.fo td:first-child{width:64px;color:#555}
.fo .bk{color:#888;font-size:12px}
.fo .rs{font-size:12px;color:#888;margin-top:8px;line-height:1.7}
.fo .none{color:#bbb;font-size:12px}
.bot{white-space:pre-wrap;line-height:1.7;font-size:13px;background:#fafafa;border-radius:6px;padding:10px 12px}
.bk-panel .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.warn{background:#fff7e6;border:1px solid #ffe7b8;color:#d46b08;border-radius:4px;padding:3px 8px;font-size:12px}
.bk-panel .sync{font-size:12px;color:#8c8c8c}
.bk-list{font-size:12px;color:#555;line-height:1.7}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100}
.mdl{background:#fff;border-radius:10px;width:480px;padding:22px 24px;position:relative}
.mdl .mx{position:absolute;right:14px;top:12px;border:0;background:none;font-size:16px;color:#8c8c8c;cursor:pointer}
.mdl h2{font-size:16px;margin:0 0 4px}
.mdl .ms{color:#7a7a7a;font-size:13px;margin:0 0 14px}
.mdl .mb{font-size:13px;line-height:1.7;margin-bottom:18px}
.mdl .mb b{display:block}
.mdl .mf{display:flex;justify-content:flex-end;gap:8px}
.mdl .mf .sec{border-color:#1677ff;color:#1677ff}
.host .mdl .mf .sec{border-color:#e8537a;color:#e8537a}
.host .mdl .pri{background:#e8537a}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1f1f1f;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:200;display:none}
</style>
</head>
<body>
<div class="ctl">
  <span class="t">로직 확인 시안</span>
  <div class="g"><span class="st">지금</span><input type="datetime-local" id="nowIn" step="300"></div>
  <div class="g"><span class="st">시드</span>
    <button class="b" data-seed="empty">최초 진입</button>
    <button class="b" data-seed="same">모든 요일 같아요</button>
    <button class="b" data-seed="wk">평일·주말</button>
    <button class="b on" data-seed="day">요일마다</button>
    <button class="b" data-seed="monthly">매월·특정 날짜</button>
  </div>
  <div class="g"><span class="st">화면</span><button class="b on" data-chrome="BO">BO</button><button class="b" data-chrome="HOST">HOST</button></div>
  <div class="g"><span class="st" id="savedAt"></span></div>
</div>

<div class="app" id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 공휴일 (샘플 달력. 실제 서비스는 공공데이터포털 특일정보) ===================== */
/* 공휴일 칩 정의(네이버 구조 차용). 대체공휴일은 원 공휴일 칩을 따라간다. 임시공휴일은 달력에 지정되면 칩이 생긴다 */
var HOLIDEF = [['newyear','새해 첫날'],['seol-1','설날 전날'],['seol','설날'],['seol+1','설날 다음날'],['samil','삼일절'],['child','어린이날'],
 ['buddha','부처님 오신 날'],['memorial','현충일'],['liberation','광복절'],['chu-1','추석 전날'],['chu','추석'],['chu+1','추석 다음날'],
 ['foundation','개천절'],['hangul','한글날'],['xmas','성탄절']];
var HOLI = {
 '2026-01-01':'newyear','2026-02-16':'seol-1','2026-02-17':'seol','2026-02-18':'seol+1','2026-03-01':'samil','2026-03-02':'samil',
 '2026-05-05':'child','2026-05-24':'buddha','2026-05-25':'buddha','2026-06-03':'temp:지방선거일','2026-06-06':'memorial',
 '2026-08-15':'liberation','2026-08-17':'liberation','2026-09-24':'chu-1','2026-09-25':'chu','2026-09-26':'chu+1','2026-10-03':'foundation',
 '2026-10-05':'foundation','2026-10-09':'hangul','2026-12-25':'xmas',
 '2027-01-01':'newyear','2027-02-06':'seol-1','2027-02-07':'seol','2027-02-08':'seol+1','2027-02-09':'seol+1','2027-03-01':'samil',
 '2027-05-05':'child','2027-05-13':'buddha','2027-06-06':'memorial','2027-08-15':'liberation','2027-08-16':'liberation',
 '2027-09-14':'chu-1','2027-09-15':'chu','2027-09-16':'chu+1','2027-10-03':'foundation','2027-10-04':'foundation','2027-10-09':'hangul',
 '2027-10-11':'hangul','2027-12-25':'xmas'
};
function holiLabel(key){ if(key.indexOf('temp:')===0) return key.slice(5); var d=HOLIDEF.find(function(x){return x[0]===key;}); return d?d[1]:key; }
function tempKeys(){ var s={}; Object.keys(HOLI).forEach(function(ds){ if(HOLI[ds].indexOf('temp:')===0) s[HOLI[ds]]=1; }); return Object.keys(s); }
function allHoliKeys(){ return HOLIDEF.map(function(x){return x[0];}).concat(tempKeys()); }
function holiClosed(ds){ var k=HOLI[ds]; if(!k) return false; return S.holi.keys.indexOf(k)>=0; }
function holiGroupLabel(){ /* FO 규칙 문장용: 설날 전날/당일/다음날 → 설날 연휴 */
 var ks=S.holi.keys, out=[];
 var seol=['seol-1','seol','seol+1'].filter(function(k){return ks.indexOf(k)>=0;}), chu=['chu-1','chu','chu+1'].filter(function(k){return ks.indexOf(k)>=0;});
 HOLIDEF.forEach(function(x){ var k=x[0]; if(ks.indexOf(k)<0) return;
  if(k.indexOf('seol')===0){ if(k==='seol'||seol.length===1) out.push(seol.length>=2?'설날 연휴':x[1]); return; }
  if(k.indexOf('chu')===0){ if(k==='chu'||chu.length===1) out.push(chu.length>=2?'추석 연휴':x[1]); return; }
  out.push(x[1]); });
 tempKeys().forEach(function(k){ if(ks.indexOf(k)>=0) out.push(holiLabel(k)); });
 return out.filter(function(v,i,a){return a.indexOf(v)===i;});
}
function upcomingHoliRange(){ /* 14일 이내 가장 가까운 공휴일 휴무. 연속된 날은 묶는다 */
 var n=nowDate(), t=todayStr(), lim=ymd(addDays(n,14));
 var days=Object.keys(HOLI).filter(function(ds){return ds>=t&&ds<=lim&&holiClosed(ds);}).sort();
 if(!days.length) return null;
 var a=days[0], b=a; for(var i=1;i<days.length;i++){ if(days[i]===ymd(addDays(parseD(b),1))) b=days[i]; else break; }
 return {from:a,to:b===a?null:b,closed:true};
}
var WD = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
var WDS = ['일','월','화','수','목','금','토'];
var NTH = {1:'첫 번째',2:'두 번째',3:'세 번째',4:'네 번째',last:'마지막'};
/* 예약 샘플(확정 예약). 밀려나는 건수 계산용 */
var BOOKINGS = [
 {at:'2026-09-12T01:00'}, {at:'2026-09-12T19:30'}, {at:'2026-09-15T11:00'}, {at:'2026-09-17T12:00'}, {at:'2026-09-22T15:00'}, {at:'2026-09-08T11:00'}
];

/* ===================== 상태 ===================== */
var S, UI;
function blankRow(){ return {open:'',close:'',closed:false,period:'weekly',week:'1,3',breaks:[],_keep:null}; }
function base(){
 return { mode:null, rows:{same:blankRow(),wd:blankRow(),we:blankRow(),d0:blankRow(),d1:blankRow(),d2:blankRow(),d3:blankRow(),d4:blankRow(),d5:blankRow(),d6:blankRow()},
  rules:[], holi:{keys:[]}, monthly:[], specials:[], saved:null, synced:true, now:'2026-09-10T12:00', chrome:'BO' };
}
function seed(name){
 var s=base();
 var R=function(o,c,extra){ var r=blankRow(); r.open=o; r.close=c; if(extra) for(var k in extra) r[k]=extra[k]; return r; };
 if(name==='same'){ s.mode='same'; s.rows.same=R('10:00','19:00'); }
 if(name==='wk'){ s.mode='wk'; s.rows.wd=R('10:00','21:00'); s.rows.we=R('11:00','18:00'); s.rules=[{period:'weekly',week:'1,3',days:[1]}]; }
 if(name==='day'){ s.mode='day';
  s.rows.d1=R('','',{closed:true,period:'weekly',_keep:{open:'10:00',close:'19:00'}});
  s.rows.d2=R('11:00','20:00',{breaks:[{s:'14:00',e:'15:00'}]});
  s.rows.d3=R('11:00','20:00');
  s.rows.d4=R('11:00','20:00',{closed:true,period:'biweekly',week:'1,3'});
  s.rows.d5=R('18:00','02:00');
  s.rows.d6=R('10:00','18:00');
  s.rows.d0=R('','',{closed:true,period:'weekly'}); }
 if(name==='monthly'){ s.mode='day';
  s.rows.d1=R('10:00','19:00'); s.rows.d2=R('10:00','19:00');
  s.rows.d3=R('','',{closed:true,period:'weekly',_keep:{open:'10:07',close:'19:00'}});
  s.rows.d4=R('10:00','19:00',{closed:true,period:'monthly',week:'last'});
  s.rows.d5=R('10:00','19:00'); s.rows.d6=R('11:00','18:00');
  s.rows.d0=R('','',{closed:true,period:'weekly'});
  s.monthly=[1]; s.specials=[{from:'2026-09-15',to:null,closed:true},{from:'2026-10-03',to:'2026-10-05',closed:true},{from:'2026-12-24',to:null,closed:false,open:'12:00',close:'15:00'}];
  s.holi={keys:allHoliKeys()}; }
 if(name==='wk'){ s.holi={keys:['seol','chu']}; }
 s.saved=JSON.parse(JSON.stringify({mode:s.mode,rows:s.rows,rules:s.rules,holi:s.holi,monthly:s.monthly,specials:s.specials}));
 return s;
}
window.resetDB=function(name){ S=seed(name||'day'); UI={expandFO:false,sform:null,mform:false,rform:null,errors:{},modal:null,toastT:null}; render(); };

/* ===================== 유틸 ===================== */
function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function tmin(t){ if(!t) return null; var p=t.split(':'); return +p[0]*60+ +p[1]; }
function fmtK(t){ return t; }
function nowDate(){ return new Date(S.now); }
function todayStr(){ return ymd(nowDate()); }
function nthOfMonth(d){ return Math.ceil(d.getDate()/7); }   /* 그 요일이 그 달에서 몇 번째인지 */
function isLastOfMonth(d){ var x=addDays(d,7); return x.getMonth()!==d.getMonth(); }
function weekMatch(rowOrRule,d){
 var p=rowOrRule.period, w=rowOrRule.week;
 if(p==='weekly') return true;
 var n=nthOfMonth(d);
 if(p==='biweekly'){ return (w==='1,3')?(n===1||n===3):(n===2||n===4); }
 if(p==='monthly'){ return w==='last'?isLastOfMonth(d):(n===+w); }
 return false;
}
function visibleKeys(){ return S.mode==='same'?['same']:S.mode==='wk'?['wd','we']:S.mode==='day'?['d1','d2','d3','d4','d5','d6','d0']:[]; }
function keyFor(d){ var w=d.getDay(); if(S.mode==='same') return 'same'; if(S.mode==='wk') return (w===0||w===6)?'we':'wd'; if(S.mode==='day') return 'd'+w; return null; }
function labelFor(k){ return k==='same'?'매일':k==='wd'?'평일':k==='we'?'주말':WD[+k[1]]; }
function hasHours(){ if(!S.mode) return false; return visibleKeys().some(function(k){var r=S.rows[k];return !!(r.open&&r.close);}); }
function specialOn(ds){ return S.specials.find(function(sp){ var a=sp.from,b=sp.to||sp.from; return ds>=a&&ds<=b; })||null; }
/* 우선순위 3층: 1 특정 날짜 / 2 휴무 규칙 / 3 요일 줄 */
function effective(d){
 var ds=ymd(d), w=d.getDay();
 var sp=specialOn(ds);
 if(sp){ return sp.closed?{closed:true,why:'특정 날짜'}:{closed:false,open:sp.open,close:sp.close,breaks:[],why:'특정 날짜'}; }
 if(holiClosed(ds)) return {closed:true,why:'공휴일'};
 if(S.monthly.indexOf(d.getDate())>=0) return {closed:true,why:'매달 같은 날짜'};
 var k=keyFor(d); if(!k) return {closed:false,open:'',close:'',breaks:[]};
 var r=S.rows[k];
 if(S.mode==='day'&&r.closed&&weekMatch(r,d)) return {closed:true,why:'요일 휴무'};
 if(S.mode!=='day'){ for(var i=0;i<S.rules.length;i++){ var ru=S.rules[i]; if(ru.days.indexOf(w)>=0&&weekMatch(ru,d)) return {closed:true,why:'요일 휴무'}; } }
 if(S.mode==='wk'&&r.closed) return {closed:true,why:'요일 휴무'};
 return {closed:false,open:r.open,close:r.close,breaks:r.breaks||[]};
}
function crosses(e){ return e.open&&e.close&&tmin(e.close)<=tmin(e.open); }
/* 지금 상태 */
function statusNow(){
 var n=nowDate(), ds=ymd(n), m=n.getHours()*60+n.getMinutes();
 var y=addDays(n,-1), ey=effective(y);
 /* 전날 시작한 자정 넘김 구간 */
 if(!ey.closed&&ey.open&&ey.close&&crosses(ey)&&m<tmin(ey.close)){ return inRange(ey,m+1440,true); }
 var e=effective(n);

function validate(){

 visibleKeys().forEach(function(k){ var r=S.rows[k]; if(S.mode==='day'&&r.closed&&r.period==='weekly') return; if(S.mode==='wk'&&r.closed) return;
  var o=r.open, c=r.close;
  if((o&&!c)) { errs[k]='종료 시간을 넣어 주세요.'; return; }
  if((!o&&c)) { errs[k]='시작 시간을 넣어 주세요.'; return; }
  if(!o&&!c) return;
  var om=tmin(o), cm=tmin(c); if(cm<=om) cm+=1440;
  var ivs=[];
  for(var i=0;i<r.breaks.length;i++){ var b=r.breaks[i]; if(!b.s||!b.e) continue;
   var bs=tmin(b.s), be=tmin(b.e); if(bs<om) bs+=1440; if(be<=bs) be+=1440;
   if(bs<om||be>cm){ errs[k]='휴게시간은 여는 시간 안에 있어야 합니다.'; return; }
   ivs.push([bs,be]); }
  ivs.sort(function(a,b){return a[0]-b[0];});
  for(var j=1;j<ivs.length;j++){ if(ivs[j][0]<ivs[j-1][1]){ errs[k]='휴게시간끼리 겹칩니다.'; return; } }

}

   var lbl=d.getDate()+'일 ('+WDS[d.getDay()]+')'; if(sp.to){ var e=parseD(sp.to); lbl+=' ~ '+(e.getMonth()!==d.getMonth()?(e.getMonth()+1)+'월 ':'')+e.getDate()+'일 ('+WDS[e.getDay()]+')'; }
   var idx=S.specials.indexOf(sp);
   h+='<div class="sr"><span class="d">'+lbl+'</span><span class="v">'+(sp.closed?'쉽니다':sp.open+' → '+sp.close)+'</span><button class="x" onclick="S.specials.splice('+idx+',1);render()">✕</button></div>'; });
  h+='</div>'; }
 if(UI.sform){ var f=UI.sform;
  h+='<div class="form"><div class="fr"><span class="fl">날짜</span><input type="date" min="'+today+'" max="'+maxD+'" value="'+f.from+'" onchange="UI.sform.from=this.value;render()">'+(f.multi?' ~ <input type="date" min="'+(f.from||today)+'" max="'+maxD+'" value="'+(f.to||'')+'" onchange="UI.sform.to=this.value;render()">':'')+'<label class="chk" style="margin-left:8px"><input type="checkbox" '+(f.multi?'checked':'')+' onchange="UI.sform.multi=this.checked;if(!this.checked)UI.sform.to=null;render()"> 여러 날</label></div>';
  h+='<div class="ex" style="margin:-4px 0 8px 66px">여러 날을 켜면 날짜 칸이 시작과 끝 두 개가 됩니다.</div>';
  h+='<div class="fr"><span class="fl">이 날은</span><label class="chk"><input type="radio" name="spk" '+(f.closed?'checked':'')+' onchange="UI.sform.closed=true;render()"> 쉽니다</label><label class="chk"><input type="radio" name="spk" '+(!f.closed?'checked':'')+' onchange="UI.sform.closed=false;render()"> 이 시간에 엽니다</label>';
  if(!f.closed) h+='<span class="pk"><input type="time" step="300" value="'+(f.open||'')+'" onchange="UI.sform.open=this.value"><span class="ar">→</span><input type="time" step="300" value="'+(f.close||'')+'" onchange="UI.sform.close=this.value"><span class="ar">◷</span></span>';
  h+='</div>'+(f.err?'<div class="msg">'+f.err+'</div>':'')+'<div class="fb"><button class="sec" onclick="UI.sform=null;render()">취소</button><button class="pri" onclick="commitSpecial()">추가</button></div></div>'; }
 else h+='<div style="margin-top:8px"><button class="add" onclick="UI.sform={from:\''+today+'\',to:null,multi:false,closed:true,open:\'\',close:\'\'};render()">+  날짜 추가</button></div>';
 h+='</div></div></div>';
 /* 오른쪽: FO·챗봇·예약설정 */
 h+='<div class="side">'+renderFO()+renderBot()+renderBooking()+'</div></div>';
 document.getElementById('app').innerHTML=h;
 document.getElementById('modal').innerHTML=renderModal();
};
window.commitSpecial=function(){ var f=UI.sform; f.err='';
 if(!f.from){ f.err='날짜를 골라 주세요.'; render(); return; }
 if(f.multi&&(!f.to||f.to<f.from)){ f.err='끝 날짜를 시작 뒤로 골라 주세요.'; render(); return; }
 if(!f.closed&&(!f.open||!f.close)){ f.err='여는 시간을 넣어 주세요.'; render(); return; }
 var a=f.from,b=f.multi?f.to:f.from;
 var dup=S.specials.some(function(sp){ var x=sp.from,y=sp.to||sp.from; return !(y<a||x>b); });
 if(dup){ f.err='같은 날짜가 이미 있습니다. 기존 줄을 고쳐 주세요.'; render(); return; }
 S.specials.push({from:a,to:f.multi?f.to:null,closed:f.closed,open:f.open,close:f.close}); UI.sform=null; render();
};
function renderFO(){
 var h='<div class="pv"><h3>고객 화면 미리보기<span class="sp"></span><span>'+esc(S.now.replace('T',' '))+'</span></h3><div class="fo">';
 if(!hasHours()){ h+='<div class="none">(운영시간 영역이 통째로 감춰집니다. 안내 문구도 없습니다.)</div></div></div>'; return h; }
 var st=statusNow(); h+='<div class="ttl">운영시간</div><div class="stat">'+st.st+'</div>';
 var aux=''; if(st.st==='운영 중') aux=st.closeAt+'에 닫습니다'; else if(st.st==='휴게 중') aux=st.reopen+'에 다시 엽니다'; else aux=nextOpenText();
 h+='<div class="aux">'+aux+'</div>';
 /* 안내: 특정 날짜·공휴일 휴무 중 14일 이내 가장 가까운 하나 */
 var ntc=nearestNotice(); if(ntc) h+='<div class="spc">'+ntc+'</div>';
 h+='<button class="tg" onclick="toggleFO()">'+(UI.expandFO?'요일별 시간 접기 ⌃':'요일별 시간 보기 ⌄')+'</button>';
 if(UI.expandFO){ h+='<table>';
  [1,2,3,4,5,6,0].forEach(function(w){ var k=keyFor(new Date(2026,8,6+w)); var r=S.rows[k]; var closedWeekly=(S.mode==='day'&&r.closed&&r.period==='weekly')||(S.mode==='wk'&&r.closed)||(S.mode!=='day'&&S.rules.some(function(ru){return ru.period==='weekly'&&ru.days.indexOf(w)>=0;}));
   var v= closedWeekly?'휴무':(r.open&&r.close? r.open+' - '+(badgeNext(r)?'다음날 ':'')+r.close : '-');
   h+='<tr><td>'+WD[w]+'</td><td>'+v+(!closedWeekly?(r.breaks||[]).filter(function(b){return b.s&&b.e;}).map(function(b){return '<div class="bk">휴게 '+b.s+' - '+b.e+'</div>';}).join(''):'')+'</td></tr>'; });
  var AK=allHoliKeys(), allOff=AK.length>0&&AK.every(function(k){return S.holi.keys.indexOf(k)>=0;});
  if(allOff) h+='<tr><td>공휴일</td><td>휴무</td></tr>';
  h+='</table>';
  var rs=[];
  if(S.mode==='day'){ [1,2,3,4,5,6,0].forEach(function(w){ var r=S.rows['d'+w]; if(r.closed&&r.period!=='weekly') rs.push(ruleText(r,[w])); }); }
  else S.rules.forEach(function(ru){ if(ru.days.length){ var tx=ruleText(ru,ru.days.slice().sort(function(a,b){return (a||7)-(b||7);})); if(tx) rs.push(tx); } });
  S.monthly.forEach(function(d){ rs.push('매달 '+d+'일 휴무'); });
  if(!allOff&&S.holi.keys.length) rs.push(holiGroupLabel().join(', ')+' 휴무');
  if(rs.length) h+='<div class="rs">'+rs.join('<br>')+'</div>'; }
 h+='</div></div>'; return h;
}
function renderBot(){
 var h='<div class="pv"><h3>챗봇 답변 (운영시간 문의)</h3><div class="bot">';
 if(!hasHours()){ h+='운영시간은 매장에 직접 확인해 주세요.'; return h+'</div></div>'; }
 var st=statusNow(), e=effective(nowDate());
 var lines=['지금은 '+st.st+'입니다.'];
 var n0=nowDate(), ey=effective(addDays(n0,-1)), m0=n0.getHours()*60+n0.getMinutes();
 var tail=!ey.closed&&ey.open&&ey.close&&crosses(ey)&&m0<tmin(ey.close);
 if(tail) lines.push(WD[addDays(n0,-1).getDay()]+' 운영이 '+ey.close+'까지 이어집니다.');
 if(!e.closed&&e.open) lines.push('오늘 운영시간은 '+e.open+'부터 '+(crosses(e)?'다음날 ':'')+e.close+'까지'+((e.breaks||[]).filter(function(b){return b.s&&b.e;}).length?' (휴게 '+(e.breaks||[]).filter(function(b){return b.s&&b.e;}).map(function(b){return b.s+'~'+b.e;}).join(', ')+')':'')+'입니다.');
 else if(tail) lines.push('오늘('+WD[n0.getDay()]+')은 쉽니다.');
 if(st.st!=='운영 중'&&st.st!=='휴게 중'){ var nx=nextOpenText(); if(nx) lines.push(nx+'.'); }
 var ntc=nearestNotice(); if(ntc) lines.push(ntc+'.');
 return h+lines.join('\n')+'</div></div>';
}
function renderBooking(){
 var h='<div class="pv bk-panel"><h3>예약설정 › 예약 받는 시간</h3><div class="top">'+(S.synced?'':'<span class="warn">운영시간이 바뀌었습니다</span>')+'<button class="sec" onclick="openLoadModal()">운영시간 불러오기</button></div>';
 h+='<div class="sync">'+(S.synced?'예약 받는 시간이 운영시간과 맞습니다.':'운영시간을 저장했지만 예약 받는 시간에는 아직 반영하지 않았습니다.')+'</div>';
 h+='<div class="bk-list" style="margin-top:8px">확정 예약 샘플: '+BOOKINGS.map(function(b){return b.at.replace('T',' ');}).join(' / ')+'<br>지금 기준 바뀐 시간 밖 예약: <b>'+pushedCount()+'건</b></div></div>';
 return h;
}
function renderModal(){
 if(!UI.modal) return '';
 var m=UI.modal, isSave=m.kind==='save';
 var h='<div class="ovl" onclick="if(event.target===this)closeModal()"><div class="mdl"><button class="mx" onclick="closeModal()">✕</button>';
 h+='<h2>'+(isSave?'예약 받는 시간에도 반영할까요?':'운영시간을 불러옵니다')+'</h2><p class="ms">'+(isSave?'운영시간은 저장했습니다':'예약 받는 시간을 운영시간에 맞춰 다시 만듭니다')+'</p>';
 h+='<div class="mb">'+(m.count?'<b>바뀐 시간 밖에 예약 '+m.count+'건이 있습니다.</b>':'')+'이미 받은 예약은 그대로 유지됩니다. 새 예약만 바뀐 시간에 맞춰 받습니다.</div>';
 h+='<div class="mf"><button class="sec" onclick="closeModal()" autofocus>'+(isSave?'나중에':'취소')+'</button><button class="pri" onclick="applyBooking()">'+(isSave?'반영하기':'불러오기')+'</button></div></div></div>';
 return h;
}
/* 상단 컨트롤 */
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&UI&&UI.modal) closeModal(); });
document.getElementById('nowIn').addEventListener('change',function(){ setNow(this.value); });
document.querySelectorAll('[data-seed]').forEach(function(b){ b.addEventListener('click',function(){ document.querySelectorAll('[data-seed]').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); resetDB(b.dataset.seed); }); });
document.querySelectorAll('[data-chrome]').forEach(function(b){ b.addEventListener('click',function(){ setChrome(b.dataset.chrome); }); });
/* 취소(앵커 탭): 저장 전 값으로 */
var _resetDB=window.resetDB; window.resetDB=function(name){ if(name==='__cancel'&&S&&S.saved){ var sv=JSON.parse(JSON.stringify(S.saved)); S.mode=sv.mode;S.rows=sv.rows;S.rules=sv.rules;S.holi=sv.holi;S.monthly=sv.monthly;S.specials=sv.specials; UI.errors={}; render(); return; } _resetDB(name); };
resetDB('day');
</script>
</body>
