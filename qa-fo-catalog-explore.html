<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FO 카탈로그·탐색 · 와이어프레임 검수</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:#262626;background:#f5f6f8;overflow:hidden}
.app{display:flex;height:100vh}
.left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid #e0e0e0}
.left iframe{flex:1;width:100%;border:0;background:#fff}
.lbar{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:8px;padding:0 12px}
.lbar .t{font-size:13px;font-weight:600}
.lbar .sp{flex:1}
.right{flex:0 0 460px;display:flex;flex-direction:column;background:#fff;min-width:0}
.right.wide{flex-basis:680px}
.top{flex:0 0 auto;border-bottom:1px solid #e8e8e8;padding:12px 16px}
.top h1{margin:0 0 8px;font-size:15px;font-weight:700}
.top h1 .sub{font-size:11px;color:#8c8c8c;font-weight:400;margin-left:6px}
.btn{padding:5px 10px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;color:#434343;font-size:12px;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#1f1f1f;color:#1f1f1f}
.btn.pri{background:#1f1f1f;border-color:#1f1f1f;color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.btn.on{background:#1f1f1f;border-color:#1f1f1f;color:#fff}
.row1{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.stat{display:flex;gap:12px;align-items:center;font-size:12px;color:#595959}
.stat b{color:#262626;font-size:14px}
.bar{height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden;flex:1;min-width:80px;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:#52c41a}.bar .f{background:#ff4d4f}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 60px}
.grp{margin-bottom:16px}
.grp h2{font-size:12px;margin:0 0 6px;color:#8c8c8c;font-weight:600;display:flex;gap:6px;align-items:center}
.grp h2 .n{font-weight:400;color:#bfbfbf}
.tc{border:1px solid #f0f0f0;border-radius:6px;padding:10px 12px;margin-bottom:6px;background:#fff}
.tc.pass{border-color:#b7eb8f;background:#fcfffa}
.tc.fail{border-color:#ffa39e;background:#fffafa}
.tc .hd{display:flex;gap:8px;align-items:flex-start}
.tc .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8c8c8c;flex:0 0 54px;padding-top:2px}
.tc .ti{font-weight:600;flex:1;line-height:1.45;font-size:13px}
.tc .acts{display:flex;gap:4px;flex:0 0 auto}
.tc .acts .btn{padding:3px 8px;font-size:11px}
.tc .acts .btn.p.on{background:#52c41a;border-color:#52c41a;color:#fff}
.tc .acts .btn.f.on{background:#ff4d4f;border-color:#ff4d4f;color:#fff}
.tc dl{margin:8px 0 0 62px;display:grid;grid-template-columns:36px 1fr;gap:3px 8px;font-size:12px;line-height:1.6}
.tc dt{color:#8c8c8c}
.tc dd{margin:0}
.tc .go{margin:8px 0 0 62px}
.tc .go .btn{padding:3px 9px;font-size:11px}
.memo{margin:8px 0 0 62px;display:none}
.memo.show{display:block}
.memo textarea{width:100%;min-height:50px;padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;font-size:12px;resize:vertical;line-height:1.5}
.memo textarea:focus{outline:none;border-color:#1f1f1f}
.memo .lbl{font-size:11px;color:#8c8c8c;margin-bottom:3px}
.hint{font-size:11px;color:#8c8c8c;line-height:1.7;margin:0 0 12px}
.empty{border:1px dashed #d9d9d9;border-radius:6px;padding:24px;text-align:center;color:#8c8c8c;font-size:12px}
dialog{border:none;border-radius:8px;padding:0;max-width:720px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:14px 18px}
dialog .df{padding:10px 18px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
dialog textarea{width:100%;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;padding:10px;border:1px solid #d9d9d9;border-radius:4px}
.x{background:none;border:none;font-size:15px;cursor:pointer;color:#8c8c8c}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="lbar">
      <span class="t">와이어프레임</span>
      <button class="btn" id="reload">새로고침</button>
      <button class="btn" id="resetPrev">시드 초기화</button>
      <span class="sp"></span>
      <button class="btn" id="widen">체크리스트 넓게</button>
      <button class="btn" id="newwin">새 창</button>
    </div>
    <iframe id="prev" src="fo-catalog-explore.html"></iframe>
  </div>
  <div class="right" id="right">
    <div class="top">
      <h1>검수 체크리스트<span class="sub" id="cnt"></span></h1>
      <div class="row1">
        <button class="btn on" data-f="all">전체</button>
        <button class="btn" data-f="todo">미확인</button>
        <button class="btn" data-f="fail">실패만</button>
        <span style="flex:1"></span>
        <button class="btn pri" id="copy">결과 복사</button>
        <button class="btn" id="reset">기록 초기화</button>
      </div>
      <div class="stat">
        <span>통과 <b id="nPass">0</b></span>
        <span>실패 <b id="nFail">0</b></span>
        <span>미확인 <b id="nTodo">0</b></span>
        <div class="bar"><i class="p" id="barP"></i><i class="f" id="barF"></i></div>
        <span id="pct">0%</span>
      </div>
    </div>
    <div class="scroll">
      <p class="hint">케이스의 <b>이 화면 열기</b>를 누르면 왼쪽 와이어프레임이 그 상태로 바로 맞춰집니다.<br>
      실패를 누르면 메모 칸이 열립니다. 기록은 이 브라우저에 저장됩니다.</p>
      <div id="list"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dh">결과<button class="x" onclick="document.getElementById('dlg').close()">✕</button></div>
  <div class="db"><textarea id="out" readonly></textarea></div>
  <div class="df">
    <button class="btn" onclick="document.getElementById('dlg').close()">닫기</button>
    <button class="btn pri" id="doCopy">클립보드로 복사</button>
  </div>
</dialog>

<script>
/* [id, 제목, 절차, 기대, 세팅 코드] */
var DATA = [

["전역 메뉴 (FO-NAV-01)", [
["N-01","메뉴 4개와 순서","아무 화면 하단","홈 / 탐색 / 저장 / 마이페이지 네 개만. 상품·스토어 메뉴 없음","go('explore')"],
["N-02","현재 위치 표시","탐색 홈","탐색 항목만 진하게 채워짐","go('explore')"],
["N-03","상품·스토어 접근 유지","탐색 홈 맨 아래","전체 상품 / 전체 스토어 버튼으로 기존 목록에 들어감","go('explore')"],
["N-04","본문이 실패해도 메뉴는 남는다","추천 실패 상태의 탐색 홈","추천 영역만 재시도로 바뀌고 하단 메뉴는 그대로","go('explore');setFail('reco',true)"],
["N-05","비로그인 저장 진입","하단 저장 탭","로그인 화면으로 이동. 뒤로가 아니라 나중에 하기로도 원래 화면 복귀","go('explore');navTo('saved')"]
]],

["탐색 홈 (FO-EXP-01)", [
["E-01","네 개 시작점","탐색 홈","분류 4개 대분류·7개 중분류 / 고민 5개 / 부위 4개 / 지역 4개","go('explore')"],
["E-02","검색 진입","상단 검색칸 누름","검색 화면으로 이동하고 입력 전 안내가 뜸","go('explore')"],
["E-03","인기 서비스","탐색 홈 인기 서비스","슈링크 유니버스 · 리쥬란 힐러 · 울쎄라피 순서, 각 행에 대표 카테고리 경로","go('explore')"],
["E-04","추천만 실패","추천 조회 실패 상태","인기 서비스 자리에만 재시도가 뜨고 인기 지역 영역은 사라짐. 검색과 네 축은 그대로","go('explore');setFail('reco',true)"],
["E-05","숨김·미공개는 시작점에서 빠진다","분류 고르기 진입","바디케어(숨김)와 헤어·두피(영어 미공개)가 목록에 없음","openPick('cat')"]
]],

["정본 검색 (FO-EXP-02)", [
["Q-01","동의어 다중 후보","검색어 울쎄라","서비스 3건. 슈링크 유니버스(울쎄라로도 불립니다) / 울쎄라피(이름 일치) / 온다 리프팅(울쎄라로도 불립니다). 자동 이동하지 않음","openSearch('울쎄라')"],
["Q-02","동의어 별도 결과 없음","Q-01 상태","울쎄라라는 이름의 독립 결과 행이 없음. 각 행은 대표 카테고리 경로로 구분됨","openSearch('울쎄라')"],
["Q-03","결과 유형 기본값","Q-01 상태","전체가 선택된 상태. 전체 3 / 서비스 3 / 고민·부위 0 / 분류 0 / 지역 0","openSearch('울쎄라')"],
["Q-04","유형으로 거르기","검색어 리프팅 · 분류 선택","분류 4건만 남음 (리프팅·윤곽, 초음파 리프팅, 고주파 리프팅, 실 리프팅)","openSearch('리프팅');VIEW.stype='category';render()"],
["Q-05","상품·스토어는 섞이지 않는다","검색어 슈링크","서비스 슈링크 유니버스만 나오고 상품명(슈링크 유니버스 300샷)은 결과에 없음","openSearch('슈링크')"],
["Q-06","0건 복구 행동","검색어 하이푸","0건 안내와 함께 검색어 고치기·고민·분류·전체 상품·전체 스토어 다섯 가지 행동","openSearch('하이푸')"],
["Q-07","0건에서 검색어 유지","Q-06 상태","검색칸에 하이푸가 그대로 남아 있고 유형 선택도 유지","openSearch('하이푸')"],
["Q-08","공백만 입력","검색칸을 공백으로 두고 검색","검색하지 않고 검색어를 입력해 주세요 안내만 뜸","openSearch('');VIEW.q='   ';render();submitSearch()"],
["Q-09","숨김 서비스 제외","검색어 바디","0건 화면이 뜨고 바디 컨투어링(숨김)이 나오지 않음","openSearch('바디')"]
]],

["조건 선택 (FO-EXP-03)", [
["F-01","적용 버튼 비활성","분류 고르기 진입 직후","선택한 것이 없어 적용 버튼이 눌리지 않음","openPick('cat')"],
["F-02","선택하면 활성","리프팅·윤곽 전체 선택","버튼 문구가 1개 조건 적용으로 바뀌고 활성","openPick('cat');pickToggle('C2')"],
["F-03","이미 적용된 조건은 체크된 채로 열린다","조건이 있는 상태에서 분류 고르기 다시 열기","리프팅·윤곽 전체가 체크된 상태","applyConds([{axis:'cat',id:'C2'}],'product');openPick('cat')"],
["F-04","모두 지우면 탐색 홈","F-03에서 체크 해제 후 적용","조건이 없어져 탐색 홈으로 이동","applyConds([{axis:'cat',id:'C2'}],'product');openPick('cat');pickToggle('C2')"],
["F-05","지역은 상위·하위가 함께","지역 고르기","서울 전체 아래에 강남·압구정로데오·명동. 홍대(숨김) 없음","openPick('plc')"]
]],

["조건 결과 (FO-EXP-03)", [
["R-01","기본 상태","분류 리프팅·윤곽 + 지역 강남","서비스 2 / 상품 4 / 스토어 2. 기본 정렬 조회순","applyConds([{axis:'cat',id:'C2'},{axis:'plc',id:'PG'}],'product')"],
["R-02","탭을 바꿔도 조건 유지","R-01에서 스토어 탭","조건 칩 두 개가 그대로 있고 스토어 2건","applyConds([{axis:'cat',id:'C2'},{axis:'plc',id:'PG'}],'store')"],
["R-03","가격순은 상품 탭에만","서비스 탭에서 정렬 열기","조회순·인기순만. 낮은 가격순·높은 가격순 없음","applyConds([{axis:'cat',id:'C2'},{axis:'plc',id:'PG'}],'service');VIEW.sheet='sort';render()"],
["R-04","가격순은 상품 탭에 있다","상품 탭에서 정렬 열기","조회순·인기순·낮은 가격순·높은 가격순 네 가지","applyConds([{axis:'plc',id:'PG'}],'product');VIEW.sheet='sort';render()"],
["R-05","가격 없는 상품은 뒤로","지역 강남 · 낮은 가격순 · 더 보기까지","스킨 보톡스 15만원부터 오르고, 상담 후 결정인 프리미엄 리프팅 프로그램이 맨 뒤","applyConds([{axis:'plc',id:'PG'}],'product');setSort('asc');VIEW.page=2;render()"],
["R-06","더 보기","지역 강남 · 상품 탭","6건 중 5건 표시, 더 보기 (1건 남음)","applyConds([{axis:'plc',id:'PG'}],'product')"],
["R-07","추가 로딩 실패","R-06에서 더 보기 실패","이미 본 5건은 그대로 남고 실패 영역에만 다시 시도","applyConds([{axis:'plc',id:'PG'}],'product');setFail('more',true)"],
["R-08","같은 축은 하나만 맞으면 된다","지역 강남 + 압구정로데오","강남 또는 압구정로데오 상품이 모두 나옴 (10건)","applyConds([{axis:'plc',id:'PG'},{axis:'plc',id:'PA'}],'product')"],
["R-09","다른 축은 모두 맞아야 한다","분류 초음파 리프팅 + 지역 압구정로데오","울쎄라피 400샷 1건만","applyConds([{axis:'cat',id:'C21'},{axis:'plc',id:'PA'}],'product')"],
["R-10","0건과 조건 해제","초음파 리프팅 + 여드름 흉터 + 강남","0건 안내. 해제 목록이 여드름 흉터 3건 / 초음파 리프팅 1건 / 강남 0건 순, 맨 위만 진한 해제 버튼","applyConds([{axis:'cat',id:'C21'},{axis:'itr',id:'I4'},{axis:'plc',id:'PG'}],'product')"],
["R-11","조건 하나 해제","R-10에서 여드름 흉터 해제","조건 두 개가 남고 상품 3건이 보임","applyConds([{axis:'cat',id:'C21'},{axis:'itr',id:'I4'},{axis:'plc',id:'PG'}],'product')"],
["R-12","모두 해제","조건 칩 오른쪽 모두 해제","탐색 홈으로 이동","applyConds([{axis:'cat',id:'C2'},{axis:'plc',id:'PG'}],'product')"],
["R-13","미승인 연결은 결과에 없다","지역 강남 · 상품 탭","리프팅 체험 1회(연결 보류)가 목록에 없음","applyConds([{axis:'plc',id:'PG'}],'product')"],
["R-14","비공개 스토어 상품 제외","지역 명동 · 상품 탭","하늘의원(비공개)의 울쎄라피 목 집중이 없어 0건 안내","applyConds([{axis:'plc',id:'PM'}],'product')"],
["R-15","중복 카드 없음","지역 강남 + 분류 리프팅·윤곽","프리미엄 리프팅 프로그램이 두 서비스에 걸려 있어도 카드는 한 번만","applyConds([{axis:'cat',id:'C2'},{axis:'plc',id:'PG'}],'product')"]
]],

["분류 랜딩 (FO-LAND-01)", [
["LC-01","기본 구성","리프팅·윤곽 랜딩","설명 → 하위 분류 3개 → 서비스 → 상품 → 스토어 순서","go('cat','C2')"],
["LC-02","건수","같은 화면 상단","서비스 4 · 상품 6 · 스토어 4","go('cat','C2')"],
["LC-03","현재 경로","같은 화면","탐색 > 분류 > 리프팅·윤곽","go('cat','C2')"],
["LC-04","하위 분류 랜딩","초음파 리프팅 랜딩","경로가 탐색 > 분류 > 리프팅·윤곽 > 초음파 리프팅. 하위 분류 영역은 없음","go('cat','C21')"],
["LC-05","숨김 분류","바디케어 주소로 진입","찾을 수 없음 화면과 탐색 홈 이동","go('cat','C5')"],
["LC-06","전체 보기","서비스 영역의 전체 4건","이 분류를 조건으로 건 결과 화면, 서비스 탭","go('cat','C2')"]

var KEY = 'kbs_qa_fo_catalog';
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
var filter = 'all';
var list = document.getElementById('list');
var frame = document.getElementById('prev');

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function get(id){ return state[id] || {v:'', m:''}; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function runInPreview(code, alsoReset){
  var w = frame.contentWindow;
  try {
    if(alsoReset && w.resetDB) w.resetDB();
    if(code) w.eval(code);
    frame.contentWindow.focus();
    return true;
  } catch(e){
    alert('와이어프레임을 제어하지 못했습니다.\n' + e.message +
      '\n\n파일을 직접 연 경우 브라우저가 막습니다. 배포 주소로 열어 주세요.');
    return false;
  }
}

function render(){
  list.innerHTML = '';
  var total=0, pass=0, fail=0;
  DATA.forEach(function(g){ g[1].forEach(function(c){ total++; var v=get(c[0]).v; if(v==='p') pass++; else if(v==='f') fail++; }); });
  document.getElementById('nPass').textContent = pass;
  document.getElementById('nFail').textContent = fail;
  document.getElementById('nTodo').textContent = total-pass-fail;
  document.getElementById('barP').style.width = (pass/total*100)+'%';
  document.getElementById('barF').style.width = (fail/total*100)+'%';
  document.getElementById('pct').textContent = Math.round((pass+fail)/total*100)+'%';
  document.getElementById('cnt').textContent = total+'건';

  var any=false;
  DATA.forEach(function(g){
    var cards=[];
    g[1].forEach(function(c){
      var st=get(c[0]);
      if(filter==='fail' && st.v!=='f') return;
      if(filter==='todo' && st.v) return;
      any=true;
      var d=document.createElement('div');
      d.className='tc'+(st.v==='p'?' pass':st.v==='f'?' fail':'');
      d.innerHTML =
        '<div class="hd"><span class="id">'+c[0]+'</span><span class="ti">'+esc(c[1])+'</span>'+
        '<span class="acts">'+
        '<button class="btn p'+(st.v==='p'?' on':'')+'" data-v="p">통과</button>'+
        '<button class="btn f'+(st.v==='f'?' on':'')+'" data-v="f">실패</button>'+
        '</span></div>'+
        '<dl><dt>절차</dt><dd>'+esc(c[2])+'</dd><dt>기대</dt><dd>'+esc(c[3])+'</dd></dl>'+
        (c[4]?'<div class="go"><button class="btn goBtn">이 화면 열기</button></div>':'')+
        '<div class="memo'+(st.v==='f'||st.m?' show':'')+'">'+
        '<div class="lbl">무엇이 어떻게 달랐나요</div>'+
        '<textarea placeholder="예: 안내 문구가 안 뜸 / 건수가 4가 아니라 2 / 조건이 풀림">'+esc(st.m)+'</textarea></div>';
      d.querySelectorAll('.acts .btn').forEach(function(b){
        b.addEventListener('click', function(){
          var cur=get(c[0]);
          var nv = cur.v===b.dataset.v ? '' : b.dataset.v;
          state[c[0]] = {v:nv, m:cur.m||''};
          save(); render();
          if(nv==='f'){ var el=document.querySelector('[data-focus="'+c[0]+'"]'); if(el) el.focus(); }
        });
      });
      var gb=d.querySelector('.goBtn');
      if(gb) gb.addEventListener('click', function(){ runInPreview(c[4], true); });
      var ta=d.querySelector('textarea');
      ta.setAttribute('data-focus', c[0]);
      ta.addEventListener('input', function(){ var cur=get(c[0]); state[c[0]]={v:cur.v, m:ta.value}; save(); });
      cards.push(d);
    });
    if(!cards.length) return;
    var wrap=document.createElement('div'); wrap.className='grp';
    var h=document.createElement('h2');
    h.innerHTML = esc(g[0])+'<span class="n">'+cards.length+'</span>';
    wrap.appendChild(h);
    cards.forEach(function(x){ wrap.appendChild(x); });
    list.appendChild(wrap);
  });
  if(!any){
    var e=document.createElement('div'); e.className='empty';
    e.textContent = filter==='fail' ? '실패로 표시한 케이스가 없습니다.' : '미확인 케이스가 없습니다.';
    list.appendChild(e);
  }
}

function buildReport(){
  var lines=[], pass=0, fail=0, todo=0;
  DATA.forEach(function(g){
    var rows=[];
    g[1].forEach(function(c){
      var st=get(c[0]);
      if(st.v==='p') pass++; else if(st.v==='f') fail++; else todo++;
      if(st.v!=='f') return;
      rows.push('- '+c[0]+' '+c[1]+(st.m?'\n  '+st.m.replace(/\n/g,'\n  '):'\n  (메모 없음)'));
    });
    if(rows.length){ lines.push('['+g[0]+']'); lines.push(rows.join('\n')); lines.push(''); }
  });
  return 'FO 카탈로그·탐색 와이어프레임 검수 결과\n통과 '+pass+' / 실패 '+fail+' / 미확인 '+todo+'\n\n'+
    (lines.length ? '실패 건\n\n'+lines.join('\n') : '실패 건 없음');
}

document.querySelectorAll('[data-f]').forEach(function(b){
  b.addEventListener('click', function(){
    filter=b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(function(x){ x.classList.toggle('on', x===b); });
    render();
  });
});
document.getElementById('reload').addEventListener('click', function(){ frame.src = frame.src; });
document.getElementById('resetPrev').addEventListener('click', function(){ runInPreview('', true); });
document.getElementById('newwin').addEventListener('click', function(){ window.open('fo-catalog-explore.html','_blank'); });
document.getElementById('widen').addEventListener('click', function(){
  var r=document.getElementById('right');
  r.classList.toggle('wide');
  this.textContent = r.classList.contains('wide') ? '체크리스트 좁게' : '체크리스트 넓게';
});
document.getElementById('copy').addEventListener('click', function(){
  document.getElementById('out').value = buildReport();
  document.getElementById('dlg').showModal();
});
document.getElementById('doCopy').addEventListener('click', function(){
  var ta=document.getElementById('out');
  ta.removeAttribute('readonly'); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  if(navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function(){});
  ta.setAttribute('readonly','');
  var b=this; b.textContent='복사했습니다';
  setTimeout(function(){ b.textContent='클립보드로 복사'; }, 1500);
});
document.getElementById('reset').addEventListener('click', function(){
  if(!confirm('기록한 통과·실패와 메모를 모두 지웁니다. 계속할까요?')) return;
  state={}; save(); render();
});
render();
</script>
