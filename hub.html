<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBS 시안 모아보기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --line: #e6e4de; --line2: #efeee9; --text: #1b1a18; --muted: #76736b; --faint: #a7a49b;
    --accent: #2b59e8; --accent-soft: #eaf0ff; --hover: #f7f7f4; --new: #e8590c; --new-soft: #fff1e6;
    --c-시안: #2b59e8; --c-검수: #2b8a3e; --c-리뷰: #9c36b5; --c-가이드: #d9480f; --c-문서: #5c6b7a;
    --w-어드민: #364fc7; --w-입점사: #0c8599; --w-고객: #c2255c;
    --shadow: 0 1px 2px rgba(20,20,15,.05), 0 4px 14px rgba(20,20,15,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131312; --card: #1c1c1a; --line: #2e2d2a; --line2: #262523; --text: #eceae5; --muted: #9b988f; --faint: #6c6a64;
      --accent: #7b9bff; --accent-soft: #212a44; --hover: #22221f; --new: #ff8f4d; --new-soft: #3a2416;
      --c-시안: #7b9bff; --c-검수: #69db7c; --c-리뷰: #da77f2; --c-가이드: #ffa94d; --c-문서: #a5b4c3;
      --w-어드민: #91a7ff; --w-입점사: #66d9e8; --w-고객: #f783ac; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; }
  a { color: inherit; }

  /* 상단 */
  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 26px 20px 22px; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -0.5px; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  .sbox { position: relative; margin-top: 16px; }
  .sbox svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search { width: 100%; height: 52px; padding: 0 90px 0 46px; font: inherit; font-size: 16px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--text); outline: none; transition: border-color .15s, background .15s; }
  .search:focus { border-color: var(--accent); background: var(--card); }
  .kbd { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; background: var(--card); }
  .hint { margin-top: 8px; font-size: 12px; color: var(--faint); min-height: 18px; }

  /* 최근 작업 */
  .recent { max-width: 1240px; margin: 0 auto; padding: 22px 20px 0; }
  .sec-t { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .sec-t small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px 12px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; color: var(--text); transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .tp { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .card .tp b { color: var(--accent); font-weight: 600; }
  .card .nm { font-weight: 650; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; }
  .card .bd { display: flex; gap: 4px; flex-wrap: wrap; }

  /* 본문 */
  .main { max-width: 1240px; margin: 0 auto; padding: 26px 20px 80px; display: grid; grid-template-columns: 232px 1fr; gap: 26px; align-items: start; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 32px); overflow: auto; }
  .side h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; color: var(--text); padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13.5px; }
  .nav button:hover { background: var(--card); }
  .nav button.on { background: var(--card); box-shadow: var(--shadow); font-weight: 650; color: var(--accent); }
  .nav .n { margin-left: auto; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .nav .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--new); flex: none; }
  .nav .dot.off { background: transparent; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
  .pill.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .toggle { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }

  .content { min-width: 0; }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .bar .count { font-size: 13px; color: var(--muted); }
  .bar .count b { color: var(--text); }
  .seg { margin-left: auto; display: inline-flex; background: var(--line2); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 11px; font-size: 12.5px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

  .group { margin-top: 18px; scroll-margin-top: 12px; }
  .gh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .gh h2 { margin: 0; font-size: 17px; font-weight: 720; letter-spacing: -0.2px; }
  .gh .gm { font-size: 12px; color: var(--muted); }
  .gh .qa { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .qa a { font-size: 12px; text-decoration: none; color: var(--c-검수); border: 1px solid color-mix(in srgb, var(--c-검수) 35%, transparent); padding: 3px 9px; border-radius: 7px; background: var(--card); }
  .qa a:hover { background: color-mix(in srgb, var(--c-검수) 10%, var(--card)); }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line2); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--hover); }
  .item.arch { opacity: .55; }
  .it { min-width: 0; }
  .tl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tl .nm { font-weight: 620; font-size: 14.5px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .fn { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11.5px; }
  .b { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; white-space: nowrap; line-height: 17px; }
  .b.k { color: var(--kc); background: color-mix(in srgb, var(--kc) 11%, transparent); }
  .b.w { color: var(--wc); border: 1px solid color-mix(in srgb, var(--wc) 35%, transparent); }
  .b.new { color: var(--new); background: var(--new-soft); }
  .b.old { color: var(--muted); border: 1px dashed var(--line); }
  mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .act { display: flex; gap: 6px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 12.5px; padding: 6px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.pri:hover { filter: brightness(1.08); color: #fff; }
  .empty { padding: 56px 20px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 14px; margin-top: 14px; }

  /* 미리보기 */
  .scrim { position: fixed; inset: 0; background: rgba(10,10,8,.38); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1100px, 78vw); background: var(--card); z-index: 21; transform: translateX(102%); transition: transform .25s ease; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
  .pv-open .scrim { opacity: 1; pointer-events: auto; }
  .pv-open .drawer { transform: none; }
  .dh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dh .dt { min-width: 0; flex: 1; }
  .dh .dt b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dh .dt span { font-size: 12px; color: var(--muted); }
  .x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .x:hover { background: var(--hover); color: var(--text); }
  .drawer iframe { flex: 1; border: 0; width: 100%; background: #fff; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1000px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; gap: 12px; padding-top: 18px; }
    .side { position: static; max-height: none; overflow: visible; gap: 10px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; scrollbar-width: none; }
    .nav button { width: auto; white-space: nowrap; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
    .nav .dot { display: none; }
    .side h3 { display: none; }
    .drawer { width: 100vw; }
  }
  @media (max-width: 560px) {
    .top-in { padding: 20px 16px 16px; }
    .recent, .main { padding-left: 16px; padding-right: 16px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .card:nth-child(n+4) { display: none; }
    .item { grid-template-columns: 1fr; gap: 8px; }
    .kbd { display: none; }
    .search { padding-right: 16px; }
  }
</style>
</head>

const items = DATA.items;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const age = (d) => (Date.parse(DATA.built) - Date.parse(d)) / 864e5;
const KINDS = ['시안', '검수', '리뷰', '문서', '가이드'];
const WHOS = ['어드민', '입점사', '고객'];
// 검색 별칭: 영문 파일명·줄임말로 쳐도 잡히게
const ALIAS = { '알리페이': 'alipay', '인박스': 'inbox 뷰티톡 상담', '예약': 'booking 예약', '로그인': 'login google', '칼럼': 'column frase', '매거진': 'magazine frase', '몽골': 'mn', '어드민': 'bo admin 운영사', '입점사': 'host', '고객': 'fo member', '검수': 'qa', '운영시간': 'hours operating' };

const S = { q: '', topic: '전체', kind: '전체', who: '전체', view: 'topic', arch: false };
try { const s = JSON.parse(localStorage.getItem('kbs-hub') || '{}'); if (s.view) S.view = s.view; } catch (e) {}
const save = () => { try { localStorage.setItem('kbs-hub', JSON.stringify({ view: S.view })); } catch (e) {} };

items.forEach((i) => {
  i.hay = [i.title, i.f, i.topic, i.kind, i.who].join(' ').toLowerCase();
  Object.entries(ALIAS).forEach(([k, v]) => { if (i.hay.includes(k.toLowerCase())) i.hay += ' ' + v; });
  i.fresh = age(i.updated) <= 7;
});
const live = items.filter((i) => !i.archived);
$('sub').textContent = `배포된 시안·검수 콘솔·문서 ${live.length}개 · ${DATA.built} 기준`;

function hl(text, q) {
  const t = esc(text); if (!q) return t;
  const words = q.split(/\s+/).filter(Boolean).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return words.length ? t.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>') : t;
}
const kindB = (k) => `<span class="b k" style="--kc:var(--c-${k})">${k}</span>`;
const whoB = (w) => (w ? `<span class="b w" style="--wc:var(--w-${w})">${w}</span>` : '');

function filtered(ignoreTopic) {
  const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return items.filter((i) =>
    (S.arch || !i.archived) &&
    (ignoreTopic || S.topic === '전체' || i.topic === S.topic) &&
    (S.kind === '전체' || i.kind === S.kind) &&
    (S.who === '전체' || i.who === S.who) &&
    words.every((w) => i.hay.includes(w)));
}
const latest = (g) => g.reduce((m, i) => (i.updated > m ? i.updated : m), '');
const byRecent = (a, b) => b.updated.localeCompare(a.updated) || a.title.localeCompare(b.title);

function renderSide() {
  const pool = filtered(true);
  const tc = {}; const tf = {};
  pool.forEach((i) => { tc[i.topic] = (tc[i.topic] || 0) + 1; if (i.fresh) tf[i.topic] = 1; });
  const topics = DATA.order.filter((t) => items.some((i) => i.topic === t));
  $('nav').innerHTML = [['전체', pool.length, pool.some((i) => i.fresh)]].concat(topics.map((t) => [t, tc[t] || 0, tf[t]]))
    .map(([t, n, f]) => `<button class="${S.topic === t ? 'on' : ''}" data-t="${esc(t)}"><span class="dot ${f ? '' : 'off'}" title="${f ? '최근 7일 안에 수정됨' : ''}"></span>${esc(t)}<span class="n">${n}</span></button>`).join('');
  $('kinds').innerHTML = ['전체', ...KINDS].map((k) => `<button class="pill ${S.kind === k ? 'on' : ''}" data-k="${k}">${k}</button>`).join('');
  $('whos').innerHTML = ['전체', ...WHOS].map((w) => `<button class="pill ${S.who === w ? 'on' : ''}" data-w="${w}">${w}</button>`).join('');
  document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.view));
}

function renderCards() {
  const show = !S.q && S.topic === '전체' && S.kind === '전체' && S.who === '전체';
  $('recentSec').style.display = show ? '' : 'none';
  if (!show) return;
  const top = live.slice().sort(byRecent).slice(0, 8);
  $('cards').innerHTML = top.map((i) => `<button class="card" data-pv="${esc(i.f)}">
    <div class="tp"><b>${esc(i.topic)}</b><span>${i.updated.slice(5).replace('-', '.')}</span></div>
    <div class="nm">${esc(i.title)}</div>
    <div class="bd">${kindB(i.kind)}${whoB(i.who)}</div></button>`).join('');
}

function row(i, q) {
  const badges = kindB(i.kind) + whoB(i.who) + (i.fresh ? '<span class="b new">최근</span>' : '') + (i.archived ? '<span class="b old">보관본</span>' : '');
  const since = i.created !== i.updated ? ` · 처음 ${i.created}` : '';
  return `<div class="item ${i.archived ? 'arch' : ''}" data-pv="${esc(i.f)}">
    <div class="it"><div class="tl"><span class="nm">${hl(i.title, q)}</span>${badges}</div>
    <div class="meta"><span class="fn">${hl(i.f, q)}</span> · 수정 ${i.updated}${since}</div></div>
    <div class="act"><button class="btn" data-copy="${esc(i.url)}">URL 복사</button><a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">새 탭 ↗</a></div></div>`;
}

function render() {
  renderSide(); renderCards();
  const list = filtered(false);
  const q = S.q.trim();
  $('count').innerHTML = `<b>${list.length}</b>개${S.topic !== '전체' ? ` · ${esc(S.topic)}` : ''}`;
  $('hint').innerHTML = q ? (list.length ? `Enter 를 누르면 첫 번째 결과 <b>${esc(list.slice().sort(byRecent)[0].title)}</b> 를 미리봐요` : '') : '';
  if (!list.length) {
    $('out').innerHTML = `<div class="empty">맞는 시안이 없어요.<br>다른 말로 찾거나 왼쪽 필터를 풀어보세요.</div>`;
    return;
  }
  if (S.view === 'recent') { $('out').innerHTML = `<div class="list" style="margin-top:12px">${list.sort(byRecent).map((i) => row(i, q)).join('')}</div>`; return; }
  const groups = {};
  list.forEach((i) => (groups[i.topic] = groups[i.topic] || []).push(i));
  const names = Object.keys(groups).sort((a, b) => latest(groups[b]).localeCompare(latest(groups[a])));
  $('out').innerHTML = names.map((t) => {
    const g = groups[t].sort(byRecent);
    const qa = items.filter((i) => i.topic === t && i.kind === '검수' && !i.archived).sort(byRecent).slice(0, 3);
    const qaHtml = qa.length && S.kind !== '검수' ? `<div class="qa">${qa.map((i) => `<a href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(i.title)}">✓ ${esc(i.title.replace(/\s*(시안 )?검수( 콘솔)?$/, '') || i.title)} 검수</a>`).join('')}</div>` : '';
    return `<div class="group" id="g-${esc(t)}"><div class="gh"><h2>${esc(t)}</h2><span class="gm">${g.length}개 · 마지막 수정 ${latest(g)}</span>${qaHtml}</div><div class="list">${g.map((i) => row(i, q)).join('')}</div></div>`;
  }).join('');
}

// 미리보기
let cur = null;
function openPv(f) {
  const i = items.find((x) => x.f === f); if (!i) return;
  cur = i;
  $('pvT').textContent = i.title;
  $('pvM').textContent = `${i.topic} · ${i.kind}${i.who ? ' · ' + i.who : ''} · 수정 ${i.updated}`;
  $('pvOpen').href = i.url;
  $('pvF').src = i.f; // 같은 저장소라 상대경로 (로컬 미리보기에서도 뜸)
  document.body.classList.add('pv-open');
  $('drawer').setAttribute('aria-hidden', 'false');
}
function closePv() { document.body.classList.remove('pv-open'); $('drawer').setAttribute('aria-hidden', 'true'); setTimeout(() => { if (!document.body.classList.contains('pv-open')) $('pvF').src = 'about:blank'; }, 260); }
function copy(url) {
  const t = $('toast');
  const done = () => { t.textContent = 'URL 복사했어요'; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1300); };
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(done, () => prompt('복사하세요', url));
}

document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]'); if (c) { e.stopPropagation(); copy(c.dataset.copy); return; }
  if (e.target.closest('a')) return;
  const b = e.target.closest('button');
  if (b && b.dataset.t) { S.topic = b.dataset.t; render(); window.scrollTo({ top: document.querySelector('.main').offsetTop - 8, behavior: 'smooth' }); return; }
  if (b && b.dataset.k) { S.kind = b.dataset.k; render(); return; }
  if (b && b.dataset.w) { S.who = b.dataset.w; render(); return; }
  if (b && b.dataset.v) { S.view = b.dataset.v; save(); render(); return; }
  const pv = e.target.closest('[data-pv]'); if (pv) openPv(pv.dataset.pv);
});
$('pvClose').onclick = closePv; $('scrim').onclick = closePv;
$('pvCopy').onclick = () => cur && copy(cur.url);
$('arch').onchange = (e) => { S.arch = e.target.checked; render(); };
$('q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { const l = filtered(false).sort(byRecent); if (l[0]) openPv(l[0].f); }
  if (e.key === 'Escape') { e.target.value = ''; S.q = ''; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('pv-open')) { closePv(); return; }
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});
render();
</script>
</body>
