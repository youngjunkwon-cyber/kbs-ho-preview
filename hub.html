  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px #0002; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h2 b { color: var(--text); font-size: 15px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--accent-soft); }
  .kind { font-size: 11px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 5px; color: var(--kc); border: 1px solid color-mix(in srgb, var(--kc) 40%, transparent); }

  .t a { color: var(--text); text-decoration: none; font-weight: 550; }

  .new { color: var(--new); font-weight: 600; font-size: 11px; margin-left: 6px; }
  .act { display: flex; gap: 6px; }

  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }

  @media (max-width: 600px) {

  const topics = ['전체', ...DATA.order.filter((t) => tc[t])];
  $('topics').innerHTML = topics.map((t) => `<button class="chip ${S.topic === t ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}<span>${t === '전체' ? items.length : tc[t]}</span></button>`).join('');
  const kinds = ['전체', '시안', '검수', '리뷰', '문서', '가이드', 'Figma'].filter((k) => k === '전체' || items.some((i) => i.kind === k));
  $('kinds').innerHTML = kinds.map((k) => `<button class="${S.kind === k ? 'on' : ''}" data-k="${k}">${k}</button>`).join('');
  document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.view));
}
function row(i) {
  const fresh = daysAgo(i.updated) <= 7 ? '<span class="new">최근</span>' : '';
  const meta = i.f ? `${esc(i.f)} · 수정 ${i.updated}${i.created && i.created !== i.updated ? ` · 처음 ${i.created}` : ''}` : esc(new URL(i.url).host);
  return `<div class="item"><span class="kind" style="--kc:var(--k-${i.kind})">${i.kind}</span>
    <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>${fresh}<div class="meta">${meta}</div></div>
    <div class="act"><button data-copy="${esc(i.url)}">URL 복사</button><button class="open" data-open="${esc(i.url)}">열기</button></div></div>`;
}
function render() {
  chips();
  const q = S.q.trim().toLowerCase();
  const list = items.filter((i) =>
    (S.topic === '전체' || i.topic === S.topic) &&
    (S.kind === '전체' || i.kind === S.kind) &&
    (!q || (i.title + ' ' + i.f + ' ' + i.topic + ' ' + i.kind).toLowerCase().includes(q)));
  const byRecent = (a, b) => (b.updated || '').localeCompare(a.updated || '') || a.title.localeCompare(b.title);
  if (!list.length) { $('out').innerHTML = '<div class="empty">맞는 시안이 없어요</div>'; return; }
  if (S.view === 'recent') { $('out').innerHTML = `<h2><b>최근 수정순</b>${list.length}개</h2><div class="list">${list.sort(byRecent).map(row).join('')}</div>`; return; }
  const groups = {};
  list.forEach((i) => (groups[i.topic] = groups[i.topic] || []).push(i));
  const latest = (g) => g.reduce((m, i) => (i.updated > m ? i.updated : m), '');
  const names = Object.keys(groups).sort((a, b) => latest(groups[b]).localeCompare(latest(groups[a])));
  $('out').innerHTML = names.map((t) => `<h2><b>${esc(t)}</b>${groups[t].length}개 · 마지막 수정 ${latest(groups[t]) || '-'}</h2><div class="list">${groups[t].sort(byRecent).map(row).join('')}</div>`).join('');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) S.topic = b.dataset.t;
  else if (b.dataset.k) S.kind = b.dataset.k;
  else if (b.dataset.v) { S.view = b.dataset.v; try { localStorage.setItem('kbs-hub', JSON.stringify({ view: S.view })); } catch (e) {} }
  else if (b.dataset.open) { window.open(b.dataset.open, '_blank', 'noopener'); return; }
  else if (b.dataset.copy) {
    const done = () => { $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1200); };
    navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy).then(done, () => prompt('복사하세요', b.dataset.copy)) : prompt('복사하세요', b.dataset.copy);
    return;
  } else return;
  render();
});
$('q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
render();
</script>
</body>
</html>
