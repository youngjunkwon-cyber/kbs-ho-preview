<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FO 카탈로그·탐색 와이어프레임</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a; --ink2:#555; --ink3:#8c8c8c; --ink4:#aeaeae;
  --line:#c9c9c9; --line2:#e4e4e4; --fill:#f0f0f0; --fill2:#f8f8f8;
}
html,body{height:100%}
body{
  font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;
  font-size:14px;color:var(--ink);background:#d9d9d9;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
}
.device{width:390px;max-width:100%;height:100vh;background:#fff;position:relative;
  display:flex;flex-direction:column;border-left:1px solid #b5b5b5;border-right:1px solid #b5b5b5}
.chrome{flex:0 0 30px;background:var(--fill);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;padding:0 10px}
.chrome .url{max-width:100%;background:#fff;border:1px solid var(--line);height:20px;padding:0 10px;
  display:flex;align-items:center;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}
.pad-nav{padding-bottom:60px}
.pad-cta{padding-bottom:122px}

/* 헤더 */
.hdr{position:sticky;top:0;z-index:30;height:50px;background:#fff;display:flex;align-items:center;
  padding:0 6px 0 4px;border-bottom:1px solid var(--line)}
.hdr-ico{width:38px;height:38px;flex:0 0 38px;border:0;background:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2)}
.hdr-ico:hover{background:var(--fill)}
.hdr-back{font-size:20px;font-weight:300;color:var(--ink)}
.hdr-title{flex:1;text-align:center;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-big{flex:1;text-align:left;padding-left:12px;font-size:17px;font-weight:700}
.hdr-logo{flex:1;font-size:13px;font-weight:700;padding-left:12px;letter-spacing:.5px}
.hdr-sp{width:38px;flex:0 0 38px}
.lang-btn{height:26px;padding:0 8px;border:1px solid var(--line);background:#fff;font-family:inherit;
  font-size:11px;color:var(--ink2);cursor:pointer;margin-right:6px;white-space:nowrap}

/* 전역 메뉴 */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;height:60px;background:#fff;
  border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:11px;color:var(--ink3);cursor:pointer;border:0;background:none;font-family:inherit}
.nav-i .sq{width:18px;height:18px;border:1px solid var(--ink4)}
.nav-i.on{color:var(--ink);font-weight:700}
.nav-i.on .sq{border-color:var(--ink);background:var(--ink)}

/* 섹션 */
.sec{padding:18px 16px}
.sec+.sec{border-top:6px solid var(--fill)}
.sec-t{font-size:14px;font-weight:700;margin-bottom:2px}
.sec-s{font-size:11.5px;color:var(--ink3);margin-bottom:12px;line-height:1.6}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-row .sec-t{margin-bottom:0}
.more{font-size:11.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;background:none;
  border:0;font-family:inherit;text-decoration:underline}

/* 검색 */
.searchbar{display:flex;align-items:center;height:40px;border:1px solid var(--line);background:var(--fill2);
  padding:0 12px;font-size:13px;color:var(--ink3);cursor:pointer}
.searchfield{display:flex;align-items:center;gap:6px;height:40px;border:1px solid var(--ink);background:#fff;padding:0 6px 0 10px}
.searchfield input{flex:1;border:0;outline:0;font:inherit;font-size:13px;color:var(--ink);background:none;min-width:0}
.clear-x{width:18px;height:18px;border:1px solid var(--line);background:#fff;color:var(--ink3);
  font-size:10px;line-height:1;cursor:pointer;flex:0 0 18px;font-family:inherit}
.go-s{height:28px;padding:0 12px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto}

/* 탐색 축 */
.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.axis{border:1px solid var(--line);padding:16px 12px;background:#fff;cursor:pointer;text-align:left;font-family:inherit}
.axis:hover{border-color:var(--ink)}
.axis .nm{font-size:14px;font-weight:700}
.axis .ct{font-size:11px;color:var(--ink3);margin-top:5px}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border:1px solid var(--line);
  background:#fff;font:inherit;font-size:12.5px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.chip.add{border-style:dashed;color:var(--ink3)}

/* 리스트 행 */
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.row:last-of-type{border-bottom:0}
.ph{border:1px solid var(--line);background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),
  linear-gradient(to bottom right,transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px)),
  var(--fill2);flex:0 0 auto}
.ph-52{width:52px;height:52px}
.ph-72{width:72px;height:72px}
.ph-84{width:84px;height:84px}
.ph-76{width:76px;height:60px}
.row-b{flex:1;min-width:0}
.row-nm{font-size:13.5px;font-weight:700;line-height:1.4}
.row-path{font-size:11px;color:var(--ink3);margin-top:3px}
.row-desc{font-size:12px;color:var(--ink3);margin-top:5px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-arrow{align-self:center;color:var(--ink4);font-size:16px;font-weight:300}
.match{display:inline-block;margin-top:5px;font-size:10.5px;color:var(--ink2);
  border:1px solid var(--line);padding:2px 6px;background:var(--fill2)}
.grp{font-size:11px;font-weight:700;color:var(--ink3);padding:14px 0 2px;letter-spacing:.5px}

/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;z-index:20}
.tab{flex:1;height:42px;display:flex;align-items:center;justify-content:center;gap:4px;font:inherit;
  font-size:13px;color:var(--ink3);cursor:pointer;border:0;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tab .n{font-size:11.5px;color:var(--ink4)}
.tab.on .n{color:var(--ink2)}
.tabs-pill{display:flex;gap:5px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line2)}
.tabs-pill::-webkit-scrollbar{display:none}
.tabs-pill .chip{height:28px;padding:0 10px;font-size:12px}

/* 정렬 */
.sortbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  border-bottom:1px solid var(--line2);gap:8px}
.count{font-size:12px;color:var(--ink3)}
.count b{color:var(--ink);font-weight:700}
.sortbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;
  color:var(--ink);border:1px solid var(--line);height:28px;padding:0 10px;background:#fff;cursor:pointer}

/* 카드 */
.pcard,.scard,.ccard{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.pcard:last-of-type,.scard:last-of-type,.ccard:last-of-type{border-bottom:0}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column}
.pstore{font-size:11px;color:var(--ink3)}
.pname{font-size:13px;font-weight:700;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ptag{font-size:10px;color:var(--ink3);border:1px solid var(--line2);background:var(--fill2);padding:2px 5px}
.pprice{margin-top:auto;padding-top:6px;font-size:14px;font-weight:700}
.pprice.none{font-size:11.5px;font-weight:500;color:var(--ink3)}
.sname{font-size:13.5px;font-weight:700}
.smeta{font-size:11.5px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ckind{font-size:10px;font-weight:700;color:var(--ink3)}
.ctitle{font-size:12.5px;font-weight:700;line-height:1.5;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:10.5px;color:var(--ink4);margin-top:5px}

/* 랜딩 */
.crumb{font-size:11px;color:var(--ink3);padding:14px 16px 0;line-height:1.6}
.crumb a{color:var(--ink3);cursor:pointer;text-decoration:underline}
.crumb .cur{color:var(--ink);font-weight:700;text-decoration:none}
.land-head{padding:8px 16px 18px}
.land-h1{font-size:20px;font-weight:700;line-height:1.35}
.land-sub{font-size:11.5px;color:var(--ink3);margin-top:6px}
.land-body{font-size:13px;color:var(--ink2);line-height:1.8;margin-top:12px}
.critbox{margin-top:14px;border:1px solid var(--line);background:var(--fill2);padding:14px}
.critbox .t{font-size:12.5px;font-weight:700;margin-bottom:8px}
.critline{display:flex;gap:7px;font-size:12px;color:var(--ink2);line-height:1.65;margin-bottom:6px}
.critline:last-child{margin-bottom:0}
.critline .b{flex:0 0 auto;color:var(--ink3)}
.rel-l{font-size:11.5px;font-weight:700;color:var(--ink3);margin-bottom:7px}
.rel-b+.rel-b{margin-top:14px}

/* 빈 상태 */
.empty{padding:32px 20px;text-align:center}
.empty .t{font-size:15px;font-weight:700}
.empty .d{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.7}
.empty-acts{margin-top:18px;display:flex;flex-direction:column;gap:7px;text-align:left}
.act{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);
  padding:12px 13px;background:#fff;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.act:hover{border-color:var(--ink)}
.act .l{font-size:12.5px;font-weight:700;color:var(--ink)}
.act .s{font-size:11px;color:var(--ink3);margin-top:3px}
.act .a{color:var(--ink4);font-size:15px;font-weight:300}
.act.primary{border-color:var(--ink)}
.unblock{border:1px solid var(--line);margin-top:14px;text-align:left}
.unblock-h{font-size:11.5px;font-weight:700;color:var(--ink3);padding:10px 13px;background:var(--fill);border-bottom:1px solid var(--line)}
.unblock-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.unblock-r:last-child{border-bottom:0}
.unblock-r .nm{font-size:12.5px;font-weight:700}
.unblock-r .nm i{font-style:normal;font-size:10.5px;color:var(--ink3);font-weight:400;display:block;margin-top:3px}
.mini{height:27px;padding:0 10px;border:1px solid var(--line);background:#fff;font:inherit;
  font-size:11.5px;color:var(--ink2);cursor:pointer;flex:0 0 auto}
.mini.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.retry{border:1px solid var(--line);background:var(--fill2);padding:20px 14px;text-align:center}
.retry .t{font-size:12.5px;color:var(--ink3);line-height:1.65}
.retry .b{margin-top:10px}
.zero{border:1px dashed var(--line);padding:20px 14px;text-align:center;background:var(--fill2)}
.zero .t{font-size:12.5px;font-weight:700;color:var(--ink2)}
.zero .d{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.65}
.zero .b{margin-top:12px}
.sk{background:var(--fill);border:1px solid var(--line2)}

/* 버튼 */
.btn{width:100%;height:44px;border:1px solid var(--line);background:#fff;font:inherit;
  font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn:hover{border-color:var(--ink)}
.btn.fill{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.fill:disabled{background:#fff;border-color:var(--line2);color:var(--ink4);cursor:default}
.btn.sm{height:38px;font-size:12.5px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta{position:absolute;left:0;right:0;bottom:60px;z-index:35;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px 12px;display:flex;gap:8px;align-items:center}
.cta-fav{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);background:#fff;
  font-size:11px;color:var(--ink2);cursor:pointer;font-family:inherit;line-height:1.2}
.cta-fav.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.cta .btn{flex:1;width:auto}

/* 조건 바 */
.condbar{position:sticky;z-index:22;background:#fff;border-bottom:1px solid var(--line);
  padding:9px 0;display:flex;align-items:center;gap:8px}
.condbar-in{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding-left:16px}
.condbar-in::-webkit-scrollbar{display:none}
.condbar-fade{flex:0 0 auto;padding:0 14px 0 10px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 12px)}
.reset{font-size:11.5px;color:var(--ink2);text-decoration:underline;white-space:nowrap;
  cursor:pointer;background:none;border:0;font-family:inherit;padding:0}

/* 조건 선택 */
.pick-l{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.box{width:18px;height:18px;flex:0 0 18px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.pick-l.on .box{background:var(--ink);border-color:var(--ink);color:#fff}
.pick-nm{font-size:13.5px;font-weight:600}
.pick-sub{font-size:11px;color:var(--ink3);margin-top:3px}
.pick-foot{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px}
.pick-grp{font-size:11px;font-weight:700;color:var(--ink3);padding:12px 16px 4px;background:var(--fill)}

/* 역·노선 */
.stn{display:flex;flex-direction:column;gap:8px}
.stn-r{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:11px 12px}
.stn-nm{font-size:13px;font-weight:700}
.line-b{font-size:10px;color:var(--ink2);border:1px solid var(--line);padding:2px 6px;white-space:nowrap;background:var(--fill2)}

/* 언어 목록 */
.lang-list{border:1px solid var(--line);margin-top:16px;text-align:left}
.lang-r{display:flex;align-items:center;justify-content:space-between;padding:13px;border-bottom:1px solid var(--line2);
  cursor:pointer;width:100%;background:#fff;border-left:0;border-right:0;border-top:0;font-family:inherit}
.lang-r:last-child{border-bottom:0}
.lang-r .nm{font-size:13px;font-weight:600}
.lang-r .a{color:var(--ink4);font-size:15px;font-weight:300}

/* 시트 */
.sheet-bg{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet{width:100%;background:#fff;border-top:1px solid var(--line);padding:4px 0 10px;max-height:70%;overflow-y:auto}
.sheet-h{font-size:13px;font-weight:700;padding:14px 16px 6px;color:var(--ink3)}
.sheet-i{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;font-size:13.5px;
  cursor:pointer;width:100%;background:none;border:0;font-family:inherit;text-align:left;color:var(--ink)}
.sheet-i.on{font-weight:700}

/* 기타 */
.hero-home{padding:20px 16px 22px;border-bottom:6px solid var(--fill)}
.hero-home .t{font-size:19px;font-weight:700;line-height:1.4}
.hero-home .s{font-size:12px;color:var(--ink3);margin-top:7px}
.login-wrap{padding:36px 24px}
.login-wrap .t{font-size:19px;font-weight:700}
.login-wrap .d{font-size:12.5px;color:var(--ink3);margin-top:8px;line-height:1.7}
.fld{margin-top:16px}
.fld label{font-size:11.5px;font-weight:700;color:var(--ink3);display:block;margin-bottom:5px}
.fld .inp{height:42px;border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;
  font-size:13px;color:var(--ink3);background:var(--fill2)}
.toast{position:absolute;left:16px;right:16px;bottom:74px;z-index:70;background:var(--ink);color:#fff;
  padding:12px 14px;font-size:12.5px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="device">
  <div class="chrome"><div class="url" id="urlText">k-beautystation.com</div></div>
  <div class="viewport" id="vp"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   데이터. pub = 해당 정본이 공개된 언어. 현재 언어가 없으면 그 언어에 미공개.
   ═══════════════════════════════════════════════════════════ */
var LANGS = [['en','영어'],['ja','일본어'],['zh','중국어(간체)'],['zhtw','중국어(번체)']];
var ALL4 = ['en','ja','zh','zhtw'];

function buildSeed(){
return {
categories:[
 {id:'C1',slug:'skin-care',parent:null,status:'공개',pub:ALL4,n:'스킨케어',
  d:'피부 톤과 결, 수분 상태를 다루는 시술 묶음입니다. 대부분 여러 회차를 한 프로그램으로 잡습니다.'},
 {id:'C11',slug:'laser',parent:'C1',status:'공개',pub:ALL4,n:'레이저',d:'파장과 작용 깊이로 나뉘는 레이저 장비 시술입니다.'},
 {id:'C12',slug:'skin-booster',parent:'C1',status:'공개',pub:['en','ja','zh'],n:'스킨부스터',d:'cc 단위로 주사하는 부스터 시술입니다. 레이저 프로그램과 함께 묶는 경우가 많습니다.'},
 {id:'C13',slug:'microneedling',parent:'C1',status:'공개',pub:['en','ja'],n:'마이크로니들링',d:'니들 기반 장비 시술로, 회차와 부위 단위로 가격이 정해집니다.'},
 {id:'C2',slug:'lifting-contouring',parent:null,status:'공개',pub:ALL4,n:'리프팅·윤곽',
  d:'초음파, 고주파, 실을 써서 피부 탄력과 얼굴 라인을 다루는 시술입니다. 한국 병원은 보통 사용하는 장비와 유지 기간을 기준으로 묶어서 안내합니다.'},

function ST(id){ return byId(DB.stores,id); }
function PR(id){ return byId(DB.products,id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function langLabel(c){ for(var i=0;i<LANGS.length;i++) if(LANGS[i][0]===c) return LANGS[i][1]; return c; }

/* 현재 언어에 공개된 정본만 명칭을 돌려준다 */
function pubOK(e){ return !!(e && e.pub && e.pub.indexOf(VIEW.lang)>=0); }
function nm(e){ return pubOK(e) ? e.n : null; }
function dsc(e){ return pubOK(e) ? e.d : null; }

/* ═══ 판정 로직 (순수 함수) ═══ */
function judgeEntity(e, parentGetter){
  if(!e) return {ok:false, why:'notfound'};
  if(e.status!=='공개') return {ok:false, why:'notfound'};
  if(!pubOK(e)) return {ok:false, why:'lang', langs:e.pub.slice()};
  if(e.parent){
    var p = parentGetter(e.parent);
    if(!p || p.status!=='공개') return {ok:false, why:'notfound'};
    if(!pubOK(p)) return {ok:false, why:'lang', langs:e.pub.filter(function(l){ return p.pub.indexOf(l)>=0; })};
  }
  return {ok:true};
}
function judgeCat(c){ return judgeEntity(c, C); }
function judgePlace(p){ return judgeEntity(p, P); }
function judgeInterest(x){ return judgeEntity(x, function(){ return null; }); }
function judgeService(s){
  if(!s) return {ok:false, why:'notfound'};
  if(s.status!=='공개') return {ok:false, why:'notfound'};
  if(!pubOK(s)) return {ok:false, why:'lang', langs:s.pub.slice()};
  var rep = C(s.rep), j = judgeCat(rep);
  if(!j.ok) return j.why==='lang'
    ? {ok:false, why:'lang', langs:s.pub.filter(function(l){ return rep.pub.indexOf(l)>=0; })}
    : {ok:false, why:'notfound'};
  return {ok:true};
}
function visibleServices(){ return DB.services.filter(function(s){ return judgeService(s).ok; }); }
function visibleCats(){ return DB.categories.filter(function(c){ return judgeCat(c).ok; }); }
function visibleInterests(t){ return DB.interests.filter(function(x){ return x.type===t && judgeInterest(x).ok; }); }

function approvedIds(p){ return p.links.filter(function(l){ return l.r==='승인'; }).map(function(l){ return l.s; }); }
function productVisible(p){
  if(p.status!=='공개') return false;
  var st = ST(p.store);
  if(!st || st.status!=='공개' || !st.reviewed) return false;
  return approvedIds(p).some(function(id){ return judgeService(S(id)).ok; });
}
function storeVisible(st){
  if(st.status!=='공개' || !st.reviewed) return false;
  return DB.products.some(function(p){ return p.store===st.id && productVisible(p); });
}
function productsOfService(sid){ return DB.products.filter(function(p){ return productVisible(p) && approvedIds(p).indexOf(sid)>=0; }); }
function storesOfService(sid){
  var out=[], seen={};
  productsOfService(sid).forEach(function(p){ if(!seen[p.store]){ seen[p.store]=1; var s=ST(p.store); if(storeVisible(s)) out.push(s); } });
  return out;
}
function servicesOfCat(cid){ return visibleServices().filter(function(s){ return catMatches(s.cats, cid); }); }
function servicesOfInterest(iid){ return visibleServices().filter(function(s){ return s.itr.indexOf(iid)>=0 || s.body.indexOf(iid)>=0; }); }
function servicesOfPlace(pid){
  var out=[], seen={};
  DB.products.forEach(function(p){
    if(!productVisible(p) || !placeMatches(ST(p.store).place, pid)) return;
    approvedIds(p).forEach(function(sid){ if(judgeService(S(sid)).ok && !seen[sid]){ seen[sid]=1; out.push(S(sid)); } });
  });
  return out;
}
function placeMatches(storePlaceId, condId){
  var cur = P(storePlaceId);
  while(cur){ if(cur.id===condId) return true; cur = cur.parent?P(cur.parent):null; }
  return false;
}
function catMatches(cats, condId){
  for(var i=0;i<cats.length;i++){
    var cur = C(cats[i]);
    while(cur){ if(cur.id===condId) return true; cur = cur.parent?C(cur.parent):null; }
  }
  return false;
}

/* 관련 콘텐츠: 원문 승인·공개 + 현재 언어 공개 + 연결 대상 공개. 중복은 1회 */
function contentsFor(kind, id){
  var out=[], seen={};
  DB.contents.forEach(function(c){
    if(seen[c.id]) return;
    if(c.status!=='공개') return;
    if(c.lang!==VIEW.lang) return;
    var linked = kind==='svc' ? c.svc.indexOf(id)>=0 : c.itr.indexOf(id)>=0;
    if(!linked) return;
    var t = kind==='svc' ? judgeService(S(id)) : judgeInterest(I(id));
    if(!t.ok) return;
    seen[c.id]=1; out.push(c);
  });
  return out;
}

/* 조건 결과. 같은 축 OR, 다른 축 AND */
function byAxis(conds){ var g={}; conds.forEach(function(c){ (g[c.axis]=g[c.axis]||[]).push(c.id); }); return g; }
function serviceMatches(s, conds){
  var g = byAxis(conds);
  if(g.cat && !g.cat.some(function(id){ return catMatches(s.cats,id); })) return false;
  if(g.itr && !g.itr.some(function(id){ return s.itr.indexOf(id)>=0; })) return false;
  if(g.body && !g.body.some(function(id){ return s.body.indexOf(id)>=0; })) return false;
  if(g.svc && g.svc.indexOf(s.id)<0) return false;
  if(g.plc && !g.plc.some(function(id){
      return productsOfService(s.id).some(function(p){ return placeMatches(ST(p.store).place,id); }); })) return false;
  return true;
}
function resultServices(conds){ return visibleServices().filter(function(s){ return serviceMatches(s,conds); }); }
function resultProducts(conds){
  var g = byAxis(conds);
  var rest = conds.filter(function(c){ return c.axis!=='plc'; });
  return DB.products.filter(function(p){
    if(!productVisible(p)) return false;
    if(g.plc && !g.plc.some(function(id){ return placeMatches(ST(p.store).place,id); })) return false;
    if(!rest.length) return true;
    return approvedIds(p).map(S).filter(function(s){ return judgeService(s).ok; })
      .some(function(s){ return serviceMatches(s, rest); });
  });
}
function resultStores(conds){
  var g = byAxis(conds);
  var rest = conds.filter(function(c){ return c.axis!=='plc'; });
  return DB.stores.filter(function(st){
    if(!storeVisible(st)) return false;
    if(g.plc && !g.plc.some(function(id){ return placeMatches(st.place,id); })) return false;
    if(!rest.length) return true;
    return DB.products.some(function(p){
      if(p.store!==st.id || !productVisible(p)) return false;
      return approvedIds(p).map(S).filter(function(s){ return judgeService(s).ok; })
        .some(function(s){ return serviceMatches(s, rest); });
    });
  });
}
function countTab(conds, tab){
  return tab==='service' ? resultServices(conds).length
       : tab==='store'   ? resultStores(conds).length
       : resultProducts(conds).length;
}
function sortProducts(list, sort){
  var a = list.slice();
  if(sort==='views') a.sort(function(x,y){ return y.views-x.views; });
  else if(sort==='pop') a.sort(function(x,y){ return y.pop-x.pop; });
  else {
    var priced = a.filter(function(p){ return p.price!=null; });
    var none = a.filter(function(p){ return p.price==null; });
    priced.sort(function(x,y){ return sort==='asc' ? x.price-y.price : y.price-x.price; });
    a = priced.concat(none);
  }
  return a;
}

/* 정본 검색. 동의어는 별도 결과를 만들지 않고 연결된 서비스 행에 표시 */
function searchCanonical(q){
  var s = String(q||'').trim().toLowerCase();
  var out = {service:[], concern:[], category:[], place:[]};
  if(!s) return out;
  visibleServices().forEach(function(sv){
    if(sv.n.toLowerCase().indexOf(s)>=0){ out.service.push({e:sv, by:'name'}); return; }
    var hit = sv.syn.filter(function(t){ return t.toLowerCase().indexOf(s)>=0; })[0];
    if(hit) out.service.push({e:sv, by:'syn', syn:hit});
  });
  visibleInterests('concern').concat(visibleInterests('body')).forEach(function(x){
    if(x.n.toLowerCase().indexOf(s)>=0) out.concern.push({e:x, by:'name'});
  });
  visibleCats().forEach(function(c){ if(c.n.toLowerCase().indexOf(s)>=0) out.category.push({e:c, by:'name'}); });
  DB.places.filter(function(p){ return p.type!=='line' && judgePlace(p).ok; })
    .forEach(function(p){ if(p.n.toLowerCase().indexOf(s)>=0) out.place.push({e:p, by:'name'}); });
  return out;
}

function catPath(cid){ var a=[],c=C(cid); while(c){ a.unshift(nm(c)||c.n); c=c.parent?C(c.parent):null; } return a.join(' > '); }
function placePath(pid){ var a=[],p=P(pid); while(p){ a.unshift(nm(p)||p.n); p=p.parent?P(p.parent):null; } return a.join(' > '); }
function won(v){ return v==null ? null : v.toLocaleString('ko-KR')+'원'; }

/* URL */
function urlOf(){
  var b='k-beautystation.com/'+VIEW.lang;
  switch(VIEW.route){
    case 'home': return b;
    case 'explore': return b+'/explore';
    case 'pick': return b+'/explore';
    case 'search': return b+'/explore/search'+(VIEW.qSubmitted?'?q='+encodeURIComponent(VIEW.qSubmitted):'');
    case 'results': return b+'/explore/results';
    case 'cat': return b+'/categories/'+(C(VIEW.id)?C(VIEW.id).slug:'');
    case 'svc': return b+'/services/'+(S(VIEW.id)?S(VIEW.id).slug:'');
    case 'itr': return b+'/interests/'+(I(VIEW.id)?I(VIEW.id).slug:'');
    case 'plc': return b+'/places/'+(P(VIEW.id)?P(VIEW.id).slug:'');
    case 'products': return b+'/products';
    case 'stores': return b+'/stores';
    case 'pdetail': return b+'/products/'+VIEW.id;
    case 'sdetail': return b+'/stores/'+VIEW.id;
    case 'saved': return b+'/saved';
    case 'my': return b+'/my';
    case 'login': return b+'/login';
    case 'unavailable': case 'notfound':
      var L = VIEW.lastLanding;
      if(!L) return b+'/explore';
      var seg = {cat:'categories',svc:'services',itr:'interests',plc:'places'}[L.route];
      var e = L.route==='cat'?C(L.id):L.route==='svc'?S(L.id):L.route==='itr'?I(L.id):P(L.id);
      return b+'/'+seg+'/'+(e?e.slug:'');
    default: return b+'/explore';
  }
}

/* ═══ 이동 ═══ */
function go(route, id){
  VIEW.sheet=null; VIEW.toast='';
  if(route==='cat'||route==='svc'||route==='itr'||route==='plc'){
    VIEW.lastLanding = {route:route, id:id};
    var e = route==='cat'?C(id) : route==='svc'?S(id) : route==='itr'?I(id) : P(id);
    var j = route==='cat'?judgeCat(e) : route==='svc'?judgeService(e) : route==='itr'?judgeInterest(e) : judgePlace(e);
    if(!j.ok){
      VIEW.route = j.why==='lang' ? 'unavailable' : 'notfound';
      VIEW.altLangs = j.langs || [];
      render(); return;
    }
  }
  if(route==='results') VIEW.page=1;
  VIEW.route = route; VIEW.id = (id==null?null:id);
  render();
}
function setLang(c){ VIEW.lang=c; VIEW.sheet=null;
  if(VIEW.route==='unavailable' && VIEW.lastLanding){ go(VIEW.lastLanding.route, VIEW.lastLanding.id); return; }
  if(['cat','svc','itr','plc'].indexOf(VIEW.route)>=0){ go(VIEW.route, VIEW.id); return; }
  VIEW.conds = VIEW.conds.filter(function(cd){
    var e = cd.axis==='cat'?C(cd.id) : cd.axis==='plc'?P(cd.id) : cd.axis==='svc'?S(cd.id) : I(cd.id);
    return pubOK(e);
  });
  render();
}
function addCond(axis,id){ if(!VIEW.conds.some(function(c){return c.axis===axis&&c.id===id;})) VIEW.conds.push({axis:axis,id:id}); }
function removeCond(axis,id){
  VIEW.conds = VIEW.conds.filter(function(c){ return !(c.axis===axis&&c.id===id); });
  if(!VIEW.conds.length){ go('explore'); return; }
  VIEW.page=1; render();
}
function condName(c){
  var e = c.axis==='cat'?C(c.id) : c.axis==='plc'?P(c.id) : c.axis==='svc'?S(c.id) : I(c.id);
  return (e && e.n) || c.id;
}
function setTab(t){ VIEW.tab=t; VIEW.page=1; if(t!=='product'&&(VIEW.sort==='asc'||VIEW.sort==='desc')) VIEW.sort='views'; render(); }
function setSort(s){ VIEW.sort=s; VIEW.page=1; VIEW.sheet=null; render(); }
function openSearch(q){ VIEW.route='search'; VIEW.q=q||''; VIEW.qSubmitted=q||''; VIEW.stype='all'; render(); }
function submitSearch(){
  var v = String(VIEW.q||'').trim();
  if(!v){ VIEW.toast='검색어를 입력해 주세요.'; render(); return; }
  VIEW.qSubmitted=v; VIEW.stype='all'; render();
}
function applyConds(conds, tab){ VIEW.conds=conds; VIEW.tab=tab||'product'; go('results'); }
function isSaved(k,id){ return VIEW.saved.some(function(s){ return s.kind===k&&s.id===id; }); }
function toggleSave(k,id){
  if(!VIEW.loggedIn){
    VIEW.pending={kind:k,id:id}; VIEW.ret={route:VIEW.route,id:VIEW.id};
    VIEW.route='login'; render(); return;
  }
  if(isSaved(k,id)) VIEW.saved = VIEW.saved.filter(function(s){ return !(s.kind===k&&s.id===id); });
  else { VIEW.saved.push({kind:k,id:id}); VIEW.toast='저장했습니다.'; }
  render();
}
function doLogin(){
  VIEW.loggedIn=true;
  if(VIEW.ret){ VIEW.route=VIEW.ret.route; VIEW.id=VIEW.ret.id; VIEW.ret=null; }
  if(VIEW.pending){
    if(!isSaved(VIEW.pending.kind,VIEW.pending.id)) VIEW.saved.push(VIEW.pending);
    VIEW.toast='저장했습니다.'; VIEW.pending=null;
  }
  render();
}
function cancelLogin(){
  if(VIEW.ret){ VIEW.route=VIEW.ret.route; VIEW.id=VIEW.ret.id; VIEW.ret=null; } else VIEW.route='explore';
  VIEW.pending=null; render();
}
function navTo(r){
  if((r==='saved'||r==='my') && !VIEW.loggedIn){ VIEW.ret={route:r,id:null}; VIEW.pending=null; VIEW.route='login'; render(); return; }
  go(r);
}
function setFail(a,on){ VIEW.fail[a]=!!on; render(); }
function back(){
  if(VIEW.route==='pick' && VIEW.conds.length) { go('results'); return; }
  go('explore');
}

    case 'stores': body=viewList('stores'); break;

    case 'sdetail': body=viewSdetail(); break;

  vp.innerHTML = body + (VIEW.sheet?sheet():'') + (VIEW.toast?'<div class="toast">'+esc(VIEW.toast)+'</div>':'');

function openPick(axis){
  VIEW.pickAxis=axis;
  VIEW.pickSel = VIEW.conds.filter(function(c){ return c.axis===axis; }).map(function(c){ return c.id; });
  VIEW.route='pick'; render();
}
function pickToggle(id){ var i=VIEW.pickSel.indexOf(id); if(i>=0) VIEW.pickSel.splice(i,1); else VIEW.pickSel.push(id); render(); }
function pickDirty(){
  var cur = VIEW.conds.filter(function(c){ return c.axis===VIEW.pickAxis; }).map(function(c){ return c.id; }).sort().join(',');
  return cur !== VIEW.pickSel.slice().sort().join(',');
}
function pickApply(){
  var ax=VIEW.pickAxis;
  VIEW.conds = VIEW.conds.filter(function(c){ return c.axis!==ax; });
  VIEW.pickSel.forEach(function(id){ VIEW.conds.push({axis:ax,id:id}); });
  if(!VIEW.conds.length){ go('explore'); return; }
  VIEW.page=1; go('results');
}
function viewPick(){
  var ax=VIEW.pickAxis, title='', items=[];
  if(ax==='cat'){
    title='분류';
    visibleCats().filter(function(c){ return !c.parent; }).forEach(function(c){
      items.push({grp:c.n, id:c.id, nm:c.n+' 전체', sub:''});
      visibleCats().filter(function(x){ return x.parent===c.id; }).forEach(function(x){ items.push({grp:c.n, id:x.id, nm:x.n, sub:''}); });
    });
  } else if(ax==='itr'){ title='고민'; visibleInterests('concern').forEach(function(x){ items.push({grp:'고민', id:x.id, nm:x.n, sub:''}); });
  } else if(ax==='body'){ title='부위'; visibleInterests('body').forEach(function(x){ items.push({grp:'부위', id:x.id, nm:x.n, sub:''}); });
  } else if(ax==='plc'){
    title='지역';
    DB.places.filter(function(p){ return p.type==='region' && judgePlace(p).ok; }).forEach(function(r){
      items.push({grp:r.n, id:r.id, nm:r.n+' 전체', sub:''});
      DB.places.filter(function(p){ return p.parent===r.id && p.type==='area' && judgePlace(p).ok; })
        .forEach(function(a){ items.push({grp:r.n, id:a.id, nm:a.n, sub:''}); });
    });
  } else {
    title='서비스';
    visibleServices().forEach(function(s){ items.push({grp:'서비스', id:s.id, nm:s.n, sub:catPath(s.rep), link:true}); });
  }

  var html='', last=null;
  if(!items.length){
    html = '<div class="empty" style="padding-top:60px"><div class="t">이 언어로 공개된 항목이 없습니다</div>'+
      '<div class="d">다른 언어를 고르거나 전체 목록에서 찾아보세요.</div>'+
      '<div class="empty-acts">'+act('화면 언어 바꾸기','현재 언어에 공개된 정본만 보여 줍니다','VIEW.sheet=\'lang\';render()',true)+
      act('전체 상품 보기','조건 없이 전체 목록으로 이동','go(\'products\')')+'</div></div>';
  } else {
    items.forEach(function(it){
      if(it.grp!==last){ html += '<div class="pick-grp">'+esc(it.grp)+'</div>'; last=it.grp; }
      if(it.link){
        html += '<button class="pick-l" onclick="go(\'svc\',\''+it.id+'\')"><div class="row-b">'+
          '<div class="pick-nm">'+esc(it.nm)+'</div><div class="pick-sub">'+esc(it.sub)+'</div></div>'+
          '<div class="row-arrow">&gt;</div></button>';
      } else {
        var on = VIEW.pickSel.indexOf(it.id)>=0;
        html += '<button class="pick-l'+(on?' on':'')+'" onclick="pickToggle(\''+it.id+'\')">'+
          '<div class="box">V</div><div class="row-b"><div class="pick-nm">'+esc(it.nm)+'</div></div></button>';
      }
    });
  }

  var isSvc = ax==='svc';
  return '<div class="scroll" style="'+(isSvc?'padding-bottom:60px':'padding-bottom:76px')+'">'+hdrBack(title)+html+'</div>'+
    (isSvc ? navBar('explore')
      : '<div class="pick-foot"><button class="btn fill" '+(pickDirty()?'':'disabled')+' onclick="pickApply()">'+
        (VIEW.pickSel.length ? VIEW.pickSel.length+'개 조건 적용' : (VIEW.conds.some(function(c){return c.axis===VIEW.pickAxis}) ? '이 조건 해제' : '항목을 선택하세요'))+'</button></div>');
}

function viewSvc(){
  var s=S(VIEW.id);
  var prods = productsOfService(s.id);
  var strs = storesOfService(s.id);
  var cts = contentsFor('svc', s.id);
  var itrs = s.itr.map(I).filter(function(x){ return x && judgeInterest(x).ok; });
  var bodies = s.body.map(I).filter(function(x){ return x && judgeInterest(x).ok; });
  var similar = visibleServices().filter(function(x){ return x.id!==s.id && x.rep===s.rep; });
  visibleServices().forEach(function(x){
    if(similar.length>=3) return;
    if(x.id!==s.id && similar.indexOf(x)<0 && x.cats.some(function(cc){ return s.cats.indexOf(cc)>=0; })) similar.push(x);
  });
  similar = similar.slice(0,3);
  var places=[], seenPl={};
  prods.forEach(function(p){ var pl=P(ST(p.store).place); if(pl && judgePlace(pl).ok && !seenPl[pl.id]){ seenPl[pl.id]=1; places.push(pl); } });

  var rep = C(s.rep);
  var chain=[], cu=rep;
  while(cu){ chain.unshift(cu); cu = cu.parent?C(cu.parent):null; }
  var crumb = '<a onclick="go(\'explore\')">탐색</a> &gt; '+
    chain.map(function(x){ return '<a onclick="go(\'cat\',\''+x.id+'\')">'+esc(x.n)+'</a>'; }).join(' &gt; ')+
    ' &gt; <span class="cur">'+esc(s.n)+'</span>';

  var rel='';
  if(itrs.length) rel += relBlock('관련 고민', itrs, 'itr');
  if(bodies.length) rel += relBlock('관련 부위', bodies, 'itr');
  if(similar.length) rel += relBlock('비슷한 서비스', similar, 'svc');
  if(places.length) rel += relBlock('제공 지역', places, 'plc');

  var content='';
  if(VIEW.fail.content){
    content = '<div class="sec"><div class="sec-t" style="margin-bottom:12px">관련 글</div>'+
      '<div class="retry"><div class="t">관련 글을 불러오지 못했습니다.</div>'+
      '<div class="b"><button class="mini on" onclick="setFail(\'content\',false)">다시 시도</button></div></div></div>';
  } else if(cts.length){
    content = '<div class="sec"><div class="sec-t" style="margin-bottom:12px">관련 글</div>'+cts.map(contentCard).join('')+'</div>';
  }

  var saved = isSaved('svc', s.id);
  var cta = '<div class="cta"><button class="cta-fav'+(saved?' on':'')+'" onclick="toggleSave(\'svc\',\''+s.id+'\')">'+(saved?'저장됨':'저장')+'</button>'+
    (prods.length
      ? '<button class="btn fill" onclick="applyConds([{axis:\'svc\',id:\''+s.id+'\'}],\'product\')">상품 '+prods.length+'건 보기</button>'
      : '<button class="btn" onclick="go(\'cat\',\''+s.rep+'\')">'+esc(rep.n)+' 분류로</button>')+'</div>';

  return '<div class="scroll pad-nav pad-cta">'+hdrBack(s.n)+
    '<div class="crumb">'+crumb+'</div>'+
    '<div class="land-head"><div class="land-h1">'+esc(s.n)+'</div>'+
    '<div class="land-sub">'+esc(rep.n)+(s.syn.length?' · 다른 이름: '+esc(s.syn.join(', ')):'')+'</div>'+
    '<div class="land-body">'+esc(s.d)+'</div>'+
    (s.crit.length ? '<div class="critbox"><div class="t">고르기 전에 확인할 것</div>'+
      s.crit.map(function(x){ return '<div class="critline"><span class="b">·</span><span>'+esc(x)+'</span></div>'; }).join('')+'</div>' : '')+
    '</div>'+
    (rel ? '<div class="sec" style="border-top:6px solid var(--fill)"><div class="sec-t" style="margin-bottom:14px">관련 정보</div>'+rel+'</div>' : '')+
    (prods.length
      ? '<div class="sec"><div class="sec-row"><div class="sec-t">이 서비스가 포함된 상품</div>'+
        '<button class="more" onclick="applyConds([{axis:\'svc\',id:\''+s.id+'\'}],\'product\')">전체 '+prods.length+'건</button></div>'+
        prods.slice(0,2).map(productCard).join('')+'</div>'
      : '<div class="sec"><div class="sec-t" style="margin-bottom:12px">이 서비스가 포함된 상품</div>'+
        '<div class="zero"><div class="t">아직 등록된 상품이 없습니다</div>'+
        '<div class="d">이 서비스를 파는 스토어가 아직 없습니다.<br>비슷한 서비스에는 상품이 있습니다.</div>'+
        (similar.length?'<div class="b"><button class="mini on" onclick="go(\'svc\',\''+similar[0].id+'\')">'+esc(similar[0].n)+' 보기</button></div>':'')+
        '</div></div>')+
    (strs.length
      ? '<div class="sec"><div class="sec-row"><div class="sec-t">제공 스토어</div>'+
        '<button class="more" onclick="applyConds([{axis:\'svc\',id:\''+s.id+'\'}],\'store\')">전체 '+strs.length+'건</button></div>'+
        strs.slice(0,2).map(storeCard).join('')+'</div>'
      : '<div class="sec"><div class="sec-t" style="margin-bottom:12px">제공 스토어</div>'+
        '<div class="zero"><div class="t">아직 등록된 스토어가 없습니다</div>'+
        '<div class="d">이 서비스를 제공하는 스토어가 아직 없습니다.<br>아래에서 같은 분류로 이동할 수 있습니다.</div>'+
        '</div></div>')+
    content+'</div>'+cta+navBar('explore');
}
function relBlock(label, arr, route){
  return '<div class="rel-b"><div class="rel-l">'+label+'</div><div class="chips">'+
    arr.map(function(x){ return '<button class="chip" onclick="go(\''+route+'\',\''+x.id+'\')">'+esc(x.n)+'</button>'; }).join('')+
    '</div></div>';
}

/* ── 관심사 랜딩 ── */
function viewItr(){
  var x=I(VIEW.id);
  var svcs = servicesOfInterest(x.id);
  var prods=[], seen={};
  svcs.forEach(function(s){ productsOfService(s.id).forEach(function(p){ if(!seen[p.id]){seen[p.id]=1;prods.push(p);} }); });
  var strs=[], seenS={};
  prods.forEach(function(p){ if(!seenS[p.store]){ seenS[p.store]=1; var st=ST(p.store); if(storeVisible(st)) strs.push(st); } });
  var cts = contentsFor('itr', x.id);
  var axis = x.type==='body'?'body':'itr';
  var label = x.type==='body'?'부위':'고민';

  return '<div class="scroll pad-nav">'+hdrBack(x.n)+
    '<div class="crumb"><a onclick="go(\'explore\')">탐색</a> &gt; <a onclick="openPick(\''+axis+'\')">'+label+'</a> &gt; <span class="cur">'+esc(x.n)+'</span></div>'+
    '<div class="land-head"><div class="land-h1">'+esc(x.n)+'</div>'+
    '<div class="land-sub">서비스 '+svcs.length+' · 상품 '+prods.length+' · 스토어 '+strs.length+'</div>'+
    '<div class="land-body">'+esc(x.d)+'</div></div>'+
    (svcs.length ? '<div class="sec" style="border-top:6px solid var(--fill)"><div class="sec-row"><div class="sec-t">이 '+label+'에 해당하는 서비스</div>'+
      '<button class="more" onclick="applyConds([{axis:\''+axis+'\',id:\''+x.id+'\'}],\'service\')">전체 '+svcs.length+'건</button></div>'+
      svcs.slice(0,3).map(serviceResultRow).join('')+'</div>' : '')+
    secProducts(prods, axis, x.id)+secStores(strs, axis, x.id)+
    (cts.length ? '<div class="sec"><div class="sec-t" style="margin-bottom:12px">관련 글</div>'+cts.map(contentCard).join('')+'</div>' : '')+
    '</div>'+navBar('explore');
}

/* ── 장소 랜딩 ── */
function viewPlc(){
  var p=P(VIEW.id);
  var svcs = servicesOfPlace(p.id);
  var strs = DB.stores.filter(function(st){ return storeVisible(st) && placeMatches(st.place,p.id); });
  var prods = DB.products.filter(function(x){ return productVisible(x) && placeMatches(ST(x.store).place,p.id); });
  var stations = (p.stations||[]).map(P).filter(function(t){ return t && judgePlace(t).ok; });
  var nearby = DB.places.filter(function(x){ return x.type==='area' && x.parent===p.parent && x.id!==p.id && judgePlace(x).ok; });

  var chain=[], cu=p;
  while(cu){ chain.unshift(cu); cu = cu.parent?P(cu.parent):null; }
  var crumb = '<a onclick="go(\'explore\')">탐색</a> &gt; <a onclick="openPick(\'plc\')">지역</a> &gt; '+
    chain.map(function(x,i){ return i===chain.length-1 ? '<span class="cur">'+esc(x.n)+'</span>' : '<a onclick="go(\'plc\',\''+x.id+'\')">'+esc(x.n)+'</a>'; }).join(' &gt; ');

  var cta = strs.length
    ? '<div class="cta"><button class="btn fill" onclick="applyConds([{axis:\'plc\',id:\''+p.id+'\'}],\'product\')">'+esc(p.n)+' 조건으로 결과 보기</button></div>' : '';

  return '<div class="scroll pad-nav'+(cta?' pad-cta':'')+'">'+hdrBack(p.n)+
    '<div class="crumb">'+crumb+'</div>'+
    '<div class="land-head"><div class="land-h1">'+esc(p.n)+'</div>'+
    '<div class="land-sub">'+esc(placePath(p.id))+' · 스토어 '+strs.length+' · 상품 '+prods.length+'</div>'+
    '<div class="land-body">'+esc(p.d)+'</div></div>'+
    ((stations.length||nearby.length) ? '<div class="sec" style="border-top:6px solid var(--fill)">'+
      (stations.length ? '<div class="sec-t" style="margin-bottom:12px">오는 길</div><div class="stn">'+
        stations.map(function(t){
          return '<div class="stn-r"><div class="row-b"><div class="stn-nm">'+esc(t.n)+'</div>'+
            '</div>'+
            (t.lines||[]).map(function(l){ return '<span class="line-b">'+esc(P(l).n)+'</span>'; }).join('')+'</div>';
        }).join('')+'</div>' : '')+
      (nearby.length ? '<div style="margin-top:'+(stations.length?'14px':'0')+'"><div class="rel-l">가까운 지역</div><div class="chips">'+
        nearby.map(function(x){ return '<button class="chip" onclick="go(\'plc\',\''+x.id+'\')">'+esc(x.n)+'</button>'; }).join('')+'</div></div>' : '')+
      '</div>' : '')+
    (svcs.length ? '<div class="sec"><div class="sec-row"><div class="sec-t">이 지역에서 많이 찾는 서비스</div>'+
      '<button class="more" onclick="applyConds([{axis:\'plc\',id:\''+p.id+'\'}],\'service\')">전체 '+svcs.length+'건</button></div>'+
      '<div class="chips">'+svcs.slice(0,6).map(function(s){ return '<button class="chip" onclick="go(\'svc\',\''+s.id+'\')">'+esc(s.n)+'</button>'; }).join('')+'</div></div>' : '')+
    (strs.length
      ? '<div class="sec"><div class="sec-row"><div class="sec-t">'+esc(p.n)+' 스토어</div>'+
        '<button class="more" onclick="applyConds([{axis:\'plc\',id:\''+p.id+'\'}],\'store\')">전체 '+strs.length+'건</button></div>'+
        strs.slice(0,3).map(storeCard).join('')+'</div>'
      : '<div class="sec"><div class="sec-t" style="margin-bottom:12px">스토어</div>'+
        '<div class="zero"><div class="t">아직 등록된 스토어가 없습니다</div>'+
        '<div class="d">이 지역에는 검수를 마친 스토어가 아직 없습니다.</div>'+
        '<div class="b"><button class="mini" onclick="openPick(\'plc\')">다른 지역 고르기</button></div></div></div>')+
    '</div>'+cta+navBar('explore');
}

/* ── 기존 목록·상세 ── */
function viewList(kind){
  var title = kind==='products'?'상품':'스토어';
  var items = kind==='products' ? DB.products.filter(productVisible) : DB.stores.filter(storeVisible);
  return '<div class="scroll pad-nav">'+hdrBack(title)+
    '<div class="sortbar"><div class="count"><b>'+items.length+'</b>'+(kind==='products'?'개 상품':'개 스토어')+'</div>'+
    '<button class="sortbtn">조회순 v</button></div>'+
    '<div style="padding:0 16px 16px">'+items.map(kind==='products'?productCard:storeCard).join('')+'</div>'+
    '</div>'+navBar('explore');
}
function viewPdetail(){
  var p=PR(VIEW.id); if(!p) return viewNotFound();
  var st=ST(p.store), saved=isSaved('product',p.id);
  return '<div class="scroll pad-nav pad-cta">'+hdrBack(p.n)+
    '<div class="ph" style="height:180px;border-left:0;border-right:0"></div>'+
    '<div class="land-head"><div class="pstore" style="font-size:12px">'+esc(st.name)+'</div>'+
    '<div class="land-h1" style="font-size:17px;margin-top:6px">'+esc(p.n)+'</div>'+
    '<div class="pprice" style="margin-top:14px;font-size:19px">'+(p.price==null?'상담 후 결정':won(p.price))+'</div></div>'+
    '<div class="sec" style="border-top:6px solid var(--fill)"><div class="sec-t" style="margin-bottom:12px">포함 서비스</div>'+
    '<div class="chips">'+approvedIds(p).filter(function(id){ return judgeService(S(id)).ok; })
      .map(function(id){ return '<button class="chip" onclick="go(\'svc\',\''+id+'\')">'+esc(S(id).n)+'</button>'; }).join('')+'</div></div>'+
    '</div><div class="cta"><button class="cta-fav'+(saved?' on':'')+'" onclick="toggleSave(\'product\',\''+p.id+'\')">'+(saved?'저장됨':'저장')+'</button>'+
    '<button class="btn fill" onclick="VIEW.toast=\'기존 문의 흐름으로 이동합니다.\';render()">문의하기</button></div>'+navBar('explore');
}
function viewSdetail(){
  var st=ST(VIEW.id); if(!st) return viewNotFound();
  var saved=isSaved('store',st.id);
  var prods = DB.products.filter(function(p){ return p.store===st.id && productVisible(p); });
  return '<div class="scroll pad-nav pad-cta">'+hdrBack(st.name)+
    '<div class="ph" style="height:180px;border-left:0;border-right:0"></div>'+
    '<div class="land-head"><div class="land-h1" style="font-size:18px">'+esc(st.name)+'</div>'+
    '<div class="smeta"><span>평점 '+st.rating+'</span><span>리뷰 '+st.rev.toLocaleString('ko-KR')+'</span><span>'+esc(st.walk)+'</span></div></div>'+
    '<div class="sec" style="border-top:6px solid var(--fill)"><div class="sec-t" style="margin-bottom:12px">상품</div>'+
    prods.map(productCard).join('')+'</div></div>'+
    '<div class="cta"><button class="cta-fav'+(saved?' on':'')+'" onclick="toggleSave(\'store\',\''+st.id+'\')">'+(saved?'저장됨':'저장')+'</button>'+
    '<button class="btn fill" onclick="VIEW.toast=\'기존 예약 흐름으로 이동합니다.\';render()">예약하기</button></div>'+navBar('explore');
}

/* ── 저장 ── */
function viewSaved(){
  var svc = VIEW.saved.filter(function(s){ return s.kind==='svc'; }).map(function(s){ return S(s.id); }).filter(Boolean);
  var prd = VIEW.saved.filter(function(s){ return s.kind==='product'; }).map(function(s){ return PR(s.id); }).filter(Boolean);
  var strs = VIEW.saved.filter(function(s){ return s.kind==='store'; }).map(function(s){ return ST(s.id); }).filter(Boolean);
  var okS = svc.filter(function(s){ return judgeService(s).ok; });
  var okP = prd.filter(productVisible);
  var okT = strs.filter(storeVisible);
  var gone = [].concat(
    svc.filter(function(s){ return !judgeService(s).ok; }).map(function(s){ return {k:'svc',e:s}; }),
    prd.filter(function(p){ return !productVisible(p); }).map(function(p){ return {k:'product',e:p}; }),
    strs.filter(function(s){ return !storeVisible(s); }).map(function(s){ return {k:'store',e:s}; })
  );
  var total = okS.length+okP.length+okT.length+gone.length;

  if(!total){
    return '<div class="scroll pad-nav">'+hdrTop('저장')+
      '<div class="empty" style="padding-top:64px"><div class="t">저장한 항목이 없습니다</div>'+
      '<div class="d">서비스, 상품, 스토어 화면의 저장 버튼을 누르면<br>여기에 모입니다.</div>'+
      '<div class="empty-acts">'+act('탐색으로 가기','분류나 고민에서 시작합니다','go(\'explore\')',true)+'</div></div>'+
      '</div>'+navBar('saved');
  }
  var out = '<div class="scroll pad-nav">'+hdrTop('저장')+
    '<div class="tabs-pill"><button class="chip on">전체 '+total+'</button>'+
    '<button class="chip">서비스 '+okS.length+'</button><button class="chip">상품 '+okP.length+'</button>'+
    '<button class="chip">스토어 '+okT.length+'</button></div><div style="padding:0 16px 16px">';
  if(okS.length) out += '<div class="grp">서비스</div>'+okS.map(function(s){
    return '<div class="row"><div class="ph ph-52"></div>'+
      '<div class="row-b" onclick="go(\'svc\',\''+s.id+'\')"><div class="row-nm">'+esc(s.n)+'</div>'+
      '<div class="row-path">'+esc(catPath(s.rep))+'</div></div>'+
      '<button class="mini" style="align-self:center" onclick="toggleSave(\'svc\',\''+s.id+'\')">해제</button></div>';
  }).join('');
  if(okP.length) out += '<div class="grp">상품</div>'+okP.map(productCard).join('');
  if(okT.length) out += '<div class="grp">스토어</div>'+okT.map(storeCard).join('');
  if(gone.length) out += '<div class="grp">지금은 볼 수 없는 항목</div>'+gone.map(function(g){
    return '<div class="pcard" style="cursor:default"><div class="ph ph-84"></div>'+
      '<div class="pbody"><div class="pstore">이전에 저장함</div>'+
      '<div class="pname">'+esc(g.e.n||g.e.name)+'</div>'+
      '<div class="ptags"><span class="ptag">현재 공개되지 않음</span></div></div>'+
      '<button class="mini" style="align-self:center" onclick="toggleSave(\''+g.k+'\',\''+g.e.id+'\')">삭제</button></div>';
  }).join('');
  return out+'</div></div>'+navBar('saved');
}
function viewMy(){
  return '<div class="scroll pad-nav">'+hdrTop('마이페이지')+
    '<div class="sec"><div class="sec-t">로그인 중</div><div class="sec-s">guest@example.com</div></div>'+
    '<div class="sec"><button class="btn sm" onclick="VIEW.loggedIn=false;VIEW.saved=[];go(\'explore\')">로그아웃</button></div>'+
    '</div>'+navBar('my');
}
function viewLogin(){
  return '<div class="scroll">'+
    '<header class="hdr"><button class="hdr-ico hdr-back" onclick="cancelLogin()">&lt;</button>'+
    '<div class="hdr-title">로그인</div><div class="hdr-sp"></div></header>'+
    '<div class="login-wrap"><div class="t">로그인이 필요합니다</div>'+
    '<div class="d">'+(VIEW.pending?'로그인하면 보던 화면으로 돌아가 저장까지 마칩니다.':'저장과 마이페이지는 로그인 후 이용할 수 있습니다.')+'</div>'+
    '<div class="fld"><label>이메일</label><div class="inp">guest@example.com</div></div>'+
    '<div class="fld"><label>비밀번호</label><div class="inp">••••••••</div></div>'+
    '<div style="margin-top:20px"><button class="btn fill" onclick="doLogin()">로그인</button></div>'+
    '<div style="margin-top:8px"><button class="btn" onclick="cancelLogin()">나중에 하기</button></div>'+
    '</div></div>';
}

/* ── 상태 화면 ── */
function viewUnavailable(){
  var others = (VIEW.altLangs||[]).filter(function(l){ return l!==VIEW.lang; });
  var L = VIEW.lastLanding;
  return '<div class="scroll pad-nav">'+hdrBack('찾을 수 없음')+
    '<div class="empty" style="padding-top:60px">'+
    '<div class="t">이 화면은 '+langLabel(VIEW.lang)+'로 공개되지 않았습니다</div>'+
    '<div class="d">주소는 있지만 지금 보고 있는 언어로는<br>아직 공개되지 않았습니다.</div>'+
    (others.length ? '<div class="lang-list">'+others.map(function(l){

    '<div class="empty-acts">'+act('탐색 홈으로','현재 언어로 공개된 것만 보여 줍니다','go(\'explore\')',true)+'</div>'+
    '</div></div>'+navBar('explore');
}
function viewNotFound(){
  return '<div class="scroll pad-nav">'+hdrBack('찾을 수 없음')+
    '<div class="empty" style="padding-top:60px"><div class="t">이 화면을 찾을 수 없습니다</div>'+
    '<div class="d">내려갔거나 주소가 잘못되었을 수 있습니다.</div>'+
    '<div class="empty-acts">'+act('탐색 홈으로','분류나 고민에서 시작합니다','go(\'explore\')',true)+
    act('전체 상품 보기','조건 없이 상품 목록으로 이동','go(\'products\')')+'</div>'+
    '</div></div>'+navBar('explore');
}

resetDB();
