<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-Beauty Station · 탐색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#fb6f92; --pink-d:#eb517a; --pink-l:#fff2f6; --pink-m:#fde8ef;
  --t1:#1a1a1a; --t2:#3d3d3d; --t3:#767676; --t4:#a9a9a9;
  --line:#e8e8e8; --line2:#f1f1f1; --bg:#f7f7f7; --bg2:#f2f2f2;
}
html,body{height:100%}
body{
  font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:14px;color:var(--t1);background:#e9eaec;
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased;
}
.device{width:390px;max-width:100%;height:100vh;background:#fff;position:relative;
  display:flex;flex-direction:column;box-shadow:0 0 0 1px #d6d7da}
.chrome{flex:0 0 32px;background:#ededf0;border-bottom:1px solid #dcdde0;
  display:flex;align-items:center;justify-content:center;padding:0 10px}
.chrome .url{max-width:100%;background:#fff;border-radius:13px;height:22px;padding:0 11px;
  display:flex;align-items:center;gap:5px;font-size:11px;color:#5f6368;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .lock{font-size:9px;opacity:.5}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.pad-nav{padding-bottom:62px}
.pad-cta{padding-bottom:124px}

/* 헤더 */
.hdr{position:sticky;top:0;z-index:30;height:52px;background:#fff;display:flex;align-items:center;
  padding:0 8px 0 4px;border-bottom:1px solid var(--line2)}
.hdr-ico{width:40px;height:40px;flex:0 0 40px;border:0;background:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--t1)}
.hdr-ico:active{background:var(--bg)}
.hdr-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr-title{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.hdr-big{flex:1;text-align:left;padding-left:12px;font-size:19px;font-weight:900;letter-spacing:-.5px}
.hdr-logo{flex:1;padding-left:12px;font-size:13px;font-weight:900;letter-spacing:-.2px;color:var(--pink-d)}
.hdr-sp{width:40px;flex:0 0 40px}
.lang-btn{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:14px;background:#fff;
  font-family:inherit;font-size:11.5px;font-weight:500;color:var(--t2);cursor:pointer;white-space:nowrap}
.lang-btn:active{background:var(--bg)}

/* 하단 전역 메뉴 */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:45;height:62px;background:#fff;
  border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:500;color:var(--t4);cursor:pointer;border:0;background:none;font-family:inherit}
.nav-i svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-i.on{color:var(--pink-d);font-weight:700}
.nav-i.on svg{stroke-width:2}

/* 섹션 */
.sec{padding:20px 16px}
.sec+.sec{border-top:8px solid var(--bg2)}
.sec-t{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-bottom:2px}
.sec-s{font-size:12px;color:var(--t3);margin-bottom:13px;line-height:1.6}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:8px}
.sec-row .sec-t{margin-bottom:0}
.more{font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;white-space:nowrap;
  background:none;border:0;font-family:inherit;display:inline-flex;align-items:center;gap:2px}
.more svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

/* 검색 */
.searchbar{display:flex;align-items:center;gap:9px;height:46px;border-radius:12px;
  background:var(--bg);padding:0 14px;font-size:13.5px;color:var(--t4);cursor:pointer}
.searchbar svg{width:17px;height:17px;stroke:var(--t3);fill:none;stroke-width:2;flex:0 0 17px}
.searchfield{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:#fff;
  border:1.5px solid var(--pink);padding:0 6px 0 13px}
.searchfield svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2;flex:0 0 16px}
.searchfield input{flex:1;border:0;outline:0;font:inherit;font-size:14px;font-weight:500;color:var(--t1);background:none;min-width:0}
.searchfield input::placeholder{color:var(--t4);font-weight:400}
.clear-x{width:20px;height:20px;border-radius:50%;background:#d5d5d5;color:#fff;border:0;
  font-size:11px;line-height:1;cursor:pointer;flex:0 0 20px;font-family:inherit}
.go-s{height:32px;padding:0 14px;border-radius:16px;border:0;background:var(--pink-d);color:#fff;
  font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}

/* 탐색 축 */
.axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.axis{border:1px solid var(--line);border-radius:14px;padding:15px 14px;background:#fff;cursor:pointer;
  text-align:left;font-family:inherit}
.axis:active{border-color:var(--pink);background:var(--pink-l)}
.axis .ic{width:26px;height:26px;margin-bottom:10px;display:block;stroke:var(--pink-d);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.axis .nm{font-size:14.5px;font-weight:700;letter-spacing:-.3px}
.axis .ct{font-size:11.5px;color:var(--t3);margin-top:4px}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 13px;border-radius:17px;
  border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;color:var(--t2);
  white-space:nowrap;cursor:pointer}
.chip:active{background:var(--bg)}
.chip.on{border-color:var(--pink);background:var(--pink-l);color:var(--pink-d);font-weight:700}
.chip .x{font-size:11px;opacity:.8;margin-left:1px}
.chip.add{border-style:dashed;color:var(--t3)}

/* 리스트 행 */
.row{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--line2);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.row:last-of-type{border-bottom:0}
.row:active{background:var(--bg)}
.thumb{border-radius:10px;flex:0 0 auto;background:linear-gradient(135deg,#fde8ef,#f1dfe5);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb.b{background:linear-gradient(135deg,#e7eef6,#dce4ed)}
.thumb.c{background:linear-gradient(135deg,#eaf0e8,#dee7dc)}
.thumb.g{background:linear-gradient(135deg,#f0f0f0,#e6e6e6)}
.thumb svg{width:40%;height:40%;stroke:rgba(0,0,0,.22);fill:none;stroke-width:1.4}
.t52{width:52px;height:52px}.t72{width:72px;height:72px}.t88{width:88px;height:88px}.t76{width:76px;height:62px}
.row-b{flex:1;min-width:0}
.row-nm{font-size:14.5px;font-weight:700;letter-spacing:-.3px;line-height:1.4}
.row-path{font-size:11.5px;color:var(--t3);margin-top:3px}
.row-desc{font-size:12.5px;color:var(--t3);margin-top:5px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-arrow{align-self:center;flex:0 0 auto;width:16px;height:16px;stroke:var(--t4);fill:none;stroke-width:2}
.match{display:inline-block;margin-top:6px;font-size:11px;font-weight:500;color:var(--pink-d);
  background:var(--pink-l);border-radius:5px;padding:3px 7px}
.grp{font-size:11.5px;font-weight:700;color:var(--t3);padding:16px 0 2px}

/* 탭 */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;z-index:20}
.tab{flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:5px;font:inherit;
  font-size:13.5px;color:var(--t3);cursor:pointer;border:0;background:none;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--t1);font-weight:700;border-bottom-color:var(--t1)}
.tab .n{font-size:12px;color:var(--t4)}
.tab.on .n{color:var(--pink-d);font-weight:700}
.tabs-pill{display:flex;gap:6px;overflow-x:auto;padding:11px 16px;border-bottom:1px solid var(--line2)}
.tabs-pill::-webkit-scrollbar{display:none}
.tabs-pill .chip{height:32px;padding:0 12px;font-size:12.5px}

/* 정렬 */
.sortbar{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;
  border-bottom:1px solid var(--line2);gap:8px}
.count{font-size:12.5px;color:var(--t3)}
.count b{color:var(--t1);font-weight:700}
.sortbtn{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;
  color:var(--t1);border:1px solid var(--line);border-radius:9px;height:32px;padding:0 11px;background:#fff;cursor:pointer}
.sortbtn svg{width:11px;height:11px;stroke:var(--t3);fill:none;stroke-width:2.2}

/* 카드 */
.pcard,.scard,.ccard{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line2);cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.pcard:last-of-type,.scard:last-of-type,.ccard:last-of-type{border-bottom:0}
.pcard:active,.scard:active,.ccard:active{background:var(--bg)}
.pbody{flex:1;min-width:0;display:flex;flex-direction:column}
.pstore{font-size:11.5px;color:var(--t3)}
.pname{font-size:13.5px;font-weight:700;line-height:1.5;margin-top:4px;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.ptag{font-size:10.5px;color:var(--t3);background:var(--bg2);border-radius:4px;padding:3px 6px}
.pprice{margin-top:auto;padding-top:7px;font-size:16px;font-weight:900;letter-spacing:-.4px}
.pprice.none{font-size:12.5px;font-weight:500;color:var(--t3)}
.sname{font-size:14.5px;font-weight:700;letter-spacing:-.3px}
.smeta{font-size:12px;color:var(--t3);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.star{color:#f3a218;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.star svg{width:12px;height:12px;fill:#f3a218;stroke:none}
.ckind{font-size:10.5px;font-weight:700;color:var(--pink-d)}
.ctitle{font-size:13px;font-weight:700;line-height:1.55;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:11px;color:var(--t4);margin-top:6px}

/* 랜딩 */
.crumb{font-size:11.5px;color:var(--t3);padding:15px 16px 0;line-height:1.7}
.crumb a{color:var(--t3);cursor:pointer}
.crumb .cur{color:var(--t1);font-weight:700}
.land-head{padding:9px 16px 20px}
.land-h1{font-size:23px;font-weight:900;letter-spacing:-.8px;line-height:1.3}
.land-sub{font-size:12px;color:var(--t3);margin-top:7px}
.land-body{font-size:13.5px;color:var(--t2);line-height:1.85;margin-top:14px}
.critbox{margin-top:16px;border-radius:12px;background:var(--bg);padding:16px}
.critbox .t{font-size:13px;font-weight:700;margin-bottom:10px}
.critline{display:flex;gap:8px;font-size:12.5px;color:var(--t2);line-height:1.7;margin-bottom:7px}
.critline:last-child{margin-bottom:0}
.critline .b{flex:0 0 auto;color:var(--pink);font-weight:700}
.rel-l{font-size:12px;font-weight:700;color:var(--t3);margin-bottom:8px}
.rel-b+.rel-b{margin-top:16px}

/* 빈 상태·오류 */
.empty{padding:36px 20px;text-align:center}
.empty .ic{width:44px;height:44px;margin:0 auto 14px;stroke:var(--t4);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.empty .t{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.5}
.empty .d{font-size:13px;color:var(--t3);margin-top:9px;line-height:1.75}
.empty-acts{margin-top:20px;display:flex;flex-direction:column;gap:8px;text-align:left}
.act{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;background:#fff;cursor:pointer;width:100%;text-align:left;font-family:inherit}
.act:active{background:var(--bg)}
.act .l{font-size:13px;font-weight:700;color:var(--t1)}
.act .s{font-size:11.5px;color:var(--t3);margin-top:3px}
.act svg{width:16px;height:16px;stroke:var(--t4);fill:none;stroke-width:2;flex:0 0 16px}
.act.primary{border-color:var(--pink);background:var(--pink-l)}
.act.primary .l{color:var(--pink-d)}
.unblock{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:16px;text-align:left}
.unblock-h{font-size:12px;font-weight:700;color:var(--t3);padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.unblock-r{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.unblock-r:last-child{border-bottom:0}
.unblock-r .nm{font-size:13px;font-weight:700}
.unblock-r .nm i{font-style:normal;font-size:11.5px;color:var(--t3);font-weight:400;display:block;margin-top:3px}
.unblock-r .nm i.zero{color:var(--t4)}
.mini{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:#fff;
  font:inherit;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;flex:0 0 auto}
.mini.on{border-color:var(--pink);background:var(--pink-l);color:var(--pink-d);font-weight:700}
.retry{border-radius:12px;background:var(--bg);padding:22px 16px;text-align:center}
.retry .t{font-size:13px;color:var(--t3);line-height:1.7}
.retry .b{margin-top:12px}
.zero{border-radius:12px;padding:22px 16px;text-align:center;background:var(--bg)}
.zero .t{font-size:13px;font-weight:700;color:var(--t2)}
.zero .d{font-size:12px;color:var(--t3);margin-top:7px;line-height:1.7}
.zero .b{margin-top:14px}

/* 스켈레톤 */
.sk{background:linear-gradient(90deg,#f0f0f0 25%,#e7e7e7 37%,#f0f0f0 63%);
  background-size:400% 100%;border-radius:6px;animation:sh 1.25s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-row{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line2)}
.sk-line{height:12px;margin-bottom:8px}

/* 버튼 */
.btn{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;
  font-size:14px;font-weight:700;color:var(--t1);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--bg)}
.btn.fill{background:var(--pink-d);border-color:var(--pink-d);color:#fff}
.btn.fill:active{background:#d84770}
.btn.fill:disabled{background:var(--bg2);border-color:var(--bg2);color:var(--t4);cursor:default}
.btn.sm{height:42px;font-size:13px}
.btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cta{position:absolute;left:0;right:0;bottom:62px;z-index:40;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px 12px;display:flex;gap:9px;align-items:center}
.cta-fav{width:48px;height:48px;flex:0 0 48px;border-radius:12px;border:1px solid var(--line);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cta-fav svg{width:21px;height:21px;stroke:var(--t3);fill:none;stroke-width:1.8}
.cta-fav.on{border-color:var(--pink);background:var(--pink-l)}
.cta-fav.on svg{stroke:var(--pink-d);fill:var(--pink-d)}
.cta .btn{flex:1;width:auto}

/* 조건 바 */
.condbar{position:sticky;z-index:22;background:#fff;border-bottom:1px solid var(--line);
  padding:10px 0;display:flex;align-items:center;gap:8px}
.condbar-in{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;padding-left:16px}
.condbar-in::-webkit-scrollbar{display:none}
.condbar-fade{flex:0 0 auto;padding:0 14px 0 12px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 14px)}
.reset{font-size:12px;font-weight:500;color:var(--t3);white-space:nowrap;cursor:pointer;
  background:none;border:0;font-family:inherit;padding:0;text-decoration:underline}

/* 조건 선택 */
.pick-l{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit}
.pick-l:active{background:var(--bg)}
.box{width:21px;height:21px;flex:0 0 21px;border-radius:6px;border:1.5px solid #d4d4d4;
  display:flex;align-items:center;justify-content:center}
.box svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;opacity:0}
.pick-l.on .box{background:var(--pink-d);border-color:var(--pink-d)}
.pick-l.on .box svg{opacity:1}
.pick-nm{font-size:14px;font-weight:500}
.pick-l.on .pick-nm{font-weight:700}
.pick-sub{font-size:11.5px;color:var(--t3);margin-top:3px}
.pick-foot{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:12px 16px 14px}
.pick-grp{font-size:11.5px;font-weight:700;color:var(--t3);padding:13px 16px 5px;background:var(--bg)}

/* 역·노선 */
.stn{display:flex;flex-direction:column;gap:9px}
.stn-r{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stn-nm{font-size:13.5px;font-weight:700}
.line-b{font-size:10.5px;font-weight:700;color:#fff;border-radius:10px;padding:3px 8px;white-space:nowrap}

/* 언어 목록 */
.lang-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px;text-align:left}
.lang-r{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line2);
  cursor:pointer;width:100%;background:#fff;border-left:0;border-right:0;border-top:0;font-family:inherit}
.lang-r:last-child{border-bottom:0}
.lang-r:active{background:var(--bg)}
.lang-r .nm{font-size:13.5px;font-weight:700}
.lang-r svg{width:16px;height:16px;stroke:var(--t4);fill:none;stroke-width:2}

/* 시트 */
.sheet-bg{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;
  animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:6px 0 14px;max-height:72%;overflow-y:auto;
  animation:up .2s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:#e0e0e0;margin:8px auto 4px}
.sheet-h{font-size:14px;font-weight:700;padding:12px 18px 8px}
.sheet-i{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-size:14px;
  cursor:pointer;width:100%;background:none;border:0;font-family:inherit;text-align:left;color:var(--t1)}
.sheet-i:active{background:var(--bg)}
.sheet-i.on{color:var(--pink-d);font-weight:700}
.sheet-i svg{width:16px;height:16px;stroke:var(--pink-d);fill:none;stroke-width:2.4}

/* 기타 */
.hero-home{padding:22px 16px 26px;background:linear-gradient(165deg,#fde8ef 0%,#fff 82%)}

  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;text-align:center;animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ 상태 ═══ */
var DB, VIEW, scrollMem, lastKey;
function snapshot(){
  return {route:VIEW.route,id:VIEW.id,conds:VIEW.conds.slice(),tab:VIEW.tab,sort:VIEW.sort,
    page:VIEW.page,q:VIEW.q,qSubmitted:VIEW.qSubmitted,stype:VIEW.stype,
    pickAxis:VIEW.pickAxis,pickSel:VIEW.pickSel.slice(),altLangs:(VIEW.altLangs||[]).slice()};
}
function restoreSnap(s){
  VIEW.route=s.route;VIEW.id=s.id;VIEW.conds=s.conds.slice();VIEW.tab=s.tab;VIEW.sort=s.sort;
  VIEW.page=s.page;VIEW.q=s.q;VIEW.qSubmitted=s.qSubmitted;VIEW.stype=s.stype;
  VIEW.pickAxis=s.pickAxis;VIEW.pickSel=s.pickSel.slice();VIEW.altLangs=s.altLangs.slice();
}
function resetDB(){
  DB=buildSeed(); scrollMem={}; lastKey=null;
  VIEW={route:'explore',id:null,lang:'en',
    q:'',qSubmitted:'',stype:'all',
    conds:[],tab:'product',sort:'views',page:1,
    pickAxis:null,pickSel:[],
    loggedIn:false,saved:[],pending:null,ret:null,
    stack:[],altLangs:[],lastLanding:null,
    loading:null,moreLoading:false,
    fail:{reco:false,content:false,contentCard:false,more:false,all:false},
    sheet:null,toast:''};
  if(typeof render==='function') render();
}

/* ═══ 조회 ═══ */
function byId(a,id){ for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function C(id){ return byId(DB.categories,id); }
function S(id){ return byId(DB.services,id); }
function I(id){ return byId(DB.interests,id); }
function P(id){ return byId(DB.places,id); }
function ST(id){ return byId(DB.stores,id); }
function PR(id){ return byId(DB.products,id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function langLabel(c){ for(var i=0;i<LANGS.length;i++) if(LANGS[i][0]===c) return LANGS[i][1]; return c; }
function pubOK(e){ return !!(e&&e.pub&&e.pub.indexOf(VIEW.lang)>=0); }

/* ═══ 판정 로직 ═══ */
function judgeEntity(e,getParent){
  if(!e) return {ok:false,why:'notfound'};
  if(e.status!=='공개') return {ok:false,why:'notfound'};
  if(!pubOK(e)) return {ok:false,why:'lang',langs:e.pub.slice()};
  if(e.parent){
    var p=getParent(e.parent);
    if(!p||p.status!=='공개') return {ok:false,why:'notfound'};
    if(!pubOK(p)) return {ok:false,why:'lang',langs:e.pub.filter(function(l){ return p.pub.indexOf(l)>=0; })};
  }
  return {ok:true};
}
function judgeCat(c){ return judgeEntity(c,C); }
function judgePlace(p){ return judgeEntity(p,P); }
function judgeInterest(x){ return judgeEntity(x,function(){ return null; }); }
function judgeService(s){
  if(!s) return {ok:false,why:'notfound'};
  if(s.status!=='공개') return {ok:false,why:'notfound'};
  if(!pubOK(s)) return {ok:false,why:'lang',langs:s.pub.slice()};
  var rep=C(s.rep), j=judgeCat(rep);
  if(!j.ok) return j.why==='lang'
    ? {ok:false,why:'lang',langs:s.pub.filter(function(l){ return rep.pub.indexOf(l)>=0; })}
    : {ok:false,why:'notfound'};
  return {ok:true};
}
function visibleServices(){ return DB.services.filter(function(s){ return judgeService(s).ok; }); }
function visibleCats(){ return DB.categories.filter(function(c){ return judgeCat(c).ok; }); }
function visibleInterests(t){ return DB.interests.filter(function(x){ return x.type===t&&judgeInterest(x).ok; }); }
function approvedIds(p){ return p.links.filter(function(l){ return l.r==='승인'; }).map(function(l){ return l.s; }); }
function productVisible(p){
  if(p.status!=='공개') return false;
  var st=ST(p.store);
  if(!st||st.status!=='공개'||!st.reviewed) return false;
  return approvedIds(p).some(function(id){ return judgeService(S(id)).ok; });
}
function storeVisible(st){
  if(st.status!=='공개'||!st.reviewed) return false;
  return DB.products.some(function(p){ return p.store===st.id&&productVisible(p); });
}
function productsOfService(sid){ return DB.products.filter(function(p){ return productVisible(p)&&approvedIds(p).indexOf(sid)>=0; }); }
function storesOfService(sid){
  var out=[],seen={};
  productsOfService(sid).forEach(function(p){ if(!seen[p.store]){ seen[p.store]=1; var s=ST(p.store); if(storeVisible(s)) out.push(s); } });
  return out;
}
function servicesOfCat(cid){ return visibleServices().filter(function(s){ return catMatches(s.cats,cid); }); }
function servicesOfInterest(iid){ return visibleServices().filter(function(s){ return s.itr.indexOf(iid)>=0||s.body.indexOf(iid)>=0; }); }
function servicesOfPlace(pid){
  var out=[],seen={};
  DB.products.forEach(function(p){
    if(!productVisible(p)||!placeMatches(ST(p.store).place,pid)) return;
    approvedIds(p).forEach(function(sid){ if(judgeService(S(sid)).ok&&!seen[sid]){ seen[sid]=1; out.push(S(sid)); } });
  });
  return out;
}
function placeMatches(sp,cid){ var c=P(sp); while(c){ if(c.id===cid) return true; c=c.parent?P(c.parent):null; } return false; }
function catMatches(cats,cid){
  for(var i=0;i<cats.length;i++){ var c=C(cats[i]); while(c){ if(c.id===cid) return true; c=c.parent?C(c.parent):null; } }
  return false;
}
function contentsFor(kind,id){
  var out=[],seen={};
  DB.contents.forEach(function(c){
    if(seen[c.id]||c.status!=='공개'||c.lang!==VIEW.lang) return;
    var linked = kind==='svc'?c.svc.indexOf(id)>=0:c.itr.indexOf(id)>=0;
    if(!linked) return;
    var t = kind==='svc'?judgeService(S(id)):judgeInterest(I(id));
    if(!t.ok) return;
    seen[c.id]=1; out.push(c);
  });
  return out;
}
function byAxis(conds){ var g={}; conds.forEach(function(c){ (g[c.axis]=g[c.axis]||[]).push(c.id); }); return g; }
function serviceMatches(s,conds){
  var g=byAxis(conds);
  if(g.cat&&!g.cat.some(function(id){ return catMatches(s.cats,id); })) return false;
  if(g.itr&&!g.itr.some(function(id){ return s.itr.indexOf(id)>=0; })) return false;
  if(g.body&&!g.body.some(function(id){ return s.body.indexOf(id)>=0; })) return false;
  if(g.svc&&g.svc.indexOf(s.id)<0) return false;
  if(g.plc&&!g.plc.some(function(id){ return productsOfService(s.id).some(function(p){ return placeMatches(ST(p.store).place,id); }); })) return false;
  return true;
}
function resultServices(conds){ return visibleServices().filter(function(s){ return serviceMatches(s,conds); }); }
function resultProducts(conds){
  var g=byAxis(conds), rest=conds.filter(function(c){ return c.axis!=='plc'; });
  return DB.products.filter(function(p){
    if(!productVisible(p)) return false;
    if(g.plc&&!g.plc.some(function(id){ return placeMatches(ST(p.store).place,id); })) return false;
    if(!rest.length) return true;
    return approvedIds(p).map(S).filter(function(s){ return judgeService(s).ok; }).some(function(s){ return serviceMatches(s,rest); });
  });
}
function resultStores(conds){
  var g=byAxis(conds), rest=conds.filter(function(c){ return c.axis!=='plc'; });
  return DB.stores.filter(function(st){
    if(!storeVisible(st)) return false;
    if(g.plc&&!g.plc.some(function(id){ return placeMatches(st.place,id); })) return false;
    if(!rest.length) return true;
    return DB.products.some(function(p){
      if(p.store!==st.id||!productVisible(p)) return false;
      return approvedIds(p).map(S).filter(function(s){ return judgeService(s).ok; }).some(function(s){ return serviceMatches(s,rest); });
    });
  });
}
function countTab(conds,tab){
  return tab==='service'?resultServices(conds).length:tab==='store'?resultStores(conds).length:resultProducts(conds).length;
}
function sortProducts(list,sort){
  var a=list.slice();
  if(sort==='views') a.sort(function(x,y){ return y.views-x.views; });
  else if(sort==='pop') a.sort(function(x,y){ return y.pop-x.pop; });
  else {
    var pr=a.filter(function(p){ return p.price!=null; }), nn=a.filter(function(p){ return p.price==null; });
    pr.sort(function(x,y){ return sort==='asc'?x.price-y.price:y.price-x.price; });
    a=pr.concat(nn);
  }
  return a;
}
function searchCanonical(q){
  var s=String(q||'').trim().toLowerCase(), out={service:[],concern:[],category:[],place:[]};
  if(!s) return out;
  visibleServices().forEach(function(sv){
    if(sv.n.toLowerCase().indexOf(s)>=0){ out.service.push({e:sv,by:'name'}); return; }
    var hit=sv.syn.filter(function(t){ return t.toLowerCase().indexOf(s)>=0; })[0];
    if(hit) out.service.push({e:sv,by:'syn',syn:hit});
  });
  visibleInterests('concern').concat(visibleInterests('body')).forEach(function(x){
    if(x.n.toLowerCase().indexOf(s)>=0) out.concern.push({e:x,by:'name'}); });
  visibleCats().forEach(function(c){ if(c.n.toLowerCase().indexOf(s)>=0) out.category.push({e:c,by:'name'}); });
  DB.places.filter(function(p){ return p.type!=='line'&&judgePlace(p).ok; })
    .forEach(function(p){ if(p.n.toLowerCase().indexOf(s)>=0) out.place.push({e:p,by:'name'}); });
  return out;
}
function catPath(cid){ var a=[],c=C(cid); while(c){ a.unshift(c.n); c=c.parent?C(c.parent):null; } return a.join(' · '); }
function placePath(pid){ var a=[],p=P(pid); while(p){ a.unshift(p.n); p=p.parent?P(p.parent):null; } return a.join(' · '); }
function won(v){ return v==null?null:v.toLocaleString('ko-KR')+'원'; }

function urlOf(){
  var b='k-beautystation.com/'+VIEW.lang;
  switch(VIEW.route){
    case 'home': return b;
    case 'explore': case 'pick': return b+'/explore';
    case 'search': return b+'/explore/search'+(VIEW.qSubmitted?'?q='+encodeURIComponent(VIEW.qSubmitted):'');
    case 'results': return b+'/explore/results';
    case 'cat': return b+'/categories/'+(C(VIEW.id)?C(VIEW.id).slug:'');
    case 'svc': return b+'/services/'+(S(VIEW.id)?S(VIEW.id).slug:'');
    case 'itr': return b+'/interests/'+(I(VIEW.id)?I(VIEW.id).slug:'');
    case 'plc': return b+'/places/'+(P(VIEW.id)?P(VIEW.id).slug:'');
    case 'products': return b+'/products';
    case 'stores': return b+'/stores';
    case 'pdetail': return b+'/products/'+VIEW.id;
    case 'sdetail': return b+'/stores/'+VIEW.id;
    case 'saved': return b+'/saved';
    case 'my': return b+'/my';
    case 'login': return b+'/login';
    case 'unavailable': case 'notfound':
      var L=VIEW.lastLanding; if(!L) return b+'/explore';
      var seg={cat:'categories',svc:'services',itr:'interests',plc:'places'}[L.route];
      var e=L.route==='cat'?C(L.id):L.route==='svc'?S(L.id):L.route==='itr'?I(L.id):P(L.id);
      return b+'/'+seg+'/'+(e?e.slug:'');
    default: return b+'/explore';
  }
}

/* ═══ 이동·히스토리 ═══ */
var LANDING=['cat','svc','itr','plc'];
function go(route,id,opt){
  opt=opt||{};
  VIEW.sheet=null; VIEW.toast='';
  if(!opt.noPush) VIEW.stack.push(snapshot());
  if(LANDING.indexOf(route)>=0){
    VIEW.lastLanding={route:route,id:id};
    var e=route==='cat'?C(id):route==='svc'?S(id):route==='itr'?I(id):P(id);
    var j=route==='cat'?judgeCat(e):route==='svc'?judgeService(e):route==='itr'?judgeInterest(e):judgePlace(e);
    if(!j.ok){
      VIEW.route=j.why==='lang'?'unavailable':'notfound';
      VIEW.altLangs=j.langs||[];
      scrollMem[keyOf()]=0; render(); return;
    }
  }
  if(route==='results') VIEW.page=1;
  VIEW.route=route; VIEW.id=(id==null?null:id);
  scrollMem[keyOf()]=0;
  render();
}
function goBack(){
  if(VIEW.stack.length){ restoreSnap(VIEW.stack.pop()); VIEW.sheet=null; VIEW.toast=''; render(); return; }
  go('explore',null,{noPush:true});
}
function keyOf(){ return VIEW.route+':'+(VIEW.id||'')+':'+VIEW.tab+':'+VIEW.stack.length; }

function setLang(c){
  VIEW.lang=c; VIEW.sheet=null;
  if(VIEW.route==='unavailable'&&VIEW.lastLanding){ go(VIEW.lastLanding.route,VIEW.lastLanding.id,{noPush:true}); return; }
  if(LANDING.indexOf(VIEW.route)>=0){ go(VIEW.route,VIEW.id,{noPush:true}); return; }
  VIEW.conds=VIEW.conds.filter(function(cd){
    var e=cd.axis==='cat'?C(cd.id):cd.axis==='plc'?P(cd.id):cd.axis==='svc'?S(cd.id):I(cd.id);
    return pubOK(e);
  });
  if(VIEW.route==='results'&&!VIEW.conds.length){ go('explore',null,{noPush:true}); return; }
  render();
}
function removeCond(axis,id){
  VIEW.conds=VIEW.conds.filter(function(c){ return !(c.axis===axis&&c.id===id); });
  if(!VIEW.conds.length){ go('explore'); return; }
  VIEW.page=1; render();
}
function condName(c){
  var e=c.axis==='cat'?C(c.id):c.axis==='plc'?P(c.id):c.axis==='svc'?S(c.id):I(c.id);
  return (e&&e.n)||c.id;
}
function setTab(t){
  if(VIEW.tab===t) return;
  VIEW.tab=t; VIEW.page=1;
  if(t!=='product'&&(VIEW.sort==='asc'||VIEW.sort==='desc')) VIEW.sort='views';
  scrollMem[keyOf()]=0; render();
}
function setSort(s){ VIEW.sort=s; VIEW.page=1; VIEW.sheet=null; scrollMem[keyOf()]=0; render(); }
function openSearch(q){
  VIEW.stack.push(snapshot());
  VIEW.route='search'; VIEW.q=q||''; VIEW.qSubmitted=q||''; VIEW.stype='all';
  scrollMem[keyOf()]=0; render();
}
function submitSearch(){
  var v=String(VIEW.q||'').trim();
  if(!v){ VIEW.toast='검색어를 입력해 주세요.'; render(); return; }
  VIEW.qSubmitted=v; VIEW.stype='all'; scrollMem[keyOf()]=0; render();
}
function applyConds(conds,tab){ VIEW.conds=conds; VIEW.tab=tab||'product'; VIEW.sort='views'; go('results'); }
function loadMore(){
  VIEW.moreLoading=true; render();
  setTimeout(function(){
    VIEW.moreLoading=false;
    if(!VIEW.fail.more) VIEW.page++;
    render();
  },450);
}
function isSaved(k,id){ return VIEW.saved.some(function(s){ return s.kind===k&&s.id===id; }); }
function toggleSave(k,id){
  if(!VIEW.loggedIn){
    VIEW.pending={kind:k,id:id}; VIEW.ret=snapshot();
    VIEW.stack.push(snapshot()); VIEW.route='login'; render(); return;
  }
  if(isSaved(k,id)){ VIEW.saved=VIEW.saved.filter(function(s){ return !(s.kind===k&&s.id===id); }); VIEW.toast='저장을 해제했습니다.'; }
  else { VIEW.saved.push({kind:k,id:id}); VIEW.toast='저장했습니다.'; }
  render();
}
function doLogin(){
  VIEW.loggedIn=true;
  if(VIEW.ret){ restoreSnap(VIEW.ret); VIEW.ret=null; if(VIEW.stack.length) VIEW.stack.pop(); }
  if(VIEW.pending){
    if(!isSaved(VIEW.pending.kind,VIEW.pending.id)) VIEW.saved.push(VIEW.pending);
    VIEW.toast='저장했습니다.'; VIEW.pending=null;
  }
  render();
}
function cancelLogin(){
  if(VIEW.ret){ restoreSnap(VIEW.ret); VIEW.ret=null; if(VIEW.stack.length) VIEW.stack.pop(); render(); }
  else goBack();
  VIEW.pending=null;
}
function navTo(r){
  if((r==='saved'||r==='my')&&!VIEW.loggedIn){
    VIEW.ret={route:r,id:null,conds:[],tab:VIEW.tab,sort:VIEW.sort,page:1,q:'',qSubmitted:'',stype:'all',pickAxis:null,pickSel:[],altLangs:[]};
    VIEW.pending=null; VIEW.stack.push(snapshot()); VIEW.route='login'; render(); return;
  }
  VIEW.stack=[]; go(r,null,{noPush:true});
}
function setFail(a,on){ VIEW.fail[a]=!!on; render(); }
function simulateLoad(area,ms){ VIEW.loading=area; render(); setTimeout(function(){ VIEW.loading=null; render(); },ms||900); }

/* ═══ 렌더 ═══ */
var vp=document.getElementById('vp');
function render(){
  var prev=vp.querySelector('.scroll');
  if(prev&&lastKey!=null) scrollMem[lastKey]=prev.scrollTop;
  var body;
  if(VIEW.fail.all&&['explore','results','cat','svc','itr','plc','search'].indexOf(VIEW.route)>=0) body=viewAllError();
  else switch(VIEW.route){
    case 'home': body=viewHome(); break;
    case 'explore': body=viewExplore(); break;
    case 'pick': body=viewPick(); break;
    case 'search': body=viewSearch(); break;
    case 'results': body=viewResults(); break;
    case 'cat': body=viewCat(); break;
    case 'svc': body=viewSvc(); break;
    case 'itr': body=viewItr(); break;
    case 'plc': body=viewPlc(); break;
    case 'products': body=viewList('products'); break;
    case 'stores': body=viewList('stores'); break;
    case 'pdetail': body=viewPdetail(); break;
    case 'sdetail': body=viewSdetail(); break;
    case 'saved': body=viewSaved(); break;
    case 'my': body=viewMy(); break;
    case 'login': body=viewLogin(); break;
    case 'unavailable': body=viewUnavailable(); break;
    default: body=viewNotFound();
  }
  vp.innerHTML = body + (VIEW.sheet?sheet():'') + (VIEW.toast?'<div class="toast">'+esc(VIEW.toast)+'</div>':'');
  document.getElementById('urlText').textContent=urlOf();
  lastKey=keyOf();
  var ne=vp.querySelector('.scroll');
  if(ne) ne.scrollTop=scrollMem[lastKey]||0;
  if(VIEW.toast){ setTimeout(function(){ VIEW.toast=''; var t=vp.querySelector('.toast'); if(t) t.remove(); },2200); }
}
function arrow(){ return IC.chev.replace('<svg','<svg class="row-arrow"'); }
function navBar(active){
  var items=[['home',IC.home,'홈'],['explore',IC.compass,'탐색'],['saved',IC.heart,'저장'],['my',IC.user,'마이페이지']];
  return '<nav class="nav">'+items.map(function(it){
    return '<button class="nav-i'+(it[0]===active?' on':'')+'" onclick="navTo(\''+it[0]+'\')">'+it[1]+it[2]+'</button>';
  }).join('')+'</nav>';
}
function hdrBack(title){
  return '<header class="hdr"><button class="hdr-ico" onclick="goBack()">'+IC.back+'</button>'+
    '<div class="hdr-title">'+esc(title)+'</div>'+
    '<button class="lang-btn" onclick="VIEW.sheet=\'lang\';render()">'+langLabel(VIEW.lang)+'</button></header>';
}
function hdrTop(title,isLogo){
  return '<header class="hdr">'+(isLogo?'<div class="hdr-logo">K-BEAUTY STATION</div>':'<div class="hdr-big">'+esc(title)+'</div>')+
    '<button class="lang-btn" onclick="VIEW.sheet=\'lang\';render()">'+langLabel(VIEW.lang)+'</button></header>';
}
function sheet(){
  if(VIEW.sheet==='lang'){
    return '<div class="sheet-bg" onclick="VIEW.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="sheet-grab"></div><div class="sheet-h">화면 언어</div>'+
      LANGS.map(function(l){ return '<button class="sheet-i'+(l[0]===VIEW.lang?' on':'')+'" onclick="setLang(\''+l[0]+'\')">'+
        l[1]+(l[0]===VIEW.lang?IC.check:'')+'</button>'; }).join('')+'</div></div>';
  }
  if(VIEW.sheet==='sort'){
    var o=[['views','조회순'],['pop','인기순']];
    if(VIEW.tab==='product') o=o.concat([['asc','낮은 가격순'],['desc','높은 가격순']]);
    return '<div class="sheet-bg" onclick="VIEW.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="sheet-grab"></div><div class="sheet-h">정렬</div>'+
      o.map(function(x){ return '<button class="sheet-i'+(x[0]===VIEW.sort?' on':'')+'" onclick="setSort(\''+x[0]+'\')">'+
        x[1]+(x[0]===VIEW.sort?IC.check:'')+'</button>'; }).join('')+'</div></div>';
  }
  return '';
}
function act(label,sub,fn,primary){
  return '<button class="act'+(primary?' primary':'')+'" onclick="'+fn+'">'+
    '<div><div class="l">'+label+'</div><div class="s">'+sub+'</div></div>'+IC.chev+'</button>';
}
function skRows(n,h){
  var out='';
  for(var i=0;i<(n||3);i++) out+='<div class="sk-row"><div class="sk" style="width:'+(h||52)+'px;height:'+(h||52)+'px;border-radius:10px;flex:0 0 auto"></div>'+
    '<div style="flex:1"><div class="sk sk-line" style="width:62%"></div><div class="sk sk-line" style="width:40%"></div>'+
    ((h&&h>60)?'<div class="sk sk-line" style="width:28%;margin-bottom:0"></div>':'')+'</div></div>';
  return out;
}

/* 탐색 홈 */

  var subs=visibleCats().filter(function(c){ return c.parent; });

  else if(VIEW.fail.reco) recoSvc='<div class="retry"><div class="t">추천을 불러오지 못했습니다.<br>검색과 네 가지 시작점은 그대로 쓸 수 있습니다.</div>'+
    '<div class="b"><button class="mini on" onclick="setFail(\'reco\',false)">다시 시도</button></div></div>';
  else recoSvc = top.length ? top.map(serviceRow).join('')
    : '<div class="zero"><div class="t">이 언어로 공개된 서비스가 없습니다</div>'+
      '<div class="d">다른 언어를 고르거나 전체 목록에서 찾아보세요.</div>'+
      '<div class="b"><button class="mini" onclick="VIEW.sheet=\'lang\';render()">화면 언어 바꾸기</button></div></div>';

  var recoPlace=(VIEW.fail.reco||VIEW.loading==='reco')?'':
    '<div class="sec"><div class="sec-row"><div class="sec-t">인기 지역</div>'+
    '<button class="more" onclick="openPick(\'plc\')">전체 보기'+IC.chev+'</button></div>'+
    (areas.length?'<div class="chips">'+areas.map(function(p){
        return '<button class="chip" onclick="go(\'plc\',\''+p.id+'\')">'+esc(p.n)+'</button>'; }).join('')+'</div>'
      :'<div class="zero"><div class="t">이 언어로 공개된 지역이 없습니다</div></div>')+'</div>';

  return '<div class="scroll pad-nav">'+hdrTop('',true)+
    '<div class="exp-hero"><div class="t">시술 이름을 몰라도<br>찾을 수 있습니다</div>'+
    '<div class="s">분류, 고민, 부위, 지역 중 아무 데서나 시작하세요.</div></div>'+
    '<div style="padding:0 16px 20px"><div class="searchbar" onclick="openSearch(\'\')">'+IC.search+'시술·고민·지역 검색</div></div>'+
    '<div class="sec" style="border-top:8px solid var(--bg2)">'+
    '<div class="sec-t">무엇부터 고를까요</div><div class="sec-s">하나를 고른 뒤 다른 조건을 더할 수 있습니다.</div>'+
    '<div class="axis-grid">'+
      axisCard('cat',IC.grid,'분류',mains.length+'개 대분류 · '+subs.length+'개 중분류')+
      axisCard('itr',IC.bubble,'고민',concerns.length+'개')+
      axisCard('body',IC.body,'부위',bodies.length+'개')+
      axisCard('plc',IC.pin,'지역',areas.length+'개')+
    '</div></div>'+
    '<div class="sec"><div class="sec-row"><div class="sec-t">인기 서비스</div>'+
    ((VIEW.fail.reco||VIEW.loading==='reco')?'':'<button class="more" onclick="openPick(\'svc\')">전체 보기'+IC.chev+'</button>')+'</div>'+recoSvc+'</div>'+
    recoPlace+
    '<div class="sec"><div class="sec-t">전체에서 찾기</div>'+
    '<div class="sec-s">상품 목록과 스토어 목록은 여기서 계속 들어갈 수 있습니다.</div>'+
    '<div class="btn-pair"><button class="btn sm" onclick="go(\'products\')">전체 상품</button>'+

function axisCard(axis,ic,label,sub){
  return '<button class="axis" onclick="openPick(\''+axis+'\')">'+ic.replace('<svg','<svg class="ic"')+
    '<div class="nm">'+label+'</div><div class="ct">'+sub+'</div></button>';
}
function serviceRow(s){
  return '<button class="row" onclick="go(\'svc\',\''+s.id+'\')"><div class="thumb t52">'+IC.img+'</div>'+
    '<div class="row-b"><div class="row-nm">'+esc(s.n)+'</div>'+
    '<div class="row-path">'+esc(catPath(s.rep))+'</div></div>'+arrow()+'</button>';
}

/* 조건 선택 */
function openPick(axis){
  VIEW.stack.push(snapshot());
  VIEW.pickAxis=axis;
  VIEW.pickSel=VIEW.conds.filter(function(c){ return c.axis===axis; }).map(function(c){ return c.id; });
  VIEW.route='pick'; scrollMem[keyOf()]=0; render();
}
function pickToggle(id){ var i=VIEW.pickSel.indexOf(id); if(i>=0) VIEW.pickSel.splice(i,1); else VIEW.pickSel.push(id); render(); }
function pickDirty(){
  var cur=VIEW.conds.filter(function(c){ return c.axis===VIEW.pickAxis; }).map(function(c){ return c.id; }).sort().join(',');
  return cur!==VIEW.pickSel.slice().sort().join(',');
}
function pickApply(){
  var ax=VIEW.pickAxis;
  VIEW.conds=VIEW.conds.filter(function(c){ return c.axis!==ax; });
  VIEW.pickSel.forEach(function(id){ VIEW.conds.push({axis:ax,id:id}); });
  if(VIEW.stack.length) VIEW.stack.pop();
  if(!VIEW.conds.length){ go('explore',null,{noPush:true}); return; }
  VIEW.page=1; go('results');
}
function viewPick(){
  var ax=VIEW.pickAxis,title='',items=[];
  if(ax==='cat'){
    title='분류';
    visibleCats().filter(function(c){ return !c.parent; }).forEach(function(c){
      items.push({grp:c.n,id:c.id,nm:c.n+' 전체'});
      visibleCats().filter(function(x){ return x.parent===c.id; }).forEach(function(x){ items.push({grp:c.n,id:x.id,nm:x.n}); });
    });
  } else if(ax==='itr'){ title='고민'; visibleInterests('concern').forEach(function(x){ items.push({grp:'고민',id:x.id,nm:x.n}); });
  } else if(ax==='body'){ title='부위'; visibleInterests('body').forEach(function(x){ items.push({grp:'부위',id:x.id,nm:x.n}); });
  } else if(ax==='plc'){
    title='지역';
    DB.places.filter(function(p){ return p.type==='region'&&judgePlace(p).ok; }).forEach(function(r){
      items.push({grp:r.n,id:r.id,nm:r.n+' 전체'});
      DB.places.filter(function(p){ return p.parent===r.id&&p.type==='area'&&judgePlace(p).ok; })
        .forEach(function(a){ items.push({grp:r.n,id:a.id,nm:a.n}); });
    });
  } else { title='서비스'; visibleServices().forEach(function(s){ items.push({grp:'서비스',id:s.id,nm:s.n,sub:catPath(s.rep),link:true}); }); }

  var html='',last=null;
  if(!items.length){
    html='<div class="empty" style="padding-top:64px">'+IC.empty.replace('<svg','<svg class="ic"')+
      '<div class="t">이 언어로 공개된 항목이 없습니다</div>'+
      '<div class="d">다른 언어를 고르거나 전체 목록에서 찾아보세요.</div>'+
      '<div class="empty-acts">'+act('화면 언어 바꾸기','현재 언어에 공개된 정본만 보여 줍니다','VIEW.sheet=\'lang\';render()',true)+
      act('전체 상품 보기','조건 없이 전체 목록으로 이동','go(\'products\')')+'</div></div>';
  } else {
    items.forEach(function(it){
      if(it.grp!==last){ html+='<div class="pick-grp">'+esc(it.grp)+'</div>'; last=it.grp; }
      if(it.link){
        html+='<button class="pick-l" onclick="go(\'svc\',\''+it.id+'\')"><div class="row-b">'+
          '<div class="pick-nm">'+esc(it.nm)+'</div><div class="pick-sub">'+esc(it.sub)+'</div></div>'+arrow()+'</button>';
      } else {
        var on=VIEW.pickSel.indexOf(it.id)>=0;
        html+='<button class="pick-l'+(on?' on':'')+'" onclick="pickToggle(\''+it.id+'\')">'+
          '<div class="box">'+IC.check+'</div><div class="row-b"><div class="pick-nm">'+esc(it.nm)+'</div></div></button>';
      }
    });
  }
  var isSvc=(ax==='svc');
  var hasCur=VIEW.conds.some(function(c){ return c.axis===ax; });
  return '<div class="scroll" style="padding-bottom:'+(isSvc?62:88)+'px">'+hdrBack(title)+html+'</div>'+
    (isSvc?navBar('explore')
      :'<div class="pick-foot"><button class="btn fill" '+(pickDirty()?'':'disabled')+' onclick="pickApply()">'+
       (VIEW.pickSel.length?VIEW.pickSel.length+'개 조건 적용':(hasCur?'이 조건 해제':'항목을 선택하세요'))+'</button></div>');
}

/* 정본 검색 */
function viewSearch(){
  var r=searchCanonical(VIEW.qSubmitted);
  var cnt={all:r.service.length+r.concern.length+r.category.length+r.place.length,
           service:r.service.length,concern:r.concern.length,category:r.category.length,place:r.place.length};
  var types=[['all','전체'],['service','서비스'],['concern','고민·부위'],['category','분류'],['place','지역']];
  var pills='<div class="tabs-pill">'+types.map(function(t){
    return '<button class="chip'+(VIEW.stype===t[0]?' on':'')+'" onclick="VIEW.stype=\''+t[0]+'\';render()">'+t[1]+' '+cnt[t[0]]+'</button>';
  }).join('')+'</div>';

  if(!VIEW.qSubmitted){
    return '<div class="scroll pad-nav">'+hdrBack('검색')+searchField()+
      '<div class="empty" style="padding-top:44px">'+IC.search.replace('<svg','<svg class="ic"')+
      '<div class="t">무엇을 찾으시나요</div>'+
      '<div class="d">서비스, 고민, 부위, 분류, 지역을 찾습니다.<br>상품명과 스토어명은 각 목록 화면에서 찾습니다.</div></div>'+
      '</div>'+navBar('explore');
  }
  if(VIEW.loading==='search'){
    return '<div class="scroll pad-nav">'+hdrBack('검색')+searchField()+pills+
      '<div style="padding:0 16px">'+skRows(4,52)+'</div></div>'+navBar('explore');
  }
  if(cnt.all===0){
    return '<div class="scroll pad-nav">'+hdrBack('검색')+searchField()+pills+
      '<div class="empty">'+IC.empty.replace('<svg','<svg class="ic"')+
      '<div class="t">‘'+esc(VIEW.qSubmitted)+'’ 검색 결과가 없습니다</div>'+
      '<div class="d">서비스, 고민, 부위, 분류, 지역만 찾습니다.<br>다른 표현으로 다시 찾아보세요.</div>'+
      '<div class="empty-acts">'+
      act('검색어 고치기','입력한 검색어는 그대로 남아 있습니다','focusSearch()',true)+
      act('고민에서 고르기','공개된 고민 목록에서 선택','openPick(\'itr\')')+
      act('분류에서 고르기','공개된 분류 목록에서 선택','openPick(\'cat\')')+
      act('전체 상품 보기','조건 없이 상품 목록으로 이동','go(\'products\')')+
      act('전체 스토어 보기','조건 없이 스토어 목록으로 이동','go(\'stores\')')+
      '</div></div></div>'+navBar('explore');
  }
  function grp(label,arr,kind){
    if(!arr.length) return '';
    if(VIEW.stype!=='all'&&VIEW.stype!==kind) return '';
    return '<div class="grp">'+label+'</div>'+arr.map(function(x){
      var e=x.e, route=kind==='service'?'svc':kind==='concern'?'itr':kind==='category'?'cat':'plc';
      var path=kind==='service'?catPath(e.rep):kind==='category'?catPath(e.id)
             :kind==='place'?placePath(e.id):(e.type==='body'?'부위':'고민');
      var badge=x.by==='syn'?'<span class="match">‘'+esc(x.syn)+'’로도 불립니다</span>'
             :(kind==='service'?'<span class="match">이름 일치</span>':'');
      return '<button class="row" onclick="go(\''+route+'\',\''+e.id+'\')"><div class="thumb t52'+(kind==='service'?'':' g')+'">'+
        (kind==='service'?IC.img:kind==='place'?IC.pin:kind==='category'?IC.grid:IC.bubble)+'</div>'+
        '<div class="row-b"><div class="row-nm">'+esc(e.n)+'</div>'+
        '<div class="row-path">'+esc(path)+'</div>'+badge+'</div>'+arrow()+'</button>';
    }).join('');
  }
  return '<div class="scroll pad-nav">'+hdrBack('검색')+searchField()+pills+
    '<div style="padding:0 16px 20px">'+grp('서비스',r.service,'service')+grp('고민·부위',r.concern,'concern')+
    grp('분류',r.category,'category')+grp('지역',r.place,'place')+'</div></div>'+navBar('explore');
}
function searchField(){
  return '<div style="padding:12px 16px"><div class="searchfield">'+IC.search+
    '<input id="qin" value="'+esc(VIEW.q)+'" placeholder="시술·고민·지역 검색" '+
    'oninput="VIEW.q=this.value;syncClear()" onkeydown="if(event.key===\'Enter\')submitSearch()">'+
    '<button class="clear-x" id="clrb" style="display:'+(VIEW.q?'block':'none')+'" onclick="VIEW.q=\'\';render();focusSearch()">✕</button>'+
    '<button class="go-s" onclick="submitSearch()">검색</button></div></div>';

function syncClear(){ var b=document.getElementById('clrb'); if(b) b.style.display=VIEW.q?'block':'none'; }
function focusSearch(){ var el=document.getElementById('qin'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }

/* 조건 결과 */
function viewResults(){
  var conds=VIEW.conds;
  var cS=countTab(conds,'service'),cP=countTab(conds,'product'),cT=countTab(conds,'store');
  var cur=VIEW.tab==='service'?cS:VIEW.tab==='store'?cT:cP;

  var bar='<div class="condbar" style="top:52px"><div class="condbar-in">'+
    conds.map(function(c){
      return '<button class="chip on" onclick="removeCond(\''+c.axis+'\',\''+c.id+'\')">'+esc(condName(c))+'<span class="x">✕</span></button>'; }).join('')+
    '<button class="chip add" onclick="openPick(\'cat\')">＋ 조건 추가</button>'+
    '</div><div class="condbar-fade"><button class="reset" onclick="VIEW.conds=[];go(\'explore\')">모두 해제</button></div></div>';
  var tabs='<div class="tabs" style="top:107px">'+
    tabBtn('service','서비스',cS)+tabBtn('product','상품',cP)+tabBtn('store','스토어',cT)+'</div>';

  if(VIEW.loading==='results'){
    return '<div class="scroll pad-nav">'+hdrBack('결과')+bar+tabs+
      '<div class="sortbar"><div class="sk sk-line" style="width:70px;margin:0"></div>'+
      '<div class="sk" style="width:90px;height:32px;border-radius:9px"></div></div>'+
      '<div style="padding:0 16px">'+skRows(4,88)+'</div></div>'+navBar('explore');
  }
  if(cur===0){
    var rows=conds.map(function(c){
      var rest=conds.filter(function(x){ return !(x.axis===c.axis&&x.id===c.id); });
      return {c:c,n:countTab(rest,VIEW.tab)};
    }).sort(function(a,b){ return b.n-a.n; });
    return '<div class="scroll pad-nav">'+hdrBack('결과')+bar+tabs+

function viewSvc(){
  var s=S(VIEW.id);
  var prods=productsOfService(s.id),strs=storesOfService(s.id);
  var cts=contentsFor('svc',s.id);
  if(VIEW.fail.contentCard) cts=cts.filter(function(c){ return c.id!=='CT2'; });
  var itrs=s.itr.map(I).filter(function(x){ return x&&judgeInterest(x).ok; });
  var bodies=s.body.map(I).filter(function(x){ return x&&judgeInterest(x).ok; });
  var similar=visibleServices().filter(function(x){ return x.id!==s.id&&x.rep===s.rep; });
  visibleServices().forEach(function(x){
    if(similar.length>=3) return;
    if(x.id!==s.id&&similar.indexOf(x)<0&&x.cats.some(function(cc){ return s.cats.indexOf(cc)>=0; })) similar.push(x);
  });
  similar=similar.slice(0,3);
  var places=[],sp={};
  prods.forEach(function(p){ var pl=P(ST(p.store).place); if(pl&&judgePlace(pl).ok&&!sp[pl.id]){ sp[pl.id]=1; places.push(pl); } });

  var rep=C(s.rep),chain=[],cu=rep;
  while(cu){ chain.unshift(cu); cu=cu.parent?C(cu.parent):null; }
  var crumb='<a onclick="go(\'explore\')">탐색</a> › '+
    chain.map(function(x){ return '<a onclick="go(\'cat\',\''+x.id+'\')">'+esc(x.n)+'</a>'; }).join(' › ')+
    ' › <span class="cur">'+esc(s.n)+'</span>';

  } else if(cts.length){
    content='<div class="sec"><div class="sec-t" style="margin-bottom:13px">관련 글</div>'+cts.map(contentCard).join('')+'</div>';
  }

      :'<button class="btn" onclick="go(\'cat\',\''+s.rep+'\')">'+esc(rep.n)+' 분류로</button>')+'</div>';

  return '<div class="scroll pad-nav pad-cta">'+hdrBack(s.n)+

    '<div class="land-body">'+esc(s.d)+'</div>'+
    (s.crit.length?'<div class="critbox"><div class="t">고르기 전에 확인할 것</div>'+
      s.crit.map(function(x){ return '<div class="critline"><span class="b">·</span><span>'+esc(x)+'</span></div>'; }).join('')+'</div>':'')+
    '</div>'+
    (rel?'<div class="sec" style="border-top:8px solid var(--bg2)"><div class="sec-t" style="margin-bottom:15px">관련 정보</div>'+rel+'</div>':'')+
    (prods.length
      ?'<div class="sec"><div class="sec-row"><div class="sec-t">이 서비스가 포함된 상품</div>'+
        '<button class="more" onclick="applyConds([{axis:\'svc\',id:\''+s.id+'\'}],\'product\')">전체 '+prods.length+'건'+IC.chev+'</button></div>'+
        prods.slice(0,2).map(productCard).join('')+'</div>'
      :'<div class="sec"><div class="sec-t" style="margin-bottom:13px">이 서비스가 포함된 상품</div>'+
        '<div class="zero"><div class="t">아직 등록된 상품이 없습니다</div>'+
        '<div class="d">이 서비스를 파는 스토어가 아직 없습니다.<br>비슷한 서비스에는 상품이 있습니다.</div>'+

        '<div class="b"><button class="mini" onclick="openPick(\'plc\')">다른 지역 고르기</button></div></div></div>')+
    '</div>'+cta+navBar('explore');
}

/* 기존 목록·상세 */
function viewList(kind){
  var title=kind==='products'?'상품':'스토어';
  var items=kind==='products'?DB.products.filter(productVisible):DB.stores.filter(storeVisible);
  return '<div class="scroll pad-nav">'+hdrBack(title)+
    '<div class="sortbar"><div class="count"><b>'+items.length+'</b>'+(kind==='products'?'개 상품':'개 스토어')+'</div>'+
    '<button class="sortbtn">조회순'+IC.chevD+'</button></div>'+
    '<div style="padding:0 16px 16px">'+items.map(kind==='products'?productCard:storeCard).join('')+'</div>'+
    '</div>'+navBar('explore');
}
function viewPdetail(){
  var p=PR(VIEW.id); if(!p) return viewNotFound();
  var st=ST(p.store),saved=isSaved('product',p.id);
  return '<div class="scroll pad-nav pad-cta">'+hdrBack(p.n)+
    '<div class="thumb'+(TONE[st.id]||'')+'" style="height:200px;border-radius:0">'+IC.img.replace('<svg','<svg style="width:46px;height:46px"')+'</div>'+
    '<div class="land-head"><div class="pstore" style="font-size:12.5px">'+esc(st.name)+'</div>'+
    '<div class="land-h1" style="font-size:19px;margin-top:7px">'+esc(p.n)+'</div>'+
    '<div class="pprice" style="margin-top:16px;font-size:22px">'+(p.price==null?'상담 후 결정':won(p.price))+'</div></div>'+
    '<div class="sec" style="border-top:8px solid var(--bg2)"><div class="sec-t" style="margin-bottom:13px">포함 서비스</div>'+
    '<div class="chips">'+approvedIds(p).filter(function(id){ return judgeService(S(id)).ok; })
      .map(function(id){ return '<button class="chip" onclick="go(\'svc\',\''+id+'\')">'+esc(S(id).n)+'</button>'; }).join('')+'</div></div>'+
    '</div><div class="cta"><button class="cta-fav'+(saved?' on':'')+'" onclick="toggleSave(\'product\',\''+p.id+'\')">'+IC.heart+'</button>'+
    '<button class="btn fill" onclick="VIEW.toast=\'기존 문의 흐름으로 이동합니다.\';render()">문의하기</button></div>'+navBar('explore');
}
function viewSdetail(){
  var st=ST(VIEW.id); if(!st) return viewNotFound();
  var saved=isSaved('store',st.id);
  var prods=DB.products.filter(function(p){ return p.store===st.id&&productVisible(p); });
  return '<div class="scroll pad-nav pad-cta">'+hdrBack(st.name)+
    '<div class="thumb'+(TONE[st.id]||'')+'" style="height:200px;border-radius:0">'+IC.img.replace('<svg','<svg style="width:46px;height:46px"')+'</div>'+
    '<div class="land-head"><div class="land-h1" style="font-size:20px">'+esc(st.name)+'</div>'+
    '<div class="smeta"><span class="star">'+IC.star+esc(st.rating)+'</span><span>('+st.rev.toLocaleString('ko-KR')+')</span>'+
    '<span>'+esc(st.walk)+'</span></div></div>'+
    '<div class="sec" style="border-top:8px solid var(--bg2)"><div class="sec-t" style="margin-bottom:13px">상품</div>'+
    prods.map(productCard).join('')+'</div></div>'+
    '<div class="cta"><button class="cta-fav'+(saved?' on':'')+'" onclick="toggleSave(\'store\',\''+st.id+'\')">'+IC.heart+'</button>'+
    '<button class="btn fill" onclick="VIEW.toast=\'기존 예약 흐름으로 이동합니다.\';render()">예약하기</button></div>'+navBar('explore');
}

/* 저장 */
function viewSaved(){
  var svc=VIEW.saved.filter(function(s){ return s.kind==='svc'; }).map(function(s){ return S(s.id); }).filter(Boolean);
  var prd=VIEW.saved.filter(function(s){ return s.kind==='product'; }).map(function(s){ return PR(s.id); }).filter(Boolean);
  var strs=VIEW.saved.filter(function(s){ return s.kind==='store'; }).map(function(s){ return ST(s.id); }).filter(Boolean);
  var okS=svc.filter(function(s){ return judgeService(s).ok; });
  var okP=prd.filter(productVisible);
  var okT=strs.filter(storeVisible);
  var gone=[].concat(
    svc.filter(function(s){ return !judgeService(s).ok; }).map(function(s){ return {k:'svc',e:s}; }),
    prd.filter(function(p){ return !productVisible(p); }).map(function(p){ return {k:'product',e:p}; }),
    strs.filter(function(s){ return !storeVisible(s); }).map(function(s){ return {k:'store',e:s}; }));
  var total=okS.length+okP.length+okT.length+gone.length;

  if(!total){
    return '<div class="scroll pad-nav">'+hdrTop('저장')+
      '<div class="empty" style="padding-top:70px">'+IC.heart.replace('<svg','<svg class="ic"')+
      '<div class="t">저장한 항목이 없습니다</div>'+
      '<div class="d">서비스, 상품, 스토어 화면의 저장 버튼을 누르면<br>여기에 모입니다.</div>'+
      '<div class="empty-acts">'+act('탐색으로 가기','분류나 고민에서 시작합니다','navTo(\'explore\')',true)+'</div></div>'+
      '</div>'+navBar('saved');
  }
  var out='<div class="scroll pad-nav">'+hdrTop('저장')+
    '<div class="tabs-pill"><button class="chip on">전체 '+total+'</button>'+
    '<button class="chip">서비스 '+okS.length+'</button><button class="chip">상품 '+okP.length+'</button>'+
    '<button class="chip">스토어 '+okT.length+'</button></div><div style="padding:0 16px 16px">';
  if(okS.length) out+='<div class="grp">서비스</div>'+okS.map(function(s){
    return '<div class="row"><div class="thumb t52">'+IC.img+'</div>'+
      '<div class="row-b" onclick="go(\'svc\',\''+s.id+'\')"><div class="row-nm">'+esc(s.n)+'</div>'+
      '<div class="row-path">'+esc(catPath(s.rep))+'</div></div>'+
      '<button class="mini" style="align-self:center" onclick="toggleSave(\'svc\',\''+s.id+'\')">해제</button></div>';
  }).join('');
  if(okP.length) out+='<div class="grp">상품</div>'+okP.map(productCard).join('');
  if(okT.length) out+='<div class="grp">스토어</div>'+okT.map(storeCard).join('');
  if(gone.length) out+='<div class="grp">지금은 볼 수 없는 항목</div>'+gone.map(function(g){
    return '<div class="pcard" style="cursor:default"><div class="thumb t88 g">'+IC.img+'</div>'+
      '<div class="pbody"><div class="pstore">이전에 저장함</div>'+
      '<div class="pname">'+esc(g.e.n||g.e.name)+'</div>'+
      '<div class="ptags"><span class="ptag">현재 공개되지 않음</span></div></div>'+
      '<button class="mini" style="align-self:center" onclick="toggleSave(\''+g.k+'\',\''+g.e.id+'\')">삭제</button></div>';
  }).join('');
  return out+'</div></div>'+navBar('saved');
}
function viewMy(){
  return '<div class="scroll pad-nav">'+hdrTop('마이페이지')+
    '<div class="sec"><div class="sec-t">로그인 중</div><div class="sec-s">guest@example.com</div></div>'+
    '<div class="sec"><button class="btn sm" onclick="VIEW.loggedIn=false;VIEW.saved=[];navTo(\'explore\')">로그아웃</button></div>'+
    '</div>'+navBar('my');
}
function viewLogin(){
  return '<div class="scroll">'+
    '<header class="hdr"><button class="hdr-ico" onclick="cancelLogin()">'+IC.back+'</button>'+
    '<div class="hdr-title">로그인</div><div class="hdr-sp"></div></header>'+
    '<div class="login-wrap"><div class="t">로그인이 필요합니다</div>'+
    '<div class="d">'+(VIEW.pending?'로그인하면 보던 화면으로 돌아가 저장까지 마칩니다.':'저장과 마이페이지는 로그인 후 이용할 수 있습니다.')+'</div>'+
    '<div class="fld"><label>이메일</label><div class="inp">guest@example.com</div></div>'+
    '<div class="fld"><label>비밀번호</label><div class="inp">••••••••</div></div>'+
    '<div style="margin-top:22px"><button class="btn fill" onclick="doLogin()">로그인</button></div>'+
    '<div style="margin-top:9px"><button class="btn" onclick="cancelLogin()">나중에 하기</button></div>'+
    '</div></div>';
}

/* 상태 화면 */
function viewUnavailable(){
  var others=(VIEW.altLangs||[]).filter(function(l){ return l!==VIEW.lang; });
  return '<div class="scroll pad-nav">'+hdrBack('찾을 수 없음')+
    '<div class="empty" style="padding-top:60px">'+IC.globe.replace('<svg','<svg class="ic"')+
    '<div class="t">이 화면은 '+langLabel(VIEW.lang)+'로<br>공개되지 않았습니다</div>'+
    '<div class="d">주소는 있지만 지금 보고 있는 언어로는<br>아직 공개되지 않았습니다.</div>'+
    (others.length?'<div class="lang-list">'+others.map(function(l){
      return '<button class="lang-r" onclick="setLang(\''+l+'\')"><div class="nm">'+langLabel(l)+'로 보기</div>'+IC.chev+'</button>';
    }).join('')+'</div>':'')+
    '<div class="empty-acts">'+act('탐색 홈으로','현재 언어로 공개된 것만 보여 줍니다','navTo(\'explore\')',true)+'</div>'+
    '</div></div>'+navBar('explore');
}
function viewNotFound(){
  return '<div class="scroll pad-nav">'+hdrBack('찾을 수 없음')+
    '<div class="empty" style="padding-top:60px">'+IC.alert.replace('<svg','<svg class="ic"')+
    '<div class="t">이 화면을 찾을 수 없습니다</div>'+
    '<div class="d">내려갔거나 주소가 잘못되었을 수 있습니다.</div>'+
    '<div class="empty-acts">'+act('탐색 홈으로','분류나 고민에서 시작합니다','navTo(\'explore\')',true)+
    act('전체 상품 보기','조건 없이 상품 목록으로 이동','go(\'products\')')+'</div>'+
    '</div></div>'+navBar('explore');
}
function viewAllError(){
  return '<div class="scroll pad-nav">'+hdrBack('오류')+
    '<div class="empty" style="padding-top:70px">'+IC.alert.replace('<svg','<svg class="ic"')+
    '<div class="t">화면을 불러오지 못했습니다</div>'+
    '<div class="d">잠시 뒤 다시 시도해 주세요.<br>입력한 검색어와 조건은 그대로 남아 있습니다.</div>'+
    '<div class="empty-acts">'+act('다시 시도','같은 조건으로 다시 불러옵니다','setFail(\'all\',false)',true)+'</div>'+
    '</div></div>'+navBar('explore');
}

resetDB();
</script>
