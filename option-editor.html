<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Beauty Station 옵션 체계 편집 도구</title>
<style>
:root {
  --bg: #fbf7f9; --surface: #ffffff; --surface-2: #f6eef2; --border: #ecdfe6;
  --text: #2a2126; --muted: #8b7d85; --accent: #e0447a; --accent-soft: #fce4ee;
  --keep: #9aa0a6; --new: #16a34a; --new-bg: #e7f6ec; --rename: #d97706; --rename-bg: #fbeede;
  --move: #7c5cd6; --move-bg: #eee7fb; --merge: #2563eb; --merge-bg: #e4eefc; --del: #b23b3b; --del-bg: #f6e3e3;
  --shadow: 0 1px 2px rgba(40,20,30,.06), 0 4px 12px rgba(40,20,30,.05);
  --radius: 12px; --col-w: 300px;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171215; --surface: #201a1e; --surface-2: #2a2228; --border: #3a2f36;
    --text: #f3ebef; --muted: #a597a0; --accent: #f06898; --accent-soft: #3a1f2c;
    --keep: #7d7278; --new: #4ade80; --new-bg: #16301f; --rename: #f0b45e; --rename-bg: #35270f;
    --move: #b39af0; --move-bg: #271b3d; --merge: #6ea8fb; --merge-bg: #16233c; --del: #f08b8b; --del-bg: #3a1f1f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"] {
  --bg: #fbf7f9; --surface: #ffffff; --surface-2: #f6eef2; --border: #ecdfe6;
  --text: #2a2126; --muted: #8b7d85; --accent: #e0447a; --accent-soft: #fce4ee;
  --keep: #9aa0a6; --new: #16a34a; --new-bg: #e7f6ec; --rename: #d97706; --rename-bg: #fbeede;
  --move: #7c5cd6; --move-bg: #eee7fb; --merge: #2563eb; --merge-bg: #e4eefc; --del: #b23b3b; --del-bg: #f6e3e3;
}
:root[data-theme="dark"] {
  --bg: #171215; --surface: #201a1e; --surface-2: #2a2228; --border: #3a2f36;
  --text: #f3ebef; --muted: #a597a0; --accent: #f06898; --accent-soft: #3a1f2c;
  --keep: #7d7278; --new: #4ade80; --new-bg: #16301f; --rename: #f0b45e; --rename-bg: #35270f;
  --move: #b39af0; --move-bg: #271b3d; --merge: #6ea8fb; --merge-bg: #16233c; --del: #f08b8b; --del-bg: #3a1f1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* Header */
.topbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.topbar-inner { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.brand .sub { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tab { border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 7px 14px; border-radius: 7px; transition: .15s; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; transition: .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.05); color: #fff; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.small { padding: 4px 8px; font-size: 11.5px; }

/* Save state */
.savepill { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.savepill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--new); }
.savepill.dirty .dot { background: var(--rename); }

/* Legend + summary */
.subbar { display: flex; align-items: center; gap: 14px; padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; font-size: 12px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.filterbox { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.filterbox input { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; width: 200px; font-family: inherit; }
.filterbox input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }

/* Board */
.board { display: flex; gap: 14px; padding: 18px 20px 60px; overflow-x: auto; align-items: flex-start; min-height: 60vh; }
.col { flex: 0 0 var(--col-w); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 190px); }
.col.trash { --col-w: 260px; border-style: dashed; border-color: var(--del); background: color-mix(in srgb, var(--del-bg) 40%, var(--surface)); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: inherit; border-radius: var(--radius) var(--radius) 0 0; }
.col-head h3 { font-size: 13.5px; font-weight: 700; }
.col-head .count { font-size: 11px; color: var(--muted); background: var(--surface-2); padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums; }
.col-head .add { margin-left: auto; }
.col.dragover { outline: 2px solid var(--accent); outline-offset: -2px; }
.col-body { padding: 10px; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
.col-def { font-size: 11px; color: var(--muted); padding: 0 14px 10px; line-height: 1.4; border-bottom: 1px solid var(--border); margin-bottom: 2px; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; cursor: grab; transition: .12s; position: relative; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card.dragging { opacity: .4; }
.card .row1 { display: flex; align-items: center; gap: 7px; }
.card .name { font-weight: 600; font-size: 13px; flex: 1; word-break: break-word; }
.card .tr { font-size: 11px; color: var(--muted); margin-top: 3px; display: none; word-break: break-word; }
.card.show-tr .tr { display: block; }
.card .acts { display: flex; gap: 3px; opacity: 0; transition: .12s; }
.card:hover .acts { opacity: 1; }
.card .icon { border: none; background: var(--surface-2); color: var(--muted); width: 22px; height: 22px; border-radius: 6px; font-size: 12px; display: grid; place-items: center; padding: 0; }
.card .icon:hover { background: var(--accent-soft); color: var(--accent); }
.card.deleted { opacity: .6; background: var(--del-bg); border-style: dashed; }
.card.deleted .name { text-decoration: line-through; color: var(--del); }

/* status/tag badges */
.badge { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 20px; letter-spacing: .02em; white-space: nowrap; }
.b-신규, .b-new { background: var(--new-bg); color: var(--new); }
.b-변경, .b-rename { background: var(--rename-bg); color: var(--rename); }
.b-이동, .b-move { background: var(--move-bg); color: var(--move); }
.b-통합, .b-merge { background: var(--merge-bg); color: var(--merge); }
.b-삭제, .b-del { background: var(--del-bg); color: var(--del); }
.b-유지, .b-keep { background: var(--surface-2); color: var(--keep); }
.stype { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); cursor: pointer; }

/* stype select popover */
.mini-select { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; font-size: 11px; padding: 2px 4px; font-family: inherit; }

/* keyword tab compact */
.kwlist .card { padding: 6px 9px; }
.kwlist .card .name { font-size: 12.5px; }
.group-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; padding: 4px 2px; }
.group-head h4 { font-size: 12px; font-weight: 700; color: var(--accent); margin: 0; }
.group-head .gcount { font-size: 10.5px; color: var(--muted); }

.empty { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 8px; font-style: italic; }
.hidden { display: none !important; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(20,10,15,.45); display: grid; place-items: center; z-index: 50; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: min(420px, 92vw); box-shadow: var(--shadow); }
.modal h3 { font-size: 15px; margin-bottom: 12px; }
.modal label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
.modal input, .modal select { width: 100%; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.tr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .tr-grid { grid-template-columns: 1fr; } }

</style>
</head>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>옵션 체계 편집</h1>
      <span class="sub">회의용 · 조합하며 확정</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="sub" aria-selected="true">세부분류</button>
      <button class="tab" role="tab" data-tab="grp" aria-selected="false">키워드그룹</button>
      <button class="tab" role="tab" data-tab="kw" aria-selected="false">키워드</button>
    </div>
    <div class="spacer"></div>
    <span class="savepill" id="savepill"><span class="dot"></span><span id="savetxt">저장됨</span></span>
    <button class="btn small" id="btn-theme" title="테마 전환">◐</button>
    <button class="btn small" id="btn-export">내보내기 ▾</button>
    <button class="btn small ghost" id="btn-reset">초기화</button>
  </div>
  <div class="subbar">
    <div class="legend">
      <span><i style="background:var(--merge)"></i>통합</span>
      <span><i style="background:var(--rename)"></i>변경</span>
      <span><i style="background:var(--move)"></i>이동</span>
      <span><i style="background:var(--new)"></i>신규</span>
      <span><i style="background:var(--del)"></i>삭제</span>
      <span><i style="background:var(--keep)"></i>유지</span>
    </div>
    <span id="summary" style="color:var(--muted)"></span>
    <div class="filterbox">
      <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px"><input type="checkbox" id="chk-tr" style="width:auto"> 번역보기</label>
      <input type="search" id="search" placeholder="검색…">
    </div>
  </div>
</div>

<div id="view-sub" class="board"></div>
<div id="view-grp" class="board hidden"></div>
<div id="view-kw" class="board kwlist hidden"></div>

  }
  function renderGrp() {
    var root = document.getElementById('view-grp'); root.innerHTML = '';
    var map = groupsOf();
    var byCat = {}; catNames().forEach(function (c) { byCat[c] = []; });
    Object.keys(map).forEach(function (key) { var g = map[key]; if (byCat[g.cat]) byCat[g.cat].push(g); });
    catNames().forEach(function (cat) {
      var groups = byCat[cat].filter(function (g) { return !document.getElementById('search').value || g.group.toLowerCase().indexOf(document.getElementById('search').value.toLowerCase()) >= 0; });
      groups.sort(function (a, b) { return b.items.length - a.items.length; });
      root.appendChild(grpColumn(cat, groups, catDef(cat)));
    });
    root.appendChild(addCatColumn());
  }
  function grpColumn(cat, groups, def) {
    var col = el('div', 'col');
    var head = el('div', 'col-head');
    var h3c = el('h3', null, cat); h3c.style.cursor = 'pointer'; h3c.title = '카테고리 이름·정의 편집'; h3c.onclick = function () { openCatModal(cat); }; head.appendChild(h3c);
    head.appendChild(el('span', 'count', String(groups.length)));
    var add = el('button', 'btn small add', '＋'); add.title = '그룹 추가';
    add.onclick = function () { openGroupModal(null, cat); };
    head.appendChild(add);
    col.appendChild(head);
    if (def) col.appendChild(el('div', 'col-def', def));
    var body = el('div', 'col-body');
    if (!groups.length) body.appendChild(el('div', 'empty', '그룹 없음'));
    groups.forEach(function (g) { body.appendChild(grpCard(g)); });
    col.appendChild(body);
    colDnd(col, 'grp', function (id) {
      // id = cat||group
      var parts = id.split('||'); var oc = parts[0], gn = parts.slice(1).join('||');
      if (oc === cat) return;
      state.kw.forEach(function (k) { if (!k.deleted && k.cat === oc && k.group === gn) k.cat = cat; });
      markDirty(); rerender();
    });
    return col;
  }
  function grpCard(g) {
    var c = el('div', 'card');
    c.draggable = true;
    var gid = g.cat + '||' + g.group;
    c.addEventListener('dragstart', function (e) { onDragStart(e, gid, 'grp'); });
    c.addEventListener('dragend', onDragEnd);
    var r1 = el('div', 'row1');
    r1.appendChild(el('span', 'name', g.group));
    r1.appendChild(el('span', 'gcount badge b-keep', g.items.length + '개'));
    var acts = el('div', 'acts');
    var ren = el('button', 'icon', '✎'); ren.title = '그룹명 변경'; ren.onclick = function (e) { e.stopPropagation(); openGroupModal(g, g.cat); };
    var del = el('button', 'icon', '✕'); del.title = '그룹 삭제(키워드 전체 삭제대상)'; del.onclick = function (e) { e.stopPropagation(); if (confirm('"' + g.group + '" 그룹의 키워드 ' + g.items.length + '개를 삭제 대상으로 보냅니다.')) { g.items.forEach(function (k) { k.deleted = true; }); markDirty(); rerender(); } };
    acts.appendChild(ren); acts.appendChild(del);
    r1.appendChild(acts);
    c.appendChild(r1);
    return c;
  }

  /* ================= KEYWORD tab ================= */
  function renderKw() {
    var root = document.getElementById('view-kw'); root.innerHTML = '';
    catNames().forEach(function (cat) {
      var items = state.kw.filter(function (k) { return !k.deleted && k.cat === cat && matchSearch(k); });
      root.appendChild(kwColumn(cat, items));
    });
    var del = state.kw.filter(function (k) { return k.deleted && matchSearch(k); });
    root.appendChild(trashColumn('kw', del.length, function (col) { del.forEach(function (k) { col.appendChild(kwCard(k)); }); }));
    root.appendChild(addCatColumn());
  }
  function kwColumn(cat, items) {
    var col = el('div', 'col');
    var head = el('div', 'col-head');
    var h3c = el('h3', null, cat); h3c.style.cursor = 'pointer'; h3c.title = '카테고리 이름·정의 편집'; h3c.onclick = function () { openCatModal(cat); }; head.appendChild(h3c);
    head.appendChild(el('span', 'count', String(items.length)));
    var add = el('button', 'btn small add', '＋'); add.title = '키워드 추가';
    add.onclick = function () { openKwModal(null, cat); };
    head.appendChild(add);
    col.appendChild(head);
    var body = el('div', 'col-body');
    if (!items.length) body.appendChild(el('div', 'empty', '비어 있음'));
    // group within column
    var groups = {};
    items.forEach(function (k) { (groups[k.group] = groups[k.group] || []).push(k); });
    Object.keys(groups).forEach(function (gn) {
      var gh = el('div', 'group-head');
      gh.appendChild(el('h4', null, gn));
      gh.appendChild(el('span', 'gcount', groups[gn].length + '개'));
      body.appendChild(gh);
      groups[gn].forEach(function (k) { body.appendChild(kwCard(k)); });
    });
    col.appendChild(body);
    colDnd(col, 'kw', function (id) { var k = byUid(state.kw, id); if (k && (k.cat !== cat || k.deleted)) { k.cat = cat; k.deleted = false; markDirty(); rerender(); } });
    return col;
  }
  function kwCard(k) {
    var c = el('div', 'card' + (k.deleted ? ' deleted' : '') + (showTr ? ' show-tr' : ''));
    c.draggable = true;
    c.addEventListener('dragstart', function (e) { onDragStart(e, k.uid, 'kw'); });
    c.addEventListener('dragend', onDragEnd);
    var r1 = el('div', 'row1');
    r1.appendChild(el('span', 'name', k.ko));
    var st = kwStatus(k);
    r1.appendChild(el('span', 'badge b-' + st, TAGLABEL[st]));
    var acts = el('div', 'acts');
    var edit = el('button', 'icon', '✎'); edit.title = '편집'; edit.onclick = function (e) { e.stopPropagation(); openKwModal(k, k.cat); };
    acts.appendChild(edit);
    if (k.deleted) { var res = el('button', 'icon', '↩'); res.onclick = function (e) { e.stopPropagation(); k.deleted = false; markDirty(); rerender(); }; acts.appendChild(res); }
    else { var dl = el('button', 'icon', '✕'); dl.onclick = function (e) { e.stopPropagation(); k.deleted = true; markDirty(); rerender(); }; acts.appendChild(dl); }
    r1.appendChild(acts);
    c.appendChild(r1);
    if (k.tr.some(function (x) { return x; })) c.appendChild(el('div', 'tr', trText(k.tr)));
    return c;
  }

  /* ---------- shared ---------- */
  function trashColumn(kind, n, fill) {
    var col = el('div', 'col trash');
    var head = el('div', 'col-head');
    head.appendChild(el('h3', null, '🗑 삭제 대상'));
    head.appendChild(el('span', 'count', String(n)));
    col.appendChild(head);
    var body = el('div', 'col-body');
    if (!n) body.appendChild(el('div', 'empty', '삭제 대상 없음'));
    fill(body);
    col.appendChild(body);
    colDnd(col, kind, function (id) {
      var arr = kind === 'sub' ? state.sub : state.kw; var it = byUid(arr, id);
      if (it) { it.deleted = true; markDirty(); rerender(); }
    });
    return col;
  }
  function trText(tr) { var out = []; for (var i = 0; i < tr.length; i++) if (tr[i]) out.push(LANGS[i] + ': ' + tr[i]); return out.join('  ·  '); }
  function byUid(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].uid === id) return arr[i]; return null; }

  /* ---------- modals ---------- */
  function modal(title, bodyBuild, onOk) {
    var root = document.getElementById('modal-root');
    var bg = el('div', 'modal-bg');
    var m = el('div', 'modal');
    m.appendChild(el('h3', null, title));
    var form = el('div'); bodyBuild(form); m.appendChild(form);
    var acts = el('div', 'actions');
    var cancel = el('button', 'btn', '취소'); cancel.onclick = close;
    var ok = el('button', 'btn primary', '확인'); ok.onclick = function () { if (onOk() !== false) close(); };
    acts.appendChild(cancel); acts.appendChild(ok); m.appendChild(acts);
    bg.appendChild(m); root.appendChild(bg);
    bg.addEventListener('mousedown', function (e) { if (e.target === bg) close(); });
    function close() { root.innerHTML = ''; }
    return { close: close };
  }
  function trInputs(form, tr) {
    var wrap = el('div', 'tr-grid'); var inputs = [];
    LANGS.forEach(function (lg, i) {
      var l = el('label', null, lg); form.appendChild(l);
      var inp = el('input'); inp.value = tr && tr[i] || ''; inputs.push(inp);
      var cell = el('div'); cell.appendChild(inp); wrap.appendChild(cell);
      form.removeChild(l); // reposition into grid
    });
    // build grid properly
    wrap.innerHTML = '';
    LANGS.forEach(function (lg, i) {
      var cell = el('div');
      cell.appendChild(el('label', null, lg));
      cell.appendChild(inputs[i]);
      wrap.appendChild(cell);
    });
    form.appendChild(wrap);
    return inputs;
  }
  function openSubModal(s, cat) {
    var isNew = !s;
    modal(isNew ? '세부분류 추가 (' + cat + ')' : '세부분류 편집', function (form) {
      form.appendChild(el('label', null, '이름 (한국어)'));
      var nm = el('input'); nm.value = s ? s.ko : ''; form.appendChild(nm); form.nm = nm;
      form.appendChild(el('label', null, '카테고리'));
      var cs = el('select'); catNames().forEach(function (c) { var o = el('option', null, c); o.value = c; if ((s ? s.cat : cat) === c) o.selected = true; cs.appendChild(o); }); form.appendChild(cs); form.cs = cs;
      form.appendChild(el('label', null, '시술구분 (뷰티 클리닉만 사용)'));
      var ss = el('select'); ['', '시술', '수술', '치과', '공통'].forEach(function (v) { var o = el('option', null, v || '(없음)'); o.value = v; if ((s ? s.stype : '') === v) o.selected = true; ss.appendChild(o); }); form.appendChild(ss); form.ss = ss;
      form.tr = trInputs(form, s ? s.tr : null);
    }, function () {
      var f = document.querySelector('.modal');
      var nm = f.querySelectorAll('input')[0].value.trim(); if (!nm) return false;
      var cs = f.querySelector('select').value;
      var selects = f.querySelectorAll('select'); var ss = selects[1].value;
      var trs = []; var inps = f.querySelectorAll('.tr-grid input'); inps.forEach(function (i) { trs.push(i.value.trim()); });
      if (isNew) state.sub.push({ uid: uid(), ko: nm, cat: cs, origCat: cs, stype: ss, tr: trs, active: '활성', origTag: '신규', note: '', deleted: false, isNew: true });
      else { s.ko = nm; s.cat = cs; s.stype = ss; s.tr = trs; }
      markDirty(); rerender();
    });
  }
  function openGroupModal(g, cat) {
    var isNew = !g;
    modal(isNew ? '키워드그룹 추가 (' + cat + ')' : '그룹명 변경', function (form) {
      form.appendChild(el('label', null, '그룹명'));
      var nm = el('input'); nm.value = g ? g.group : ''; form.appendChild(nm);
      if (isNew) { form.appendChild(el('label', null, '카테고리')); var cs = el('select'); catNames().forEach(function (c) { var o = el('option', null, c); o.value = c; if (cat === c) o.selected = true; cs.appendChild(o); }); form.appendChild(cs); }
    }, function () {
      var f = document.querySelector('.modal');
      var nm = f.querySelector('input').value.trim(); if (!nm) return false;
      if (isNew) { var cs = f.querySelector('select').value; state.kw.push({ uid: uid(), ko: '(새 키워드)', group: nm, cat: cs, origGroup: nm, origCat: cs, tr: ['', '', '', '', '', ''], active: '활성', origTag: '신규', note: '', deleted: false, isNew: true }); }
      else { state.kw.forEach(function (k) { if (!k.deleted && k.cat === g.cat && k.group === g.group) k.group = nm; }); }
      markDirty(); rerender();
    });
  }
  function openKwModal(k, cat) {
    var isNew = !k;
    modal(isNew ? '키워드 추가 (' + cat + ')' : '키워드 편집', function (form) {
      form.appendChild(el('label', null, '이름 (한국어)'));
      var nm = el('input'); nm.value = k ? k.ko : ''; form.appendChild(nm);
      form.appendChild(el('label', null, '카테고리'));
      var cs = el('select'); catNames().forEach(function (c) { var o = el('option', null, c); o.value = c; if ((k ? k.cat : cat) === c) o.selected = true; cs.appendChild(o); }); form.appendChild(cs);
      form.appendChild(el('label', null, '그룹'));
      var gi = el('input'); gi.value = k ? k.group : ''; gi.setAttribute('list', 'grouplist'); form.appendChild(gi);
      var dl = el('datalist'); dl.id = 'grouplist'; var seen = {}; state.kw.forEach(function (x) { if (!seen[x.group]) { seen[x.group] = 1; var o = el('option'); o.value = x.group; dl.appendChild(o); } }); form.appendChild(dl);
      form.tr = trInputs(form, k ? k.tr : null);
    }, function () {
      var f = document.querySelector('.modal');
      var inps = f.querySelectorAll('input');
      var nm = inps[0].value.trim(); if (!nm) return false;
      var cs = f.querySelector('select').value;
      var gi = inps[1].value.trim() || '(미지정)';
      var trs = []; f.querySelectorAll('.tr-grid input').forEach(function (i) { trs.push(i.value.trim()); });
      if (isNew) state.kw.push({ uid: uid(), ko: nm, group: gi, cat: cs, origGroup: gi, origCat: cs, tr: trs, active: '활성', origTag: '신규', note: '', deleted: false, isNew: true });
      else { k.ko = nm; k.cat = cs; k.group = gi; k.tr = trs; }
      markDirty(); rerender();
    });
  }

  /* ---------- category editing (세 탭 공유) ---------- */
  function renameCat(oldName, newName, newDef) {
    if (newName && newName !== oldName) {
      if (catNames().indexOf(newName) >= 0) { alert('이미 있는 카테고리명입니다.'); return false; }
      state.sub.forEach(function (s) { if (s.cat === oldName) s.cat = newName; if (s.origCat === oldName) s.origCat = newName; });
      state.kw.forEach(function (k) { if (k.cat === oldName) k.cat = newName; if (k.origCat === oldName) k.origCat = newName; });
    }
    var c = state.cats.filter(function (x) { return x.name === oldName; })[0];
    if (c) { c.name = newName || oldName; c.def = newDef; }
    markDirty(); rerender(); return true;
  }
  function addCat(name, def) {
    if (!name) return false;
    if (catNames().indexOf(name) >= 0) { alert('이미 있는 카테고리명입니다.'); return false; }
    state.cats.push({ name: name, def: def || '' }); markDirty(); rerender(); return true;
  }
  function deleteCat(name) {
    var nSub = state.sub.filter(function (s) { return !s.deleted && s.cat === name; }).length;
    var nKw = state.kw.filter(function (k) { return !k.deleted && k.cat === name; }).length;
    if (nSub || nKw) {
      if (!confirm('"' + name + '" 카테고리에 세부분류 ' + nSub + '개·키워드 ' + nKw + '개가 있습니다.\n지우면 소속 항목이 모두 삭제 대상으로 이동합니다. 진행할까요?')) return;
      state.sub.forEach(function (s) { if (s.cat === name) s.deleted = true; });
      state.kw.forEach(function (k) { if (k.cat === name) k.deleted = true; });
    }
    state.cats = state.cats.filter(function (c) { return c.name !== name; });
    markDirty(); rerender();
  }
  function openCatModal(name) {
    var isNew = !name;
    modal(isNew ? '카테고리 추가' : '카테고리 편집', function (form) {
      form.appendChild(el('label', null, '카테고리 이름'));
      var nm = el('input'); nm.value = name || ''; form.appendChild(nm);
      form.appendChild(el('label', null, '축 정의 (설명)'));
      var df = el('input'); df.value = name ? catDef(name) : ''; form.appendChild(df);
      if (!isNew) {
        var delb = el('button', 'btn', '이 카테고리 삭제'); delb.style.marginTop = '14px'; delb.style.color = 'var(--del)'; delb.style.borderColor = 'var(--del)';
        delb.onclick = function () { document.getElementById('modal-root').innerHTML = ''; deleteCat(name); };
        form.appendChild(delb);
      }
    }, function () {
      var f = document.querySelector('.modal'); var inps = f.querySelectorAll('input');
      var nm = inps[0].value.trim(); var df = inps[1].value.trim();
      if (!nm) return false;
      if (isNew) return addCat(nm, df); else return renameCat(name, nm, df);
    });
  }
  function addCatColumn() {
    var col = el('div', 'col'); col.style.border = '1px dashed var(--border)'; col.style.background = 'transparent'; col.style.flex = '0 0 170px';
    var b = el('button', 'btn', '＋ 카테고리'); b.style.margin = '14px'; b.title = '새 카테고리 추가';
    b.onclick = function () { openCatModal(null); };
    col.appendChild(b); return col;
  }

  /* ---------- summary / export ---------- */
  function updateSummary() {
    var tab = currentTab();
    var s;
    if (tab === 'sub') {
      var live = state.sub.filter(function (x) { return !x.deleted; }).length, del = state.sub.length - live;
      s = '세부분류 ' + live + '개 · 삭제대상 ' + del;
    } else if (tab === 'grp') {
      s = '키워드그룹 ' + Object.keys(groupsOf()).length + '개';
    } else {
      var lk = state.kw.filter(function (x) { return !x.deleted; }).length;
      s = '키워드 ' + lk + '개 · 삭제대상 ' + (state.kw.length - lk);
    }
    document.getElementById('summary').textContent = s;
  }
  function exportJSON() {
    var out = { generated: new Date().toISOString(), cats: state.cats, sub: state.sub, kw: state.kw };
    download('옵션체계_편집결과.json', JSON.stringify(out, null, 2), 'application/json');
  }
  function csvCell(v) { v = (v == null ? '' : String(v)); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function exportCSV() {
    var tab = currentTab(), rows = [];
    if (tab === 'sub') {
      rows.push(['상태', '카테고리', '시술구분', '한국어', LANGS[0], LANGS[1], LANGS[2], LANGS[3], LANGS[4], LANGS[5], '활성', '비고']);
      state.sub.forEach(function (s) { rows.push([TAGLABEL[subStatus(s)], s.deleted ? '(삭제)' : s.cat, s.stype, s.ko].concat(s.tr).concat([s.active, s.note])); });
      dl('세부분류_편집결과.csv', rows);
    } else if (tab === 'grp') {
      rows.push(['카테고리', '그룹', '키워드수']);
      var m = groupsOf(); Object.keys(m).forEach(function (key) { var g = m[key]; rows.push([g.cat, g.group, g.items.length]); });
      dl('키워드그룹_편집결과.csv', rows);
    } else {
      rows.push(['상태', '카테고리', '그룹', '한국어', LANGS[0], LANGS[1], LANGS[2], LANGS[3], LANGS[4], LANGS[5], '활성', '비고']);
      state.kw.forEach(function (k) { rows.push([TAGLABEL[kwStatus(k)], k.deleted ? '(삭제)' : k.cat, k.group, k.ko].concat(k.tr).concat([k.active, k.note])); });
      dl('키워드_편집결과.csv', rows);
    }
    function dl(name, rows) { download(name, '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'), 'text/csv'); }
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  /* ---------- tabs / render ---------- */
  function currentTab() { var t = document.querySelector('.tab[aria-selected="true"]'); return t ? t.dataset.tab : 'sub'; }
  function rerender() { var t = currentTab(); if (t === 'sub') renderSub(); else if (t === 'grp') renderGrp(); else renderKw(); updateSummary(); }
  function showTab(tab) {
    document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false'); });
    document.getElementById('view-sub').classList.toggle('hidden', tab !== 'sub');
    document.getElementById('view-grp').classList.toggle('hidden', tab !== 'grp');
    document.getElementById('view-kw').classList.toggle('hidden', tab !== 'kw');
    rerender();
  }

  /* ---------- init ---------- */
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { showTab(b.dataset.tab); }; });
  document.getElementById('search').addEventListener('input', rerender);
  document.getElementById('chk-tr').addEventListener('change', function (e) { showTr = e.target.checked; rerender(); });
  document.getElementById('btn-reset').onclick = function () { if (confirm('편집 내용을 모두 버리고 원본 TO-BE로 초기화할까요?')) { localStorage.removeItem(LS_KEY); state = freshState(); save(); rerender(); } };
  document.getElementById('btn-export').onclick = function () {
    modal('내보내기', function (form) {
      form.appendChild(el('label', null, '형식을 선택하세요'));
      var b1 = el('button', 'btn primary', '전체 JSON (백업/재적용용)'); b1.style.width = '100%'; b1.style.marginTop = '8px'; b1.onclick = function () { exportJSON(); document.getElementById('modal-root').innerHTML = ''; };
      var b2 = el('button', 'btn', '현재 탭 CSV (엑셀용)'); b2.style.width = '100%'; b2.style.marginTop = '8px'; b2.onclick = function () { exportCSV(); document.getElementById('modal-root').innerHTML = ''; };
      form.appendChild(b1); form.appendChild(b2);
    }, function () { return true; });
  };
  // theme
  var savedTheme = localStorage.getItem('kbs-theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('btn-theme').onclick = function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next); localStorage.setItem('kbs-theme', next);
  };
  setSave(true);
  showTab('sub');
})();

</script>
</body>
