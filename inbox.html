}

function editTopic(id,t,on){var r=room(id);if(!r.topicEd||r.topicEd.s!==r.session)r.topicEd={s:r.session,add:[],rm:[]};var e=r.topicEd;
 if(on){e.rm=e.rm.filter(function(x){return x!==t;});if(e.add.indexOf(t)<0)e.add.push(t);}else{e.add=e.add.filter(function(x){return x!==t;});if(e.rm.indexOf(t)<0)e.rm.push(t);}render();}
function eun(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'는';return w+(((c-0xAC00)%28)?'은':'는');} /* 은/는 */
function summarize(r){
 if(r.sumFix&&r.msgs.length===r.sumFixN)return {l1:r.sumFix,l2:'',at:r.msgs.filter(function(m){return m.who==='cust';}).pop().at}; /* 예시 대화: 새 메시지 전까지는 미리 적은 요약 */
 /* AI 요약: 이번 회차에서 고객이 실제로 물은 것 + 결과를 한 줄로 (틀 문장 대신 내용) */
 var start=0;r.msgs.forEach(function(m,i){if(m.newSession)start=i;});
 var ms=r.msgs.slice(start),cs=ms.filter(function(m){return m.who==='cust'&&m.kind!=='image';});if(!cs.length)return null;
 var ko=function(m){var t=(m.ko||m.text).trim();return /[가-힯]/.test(t)?t:null;};
 var bare=function(t){t=t.replace(/^(안녕하세요|저기요|혹시)[,.\s]*/,'').replace(/[?？!.。\s]+$/,'').replace(/(인가요|일까요|되나요|돼요|있나요|있어요|해요|예요|이에요|나요|요)$/,'').trim();
  t=t.replace(/(은|는|이|가)?\s*얼마$/,' 가격').replace(/아픈가$/,'통증 여부').replace(/\s*(을|를)?\s*해도$/,' 가능 여부').replace(/(은|는)?\s*어떻게$/,' 방법').replace(/중에\s/,'중 ');return t.trim();};
 var ro=function(w){var b=w.replace(/\s*\([^)]*\)$/,''),c=b.charCodeAt(b.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';var j=(c-0xAC00)%28;return w+(j&&j!==8?'으로':'로');}; /* 으로/로 */
 var asks=[],prices=[],seen={};
 cs.forEach(function(m){var c=classify(m.text,r),k=c.kind,a;
  var next=ms[ms.indexOf(m)+1],aiAns=next&&next.who==='ai'&&!next.notice?(next.ko||next.text):null;
  if(k==='greet'||k==='refuse')return;
  if(k==='price'&&c.prod){var n=c.prod.ko||c.prod.name;a=n+' 가격';var pr=aiAns&&aiAns.match(/[\d,]+원(\(VAT 포함\))?/);if(pr)prices.push([n,pr[0]]);}
  else if(k==='book'){var w=[c.date?fmtDay(c.date,'ko'):null,c.time,c.ppl?c.ppl+'명':null,c.prod?(c.prod.ko||c.prod.name):null].filter(Boolean).join(' ');a=(w?w+' ':'')+'예약 가능 여부';}
  else{var t=ko(m);a=t?bare(t):({hours:'운영시간',loc:'위치',faqTime:'시술 시간',pay:'결제 방법',cs:'이용 방법'}[k]||null);} /* 한국어 번역 없는 중단 문의는 결과(중단 사유)에서 드러남 */
  if(a&&!seen[a]){seen[a]=1;asks.push(a);}});
 var res=prices.map(function(p){return ro((prices.length>1?p[0]+' ':'')+p[1])+' 안내';});
 var out;
 if(r.need)out=(/의료/.test(r.need.reason)?'의료 판단 필요':ro(r.need.reason.replace(/\s*\(.*\)/,'')).replace(/(으로|로)$/,''))+(/의료/.test(r.need.reason)?'로':(/[가-힯]$/.test(r.need.reason.replace(/\s*\(.*\)/,''))?ro(r.need.reason.replace(/\s*\(.*\)/,'')).slice(r.need.reason.replace(/\s*\(.*\)/,'').length):'로'))+' AI 중단'+(r.handler==='agent'?', 상담사 응대 중':', 미응대');
 else if(r.handler==='agent')out=(res.length?'AI가 '+res.join(', ')+', ':'')+(r.byStore?'입점사 응대 중':'상담사 응대 중');
 else if(!r.aiOn&&r.status!=='상담종료')out='미응대';
 else out=res.length?'AI가 '+res.join(', '):'AI 응대 중';
 if(r.status==='상담종료')out=out.replace(/응대 중$/,'응대 완료').replace(/미응대$/,'완료');
 var l1=(asks.length?asks.join(', ')+' 문의':'문의')+', '+out;
 return {l1:l1,l2:'',at:cs[cs.length-1].at};
}
function suggest(r){
 var m=lastCust(r);if(!m)return [];var lang=r.lang||'ko',base;
 if(r.need){var med=/의료/.test(r.need.reason);return [{k:'간단 안내',t:med?L(SUGX.med,lang):L(SUGX.chk,lang)},{k:'확인 결과 안내',t:L(SUGX.res,lang)},{k:'재질문',t:L(SUGX.ask,lang)}];}
 var c=classify(m.text,r),s=DB.store,sn=lang==='ko'?s.name:s.nameEn;
 if(c.kind==='hours')base=T('hours',lang,{s:sn,h:L(s.hoursText,lang)});
 else if(c.kind==='loc')base=T('loc',lang,{s:sn,a:L(s.addr,lang),p:s.phone});
 else if(c.kind==='price')base=T('price',lang,{n:lang==='ko'?c.prod.ko:c.prod.name,v:c.prod.price.toLocaleString('en-US')});
 else if(c.kind==='faqTime')base=T('faqTime',lang,{x:L(s.faqTime,lang)});
 else if(c.kind==='pay')base=T('pay',lang,{x:L(s.payment,lang)});
 else if(c.kind==='book'&&c.date&&c.time){var j=judgeSlot(c.date,c.time,S.now);base=j.ok?T('link',lang,{d:fmtDay(c.date,lang),t:c.time}):T('unav',lang,{d:fmtDay(c.date,lang),t:c.time,r:L(R_UNAV[j.reason],lang),alt:altText(altSlots(c.date,c.time,S.now,3),lang)});}
 else if(c.kind==='book')base=T('askDT',lang);
 else base=T('greet',lang);
 return [{k:'간단 안내',t:base},{k:'부드러운 안내',t:L(SUGX.soft,lang)+base},{k:'재질문',t:L(SUGX.ask,lang)}];
}
/* 고객 메시지 수신 */
function custSend(id,text,kind){
 var r=room(id),m={who:'cust',text:text,kind:kind||'text'};push(r,m);
 if(r.status==='상담종료'){r.status='상담중';r.session++;m.newSession=true;r.card.owner='';r.agentAt=null;} /* 새 회차: 담당자 비움 */
 if(aiActive(r))handle(r,m);
 render();
}
function aiActive(r){
 if(!aiAllowed(r))return false;
 return r.aiOn;
}
function aiAllowed(r){return r.type==='고객지원'?true:!!DB.store.aiPilot;} /* Q11 시범 입점사, Q12 CS채팅 */
/* AI가 켜질 때: 그 전에 답하지 않은 메시지부터 (정책 P9). 멈췄던 질문은 상담사 몫으로 남김 */
function aiResume(r){
 r.aiOn=true;
 var q=r.msgs.filter(function(m){return m.who==='cust'&&!m.answered;});
 for(var i=0;i<q.length;i++){
  var m=q[i];
  if(r.ch==='WhatsApp'&&tsMin(S.now)-tsMin(m.at)>24*60){r.need={reason:'WhatsApp 24시간 경과',at:S.now};r.aiOn=false;notifySlack(r,'WhatsApp 24시간 경과');return;}
  if(!r.aiOn)break;
  handle(r,m);
 }
}
/* 상담사 */
function agentSend(id,text){var r=room(id);if(!text.trim())return;r.flow=null;push(r,{who:'agent',text:text.trim()});r.msgs.forEach(function(m){if(m.who==='cust')m.answered=true;});r.handler='agent';r.agentAt=S.now;r.aiOn=false;if(!r.card.owner)r.card.owner='김상담';render();}
function complete(id){ /* P10 상담 완료 = 확인 완료 + 상담 종료 */
 var r=room(id);r.need=null;r.noticeAt=null;r.handler='ai';r.status='상담종료';r.pending=false;r.asked=null;r.flow=null;r.req={};r.priority=false;r.expect=null;r.pick=null;
 aiResume(r);render();
}
function setAI(id,on){var r=room(id);if(on){aiResume(r);}else{r.aiOn=false;}render();}
function takeOver(id){var r=room(id);r.flow=null;r.aiOn=false;r.handler='agent';r.agentAt=S.now;if(!r.card.owner)r.card.owner='김상담';render();} /* I4: 잡은 사람이 담당자 */
function updateCard(id,k,v){var r=room(id);if(k==='owner'&&r.card.owner&&v&&r.card.owner!==v)(r.ownerLog=r.ownerLog||[]).push([S.now,r.card.owner,v]); /* 담당 변경은 처리 이력에 */r.card[k]=v;render();}
function sendProduct(id,pid){var r=room(id),p=DB.store.catalog.filter(function(x){return x.id===pid;})[0];if(!p)return;push(r,{who:'agent',kind:'product',text:'[상품 카드] '+p.name+' · '+p.price.toLocaleString('en-US')+' KRW',prod:p});r.msgs.forEach(function(m){if(m.who==='cust')m.answered=true;});r.handler='agent';r.agentAt=S.now;r.aiOn=false;if(!r.card.owner)r.card.owner='김상담';RECENT=[pid].concat(RECENT.filter(function(x){return x!==pid;})).slice(0,3);render();}
var RECENT=[];
function addNote(id,text){var r=room(id);if(!text.trim())return;push(r,{who:'note',text:text.trim(),by:r.card.owner||'김상담'});render();} /* 상담 메모: 대화 안 내부 글, 고객에게 안 감 */ /* 상담 시작 = 상담사가 잡음 (AI 끄기와 같은 동작, 답장 전에도 진행으로) */
/* 시계 */
function setClock(ts){
 var before=S.now;S.now=ts;
 if(inHours(before)&&!inHours(ts)){ /* 운영시간이 끝나면 자동 ON, 상담사 진행 중 상담은 유지 (P9) */
  DB.rooms.forEach(function(r){if(!r.aiOn&&aiAllowed(r)&&!(r.handler==='agent'&&r.status!=='상담종료'))aiResume(r);});
 }
 if(!inHours(before)&&inHours(ts)){ /* 다음 영업일 10:00: 밤사이 확인 필요 묶음 알림 (Q9) */
  var due=SLACK.filter(function(e){return !e.sent;});
  if(due.length){due.forEach(function(e){e.sent=ts;e.digest=true;});SLACK.push({digest:true,count:due.length,at:ts,sent:ts,items:due.map(function(e){return e.name+' ('+e.ch+') '+e.reason;})});}
 }
 render();
}

/* ================= 렌더 ================= */
function swHTML(){
 return '<b>통합인박스 시안</b>'
 +(LAYOUTS.length>1?'<span style="margin-left:4px">레이아웃</span><select data-sw="layout" style="background:#e8537a;border-color:#e8537a;color:#fff;font-weight:700">'+LAYOUTS.map(function(x){return '<option value="'+x[0]+'"'+(S.layout===x[0]?' selected':'')+'>'+x[1]+'</option>';}).join('')+'</select><span style="width:8px"></span>':'')+[['BO','CSM 상담 (우리 CS)'],['MGMT','어드민 상담 관리']].map(function(x){return '<button class="s'+(S.surf===x[0]?' on':'')+'" data-surf="'+x[0]+'">'+x[1]+'</button>';}).join('')
 +'<span class="sp"></span>'
  +'<span>기준 시각</span><select data-sw="now">'+CLOCKS.map(function(c){return '<option value="'+c[0]+'"'+(S.now===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join('')+'</select>'
 +'<label><input type="checkbox" data-sw="booking"'+(DB.store.booking?' checked':'')+'>예약 기능 ON</label>'
 +'<label><input type="checkbox" data-sw="pilot"'+(DB.store.aiPilot?' checked':'')+'>AI 시범 입점사</label>'
 +'<label><input type="checkbox" data-sw="mark"'+(S.mark?' checked':'')+'>이번에 추가한 요소 표시</label>'
 +'<label><input type="checkbox" data-sw="hint"'+(S.hint?' checked':'')+'><span style="display:inline-block;width:10px;height:10px;border-radius:2px;box-shadow:0 0 0 2px #16a34a;margin-right:2px"></span>클릭 가능한 곳 표시</label>';
}
function frame(s){return document.getElementById('f-'+s);}
/* 뷰티톡은 실화면 폭 1440px 그대로 두고, 남은 자리에 맞춰 비율로 줄인다 (넓으면 그대로) */
function fitBO(){var fr=document.getElementById('frames'),left=S.surf==='BOTH'?412:0,aw=fr.clientWidth-left,ah=fr.clientHeight,k=Math.min(1,aw/1440),w=k<1?1440:aw; /* 창 전체 폭. 넓어지면 상담창이 늘어남 */
 [frame('BO'),frame('MGMT')].forEach(function(bo,i){var l=i?0:left,a=i?fr.clientWidth:aw,kk=Math.min(1,a/1440),ww=kk<1?1440:a;bo.style.left=l+'px';bo.style.width=ww+'px';bo.style.transform='scale('+kk+')';bo.style.height=(ah/kk)+'px';});}
addEventListener('resize',function(){if(S)fitBO();});
function render(){
 document.getElementById('sw').innerHTML=swHTML();
 var fr=document.getElementById('frames');fr.className=S.surf==='BOTH'?'both':S.surf==='CUST'?'cust':'';
 frame('CUST').classList.toggle('on',S.surf==='BOTH'||S.surf==='CUST');frame('BO').classList.toggle('on',S.surf==='BOTH'||S.surf==='BO');frame('MGMT').classList.toggle('on',S.surf==='MGMT');
 fitBO();
 ['CUST','BO','MGMT'].forEach(function(s){var w=frame(s).contentWindow;if(w&&typeof w.draw==='function')w.draw();});
}
window.IB={get DB(){return DB;},get S(){return S;},get SLACK(){return SLACK;},CH_ROOM:CH_ROOM,
 room:room,fmtTs:fmtTs,unans:unans,storeLabel:storeLabel,suggest:function(r){return suggest(r);},inHours:inHours,fmtDay:fmtDay,custSend:custSend,agentSend:agentSend,complete:complete,setAI:setAI,takeOver:takeOver,updateCard:updateCard,addNote:addNote,sendProduct:sendProduct,get RECENT(){return RECENT;},summary:function(r){return summarize(r);},topics:function(r){return topics(r);},editTopic:editTopic,TOPICS:TOPICS,NOASK:NOASK,tick:tick,scnState:scnState,hist:hist,
 scn:{get:function(){return JSON.parse(JSON.stringify(DB.scn));},save:function(v){DB.scn=JSON.parse(JSON.stringify(v));try{localStorage.setItem('ib-scn',JSON.stringify(DB.scn));}catch(e){}render();},defaults:function(){return defaultScn();},idleTest:idleTest,reset:function(){DB.scn=defaultScn();try{localStorage.removeItem('ib-scn');}catch(e){}render();return JSON.parse(JSON.stringify(DB.scn));},INTENTS:INTENTS,EXITS:SCN_EXITS,FIELDS:FIELDS,SLOT:SLOT,
  test:function(text,o){o=o||{};var keep=DB.scn;if(o.scn)DB.scn=o.scn;try{return scnTest(text,o);}finally{DB.scn=keep;}}},
aiAllowed:aiAllowed,render:render,

 ready:function(){render();}};
/* ===== 검수 콘솔용 전역 ===== */
window.render=render;
window.resetDB=function(){freshDB();S=freshState();render();};
window.go=function(s){S.surf=s;render();};
window.setChannel=function(ch){S.ch=ch;S.bo.room=CH_ROOM[ch];render();};
window.cust=function(text,kind){custSend(CH_ROOM[S.ch],text,kind);}; /* 지금 채널 고객이 보냄 */
window.custTo=function(ch,text,kind){custSend(CH_ROOM[ch],text,kind);};
window.agent=function(text){agentSend(S.bo.room,text);};
window.completeRoom=function(id){complete(id||S.bo.room);};
window.aiSwitch=function(on,id){setAI(id||S.bo.room,on);};
window.setClock=setClock;
window.setStore=function(p){Object.assign(DB.store,p);render();};
window.openRoom=function(id){S.bo.room=id;render();};
window.classifyText=function(t){return classify(t,room(CH_ROOM[S.ch]));};
Object.defineProperty(window,'DBX',{get:function(){return DB;}});
Object.defineProperty(window,'STATE',{get:function(){return S;}});
Object.defineProperty(window,'SLACKLOG',{get:function(){return SLACK;}});
document.addEventListener('click',function(e){var t=e.target.closest('[data-surf]');if(t){S.surf=t.getAttribute('data-surf');render();}});
document.addEventListener('change',function(e){var t=e.target;if(!t.hasAttribute('data-sw'))return;var k=t.getAttribute('data-sw');
 if(k==='layout'){S.layout=LAYOUT=t.value;try{localStorage.setItem('ib-layout',LAYOUT);}catch(_){}S.bo.drawer=false;S.bo.side=true;frame('BO').contentWindow.location.reload();render();return;} /* 레이아웃은 화면 골격을 바꾸므로 뷰티톡 프레임을 다시 그림 */
 if(k==='mark')S.mark=t.checked;else if(k==='hint')S.hint=t.checked;else if(k==='ch'){S.ch=t.value;S.bo.room=CH_ROOM[t.value];}else if(k==='now'){setClock(t.value);return;}else if(k==='booking')DB.store.booking=t.checked;else if(k==='pilot')DB.store.aiPilot=t.checked;render();});
freshDB();S=freshState();render();
