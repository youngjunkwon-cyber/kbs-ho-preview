var WDK={'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6},WDE={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function parseDate(t,today){
 var m;
 if(/오늘|today|今日|今天/i.test(t))return today;
 if(/내일|tomorrow|明日|明天/i.test(t))return addDays(today,1);
 if(/모레|day after tomorrow|明後日|后天/i.test(t))return addDays(today,2);
 if((m=t.match(/(\d{1,2})\s*(?:월|\/|月)\s*(\d{1,2})\s*(?:일|日)?/)))return '2026-'+pad(+m[1])+'-'+pad(+m[2]);
 var w=null,nextWeek=/다음 ?주|next week|next (sun|mon|tue|wed|thu|fri|sat)|来週|下周/i.test(t),thisWeek=/이번 ?주|this week|今週|这周|本周/i.test(t);
 if((m=t.match(/([일월화수목금토])요일/)))w=WDK[m[1]];
 else if((m=t.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/i)))w=WDE[m[1].toLowerCase()];
 else if((m=t.match(/([日月火水木金土])曜/)))w={日:0,月:1,火:2,水:3,木:4,金:5,土:6}[m[1]];
 else if((m=t.match(/周([日一二三四五六])/)))w={日:0,一:1,二:2,三:3,四:4,五:5,六:6}[m[1]];
 if(w===null)return null;
 var tw=wd(today),monday=addDays(today,-((tw+6)%7)); /* 주 = 월~일 (정책 P8 3번) */

}
function parseTime(t){

}

/* ================= 예약 판정 (순수 함수) ================= */
function slotRange(d){var s=DB.store.slots,w=wd(d);return w===0?s.sun:w===6?s.sat:s.wk;}
function judgeSlot(d,t,now){
 var r=slotRange(d),conds=[];
 if(wd(d)===0&&!r)return {ok:false,reason:'sun'};
 if(DB.store.blocked.indexOf(d)>=0)return {ok:false,reason:'block'};
 if(!r||t<r[0]||t>r[1])return {ok:false,reason:'range'};
 if(mins(t)%30)return {ok:false,reason:'grid'};
 var at=d+' '+t;if(tsMin(at)<=tsMin(now))return {ok:false,reason:'past'};
 if(tsMin(at)-tsMin(now)<DB.store.cutoffH*60)return {ok:false,reason:'cut'};
 if(DB.store.taken.filter(function(x){return x===at;}).length>=DB.store.cap)return {ok:false,reason:'full'};
 return {ok:true};
}
function altSlots(d,t,now,n){
 var out=[],r=slotRange(d);
 if(r){for(var m=mins(r[0]);m<=mins(r[1]);m+=30){var tt=pad(Math.floor(m/60))+':'+pad(m%60);if(judgeSlot(d,tt,now).ok)out.push({d:d,t:tt});}}
 if(t){out.sort(function(a,b){return Math.abs(mins(a.t)-mins(t))-Math.abs(mins(b.t)-mins(t));});}
 if(out.length)return {same:true,list:out.slice(0,n).sort(function(a,b){return a.t<b.t?-1:1;})};
 for(var i=1;i<14&&out.length<n;i++){var dd=addDays(d,i),rr=slotRange(dd);if(!rr)continue;for(var m2=mins(rr[0]);m2<=mins(rr[1])&&out.length<n;m2+=30){var t2=pad(Math.floor(m2/60))+':'+pad(m2%60);if(judgeSlot(dd,t2,now).ok)out.push({d:dd,t:t2});}}
 return {same:false,list:out};
}
function memoFor(r,c){ /* 정책 P2·P3·P4: 고객이 말한 것만, 건강 정보 제외, 일행은 대표 1건 */
 var q=r.req,lines=[],lang=r.lang||'ko',LN={ko:'한국어',en:'영어',ja:'일본어',zh:'중국어',mn:'몽골어',id:'인도네시아어'};
 var p=c.prod||q.prod;if(p)lines.push('희망 시술: '+p.ko);
 var n=c.ppl||q.ppl;if(n&&n>1)lines.push('일행 '+n+'명');

function stopAI(r,reason,msg,noNotice){

 /* 멈출 때마다 그 질문에 안내 1회 (P7 2·3번). 다시 켜질 때 이미 멈췄던 질문은 다시 처리하지 않으므로 안내도 중복되지 않음 (P9 경계 1) */

}

}

 if(msg.kind==='image'){stopAI(r,'사진·파일',msg);return;}

 if(c.kind==='greet'){aiSay(r,T('greet',lang));return;}

function handleBook(r,c,msg){

 if(c.prod)q.prod=c.prod;if(c.ppl)q.ppl=c.ppl;
 if(c.date)q.date=c.date;if(c.time)q.time=c.time;
 if(!DB.store.booking)return collect(r,msg);
 if(q.date&&!q.time){var dayR=wd(q.date)===0&&!slotRange(q.date)?'sun':DB.store.blocked.indexOf(q.date)>=0?'block':null;
  if(dayR){var a0=altSlots(q.date,null,S.now,3);aiSay(r,T('unavDay',lang,{d:fmtDay(q.date,lang),r:L(R_UNAV[dayR],lang),alt:altText(a0,lang)}));q.date=null;r.pending=true;return;}} /* 그날 전체가 불가면 시간을 묻지 않고 바로 이유와 대안 */
 if(!q.date||!q.time){r.pending=true;aiSay(r,q.date?T('askT',lang,{d:fmtDay(q.date,lang)}):q.time?T('askD',lang,{t:q.time}):T('askDT',lang));return;} /* P8 4번: 이미 받은 것은 다시 묻지 않음 */

  var a=altSlots(q.date,q.time,S.now,3);
  aiSay(r,T('unav',lang,{d:dTxt,t:q.time,r:L(R_UNAV[j.reason],lang),alt:altText(a,lang)}));
  q.time=null;r.pending=true;return; /* P8 5번: 이유와 대안 */
 }
 var memo=memoFor(r,c),url='https://www.k-beautystation.com/'+lang+'/stores/'+DB.store.id+'/bookings?date='+q.date+'&time='+q.time;
 aiSay(r,T('link',lang,{d:dTxt,t:q.time}),{link:{url:url,date:q.date,time:q.time,memo:memo,lang:lang}});

}
function collect(r,msg){ /* 방향결정 Q4·Q5, 정책 P5: 빠진 것만 한 번에, 일부만 오면 남은 것만 다시 */
 var lang=r.lang||'ko',q=r.req,t=msg.text;

 }

 if(!q.name&&(m=t.match(/(?:이름|name|名前|姓名)\s*[:：]?\s*([^\n,/]+)/i)))q.name=m[1].trim();
 if(!q.phone&&(m=t.match(/\+?\d[\d\s-]{7,}\d/)))q.phone=m[0];

 r.asked=null;aiSay(r,T('reqDone',lang));
 stopAI(r,'예약 요청 접수 (예약 기능 OFF 매장)',null,true); /* 접수 안내(P7 5번)만 보냄 */

function summarize(r){

 var bare=function(t){t=t.replace(/^(안녕하세요|저기요|혹시)[,.\s]*/,'').replace(/[?？!.。\s]+$/,'').replace(/(인가요|일까요|되나요|돼요|있나요|있어요|해요|예요|이에요|나요|요)$/,'').trim();
  t=t.replace(/\s*(을|를)?\s*해도$/,' 가능 여부').replace(/(은|는)?\s*어떻게$/,' 방법').replace(/중에\s/,'중 ');return t.trim();};
 var ro=function(w){var b=w.replace(/\s*\([^)]*\)$/,''),c=b.charCodeAt(b.length-1);if(c<0xAC00||c>0xD7A3)return w+'로';var j=(c-0xAC00)%28;return w+(j&&j!==8?'으로':'로');}; /* 으로/로 */
 var asks=[],prices=[],seen={};
 cs.forEach(function(m){var c=classify(m.text,r),k=c.kind,a;
  var next=ms[ms.indexOf(m)+1],aiAns=next&&next.who==='ai'&&!next.notice?(next.ko||next.text):null;
  if(k==='greet'||k==='refuse')return;
  if(k==='price'&&c.prod){var n=c.prod.ko||c.prod.name;a=n+' 가격';var pr=aiAns&&aiAns.match(/[\d,]+원(\(VAT 포함\))?/);if(pr)prices.push([n,pr[0]]);}
  else if(k==='book'){var w=[c.date?fmtDay(c.date,'ko'):null,c.time,c.ppl?c.ppl+'명':null,c.prod?(c.prod.ko||c.prod.name):null].filter(Boolean).join(' ');a=(w?w+' ':'')+'예약 가능 여부';}
  else{var t=ko(m);a=t?bare(t):({hours:'운영시간',loc:'위치',faqTime:'시술 시간',pay:'결제 방법',cs:'이용 방법'}[k]||null);} /* 한국어 번역 없는 중단 문의는 결과(중단 사유)에서 드러남 */
  if(a&&!seen[a]){seen[a]=1;asks.push(a);}});
 var res=prices.map(function(p){return ro((prices.length>1?p[0]+' ':'')+p[1])+' 안내';});
 var out;
 if(r.need)out=(/의료/.test(r.need.reason)?'의료 판단 필요':ro(r.need.reason.replace(/\s*\(.*\)/,'')).replace(/(으로|로)$/,''))+(/의료/.test(r.need.reason)?'로':(/[가-힯]$/.test(r.need.reason.replace(/\s*\(.*\)/,''))?ro(r.need.reason.replace(/\s*\(.*\)/,'')).slice(r.need.reason.replace(/\s*\(.*\)/,'').length):'로'))+' AI 중단'+(r.handler==='agent'?', 상담사 응대 중':', 미응대');
 else if(r.handler==='agent')out=(res.length?'AI가 '+res.join(', ')+', ':'')+'상담사 응대 중';
 else out=res.length?'AI가 '+res.join(', '):'AI 응대 중';
 if(r.status==='상담종료')out=out.replace(/(응대 중|미응대)$/,'완료');
 var l1=(asks.length?asks.join(', ')+' 문의':'문의')+', '+out;

function suggest(r){

 if(r.need){var med=/의료/.test(r.need.reason);return [{k:'간단 안내',t:med?L(SUGX.med,lang):L(SUGX.chk,lang)},{k:'확인 결과 안내',t:L(SUGX.res,lang)},{k:'재질문',t:L(SUGX.ask,lang)}];}
 var c=classify(m.text,r),s=DB.store,sn=lang==='ko'?s.name:s.nameEn;
 if(c.kind==='hours')base=T('hours',lang,{s:sn,h:L(s.hoursText,lang)});
 else if(c.kind==='loc')base=T('loc',lang,{s:sn,a:L(s.addr,lang),p:s.phone});
 else if(c.kind==='price')base=T('price',lang,{n:lang==='ko'?c.prod.ko:c.prod.name,v:c.prod.price.toLocaleString('en-US')});
 else if(c.kind==='faqTime')base=T('faqTime',lang,{x:L(s.faqTime,lang)});
 else if(c.kind==='pay')base=T('pay',lang,{x:L(s.payment,lang)});
 else if(c.kind==='book'&&c.date&&c.time){var j=judgeSlot(c.date,c.time,S.now);base=j.ok?T('link',lang,{d:fmtDay(c.date,lang),t:c.time}):T('unav',lang,{d:fmtDay(c.date,lang),t:c.time,r:L(R_UNAV[j.reason],lang),alt:altText(altSlots(c.date,c.time,S.now,3),lang)});}
 else if(c.kind==='book')base=T('askDT',lang);
 else base=T('greet',lang);
 return [{k:'간단 안내',t:base},{k:'부드러운 안내',t:L(SUGX.soft,lang)+base},{k:'재질문',t:L(SUGX.ask,lang)}];
}

function custSend(id,text,kind){
 var r=room(id),m={who:'cust',text:text,kind:kind||'text'};push(r,m);
 if(r.status==='상담종료'){r.status='상담중';r.session++;m.newSession=true;r.card.owner='';r.agentAt=null;} /* 새 회차: 담당자 비움 */
 if(aiActive(r))handle(r,m);
 render();
}
function aiActive(r){
 if(!aiAllowed(r))return false;
 return r.aiOn;
}
function aiAllowed(r){return r.type==='고객지원'?true:!!DB.store.aiPilot;} /* Q11 시범 입점사, Q12 CS채팅 */
/* AI가 켜질 때: 그 전에 답하지 않은 메시지부터 (정책 P9). 멈췄던 질문은 상담사 몫으로 남김 */
function aiResume(r){
 r.aiOn=true;
 var q=r.msgs.filter(function(m){return m.who==='cust'&&!m.answered;});
 for(var i=0;i<q.length;i++){
  var m=q[i];
  if(r.ch==='WhatsApp'&&tsMin(S.now)-tsMin(m.at)>24*60){r.need={reason:'WhatsApp 24시간 경과 (자유 답장 불가)',at:S.now};r.aiOn=false;notifySlack(r,'WhatsApp 24시간 경과');return;}
  if(!r.aiOn)break;
  handle(r,m);
 }
}

 var r=room(id);r.need=null;r.noticeAt=null;r.handler='ai';r.status='상담종료';r.pending=false;r.asked=null;

/* 시계 */
function setClock(ts){
 var before=S.now;S.now=ts;
 if(inHours(before)&&!inHours(ts)){ /* 운영시간이 끝나면 자동 ON, 상담사 진행 중 상담은 유지 (P9) */
  DB.rooms.forEach(function(r){if(!r.aiOn&&aiAllowed(r)&&!(r.handler==='agent'&&r.status!=='상담종료'))aiResume(r);});
 }
 if(!inHours(before)&&inHours(ts)){ /* 다음 영업일 10:00: 밤사이 확인 필요 묶음 알림 (Q9) */
  var due=SLACK.filter(function(e){return !e.sent;});
  if(due.length){due.forEach(function(e){e.sent=ts;e.digest=true;});SLACK.push({digest:true,count:due.length,at:ts,sent:ts,items:due.map(function(e){return e.name+' ('+e.ch+') '+e.reason;})});}
 }
 render();
}

 if(k==='layout'){S.layout=LAYOUT=t.value;try{localStorage.setItem('ib-layout',LAYOUT);}catch(_){}S.bo.drawer=false;S.bo.side=true;frame('BO').contentWindow.location.reload();render();return;} /* 레이아웃은 화면 골격을 바꾸므로 뷰티톡 프레임을 다시 그림 */
 if(k==='mark')S.mark=t.checked;else if(k==='hint')S.hint=t.checked;else if(k==='ch'){S.ch=t.value;S.bo.room=CH_ROOM[t.value];}else if(k==='now'){setClock(t.value);return;}else if(k==='booking')DB.store.booking=t.checked;else if(k==='pilot')DB.store.aiPilot=t.checked;render();});
freshDB();S=freshState();render();
</script>
</body>
