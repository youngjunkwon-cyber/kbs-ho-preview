# K-Beauty Station — 칼럼(전문가 가이드) 기능 PRD

**v0.2 | 2026-06-22 | Draft — 개발 협의 전**
관련 문서: 매거진 기능 PRD v0.42, HO 스토어설정 PRD
STG: admin(`k-beautystation-admin.vercel.app`) / host(`k-beautystation-host.vercel.app`)

---

## 1. 문서 개요

| 항목 | 내용 |
|---|---|
| 기능명(내부 통칭) | 칼럼 (원장 칼럼) |
| 고객 노출명 | **전문가 가이드 (Expert Guide)** — 언어별 명칭 §3.8 |
| 관리 메뉴명 | **스토어 칼럼 관리** — HOST·BO 사이드바 메뉴 |
| 정의 | 입점사(호스트)가 직접 작성·발행하는 스토어 귀속 **정보성 콘텐츠** — 스토어·전문성 소개 / 시술·제품 정보·추천. **의료광고가 아닌 정보로 운영(회사 방침)**, 단 법적으로는 원칙상 제재 대상 — §3.4 |
| 레이어 | **HO**(작성·관리) / **BO**(모니터링·통제) / **FO**(노출) |
| 기반 | 매거진 기능의 에디터·다국어·SEO 구조를 HO로 확장 |
| 오픈 범위 | HO 작성·관리 + FO 노출(메인·스토어 페이지·마이페이지) + BO 모니터링·블라인드/삭제·금지어 사전 관리 (단계 구분 없이 이 범위로 진행. 추가 필요 시 그때 별도로 잡음) |

---

## ★ 주요 결정 (2026-06-16 회의 확정)

> 아래는 회의에서 **확정된 사항**. (법무 확인도 회신 완료 — 아래 ✅)

- **정보성 운영** — 광고가 아닌 소개·정보로 운영(§3.4)
- **금지어 검수 + 면책 병행** — 단어 사전 검수(검출 시 차단)도 하고, 면책 3종(①면책조항 강화 ②유의사항 안내 ③본인 책임 확인 모달)도 함께 간다
- **작성 권한 = ON/OFF, 최초 기본 ON**(default ON, 문제 시 OFF, §3.5)
- **권한 회수·관리** — OFF는 **신규 작성·수정·재게시 차단**(노출·열람 유지, 노출 줄이는 호스트 숨김·삭제는 가능). 게시글 단위로 어드민이 블라인드/삭제, 필요 시 스토어 단위 **일괄 게시중/블라인드**. 호스트도 자기 글 삭제/숨김(개별·일괄) 가능(삭제 시 복구불가 모달). **어드민은 작성·숨김 기능 없음**(호스트 계정 접근 가능 → 작성과 동일하게 제외, BO 다운 조작은 블라인드만)
- **매거진과 분리** — 속성이 달라 개념적으로 분리(단 UI는 매거진 차용·디벨롭)
- **진입 3곳** — 메인 / 스토어 페이지 / 마이페이지 > 전문가 가이드 (§3.3)
- **명칭** — 전문가 가이드 / Expert Guide (§3.8)

> ✅ **법무 확인 결과** — 게시 포스팅(텍스트)도 **원칙적으로는 의료광고 제재 대상**이나, **실무는 사전 단속이 아닌 사후 처리**(발견·신고 시 삭제 등 시정). → 우리 모델(즉시 게시 + 사후 블라인드/삭제 + 금지어 검수·면책)이 현실 운영과 부합. **단 원칙상 위반이므로** 발견·신고 시 **신속 대응 + 검수·면책·책임 소재 유지**가 핵심.

---

## 2. 배경 · 목표

- 원장·입점사 소개, 시술·제품 정보 제공을 통한 **신뢰도 제고와 구매 전환 유도**.
- 입점사가 자기 스토어 콘텐츠를 직접 생산 → 콘텐츠·SEO 자산 확대(회사 운영 부담 없이).
- 의료법 리스크는 **금지어 검수 + 면책·책임 구조 + 사후 통제**로 관리.

---

## 3. 핵심 정책

### 3.1 게시 권한 — 즉시 게시 + 검수·면책 + 사후 통제
- 호스트가 작성하면 **어드민 사전검수 없이 즉시 게시**(사람 검수 없음).
- 단, 다음 장치로 리스크 통제:
  1. **유의사항 안내 + 본인 책임 확인 모달** — 게시 클릭 시 게시 확정 모달에서 의료광고 유의사항 안내 + "본 콘텐츠 책임은 작성자 본인" 확인(전 항목 동의해야 게시 확정).
  2. **금지어 검수(단어 사전, 차단)** — 게시 확정 시 금지어 사전과 본문 매칭 → **검출 시 게시 차단 + 검출된 금지어 안내 모달**(어떤 금지어가 걸렸는지 안내 → 수정 후 재시도). 사전은 **어드민이 언어별로 키워드를 등록·관리**(**한국어 원본 포함 전 언어** 대상, §7.2).
  3. **면책조항·약관 강화** — 콘텐츠 법적 책임은 **입점사 귀속**임을 입점 계약·이용약관에 명시·강화.
  4. **BO 사후 통제** — 전체 모니터링 + 문제 글 블라인드/삭제.
- **게시 게이트 2개(순서대로)**: ①유의사항·본인 책임 확인 모달(동의) → ②금지어 검출(차단). 게시 클릭 → 확정 모달에서 동의 → 확정 시 금지어 검출 → 통과 시 즉시 게시.

### 3.2 다국어 — 한 화면 언어별 번역 입력 (스토어 노출정보 패턴 차용)
- 매거진의 "복제 후 별도 글" 방식 ❌ → **스토어 노출정보와 동일한 한 화면 다국어 구조**(언어 탭 + 필드별/본문 "번역" 버튼, 원본+번역 한 엔티티).
- **언어 탭 노출**: 스토어가 활성화한 언어 설정에 맞춰 해당 언어 탭만 노출된다.
- **번역**: 번역 버튼을 누르면 활성 언어들에 대해서만 **일괄 자동번역**되고, 각 언어 탭에서 **개별 수정** 가능하다.
- 지원 언어: 중국어 간체 / 영어 / 중국어 번체 / 일본어 / 인도네시아어 / 몽골어(MN).
- **원본(기준) 언어 = 한국어** — 호스트가 한국어로 작성 후 위 6개 언어로 번역. 한국어 원본은 **내부 기준이며 FO 비노출**(노출은 번역본만). 입력 언어가 한국어인지 시스템이 판별·강제하지 않음.

### 3.3 노출 — 진입 3곳 · 정렬 · 매거진과 분리
- **진입 경로 3곳**:
  - **메인** — 전문가 가이드 전용 섹션 신설(디자인 시안 별도)
  - **스토어 페이지**: 해당 스토어의 전문가 가이드 노출. 매장 페이지 내 위치는 **상품 섹션 위**
  - **마이페이지 > 전문가 가이드** — Explore 영역에 매거진과 나란히
- **정렬** — 메인·모아보기는 **최신순 / 인기순(=조회수)** 토글. **스토어 페이지는 해당 스토어 글을 최신순 고정**(활동성·신선도 우선, 콜드스타트 회피). (**조회수 = 글 상세 화면 진입 수**)
- **매거진과 분리** — 속성이 달라 개념적으로 분리(회사 큐레이션 매거진 vs 입점사 작성 가이드). 단 **UI는 매거진 레이아웃 차용·디벨롭**.

### 3.4 의료법 대비
- **칼럼은 의료광고가 아닌 정보성 콘텐츠로 규정·운영**. 광고성·유인성 표현은 유의사항 안내·금지어 검수로 거른다.
- 리스크 관리 = **금지어 검수(차단) + 면책조항·약관 + 책임 확인 모달 + BO 사후 블라인드/삭제**.
- 호스트는 이미 전/후사진 연결·시술 정보 구조화 필드를 상품 영역에서 다룸 → 상품 영역과 일관된 통합 정책.
- 이미지(전후사진 등) 첨부는 허용. 이미지 내용 적합성은 책임 소재(약관·책임 모달) + 사후 모니터링으로 커버. **금지어 검수는 텍스트만 대상** — 이미지(전후사진 등 의료광고 고위험 요소)는 검수망 밖이라 면책·사후 통제로만 커버하는 **수용된 잔여 리스크**.
- ✅ **법무 확인 결과**: 게시 포스팅(텍스트)도 **원칙상 제재 대상**이나 **실무는 사후 처리(발견·신고 시 시정)**. → 즉시 게시 + 사후 블라인드/삭제 모델로 대응. 사후 대응 신속성·검수·면책·책임 소재가 그래서 중요.

### 3.5 작성 자격 — 스토어별 ON/OFF (최초 기본 ON)
- 작성 권한을 **스토어 단위 ON/OFF**로 개발. **최초에는 기본적으로 ON**(별도 승인 없이 작성 가능).
- **OFF 발동 기준(명문화)**: ① 의료법 위반 게시 반복 ② 약관·운영정책 위반 ③ 부적절·허위 콘텐츠 지속. **BO 재량으로 OFF**(필수 사전 경고 절차는 두지 않음). **OFF 실행 시 경고 기록을 동반**(권한 회수 사유를 호스트에게 정식 고지). 반복·중대 판정 근거는 누적된 **제재 사유 기록**(§5.2)이다.
- **경고·고지 방식**: 외부 통지·소통(메신저 등)은 **기존 운영 채널로 별도 진행**. 사이트 내에서는 **경고(주의) 상태**로 노출.
  - 평상시엔 비어 있다가, 이슈 발생 시 **BO가 경고를 기록(사유·일시)** → 호스트가 **스토어 칼럼 관리 화면에서 확인**(노출 배치는 화면 설계 시 확정).
  - 이력은 히스토리로 보관(단, "1/3" 식 임계 카운터는 노출하지 않음).
  - 미확인 경고가 있으면 호스트가 칼럼 관리/작성 진입 시 **1회 확인 모달**.
- **OFF 시 동작**: 칼럼 메뉴는 **노출 유지**하되 **신규 작성/등록·수정·재게시 버튼 비활성(disable)**, 클릭 시 *"작성하려면 관리자에게 문의하세요"* 모달. **기존 글은 노출 유지(열람)**.
  - OFF 중 게시글 조작은 **노출을 줄이는 방향만 허용** — 호스트가 자기 글 **숨김·삭제는 가능**, 단 **숨김 → 재게시·수정·신규 작성은 불가**(권한 복구 전까지).
  - 권한(작성)과 게시글 상태는 독립. 스토어 글 전체를 내려야 하면 BO가 **일괄 블라인드**로 별도 처리.

### 3.6 태그 — 칼럼 전용 (별도 분류 없음)
- **분류·카테고리 미지정**: 게시 글에 별도 콘텐츠 분류를 지정하지 않는다. 글에 지정하는 것은 **태그뿐**. 목록·필터에 보이는 '카테고리'는 글이 귀속된 **스토어의 카테고리**(피부과·성형외과 등)를 그대로 따른다.
- **태그**: BO 관리자가 **태그(키워드) 풀을 관리**하고, 호스트는 그 중 **선택해서만 사용**(호스트 직접 추가 불가 — 태그 난립·중복·표기 불일치 방지). 신규 태그가 필요하면 BO가 풀에 추가.

### 3.7 SEO 세팅 — 전용 경로 `/guides` (매거진 SEO 구조 재활용 + 칼럼 특화)
- **분리 경로**: 매거진(`/magazines`)과 분리된 **`/guides/{lang}/{slug}`**. (고객 노출명 'Guide'와 URL 키워드 일치 + 복수 컬렉션 컨벤션 → SEO 일관). 분리 이유 = 입점사 자작 콘텐츠 품질 편차가 매거진·도메인 평가로 전이되는 것 차단, 독립 인덱싱.

**① URL · slug**
- `{lang}` = 노출 언어 코드 `en` · `ja` · `zh-CN`(간체) · `zh-TW`(번체) · `id` · `mn`. **원본 한국어는 FO 비노출이라 공개 URL 없음**.
- `{slug}` = 노출 제목 기준 **언어별 자동 생성**(해당 언어 그대로, 공백→하이픈, 비ASCII 그대로 — 매거진 `/blog/{lang}/{slug}`와 동일 방식, 예 `/guides/zh-CN/首尔毛孔护理指南`). 수정 불가, 중복 시 `-2` suffix, 게시 시 중복검사.

**② canonical · hreflang (다국어 핵심)**
- canonical = 각 언어 URL **자기 자신**(번역본은 독립 콘텐츠로 각각 인덱싱, 중복 아님).
- hreflang = 한 글의 **게시중 노출 언어 전부를 상호 alternate**로 연결 + `x-default`(영어). 원본 한국어·비노출·블라인드 언어는 제외.
- **코드 주의: 간체 = `zh-Hans`, 번체 = `zh-Hant`**(글자체 기준이 국가코드 zh-CN/zh-TW보다 정확). URL path는 zh-CN/zh-TW 유지하되 hreflang 속성은 Hans/Hant로. 그 외 en·ja·id·mn.

**③ 메타 · OG · 구조화 데이터**
- `<title>` = 노출 제목 + 스토어명 + K-Beauty Station. `meta description` = 본문 **첫 의미 있는 문장 기준 자동 발췌**(머리말·이미지 캡션 스킵, 문장 경계로 자름, 약 150~160자, 수동 입력 없음). 발췌 불가 시에만 템플릿 폴백.
- OG/Twitter : `og:type=article` · `og:title/description` · `og:image`(등록 썸네일 그대로 = 375×200, OG 이미지 재생성 안 함 — 매거진과 동일) · `og:locale`(언어별) · `og:url`(canonical) · `twitter:card=summary_large_image`.
- schema.org/**Article** : headline · image · datePublished(등록일) · dateModified(수정일) · author(스토어) · publisher(K-Beauty Station + 로고) · inLanguage · mainEntityOfPage.
- schema.org/**BreadcrumbList** : Home › Expert Guides › {스토어} › {글} (검색결과 빵부스러기 노출).

**④ sitemap · 인덱싱 (게시글 상태 연동)**
- `sitemap-guides.xml`(다국어) : **게시중 + 노출 언어 URL만** 포함. `lastmod` = 수정일, hreflang alternates 포함.
- 상태별 인덱싱
  - 게시중 → 200, index·follow + sitemap 포함
  - 숨김(호스트) · 글 전체 블라인드 · 재심사 대기 · 삭제 · 해당 언어 미번역 → **404**(공개 비노출, 매거진과 동일 방식) + sitemap·hreflang에서 제거
  - **일부 블라인드(언어 단위, BO) 또는 언어 숨김(호스트)** → 그 언어 URL만 404, 나머지 언어는 정상 인덱싱
  - ※ 블라인드·숨김은 복원 가능 → 영구 신호(410) 아닌 404로(복원 시 재크롤·재색인)

**⑤ 렌더 · 기타**
- **SSR**로 본문·메타·구조화 데이터 서버 렌더(크롤러 대응, 매거진 SSR 재활용).
- 페이지별 `<html lang>` = 노출 언어 명시(다국어 정합·접근성). robots.txt `Allow: /guides`. 썸네일 `alt`(노출 제목). 스토어 페이지 ↔ 칼럼 + **같은 스토어·태그 관련 칼럼** 상호 내부링크로 크롤 경로·연관도 확보.

### 3.8 명칭 (언어별)
| 언어 | 명칭 | 비고 |
|---|---|---|
| 한국어(내부) | 전문가 가이드 | 내부 통칭은 '칼럼' |
| 중국어 간체 | 专家攻略 | 중화권은 뷰티·시술 정보를 '攻略'로 검색(고검색량). 단어 자체는 캐주얼 |

## 4. 사용자 유형 및 권한

| 구분 | 레이어 | 권한 |
|---|---|---|
| 호스트(입점사) | HO | (권한 ON인 스토어) 자기 스토어 칼럼 작성·수정·**삭제·숨김**(삭제 시 복구불가 모달) / 다국어 입력 / 책임 확인 모달 후 게시 |
| BO 관리자 | BO | 전체 조회·모니터링 / **글·언어 단위 블라인드·삭제** / 작성 권한 ON/OFF / 금지어 사전 관리 / 태그 관리 / 경고 기록. **작성·숨김 기능 없음**(호스트 계정 접근 가능 → 작성과 동일하게 제외, 다운 조작은 블라인드만) |
| 일반 사용자 | FO | 열람만 (반응 기능 없음) |

- 칼럼은 작성 호스트 본인 스토어에 귀속(대상 스토어 선택 단계 없음). **호스트 = 단일 스토어 전제** — 여러 스토어 운영(에이전시)은 각 스토어 계정으로 접속해 작성. 권한·관리 목록·귀속 모두 스토어 단위.

## 5. 핵심 플로우

### 5.1 작성·관리 (HO)
1. **칼럼 관리 진입**(본인 스토어) → **미확인 경고 있으면 1회 확인 모달**(§3.5).
2. **작업 분기**:
   - **작성·수정·재게시** → **작성 권한 ON?** → OFF면 *"관리자에게 문의하세요"* 모달(차단) / ON이면 3번 진행.
   - **숨김·삭제**(노출 줄이는 방향) → **권한과 무관, OFF 중에도 가능**. 삭제는 **복구불가 확인 모달** 후 영구 삭제, 숨김은 복구 가능.
3. 기준 언어(한국어)로 본문 작성·수정.
4. 한 화면에서 언어별 번역 입력(자동번역 보조), 노출 언어 선택(체크박스).
5. 태그(BO 풀에서 선택)·썸네일·노출 제목 입력 → slug 자동생성.
6. 게시 클릭(확정 모달) → **① 유의사항 안내·본인 책임 확인 모달**(동의) → **② 금지어 검출**(검출 시 **차단 + 검출 금지어 안내 모달** → 본문 수정으로 복귀 후 재시도) → 즉시 게시.
7. **수정 후 게시도 동일 게이트(①동의 → ②금지어) 재확인**. 단 **숨김 해제(단순 재노출)는 게이트 없이 즉시** — 게이트는 신규 작성·내용 수정 후 게시에만 적용.
8. **블라인드 글 수정** — 수정 화면 진입 가능(저장해도 노출 X). [게시] 대신 **[재심사 요청]**(금지어 검출 후 BO 재심사 큐로). 노출 복원은 BO 승인으로만.

### 5.2 사후 통제 (BO)
1. **스토어 칼럼 목록**(사이드바 '스토어 칼럼 관리')에서 **상시 모니터링**(발행된 모든 글이 점검 대상. 스토어·언어·상태·카테고리·태그·기간 필터). **제목 클릭으로 상세 진입**(별도 '상세' 버튼 없음).
2. 문제 발견 → **블라인드(글 단위 또는 언어 단위) 또는 삭제 + 사유 기록**(사후 대응 신속성이 핵심). 언어 블라인드는 노출 체크박스와 별개의 제재 — 호스트 복원 불가.
3. **스토어 전체 제재가 필요하면** → **스토어 단위 일괄 블라인드 + 사유 기록**(BO-COL-04).
4. **경고 누적 또는 중대한 사항인 경우** → **작성 권한 OFF + 경고 기록**(권한 회수).
5. **재심사** — 호스트가 블라인드 글 수정 후 **[재심사 요청]** → BO 검토 → **승인(블라인드 해제·직전 상태 복원)** / **반려(블라인드 유지·반려 사유, 호스트도 이력 열람)**.
6. **복원·복권(역방향)** — 소명·기간 경과 등 사유 발생 시 BO가 **블라인드 해제 / 일괄 게시중(복원)**, 필요 시 **작성 권한 재ON**.
   - ※ 금지어 사전 관리(BO-COL-05)·태그 풀 관리(BO-COL-06)는 라이프사이클 흐름이 아닌 **상시 설정** 항목(§7.2).

### 5.3 노출 (FO)
- 메인 전용 섹션 + 스토어 페이지 + 마이페이지 > 전문가 가이드.
- 언어별 노출본만 해당 언어 FO에 노출.

## 6. 상태값

상태값을 **두 축**으로 분리한다. ① 스토어가 글을 쓸 수 있는지(권한), ② 개별 글이 보이는지(게시글).

### 6.1 작성 권한 — 스토어 단위
| 상태 | 의미 | 전환 주체 |
|---|---|---|
| ON | 스토어 칼럼 작성 가능 (최초 기본값) | BO |
| OFF | **신규 작성·수정·재게시 차단**(노출 줄이는 숨김·삭제는 호스트 가능). 메뉴·기존 글 노출 유지, 차단 버튼 클릭 시 "관리자에게 문의하세요" 모달. 기존 글 자동으로 안 내림(전체를 내리려면 일괄 블라인드 §6.2) | BO |

### 6.2 게시글 상태 — 글 단위
**제재 여부**로 구분한다 — **숨김**(비제재, 호스트가 복원 가능) / **블라인드**(제재, BO만 복원, 한 단계 위). **조작 주체도 분리: 숨김은 호스트만, 블라인드는 BO만**(BO엔 숨김 없음 — 작성과 동일하게 제외).

| 상태 | 의미 | 복원 가능 주체 | 비고 |
|---|---|---|---|
| 게시중 | FO 공개 노출 중 | — | 기본 상태 |
| 숨김 | 호스트가 자발적으로 내림(호스트 전용) | **호스트만** | 호스트가 다시 게시 가능(단 권한 OFF 중엔 재게시 불가) |
| 블라인드 | BO가 제재로 내림(**글 단위 — 전 언어**) | **BO만** | 호스트는 **수정·재심사 요청 가능**하나 노출 복원은 BO만. 숨김보다 상위 |
| 일부 블라인드 | BO가 **특정 언어만(언어 단위)** 제재(다른 언어는 게시중 유지) | **BO만** | 목록 상태 칩 `일부 블라인드` + 노출 언어 칼럼에서 제재 언어만 빨강·취소선. 언어별 상세는 BO 상세 |
| 블라인드 · 재심사 대기 | 호스트가 수정 후 재심사 요청(여전히 비노출) | **BO만** | BO 승인 시 복원 / 반려 시 블라인드 유지(반려 사유, 호스트 열람) |

- **삭제**는 상태가 아니라 데이터 영구 제거(복구 불가). 호스트·BO 모두 가능(**블라인드 글 포함**), 삭제 시 확인 모달. 숨김·블라인드(되돌림 가능)와 구분. **제재·복원 이력은 글 삭제와 무관하게 영구 보존**(§5.2·BO-COL-07)되므로, 블라인드 글을 삭제해도 제재 이력은 그대로 남는다.
- **작성 권한 OFF와 게시글 상태는 독립** — OFF는 작성·수정·재게시만 막고 기존 글 노출은 유지. 스토어 글 전체를 내리려면 **BO가 일괄 블라인드**(또는 호스트가 자기 글 일괄 숨김)로 별도 실행(일일이 안 해도 됨). BO는 일괄 **게시중**(복원)도 가능.

- **용어**: **'글' = 원본(한국어) + 전 언어 번역을 묶은 한 엔티티**(언어별 별도 글 아님). 특정 언어의 노출본 = 그 글의 한 **언어 단위**(별도 글 아님).
- **언어 보유·노출(비제재, 호스트)**: 호스트가 글 수정 화면에서 **① 노출 언어 체크박스** = 그 언어로 번역·보유(해제 시 그 언어 번역 제거), **② 언어별 게시 관리 — 체크된 언어별 [게시중/숨김] 토글** = 언어별 FO 게시 여부(숨김해도 번역 내용 유지·언제든 재노출하는 **비파괴** 동작). 게시중인 글은 **번역 있음 + 노출(숨김 아님) + 블라인드 아님**인 언어만 FO 노출. 원본 한국어는 FO 비노출. **언어 숨김은 호스트가 복원**(비제재) — BO **언어 블라인드(제재, BO만 복원)**와 구분(표기: 숨김=회색, 블라인드=빨강 취소선).
- **블라인드(제재 — BO만, 호스트 복원 불가)** 는 **두 단위**:
  - **① 글 블라인드** = 그 글 **전체(전 언어)** 비노출
  - **② 언어 블라인드** = **해당 언어만** 비노출(글·타 언어 유지). **호스트가 노출 선택(체크박스)으로도 못 되살림** — 제재가 비제재 노출보다 우선.
  - 전체가 위반이면 ①, 자동번역 등으로 특정 언어만 위반이면 ②.
  - **목록 표기**: ①이면 상태 칩 `블라인드`(노출 언어 전체 제재), ②이면 `일부 블라인드` + 노출 언어 칼럼에서 제재된 언어만 **빨강·취소선**(예: 중국어·일본어·~~영어~~). 언어별 상세 상태(게시중/**숨김(호스트)**/블라인드/재심사 대기/미번역)는 **BO 상세**에서 언어별로 표시·관리.
  - **블라인드 중에도 호스트 수정 가능**(저장해도 노출 X) → **[재심사 요청]** 제출(금지어 검출 자동 재실행). **노출 복원은 BO 재심사·해제로만**(제재 실효성). 블라인드 중 **삭제도 가능**(제재·복원 이력은 별도 보존).
- **상태 전이 규칙**: 블라인드 처리 시 **직전 상태(게시중/숨김)를 보존**, 블라인드 해제 시 **직전 상태로 복원**(게시중이었으면 게시중, 숨김이었으면 숨김). 일괄 처리도 동일. **재심사 흐름**: 블라인드 →(호스트 수정+재심사 요청)→ **블라인드·재심사 대기** →(BO 승인) 직전 상태 복원 / (BO 반려) 블라인드 유지·반려 사유. **제재·재심사 이력**(블라인드 사유 · 재심사 반려 사유 · 승인·복원 시점)은 호스트도 **최신순(최근 게 위) 열람** — 수정 화면 배너 **[이력 보기]** 모달(이력 2건 이상일 때만 링크 노출, 사유 전문 줄바꿈·다회차 스크롤).
- **임시저장(초안) 상태 미도입**(확정) — 기존 서비스 컨벤션 유지. 대신 작성 중 글 유실은 **이탈 경고 + 에디터 로컬 자동복구**로 방지(§7.1 HOST-COL-01).

## 7. 기능 요구사항

### 7.1 HO — 칼럼 작성·관리
| ID | 기능명 | 요구사항 |
|---|---|---|
| HOST-COL-01 | 칼럼 작성·수정 | 글 작성·수정 화면(**매거진 에디터 재활용**, 단 **상품/스토어 카드 삽입 제외** — 텍스트·이미지만). 본인 스토어 귀속. 임시저장 상태 없음 — **작성 중 이탈 시 경고 + 에디터 로컬 자동복구**로 글 유실 방지. 다음을 이 화면에 통합 — **다국어 입력**(언어 탭 + 번역 버튼 + 노출 언어 선택 체크박스 + 자동번역) · **SEO 메타**(썸네일 필수, slug 자동생성, URL `/guides/{lang}/{slug}`) · **태그 선택**(BO 태그 풀에서 대표/기타 선택, 직접 추가 불가) |
| HOST-COL-05 | 금지어 검출 | 게시 시 금지어 사전 매칭 → 검출 시 **게시 차단 + 검출된 금지어 안내 모달**(어떤 단어가 걸렸는지 안내) → 본문 수정 후 재시도(**한국어 원본 포함 전 언어**) |
| HOST-COL-06 | 책임 확인 모달 | 유의사항 안내 + 본인 책임 확인(동의해야 게시) |
| HOST-COL-07 | 목록·상태·수정·삭제·재심사 | 자기 스토어 칼럼 목록(글마다 **노출수·조회수 표시**), 게시중/숨김 전환(**개별·일괄**), 수정, **삭제(복구불가 모달, 블라인드 글 포함)**. 블라인드 글 관리 = **[수정][삭제]**(목록에 재심사 버튼 없음) — 수정 화면 진입 시 [게시]가 **[재심사 요청]**으로 전환(노출 복원은 BO). 블라인드 사유·**재심사 반려 사유**·승인 시점은 수정 화면 배너 **[이력 보기]**(이력 2건 이상일 때만 노출) 모달에서 **최신순** 열람 |
| HOST-COL-08 | 경고 확인 | 자기 스토어 경고 상태·이력 확인. 미확인 경고 시 진입 **1회 확인 모달** |

### 7.2 BO — 모니터링·통제
| ID | 기능명 | 요구사항 |
|---|---|---|
| BO-COL-01 | 작성 권한 ON/OFF | 스토어별 토글(**위치 = 스토어 정보관리 상세 탭**, 칼럼 목록엔 토글 없음), **기본 ON**. OFF 시 **신규 작성·수정·재게시 차단**(기존 글 노출 유지, 호스트 숨김·삭제는 가능) |
| BO-COL-02 | 스토어 칼럼 목록 | 전체 조회(사이드바 **'스토어 칼럼 관리'**). **제목 클릭 시 상세 진입(파랑·밑줄 링크), 별도 '상세' 버튼 없음**. 필터: 스토어·언어·상태·카테고리·태그·기간 + 통합 검색(제목·본문·스토어명·태그). **체크박스 다중선택 → 일괄([일괄 상태 변경] 모달 / [일괄 삭제])**. 상태값 = 게시중/숨김/블라인드/일부 블라인드/재심사 대기 |
| BO-COL-03 | 블라인드/삭제/재심사 | **글 단위 또는 언어 단위** 블라인드(호스트 복원 불가), 삭제(사유 기록). **재심사 대기 글 = '재심사 검토' 카드의 [재심사 승인](해제·복원)/[반려](반려 사유)로만 결정** — 재심사 대기 언어 행엔 직권 [해제] 없음. 제재·복원 이력 최신순 |
| BO-COL-04 | 일괄 상태 변경 | **스토어 단위** 전체 일괄 전환 — **게시중(복원) / 블라인드**(사유 기록). 권한 OFF와 별개로 실행 |
| BO-COL-05 | 금지어 사전 관리 | **언어별 키워드 등록**(1개 또는 대량 등록 구조), 수정·삭제, 활성/비활성. **매칭 = 정규화(대소문자·전각/반각·공백·특수문자 제거) 후 CJK 부분일치 / 영어·인니어 단어·구 경계**. 오탐 제어용 **예외(허용) 단어** + 검출 로그 |
| BO-COL-06 | 태그 관리 | 스토어 칼럼 **태그(키워드) 풀 추가·수정·삭제**. 호스트는 이 풀에서 선택 |
| BO-COL-07 | 경고 기록·관리 | 경고 이력이 화면 본문(전폭) + 헤더 **[경고 부여]** → **모달**(스토어 선택·사유·[경고 기록]). 이력 필터(경고일시·카테고리·스토어·사유/스토어 검색), **최신순**. 미확인 시 호스트 진입 1회 모달(HOST-COL-08) |

## 8. 예외사항
- 해당 언어 노출본 없을 경우: FO 미노출, URL 직접 접근 시 404.
- 숨김/블라인드/삭제 글: 숨김(호스트)은 **호스트만** 복원, 블라인드(관리자)는 **BO만** 노출 복원(호스트는 **수정·재심사 요청**만 가능, 이력 열람), 삭제는 복구 불가(모달 경고).
- 자동번역 오류 시: 오류 안내, 수기 입력.
