# K-Beauty Station — 칼럼(전문가 가이드) 기능 PRD

**v0.1 | 2026-06-16 | Draft — 개발 협의 전**
관련 문서: 매거진 기능 PRD v0.42, HO 스토어설정 PRD
STG: admin(`k-beautystation-admin.vercel.app`) / host(`k-beautystation-host.vercel.app`)

---

## 1. 문서 개요

| 항목 | 내용 |
|---|---|
| 기능명(내부 통칭) | 칼럼 (원장 칼럼) |
| 고객 노출명 | **전문가 가이드 (Expert Guide)** — 언어별 명칭 §3.8 |
| 정의 | 입점사(호스트)가 직접 작성·발행하는 스토어 귀속 **정보성 콘텐츠** — 스토어·전문성 소개 / 시술·제품 정보·추천. 의료광고 아님(§3.4) |
| 레이어 | **HO**(작성·관리) / **BO**(모니터링·통제) / **FO**(노출) |
| 기반 | 매거진 기능의 에디터·다국어·SEO·카드삽입 구조를 HO로 확장 |
| 오픈 범위 | HO 작성·관리 + FO 노출(메인·스토어 페이지·마이페이지) + BO 모니터링·숨김/삭제·금지어 사전 관리 (단계 구분 없이 이 범위로 진행. 추가 필요 시 그때 별도로 잡음) |

## ★ 주요 결정 (2026-06-16 회의 확정)

> 아래는 회의에서 **확정된 사항**. (법무 확인도 회신 완료 — 아래 ✅)

- **정보성 운영** — 광고가 아닌 소개·정보로 운영(§3.4)
- **금지어 검수 + 면책 병행** — 단어 사전 검수(검출 시 차단)도 하고, 면책 3종(①면책조항 강화 ②유의사항 안내 ③본인 책임 확인 모달)도 함께 간다
- **작성 권한 = on/off, 최초 기본 ON**(default on, 문제 시 off, §3.5)
- **권한 회수·관리** — 숨김 처리 + 게시글 단위로 어드민이 숨김/삭제 가능. 호스트도 자기 글 삭제/숨김 가능(삭제 시 복구불가 모달). **어드민 작성 기능은 없음**
- **매거진과 분리** — 속성이 달라 개념적으로 분리(단 UI는 매거진 차용·디벨롭)
- **진입 3곳** — 메인 / 스토어 페이지 / 마이페이지 > 전문가 가이드 (§3.3)
- **명칭** — 전문가 가이드 / Expert Guide (§3.8)

> ✅ **법무 확인 결과** — 게시 포스팅(텍스트)도 **원칙적으로는 의료광고 제재 대상**이나, **실무는 사전 단속이 아닌 사후 처리**(발견·신고 시 삭제 등 시정). → 우리 모델(즉시 게시 + 사후 숨김/삭제 + 금지어 검수·면책)이 현실 운영과 부합. **단 원칙상 위반이므로** 발견·신고 시 **신속 대응 + 검수·면책·책임 소재 유지**가 핵심.

## 2. 배경 · 목표

- 원장·입점사 소개, 시술·제품 정보 제공을 통한 **신뢰도 제고와 구매 전환 유도**.
- 입점사가 자기 스토어 콘텐츠를 직접 생산 → 콘텐츠·SEO 자산 확대(회사 운영 부담 없이).
- 의료법 리스크는 **금지어 검수 + 면책·책임 구조 + 사후 통제**로 관리.

---

## 3. 핵심 정책

### 3.1 게시 권한 — 즉시 게시 + 검수·면책 + 사후 통제
- 호스트가 작성하면 **어드민 사전검수 없이 즉시 게시**(사람 검수 없음).
- 단, 다음 장치로 리스크 통제:
  1. **금지어 검수(단어 사전, 차단)** — 게시 시 금지어 사전과 본문 매칭 → **검출 시 게시 차단**(수정 후 재시도). 사전은 **어드민이 언어별로 키워드를 등록·관리**(전 언어 대상, §7.2).
  2. **면책조항·약관 강화** — 콘텐츠 법적 책임은 **입점사 귀속**임을 입점 계약·이용약관에 명시·강화.
  3. **유의사항 안내 + 본인 책임 확인 모달** — 게시 시 의료광고 유의사항 안내 + "본 콘텐츠 책임은 작성자 본인" 확인 모달(전 항목 동의해야 게시).
  4. **면책 문구 푸터** — 칼럼 하단 표준 고지 자동 삽입(참고용).
  5. **BO 사후 통제** — 전체 모니터링 + 문제 글 강제 숨김/삭제.
- **게시 게이트 2개**: ①금지어 검출(차단) ②책임 확인 모달(동의).

### 3.2 다국어 — 한 화면 언어별 번역 입력 (스토어 노출정보 패턴 차용)
- 매거진의 "복제 후 별도 글" 방식 ❌ → **스토어 노출정보와 동일한 한 화면 다국어 구조**(언어 탭 + 필드별/본문 "번역" 버튼, 원본+번역 한 엔티티).
- 자동번역 엔진 = **OpenAI**. 각 언어 탭에서 결과 개별 수정 가능.
- 지원 언어: 영어 / 일본어 / 중국어 간체 / 중국어 번체 / 인도네시아어 / 몽골어(MN). 노출 언어는 스토어 활성 언어 기준.

### 3.3 노출 — 진입 3곳 · 정렬 · 매거진과 분리
- **진입 경로 3곳**:
  - **메인** — 전문가 가이드 전용 섹션 신설(디자인 시안 별도)
  - **스토어 페이지** — 해당 스토어의 전문가 가이드 노출(매장 내 위치: 자기소개 다음·리뷰 앞 권고)
  - **마이페이지 > 전문가 가이드** — Explore 영역에 매거진과 나란히
- **정렬** — 메인·모아보기는 매거진처럼 **최신순 / 인기순(=조회수)** 일괄 노출. 스토어 페이지는 해당 스토어 글.
- **매거진과 분리** — 속성이 달라 개념적으로 분리(회사 큐레이션 매거진 vs 입점사 작성 가이드). 단 **UI는 매거진 레이아웃 차용·디벨롭**. (메인 매거진 섹션명을 `K-Beauty Magazine`으로 조정해 'Guide'와 구분 권장 — 매거진 측 협의)

### 3.4 의료법 대비
- **칼럼은 의료광고가 아닌 정보성 콘텐츠로 규정·운영**. 광고성·유인성 표현은 유의사항 안내·금지어 검수로 거른다.
- 리스크 관리 = **금지어 검수(차단) + 면책조항·약관 + 책임 확인 모달 + 면책 푸터 + BO 사후 숨김/삭제**.
- 호스트는 이미 전/후사진 연결·시술 정보 구조화 필드를 상품 영역에서 다룸 → 상품 영역과 일관된 통합 정책.
- 이미지(전후사진 등) 첨부는 허용. 이미지 내용 적합성은 책임 소재(약관·책임 모달) + 사후 모니터링으로 커버.
- ✅ **법무 확인 결과**: 게시 포스팅(텍스트)도 **원칙상 제재 대상**이나 **실무는 사후 처리(발견·신고 시 시정)**. → 즉시 게시 + 사후 숨김/삭제 모델로 대응. 사후 대응 신속성·검수·면책·책임 소재가 그래서 중요.

### 3.5 작성 자격 — 스토어별 on/off (최초 기본 ON)
- 작성 권한을 **스토어 단위 on/off**로 개발. **최초에는 기본적으로 ON**(별도 승인 없이 작성 가능).
- 문제 발생 스토어는 어드민이 **off**로 전환(사후 통제).
- 권한 off 시: ①신규 작성 차단 ②기존 글 **일괄 자동 숨김**(삭제 아님, 데이터·SEO 보존). 재on 시 재게시 가능.

### 3.6 분류 — 칼럼 전용 분류
- 매거진·시술 분류와 별개의 **자체 전용 분류**(주제가 스토어 소개·원장 소개·시술 정보 등 다양 → 시술 분류 종속 불가).
- 콘텐츠 성격 기준(예: 시술·진료 정보 / 원장·전문가 소개 / 매장 이야기). **세부 카테고리는 상세 기획 시 확정(§10).**

### 3.7 SEO URL — 전용 경로 `/guide`
- 매거진(`/magazines`)과 분리된 **`/guide/{lang}/{slug}`**. (고객 노출명 'Guide'와 URL 키워드 일치 → SEO 유리)
- 분리 이유: 입점사 자작 콘텐츠의 품질 편차가 매거진·도메인 평가로 전이되는 것 차단, 독립 인덱싱 관리.
- canonical·OG·Article 스키마·SSR 등 SEO 기술 구조는 매거진 재활용.

### 3.8 명칭 (언어별)
| 언어 | 명칭 | 비고 |
|---|---|---|
| 한국어(내부) | 전문가 가이드 | 내부 통칭은 '칼럼' |
| 영어 | Expert Guide | |
| 일본어 | 専門家ガイド | |
| 중국어 간체 | 专家攻略 | 검색 강세 키워드 선택(攻略) |
| 중국어 번체 | 專家攻略 | |
| 인도네시아어 | Panduan Ahli | |
| 몽골어 | Мэргэжилтний заавар | **현지 검수 필요** |

> 명칭은 메인·스토어·마이페이지·모아보기 전 진입점에 **공통 노출**되는 기능명. SEO·중립성 고려해 'Guide(가이드)' 계열로 통일.

## 4. 사용자 유형 및 권한

| 구분 | 레이어 | 권한 |
|---|---|---|
| 호스트(입점사) | HO | (권한 ON인 스토어) 자기 스토어 칼럼 작성·수정·**삭제·숨김**(삭제 시 복구불가 모달) / 다국어 입력 / 책임 확인 모달 후 게시 |
| BO 관리자 | BO | 전체 조회·모니터링 / **게시글 단위 숨김·삭제** / 작성 권한 on/off / **금지어 사전(언어별 키워드) 관리**. **작성 기능 없음** |
| 일반 사용자 | FO | 열람만 (반응 기능 없음) |

- 칼럼은 작성 호스트 본인 스토어에 귀속(대상 스토어 선택 단계 없음).

## 5. 핵심 플로우

### 5.1 작성·게시 (HO)
1. 작성 진입(본인 스토어) → 기준 언어 본문 작성(리치 에디터).
2. 한 화면에서 언어별 번역 입력(자동번역 보조), 언어별 노출 on/off.
3. 본문에 상품·스토어 카드 인라인 삽입(자기 스토어/상품).
4. 썸네일·노출 제목 입력 → slug 자동생성.
5. 게시 클릭 → **① 금지어 검출**(검출 시 차단·수정 후 재시도) → **② 유의사항 안내·본인 책임 확인 모달**(동의) → 즉시 게시 + 면책 푸터.
6. **수정·재게시도 동일 게이트 재확인**.
7. **삭제** — 호스트가 자기 글 삭제 시 **복구불가 모달** 확인 후 삭제. 숨김은 복구 가능.

### 5.2 사후 통제 (BO)
1. 통합 목록에서 전체 모니터링(스토어·작성자·언어·상태 필터).
2. 문제 글 → **게시글 단위 숨김 또는 삭제**(사후 대응 신속성이 핵심).
3. 금지어 사전 관리 — 언어별 키워드 추가(1개/대량).

### 5.3 노출 (FO)
- 메인 전용 섹션 + 스토어 페이지 + 마이페이지 > 전문가 가이드. 메인·모아보기는 최신순/조회수순.
- 언어별 노출본만 해당 언어 FO에 노출.

## 7. 기능 요구사항

### 7.1 HO — 칼럼 작성·관리

| COL-HOST-01 | 칼럼 작성 | 리치 에디터(기존 호스트 상품 상세 에디터 재활용). 본인 스토어 귀속 |
| COL-HOST-02 | 다국어 입력 | 스토어 노출정보 패턴(언어 탭 + 번역 버튼), OpenAI 자동번역 |
| COL-HOST-03 | 카드 삽입 | 본문에 자기 스토어/상품 카드 인라인 삽입 |

| COL-HOST-06 | 금지어 검출 | 게시 시 금지어 사전 매칭 → 검출 시 게시 차단·수정(전 언어) |
| COL-HOST-07 | 책임 확인 모달 | 유의사항 안내 + 본인 책임 확인(동의해야 게시) |
| COL-HOST-08 | 면책 푸터 | 표준 면책 문구 자동 삽입(편집 불가, 언어별) |
| COL-HOST-09 | 목록·상태·수정·삭제 | 자기 스토어 칼럼 목록, 게시/비게시/숨김 전환, 수정, **삭제(복구불가 모달)** |

### 7.2 BO — 모니터링·통제
| ID | 기능명 | 요구사항 |
|---|---|---|
| COL-BO-01 | 작성 권한 on/off | 스토어별 토글, **기본 ON**. off 시 신규 차단 + 기존 일괄 숨김 |

| COL-BO-04 | 금지어 사전 관리 | **언어별 키워드 등록**(1개 또는 대량 등록 구조), 수정·삭제 |

## 8. 예외사항
- 해당 언어 노출본 없을 경우: FO 미노출, URL 직접 접근 시 404.
- 숨김/삭제 글: 숨김은 복구 가능, 삭제는 복구 불가(모달 경고).
- 자동번역 오류 시: 오류 안내, 수기 입력.
