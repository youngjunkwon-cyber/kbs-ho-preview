# K-Beauty Station — 칼럼(전문가 가이드) 기능 PRD

**v0.1 | 2026-06-16 | Draft — 개발 협의 전**
관련 문서: 매거진 기능 PRD v0.42, HO 스토어설정 PRD
STG: admin(`k-beautystation-admin.vercel.app`) / host(`k-beautystation-host.vercel.app`)

---

## 1. 문서 개요

| 항목 | 내용 |
|---|---|
| 기능명(내부 통칭) | 칼럼 (원장 칼럼) |
| 고객 노출명 | **전문가 가이드 (Expert Guide)** — 언어별 명칭 §3.8 |
| 정의 | 입점사(호스트)가 직접 작성·발행하는 스토어 귀속 **정보성 콘텐츠** — 스토어·전문성 소개 / 시술·제품 정보·추천. **의료광고가 아닌 정보로 운영(회사 방침)**, 단 법적으로는 원칙상 제재 대상 — §3.4 |
| 레이어 | **HO**(작성·관리) / **BO**(모니터링·통제) / **FO**(노출) |
| 기반 | 매거진 기능의 에디터·다국어·SEO 구조를 HO로 확장 |
| 오픈 범위 | HO 작성·관리 + FO 노출(메인·스토어 페이지·마이페이지) + BO 모니터링·블라인드/삭제·금지어 사전 관리 (단계 구분 없이 이 범위로 진행. 추가 필요 시 그때 별도로 잡음) |

## ★ 주요 결정 (2026-06-16 회의 확정)

> 아래는 회의에서 **확정된 사항**. (법무 확인도 회신 완료 — 아래 ✅)

- **정보성 운영** — 광고가 아닌 소개·정보로 운영(§3.4)
- **금지어 검수 + 면책 병행** — 단어 사전 검수(검출 시 차단)도 하고, 면책 3종(①면책조항 강화 ②유의사항 안내 ③본인 책임 확인 모달)도 함께 간다
- **작성 권한 = on/off, 최초 기본 ON**(default on, 문제 시 off, §3.5)
- **권한 회수·관리** — off는 **신규 작성·수정·재게시 차단**(노출·열람 유지, 노출 줄이는 호스트 숨김·삭제는 가능). 게시글 단위로 어드민이 블라인드/삭제, 필요 시 스토어 단위 **일괄 게시중/블라인드**. 호스트도 자기 글 삭제/숨김(개별·일괄) 가능(삭제 시 복구불가 모달). **어드민은 작성·숨김 기능 없음**(호스트 계정 접근 가능 → 작성과 동일하게 제외, BO 다운 조작은 블라인드만)
- **매거진과 분리** — 속성이 달라 개념적으로 분리(단 UI는 매거진 차용·디벨롭)
- **진입 3곳** — 메인 / 스토어 페이지 / 마이페이지 > 전문가 가이드 (§3.3)
- **명칭** — 전문가 가이드 / Expert Guide (§3.8)

> ✅ **법무 확인 결과** — 게시 포스팅(텍스트)도 **원칙적으로는 의료광고 제재 대상**이나, **실무는 사전 단속이 아닌 사후 처리**(발견·신고 시 삭제 등 시정). → 우리 모델(즉시 게시 + 사후 블라인드/삭제 + 금지어 검수·면책)이 현실 운영과 부합. **단 원칙상 위반이므로** 발견·신고 시 **신속 대응 + 검수·면책·책임 소재 유지**가 핵심.

## 2. 배경 · 목표

- 원장·입점사 소개, 시술·제품 정보 제공을 통한 **신뢰도 제고와 구매 전환 유도**.
- 입점사가 자기 스토어 콘텐츠를 직접 생산 → 콘텐츠·SEO 자산 확대(회사 운영 부담 없이).
- 의료법 리스크는 **금지어 검수 + 면책·책임 구조 + 사후 통제**로 관리.

---

## 3. 핵심 정책

### 3.1 게시 권한 — 즉시 게시 + 검수·면책 + 사후 통제
- 호스트가 작성하면 **어드민 사전검수 없이 즉시 게시**(사람 검수 없음).
- 단, 다음 장치로 리스크 통제:
  1. **유의사항 안내 + 본인 책임 확인 모달** — 게시 클릭 시 게시 확정 모달에서 의료광고 유의사항 안내 + "본 콘텐츠 책임은 작성자 본인" 확인(전 항목 동의해야 게시 확정).
  2. **금지어 검수(단어 사전, 차단)** — 게시 확정 시 금지어 사전과 본문 매칭 → **검출 시 게시 차단 + 검출된 금지어 안내 모달**(어떤 금지어가 걸렸는지 안내 → 수정 후 재시도). 사전은 **어드민이 언어별로 키워드를 등록·관리**(**한국어 원본 포함 전 언어** 대상, §7.2).
  3. **면책조항·약관 강화** — 콘텐츠 법적 책임은 **입점사 귀속**임을 입점 계약·이용약관에 명시·강화.
  4. **BO 사후 통제** — 전체 모니터링 + 문제 글 블라인드/삭제.
- **게시 게이트 2개(순서대로)**: ①유의사항·본인 책임 확인 모달(동의) → ②금지어 검출(차단). 게시 클릭 → 확정 모달에서 동의 → 확정 시 금지어 검출 → 통과 시 즉시 게시.

### 3.2 다국어 — 한 화면 언어별 번역 입력 (스토어 노출정보 패턴 차용)
- 매거진의 "복제 후 별도 글" 방식 ❌ → **스토어 노출정보와 동일한 한 화면 다국어 구조**(언어 탭 + 필드별/본문 "번역" 버튼, 원본+번역 한 엔티티).
- **언어 탭 노출**: 스토어가 활성화한 언어 설정에 맞춰 해당 언어 탭만 노출된다.
- **번역**: 번역 버튼을 누르면 활성 언어들에 대해서만 **일괄 자동번역**(OpenAI)되고, 각 언어 탭에서 **개별 수정** 가능하다.
- 지원 언어: 영어 / 일본어 / 중국어 간체 / 중국어 번체 / 인도네시아어 / 몽골어(MN).
- **원본(기준) 언어 = 한국어** — 호스트가 한국어로 작성 후 위 6개 언어로 번역. 한국어 원본은 **내부 기준이며 FO 비노출**(노출은 번역본만). 입력 언어가 한국어인지 시스템이 판별·강제하지 않음.

### 3.3 노출 — 진입 3곳 · 정렬 · 매거진과 분리
- **진입 경로 3곳**:
  - **메인** — 전문가 가이드 전용 섹션 신설(디자인 시안 별도)
  - **스토어 페이지**: 해당 스토어의 전문가 가이드 노출. 매장 페이지 내 위치는 **상품 섹션 위**
  - **마이페이지 > 전문가 가이드** — Explore 영역에 매거진과 나란히
- **정렬** — 메인·모아보기는 **최신순 / 인기순(=조회수)** 토글. **스토어 페이지는 해당 스토어 글을 최신순 고정**(활동성·신선도 우선, 콜드스타트 회피). (**조회수 = 글 상세 화면 진입 수**)
- **매거진과 분리** — 속성이 달라 개념적으로 분리(회사 큐레이션 매거진 vs 입점사 작성 가이드). 단 **UI는 매거진 레이아웃 차용·디벨롭**.

### 3.4 의료법 대비
- **칼럼은 의료광고가 아닌 정보성 콘텐츠로 규정·운영**. 광고성·유인성 표현은 유의사항 안내·금지어 검수로 거른다.
- 리스크 관리 = **금지어 검수(차단) + 면책조항·약관 + 책임 확인 모달 + BO 사후 블라인드/삭제**.
- 호스트는 이미 전/후사진 연결·시술 정보 구조화 필드를 상품 영역에서 다룸 → 상품 영역과 일관된 통합 정책.
- 이미지(전후사진 등) 첨부는 허용. 이미지 내용 적합성은 책임 소재(약관·책임 모달) + 사후 모니터링으로 커버.
- ✅ **법무 확인 결과**: 게시 포스팅(텍스트)도 **원칙상 제재 대상**이나 **실무는 사후 처리(발견·신고 시 시정)**. → 즉시 게시 + 사후 블라인드/삭제 모델로 대응. 사후 대응 신속성·검수·면책·책임 소재가 그래서 중요.

### 3.5 작성 자격 — 스토어별 on/off (최초 기본 ON)
- 작성 권한을 **스토어 단위 on/off**로 개발. **최초에는 기본적으로 ON**(별도 승인 없이 작성 가능).
- **off 발동 기준(명문화)**: ① 의료법 위반 게시 반복 ② 약관·운영정책 위반 ③ 부적절·허위 콘텐츠 지속. **BO 재량으로 off**(필수 사전 경고 절차는 두지 않음). **off 실행 시 경고 기록을 동반**(권한 회수 사유를 호스트에게 정식 고지). 반복·중대 판정 근거는 누적된 **제재 사유 기록**(§5.2)이다.
- **경고·고지 방식**: 외부 통지·소통(메신저 등)은 **기존 운영 채널로 별도 진행**. 사이트 내에서는 **경고(주의) 상태**로 노출.
  - 평상시엔 비어 있다가, 이슈 발생 시 **BO가 경고를 기록(사유·일시)** → 호스트가 **전문가 가이드 관리 화면에서 확인**(노출 배치는 화면 설계 시 확정).
  - 이력은 히스토리로 보관(단, "1/3" 식 임계 카운터는 노출하지 않음).
  - 미확인 경고가 있으면 호스트가 가이드 관리/작성 진입 시 **1회 확인 모달**.
- **off 시 동작**: 칼럼 메뉴는 **노출 유지**하되 **신규 작성/등록·수정·재게시 버튼 비활성(disable)**, 클릭 시 *"작성하려면 관리자에게 문의하세요"* 모달. **기존 글은 노출 유지(열람)**.
  - off 중 게시글 조작은 **노출을 줄이는 방향만 허용** — 호스트가 자기 글 **숨김·삭제는 가능**, 단 **숨김 → 재게시·수정·신규 작성은 불가**(권한 복구 전까지).
  - 권한(작성)과 게시글 상태는 독립. 스토어 글 전체를 내려야 하면 BO가 **일괄 블라인드**로 별도 처리.

### 3.6 분류·태그 — 칼럼 전용
- **분류**: 매거진·시술 분류와 별개의 자체 전용 분류(콘텐츠 성격 기준: 시술·진료 정보 / 원장·전문가 소개 / 매장 이야기 등). **운영(기획)이 정의·관리하는 고정 카테고리** — 호스트는 선택만(추가 불가). 세부 카테고리는 상세 기획 시 확정(§9).
- **태그**: BO 관리자가 **태그(키워드) 풀을 관리**하고, 호스트는 그 중 **선택해서만 사용**(호스트 직접 추가 불가 — 태그 난립·중복·표기 불일치 방지). 신규 태그가 필요하면 BO가 풀에 추가.

### 3.7 SEO URL — 전용 경로 `/guides`
- 매거진(`/magazines`)과 분리된 **`/guides/{lang}/{slug}`**. (고객 노출명 'Guide'와 URL 키워드 일치 + 매거진과 동일한 복수 컬렉션 컨벤션 → SEO·구조 일관)
- 분리 이유: 입점사 자작 콘텐츠의 품질 편차가 매거진·도메인 평가로 전이되는 것 차단, 독립 인덱싱 관리.
- canonical·OG·Article 스키마·SSR 등 SEO 기술 구조는 매거진 재활용.

### 3.8 명칭 (언어별)
| 언어 | 명칭 | 비고 |
|---|---|---|
| 한국어(내부) | 전문가 가이드 | 내부 통칭은 '칼럼' |
| 영어 | Expert Guide | 'Guide'가 정보 탐색 검색에 가장 강한 키워드, 전 업종 포괄·중립 |
| 일본어 | 専門家ガイド | 일본 정보 검색은 'ガイド'가 표준 강세 |
| 중국어 간체 | 专家攻略 | 중화권은 뷰티·시술 정보를 '攻略'로 검색(고검색량). 단어 자체는 캐주얼 |
| 중국어 번체 | 專家攻略 | 대만·홍콩도 '攻略' 검색 강세 |
| 인도네시아어 | Panduan Ahli | 인니 정보 검색은 'Panduan'이 표준 |
| 몽골어 | Мэргэжилтний заавар | 검색 데이터가 적어 직역(전문가+안내) |

> 명칭은 메인·스토어·마이페이지·모아보기 전 진입점에 **공통 노출**되는 기능명. SEO·중립성 고려해 'Guide(가이드)' 계열로 통일.

## 4. 사용자 유형 및 권한

| 구분 | 레이어 | 권한 |
|---|---|---|
| 호스트(입점사) | HO | (권한 ON인 스토어) 자기 스토어 칼럼 작성·수정·**삭제·숨김**(삭제 시 복구불가 모달) / 다국어 입력 / 책임 확인 모달 후 게시 |
| BO 관리자 | BO | 전체 조회·모니터링 / **글·언어판 단위 블라인드·삭제** / 작성 권한 on/off / 금지어 사전 관리 / 태그 관리 / 경고 기록. **작성·숨김 기능 없음**(호스트 계정 접근 가능 → 작성과 동일하게 제외, 다운 조작은 블라인드만) |
| 일반 사용자 | FO | 열람만 (반응 기능 없음) |

- 칼럼은 작성 호스트 본인 스토어에 귀속(대상 스토어 선택 단계 없음).

## 5. 핵심 플로우

### 5.1 작성·관리 (HO)
1. **가이드 관리 진입**(본인 스토어) → **미확인 경고 있으면 1회 확인 모달**(§3.5).
2. **작업 분기**:
   - **작성·수정·재게시** → **작성 권한 ON?** → OFF면 *"관리자에게 문의하세요"* 모달(차단) / ON이면 3번 진행.
   - **숨김·삭제**(노출 줄이는 방향) → **권한과 무관, OFF 중에도 가능**. 삭제는 **복구불가 확인 모달** 후 영구 삭제, 숨김은 복구 가능.
3. 기준 언어(한국어)로 본문 작성·수정.
4. 한 화면에서 언어별 번역 입력(자동번역 보조), 노출 언어 선택(체크박스).
5. 분류·태그(BO 풀에서 선택)·썸네일·노출 제목 입력 → slug 자동생성.
6. 게시 클릭(확정 모달) → **① 유의사항 안내·본인 책임 확인 모달**(동의) → **② 금지어 검출**(검출 시 **차단 + 검출 금지어 안내 모달** → 본문 수정으로 복귀 후 재시도) → 즉시 게시.
7. **수정·재게시도 동일 게이트(①동의 → ②금지어) 재확인**.

### 5.2 사후 통제 (BO)
1. 통합 목록에서 **상시 모니터링**(발행된 모든 글이 점검 대상. 스토어·작성자·언어·상태 필터).
2. 문제 발견 → **블라인드(글 단위 또는 언어판 단위) 또는 삭제 + 사유 기록**(사후 대응 신속성이 핵심). 언어판 블라인드는 노출 체크박스와 별개의 제재 — 호스트 복원 불가.
3. **스토어 전체 제재가 필요하면** → **스토어 단위 일괄 블라인드 + 사유 기록**(COL-BO-04).
4. **반복·중대 위반이면** → **작성 권한 OFF + 경고 기록**(권한 회수. 단발 제재면 여기 없이 종료).
5. **복원·복권(역방향)** — 소명·기간 경과 등 사유 발생 시 BO가 **블라인드 해제 / 일괄 게시중(복원)**, 필요 시 **작성 권한 재ON**.
   - ※ 금지어 사전 관리(COL-BO-05)·태그 풀 관리(COL-BO-06)는 라이프사이클 흐름이 아닌 **상시 설정** 항목(§7.2).

### 5.3 노출 (FO)
- 메인 전용 섹션 + 스토어 페이지 + 마이페이지 > 전문가 가이드.
- 언어별 노출본만 해당 언어 FO에 노출.

## 6. 상태값

상태값을 **두 축**으로 분리한다. ① 스토어가 글을 쓸 수 있는지(권한), ② 개별 글이 보이는지(게시글).

### 6.1 작성 권한 — 스토어 단위
| 상태 | 의미 | 전환 주체 |
|---|---|---|
| ON | 전문가 가이드 작성 가능 (최초 기본값) | BO |
| OFF | **신규 작성·수정·재게시 차단**(노출 줄이는 숨김·삭제는 호스트 가능). 메뉴·기존 글 노출 유지, 차단 버튼 클릭 시 "관리자에게 문의하세요" 모달. 기존 글 자동으로 안 내림(전체를 내리려면 일괄 블라인드 §6.2) | BO |

### 6.2 게시글 상태 — 글 단위
**제재 여부**로 구분한다 — **숨김**(비제재, 호스트가 복원 가능) / **블라인드**(제재, BO만 복원, 한 단계 위). **조작 주체도 분리: 숨김은 호스트만, 블라인드는 BO만**(BO엔 숨김 없음 — 작성과 동일하게 제외).

| 상태 | 의미 | 복원 가능 주체 | 비고 |
|---|---|---|---|
| 게시중 | FO 공개 노출 중 | — | 기본 상태 |
| 숨김 | 호스트가 자발적으로 내림(호스트 전용) | **호스트만** | 호스트가 다시 게시 가능(단 권한 off 중엔 재게시 불가) |
| 블라인드 | BO가 제재로 내림(**글/언어판 단위**, 개별·일괄) | **BO만** | 호스트는 재노출 불가(제재 실효성 확보). 숨김보다 상위 |

- **삭제**는 상태가 아니라 데이터 영구 제거(복구 불가). 호스트·BO 모두 가능, 삭제 시 확인 모달. 숨김·블라인드(되돌림 가능)와 구분.
- **작성 권한 off와 게시글 상태는 독립** — off는 작성·수정·재게시만 막고 기존 글 노출은 유지. 스토어 글 전체를 내리려면 **BO가 일괄 블라인드**(또는 호스트가 자기 글 일괄 숨김)로 별도 실행(일일이 안 해도 됨). BO는 일괄 **게시중**(복원)도 가능.

- **용어**: **'글' = 원본(한국어) + 전 언어 번역을 묶은 한 엔티티**(언어별 별도 글 아님). 특정 언어 버전 = 그 글의 **'언어판'**.
- **언어판 노출(비제재)**: 호스트가 글 수정 화면의 **노출 언어 선택**(체크박스, 라이브 스토어 지원언어 방식, 스토어 지원언어 범위 내)으로 켜고 끈다. 게시중인 글은 **노출 선택 + 번역 있는** 언어판만 FO 노출. 원본 한국어는 FO 비노출.
- **블라인드(제재 — BO만, 호스트 복원 불가)** 는 **두 단위**:
  - **① 글 블라인드** = 그 글 **전체(전 언어판)** 비노출
  - **② 언어판 블라인드** = **해당 언어판만** 비노출(글·타 언어판 유지). **호스트가 노출 선택(체크박스)으로도 못 되살림** — 제재가 비제재 노출보다 우선.
  - 전체가 위반이면 ①, 자동번역 등으로 특정 언어만 위반이면 ②.
  - **블라인드 중에는 누구도 수정 불가**(수정 화면 진입 자체 차단). BO가 블라인드를 해제해야 수정 가능.
- **임시저장(초안) 상태 미도입**(확정) — 기존 서비스 컨벤션 유지. 대신 작성 중 글 유실은 **이탈 경고 + 에디터 로컬 자동복구**로 방지(§7.1 COL-HOST-01).

| COL-HOST-02 | 다국어 입력 | 스토어 노출정보 패턴(언어 탭 + 번역 버튼 + **노출 언어 선택 체크박스**), OpenAI 자동번역 |

| COL-HOST-06 | 책임 확인 모달 | 유의사항 안내 + 본인 책임 확인(동의해야 게시) |
| COL-HOST-07 | 목록·상태·수정·삭제 | 자기 스토어 칼럼 목록, 게시중/숨김 전환(**개별·일괄**), 수정, **삭제(복구불가 모달)** |
| COL-HOST-08 | 경고 확인 | 자기 스토어 경고 상태·이력 확인. 미확인 경고 시 진입 **1회 확인 모달** |

## 8. 예외사항
- 해당 언어 노출본 없을 경우: FO 미노출, URL 직접 접근 시 404.
- 숨김/블라인드/삭제 글: 숨김(호스트)은 **호스트만** 복원, 블라인드(관리자)는 **BO만** 복원, 삭제는 복구 불가(모달 경고).
- 자동번역 오류 시: 오류 안내, 수기 입력.
