<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>상품 예약 시안 | K-Beauty Station</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:12px;color:#1a1a1a;background:#fff;overflow:hidden}
button,select,input,textarea{font-family:inherit;font-size:12px;color:inherit}
#app{height:100vh;display:flex;flex-direction:column}
/* 화면 전환 줄 */
#sw{height:36px;flex:none;background:#1f1f1f;color:#ddd;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:11.5px}
#sw b{color:#fff;margin-right:4px}
#sw .s{height:24px;padding:0 10px;border:1px solid #444;border-radius:4px;background:transparent;color:#ccc;cursor:pointer}
#sw .s.on{background:#fff;color:#111;border-color:#fff;font-weight:700}
#sw .sp{flex:1}
#sw select{height:24px;background:#2b2b2b;color:#eee;border:1px solid #444;border-radius:4px;padding:0 6px}
#surf{flex:1;min-height:0;display:flex;flex-direction:column}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:99;background:rgba(26,26,26,.92);color:#fff;font-size:12px;padding:9px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
#toast.on{opacity:1}
[data-act]{cursor:pointer}
.th-thumb{display:inline-block;border-radius:4px;flex:none}
/* 공통 모달 */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;border-radius:8px;width:420px;max-width:92vw;max-height:86vh;overflow:auto;padding:22px 22px 18px}
.mbox.wide{width:760px}
.mbox h3{font-size:15px;font-weight:700;margin-bottom:8px}
.mbox p{font-size:12.5px;color:#555;line-height:1.6}
.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.mbtns button{height:32px;padding:0 16px;border-radius:4px;border:1px solid #d9d9d9;background:#fff;cursor:pointer}
.mbtns button.pri{border-color:#3b78f6;background:#3b78f6;color:#fff}
.mbtns button.pk{border-color:#e8537a;background:#e8537a;color:#fff}
.xt{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px}
.xt th,.xt td{border:1px solid #e5e5e5;padding:6px 8px;text-align:left;white-space:nowrap}
.xt th{background:#f3f3f3;font-weight:700}
.xt th.new{background:#fff0f5;color:#c2185b}

/* ================= HOST ================= */
.H{--pk:#e8537a;--pkl:#fdeef2;--pkb:#f6cdd8;--ln:#e8e8e8;--ln2:#ddd;--t3:#8a8a8a;--t4:#b5b5b5;--bg:#f5f6f8;flex:1;min-height:0;display:flex;flex-direction:column;font-size:12px}
.H .top{height:52px;flex:none;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 12px}
.H .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.H .logo i{width:24px;height:24px;border-radius:7px;background:var(--pk);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center}
.H .user{border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600}
.H .body{flex:1;min-height:0;display:flex}
.H .side{width:190px;flex:none;border-right:1px solid var(--ln);overflow-y:auto;padding:9px 4px}
.H .mi{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:7px;font-size:11.5px;margin-bottom:2px}
.H .mi.act{background:var(--pk);color:#fff;font-weight:600}
.H .mi.g{color:var(--pk)}
.H .subs{background:#f8f8f8;margin:0 -4px 2px;padding:3px 4px}
.H .subs .mi{padding-left:32px;height:32px}
.H .main{flex:1;min-width:0;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.H .ph{background:#fff;padding:10px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;flex:none}
.H .ph h1{font-size:16px;font-weight:800}
.H .ph p{font-size:10.5px;color:var(--t3);margin-top:1px}
.H .fb{background:#fff;padding:10px 20px 12px;border-bottom:1px solid var(--ln);display:flex;flex-direction:column;gap:8px;flex:none}
.H .fr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.H select,.H input[type=text],.H input[type=date]{height:28px;border:1px solid var(--ln2);border-radius:3px;background:#fff;padding:0 8px;font-size:11px;outline:none}
.H select.new{border-color:var(--pk);box-shadow:0 0 0 1px var(--pk)}
.H .btn{height:28px;padding:0 12px;border:1px solid var(--ln2);background:#fff;border-radius:3px;font-size:11px;cursor:pointer}
.H .btn.pk{background:var(--pk);border-color:var(--pk);color:#fff;font-weight:600}
.H .card{background:#fff;margin:14px 20px 20px;border-radius:2px}
.H .card .hd{padding:14px 18px 10px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.H .tw{overflow-x:auto;padding:0 18px 4px}
.H table{border-collapse:collapse;width:100%}
.H th{background:#f7f7f7;font-size:11px;font-weight:800;text-align:left;padding:9px 8px;white-space:nowrap;border-bottom:1px solid var(--ln)}
.H th.new{box-shadow:inset 0 -3px 0 var(--pk)}
.H td{padding:10px 8px;font-size:11px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:middle}
.H td small{display:block;color:var(--t3);font-size:9.5px;margin-top:2px}
.H .btn-s{height:22px;padding:0 8px;border:1px solid var(--ln2);background:#fff;border-radius:3px;font-size:10.5px}
.H .empty{padding:40px 0;text-align:center;color:var(--t3)}
.H .gh th{text-align:center;border-right:1px solid var(--ln)}
.H .gh th.g{background:#efefef}
/* 대시보드 */
.H .dash{width:900px;max-width:100%;margin:0 auto;padding:18px 0 40px}
.H .dcard{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:20px;margin-top:16px}
.H .dcard h2{font-size:14px;font-weight:800}
.H .dcard .sub{font-size:10px;color:var(--t3);margin-top:3px}
.H .dh{display:flex;justify-content:space-between;align-items:flex-start}
.H .tabs{display:flex;gap:6px;margin-top:14px}
.H .tabs span{height:26px;padding:0 10px;border:1px solid var(--ln);border-radius:3px;font-size:10px;color:var(--t3);display:flex;align-items:center}
.H .tabs span.on{border-color:#222;color:#111;font-weight:700}
.H .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.H .rc{border:1px solid var(--ln);border-radius:5px;padding:12px 13px;background:#fbfbfb;min-height:96px}
.H .rc .l1{display:flex;justify-content:space-between;font-weight:800;font-size:10.5px}
.H .rc .l2{font-weight:700;font-size:10.5px;margin-top:5px}
.H .rc .lp{font-size:10px;margin-top:3px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.H .rc .l3,.H .rc .l5{font-size:9px;color:var(--t3);margin-top:3px}
.H .bd{font-size:8.5px;color:var(--pk);border:1px solid var(--pkb);background:var(--pkl);border-radius:3px;padding:0 5px}
.H .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.H .kp{background:#f6f6f7;border-radius:5px;padding:12px;min-height:70px}
.H .kp span{font-size:9px;color:#4d4d4d}
.H .kp b{display:block;font-size:20px;font-weight:800;margin-top:8px}
/* 예약 관리 */
.H .resw{display:flex;flex:1;min-height:0}
.H .resl{flex:1;min-width:0;overflow:auto}
.H .resp{width:250px;flex:none;background:#fff;border-left:1px solid var(--ln);padding:14px 11px;overflow-y:auto}
.H .resp h3{font-size:11.5px;font-weight:800}
.H .resp h3 em{font-style:normal;background:#c85a1d;color:#fff;border-radius:9px;font-size:9px;padding:1px 6px;margin-left:4px}
.H .pdesc{font-size:8.5px;color:#4d4d4d;margin:9px 0 6px;line-height:1.45}
.H .pcard{background:#f3f3f4;border-radius:7px;padding:11px 12px;margin-bottom:7px;min-height:84px}
.H .pcard .l1{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.H .pcard .l2{font-size:9.5px;font-weight:700;margin-top:6px}
.H .pcard .lp{font-size:9.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.H .pcard .l3{font-size:8px;color:var(--t3);margin-top:3px}
.H .ov{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:50}
.H .dw{position:fixed;top:0;right:0;bottom:0;width:320px;background:#fff;z-index:51;display:flex;flex-direction:column;padding:16px 14px 14px;overflow-y:auto}
.H .dw .hd2{display:flex;gap:8px;font-size:12px;font-weight:700;margin-bottom:12px}
.H .dw .stp{align-self:flex-start;border:1px solid var(--ln);border-radius:12px;font-size:9px;padding:2px 8px;margin-bottom:9px}
.H .dw .dt{font-size:16px;font-weight:800;margin-bottom:11px}
.H .kv2{display:flex;justify-content:space-between;font-size:9.5px;margin-bottom:6px;gap:14px}
.H .kv2 span{color:var(--t3);white-space:nowrap}
.H .kv2 b{text-align:right}
.H .kv2.new b{box-shadow:inset 0 -1px 0 var(--pk)}
.H .sec{font-size:9px;color:var(--t3);margin:10px 0 4px}
.H .bx{border:1px solid var(--ln);border-radius:4px;padding:7px 8px;font-size:9.5px;min-height:30px}
.H .ab{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:14px}
.H .ab div{height:32px;border-radius:4px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#bbb}
.H .ab div.w{grid-column:1/3;border-color:#111;color:#111;font-weight:700}
.prd{display:flex;gap:10px;align-items:center;border:1px solid var(--pkb,#f6cdd8);border-radius:6px;padding:9px 10px;margin:4px 0 12px;background:#fff}
.prd .pt{flex:1;min-width:0}
.prd .pn{font-size:11px;font-weight:700;line-height:1.35}
.prd .pp{font-size:10.5px;margin-top:3px}
.prd .pl{font-size:10px;color:#2f6fe0;margin-top:4px;display:inline-block}
.H .form{background:#fff;margin:14px 20px;padding:18px 20px;border-radius:2px;max-width:640px}
.H .frow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.H .frow label{width:110px;flex:none;font-size:11.5px;color:#444}
.H .frow.new label{color:var(--pk);font-weight:600}
.H .frow select,.H .frow input{flex:1;height:32px}
.H .note{font-size:10px;color:var(--t3);margin:-6px 0 12px 122px}
.H .ro{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:5px;padding:10px 12px;background:#fafafa;font-size:11.5px}
.H .pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:10.5px;font-weight:600}
.H .pill.on{background:#e6f7ea;color:#1a8c33}.H .pill.off{background:#f1f1f1;color:#888}

/* ================= BO ================= */
.B{--bl:#3b78f6;--ln:#f0f0f0;--bd:#d9d9d9;--g:#8c8c8c;--pk:#ff4f8b;flex:1;min-height:0;display:flex;flex-direction:column;background:#f4f4f5;font-size:13px}
.B .hdr{height:50px;flex:none;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 20px}
.B .logo{font-weight:800;color:#e5707c;font-size:17px;letter-spacing:.4px}
.B .body{flex:1;min-height:0;display:flex}
.B .side{width:185px;flex:none;background:#fff;border-right:1px solid var(--ln);overflow-y:auto;padding:6px 0 30px}
.B .mi{padding:9px 12px 9px 22px;font-size:13px}
.B .mi.open{color:#1668dc}
.B .sub{background:#fafafa;padding:4px 0}
.B .sub .mi{padding:7px 12px 7px 40px;font-size:12.5px}
.B .sub .mi.on{background:#e6f0ff;color:#1668dc;margin:2px 6px;padding-left:34px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #b9d3ff}
.B .main{flex:1;min-width:0;overflow:auto;padding-bottom:40px}
.B .ph{background:#fff;padding:14px 20px 12px;border-bottom:1px solid var(--ln)}
.B .ph h1{font-size:17px;font-weight:700}
.B .ph p{font-size:11px;color:var(--g);margin-top:2px}
.B .blk{background:#fff;margin:10px 12px 0;padding:14px 16px;border-radius:2px}
.B .fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.B .ctl{height:32px;border:1px solid var(--bd);border-radius:4px;background:#fff;padding:0 10px;font-size:12.5px;outline:none}
.B .ctl.new{border-color:var(--pk);box-shadow:0 0 0 1px rgba(255,79,139,.28)}
.B .btnp{height:32px;background:var(--bl);color:#fff;border:0;border-radius:4px;padding:0 15px;font-size:12.5px;cursor:pointer}
.B .btnx{height:30px;border:1px solid var(--bd);background:#fff;border-radius:4px;padding:0 14px;font-size:12px;cursor:pointer}
.B .tw{overflow-x:auto}
.B table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.B .tbl th{background:#fafafa;font-weight:600;text-align:left;padding:12px 8px;white-space:nowrap}
.B .tbl td{padding:12px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;vertical-align:middle}
.B .tbl th.new{border-bottom:2px solid var(--pk);background:#fff0f5;color:var(--pk)}
.B .tbl td.new{background:#fffafc}
.B .tbl td small{display:block;font-size:10.5px;color:#a6a6a6}
.B .tbl tr.tot td{background:#fafafa;font-weight:700}
.B .mb{display:inline-block;height:22px;line-height:20px;border:1px solid #ccc;border-radius:3px;padding:0 7px;font-size:11px;background:#fff;margin-right:4px}
.B .empty-row td{text-align:center;color:#a6a6a6;padding:40px 0}
.B .tabs{display:flex;gap:22px;border-bottom:1px solid var(--ln);margin:0 0 14px}
.B .tabs span{padding:10px 2px;font-size:13px;border-bottom:2px solid transparent}
.B .tabs span.on{color:var(--bl);border-color:var(--bl)}
.B .frm{display:grid;grid-template-columns:150px 1fr;gap:12px 14px;align-items:center;font-size:12.5px}
.B .frm .lb{color:#444}
.B .rad{display:inline-flex;gap:14px}
.B .rad label{display:inline-flex;align-items:center;gap:5px}
.B .gd{font-size:11.5px;color:var(--g);margin-top:4px}
.B .bt{border-collapse:collapse;font-size:12.5px;min-width:440px}
.B .bt th,.B .bt td{border:1px solid #eee;padding:9px 14px;text-align:center}
.B .bt th{background:#fafafa;font-weight:600}
.B .bt td:first-child{text-align:left}
.B .bt tr.new td{background:#fffafc}
.B .bt tr.new td:first-child{color:var(--pk);font-weight:600}
.tg{position:relative;display:inline-block;width:36px;height:20px;border-radius:10px;background:#d9d9d9;vertical-align:middle;cursor:pointer}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.tg.on{background:#3b78f6}.tg.on:after{left:18px}
.tg.lock{opacity:.4;cursor:not-allowed}
.H .tg.on{background:#e8537a}
.B .lockmsg{font-size:11px;color:#d9363e;margin-top:6px}
.B .dov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60}
.B .dwr{position:fixed;top:0;right:0;bottom:0;width:340px;background:#fff;z-index:61;display:flex;flex-direction:column;font-size:12px}
.B .dhd{display:flex;justify-content:space-between;align-items:center;padding:0 18px;height:46px;border-bottom:1px solid #eee;font-size:13px;font-weight:700;flex:none}
.B .dscroll{flex:1;overflow-y:auto;padding:16px 18px}
.B .dstp{display:inline-flex;border:1px solid #e0e0e0;border-radius:12px;font-size:11px;padding:3px 10px;background:#f5f5f5;font-weight:600;margin-bottom:10px}
.B .dti{font-size:18px;font-weight:700;margin:2px 0 12px}
.B .dkv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:#8a8a8a}.B .dkv b{color:#222;text-align:right}
.B .dkv.new b{box-shadow:inset 0 -1px 0 var(--pk)}
.B .dsec{margin:12px 0 6px;font-size:11px;font-weight:700;color:#555}
.B .dtb{border:1px solid #eceef2;background:#f7f8fa;border-radius:8px;padding:9px 12px;min-height:36px}
.B .card2{background:#fff;border:1px solid #eee;border-radius:6px;padding:16px 18px;margin:10px 12px 0;max-width:760px}
.B .card2 h3{font-size:14px;margin-bottom:12px}

/* ================= FO ================= */
.F{flex:1;min-height:0;background:#e9eaee;overflow:auto;display:flex;justify-content:center;padding:18px 0}
.phone{width:390px;min-height:760px;background:#fff;border-radius:22px;box-shadow:0 0 0 1px #d4d4d8;overflow:hidden;display:flex;flex-direction:column;position:relative;font-size:13px;color:#111}
.fh{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #f0f0f0}
.fh .bk{font-size:20px;line-height:1;padding:0 4px}
.fh .lg{font-weight:800;font-size:14px;color:#e8537a}
.fh .tt{font-weight:700;font-size:14px;flex:1;text-align:center;margin-right:28px}
.fb2{flex:1;overflow-y:auto;padding-bottom:90px}
.fhero{height:180px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;font-weight:800;font-size:18px}
.fsec{padding:16px}
.fsec h4{font-size:14px;font-weight:700;margin-bottom:10px}
.fsub{font-size:12px;color:#777;margin-top:2px}
.fprod{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f2f2f2}
.fprod .nm{font-size:13px;font-weight:600}
.fprod .pr{font-size:13px;font-weight:700;margin-top:3px}
.fcta{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;background:#fff;border-top:1px solid #f0f0f0;display:flex;gap:8px}
.fcta button{flex:1;height:46px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.fcta button.pri{background:#e8537a;border-color:#e8537a;color:#fff}
.fcta button:disabled{background:#e5e5e5;border-color:#e5e5e5;color:#aaa;cursor:not-allowed}
.flabel{font-size:13px;font-weight:700;margin:4px 0 8px}
.fbox{border:1px solid #e5e5e5;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}
.fsel{width:100%;height:44px;border:1px solid #d9d9d9;border-radius:10px;padding:0 12px;font-size:13px;background:#fff}
.fdays{display:flex;gap:6px}
.fday{flex:1;min-width:0;height:58px;border:1px solid #e5e5e5;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#666}
.fday b{font-size:15px;color:#111}
.fday.on{border-color:#e8537a;background:#fdeef2}
.ftimes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ftime{height:38px;border:1px solid #e5e5e5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px}
.ftime.on{border-color:#e8537a;background:#fdeef2;font-weight:700}
.ftime.off{color:#ccc;background:#fafafa;cursor:not-allowed;text-decoration:line-through}
.ferr{background:#fff3f3;border:1px solid #ffd0cc;color:#c23b34;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.5;margin:12px 16px 0}
.ferr button{margin-top:10px;height:34px;padding:0 14px;border-radius:8px;border:1px solid #c23b34;background:#fff;color:#c23b34;font-weight:700;cursor:pointer}
.fdone{text-align:center;padding:40px 20px 10px}
.fdone .ck{width:56px;height:56px;border-radius:50%;background:#fdeef2;color:#e8537a;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.fkv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px solid #f4f4f4}
.fkv span{color:#888}
.fcard{border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px}

 var conds=[['예약 설정',DB.store.bookingSetting],['상품 노출',prodVisible(p,lang)],['상품 예약 버튼',prodBookBtn(p,ch)]];
 var bad=conds.filter(function(c){return !c[1];})[0];
 return {ok:!bad,reason:bad?bad[0]:'',conds:conds};
}
function foOptions(lang,ch){return DB.prods.filter(function(p){return judgeBookable(p,lang,ch).ok;});}
