var TODAY='2026-10-12',NOWTS='2026-10-12 12:00';

var LANG_RNO={en:'EN',ja:'JP',zh:'CN'}; /* 실화면 예약번호 언어 코드(STG 261014009CN01) */
/* 예약번호 = 접수일 YYMMDD + 스토어 009 + 언어 코드 + 그날 접수 순번 2자리 */
function rnoFor(recv,lang,list){var d=recv.slice(2,10).replace(/-/g,''),n=list.filter(function(b){return b.recv.slice(0,10)===recv.slice(0,10);}).length+1;return d+'009'+LANG_RNO[lang]+(n<10?'0'+n:n);}
function addDays(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function wdKo(d){return ['일','월','화','수','목','금','토'][new Date(d+'T00:00:00Z').getUTCDay()];}
function won(n){return n.toLocaleString('en-US');}

/* btn = 스토어 예약 버튼(스토어 페이지 [예약]) */

 // [id, lang, name, price, status, active, hidden, deleted, mode, book(예약 줄), sub]
 var A=[

 ];
 return A.map(function(a,i){return {id:a[0],lang:a[1],name:a[2],price:a[3],status:a[4],active:!!a[5],hidden:!!a[6],deleted:!!a[7],mode:a[8],book:!!a[9],cat:'피부과',sub:a[10],reg:'2026-0'+(6+i%3)+'-1'+i+' 16:2'+i,chat:(a[0]%7)+1,cons:(a[0]%5),rev:(a[0]%3),views:120+a[0]%40,inner:30+a[0]%17,direct:8+a[0]%9,bclk:a[9]?(a[0]%6)+2:0};});
}

 var A=[
 ['2026-10-18 15:00','2026-10-10 08:24','Kaitlyn Chan','캐나다','en','WhatsApp','예약','고객','상품',101,89000,'신규','Please use a gentle product for sensitive skin.'],
 ['2026-10-18 14:00','2026-10-09 10:58','Evelyn Lee','캐나다','en','WhatsApp','예약','고객','스토어',null,null,'신규',''],
 ['2026-10-17 11:00','2026-10-11 21:14','Rina Takeda','일본','ja','LINE','예약','고객','스토어',102,null,'신규',''],
 ['2026-10-16 16:00','2026-10-08 09:40','Wang Siyu','중국','zh','WeChat','변경요청','고객','상품',107,null,'변경',''],

 ['2026-10-12 10:00','2026-10-02 12:00','Claire Wald','미국','en','WhatsApp','예약','고객','상품',106,null,'방문결과',''],
 ['2026-10-10 14:00','2026-10-01 18:24','Yuko Hamada','일본','ja','LINE','방문완료','고객','스토어',null,null,'',''],
 ['2026-10-09 12:00','2026-09-28 23:37','Hui Ping Ho','말레이시아','en','WhatsApp','방문완료','고객','상품',103,null,'',''],
 ['2026-10-05 10:00','2026-09-30 15:20','Aigerim Nurlanova','카자흐스탄','en','KakaoTalk','미방문','고객','스토어',null,null,'',''],

 ['2026-09-27 14:00','2026-09-24 02:56','Elina Petrova','러시아','en','WhatsApp','방문완료','매장',null,null,null,'','현장 방문'],
 ['2026-09-20 11:00','2026-09-15 16:20','Chen Yuxuan','중국','zh','WeChat','방문완료','고객','상품',107,null,'',''],
 ['2026-09-12 12:00','2026-09-08 10:11','Chloe Tan','싱가포르','en','WhatsApp','매장취소','고객','상품',108,null,'','']
 ];
 var out=[];A.forEach(function(a,i){out.push(mk(a,i));});out.slice().sort(function(x,y){return x.recv<y.recv?-1:1;}).forEach(function(b,k,arr){b.rno=rnoFor(b.recv,b.lang,arr.slice(0,k));});return out;
 function mk(a,i){
  var p=a[9]?byId[a[9]]:null,snap=p?snapOf(p):null;if(snap&&a[10])snap.price=a[10];
  return {no:i+1,visit:a[0],recv:a[1],name:a[2],nation:a[3],lang:a[4],contact:a[5],status:a[6],owner:a[7],route:a[8],prodId:a[9],snap:snap,need:a[11],req:a[12],birth:a[2]===ME?'1996-04-12':'1995-05-20',phone:(({'중국':'+86 138000001','홍콩':'+852 600001','일본':'+81 9000001','러시아':'+7 9000001','카자흐스탄':'+7 7000001','말레이시아':'+60 120001','싱가포르':'+65 80001'}[a[3]]||'+1 41655501')+(10+i)),rno:null,chg:a[6]==='변경요청'?'2026-10-17 13:00':null,cancelBy:a[6]==='고객취소'?'고객':a[6]==='매장취소'?'매장':null,cancelAt:/취소/.test(a[6])?a[1].slice(0,10)===a[0].slice(0,10)?a[1]+':40':(function(){var t=new Date(a[0].slice(0,10)+'T00:00:00Z');t.setUTCDate(t.getUTCDate()-2);return t.toISOString().slice(0,10)+' 18:51:12';})():null,cancelReason:a[6]==='고객취소'?'고객 직접 취소':a[6]==='매장취소'?'매장 사정':null};
 }
}
function seedCollections(){return [
 {id:1,name:'가을 보톡스 특가',lang:'en',type:'특가',period:'2026-10-01 ~ 2026-10-31',items:[101,103,108]},
 {id:2,name:'秋季护肤推荐',lang:'zh',type:'추천상품',period:'2026-10-01 ~ 2026-11-30',items:[107,109]},

];}
var DB,S;
function freshDB(){var P=seedProducts();DB={store:seedStore(),prods:P,books:seedBookings(P),cols:seedCollections()};}
function freshState(){return {surf:'HOST',mark:true,
 fo:{lang:'en',screen:'store',entry:'store',pid:null,sel:'',date:TODAY,time:'',err:null,lastNo:null,myNo:null,tab:'upcoming'},

 bo:{view:'res',st:'',kind:'',owner:'',q:'',qd:'',open:null,lang:'',editPid:null,col:null,offModal:false,sper:'오늘'}};}

/* ===== 판정 (순수 함수) ===== */
function prodById(id){return DB.prods.filter(function(p){return p.id===+id;})[0]||null;}
function storeBookBtn(){var s=DB.store;return !!(s.bookingSetting&&s.btn);}
/* 상품 예약 버튼(PRD 5.3, 2026-11-04): 기본 설정 상품은 스토어 예약 버튼 값을 그대로 따르고, 개별 설정 상품은 상품 값 */
function prodBookVal(p){return p.mode==='기본'?!!DB.store.btn:!!p.book;}
function prodBookBtn(p){if(!DB.store.bookingSetting)return false;return prodBookVal(p);}
function prodVisible(p,lang){return p.status==='approved'&&p.active&&!p.hidden&&!p.deleted&&p.lang===lang;}
function judgeBookable(p,lang){
 var conds=[['예약 설정',DB.store.bookingSetting],['상품 노출',prodVisible(p,lang)],['상품 예약 버튼',prodBookBtn(p)]];
 var bad=conds.filter(function(c){return !c[1];})[0];
 return {ok:!bad,reason:bad?bad[0]:'',conds:conds};
}
function foOptions(lang){return DB.prods.filter(function(p){return judgeBookable(p,lang).ok;});}
/* 상품 상세 하단 버튼(지금 웹 규칙, PRD 5.3): 최대 2개, 메신저는 왼쪽, 나머지는 예약 > 외부링크 > 상담접수 순.
   기본 설정 상품은 다른 버튼을 스토어 값(STORE_WB: 메신저만 ON)으로, 예약은 스토어 예약 버튼 값으로 본다. 셋째 칸은 BO에서 켤 수 없다(배포 전부터 셋 이상이면 앞의 2개) */
var STORE_WB={'메신저':true};
function prodButtons(p,lang){
 var src=p.mode==='기본'?STORE_WB:(p.wb||{}),out=[];
 if(src['메신저'])out.push('메신저');
 if(judgeBookable(p,lang||p.lang).ok)out.push('예약');
 if(src['외부링크'])out.push('외부링크');
 if(src['상담접수'])out.push('상담접수');
 return out.slice(0,2);
}
function manualOptions(lang){if(!lang)return [];return DB.prods.filter(function(p){return p.status==='approved'&&p.active&&!p.hidden&&!p.deleted&&p.lang===lang;});} /* 수기 예약: 예약자 정보에서 고른 언어의 상품 중 활성이고 히든이 아닌 상품만(비활성·히든·삭제 제외, 2026-11-04). 언어 전에는 없음 */
function bookingKind(b){return b.prodId?'상품 예약':'스토어 예약';}
function prodBookCount(pid,from,to){return DB.books.filter(function(b){var d=b.recv.slice(0,10);return b.prodId===pid&&(!from||d>=from)&&(!to||d<=to);}).length;}
var TIMES=['10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];
function slotTaken(date,time){return DB.books.filter(function(b){return b.visit===date+' '+time&&(b.status==='예약'||b.status==='변경요청');}).length;}
function slotOpen(date,time){return slotTaken(date,time)<DB.store.cap&&(date+' '+time)>NOWTS;}
function needList(t){return DB.books.filter(function(b){return b.need&&(t==='전체'||b.need===t);}).sort(function(a,b){return a.visit<b.visit?1:-1;});}
var ME='Kaitlyn Chan';

/* ===== 동작 ===== */
/* 클리닉 스토어(피부과·성형외과·치과·메디컬체크) 예약 나이: 방문 예정일 기준 만 18세 이상. 예약 요청을 누를 때 판정, 저장하지 않음(PRD 5.13)
   스토어 카테고리가 여럿이면(DB.store.cats) 그중 하나라도 클리닉이면 대상 */
var CLINIC_CATS=['피부과','성형외과','치과','메디컬체크'];
function storeCats(){var s=DB.store;return s.cats&&s.cats.length?s.cats:[s.cat];}
function isClinic(){return storeCats().some(function(c){return CLINIC_CATS.indexOf(c)>=0;});}
function ageOn(birth,day){var b=birth.split('-'),d=day.split('-'),a=(+d[0])-(+b[0]);if(+b[1]>+d[1]||(+b[1]===+d[1]&&+b[2]>+d[2]))a--;return a;}
function under18(birth,day){return isClinic()&&!!birth&&/^\d{4}-\d{2}-\d{2}$/.test(birth)&&ageOn(birth,day)<18;}
function foSubmit(){
 var f=S.fo;f.err=null;
 if(under18(f.birth,f.date)){f.err={kind:'age18'};return;}
 if(!f.time){f.err={kind:'time'};return;}
 if(!slotOpen(f.date,f.time)){f.err={kind:'slot'};f.time='';return;}
 if(!DB.store.bookingSetting){f.err={kind:'closed'};return;} /* 예약 설정이 꺼진 뒤면 상품이 없어도 막음 */
 var pid=f.entry==='product'?f.pid:(f.sel?+f.sel:null);
 if(pid){var j=judgeBookable(prodById(pid),f.lang);if(!j.ok){if(f.entry==='product')f.err={kind:'prodGone'};else{f.err={kind:'pickAgain'};f.sel='';}return;}}
 var p=pid?prodById(pid):null,no=DB.books.length+1;
 DB.books.push({no:no,visit:f.date+' '+f.time,recv:NOWTS,name:ME,nation:'캐나다',lang:f.lang,contact:f.msg||'WhatsApp',mid:f.mid||'4165550199',status:'예약',owner:'고객',route:f.entry==='product'?'상품':'스토어',prodId:pid,snap:p?snapOf(p):null,need:'신규',req:'',birth:f.birth||'',phone:'+1 4165550199',rno:rnoFor(NOWTS,f.lang,DB.books)});
 f.lastNo=no;f.screen='done';f.time='';f.agree=false; /* 다음 예약은 동의 체크 없이 시작(라이브 정보 입력 화면은 처음에 미체크) */
}

 DB.books.push({no:no,visit:m.date+' '+m.time,recv:NOWTS,name:m.name.trim(),nation:'-',lang:m.lang,contact:'-',status:'예약',owner:'매장',route:null,prodId:p?p.id:null,snap:p?snapOf(p):null,need:'',req:(m.f&&m.f.req)||'',birth:m.birth||'',phone:'-',rno:rnoFor(NOWTS,m.lang,DB.books)});
 S.host.man={date:'',time:'',name:'',lang:'',pid:'',birth:'',f:{}};S.host.view='res';S.host.open=no;

function staffChange(no,date,time){

function addPreDeployBooking(){

}
function bookOff(){DB.store.bookingSetting=false;} /* PRD 부록 A 결정 1: 끌 때는 값을 지우지 않고 잠그기만(저장된 값을 흐리게) */
/* 결정 1(2026-10-30): 예약 설정을 다시 켜면 스토어 예약 버튼·상품 예약 버튼 둘 다 꺼진 상태로 시작(꺼지기 전 값으로 돌아오지 않음) */
function bookReset(){DB.store.btn=false;DB.prods.forEach(function(p){p.book=false;});}
function bookOn(){if(!DB.store.bookingSetting){DB.store.bookingSetting=true;bookReset();}}

/* ===== 렌더 ===== */
function swHTML(){
 var s=S.surf,f=S.fo;
 return '<b>상품 예약 선행 배포 시안</b>'+['FO','HOST','BO'].map(function(x){return '<button class="s'+(s===x?' on':'')+'" data-surf="'+x+'">'+{FO:'고객 화면',HOST:'입점사 (HOST)',BO:'운영사 (BO)'}[x]+'</button>';}).join('')
  +'<span class="sp"></span>'
  +(s==='FO'?'<span>언어</span><select data-sw="lang">'+[['en','English'],['ja','日本語'],['zh','简体中文']].map(function(o){return '<option value="'+o[0]+'"'+(f.lang===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>':'')
  +(s==='FO'?'<span>예약 URL로 열기</span><select data-url="1"><option value="">고르기</option><option value="store">스토어 예약 URL</option>'+DB.prods.slice().sort(function(a,b){return (a.lang===f.lang?0:1)-(b.lang===f.lang?0:1);}).map(function(p){return '<option value="p'+p.id+'">상품 예약 URL · '+p.name.replace(/</g,'&lt;')+(p.lang!==f.lang?' ('+LANGS[p.lang]+' 상품)':'')+(p.deleted?' (삭제됨)':'')+'</option>';}).join('')+'</select>':'')
  +'<label><input type="checkbox" data-sw="mark"'+(S.mark?' checked':'')+'>이번에 추가한 요소 표시</label>'
  +'<span style="color:#888">기준 시각 '+NOWTS+'</span>';
}
function frameOf(s){return document.getElementById('f-'+s);}
function render(){
 document.getElementById('sw').innerHTML=swHTML();
 ['FO','HOST','BO'].forEach(function(s){frameOf(s).classList.toggle('on',S.surf===s);});document.getElementById('frames').classList.toggle('fo',S.surf==='FO');
 var w=frameOf(S.surf).contentWindow;
 if(w&&typeof w.draw==='function')w.draw();
}
/* 자식 프레임이 쓰는 창구 */
window.PB={
 get DB(){return DB;},get S(){return S;},TODAY:TODAY,NOWTS:NOWTS,LANGS:LANGS,TIMES:TIMES,ME:ME,STORE_WB:STORE_WB,
 /* 기존 문의 표본(BO 스토어 문의 통계 · HOST 대시보드 공용): [문의구분, 언어, 채널, 접수일, 접수 시각] */
 SINQ_BASE:[['스토어','en','메신저상담','2026-10-03','11:40'],['상품','en','메신저상담','2026-10-05','15:12'],['상품','ja','메신저상담','2026-10-06','10:05'],['스토어','zh','채팅문의','2026-10-08','13:31'],['상품','en','상담문의','2026-10-09','16:48'],['상품','en','메신저상담','2026-10-11','09:27'],['스토어','ja','메신저상담','2026-10-12','10:16']],
 addDays:addDays,wdKo:wdKo,won:won,prodById:prodById,prodVisible:prodVisible,prodBookBtn:prodBookBtn,prodBookVal:prodBookVal,storeBookBtn:storeBookBtn,judgeBookable:judgeBookable,prodButtons:prodButtons,
 foOptions:foOptions,manualOptions:manualOptions,bookingKind:bookingKind,prodBookCount:prodBookCount,slotOpen:slotOpen,needList:needList,
 foSubmit:foSubmit,foChange:foChange,staffChange:staffChange,isClinic:isClinic,manSave:manSave,bookOff:bookOff,bookOn:bookOn,render:render,
 go:function(surf,view){window.go(surf,view);},
 ready:function(surf){if(S&&S.surf===surf)render();}
};
/* ===== 검수 콘솔용 전역 ===== */
window.render=render;
window.resetDB=function(){freshDB();S=freshState();render();};
window.go=function(surf,view){S.surf=surf;if(surf==='HOST'&&view){S.host.view=view;S.host.open=null;}if(surf==='BO'&&view){S.bo.view=view;S.bo.open=null;}if(surf==='FO'&&view)S.fo.screen=view;render();};
window.foOpenStore=function(lang){S.surf='FO';if(lang)S.fo.lang=lang;S.fo.screen='store';S.fo.err=null;render();};
window.foOpenProduct=function(id,lang){S.surf='FO';if(lang)S.fo.lang=lang;S.fo.pid=id;S.fo.screen='product';S.fo.err=null;render();};
/* 예약하기 URL 진입(PRD 5.2): 스토어 예약 URL = 스토어 진입(유입경로 스토어), 상품 예약 URL = 상품 고정(유입경로 상품). 스토어 페이지 · 상품 상세를 거치지 않고 예약 화면이 바로 열림 */
window.foOpenUrl=function(kind,pid,lang){S.surf='FO';if(lang)S.fo.lang=lang;var f=S.fo;f.err=null;f.accTop={};f.sel='';f.time='';f.date=TODAY;f.cat='All';f.showN=5;f.acc={};f.back=null;f.entry=kind==='product'?'product':'store';if(kind==='product')f.pid=+pid;f.viaUrl=true;f.screen='book';render();};
/* 예약 중 화면 언어 바꾸기(PRD 5.2): 고른 상품을 풀고 I'll decide at the store 로. 상품 고정 진입이면 예약 화면에서 예약할 수 없는 상품 안내 */
function foLangSet(v){var f=S.fo;if(f.lang===v)return;f.lang=v;f.err=null;f.sel='';f.cat='All';f.showN=5;if(f.mode!=='change'&&f.entry==='product'&&f.screen==='info')f.screen='book';}
window.foLang=function(v){foLangSet(v);render();};
window.addPreDeployBooking=addPreDeployBooking;
window.setProd=function(id,patch){var p=prodById(id);Object.keys(patch).forEach(function(k){if(k==='wb')p.wb=Object.assign({},p.wb||{},patch.wb);else p[k]=patch[k];});render();};
/* 상품이 많은 매장 보기용: 예약 가능한 영어 상품 n개 추가 (id 201~) */
window.addDemoProducts=function(n){var subs=['보톡스','스킨부스터','리프팅','여드름/흉터','색소/점/문신'],names=['Glow Facial','Aqua Peel','Jawline Botox','Rejuran Healer','Ultherapy 300','Thermage FLX','Pico Toning','Acne Scar Laser','Chin Filler','Neck Lift','Exosome Care','LDM Hydration'];for(var i=0;i<n;i++){var id=201+i;DB.prods.push({id:id,lang:'en',name:'Abijou '+names[i%names.length],price:50000+i*10000,status:'approved',active:true,hidden:false,deleted:false,mode:'기본',book:true,cat:'피부과',sub:subs[i%subs.length],reg:'2026-09-0'+(1+i%9)+' 10:00',chat:1,cons:0,rev:0,views:100,inner:20,direct:5,bclk:0});}render();};
/* 예약 설정을 꺼진 상태에서 켜면 스토어 예약 버튼·상품 예약 버튼을 모두 끈 채로 시작(btn을 함께 넘기면 그 값으로) */
window.setStore=function(patch){var was=DB.store.bookingSetting;Object.keys(patch).forEach(function(k){DB.store[k]=patch[k];});if('bookingSetting' in patch&&patch.bookingSetting&&!was&&!('btn' in patch))bookReset();render();};
window.openHostBooking=function(no){S.surf='HOST';S.host.view='res';S.host.open=no;render();};
window.openBoBooking=function(no){S.surf='BO';S.bo.view='res';S.bo.open=no;render();};
Object.defineProperty(window,'VIEW',{get:function(){return S.surf+':'+(S.surf==='HOST'?S.host.view:S.surf==='BO'?S.bo.view:S.fo.screen);}});
Object.defineProperty(window,'STATE',{get:function(){return S;}});
Object.defineProperty(window,'DBX',{get:function(){return DB;}});
window.frameDoc=function(s){return frameOf(s||S.surf).contentDocument;};

document.addEventListener('click',function(e){var t=e.target.closest('[data-surf]');if(t){S.surf=t.getAttribute('data-surf');render();}});
document.addEventListener('change',function(e){var t=e.target;if(t.hasAttribute('data-url')){var v=t.value;if(v==='store')window.foOpenUrl('store');else if(v)window.foOpenUrl('product',+v.slice(1));return;}if(!t.hasAttribute('data-sw'))return;var k=t.getAttribute('data-sw');
 if(k==='mark'){S.mark=t.checked;}else{foLangSet(t.value);}render();});
freshDB();S=freshState();render();
</script>
</body>
</html>
