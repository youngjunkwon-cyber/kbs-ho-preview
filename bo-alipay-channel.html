<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알리페이 채널 분기 · 어드민 화면 (동작 시안)</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:#262626;background:#f0f2f5}
a{color:inherit}
.app{display:flex;min-height:100vh}

/* 사이드바 */
.side{width:200px;background:#fff;border-right:1px solid #f0f0f0;flex:0 0 200px}
.logo{height:56px;display:flex;align-items:center;padding:0 20px;font-weight:700;font-size:18px;color:#e8537a;letter-spacing:.5px;border-bottom:1px solid #f0f0f0}
.navgrp{padding:12px 0 4px 20px;font-size:12px;color:#8c8c8c}
.nav{display:block;padding:9px 20px;cursor:pointer;border-left:3px solid transparent;color:#262626}
.nav:hover{background:#fff5f8}
.nav.on{background:#fff0f4;border-left-color:#e8537a;color:#e8537a;font-weight:500}

/* 본문 */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.top .who{color:#8c8c8c;font-size:13px}
.body{padding:20px 24px 60px;display:flex;gap:20px;align-items:flex-start}
.col-main{flex:1;min-width:0}
.col-rail{width:340px;flex:0 0 340px}

h2.page{margin:0 0 4px;font-size:20px;font-weight:700}
.crumb{color:#8c8c8c;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px}
.card>.hd{padding:14px 20px;border-bottom:1px solid #f0f0f0;font-weight:700}
.card>.bd{padding:20px}
.sub{font-size:13px;color:#8c8c8c;font-weight:400;margin-left:8px}

/* 폼 */
.row{display:flex;gap:16px;padding:10px 0;align-items:flex-start}
.row>.lbl{width:170px;flex:0 0 170px;padding-top:3px;color:#262626}
.row>.lbl .req{color:#ff4d4f;margin-right:3px}
.row>.val{flex:1;min-width:0}
.hint{font-size:12px;color:#8c8c8c;margin-top:6px;line-height:1.6}

/* 라디오·체크 */
.rg{display:inline-flex;gap:18px;align-items:center}
label.rd{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
label.rd input{accent-color:#1677ff;width:14px;height:14px;margin:0}
label.rd.dis{cursor:not-allowed;color:#bfbfbf}
.tag{display:inline-block;padding:1px 8px;border-radius:2px;font-size:12px;line-height:20px}
.tag.on{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
.tag.off{background:#fff1f0;border:1px solid #ffa39e;color:#cf1322}
.tag.na{background:#fafafa;border:1px solid #d9d9d9;color:#8c8c8c}
.tag.rsn{background:#fafafa;border:1px solid #d9d9d9;color:#595959}

/* 표 */
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;border-bottom:1px solid #f0f0f0;text-align:left;vertical-align:middle}
th{background:#fafafa;font-weight:500;color:#262626;font-size:13px;white-space:nowrap}
tbody tr:hover{background:#fafafa}
td.c,th.c{text-align:center}
.tblnote{font-size:12px;color:#8c8c8c}
.colgrp{width:150px}

/* 안내 박스 */
.notice{background:#fff7e6;border:1px solid #ffe7b8;color:#d46b08;padding:10px 14px;border-radius:2px;font-size:13px;line-height:1.7;margin:12px 0}
.notice.grey{background:#fafafa;border-color:#f0f0f0;color:#595959}
.notice.blue{background:#e6f4ff;border-color:#91caff;color:#0958d9}

/* 버튼 */
button{font-family:inherit;font-size:14px}
.btn{padding:5px 16px;border:1px solid #d9d9d9;background:#fff;border-radius:2px;cursor:pointer}
.btn:hover{border-color:#e8537a;color:#e8537a}
.btn.pri{background:#e8537a;border-color:#e8537a;color:#fff}
.btn.pri:hover{opacity:.88;color:#fff}
.btn.sm{padding:2px 10px;font-size:13px}
.btn:disabled{background:#f5f5f5;border-color:#d9d9d9;color:#bfbfbf;cursor:not-allowed}

/* 필터 */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:16px 20px;background:#fff;border-bottom:1px solid #f0f0f0}
.f{display:flex;flex-direction:column;gap:4px}
.f>span{font-size:12px;color:#8c8c8c}
select,input[type=text]{height:30px;padding:0 8px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;font-family:inherit;font-size:13px;color:#262626}
select:disabled,input:disabled{background:#f5f5f5;color:#bfbfbf}

/* 오른쪽 판정 패널 */
.rail{background:#fff;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:16px}
.rail>.hd{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-weight:700;font-size:14px}
.rail>.bd{padding:14px 16px}
.cond{display:flex;gap:8px;padding:7px 0;font-size:13px;line-height:1.6;border-bottom:1px dashed #f0f0f0}
.cond:last-child{border-bottom:0}
.cond .mk{width:18px;flex:0 0 18px;font-weight:700}
.cond.ok .mk{color:#389e0d}
.cond.no .mk{color:#cf1322}
.cond.sk .mk{color:#bfbfbf}
.cond.sk{color:#8c8c8c}
.result{padding:12px 16px;border-radius:2px;font-weight:700;margin-bottom:12px}
.result.y{background:#f6ffed;border:1px solid #b7eb8f;color:#389e0d}
.result.n{background:#fff1f0;border:1px solid #ffa39e;color:#cf1322}
.result.q{background:#fafafa;border:1px solid #d9d9d9;color:#595959}
.result small{display:block;font-weight:400;color:#595959;margin-top:4px}

/* 엣지 시나리오 */
.scn{display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid #f0f0f0;background:#fff;border-radius:2px;margin-bottom:6px;cursor:pointer;line-height:1.5}
.scn:hover{border-color:#e8537a;background:#fff8fa}
.scn b{display:block;font-size:13px}
.scn span{font-size:12px;color:#8c8c8c}

/* 모달 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:80px 20px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:2px;width:100%;max-width:560px}
.modal.wide{max-width:900px}
.modal>.hd{padding:16px 24px;border-bottom:1px solid #f0f0f0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal>.bd{padding:24px}
.modal>.ft{padding:12px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
.x{cursor:pointer;color:#8c8c8c;font-size:18px;line-height:1;border:0;background:none}
.mono{font-family:Consolas,monospace;font-size:12px;color:#8c8c8c}
.hidden{display:none!important}
.lock{color:#bfbfbf}
.badge{display:inline-block;background:#f0f0f0;color:#595959;border-radius:2px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="logo">ADMIN</div>
    <div class="navgrp">상품 관리</div>
    <div class="nav" data-go="p-list">상품 목록</div>
    <div class="navgrp">스토어 관리</div>
    <div class="nav" data-go="s-list">스토어 목록</div>
    <div class="navgrp">배너 관리</div>
    <div class="nav" data-go="b-list">배너 목록</div>
    <div class="navgrp">기획전 관리</div>
    <div class="nav" data-go="e-list">기획전 목록</div>
    <div class="navgrp">호스트</div>
    <div class="nav" data-go="h-list">호스트 상품 목록</div>
  </nav>

  <div class="main">
    <div class="top">
      <div id="topttl">상품 목록</div>
      <div class="who">marketing@glofix.co.kr</div>
    </div>
    <div class="body">
      <div class="col-main" id="screen"></div>
      <div class="col-rail" id="rail"></div>
    </div>
  </div>
</div>
<div id="modals"></div>

<script>
/* =========================================================================
   알리페이 채널 분기 · 판정 엔진
   PRD v0.12 6장(노출 조건) / 7장(버튼 구성) / 8장(목록·사유) / 9장(FO 반영)
   ========================================================================= */

const ALI_LANGS = ['중국어(간체)', '중국어(번체)', '영어'];
const ALL_LANGS = [...ALI_LANGS, '일본어', '인도네시아어', '몽골어'];

// 버튼 행. 상품에는 예약 행이 없다(PRD 7장).
const ROWS_PRODUCT = [
  { k: 'consult',   label: '상담접수' },
  { k: 'inquiry',   label: '문의하기(상담+채팅) 통합', needConsult: true },
  { k: 'chat',      label: '채팅' },
  { k: 'extlink',   label: '외부링크 설정', aliHardOff: true },
  { k: 'messenger', label: '메신저 설정',   aliHardOff: true }
];
const ROWS_STORE = [...ROWS_PRODUCT, { k: 'booking', label: '예약' }];
const CAP = 2; // 채널별 ON 개수 상한 (PRD 11장)

const MSG = {
  noAliBtn:   '알리페이 버튼이 없어 이 콘텐츠는 알리페이에 노출되지 않습니다.',
  hardOff:    '알리페이 안에서는 열리지 않아 켤 수 없습니다.',
  needConsult:'상담접수가 ON일 때만 켤 수 있습니다.',
  cap:        '웹과 알리페이 각각 최대 2개까지 켤 수 있습니다.',
  langOnly:   '알리페이는 중국어(간체), 중국어(번체), 영어 건에만 적용됩니다.',
  exhEmpty:   '알리페이에 노출할 항목이 없어 이 기획전은 알리페이에 노출되지 않습니다.',
  storeHide:  n => `소속 상품 ${n}건이 알리페이에서 함께 숨겨집니다.`,
  saveProd:   '알리페이 버튼이 모두 꺼져 이 콘텐츠가 알리페이에서 숨겨집니다. 저장할까요?',
  saveStore:  '알리페이 버튼이 모두 꺼져 스토어 페이지가 알리페이에서 숨겨집니다. 저장할까요?',
  extBanner:  '링크종류가 외부링크라 알리페이에서 열 수 없습니다. 알리페이 열을 켤 수 없습니다.',
  defaultLock:'스토어 설정 적용이 기본 설정이라 스토어 값을 그대로 보여주고 편집은 잠깁니다.',
  chatAuto:   '스토어의 알리페이 열이 비어 있어 채팅이 자동으로 켜집니다.'
};

/* ----------------------------- 데이터 ----------------------------- */
const btn = (o = {}) => Object.assign({ web: false, ali: false }, o);

const DB = {
  stores: [
    { id: 'S1', name: '준오헤어 명동점', biz: '헤어', aliVisible: '노출', prodCount: 12,
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn(),
              extlink: btn(), messenger: btn(), booking: btn({ web: true, ali: true }) } },
    { id: 'S2', name: '리엔장 피부과', biz: '피부과', aliVisible: '노출', prodCount: 6,
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true, ali: true }),
              extlink: btn(), messenger: btn(), booking: btn() } },
    { id: 'S3', name: '뷰티랩 강남', biz: '스킨케어', aliVisible: '노출', prodCount: 3,
      btns: { consult: btn(), inquiry: btn(), chat: btn({ web: true }),
              extlink: btn(), messenger: btn(), booking: btn({ web: true, ali: true }) } },
    { id: 'S4', name: '모모클리닉', biz: '성형외과', aliVisible: '미노출', prodCount: 7,
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true, ali: true }),
              extlink: btn(), messenger: btn(), booking: btn() } },
    { id: 'S5', name: '글로우스킨 홍대', biz: '스킨케어', aliVisible: '노출', prodCount: 2,
      btns: { consult: btn({ web: true }), inquiry: btn(), chat: btn(),
              extlink: btn({ web: true }), messenger: btn(), booking: btn() } }
  ],
  products: [
    { id: 'P1', name: '두피 스케일링 케어', lang: '중국어(간체)', store: 'S1', aliVisible: '노출', mode: '기본 설정',
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true }), extlink: btn({ web: true }), messenger: btn({ web: true }) } },
    { id: 'P2', name: '레이저 토닝 1회', lang: '중국어(간체)', store: 'S2', aliVisible: '노출', mode: '개별 설정',
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true, ali: true }), extlink: btn(), messenger: btn() } },
    { id: 'P3', name: '아쿠아 필링', lang: '영어', store: 'S3', aliVisible: '노출', mode: '기본 설정',
      btns: { consult: btn(), inquiry: btn(), chat: btn({ web: true }), extlink: btn(), messenger: btn() } },
    { id: 'P4', name: '눈매교정 상담', lang: '중국어(번체)', store: 'S4', aliVisible: '노출', mode: '개별 설정',
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn(), extlink: btn(), messenger: btn({ web: true }) } },
    { id: 'P5', name: '헤어 클리닉 4주', lang: '중국어(간체)', store: 'S1', aliVisible: '미노출', mode: '개별 설정',
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true, ali: true }), extlink: btn(), messenger: btn() } },
    { id: 'P6', name: 'ヘアクリニック 4週', lang: '일본어', store: 'S1', aliVisible: '노출', mode: '개별 설정',
      btns: { consult: btn({ web: true }), inquiry: btn(), chat: btn({ web: true }), extlink: btn(), messenger: btn() } },
    { id: 'P7', name: 'Perawatan Kulit', lang: '인도네시아어', store: 'S3', aliVisible: '노출', mode: '기본 설정',
      btns: { consult: btn(), inquiry: btn(), chat: btn({ web: true }), extlink: btn(), messenger: btn() } },
    { id: 'P8', name: '모공 타이트닝', lang: '중국어(간체)', store: 'S3', aliVisible: '노출', mode: '개별 설정',
      btns: { consult: btn({ web: true }), inquiry: btn(), chat: btn({ web: true }), extlink: btn(), messenger: btn() } },
    { id: 'P9', name: '수분 앰플 관리', lang: '중국어(간체)', store: 'S5', aliVisible: '노출', mode: '개별 설정',
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn(), extlink: btn(), messenger: btn({ web: true }) } },
    { id: 'P10', name: '속눈썹 연장', lang: '중국어(간체)', store: 'S2', aliVisible: '노출', mode: '개별 설정', legacy: true,
      btns: { consult: btn({ web: true, ali: true }), inquiry: btn(), chat: btn({ web: true, ali: true }), extlink: btn(), messenger: btn({ web: true }) } }
  ],
  banners: [
    { id: 'B1', title: '가을 헤어 프로모션', biz: '준오헤어', pos: '홈 상단', lang: '중국어(간체)',
      linkType: '내부링크', target: { type: '상품', id: 'P1' }, aliVisible: '노출', btns: [] },
    { id: 'B2', title: '피부과 이벤트', biz: '리엔장', pos: '홈 중단', lang: '중국어(간체)',
      linkType: '외부링크', targetUrl: 'https://blog.naver.com/...', aliVisible: '노출', btns: [] },
    { id: 'B3', title: '스킨케어 기획전 안내', biz: '뷰티랩', pos: '홈 하단', lang: '영어',
      linkType: '내부이미지랜딩페이지', aliVisible: '노출',
      btns: [ { label: '지금 예약하기', kind: '내부', target: { type: '상품', id: 'P3' }, web: true, ali: true },
              { label: '카카오 채널', kind: '외부', url: 'http://pf.kakao.com/...', web: true, ali: false } ] },
    { id: 'B4', title: '성형 상담 배너', biz: '모모클리닉', pos: '홈 중단', lang: '중국어(간체)',
      linkType: '내부이미지랜딩페이지', aliVisible: '노출',
      btns: [ { label: '상담 신청', kind: '외부', url: 'https://form.gle/...', web: true, ali: false } ] },
    { id: 'B5', title: '헤어 클리닉 단독', biz: '준오헤어', pos: '홈 상단', lang: '중국어(간체)',
      linkType: '내부링크', target: { type: '상품', id: 'P5' }, aliVisible: '노출', btns: [] }
  ],
  exhibitions: [
    { id: 'E1', name: '가을 K-뷰티 위크', lang: '중국어(간체)', period: '2026-09-01 ~ 09-30', aliVisible: '노출',
      items: [ { type: '상품', id: 'P1' }, { type: '상품', id: 'P5' }, { type: '스토어', id: 'S1' } ] },
    { id: 'E2', name: '성형 특별전', lang: '중국어(간체)', period: '2026-09-10 ~ 10-10', aliVisible: '노출',
      items: [ { type: '상품', id: 'P4' }, { type: '스토어', id: 'S4' } ] },
    { id: 'E3', name: '영어권 스킨케어전', lang: '영어', period: '2026-09-05 ~ 09-25', aliVisible: '미노출',
      items: [ { type: '상품', id: 'P3' } ] }
  ],
  errors: {} // 판정 오류를 만들 대상 id 집합
};

const S = id => DB.stores.find(x => x.id === id);
const P = id => DB.products.find(x => x.id === id);

/* ------------------------- 유효 버튼 계산 ------------------------- */
// 상품의 실제 알리페이/웹 열 값. 기본 설정이면 스토어 값을 따르고 예약 행은 무시한다.
function effBtns(p) {
  const st = S(p.store);
  const out = {}; let chatAuto = false;
  if (p.mode === '기본 설정') {
    ROWS_PRODUCT.forEach(r => { out[r.k] = { web: !!st.btns[r.k].web, ali: !!st.btns[r.k].ali, locked: true }; });
    if (!ROWS_PRODUCT.some(r => out[r.k].ali)) { out.chat.ali = true; chatAuto = true; }
  } else {
    ROWS_PRODUCT.forEach(r => { out[r.k] = { web: !!p.btns[r.k].web, ali: !!p.btns[r.k].ali, locked: false }; });
  }
  // 하드 규칙: 외부링크·메신저는 알리페이에서 열리지 않는다
  ROWS_PRODUCT.filter(r => r.aliHardOff).forEach(r => { out[r.k].ali = false; });
  // 문의하기 통합은 상담접수 ON일 때만
  if (!out.consult.ali) out.inquiry.ali = false;
  if (!out.consult.web) out.inquiry.web = false;
  return { btns: out, chatAuto };
}
function effStoreBtns(st) {
  const out = {};
  ROWS_STORE.forEach(r => { out[r.k] = { web: !!st.btns[r.k].web, ali: !!st.btns[r.k].ali, locked: false }; });
  ROWS_STORE.filter(r => r.aliHardOff).forEach(r => { out[r.k].ali = false; });
  if (!out.consult.ali) out.inquiry.ali = false;
  if (!out.consult.web) out.inquiry.web = false;
  return { btns: out };
}
const aliOnCount = (btns, rows) => rows.filter(r => btns[r.k] && btns[r.k].ali).length;

/* ---------------------------- 판정 ---------------------------- */
// 사유 우선순위(PRD 8장): 직접 끔 > 스토어 설정 > 외부 연결 > 알리페이 버튼 없음
//                        > 연결 대상 미노출 > 노출 가능 항목 없음 > 판정 오류
function judgeProduct(p) {
  const st = S(p.store);
  const conds = [];
  if (!ALI_LANGS.includes(p.lang)) return { na: true, visible: false, reason: '', conds: [{ s: 'sk', t: `언어 = ${p.lang}. 알리페이 채널 대상 언어가 아니라 판정하지 않는다.` }] };
  const e = effBtns(p);
  const c1 = p.aliVisible === '노출';
  const c3 = st.aliVisible === '노출';
  const c2 = ROWS_PRODUCT.some(r => e.btns[r.k].ali);
  conds.push({ s: c1 ? 'ok' : 'no', t: `① 알리페이 노출 설정 = ${p.aliVisible}` });
  conds.push({ s: c3 ? 'ok' : 'no', t: `③ 소속 스토어(${st.name}) 알리페이 노출 설정 = ${st.aliVisible}` });
  conds.push({ s: c2 ? 'ok' : 'no', t: `② 알리페이에서 열 수 있는 버튼 ${aliOnCount(e.btns, ROWS_PRODUCT)}개` + (e.chatAuto ? ' (기본 설정 · 채팅 자동 ON)' : '') });
  let reason = '';
  if (!c1) reason = '직접 끔';
  else if (!c3) reason = '스토어 설정';
  else if (!c2) reason = '알리페이 버튼 없음';
  else if (DB.errors[p.id]) reason = '판정 오류';
  if (DB.errors[p.id]) conds.push({ s: 'no', t: '대상 조회 오류로 판정 실패. 미노출로 두고 재판정 큐가 처리한다.' });
  return { na: false, visible: !reason, reason, conds };
}
function judgeStore(st) {
  const e = effStoreBtns(st);
  const c1 = st.aliVisible === '노출';
  const c2 = ROWS_STORE.some(r => e.btns[r.k].ali);
  const conds = [
    { s: c1 ? 'ok' : 'no', t: `① 알리페이 노출 설정 = ${st.aliVisible}` },
    { s: c2 ? 'ok' : 'no', t: `② 알리페이에서 열 수 있는 버튼 ${aliOnCount(e.btns, ROWS_STORE)}개` }
  ];
  let reason = '';
  if (!c1) reason = '직접 끔';
  else if (!c2) reason = '알리페이 버튼 없음';
  else if (DB.errors[st.id]) reason = '판정 오류';
  if (!c2 && c1) conds.push({ s: 'sk', t: '스토어 페이지만 숨는다. 소속 상품은 각자 판정대로 노출된다.' });
  if (DB.errors[st.id]) conds.push({ s: 'no', t: '대상 조회 오류로 판정 실패. 재판정 큐가 처리한다.' });
  return { na: false, visible: !reason, reason, conds };
}
function targetVisible(t) {
  if (!t) return { ok: false, label: '대상 없음' };
  if (t.type === '상품') { const p = P(t.id); const j = judgeProduct(p); return { ok: !j.na && j.visible, label: `상품 · ${p.name}`, j }; }
  const st = S(t.id); const j = judgeStore(st); return { ok: j.visible, label: `스토어 · ${st.name}`, j };
}
function judgeBanner(b) {
  const conds = [];
  if (!ALI_LANGS.includes(b.lang)) return { na: true, visible: false, reason: '', conds: [{ s: 'sk', t: `언어 = ${b.lang}. 대상 언어가 아니라 판정하지 않는다.` }] };
  const c1 = b.aliVisible === '노출';
  conds.push({ s: c1 ? 'ok' : 'no', t: `① 알리페이 노출 설정 = ${b.aliVisible}` });
  conds.push({ s: 'sk', t: `링크종류 = ${b.linkType}` });
  let ext = b.linkType === '외부링크';
  let noBtn = false, targetOut = null;
  if (b.linkType === '내부링크') {
    const tv = targetVisible(b.target);
    conds.push({ s: tv.ok ? 'ok' : 'no', t: `② 연결 대상(${tv.label})이 알리페이에 ${tv.ok ? '노출' : '미노출'}` });
    if (!tv.ok) targetOut = tv.label;
  } else if (b.linkType === '내부이미지랜딩페이지') {
    const aliBtns = b.btns.filter(x => x.kind === '내부' && x.ali);
    noBtn = aliBtns.length === 0;
    conds.push({ s: noBtn ? 'no' : 'ok', t: `② 하단 버튼 중 알리페이 열 ON = ${aliBtns.length}개` + (b.btns.some(x => x.kind === '외부') ? ' (외부 버튼은 알리페이 열을 켤 수 없다)' : '') });
    if (!noBtn) { const bad = aliBtns.map(x => targetVisible(x.target)).find(tv => !tv.ok); if (bad) { targetOut = bad.label; conds.push({ s: 'no', t: `버튼 연결 대상(${bad.label})이 알리페이에 미노출` }); } else conds.push({ s: 'ok', t: '버튼 연결 대상이 모두 알리페이에 노출' }); }
  } else {
    conds.push({ s: 'no', t: '② 외부링크는 알리페이 안에서 열 수 없다' });
  }
  let reason = '';
  if (!c1) reason = '직접 끔';
  else if (ext) reason = '외부 연결';
  else if (noBtn) reason = '알리페이 버튼 없음';
  else if (targetOut) reason = '연결 대상 미노출';
  else if (DB.errors[b.id]) reason = '판정 오류';
  return { na: false, visible: !reason, reason, conds };
}
function judgeExhibition(x) {
  const conds = [];
  if (!ALI_LANGS.includes(x.lang)) return { na: true, visible: false, reason: '', conds: [{ s: 'sk', t: `언어 = ${x.lang}. 대상 언어가 아니라 판정하지 않는다.` }] };
  const c1 = x.aliVisible === '노출';
  const live = x.items.filter(t => targetVisible(t).ok);
  conds.push({ s: c1 ? 'ok' : 'no', t: `① 알리페이 노출 설정 = ${x.aliVisible}` });
  conds.push({ s: live.length ? 'ok' : 'no', t: `④ 안에 알리페이 노출 가능 항목 ${live.length}건 / 전체 ${x.items.length}건` });
  x.items.forEach(t => { const tv = targetVisible(t); conds.push({ s: tv.ok ? 'ok' : 'no', t: `${tv.label} → ${tv.ok ? '노출' : '미노출' + (tv.j && tv.j.reason ? ' (' + tv.j.reason + ')' : tv.j && tv.j.na ? ' (대상 언어 아님)' : '')}` }); });
  let reason = '';
  if (!c1) reason = '직접 끔';
  else if (!live.length) reason = '노출 가능 항목 없음';
  else if (DB.errors[x.id]) reason = '판정 오류';
  return { na: false, visible: !reason, reason, conds, liveCount: live.length };
}

const el = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TITLES = { 'p-list': '상품 목록', 'p-edit': '상품 정보 수정', 's-list': '스토어 목록', 's-edit': '스토어 정보 수정',
  'b-list': '배너 목록', 'b-edit': '배너 등록·수정', 'e-list': '기획전 목록', 'e-edit': '기획전 등록·수정', 'h-list': '호스트 상품 목록' };

function go(name, id) { VIEW.name = name; if (id !== undefined) VIEW.id = id; VIEW.tab = 0; render(); window.scrollTo(0, 0); }

function visCell(j) {
  if (j.na) return '<span class="tag na">-</span>';
  return j.visible ? '<span class="tag on">노출</span>' : '<span class="tag off">미노출</span>';
}
function rsnCell(j) { return j.na ? '<span class="tblnote">-</span>' : (j.reason ? `<span class="tag rsn">${j.reason}</span>` : '') ; }

/* ---------- 라디오 / 토글 렌더 ---------- */
function radio(nameAttr, val, cur, onChange, dis) {
  return `<label class="rd ${dis ? 'dis' : ''}"><input type="radio" name="${nameAttr}" ${val === cur ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="${onChange}"><span>${val}</span></label>`;
}
// handler 는 %V% 자리에 true/false 가 들어가는 호출식 문자열이다.
function onoff(nameAttr, on, handler, dis) {
  const call = v => handler.split('%V%').join(v);
  return `<span class="rg">
    <label class="rd ${dis ? 'dis' : ''}"><input type="radio" name="${nameAttr}" ${on ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="${call('true')}"><span>ON</span></label>
    <label class="rd ${dis ? 'dis' : ''}"><input type="radio" name="${nameAttr}" ${!on ? 'checked' : ''} ${dis ? 'disabled' : ''} onchange="${call('false')}"><span>OFF</span></label>
  </span>`;
}

/* ---------- 버튼 설정 표 (BO-CH-10 공통 구조) ---------- */
function btnTable(kind, obj) {
  const isStore = kind === 'store';
  const rows = isStore ? ROWS_STORE : ROWS_PRODUCT;
  const eff = isStore ? effStoreBtns(obj) : effBtns(obj);
  const aliLangOk = ALI_LANGS.includes(obj.lang || '중국어(간체)');
  const hidden = !isStore && obj.aliVisible === '미노출';   // BO-CH-01-e1
  const storeHidden = !isStore && S(obj.store).aliVisible === '미노출';
  const locked = !isStore && obj.mode === '기본 설정';       // BO-CH-01-e2
  const aliDisabledAll = !aliLangOk || hidden || storeHidden || locked;

  let html = `<table><thead><tr><th style="width:300px">버튼</th><th style="width:170px">웹</th><th style="width:170px">알리페이</th><th>안내</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const e = eff.btns[r.k];
    const webDis = locked;
    let aliDis = aliDisabledAll || r.aliHardOff;
    let note = '';
    if (r.aliHardOff) note = MSG.hardOff;
    else if (r.needConsult && !eff.btns.consult.ali) { aliDis = true; note = MSG.needConsult; }
    if (!aliLangOk) note = note || MSG.langOnly;
    if (r.k === 'chat' && !isStore && eff.chatAuto) note = MSG.chatAuto;
    html += `<tr>
      <td><span class="req" style="color:#ff4d4f">*</span> ${r.label}${r.k === 'booking' && !isStore ? '<span class="badge">상품에 없음</span>' : ''}</td>
      <td>${onoff(`w_${kind}_${r.k}`, e.web, `setBtn('${kind}','${r.k}','web',%V%)`, webDis)}</td>
      <td class="${aliDis ? 'lock' : ''}">${onoff(`a_${kind}_${r.k}`, e.ali, `setBtn('${kind}','${r.k}','ali',%V%)`, aliDis)}</td>
      <td class="tblnote">${note}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  const cnt = aliOnCount(eff.btns, rows);
  const webCnt = rows.filter(r => eff.btns[r.k].web).length;
  html += `<div class="hint">${MSG.cap} 현재 웹 ${webCnt}개 / 알리페이 ${cnt}개.</div>`;
  if (webCnt > CAP || cnt > CAP) html += `<div class="notice">마이그레이션 이전에 저장된 건이라 ${webCnt > CAP ? '웹' : '알리페이'} 열에 ${Math.max(webCnt, cnt)}개가 켜져 있습니다. 저장하려면 두 개로 줄여 주세요.</div>`;
  if (locked) html += `<div class="notice grey">${MSG.defaultLock}</div>`;
  if (hidden) html += `<div class="notice grey">알리페이 노출이 미노출이라 알리페이 열을 잠갔습니다. 값은 그대로 보관합니다.</div>`;
  if (storeHidden) html += `<div class="notice grey">소속 스토어가 알리페이 미노출이라 이 상품도 알리페이에 노출되지 않습니다. 알리페이 열을 잠갔습니다.</div>`;
  if (!aliLangOk) html += `<div class="notice">${MSG.langOnly}</div>`;
  if (aliLangOk && !hidden && !storeHidden && cnt === 0) html += `<div class="notice">${MSG.noAliBtn}</div>`;
  return html;
}

window.setBtn = function (kind, k, ch, on) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  // 상한 검증
  if (on) {
    const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
    const cur = rows.filter(r => eff.btns[r.k][ch]).length;
    if (!eff.btns[k][ch] && cur >= CAP) { alertBox('켤 수 없습니다', MSG.cap + ` 지금 ${ch === 'web' ? '웹' : '알리페이'} 열에 ${cur}개가 켜져 있습니다.`); render(); return; }
  }
  obj.btns[k][ch] = on;
  if (k === 'consult' && !on) { obj.btns.inquiry[ch] = false; }
  // 상담접수 OFF로 알리페이 열이 비면 저장 전 확인 (PRD 7장)
  if (ch === 'ali' && k === 'consult' && !on) {
    const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
    if (!rows.some(r => eff.btns[r.k].ali)) { confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd, () => {}, () => { obj.btns[k][ch] = true; render(); }); }
  }
  render();
};

      return; }
  }
  obj.aliVisible = v; render();
};
window.setMode = function (v) {
  const p = P(VIEW.id); const st = S(p.store);

window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = rows.filter(r => eff.btns[r.k].web).length;
  const aliCnt = aliOnCount(eff.btns, rows);
  if (webCnt > CAP || aliCnt > CAP) { alertBox('저장할 수 없습니다', `${MSG.cap} 지금 웹 ${webCnt}개, 알리페이 ${aliCnt}개가 켜져 있습니다. 두 개로 줄인 뒤 저장해 주세요.`); return; }
  if (kind === 'store' && obj.aliVisible === '미노출' && obj.prodCount >= 10) { setVis('store', '미노출'); return; }
  if (obj.aliVisible === '노출' && aliCnt === 0 && ALI_LANGS.includes(obj.lang || '중국어(간체)')) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd, () => alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다.'), () => {}); return; }
  alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다. 목록과 프런트에는 바로 반영됩니다.');

/* --------------------------- 오른쪽 판정 패널 --------------------------- */
function railFor() {
  const n = VIEW.name;
  let obj = null, j = null, title = '', extra = '';
  if (n === 'p-edit') { obj = P(VIEW.id); j = judgeProduct(obj); title = obj.name; }
  else if (n === 's-edit') { obj = S(VIEW.id); j = judgeStore(obj); title = obj.name; }
  else if (n === 'b-edit') { obj = DB.banners.find(x => x.id === VIEW.id); j = judgeBanner(obj); title = obj.title; }
  else if (n === 'e-edit') { obj = DB.exhibitions.find(x => x.id === VIEW.id); j = judgeExhibition(obj); title = obj.name; }

  let html = '';
  if (j) {
    const cls = j.na ? 'q' : j.visible ? 'y' : 'n';
    const lab = j.na ? '판정 대상 아님' : j.visible ? '알리페이에 노출' : '알리페이에 미노출';
    html += `<div class="rail"><div class="hd">판정 결과 <span class="sub">${esc(title)}</span></div><div class="bd">
      <div class="result ${cls}">${lab}${j.reason ? `<small>사유 : ${j.reason}</small>` : j.na ? '<small>대상 언어가 아닙니다. 목록에서는 두 칼럼이 "-"로 보입니다.</small>' : '<small>사유 칼럼은 비어 있습니다.</small>'}</div>
      ${j.conds.map(c => `<div class="cond ${c.s}"><span class="mk">${c.s === 'ok' ? '✓' : c.s === 'no' ? '✕' : '·'}</span><span>${c.t}</span></div>`).join('')}
      <div class="hint" style="margin-top:10px">판정 결과와 사유는 저장 컬럼에 두고 목록이 읽습니다. 설정 변경은 즉시, 참조 대상 변경은 60초 안에 반영됩니다.</div>
      <div style="margin-top:12px"><label class="rd"><input type="checkbox" ${DB.errors[obj.id] ? 'checked' : ''} onchange="setErr('${obj.id}',this.checked)"><span>대상 조회 오류 재현 (사유 판정 오류)</span></label></div>
    </div></div>`;
  }
  html += `<div class="rail"><div class="hd">엣지케이스 시나리오</div><div class="bd">${scenarios().map((s, i) => `<button class="scn" onclick="runScn(${i})"><b>${s.id} ${s.t}</b><span>${s.d}</span></button>`).join('')}</div></div>`;
  html += `<div class="rail"><div class="hd">지금 상태 요약</div><div class="bd">
    <table><thead><tr><th>대상</th><th class="c">노출</th><th>사유</th></tr></thead><tbody>
    ${DB.products.map(p => { const jj = judgeProduct(p); return `<tr><td class="tblnote">상품 · ${esc(p.name)}</td><td class="c">${visCell(jj)}</td><td class="tblnote">${jj.na ? '-' : jj.reason || ''}</td></tr>`; }).join('')}
    ${DB.stores.map(s => { const jj = judgeStore(s); return `<tr><td class="tblnote">스토어 · ${esc(s.name)}</td><td class="c">${visCell(jj)}</td><td class="tblnote">${jj.reason || ''}</td></tr>`; }).join('')}
    ${DB.banners.map(b => { const jj = judgeBanner(b); return `<tr><td class="tblnote">배너 · ${esc(b.title)}</td><td class="c">${visCell(jj)}</td><td class="tblnote">${jj.na ? '-' : jj.reason || ''}</td></tr>`; }).join('')}
    ${DB.exhibitions.map(x => { const jj = judgeExhibition(x); return `<tr><td class="tblnote">기획전 · ${esc(x.name)}</td><td class="c">${visCell(jj)}</td><td class="tblnote">${jj.na ? '-' : jj.reason || ''}</td></tr>`; }).join('')}
    </tbody></table>
    <div style="margin-top:12px"><button class="btn" onclick="resetDB()">처음 상태로</button></div>
    <div class="hint">시나리오 버튼을 누르면 늘 처음 상태에서 시작합니다. 앞에서 바꾼 값이 섞이지 않습니다.</div>
  </div></div>`;
  return html;
}

// 시나리오는 늘 처음 상태에서 시작한다. 앞 시나리오의 변경이 섞이지 않게 초기값으로 되돌린 뒤 적용한다.
const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, banners: DB.banners, exhibitions: DB.exhibitions });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'banners', 'exhibitions'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  Object.keys(DB.errors).forEach(k => delete DB.errors[k]);
}
window.resetDB = () => { applyBase(); VIEW.langFilter = '중국어(간체)'; VIEW.aliFilter = '전체'; VIEW.rsnFilter = '전체'; go('p-list'); };
window.runScn = i => { applyBase(); VIEW.aliFilter = '전체'; VIEW.rsnFilter = '전체'; scenarios()[i].run(); };

/* ------------------------------ 모달 ------------------------------ */
function alertBox(title, body) {
  el('#modals').innerHTML = `<div class="mask"><div class="modal"><div class="hd">${title}<button class="x" onclick="closeModal()">✕</button></div>
    <div class="bd">${body}</div><div class="ft"><button class="btn pri" onclick="closeModal()">확인</button></div></div></div>`;
}
let _yes = null, _no = null;
function confirmBox(title, body, yes, no, okLabel) {
  _yes = yes; _no = no;
  el('#modals').innerHTML = `<div class="mask"><div class="modal"><div class="hd">${title}<button class="x" onclick="modalNo()">✕</button></div>
    <div class="bd">${body}</div><div class="ft"><button class="btn" onclick="modalNo()">취소</button><button class="btn pri" onclick="modalYes()">${okLabel || '저장'}</button></div></div></div>`;
}
window.closeModal = () => { el('#modals').innerHTML = ''; };
window.modalYes = () => { const f = _yes; closeModal(); if (f) f(); };
window.modalNo = () => { const f = _no; closeModal(); if (f) f(); };

/* ------------------------------ 렌더 ------------------------------ */
function render() {
  const map = { 'p-list': screen_pList, 'p-edit': screen_pEdit, 's-list': screen_sList, 's-edit': screen_sEdit,
    'b-list': screen_bList, 'b-edit': screen_bEdit, 'e-list': screen_eList, 'e-edit': screen_eEdit, 'h-list': screen_hList };
  el('#screen').innerHTML = map[VIEW.name]();
  el('#rail').innerHTML = railFor();
  el('#topttl').textContent = TITLES[VIEW.name];
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.go === VIEW.name || (VIEW.name[0] === n.dataset.go[0] && VIEW.name.endsWith('edit') && n.dataset.go.endsWith('list'))));
}
document.querySelectorAll('.nav').forEach(n => n.onclick = () => go(n.dataset.go));
window.go = go; window.render = render; window.VIEW = VIEW; window.DB = DB;
render();
</script>
