const INTERNAL_HOSTS = ['k-beautystation.com', 'www.k-beautystation.com', 'host.kbstations.com', 'admin.k-beautystation.com'];
function isExternalUrl(u) {
  const s = String(u).trim();
  if (/^(javascript|data|vbscript):/i.test(s)) return true;
  if (/^\/\//.test(s)) return true;
  if (/^\//.test(s)) return false;
  try { const h = new URL(s).hostname.toLowerCase(); return INTERNAL_HOSTS.indexOf(h) === -1; } catch (e) { return true; }
}
function scanEditor(text) {
  const urls = String(text).match(/(?:https?:)?\/\/[^\s"'<>)]+|javascript:[^\s"'<>)]*|data:[^\s"'<>)]*/gi) || [];
  const ext = urls.filter(isExternalUrl);
  const emb = String(text).match(/<\s*(iframe|script|object|embed)\b/gi) || [];
  return { ext, emb };
}
function stripEditor(text) {
  let t = String(text).replace(/<\s*(iframe|script|object|embed)\b[\s\S]*?(<\/\s*\1\s*>|>)/gi, '');
  t = t.replace(/<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (m, href, inner) => isExternalUrl(href) ? inner : m);
  t = t.replace(/(?:https?:)?\/\/[^\s"'<>)]+|javascript:[^\s"'<>)]*|data:[^\s"'<>)]*/gi, m => isExternalUrl(m) ? '' : m);
  return t.replace(/[ \t]{2,}/g, ' ').trim();
}

const EDOBJ = { product: P, store: S, exh: E };
function editorCard(title, kind, id, field, host) {
  const obj = EDOBJ[kind](id);

    '<input type="text" id="edlink" placeholder="주소를 넣고 넣기를 누르세요" style="width:340px">' +
    ' <button class="btn" onclick="insertLink(\'' + kind + '\',\'' + id + '\',\'' + field + '\',' + (host ? 'true' : 'false') + ')">넣기</button>' +
    '<div class="hint">' + (host ? MSG.edBlockHost : MSG.edBlockAdm) + ' 내부 링크는 저장할 때 상대 경로로 바뀝니다.</div></div></div>' +
    (sc.ext.length || sc.emb.length ? '<div class="notice">지금 본문에 ' + (host ? '다른 사이트 주소' : '외부 링크') + ' ' + sc.ext.length + '개, 외부 임베드 ' + sc.emb.length + '개가 남아 있습니다. 저장하면 제거됩니다.</div>' : '') +
    '</div><div class="ft"><button class="btn" onclick="EDBUF=null;render()">취소</button>' +

}
window.EDBUF = null;
window.insertLink = function (kind, id, field, host) {
  const box = el('#edlink');
  const v = box ? box.value : '';
  if (!v.trim()) return;
  if (isExternalUrl(v)) { alertBox('넣을 수 없습니다', host ? MSG.edBlockHost : MSG.edBlockAdm); return; }
  const obj = EDOBJ[kind](id);
  const cur = window.EDBUF != null ? window.EDBUF : obj[field];
  obj[field] = cur + ' <a href="' + v.trim() + '">' + v.trim() + '</a>';
  window.EDBUF = null; render();
};
window.saveEditor = function (kind, id, field, host) {
  const obj = EDOBJ[kind](id);
  const cur = window.EDBUF != null ? window.EDBUF : obj[field];
  const sc = scanEditor(cur);
  const n = sc.ext.length + sc.emb.length;
  obj[field] = stripEditor(cur);
  window.EDBUF = null;
  if (n) logChange(obj, '본문 외부 링크·임베드 제거', n + '개', '0개');
  render();
  alertBox('저장했습니다', n ? (host ? MSG.edStripHost(n) : MSG.edStripAdm(n)) : '본문을 저장했습니다.');
};

    '<option value="' + o[0] + '|' + o[1] + '"' + (cur && cur.id === o[1] ? ' selected' : '') + '>' + o[0] + ' · ' + o[2] + '</option>').join('') + '</select>';
}
window.setLinkType = function (bid, v) {
  const b = B(bid), before = b.linkType;
  b.linkType = v;
  if (v === '내부링크' && !b.target) b.target = { type: '상품', id: 'P1' };
  if (v === '내부이미지랜딩페이지' && !b.btn) b.btn = { label: '자세히 보기', linkKind: '링크없음', web: true, ali: true };
  logChange(b, '링크종류', before, v);
  render();
};
window.setBannerTarget = function (bid, val) { const b = B(bid), a = val.split('|'); b.target = { type: a[0], id: a[1] }; render(); };
window.setBtnLinkKind = function (bid, v) {
  const b = B(bid), before = b.btn.linkKind;
  b.btn.linkKind = v;
  if (v === '내부링크' && !b.btn.target) b.btn.target = { type: '상품', id: 'P1' };
  if (v === '외부링크') { b.btn.url = b.btn.url || 'https://example.com/form'; b.btn.ali = false; }
  logChange(b, '하단 버튼 · 버튼 링크 종류', before, v);
  render();
};
window.setBtnTarget = function (bid, val) { const b = B(bid), a = val.split('|'); b.btn.target = { type: a[0], id: a[1] }; render(); };
window.setBannerBtnShow = function (bid, ch, v) {
  const b = B(bid), before = b.btn[ch] ? '활성화' : '비활성화';
  b.btn[ch] = !!v;
  logChange(b, '하단 버튼 · ' + (ch === 'web' ? '웹' : '알리페이') + ' 표시여부', before, v ? '활성화' : '비활성화');
  render();
};

/* ------------------------------- 저장 ------------------------------- */
window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  if (webCnt > CAP || aliCnt > CAP) { alertBox('저장할 수 없습니다', MSG.cap + ' 지금 웹 ' + webCnt + '개, 알리페이 ' + aliCnt + '개가 켜져 있습니다. 두 개로 줄인 뒤 저장해 주세요.'); return; }
  const langOk = kind === 'store' ? true : ALI_LANGS.indexOf(obj.lang) !== -1;
  if (langOk && obj.aliVisible === '노출' && aliCnt === 0) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd,
      function () { alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다.'); }, function () {});
    return;
  }
  alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다. 목록과 프런트에는 바로 반영됩니다.');
};

/* ------------------------------- 모달 ------------------------------- */
function alertBox(title, body) {
  el('#modals').innerHTML = '<div class="mask"><div class="modal"><div class="hd">' + title + '<button class="x" onclick="closeModal()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn pri" onclick="closeModal()">확인</button></div></div></div>';
}
let _yes = null, _no = null;
function confirmBox(title, body, yes, no, okLabel) {
  _yes = yes; _no = no;
  el('#modals').innerHTML = '<div class="mask"><div class="modal"><div class="hd">' + title + '<button class="x" onclick="modalNo()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn" onclick="modalNo()">취소</button><button class="btn pri" onclick="modalYes()">' + (okLabel || '저장') + '</button></div></div></div>';
}
window.closeModal = function () { el('#modals').innerHTML = ''; };
window.modalYes = function () { const f = _yes; closeModal(); if (f) f(); };
window.modalNo = function () { const f = _no; closeModal(); if (f) f(); };
window.alertBox = alertBox;

/* --------------------------- 확인용 패널 --------------------------- */
function railFor() {
  const n = VIEW.name;
  let obj = null, j = null, title = '';
  if (n === 'p-edit') { obj = P(VIEW.id); j = judgeProduct(obj); title = obj.name; }
  else if (n === 's-edit') { obj = S(VIEW.id); j = judgeStore(obj); title = obj.name; }
  else if (n === 'b-edit') { obj = B(VIEW.id); j = judgeBanner(obj); title = obj.title; }
  else if (n === 'e-edit') { obj = E(VIEW.id); j = judgeExhibition(obj); title = obj.name; }
  else if (n === 'h-edit') { obj = P('P8'); j = judgeProduct(obj); title = obj.name; }

  let html = '<div class="rail toolbar"><div class="bd">아래 패널은 화면이 아니라 로직을 확인하기 위한 도구입니다. 개발 대상이 아닙니다.<br>지금 화면 <b>' + (SCREEN_ID[n] || '-') + '</b> · ' + (TITLES[n] || '') + '</div></div>';
  if (j) {
    const cls = j.na ? 'q' : j.visible ? 'y' : 'n';
    const lab = j.na ? '판정 대상 아님' : j.visible ? '알리페이에 노출' : '알리페이에 미노출';
    html += '<div class="rail"><div class="hd">판정 결과 <span class="tblnote">' + esc(title) + '</span></div><div class="bd">' +
      '<div class="result ' + cls + '">' + lab + (j.reason ? '<small>사유 : ' + j.reason + '</small>' : j.na ? '<small>대상 언어가 아닙니다. 목록에서는 두 칼럼이 "-"로 보입니다.</small>' : '<small>사유 칼럼은 비어 있습니다.</small>') + '</div>' +
      j.conds.map(c => '<div class="cond ' + c.s + '"><span class="mk">' + (c.s === 'ok' ? '✓' : c.s === 'no' ? '✕' : '·') + '</span><span>' + c.t + '</span></div>').join('') +
      '<div class="hint" style="margin-top:10px">판정 결과와 사유는 저장 컬럼(SYS-CH-01)에 두고 목록이 읽습니다. 산출 로직은 SYS-CH-02. 설정 변경은 즉시, 참조 대상 변경은 60초 안에 반영됩니다.</div>' +
      '<div style="margin-top:12px"><label class="rd"><input type="checkbox"' + (DB.errors[obj.id] ? ' checked' : '') + ' onchange="setErr(\'' + obj.id + '\',this.checked)"><span>대상 조회 오류 재현 (사유 판정 오류)</span></label></div>' +
      '</div></div>';
  }
  if (/-list$/.test(n)) {
    const notes = {
      'p-list': '사유는 미노출 행에만 나옵니다. 겹치면 직접 끔 → 스토어 설정 → 알리페이 버튼 없음 → 판정 오류 순으로 하나만 보입니다. 대상 언어가 아닌 탭은 두 칼럼이 "-"이고 두 필터가 비활성입니다.',
      's-list': '스토어는 언어와 무관한 한 건이라 언어 탭이 없습니다. 사유 직접 끔인 스토어의 상품은 전부 사유 스토어 설정으로 미노출이고, 사유 알리페이 버튼 없음인 스토어는 스토어 페이지만 숨습니다.',
      'b-list': '겹치면 직접 끔 → 외부 연결 → 알리페이 버튼 없음 → 연결 대상 미노출 → 판정 오류 순으로 하나만 보입니다. 알리페이 버튼 없음은 랜딩페이지형에만 나옵니다.',
      'e-list': '노출 가능 항목 없음은 안의 상품·스토어가 전부 알리페이에서 숨겨진 상태입니다.'
    };
    html += '<div class="rail"><div class="hd">이 목록의 규칙</div><div class="bd"><div class="hint" style="margin:0">' + notes[n] + '</div></div></div>';
  }
  html += '<div class="rail"><div class="hd">엣지케이스 시나리오</div><div class="bd">' +
    scenarios().map((s, i) => '<button class="scn" onclick="runScn(' + i + ')"><b>' + s.id + ' ' + s.t + '</b><span>' + s.d + '</span></button>').join('') + '</div></div>';
  html += '<div class="rail"><div class="hd">지금 상태 요약</div><div class="bd"><table><thead><tr><th>대상</th><th class="c">노출</th><th>사유</th></tr></thead><tbody>' +
    DB.products.map(p => { const q = judgeProduct(p); return '<tr><td class="tblnote">상품 · ' + esc(p.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    DB.stores.map(x => { const q = judgeStore(x); return '<tr><td class="tblnote">스토어 · ' + esc(x.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.reason || '') + '</td></tr>'; }).join('') +
    DB.banners.map(x => { const q = judgeBanner(x); return '<tr><td class="tblnote">배너 · ' + esc(x.title) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    DB.exhibitions.map(x => { const q = judgeExhibition(x); return '<tr><td class="tblnote">기획전 · ' + esc(x.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    '</tbody></table><div style="margin-top:12px"><button class="btn" onclick="resetDB()">처음 상태로</button></div>' +
    '<div class="hint">시나리오 버튼은 늘 처음 상태에서 시작합니다.</div></div></div>';
  return html;
}

// BO-CH-01-e4 : 신규 상품 등록 시 알리페이 열 초기값
function newProduct() {
  const p = { id: 'PN', name: '신규 상품 (메신저만 켠 건)', lang: '중국어(간체)', store: 'S2', aliVisible: '노출', mode: '개별 설정', insta: 'OFF',
    btns: { consult: btn(), inquiry: btn(), chat: btn(), extlink: btn(), messenger: btn({ web: true }) },
    detail: '신규 상품입니다.', history: [] };
  ['consult', 'inquiry', 'chat'].forEach(k => { p.btns[k].ali = !!p.btns[k].web; });
  if (!P('PN')) DB.products.push(p); else Object.assign(P('PN'), p);
  VIEW.lang = p.lang; go('p-edit', 'PN');
}
const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, banners: DB.banners, exhibitions: DB.exhibitions });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'banners', 'exhibitions'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  Object.keys(DB.errors).forEach(k => delete DB.errors[k]);
  window.EDBUF = null;
}
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ali = '전체'; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); VIEW.lang = '중국어(간체)'; clearFilters(); go('p-list'); };
window.runScn = function (i) { applyBase(); clearFilters(); scenarios()[i].run(); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 'p-edit': screen_pEdit, 's-list': screen_sList, 's-edit': screen_sEdit,
    'b-list': screen_bList, 'b-edit': screen_bEdit, 'e-list': screen_eList, 'e-edit': screen_eEdit, 'h-edit': screen_hEdit };
  el('#screen').innerHTML = map[VIEW.name]();
  el('#rail').innerHTML = railFor();
  el('#topttl').textContent = TITLES[VIEW.name];
  const navs = document.querySelectorAll('.nav');
  for (let i = 0; i < navs.length; i++) {
    const g = navs[i].dataset.go;
    const on = g === VIEW.name || (g.slice(0, 2) === VIEW.name.slice(0, 2) && /-edit$/.test(VIEW.name) && /-list$/.test(g));
    navs[i].classList.toggle('on', on);
  }
}
const navEls = document.querySelectorAll('.nav');
for (let i = 0; i < navEls.length; i++) navEls[i].onclick = function () { go(this.dataset.go); };
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
render();
</script>
