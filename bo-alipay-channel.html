}

window.collDelSel = function () {
  const c = C(VIEW.id), ids = Object.keys(COLLSEL);
  if (!ids.length) return;
  if (isStoreColl(c)) { c.stores = c.stores.filter(x => ids.indexOf(x) === -1); }

window.setCollType = function (t) {
  const c = C(VIEW.id); if (c.type === t) return;
  const wasStore = isStoreColl(c);
  const nowStore = t === '병원';
  const kept = wasStore ? c.stores.length : c.products.length;
  const apply = () => {
    c.type = t;
    /* 담는 종류가 바뀌므로 앞 유형에 담아 둔 항목은 비운다 */
    if (nowStore) { if (c.products.length) c.products = []; }
    else { if (c.stores.length) c.stores = []; }
    COLLSEL = {};
    render();
  };
  if (wasStore !== nowStore && kept) {
    confirmBox('유형을 바꿀까요',
      '<p>' + MSG.typeSwitch(wasStore ? '스토어' : '상품', kept, nowStore ? '스토어' : '상품') + '</p>',
      apply, function () { render(); }, '바꾸기');
    return;
  }
  apply();
};

  ['예약', 0, '웹·알리페이 앱 모두 지원. 예약설정에서 예약 사용 필요.']
];
function screen_btnSpec() {
  const ON = { '상담접수': 1, '문의하기(상담+채팅)로 통합 노출': 1, '예약': 1 };
  let rows = '';
  SPEC_ROWS.forEach(r => {
    const on = !!ON[r[0]];
    const hard = r[0] === '외부링크 설정' || r[0] === '메신저 설정';
    rows += '<tr><td><span class="req">*</span>' + r[0] + (r[1] ? '<span class="newbadge">신규</span>' : '') + '</td>' +
      '<td>' + onoff('sp_w_' + r[0], on, 'void(%V%)', true) + '</td>' +
      '<td class="new' + (hard ? ' lock' : '') + '">' + onoff('sp_a_' + r[0], on, 'void(%V%)', true) + '</td>' +
      '<td class="tblnote">' + r[2] + '</td></tr>';
  });
  return '<div class="phd"><div><h2 class="page">버튼 설정 공통 구조</h2>' +
    '<div class="pdesc">상품과 스토어가 같은 구조를 씁니다. 이 화면은 구조만 보여 주는 곳이고, 실제 조작은 상품 수정과 스토어 정보 수정에서 합니다.</div></div></div>' +
    '<div class="card"><div class="hd">표 구조</div><div class="bd"><div class="tblwrap">' +
    '<table><thead><tr><th style="min-width:300px">항목</th><th style="width:220px">웹</th>' +
    '<th class="new" style="width:220px">알리페이<span class="newbadge">신규</span></th><th style="min-width:320px">항목별 안내</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' + '</div></div>' +
    '<div class="card"><div class="hd">버튼 개수 세는 법</div><div class="bd">' +
    '<div class="row"><div class="lbl">세는 법</div><div class="val">문의하기 통합을 켜면 문의하기 버튼 하나로 셉니다(상담접수 포함). 통합을 끄고 상담접수만 켜면 상담접수 버튼 하나입니다. 채팅, 외부링크, 메신저, 예약은 각각 버튼 하나입니다.</div></div>' +
    '<div class="row"><div class="lbl">최대 개수</div><div class="val">웹 2개, 알리페이 앱 2개까지입니다. 두 곳을 각각 2개씩 켤 수 있고, 세 번째를 켜려 하면 막습니다.</div></div>' +
    '<div class="row"><div class="lbl">지금 예시</div><div class="val">웹 2개(문의하기, 예약), 알리페이 앱 2개(문의하기, 예약)입니다. 최대 개수에 딱 맞습니다.</div></div>' +
    '</div></div>' +
    '<div class="card"><div class="hd">알리페이 앱에서 켠 버튼이 없을 때</div><div class="bd">' +
    '<div class="notice">' + MSG.noAliBtn('이 상품은') + '</div>' + '</div></div>';
}

/* --------------------- BO-CH-07 · 매거진 등록·수정 --------------------- */
window.EDBUF = null;
window.openLinkModal = function () { MODAL = 'link'; LINKERR = ''; LINKVAL = ''; render(); };
let LINKERR = '', LINKVAL = '';
window.tryInsertLink = function () {
  const box = el('#linkurl'); const v = box ? box.value : '';
  if (!v.trim()) { LINKERR = '주소를 넣어 주세요.'; render(); return; }
  if (isExternalUrl(v)) { LINKERR = MSG.edBlockErr; LINKVAL = v; render(); return; }
  const m = M('M1');
  const cur = window.EDBUF != null ? window.EDBUF : m.body;
  m.body = cur + ' <a href="' + v.trim() + '">' + v.trim() + '</a>';
  window.EDBUF = null; MODAL = null; LINKERR = ''; render();
};
window.saveAd = function () {
  const b = A(VIEW.id), j = judgeAd(b);
  const done = () => { closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  /* 알리페이 노출을 노출로 두었는데 실제로는 보이지 않는 상태면 저장 전에 한 번 확인한다 */
  if (j.na || j.visible || b.aliVisible !== '노출') { done(); return; }
  const body = j.reason === '연결 대상 미노출' ? MSG.saveAdTgt(j.targetLabel || '대상')
    : j.reason === '외부 연결' ? MSG.saveAdExt
    : MSG.saveAdBtn;
  confirmBox('저장 확인', '<p>' + body + '</p><p class="hint">웹 노출에는 영향이 없습니다.</p>', done, function () {});
};
window.saveMagazine = function () {
  const m = M('M1');
  const cur = window.EDBUF != null ? window.EDBUF : m.body;
  const sc = scanBody(cur);
  const u = sc.ext.length, e = sc.emb.length;
  m.body = stripBody(cur); window.EDBUF = null;
  render();
  alertBox('저장했습니다', (u || e) ? MSG.edStrip(u, e) : '본문을 저장했습니다.');
};
function screen_mEdit() {
  const m = M('M1');
  const cur = window.EDBUF != null ? window.EDBUF : m.body;
  const sc = scanBody(cur);
  return '<div class="phd"><div><h2 class="page">매거진 등록·수정</h2>' +
    '<div class="pdesc">매거진 본문에 외부 사이트 주소와 외부 영상·SNS 넣기를 넣을 수 없게 막습니다. 알리페이 노출 설정은 두지 않습니다.</div></div>' +
    '<div><button class="btn">목록</button></div></div>' +
    '<div class="card"><div class="hd">기본 정보</div><div class="bd">' +
    '<div class="row"><div class="lbl">제목</div><div class="val">' + esc(m.title) + '</div></div>' +
    '<div class="row"><div class="lbl">언어</div><div class="val">' + m.lang + '</div></div>' +
    '<div class="row"><div class="lbl">상태</div><div class="val"><span class="tag on">' + m.status + '</span></div></div>' + '</div></div>' +
    '<div class="card"><div class="hd">본문<span class="newbadge">링크 차단 신규</span></div><div class="bd">' +
    '<div class="frow" style="margin-bottom:10px"><button class="btn" onclick="openLinkModal()">링크 넣기</button>' +
    '<span class="tblnote" style="align-self:center">' + MSG.edBlock + '</span></div>' +
    '<textarea oninput="EDBUF=this.value">' + esc(cur) + '</textarea>' +
    (sc.ext.length || sc.emb.length ? '<div class="notice">본문에 외부 사이트 주소 ' + sc.ext.length + '개, 외부 영상·SNS ' + sc.emb.length + '개가 있습니다. 저장 시 삭제됩니다.</div>' : '') +
    '<div class="hint">입력한 주소는 저장 시 내부 주소 형식으로 변환됩니다.</div>' + '</div><div class="ft"><button class="btn" onclick="EDBUF=null;render()">취소</button>' +
    '<button class="btn blue" onclick="saveMagazine()">저장</button></div></div>';
}
function modal_link() {
  return '<div class="mask"><div class="modal" style="max-width:560px"><div class="hd">링크 넣기<button class="x" onclick="closeMD()">✕</button></div>' +
    '<div class="bd">' +
    '<div style="font-size:12px;font-weight:500;color:#595959;margin-bottom:6px">주소</div>' +
    '<input type="text" id="linkurl" value="' + esc(LINKVAL) + '" style="width:100%" placeholder="https://k-beautystation.com/products/P1 또는 /products/P1">' +
    (LINKERR ? '<div class="notice">' + LINKERR + '</div>' : '') +
    '<div class="hint">입력한 주소는 저장 시 내부 주소 형식으로 변환됩니다.</div>' +
    '</div><div class="ft"><button class="btn" onclick="closeMD()">취소</button>' +
    '<button class="btn blue" onclick="tryInsertLink()">넣기</button></div></div></div>';
}

/* ------------------------------- 저장 ------------------------------- */
window.saveColl = function () {
  const c = C(VIEW.id), j = judgeCollection(c), byStore = isStoreColl(c);
  const langOk = ALI_LANGS.indexOf(c.lang) !== -1;
  const done = () => { closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  if (!langOk || c.aliVisible !== '노출' || j.liveCount > 0) { done(); return; }
  const total = byStore ? c.stores.length : c.products.length;
  const word = byStore ? '스토어가' : '상품이';
  /* 담은 항목마다 왜 안 보이는지 한 줄씩 */
  const lines = (byStore ? c.stores : c.products).map(id => {
    const o = byStore ? S(id) : P(id); if (!o) return '';
    const oj = byStore ? judgeStore(o) : judgeProduct(o);
    const WHY = { '직접 끔': '알리페이 노출 미노출', '스토어 설정': '소속 스토어 미노출', '알리페이 버튼 없음': '알리페이 앱 버튼 없음' };
    const why = oj.na ? '대상 언어 아님' : (oj.visible ? '노출' : (WHY[oj.reason] || oj.reason));
    return '<p class="hint" style="margin:2px 0">' + esc(o.name) + ' → ' + why + '</p>';
  }).join('');
  confirmBox('저장 확인',
    '<p>' + (total ? MSG.saveColl(word) : MSG.saveCollNone(word)) + '</p>' + lines +
    '<p class="hint">웹 노출에는 영향이 없습니다.</p>',
    done, function () {});
};
window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const done = () => { if (kind === 'store') VIEW.savedVis = obj.aliVisible; closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  // 저장을 막는 것은 개수 상한 초과뿐이다. 다른 확인보다 먼저 본다
  if (webCnt > CAP || aliCnt > CAP) {
    const wc = ctaList(eff.btns, rows, 'web'), ac = ctaList(eff.btns, rows, 'ali');
    alertBox('저장할 수 없습니다', MSG.cap + ' 지금은 웹 ' + webCnt + '개' + (wc.length ? '(' + wc.join(' / ') + ')' : '') +
      ', 알리페이 앱 ' + aliCnt + '개' + (ac.length ? '(' + ac.join(' / ') + ')' : '') + '입니다. 채널당 2개 이하여야 저장할 수 있습니다.');
    return;
  }
  // 스토어를 이번 편집에서 미노출로 바꿨고 소속 상품이 10건 이상이면 저장 시 영향 범위를 확인한다
  const im0 = kind === 'store' ? impactOfHiding(obj) : null;
  if (kind === 'store' && obj.aliVisible === '미노출' && VIEW.savedVis === '노출' && (obj.prodCount > 0 || im0.M || im0.K)) {
    const im = im0;
    confirmBox('알리페이 미노출로 저장',
      '<p><b>' + esc(obj.name) + '</b></p><p>이 스토어를 알리페이 앱에서 숨기면 소속 상품 ' + obj.prodCount + '건이 함께 보이지 않게 됩니다.</p>' +
      ((im.M || im.K) ? '<p>이 스토어가 빠지면서 알리페이 앱에 보이지 않게 되는 ' + [im.M ? '배너 ' + im.M + '건' : '', im.K ? '기획전 ' + im.K + '건' : ''].filter(Boolean).join('과 ') + '도 있습니다. 지워지는 것은 없습니다.</p>' : '') +
      '<p class="hint">웹 노출에는 영향이 없습니다.</p>',
      function () { done(); }, function () {}, '미노출로 저장');
    return;
  }
  const langOk = kind === 'store' ? true : ALI_LANGS.indexOf(obj.lang) !== -1;
  if (langOk && obj.aliVisible === '노출' && aliCnt === 0) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd,
      done, function () {});
    return;
  }
  done();
};

/* ------------------------------- 모달 ------------------------------- */
let MODAL = null;
window.closeMD = function () { MODAL = null; render(); };
function alertBox(title, body) {
  el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:520px"><div class="hd">' + title + '<button class="x" onclick="closeModal()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn blue" onclick="closeModal()">확인</button></div></div></div>';
}
let _yes = null, _no = null;
function confirmBox(title, body, yes, no, okLabel) {
  _yes = yes; _no = no;
  el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:560px"><div class="hd">' + title + '<button class="x" onclick="modalNo()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn" onclick="modalNo()">취소</button><button class="btn blue" onclick="modalYes()">' + (okLabel || '저장') + '</button></div></div></div>';
}
window.closeModal = function () { el('#modals').innerHTML = ''; };
window.modalYes = function () { const f = _yes; closeModal(); if (f) f(); };
window.modalNo = function () { const f = _no; closeModal(); if (f) f(); };
window.alertBox = alertBox;


const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, ads: DB.ads, collections: DB.collections, magazines: DB.magazines });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'ads', 'collections', 'magazines'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  window.EDBUF = null;
}
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ali = '전체'; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); MODAL = null; VIEW.lang = '중국어(간체)'; clearFilters(); go('p-list'); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 's-list': screen_sList, 's-edit': screen_sEdit, 'a-list': screen_aList, 'c-list': screen_cList,
    'm-edit': screen_mEdit, 'btn-spec': screen_btnSpec, 'h-edit': screen_hEdit };
  el('#side').innerHTML = renderSide();
  el('#screen').innerHTML = map[VIEW.name]();
  const md = { product: modal_product, ad: modal_ad, coll: modal_coll, link: modal_link };
  const holder = document.getElementById('mdholder') || (function () { const d = document.createElement('div'); d.id = 'mdholder'; document.body.appendChild(d); return d; })();
  holder.innerHTML = MODAL && md[MODAL] ? md[MODAL]() : '';
}
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
render();
</script>
