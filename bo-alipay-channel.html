function effBtns(p) {
  const st = S(p.store); const out = {}; let chatAuto = false;
  if (p.mode === '기본 설정') {
    ROWS_PRODUCT.forEach(r => { out[r.k] = { web: !!st.btns[r.k].web, ali: !!st.btns[r.k].ali }; });
    if (ctaList(out, ROWS_PRODUCT, 'ali').length === 0) { out.chat.ali = true; chatAuto = true; }
  } else {
    ROWS_PRODUCT.forEach(r => { out[r.k] = { web: !!p.btns[r.k].web, ali: !!p.btns[r.k].ali }; });
  }
  ROWS_PRODUCT.filter(r => r.aliHardOff).forEach(r => { out[r.k].ali = false; });
  if (!out.consult.ali) out.inquiry.ali = false;
  if (!out.consult.web) out.inquiry.web = false;
  return { btns: out, chatAuto };
}
function effStoreBtns(st) {
  const out = {};
  ROWS_STORE.forEach(r => { out[r.k] = { web: !!st.btns[r.k].web, ali: !!st.btns[r.k].ali }; });
  ROWS_STORE.filter(r => r.aliHardOff).forEach(r => { out[r.k].ali = false; });
  if (!out.consult.ali) out.inquiry.ali = false;
  if (!out.consult.web) out.inquiry.web = false;
  if (!st.bookingEnabled) { out.booking.web = false; out.booking.ali = false; }
  return { btns: out };
}
// FO 하단 CTA 로 렌더되는 자리 수. 상담접수와 문의하기 통합은 한 자리를 쓴다.
function ctaList(b, rows, ch) {
  const out = [];
  if (b.inquiry && b.inquiry[ch]) out.push('문의하기');
  else if (b.consult && b.consult[ch]) out.push('상담접수');
  ['chat', 'extlink', 'messenger', 'booking'].forEach(k => {
    if (rows.some(r => r.k === k) && b[k] && b[k][ch]) out.push(rows.filter(r => r.k === k)[0].label.replace(' 설정', ''));
  });
  return out;
}
const onCount = (b, rows, ch) => ctaList(b, rows, ch).length;

}
function judgeStore(st) {

  if (DB.errors[st.id]) conds.push({ s: 'no', t: '대상 조회 오류로 판정 실패. 재판정 큐가 처리한다.' });

// 내부링크 대상 판정. 병원·기획전만 보고 인플루언서·직접입력은 그대로 통과한다.
function innerTargetOk(inner) {
  if (!inner) return { ok: true, label: '대상 없음', skip: true };
  if (inner.kind === '병원') { const st = S(inner.id); if (!st) return { ok: false, label: '병원 · 대상 없음' }; const j = judgeStore(st); return { ok: j.visible, label: '병원 · ' + st.name, j }; }
  if (inner.kind === '기획전') { const c = C(inner.id); if (!c) return { ok: false, label: '기획전 · 대상 없음' }; const j = judgeCollection(c); return { ok: !j.na && j.visible, label: '기획전 · ' + c.name, j }; }
  if (inner.kind === '인플루언서') { const f = DB.influencers.filter(x => x.id === inner.id)[0]; return { ok: true, label: '인플루언서 · ' + (f ? f.name : inner.id), skip: true }; }
  return { ok: true, label: '직접입력', skip: true };
}
function judgeAd(b) {
  if (ALI_LANGS.indexOf(b.lang) === -1) return { na: true, visible: false, reason: '', conds: [{ s: 'sk', t: '언어 = ' + b.lang + '. 대상 언어가 아니라 판정하지 않는다.' }] };
  const c1 = b.aliVisible === '노출';
  const conds = [{ s: c1 ? 'ok' : 'no', t: '① 알리페이 노출 설정 = ' + b.aliVisible }, { s: 'sk', t: '링크종류 = ' + b.linkType }];

      if (!tv.ok) targetOut = tv.label;
    } else if (!noBtn) conds.push({ s: 'sk', t: '버튼 링크 종류가 링크없음이라 연결 대상을 보지 않는다' });
  }
  let reason = '';
  if (!c1) reason = '직접 끔';
  else if (ext) reason = '외부 연결';
  else if (noBtn) reason = '알리페이 버튼 없음';
  else if (targetOut) reason = '연결 대상 미노출';
  else if (DB.errors[b.id]) reason = '판정 오류';
  return { na: false, visible: !reason, reason, conds };
}
// 기획전 조건 ④ = 안의 상품과 스토어를 함께 센다
function judgeCollection(c) {
  if (ALI_LANGS.indexOf(c.lang) === -1) return { na: true, visible: false, reason: '', conds: [{ s: 'sk', t: '언어 = ' + c.lang + '. 대상 언어가 아니라 판정하지 않는다.' }] };

  const liveS = c.stores.filter(id => { const st = S(id); return st && judgeStore(st).visible; });

  const conds = [{ s: c1 ? 'ok' : 'no', t: '① 알리페이 노출 설정 = ' + c.aliVisible },

  c.products.forEach(id => { const p = P(id); if (!p) return; const j = judgeProduct(p); conds.push({ s: !j.na && j.visible ? 'ok' : 'no', t: '상품 · ' + p.name + ' → ' + (j.na ? '대상 언어 아님' : j.visible ? '노출' : '미노출 (' + j.reason + ')') }); });
  c.stores.forEach(id => { const st = S(id); if (!st) return; const j = judgeStore(st); conds.push({ s: j.visible ? 'ok' : 'no', t: '스토어 · ' + st.name + ' → ' + (j.visible ? '노출' : '미노출 (' + j.reason + ')') }); });
  let reason = '';

  else if (!live) reason = '노출 가능 항목 없음';
  else if (DB.errors[c.id]) reason = '판정 오류';
  return { na: false, visible: !reason, reason, conds, liveCount: live };
}

const INNER_KINDS = ['직접입력', '병원', '기획전', '인플루언서'];
function innerOpts(kind) {
  if (kind === '병원') return DB.stores.map(s => [s.id, s.name]);
  if (kind === '기획전') return DB.collections.map(c => [c.id, c.name]);
  if (kind === '인플루언서') return DB.influencers.map(f => [f.id, f.name]);
  return [['', '직접 입력한 내부 주소']];
}
function innerPicker(kindH, idH, cur) {
  const kind = (cur && cur.kind) || '직접입력';
  const opts = innerOpts(kind);
  return '<select onchange="' + kindH + '">' + INNER_KINDS.map(k => '<option' + (k === kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select> ' +
    (kind === '직접입력' ? '<input type="text" placeholder="/stores/226" style="width:220px">'
      : '<select onchange="' + idH + '">' + opts.map(o => '<option value="' + o[0] + '"' + (cur && cur.id === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>');
}

window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  if (webCnt > CAP || aliCnt > CAP) { alertBox('저장할 수 없습니다', MSG.cap + ' 지금 웹 ' + webCnt + '개(' + ctaList(eff.btns, rows, 'web').join(' / ') + '), 알리페이 ' + aliCnt + '개(' + ctaList(eff.btns, rows, 'ali').join(' / ') + ')가 나갑니다. 두 개로 줄인 뒤 저장해 주세요.'); return; }
  const langOk = kind === 'store' ? true : ALI_LANGS.indexOf(obj.lang) !== -1;
  if (langOk && obj.aliVisible === '노출' && aliCnt === 0) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd,
      function () { alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다.'); }, function () {});

  alertBox('저장했습니다', '판정 결과와 사유를 다시 계산해 저장 컬럼에 넣었습니다. 목록과 프런트에는 바로 반영됩니다.');
};

  html += '<div class="rail"><div class="hd">엣지케이스 시나리오</div><div class="bd">' +
    scenarios().map((s, i) => '<button class="scn" onclick="runScn(' + i + ')"><b>' + s.id + ' ' + s.t + '</b><span>' + s.d + '</span></button>').join('') + '</div></div>';
  html += '<div class="rail"><div class="hd">지금 상태 요약</div><div class="bd"><div class="tblwrap"><table><thead><tr><th>대상</th><th class="c">노출</th><th>사유</th></tr></thead><tbody>' +
    DB.products.map(p => { const q = judgeProduct(p); return '<tr><td class="tblnote" style="white-space:normal">상품 · ' + esc(p.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    DB.stores.map(x => { const q = judgeStore(x); return '<tr><td class="tblnote" style="white-space:normal">스토어 · ' + esc(x.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.reason || '') + '</td></tr>'; }).join('') +
    DB.ads.map(x => { const q = judgeAd(x); return '<tr><td class="tblnote" style="white-space:normal">광고 · ' + esc(x.title) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    DB.collections.map(x => { const q = judgeCollection(x); return '<tr><td class="tblnote" style="white-space:normal">기획전 · ' + esc(x.name) + '</td><td class="c">' + visCell(q) + '</td><td class="tblnote">' + (q.na ? '-' : q.reason || '') + '</td></tr>'; }).join('') +
    '</tbody></table></div><div style="margin-top:12px"><button class="btn" onclick="resetDB()">처음 상태로</button></div>' +
    '<div class="hint">시나리오 버튼은 늘 처음 상태에서 시작합니다.</div></div></div>';
  return html;
}

function newProduct() {
  const p = { id: 'PN', name: '신규 상품 (메신저만 켠 건)', lang: '중국어(간체)', store: 'S2', status: '대기', active: false, hidden: false,
    cat: '뷰티', sub: '기타', price: '50,000', vat: '포함', ext: '', aliVisible: '노출', mode: '개별 설정', insta: 'OFF',
    btns: { consult: btn(), inquiry: btn(), chat: btn(), extlink: btn(), messenger: btn({ web: true }) }, history: [] };
  ['consult', 'inquiry', 'chat'].forEach(k => { p.btns[k].ali = !!p.btns[k].web; });
  if (!P('PN')) DB.products.push(p); else Object.assign(P('PN'), p);
  VIEW.lang = p.lang; go('p-list'); openProduct('PN');
}
const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, ads: DB.ads, collections: DB.collections });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'ads', 'collections'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  Object.keys(DB.errors).forEach(k => delete DB.errors[k]);
}
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ali = '전체'; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); MODAL = null; VIEW.lang = '중국어(간체)'; clearFilters(); go('p-list'); };
window.runScn = function (i) { applyBase(); MODAL = null; clearFilters(); scenarios()[i].run(); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 's-list': screen_sList, 's-edit': screen_sEdit, 'a-list': screen_aList, 'c-list': screen_cList, 'h-edit': screen_hEdit };
  el('#side').innerHTML = renderSide();
  el('#screen').innerHTML = map[VIEW.name]();
  el('#rail').innerHTML = railFor();
  const md = { product: modal_product, ad: modal_ad, coll: modal_coll };
  const holder = document.getElementById('mdholder') || (function () { const d = document.createElement('div'); d.id = 'mdholder'; document.body.appendChild(d); return d; })();
  holder.innerHTML = MODAL && md[MODAL] ? md[MODAL]() : '';
}
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
render();
