.app{display:flex;min-height:100vh}

.sub{padding:9px 20px 9px 36px;cursor:pointer;color:#595959;font-size:13px;background:#fafafa}
.sub:hover{color:#e8537a}
.sub.on{background:#fff0f4;color:#e8537a;font-weight:500}

.caret{font-size:10px;color:#bfbfbf}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 24px;gap:8px;border-bottom:1px solid #f0f0f0}

.body{padding:24px;display:flex;gap:20px;align-items:flex-start}
.col-main{flex:1;min-width:0}

.pdesc{color:#8c8c8c;font-size:13px}

.row{display:flex;gap:16px;padding:9px 0;align-items:flex-start}

table{border-collapse:collapse;width:100%}
th,td{padding:12px 10px;border-bottom:1px solid #f0f0f0;text-align:left;vertical-align:middle;font-size:13px;white-space:nowrap}
th{background:#fafafa;font-weight:600;color:#434343}

.sw.on{background:#1677ff}

textarea{width:100%;min-height:220px;padding:10px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;font-family:inherit;font-size:13px;line-height:1.8;color:#262626;resize:vertical}

function isExternalUrl(u) {
  const v = String(u).trim();
  if (!v) return false;
  if (/^(javascript|data|vbscript):/i.test(v)) return true;
  if (/^\/\//.test(v)) return true;
  if (/^\//.test(v)) return false;
  try { return INTERNAL_HOSTS.indexOf(new URL(v).hostname.toLowerCase()) === -1; } catch (e) { return true; }
}
function toRelative(u) { try { const x = new URL(u); if (INTERNAL_HOSTS.indexOf(x.hostname.toLowerCase()) !== -1) return x.pathname + x.search + x.hash; } catch (e) {} return u; }
/* 임베드 안의 주소가 주소 개수에 겹치지 않도록 임베드를 먼저 걷어낸다 */
function withoutEmbeds(text) {
  return String(text).replace(/<\s*(iframe|script|object|embed)\b[^>]*>[\s\S]*?<\/\s*\1\s*>/gi, '').replace(/<\s*(iframe|script|object|embed)\b[^>]*\/?>/gi, '');
}
function scanBody(text) {
  const body = withoutEmbeds(text);
  const urls = body.match(/(?:https?:)?\/\/[^\s"'<>)]+|javascript:[^\s"'<>)]*|data:[^\s"'<>)]*/gi) || [];
  /* 같은 주소가 href 와 본문 글자에 겹쳐 있으면 한 건으로 센다 */
  const ext = [];
  urls.filter(isExternalUrl).forEach(u => { if (ext.indexOf(u) === -1) ext.push(u); });
  return { ext: ext, emb: String(text).match(/<\s*(iframe|script|object|embed)\b/gi) || [] };
}
function stripBody(text) {
  let t = String(text).replace(/<\s*(iframe|script|object|embed)\b[^>]*>[\s\S]*?<\/\s*\1\s*>/gi, '');
  t = t.replace(/<\s*(iframe|script|object|embed)\b[^>]*\/?>/gi, '');
  t = t.replace(/<\/\s*(iframe|script|object|embed)\s*>/gi, '');
  t = t.replace(/<a\b[^>]*href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi, (m, href, inner) => isExternalUrl(href) ? inner : m);
  t = t.replace(/https?:\/\/[^\s"'<>)]+/gi, m => isExternalUrl(m) ? '' : toRelative(m));
  t = t.replace(/(?:\/\/|javascript:|data:)[^\s"'<>)]+/gi, m => isExternalUrl(m) ? '' : m);
  return t.replace(/[ \t]{2,}/g, ' ').trim();

const INNER_KINDS = ['직접입력', '병원', '기획전', '인플루언서'];
function innerOpts(kind, keepId) {
  const b = A(VIEW.id), lang = b && b.lang;
  const same = x => !lang || x.lang === lang || x.id === keepId;
  if (kind === '병원') return DB.stores.map(s => [s.id, s.name]);
  if (kind === '기획전') return DB.collTypes.filter(same).map(t => [t.id, t.name + ' (' + t.type + ' · ' + t.lang + ')']);
  if (kind === '인플루언서') return DB.influencers.filter(same).map(f => [f.id, f.name]);
  return [];
}
function innerPicker(kindH, idH, cur, pathH, lang) {
  const kind = (cur && cur.kind) || '직접입력';
  const opts = innerOpts(kind, cur && cur.id);
  let tail;
  if (kind === '직접입력') {
    const tv = innerTargetOk(cur, lang);
    tail = '<input type="text" placeholder="/products/P1" style="width:220px" value="' + esc((cur && cur.path) || '') + '" onchange="' + pathH + '"> ' +
      '<span class="tblnote">' + (tv.skip ? tv.label : (tv.ok ? '노출 · ' : '미노출 · ') + tv.label) + '</span>';
  } else {
    tail = '<select onchange="' + idH + '">' + opts.map(o => '<option value="' + o[0] + '"' + (cur && cur.id === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  }
  return '<select onchange="' + kindH + '">' + INNER_KINDS.map(k => '<option' + (k === kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select> ' + tail;
}

/* ------------------------ 기획전 수정 모달 (실측) ------------------------ */
let COLLPICK = false;
let COLLSEL = {};
let COLLSNAP = null;   // 기획전 모달을 열 때의 원본. 취소하면 되돌린다
window.collSel = function (id, on) { if (on) COLLSEL[id] = true; else delete COLLSEL[id]; render(); };
window.collSelAll = function (on) { COLLSEL = {}; if (on) { const c = C(VIEW.id); (isStoreColl(c) ? c.stores : c.products).forEach(x => COLLSEL[x] = true); } render(); };
window.collDelSel = function () {
  const c = C(VIEW.id), ids = Object.keys(COLLSEL);
  if (!ids.length) return;
  if (isStoreColl(c)) { c.stores = c.stores.filter(x => ids.indexOf(x) === -1); }
  else { c.products = c.products.filter(x => ids.indexOf(x) === -1); }
  COLLSEL = {}; render();
};
window.openColl = function (id) { VIEW.id = id; MODAL = 'coll'; COLLPICK = false; COLLSEL = {}; COLLSNAP = JSON.stringify(C(id)); render(); };
window.collPick = function (v) { COLLPICK = v; render(); };
window.setCollType = function (t) {
  const c = C(VIEW.id); if (c.type === t) return;
  const wasStore = isStoreColl(c);
  const nowStore = t === '병원';
  const kept = wasStore ? c.stores.length : c.products.length;
  const apply = () => {
    c.type = t;
    /* 유형 레코드는 유형 값과 언어로 정해진다. 같은 언어에 그 유형 레코드가 없으면 어느 유형에도 붙지 않는다 */
    /* 같은 조합이 둘 이상이면 먼저 만든 레코드(id 순)에 붙는다 */
    const rec = DB.collTypes.filter(x => x.type === t && x.lang === c.lang).sort((x, y) => x.id < y.id ? -1 : 1)[0];
    c.typeId = rec ? rec.id : null;
    /* 담는 종류가 바뀌므로 앞 유형에 담아 둔 항목은 비운다 */
    if (nowStore) { if (c.products.length) c.products = []; }
    else { if (c.stores.length) c.stores = []; }
    COLLSEL = {};
    render();
  };
  if (wasStore !== nowStore && kept) {
    confirmBox('유형을 바꿀까요',
      '<p>' + MSG.typeSwitch(wasStore ? '스토어' : '상품', kept, nowStore ? '스토어' : '상품') + '</p>',
      apply, function () { render(); }, '바꾸기');
    return;
  }
  apply();
};

      (removedCount ? '<div class="notice" style="margin-top:8px">상품·스토어 카드 ' + removedCount + '개가 알리페이 미노출이라 이 채널에서는 빠집니다.</div>' : '<div class="hint">지금 담긴 상품·스토어 카드는 모두 알리페이에도 노출됩니다.</div>') +
      '</div></div>' : '') +
    '<div class="hint">상품·스토어 추가로 넣은 카드는 내부 참조라 에디터 입력 단계의 차단·변환 대상은 아닙니다. 다만 그 카드가 가리키는 상품·스토어가 나중에 알리페이 미노출로 바뀌면, 알리페이 채널 화면에서는 그 카드만 빠지고 웹에는 그대로 보입니다.<br>링크 넣기로 직접 입력한 K-Beauty Station 주소만 저장 시 내부 주소 형식으로 변환됩니다.</div>' + '</div><div class="ft"><button class="btn" onclick="EDBUF=null;MPICK=null;render()">취소</button>' +
    '<button class="btn blue" onclick="saveMagazine()">저장</button></div></div>';
}
function modal_link() {
  return '<div class="mask"><div class="modal" style="max-width:560px"><div class="hd">링크 넣기<button class="x" onclick="closeMD()">✕</button></div>' +
    '<div class="bd">' +
    '<div style="font-size:12px;font-weight:500;color:#595959;margin-bottom:6px">주소</div>' +
    '<input type="text" id="linkurl" value="' + esc(LINKVAL) + '" style="width:100%" placeholder="https://k-beautystation.com/products/P1 또는 /products/P1">' +
    (LINKERR ? '<div class="notice">' + LINKERR + '</div>' : '') +
    '<div class="hint">입력한 주소는 저장 시 내부 주소 형식으로 변환됩니다.</div>' +
    '</div><div class="ft"><button class="btn" onclick="closeMD()">취소</button>' +
    '<button class="btn blue" onclick="tryInsertLink()">넣기</button></div></div></div>';
}

/* ------------------------------- 저장 ------------------------------- */
window.saveColl = function () {
  const c = C(VIEW.id), j = judgeCollection(c), byStore = isStoreColl(c);
  const langOk = ALI_LANGS.indexOf(c.lang) !== -1;
  const done = () => { COLLSNAP = null; closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  const total = byStore ? c.stores.length : c.products.length;
  /* 구성 항목은 필수다. 하나도 없으면 저장하지 않는다 */
  if (!total) { alertBox('저장할 수 없습니다', MSG.collEmpty(byStore ? '스토어를' : '상품을')); return; }
  if (!langOk || c.aliVisible !== '노출' || j.liveCount > 0) { done(); return; }
  const word = byStore ? '스토어가' : '상품이';
  /* 담은 항목마다 왜 안 보이는지 한 줄씩 */
  const lines = (byStore ? c.stores : c.products).map(id => {
    const o = byStore ? S(id) : P(id); if (!o) return '';
    const oj = byStore ? judgeStore(o) : judgeProduct(o);
    /* 기존 노출 조건에서 빠진 항목은 알리페이 판정과 무관하게 세지 않는다 */
    const off = byStore ? o.active === false : !liveProduct(o);
    const why = off ? '비활성' : oj.na ? '대상 언어 아님' : (oj.visible ? '노출' : oj.reason);
    return '<p class="hint" style="margin:2px 0">' + esc(o.name) + ' → ' + why + '</p>';
  }).join('');
  confirmBox('저장 확인',
    '<p>' + MSG.saveColl(word) + '</p>' + lines +
    '<p class="hint">웹 노출에는 영향이 없습니다.</p>',
    done, function () {});
};
window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const done = () => { if (kind === 'store') VIEW.savedVis = obj.aliVisible; else go('p-list'); alertBox('저장했습니다', MSG.saveDone); };
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  // 저장을 막는 것은 개수 상한 초과뿐이다. 다른 확인보다 먼저 본다
  if (webCnt > CAP || aliCnt > CAP) {
    const wc = ctaList(eff.btns, rows, 'web'), ac = ctaList(eff.btns, rows, 'ali');
    alertBox('저장할 수 없습니다', MSG.cap + ' 지금은 웹 ' + webCnt + '개' + (wc.length ? '(' + wc.join(' / ') + ')' : '') +
      ', 알리페이 앱 ' + aliCnt + '개' + (ac.length ? '(' + ac.join(' / ') + ')' : '') + '입니다. 채널당 2개 이하여야 저장할 수 있습니다.');
    return;
  }
  // 스토어를 이번 편집에서 미노출로 바꿨고 영향받는 상품·배너·기획전이 있으면 저장 시 확인한다
  const im0 = kind === 'store' ? impactOfHiding(obj) : null;
  if (kind === 'store' && obj.aliVisible === '미노출' && VIEW.savedVis === '노출' && (storeProdCount(obj) > 0 || im0.M || im0.K)) {
    const im = im0;
    confirmBox('알리페이 미노출로 저장',
      '<p><b>' + esc(obj.name) + '</b></p><p>이 스토어를 알리페이 앱에서 숨기면 이 스토어 상품 ' + storeProdCount(obj) + '건도 함께 보이지 않습니다.</p>' +
      ((im.M || im.K) ? '<p>이 스토어가 빠지면서 알리페이 앱에 보이지 않게 되는 ' + [im.M ? '배너 ' + im.M + '건' : '', im.K ? '기획전 ' + im.K + '건' : ''].filter(Boolean).join('과 ') + '도 있습니다.</p>' : '') +
      '<p>지워지는 것은 없습니다.</p>' +
      '<p class="hint">웹 노출에는 영향이 없습니다.</p>',
      function () { done(); }, function () {}, '미노출로 저장');
    return;
  }
  const langOk = kind === 'store' ? true : ALI_LANGS.indexOf(obj.lang) !== -1;
  if (langOk && obj.aliVisible === '노출' && aliCnt === 0) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd,
      done, function () {});
    return;
  }
  done();
};

/* ------------------------------- 모달 ------------------------------- */
let MODAL = null;
window.closeMD = function () {
  if (MODAL === 'coll' && COLLSNAP) { const c = C(VIEW.id); if (c) Object.assign(c, JSON.parse(COLLSNAP)); }
  COLLSNAP = null; MODAL = null; render();
};
let TOAST_T = null;
function toast(msg) {
  el('#toasts').innerHTML = '<div class="toastwrap"><div class="toast"><span class="ic">✕</span><span>' + msg + '</span></div></div>';
  if (TOAST_T) clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => { el('#toasts').innerHTML = ''; }, 4000);
}
function alertBox(title, body) {
  el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:620px"><div class="hd">' + title + '<button class="x" onclick="closeModal()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn blue" onclick="closeModal()">확인</button></div></div></div>';
}
let _yes = null, _no = null;
function confirmBox(title, body, yes, no, okLabel) {
  _yes = yes; _no = no;
  el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:620px"><div class="hd">' + title + '<button class="x" onclick="modalNo()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn" onclick="modalNo()">취소</button><button class="btn blue" onclick="modalYes()">' + (okLabel || '저장') + '</button></div></div></div>';
}
window.closeModal = function () { el('#modals').innerHTML = ''; };
window.modalYes = function () { const f = _yes; closeModal(); if (f) f(); };
window.modalNo = function () { const f = _no; closeModal(); if (f) f(); };
window.alertBox = alertBox;


const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, ads: DB.ads, collections: DB.collections, magazines: DB.magazines, influencers: DB.influencers, collTypes: DB.collTypes });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'ads', 'collections', 'magazines', 'influencers', 'collTypes'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  window.EDBUF = null;
}
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ali = '전체'; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); MODAL = null; VIEW.lang = '중국어(간체)'; clearFilters(); go('p-list'); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 'p-edit': screen_pEdit, 's-list': screen_sList, 's-edit': screen_sEdit, 'a-list': screen_aList, 'c-list': screen_cList,
    'm-edit': screen_mEdit, 'btn-spec': screen_btnSpec, 'h-edit': screen_hEdit };
  el('#side').innerHTML = renderSide();
  el('#screen').innerHTML = map[VIEW.name]();
  const md = { ad: modal_ad, coll: modal_coll, link: modal_link };
  const holder = document.getElementById('mdholder') || (function () { const d = document.createElement('div'); d.id = 'mdholder'; document.body.appendChild(d); return d; })();
  holder.innerHTML = MODAL && md[MODAL] ? md[MODAL]() : '';
}
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
window.P = P; window.S = S; window.A = A; window.C = C; window.CT = CT;
render();
</script>
</body>
</html>
