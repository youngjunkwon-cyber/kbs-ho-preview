const INNER_KINDS = ['직접입력', '병원', '기획전', '인플루언서'];
/* 대상 선택지 = 배너와 같은 언어 + 배너 채널에 나가는 대상만. 이미 고른 것은 남긴다 */
function innerOpts(kind, keepId) {
  const b = A(VIEW.id), lang = b && b.lang, bch = b ? effChAd(b) : ALLCH;
  const chs = bch === ALLCH ? [WEB, ALI] : [bch];
  const same = x => !lang || x.lang === lang || x.id === keepId;
  const inCh = fn => x => x.id === keepId || chs.every(ch => fn(x, ch));
  if (kind === '병원') return DB.stores.filter(inCh((s, ch) => visStore(s, ch))).map(s => [s.id, s.name + ' (' + effChStore(s) + ')']);
  if (kind === '기획전') return DB.collTypes.filter(same).filter(inCh((t, ch) => innerTargetOk({ kind: '기획전', id: t.id }, lang, ch).ok)).map(t => [t.id, t.name + ' (' + t.type + ' · ' + t.lang + ')']);
  if (kind === '인플루언서') return DB.influencers.filter(same).filter(inCh((f, ch) => innerTargetOk({ kind: '인플루언서', id: f.id }, lang, ch).ok)).map(f => [f.id, f.name]);
  return [];
}
/* 배너 채널에서 대상이 빠지는 채널 목록 */
function targetMiss(inner, b) {
  const bch = effChAd(b); const chs = bch === ALLCH ? [WEB, ALI] : [bch];
  return chs.filter(ch => { const tv = innerTargetOk(inner, b.lang, ch); return !tv.skip && !tv.ok && !tv.ext; });
}
function innerPicker(kindH, idH, cur, pathH, b) {
  const kind = (cur && cur.kind) || '직접입력';

  if (kind === '직접입력') {
    const tv = innerTargetOk(cur, b.lang, WEB);

      '<span class="tblnote">' + (tv.skip ? tv.label : tv.ext ? tv.label : (tv.eff ? '노출 채널 ' + tv.eff + ' · ' : '') + tv.label + (miss.length ? ' · ' + miss.join('·') + '에 없음' : '')) + '</span>';

  return '<select onchange="' + kindH + '">' + INNER_KINDS.map(k => '<option' + (k === kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select> ' + tail;
}

  const rec = DB.collTypes.filter(x => x.type === c.type && x.lang === c.lang).sort((x, y) => x.id < y.id ? -1 : 1)[0]; c.typeId = rec ? rec.id : null; render(); };
window.setCollType = function (t) {
  const c = C(VIEW.id); if (c.type === t) return;
  const wasStore = isStoreColl(c), nowStore = t === '병원', kept = wasStore ? c.stores.length : c.products.length;
  const apply = () => { c.type = t;
    const rec = DB.collTypes.filter(x => x.type === t && x.lang === c.lang).sort((x, y) => x.id < y.id ? -1 : 1)[0]; c.typeId = rec ? rec.id : null;

  SPEC_ROWS.forEach(r => { const on = !!ON[r[0]]; const hard = r[0] === '외부링크 설정' || r[0] === '메신저 설정';
    rows += '<tr><td>' + r[0] + '</td><td>' + onoff('sp_w_' + r[0], on, 'void(%V%)', true) + '</td><td' + (hard ? ' class="lock"' : '') + '>' + onoff('sp_a_' + r[0], on, 'void(%V%)', true) + '</td><td class="tblnote">' + r[1] + '</td></tr>'; });
  return '<div class="phd"><div><h2 class="page">버튼 설정 공통 구조</h2><div class="pdesc">상품과 스토어의 버튼 설정이 공유하는 항목과 규칙입니다.</div></div></div>' +
    '<div class="card"><div class="hd">표 구조</div><div class="bd"><div class="tblwrap"><table><thead><tr><th style="min-width:300px">항목</th><th style="width:220px">웹</th><th style="width:220px">알리페이</th><th style="min-width:320px"></th></tr></thead><tbody>' + rows + '</tbody></table></div></div></div>' +
    '<div class="card"><div class="hd">버튼 개수 세는 법</div><div class="bd">' +
    '<div class="row"><div class="lbl">세는 법</div><div class="val">항목마다 버튼 하나입니다. 상담접수, 채팅, 문의하기(상담접수·채팅 통합 표시), 외부링크, 메신저, 예약 모두 켜져 있으면 각각 1개로 셉니다. 서로 묶이거나 대신 세어지는 항목은 없습니다. 웹도 같은 방식으로 셉니다.</div></div>' +
    '<div class="row"><div class="lbl">최대 개수</div><div class="val">웹 2개, 알리페이 앱 2개까지입니다. 세 번째를 켜려 하면 막습니다. 예약설정에서 예약을 다시 사용으로 바꿔 켜 둔 예약 버튼이 살아나 3개가 되면 표 아래 빨간 안내가 뜨고 저장이 막힙니다.</div></div>' +
    '<div class="row"><div class="lbl">막는 방식</div><div class="val">모달이 아니라 화면 위쪽에 알림이 잠깐 떴다 사라지고, 누른 토글은 원래 값으로 돌아갑니다. 저장 시점에 이미 상한을 넘은 데이터는 표 아래 빨간 안내로 알리고 저장을 막습니다.</div></div>' +
    '<div class="row"><div class="lbl">노출과의 관계</div><div class="val">버튼은 노출 조건이 아닙니다. 알리페이 앱 버튼이 하나도 없어도 콘텐츠는 노출되고 하단 버튼 영역만 접힙니다. 노출 채널이 웹이면 알리페이 열이, 알리페이 앱이면 웹 열이 잠기고 값은 유지됩니다.</div></div>' +
    '<div class="row"><div class="lbl">지금 예시</div><div class="val">웹 2개(상담접수, 예약), 알리페이 앱 2개(상담접수, 예약)입니다. 여기서 문의하기를 켜려 하면 3개가 되어 막힙니다.</div></div></div></div>';
}

/* --------------------- BO-CH-07 · 매거진 등록·수정 --------------------- */
window.EDBUF = null;
let LINKERR = '', LINKVAL = '';
window.openLinkModal = function () { MODAL = 'link'; LINKERR = ''; LINKVAL = ''; render(); };
window.tryInsertLink = function () {
  const box = el('#linkurl'); const v = box ? box.value : '';
  if (!v.trim()) { LINKERR = '주소를 넣어 주세요.'; render(); return; }
  if (isExternalUrl(v)) { LINKERR = MSG.edBlockErr; LINKVAL = v; render(); return; }
  const m = M('M1'); const cur = window.EDBUF != null ? window.EDBUF : m.body;
  m.body = cur + ' <a href="' + v.trim() + '">' + v.trim() + '</a>'; window.EDBUF = null; MODAL = null; LINKERR = ''; render();
};
window.saveAd = function () {
  const b = A(VIEW.id);
  const done = () => { closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  /* 직접입력 대상이 배너 채널에 없으면 저장을 막는다. 셀렉트로 고른 대상도 채널을 바꿔 안 맞게 되면 같다 */
  if (langOk(b.lang)) {
    const inner = b.linkType === '내부링크' ? b.inner : (b.linkType === '내부이미지랜딩페이지' && b.btn && b.btn.linkKind === '내부링크' ? b.btn.inner : null);
    if (inner) { const miss = targetMiss(inner, b); const tv = innerTargetOk(inner, b.lang, WEB);
      if (miss.length && !tv.skip && !tv.ext) { alertBox('저장할 수 없습니다', MSG.bnBlock(miss.join('·'))); return; } }
  }
  done();
};
window.saveMagazine = function () {
  const m = M('M1'); const cur = window.EDBUF != null ? window.EDBUF : m.body;
  const sc = scanBody(cur); const u = sc.ext.length, e = sc.emb.length;
  m.body = stripBody(cur); window.EDBUF = null; render();
  alertBox('저장했습니다', (u || e) ? MSG.edStrip(u, e) : '본문을 저장했습니다.');
};
let MPICK = null;
window.mPick = function (kind) { MPICK = MPICK === kind ? null : kind; render(); };
window.mInsert = function (kind, id) {
  const m = M('M1'), cur = window.EDBUF != null ? window.EDBUF : m.body;
  const o = kind === 'p' ? DB.products.find(x => x.id === id) : DB.stores.find(x => x.id === id); if (!o) return;
  window.EDBUF = cur + ' [' + (kind === 'p' ? '상품' : '스토어') + ' 카드:' + id + ':' + o.name + ']'; MPICK = null; render();
};
/* 채널 렌더 시점 필터. 카드 대상이 그 채널에 노출돼야 남는다. 웹·알리페이 양방향 */
function renderForChannel(text, ch) {
  return String(text).replace(/\[(상품|스토어) 카드:([^:\]]+):([^\]]*)\]/g, (m, kind, id) => {
    const ok = kind === '상품' ? (P(id) && visProduct(P(id), ch)) : (S(id) && visStore(S(id), ch)); return ok ? m : ''; });
}
let MPREVIEW = null;   // null | WEB | ALI
window.mTogglePreview = function (ch) { MPREVIEW = MPREVIEW === ch ? null : ch; render(); };
function screen_mEdit() {
  const m = M('M1'); const cur = window.EDBUF != null ? window.EDBUF : m.body; const sc = scanBody(cur);
  const pickRow = (kind, list) => '<div class="pickrow"><div class="frow"><select id="mpk_' + kind + '">' + list.map(x => '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('') + '</select><button class="btn blue sm" onclick="mInsert(\'' + kind + '\', el(\'#mpk_' + kind + '\').value)">추가</button></div></div>';
  let preview = '';
  if (MPREVIEW) { const filtered = renderForChannel(cur, MPREVIEW);
    const removed = (cur.match(/\[(상품|스토어) 카드:[^\]]+\]/g) || []).length - (filtered.match(/\[(상품|스토어) 카드:[^\]]+\]/g) || []).length;
    preview = '<div class="compcard"><div class="chd"><b>' + MPREVIEW + '에서 보이는 본문</b></div><div class="tblwrap" style="padding:0 16px 16px"><div class="tblnote" style="white-space:pre-wrap">' + esc(filtered) + '</div>' +
      (removed ? '<div class="notice" style="margin-top:8px">상품·스토어 카드 ' + removed + '개가 ' + MPREVIEW + '에 노출되지 않아 이 채널에서는 빠집니다.</div>' : '<div class="hint">지금 담긴 상품·스토어 카드는 모두 ' + MPREVIEW + '에도 노출됩니다.</div>') + '</div></div>'; }
  return '<div class="phd"><div><h2 class="page">매거진 등록·수정</h2><div class="pdesc">매거진 글을 등록, 수정, 삭제할 수 있습니다.</div></div><div><button class="btn">목록</button></div></div>' +
    '<div class="card"><div class="hd">기본 정보</div><div class="bd">' +
    '<div class="row"><div class="lbl">제목</div><div class="val">' + esc(m.title) + '</div></div>' +
    '<div class="row"><div class="lbl">언어</div><div class="val">' + m.lang + '</div></div>' +
    '<div class="row"><div class="lbl">상태</div><div class="val"><span class="tag all">' + m.status + '</span></div></div>' +
    '<div class="row"><div class="lbl">노출 채널</div><div class="val">' + chRadio('mch', effChMag(m), 'mag', !langOk(m.lang)) + '</div></div></div></div>' +
    '<div class="card"><div class="hd">본문</div><div class="bd">' +
    '<div class="frow" style="margin-bottom:10px"><button class="btn dash" onclick="mPick(\'p\')">상품 추가</button><button class="btn dash" onclick="mPick(\'s\')">스토어 추가</button><button class="btn" onclick="openLinkModal()">링크 넣기</button>' +
    '<button class="btn' + (MPREVIEW === WEB ? ' blue' : '') + '" onclick="mTogglePreview(\'' + WEB + '\')">미리보기 · 웹</button><button class="btn' + (MPREVIEW === ALI ? ' blue' : '') + '" onclick="mTogglePreview(\'' + ALI + '\')">미리보기 · 알리페이 앱</button>' +
    '<span class="tblnote" style="align-self:center">' + MSG.edBlock + '</span></div>' +
    (MPICK === 'p' ? pickRow('p', DB.products) : '') + (MPICK === 's' ? pickRow('s', DB.stores) : '') +
    '<textarea oninput="EDBUF=this.value">' + esc(cur) + '</textarea>' +
    (sc.ext.length || sc.emb.length ? '<div class="notice">본문에 외부 사이트 주소 ' + sc.ext.length + '개, 외부 영상·SNS ' + sc.emb.length + '개가 있습니다. 저장 시 삭제됩니다.</div>' : '') + preview +
    '<div class="hint">상품·스토어 추가로 넣은 카드는 내부 참조라 에디터 입력 단계의 차단·변환 대상은 아닙니다. 카드가 가리키는 상품·스토어가 어느 채널에 노출되지 않으면 그 채널 화면에서는 그 카드만 빠집니다. 웹과 알리페이 앱 양방향입니다.<br>링크 넣기로 직접 입력한 K-Beauty Station 주소만 저장 시 내부 주소 형식으로 변환됩니다.</div>' +
    '</div><div class="ft"><button class="btn" onclick="EDBUF=null;MPICK=null;render()">취소</button><button class="btn blue" onclick="saveMagazine()">저장</button></div></div>';
}
function modal_link() {
  return '<div class="mask"><div class="modal" style="max-width:560px"><div class="hd">링크 넣기<button class="x" onclick="closeMD()">✕</button></div><div class="bd">' +
    '<div style="font-size:12px;font-weight:500;color:#595959;margin-bottom:6px">주소</div><input type="text" id="linkurl" value="' + esc(LINKVAL) + '" style="width:100%" placeholder="https://k-beautystation.com/products/P1 또는 /products/P1">' +
    (LINKERR ? '<div class="notice">' + LINKERR + '</div>' : '') + '<div class="hint">입력한 주소는 저장 시 내부 주소 형식으로 변환됩니다.</div>' +
    '</div><div class="ft"><button class="btn" onclick="closeMD()">취소</button><button class="btn blue" onclick="tryInsertLink()">넣기</button></div></div></div>';
}

/* ------------------------------- 저장 ------------------------------- */
window.saveColl = function () {
  const c = C(VIEW.id), byStore = isStoreColl(c), lOk = langOk(c.lang);
  const done = () => { COLLSNAP = null; closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  const total = byStore ? c.stores.length : c.products.length;
  if (!total) { alertBox('저장할 수 없습니다', MSG.collEmpty(byStore ? '스토어를' : '상품을')); return; }
  const emptyChs = lOk ? collEmptyChannels(c) : [];
  if (!emptyChs.length) { done(); return; }
  const word = byStore ? '스토어가' : '상품이';
  const lines = (byStore ? c.stores : c.products).map(id => { const o = byStore ? S(id) : P(id); if (!o) return '';
    const off = byStore ? o.active === false : !liveProduct(o);
    const why = off ? '비활성' : (byStore ? effChStore(o) : effChProduct(o));
    return '<p class="hint" style="margin:2px 0">' + esc(o.name) + ' → ' + why + '</p>'; }).join('');
  confirmBox('저장 확인', emptyChs.map(ch => '<p>' + MSG.saveColl(word, ch) + '</p>').join('') + lines, done, function () {});
};
window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const done = () => { if (kind === 'store') VIEW.savedCh = obj.channel; else go('p-list'); alertBox('저장했습니다', MSG.saveDone); };
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  if (webCnt > CAP || aliCnt > CAP) {
    const wc = ctaList(eff.btns, rows, 'web'), ac = ctaList(eff.btns, rows, 'ali');
    alertBox('저장할 수 없습니다', MSG.cap + ' 지금은 웹 ' + webCnt + '개' + (wc.length ? '(' + wc.join(' / ') + ')' : '') + ', 알리페이 앱 ' + aliCnt + '개' + (ac.length ? '(' + ac.join(' / ') + ')' : '') + '입니다. 채널당 2개 이하여야 저장할 수 있습니다.');
    return;
  }
  /* 스토어 채널을 전체에서 좁혀 저장하면 영향 범위를 확인한다 */
  if (kind === 'store' && obj.channel !== ALLCH && VIEW.savedCh !== obj.channel) {
    const ch = obj.channel, lost = other(ch), im = impactOfStoreCh(obj, ch);
    if (im.N || im.M || im.A || im.K) {
      confirmBox(ch + euro(ch) + ' 저장',
        '<p><b>' + esc(obj.name) + '</b></p><p>이 스토어를 ' + lost + '에서 숨기면 이 스토어 상품 ' + im.N + '건과 칼럼 ' + im.M + '건도 함께 보이지 않습니다.</p>' +
        ((im.A || im.K) ? '<p>이 스토어가 빠지면서 ' + lost + '에 보이지 않게 되는 ' + [im.A ? '배너 ' + im.A + '건' : '', im.K ? '기획전 ' + im.K + '건' : ''].filter(Boolean).join('과 ') + '도 있습니다.</p>' : '') +
        '<p>지워지는 것은 없습니다.</p><p class="hint">' + ch + ' 노출에는 영향이 없습니다.</p>',
        done, function () {}, ch + euro(ch) + ' 저장');
      return;
    }
  }
  done();
};

/* ------------------------------- 모달 ------------------------------- */
let MODAL = null;
window.closeMD = function () { if (MODAL === 'coll' && COLLSNAP) { const c = C(VIEW.id); if (c) Object.assign(c, JSON.parse(COLLSNAP)); } COLLSNAP = null; MODAL = null; render(); };
let TOAST_T = null;
function toast(msg) { el('#toasts').innerHTML = '<div class="toastwrap"><div class="toast"><span class="ic">✕</span><span>' + msg + '</span></div></div>'; if (TOAST_T) clearTimeout(TOAST_T); TOAST_T = setTimeout(() => { el('#toasts').innerHTML = ''; }, 4000); }
function alertBox(title, body) { el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:620px"><div class="hd">' + title + '<button class="x" onclick="closeModal()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn blue" onclick="closeModal()">확인</button></div></div></div>'; }
let _yes = null, _no = null;
function confirmBox(title, body, yes, no, okLabel) { _yes = yes; _no = no;
  el('#modals').innerHTML = '<div class="mask" style="z-index:80"><div class="modal" style="max-width:620px"><div class="hd">' + title + '<button class="x" onclick="modalNo()">✕</button></div><div class="bd">' + body + '</div><div class="ft"><button class="btn" onclick="modalNo()">취소</button><button class="btn blue" onclick="modalYes()">' + (okLabel || '저장') + '</button></div></div></div>'; }
window.closeModal = function () { el('#modals').innerHTML = ''; };
window.modalYes = function () { const f = _yes; closeModal(); if (f) f(); };
window.modalNo = function () { const f = _no; closeModal(); if (f) f(); };
window.alertBox = alertBox; window.MSG = MSG;

const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, ads: DB.ads, collections: DB.collections, magazines: DB.magazines, influencers: DB.influencers, collTypes: DB.collTypes, columns: DB.columns });
function applyBase() { const b = JSON.parse(BASE); Object.keys(b).forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); }); window.EDBUF = null; MPREVIEW = null; }
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ch = CHF; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); MODAL = null; VIEW.lang = '중국어(간체)'; VIEW.hid = null; VIEW.cid = null; clearFilters(); go('p-list'); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 'p-edit': screen_pEdit, 's-list': screen_sList, 's-edit': screen_sEdit, 'a-list': screen_aList, 'c-list': screen_cList, 'm-edit': screen_mEdit, 'col-edit': screen_colEdit, 'btn-spec': screen_btnSpec, 'h-edit': screen_hEdit };
  el('#side').innerHTML = renderSide();
  el('#screen').innerHTML = map[VIEW.name]();
  const md = { ad: modal_ad, coll: modal_coll, link: modal_link };
  const holder = document.getElementById('mdholder') || (function () { const d = document.createElement('div'); d.id = 'mdholder'; document.body.appendChild(d); return d; })();
  holder.innerHTML = MODAL && md[MODAL] ? md[MODAL]() : '';
}
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
window.P = P; window.S = S; window.A = A; window.C = C; window.CT = CT; window.M = M;
window.effChProduct = effChProduct; window.effChStore = effChStore; window.effChAd = effChAd; window.effChColl = effChColl; window.effChColumn = effChColumn;
window.visProduct = visProduct; window.visStore = visStore; window.judgeAd = judgeAd; window.judgeCollection = judgeCollection; window.reasonsAd = reasonsAd; window.reasonsColl = reasonsColl;
window.WEB = WEB; window.ALI = ALI; window.ALLCH = ALLCH;
render();
</script>
