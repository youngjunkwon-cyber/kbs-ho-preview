  if (/^\//.test(v)) return false;

const INNER_KINDS = ['직접입력', '병원', '기획전', '인플루언서'];
function innerOpts(kind) {
  if (kind === '병원') return DB.stores.map(s => [s.id, s.name]);
  if (kind === '기획전') return DB.collections.map(c => [c.id, c.name]);
  if (kind === '인플루언서') return DB.influencers.map(f => [f.id, f.name]);
  return [];
}
function innerPicker(kindH, idH, cur) {
  const kind = (cur && cur.kind) || '직접입력';
  const opts = innerOpts(kind);
  return '<select onchange="' + kindH + '">' + INNER_KINDS.map(k => '<option' + (k === kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select> ' +
    (kind === '직접입력' ? '<input type="text" placeholder="/stores/226" style="width:220px" readonly> <span class="tblnote">직접입력은 알리페이 앱에 보이는지 확인하지 않습니다.</span>'
      : '<select onchange="' + idH + '">' + opts.map(o => '<option value="' + o[0] + '"' + (cur && cur.id === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>');
}
window.openAd = function (id) { VIEW.id = id; MODAL = 'ad'; render(); };
window.setAdLinkType = function (v) { const b = A(VIEW.id); const before = b.linkType; b.linkType = v;
  if (v === '내부링크' && !b.inner) b.inner = { kind: '병원', id: DB.stores[0].id };
  if (v === '내부이미지랜딩페이지' && !b.btn) b.btn = { label: '자세히 보기', linkKind: '링크없음', web: true, ali: true };
  logChange(b, '링크종류', before, v); render(); };
window.setAdInnerKind = function (k) { const b = A(VIEW.id); const o = innerOpts(k)[0]; b.inner = { kind: k, id: o ? o[0] : '' }; render(); };
window.setAdInnerId = function (id) { const b = A(VIEW.id); b.inner = { kind: b.inner.kind, id }; render(); };
window.setBtnLinkKind = function (v) { const b = A(VIEW.id); const before = b.btn.linkKind; b.btn.linkKind = v;
  if (v === '내부링크' && !b.btn.inner) b.btn.inner = { kind: '병원', id: DB.stores[0].id };
  logChange(b, '하단 버튼 · 버튼 링크 종류', before, v);
  if (v === '외부링크') { if (b.btn.ali) { logChange(b, '하단 버튼 · 알리페이 표시여부', '활성화', '비활성화', '버튼 링크 종류 외부링크로 고정'); } b.btn.ali = false; }
  render(); };
window.setBtnInnerKind = function (k) { const b = A(VIEW.id); const o = innerOpts(k)[0]; b.btn.inner = { kind: k, id: o ? o[0] : '' }; render(); };
window.setBtnInnerId = function (id) { const b = A(VIEW.id); b.btn.inner = { kind: b.btn.inner.kind, id }; render(); };
window.setAdBtnShow = function (ch, v) { const b = A(VIEW.id); const before = b.btn[ch] ? '활성화' : '비활성화'; b.btn[ch] = !!v;
  logChange(b, '하단 버튼 · ' + (ch === 'web' ? '웹' : '알리페이') + ' 표시여부', before, v ? '활성화' : '비활성화'); render(); };

window.saveColl = function () {
  const c = C(VIEW.id), j = judgeCollection(c), byStore = isStoreColl(c);
  const langOk = ALI_LANGS.indexOf(c.lang) !== -1;
  const done = () => { closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  if (!langOk || c.aliVisible !== '노출' || j.liveCount > 0) { done(); return; }
  const total = byStore ? c.stores.length : c.products.length;
  const word = byStore ? '스토어가' : '상품이';
  /* 담은 항목마다 왜 안 보이는지 한 줄씩 */
  const lines = (byStore ? c.stores : c.products).map(id => {
    const o = byStore ? S(id) : P(id); if (!o) return '';
    const oj = byStore ? judgeStore(o) : judgeProduct(o);
    const WHY = { '직접 끔': '알리페이 노출을 미노출로 두었습니다', '스토어 설정': '소속 스토어가 알리페이 앱에 보이지 않습니다', '알리페이 버튼 없음': '알리페이 앱에서 켠 버튼이 없습니다', '확인 실패': '상태를 확인하지 못했습니다' };
    const why = oj.na ? '알리페이 앱 대상 언어가 아닙니다' : (oj.visible ? '보입니다' : (WHY[oj.reason] || oj.reason));
    return '<p class="hint" style="margin:2px 0">' + esc(o.name) + ' → ' + why + '</p>';
  }).join('');
  confirmBox('저장 확인',
    '<p>' + (total ? MSG.saveColl(word) : MSG.saveCollNone(word)) + '</p>' + lines +
    '<p class="hint">웹에서는 그대로 보입니다.</p>',

};
window.save = function (kind) {
  const obj = kind === 'store' ? S(VIEW.id) : P(VIEW.id);
  const done = () => { if (kind === 'store') VIEW.savedVis = obj.aliVisible; closeMD(); alertBox('저장했습니다', MSG.saveDone); };
  const rows = kind === 'store' ? ROWS_STORE : ROWS_PRODUCT;
  const eff = kind === 'store' ? effStoreBtns(obj) : effBtns(obj);
  const webCnt = onCount(eff.btns, rows, 'web'), aliCnt = onCount(eff.btns, rows, 'ali');
  // 저장을 막는 것은 개수 상한 초과뿐이다. 다른 확인보다 먼저 본다
  if (webCnt > CAP || aliCnt > CAP) {
    const wc = ctaList(eff.btns, rows, 'web'), ac = ctaList(eff.btns, rows, 'ali');
    alertBox('저장할 수 없습니다', MSG.cap + ' 지금은 웹 ' + webCnt + '개' + (wc.length ? '(' + wc.join(' / ') + ')' : '') +
      ', 알리페이 앱 ' + aliCnt + '개' + (ac.length ? '(' + ac.join(' / ') + ')' : '') + '가 나갑니다. 2개로 줄인 뒤 저장해 주세요.');
    return;
  }
  // 스토어를 이번 편집에서 미노출로 바꿨고 소속 상품이 10건 이상이면 저장 시 영향 범위를 확인한다
  const im0 = kind === 'store' ? impactOfHiding(obj) : null;
  if (kind === 'store' && obj.aliVisible === '미노출' && VIEW.savedVis === '노출' && (obj.prodCount > 0 || im0.M || im0.K)) {
    const im = im0;
    confirmBox('알리페이 미노출로 저장',
      '<p><b>' + esc(obj.name) + '</b></p><p>이 스토어를 알리페이 앱에서 숨기면 소속 상품 ' + obj.prodCount + '건이 함께 보이지 않게 됩니다.</p>' +
      ((im.M || im.K) ? '<p>이 스토어가 빠지면서 알리페이 앱에 보이지 않게 되는 ' + [im.M ? '배너 ' + im.M + '건' : '', im.K ? '기획전 ' + im.K + '건' : ''].filter(Boolean).join('과 ') + '도 있습니다. 지워지는 것은 없습니다.</p>' : '') +
      '<p class="hint">웹에서는 그대로 보입니다.</p>',
      function () { done(); }, function () {}, '미노출로 저장');
    return;
  }
  const langOk = kind === 'store' ? true : ALI_LANGS.indexOf(obj.lang) !== -1;
  if (langOk && obj.aliVisible === '노출' && aliCnt === 0) {
    confirmBox('저장 확인', kind === 'store' ? MSG.saveStore : MSG.saveProd,
      done, function () {});
    return;
  }
  done();
};

function newProduct() {
  const p = { id: 'PN', name: '신규 상품 (메신저만 켠 건)', lang: '중국어(간체)', store: 'S2', status: '대기', active: false, hidden: false,
    cat: '뷰티', sub: '기타', price: '50,000', vat: '포함', ext: '', aliVisible: '노출', mode: '개별 설정', insta: 'OFF',
    btns: { consult: btn(), inquiry: btn(), chat: btn(), extlink: btn(), messenger: btn({ web: true }) }, history: [] };
  ['consult', 'inquiry', 'chat'].forEach(k => { p.btns[k].ali = !!p.btns[k].web; });
  if (!P('PN')) DB.products.push(p); else Object.assign(P('PN'), p);
  VIEW.lang = p.lang; go('p-list'); openProduct('PN');
}
const BASE = JSON.stringify({ products: DB.products, stores: DB.stores, ads: DB.ads, collections: DB.collections, magazines: DB.magazines });
function applyBase() {
  const b = JSON.parse(BASE);
  ['products', 'stores', 'ads', 'collections', 'magazines'].forEach(k => { DB[k].length = 0; b[k].forEach(x => DB[k].push(x)); });
  window.EDBUF = null;
  Object.keys(DB.errors).forEach(k => delete DB.errors[k]);
}
function clearFilters() { Object.keys(FILTERS).forEach(k => { FILTERS[k].ali = '전체'; FILTERS[k].rsn = '전체'; }); }
window.resetDB = function () { applyBase(); MODAL = null; VIEW.lang = '중국어(간체)'; clearFilters(); go('p-list'); };
window.runScn = function (i) { applyBase(); MODAL = null; clearFilters(); scenarios()[i].run(); };

/* ------------------------------- 렌더 ------------------------------- */
function render() {
  const map = { 'p-list': screen_pList, 's-list': screen_sList, 's-edit': screen_sEdit, 'a-list': screen_aList, 'c-list': screen_cList,
    'm-edit': screen_mEdit, 'btn-spec': screen_btnSpec, 'h-edit': screen_hEdit };
  el('#side').innerHTML = renderSide();
  el('#screen').innerHTML = map[VIEW.name]();
  el('#rail').innerHTML = railFor();
  const md = { product: modal_product, ad: modal_ad, coll: modal_coll, link: modal_link };
  const holder = document.getElementById('mdholder') || (function () { const d = document.createElement('div'); d.id = 'mdholder'; document.body.appendChild(d); return d; })();
  holder.innerHTML = MODAL && md[MODAL] ? md[MODAL]() : '';
}
window.render = render; window.VIEW = VIEW; window.DB = DB; window.F = F;
render();
</script>
