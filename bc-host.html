.pb-dd-i{padding:5px 12px;min-height:32px;line-height:22px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pb-dd-i:hover{background:rgba(0,0,0,.04)}
.pb-dd-i.on{background:var(--pb-acc-bg,#fdeef2);font-weight:600}
#pb-toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:4000;background:#fff;color:rgba(0,0,0,.88);font-size:14px;padding:9px 12px;border-radius:8px;box-shadow:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);opacity:0;pointer-events:none;transition:opacity .15s}
#pb-toast.on{opacity:1}
.pb-prodline{color:#2d2d2d !important;font-weight:600}
.pb-thumb{width:48px;height:48px;border-radius:6px;flex:none;display:block}
.pb-prod-l{display:inline-block;font-size:12px;color:#e8537a;margin-top:4px;text-decoration:underline}
.pb-foot-hint{font-size:12px;color:#8a9099;background:#f5f6f8;border-radius:6px;padding:8px 10px;margin:0 0 8px}
.pb-foot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb-foot-grid .pb-wide{grid-column:1/3}
.pb-ro-row{margin:0 0 24px}
.pb-ro{display:flex;align-items:center;gap:6px;border:1px solid #d9d9d9;border-radius:6px;padding:6px 11px;background:#fafafa;font-size:14px;width:fit-content}
.pb-ro .ant-tag{margin:0}
.ant-form-item-extra{color:rgba(0,0,0,.45);font-size:14px;margin-top:4px}

.pb-st{font-weight:600;font-size:13px;color:#8a9099;background:#f1f2f4;border-radius:4px;padding:1px 8px}
.pb-st.on{color:#1a8c33;background:#e8f7ec}
.pb-extra{color:rgba(0,0,0,.45);font-size:13px;margin-top:6px}

/* 드로어 예약 상품 섹션: 실화면 읽기 전용 상자 안에 썸네일·상품명·가격·상품 보기 */
.pb-prodbox{display:flex !important;align-items:center;gap:10px}
.pb-prodbox-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pb-prodbox-t b{font-weight:700}
.pb-prodbox .pb-prod-l{margin:0;flex:none}
/* 예약 캘린더(새 요소). 바탕은 흰색 · 옅은 회색, 색은 오늘 · 변경 신청 글자에만 */
.bc-cal{--bc-line:#ececef;--bc-off:#f5f5f7;font-size:12px;color:#212121;margin-top:4px}
.bc-mhead,.bc-mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.bc-mhead{border:1px solid var(--bc-line);border-bottom:0;border-radius:6px 6px 0 0;background:#fafafb}
.bc-mhead div{padding:8px 10px;font-size:13px;font-weight:600;color:#555;text-align:left}
.bc-mgrid{border-left:1px solid var(--bc-line);border-top:1px solid var(--bc-line)}
.bc-mcell{min-height:118px;padding:6px 6px 8px;border-right:1px solid var(--bc-line);border-bottom:1px solid var(--bc-line);display:flex;flex-direction:column;gap:3px;min-width:0;background:#fff}
.bc-mcell.bc-off{background:var(--bc-off)}
.bc-mcell.bc-out .bc-dn{color:#b5b5bb}
.bc-dn{font-size:13px;font-weight:600;color:#333;height:24px;display:flex;align-items:center}
.bc-dn span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;padding:0 4px}
.bc-today .bc-dn span{background:var(--bc-acc);color:#fff}
.bc-chip{display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:24px;padding:0 7px;border:1px solid #e3e3e8;border-radius:4px;background:#fff;font:inherit;font-size:12px;color:#212121;cursor:pointer;text-align:left;line-height:22px;flex:none}
.bc-chip:hover{border-color:#9a9aa3}
.bc-chip .bc-t{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.bc-chip .bc-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-chip .bc-cl{flex:none;color:var(--bc-chg,#eb8c1a);font-weight:600}
.bc-chip.bc-dim{opacity:.42}
.bc-chip.bc-chg{border-style:dashed;border-color:var(--bc-chg,#eb8c1a);background:#fff}
.bc-more{align-self:flex-start;border:0;background:none;padding:2px 4px;font:inherit;font-size:12px;font-weight:600;color:#555;cursor:pointer;border-radius:4px}
.bc-more:hover{background:#f0f0f2;color:#212121}
.bc-wgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-left:1px solid var(--bc-line);border-top:1px solid var(--bc-line)}
.bc-wgrid>div{border-right:1px solid var(--bc-line);border-bottom:1px solid var(--bc-line);min-width:0}
.bc-wh{padding:8px;background:#fafafb;display:flex;align-items:center;gap:6px;font-size:13px;color:#555}
.bc-wh .bc-wd{font-weight:600}
.bc-wh .bc-wdn{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-weight:600;color:#333}
.bc-wh.bc-today .bc-wdn{background:var(--bc-acc);color:#fff}
.bc-wt{padding:6px 8px 0 0;text-align:right;font-size:12px;color:#777;font-variant-numeric:tabular-nums;background:#fff}
.bc-wc{position:relative;min-height:34px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;background:#fff}
.bc-wc.bc-off{background:var(--bc-off)}
.bc-wc.bc-isfull{padding-top:22px}
.bc-full{position:absolute;top:4px;right:6px;font-size:11px;font-weight:600;color:#777;line-height:14px}
.bc-nav{display:flex;align-items:center;gap:8px}
.bc-nav .bc-arrow{min-width:32px;padding-left:0;padding-right:0;justify-content:center}
.bc-label{font-size:16px;font-weight:700;color:#212121;margin:0 6px 0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-seg{flex:none;width:auto!important;grid-template-columns:repeat(2,auto)!important;margin:0!important}
.bc-seg>button{min-width:64px;padding-left:14px;padding-right:14px}
.bc-bseg{display:flex;align-items:center;gap:6px;margin-left:auto}
.bc-bseg.bc-cvseg{margin-left:0}
.bc-hint{font-size:13px;color:#8c8c8c;white-space:nowrap;margin-right:4px}
.bc-bseg button[disabled]{cursor:not-allowed}
/* 주 보기: 칸이 좁아 이름이 잘리지 않게 두 줄까지 */
.bc-wc .bc-chip{height:auto;min-height:24px;flex-wrap:wrap;row-gap:0;padding-top:2px;padding-bottom:2px;line-height:18px}
.bc-wc .bc-chip .bc-n{white-space:normal;overflow:visible;word-break:break-word}
/* 좁은 칸: 칩 안 글자가 칩 밖으로 나가지 않게 */
.bc-chip{overflow:hidden}
.bc-mcell .bc-chip .bc-cl{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* 칩: 시간 + 이름, 왼쪽 막대 = 묶음(다가오는 예약 진한 회색 / 끝난 예약 옅은 회색 / 취소 · 노쇼 흐리게 + 취소선) */
.bc-cal{--bc-up:#3a3a42;--bc-done:#c4c4cc}
.bc-chip{position:relative;overflow:hidden;border-left-width:3px}
.bc-chip.bc-g-up{border-left-color:var(--bc-up)}
.bc-chip.bc-g-done{border-left-color:var(--bc-done)}
.bc-chip.bc-g-cx{border-left-color:var(--bc-done);opacity:.45}
.bc-chip.bc-g-cx .bc-t,.bc-chip.bc-g-cx .bc-n{text-decoration:line-through}
.bc-chip.bc-chg{border-left-style:dashed}
.bc-chip.bc-need{background:color-mix(in srgb,var(--bc-acc) 9%,#fff)}
.bc-tag{flex:none;margin-left:auto;font-size:10.5px;font-weight:600;color:var(--bc-acc);line-height:16px;white-space:nowrap}
.bc-man{position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:50%;background:#8c8c94}
/* 주 보기 칩: 두 줄까지 */
.bc-wc .bc-chip{height:auto;min-height:24px;flex-wrap:wrap;row-gap:0;padding-top:2px;padding-bottom:2px;line-height:18px}
.bc-wc .bc-chip .bc-n{white-space:normal;overflow:visible;word-break:break-word}
/* 월 보기 좁은 칸: 넘치면 다음 줄, 이름은 말줄임 */
.bc-mcell .bc-chip{height:auto;min-height:24px;flex-wrap:wrap;row-gap:0;column-gap:4px;line-height:18px;padding-top:2px;padding-bottom:2px}
.bc-mcell .bc-chip>span:not(.bc-n){flex:none}
.bc-mcell .bc-chip>.bc-n{flex:0 1 auto;max-width:100%}
.bc-chip .bc-cl{flex:none}
/* 아주 좁은 칸(1100 이하): 꼬리표 · 변경 신청 글자도 칩 안에서 말줄임 */
.bc-chip .bc-tag,.bc-chip .bc-cl,.bc-chip .bc-t{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* +N건 작은 창 */
.bc-pop{position:absolute;z-index:2500;width:260px;max-height:min(420px,calc(100vh - 16px));display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);font-size:12px;color:#212121;--bc-up:#3a3a42;--bc-done:#c4c4cc}
.bc-pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 8px 14px;border-bottom:1px solid #f0f0f2;flex:none}
.bc-pop-h strong{font-size:13px;font-weight:700}
.bc-pop-x{width:24px;height:24px;border:0;background:none;border-radius:4px;color:#8c8c94;cursor:pointer;font-size:13px;line-height:24px}
.bc-pop-x:hover{background:#f0f0f2;color:#212121}
.bc-pop-b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
.bc-pop .bc-chip{height:auto;min-height:24px;flex-wrap:wrap;row-gap:0;column-gap:4px;line-height:18px;padding-top:2px;padding-bottom:2px}
.bc-pop .bc-chip>.bc-n{flex:0 1 auto;max-width:100%}
.bc-label{display:inline-block;text-align:center;flex:none}
.bc-sbtn{margin-left:8px;flex:none}
/* 상세 창이 열린 예약 칩: 진한 외곽선(처리 필요 연분홍 바탕과 구분) */
/* 일 보기 */
.bc-wgrid.bc-dgrid{grid-template-columns:56px minmax(0,1fr)}
.bc-dgrid .bc-chip{flex-wrap:nowrap}
.bc-dgrid .bc-chip .bc-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bc-x{display:inline-flex;gap:10px;color:#6b6b73;font-size:12px;min-width:0;overflow:hidden;white-space:nowrap;margin-left:6px}
.bc-x span{flex:none}
.bc-dgrid .bc-chip{width:auto;max-width:100%;align-self:flex-start;min-width:280px}
.bc-seg{grid-template-columns:none!important;grid-auto-flow:column}
/* 상태 칩 줄: 왼쪽 상태(토글) | 오른쪽 표시(설명) */
.bc-srow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:2px 0 10px}
.bc-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bc-grp2{border-left:1px solid #e3e3e8;padding-left:14px;gap:6px 14px}
.bc-glab{font-size:11.5px;color:#8c8c94;margin-right:2px}
.bc-sc{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #d9d9de;border-radius:14px;background:#f0f0f2;font:inherit;font-size:12.5px;color:#212121;cursor:pointer}
.bc-sc b{font-weight:700;font-variant-numeric:tabular-nums}
.bc-sc:not(.on){background:#fff;border-color:#e8e8ec;color:#b5b5bb}
.bc-sc:not(.on) .bc-sw{opacity:.35}
.bc-li{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#555;cursor:default}
/* 견본 = 캘린더 칩 축소판 */
.bc-sw{display:inline-block;flex:none;width:18px;height:12px;border:1px solid #d9d9de;border-left-width:3px;border-radius:2px;background:#fff;box-sizing:border-box}
.bc-sw.bc-g-up{border-left-color:#3a3a42}
.bc-sw.bc-g-done{border-left-color:#c4c4cc}
.bc-sw.bc-g-cx{border-left-color:#c4c4cc;opacity:.5;background:linear-gradient(#fff 5px,#8c8c94 5px,#8c8c94 6px,#fff 6px)}
.bc-sc:not(.on) .bc-sw.bc-g-cx{opacity:.2}
.bc-sw-need{border-left-color:#3a3a42;background:color-mix(in srgb,var(--bc-acc) 9%,#fff)}
.bc-sw-chg{border-style:dashed;border-color:var(--bc-chg,#eb8c1a);border-left-color:#3a3a42}
.bc-sw-sel{background:#212121;border-color:#212121;border-left-color:#fff}
.bc-li .bc-man{position:static;display:inline-block}
/* 열린 예약 칩: 반전 채움 */
.bc-chip.bc-sel{background:#212121;color:#fff;border-color:#212121;border-left-color:#fff;opacity:1}
.bc-chip.bc-sel.bc-chg{border-color:#b5b5bb;border-left-color:#fff}
.bc-chip.bc-sel .bc-tag,.bc-chip.bc-sel .bc-cl{color:#fff}
.bc-chip.bc-sel .bc-x{color:rgba(255,255,255,.75)}
.bc-chip.bc-sel .bc-man{background:#fff}
.bc-chip.bc-sel:hover{border-color:#212121}
/* ===== 상태 색: 각 화면 예약 상세 창 상태 칩 색(--c 점 · --cb 바탕 · --cf 글자)을 칩에 주입 ===== */
.bc-chip{background:var(--cb,#fff);border-color:color-mix(in srgb,var(--c,#d9d9de) 30%,#fff);border-left-color:var(--c,#d9d9de)!important;color:var(--cf,#1d1d22)}
.bc-chip:hover{border-color:var(--c)}

.bc-chip.bc-g-cx{opacity:.55;color:#55555c}
.bc-chip.bc-need{background:var(--cb,#fff)}
.bc-tag{background:var(--bc-need-bg,#d4380d);color:var(--bc-need-fg,#fff)!important;border-radius:3px;padding:0 5px;font-weight:700}
.bc-chip.bc-chg{border:1px dashed var(--bc-chg)!important;border-left:3px dashed var(--bc-chg)!important;background:var(--bc-chgbg,#fff);color:var(--bc-chgfg,#212121)}
.bc-chip.bc-chg .bc-cl{color:var(--bc-chgfg,#212121)}
.bc-mb{flex:none;display:inline-block;font-size:10.5px;line-height:14px;padding:0 4px;border:1px solid #c4c4cc;border-radius:3px;color:#6b6b73;background:#fff;font-style:normal;font-weight:500}
/* 열린 예약: 두 화면 상태 색 어디에도 없는 보라 채움 */
.bc-chip.bc-sel,.bc-chip.bc-sel.bc-chg{background:#6741D9!important;color:#fff!important;border-color:#6741D9!important;border-left-color:#fff!important;opacity:1}
.bc-chip.bc-sel.bc-chg{border-color:#fff!important}
.bc-chip.bc-sel .bc-tag{background:#fff;color:#6741D9!important}
.bc-chip.bc-sel .bc-cl,.bc-chip.bc-sel .bc-x{color:#fff!important}
.bc-chip.bc-sel .bc-mb{background:transparent;border-color:#fff;color:#fff}
/* 범례: 상태 토글 칩 = 상세 창 상태 칩 모양(연한 바탕 + 점 + 글자) */
.bc-sc .bc-sw{display:none}
.bc-sc::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.bc-sc.on{background:var(--cb);border-color:color-mix(in srgb,var(--c) 40%,#fff);color:var(--cf)}
.bc-sc.on b{color:var(--cf)}
.bc-sc:not(.on){background:#fff;border-color:#e3e3e8;color:#a3a3ab}
.bc-sc:not(.on)::before{background:#d0d0d6}
.bc-sw-chg{background:var(--bc-chgbg,#fff)!important;border:1px dashed var(--bc-chg)!important;border-left:3px dashed var(--bc-chg)!important}
.bc-sw-sel{background:#6741D9!important;border-color:#6741D9!important;border-left-color:#fff!important}
.bc-tag-sw{font-style:normal;font-size:10.5px;line-height:16px}
.bc-grp2.bc-wrapped{border-left:0;padding-left:0}
.bc-chip.bc-g-ns{opacity:1}
/* ===== 칩 배치 고정: 항상 2줄 · 같은 높이 (일 보기만 한 줄) ===== */
.bc-chip{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:center;gap:0!important;height:40px!important;min-height:40px!important;padding:2px 7px!important;line-height:18px!important;flex:none}
.bc-r1,.bc-r2{display:flex;align-items:center;gap:6px;min-width:0;height:18px;white-space:nowrap}
.bc-r1{overflow:hidden}
.bc-r1 .bc-t{flex:0 0 auto;max-width:none!important;overflow:visible!important;text-overflow:clip!important}
.bc-badge{margin-left:auto;flex:none;display:inline-flex;align-items:center}
.bc-badge>*{flex:none;max-width:none!important;overflow:visible!important;white-space:nowrap}
.bc-badge .bc-tag{margin:0;line-height:15px}
.bc-badge .bc-cl{font-size:10.5px;font-weight:700;line-height:15px;padding:0 5px;border:1px dashed var(--bc-chg);border-radius:3px;background:#fff}
.bc-r2 .bc-n{flex:0 1 auto!important;min-width:0;max-width:none!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;word-break:normal!important}
.bc-ms{flex:none;font-size:10.5px;color:#8c8c94}
.bc-chip.bc-sel .bc-ms{color:#fff}
.bc-chip.bc-sel .bc-badge .bc-cl{background:transparent;border-color:#fff}
/* 좁은 칸: 배지 → 같은 색 점 */
.bc-dots .bc-badge>*{font-size:0!important;width:8px;height:8px;padding:0!important;border-radius:50%;line-height:0}
.bc-dots .bc-badge .bc-cl{background:var(--bc-chg)}
.bc-dots .bc-badge .bc-mb{background:#a3a3ab;border-color:#a3a3ab}
/* 일 보기: 넓으니 한 줄 */
.bc-dgrid .bc-chip{flex-direction:row!important;align-items:center!important;justify-content:flex-start;height:28px!important;min-height:28px!important;gap:8px!important}
.bc-dgrid .bc-r1,.bc-dgrid .bc-r2{display:contents}
.bc-dgrid .bc-badge{order:5;margin-left:8px}
.bc-dgrid .bc-r2 .bc-n{flex:none!important}
/* 점 모드(좁은 칸): 칩 안 여백을 줄여 시각 + 점이 한 줄에 들어가게 */
.bc-dots .bc-chip:not(.bc-dchip){padding-left:4px!important;padding-right:4px!important}
.bc-dots .bc-r1,.bc-dots .bc-r2{gap:3px}
.bc-dots .bc-r1 .bc-t{font-size:11.5px;letter-spacing:-.2px}
.bc-dots .bc-badge{margin-left:auto}
/* 점 모드: 점은 칩 오른쪽 위 모서리에 고정(시각 글자와 겹치지 않게) */
.bc-dots .bc-chip:not(.bc-dchip) .bc-badge{position:absolute;right:3px;top:4px;margin:0}
.bc-dots .bc-badge>*{width:6px!important;height:6px!important}
.bc-dots .bc-chip:not(.bc-dchip) .bc-badge{right:2px;top:2px}
.bc-dots .bc-badge>*{width:5px!important;height:5px!important}
.bc-dots .bc-r1 .bc-t{font-size:11px;letter-spacing:-.3px}
.bc-dots .bc-chip:not(.bc-dchip){padding-left:3px!important;border-left-width:2px!important}
.bc-dots.bc-cal .bc-wgrid:not(.bc-dgrid){grid-template-columns:46px repeat(7,minmax(0,1fr))}
.bc-dots .bc-wc{padding-left:3px;padding-right:3px}
.bc-nav{flex-wrap:wrap;row-gap:8px;min-width:0;max-width:100%}
.bc-cal .bc-chip.bc-chg,.bc-pop .bc-chip.bc-chg{border:1px solid var(--bc-chg)!important;border-left:3px solid var(--bc-chg)!important}

.bc-dots .bc-chip.bc-chg:not(.bc-dchip){border-left-width:2px!important}
.bc-short .bc-ad{display:none}
/* ===== BO: 칩 3줄(시각+배지 / 스토어명 / 고객명), 스토어 다중 선택 태그 ===== */

.bc-stag{display:inline-flex;align-items:center;gap:4px;margin:0!important;font-size:12px;line-height:20px;padding:0 6px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:4px;color:rgba(0,0,0,.88)}

.bc-sumstrip{display:flex;align-items:center;flex-wrap:wrap;gap:0;height:auto;min-height:40px;padding:0 4px;background:#fff;border:1px solid #f0f0f0;border-radius:8px}

.bc-dn{justify-content:space-between}
.bc-dn .bc-more{align-self:center;margin:0}
.bc-nav ~ .bc-srow{flex:1 1 0;min-width:0}
.bc-hassr .ant-card-head-title{flex:0 0 auto!important}

/* ===== 칩은 흰 바탕 + 연회색 테두리, 색은 왼쪽 막대 · 시각 글자 · 작은 배지 글자에만 ===== */
.bc-chip,.bc-chip.bc-need,.bc-cal .bc-chip.bc-chg,.bc-pop .bc-chip.bc-chg{background:#fff!important;border-top:1px solid #e3e3e8!important;border-right:1px solid #e3e3e8!important;border-bottom:1px solid #e3e3e8!important;color:#1d1d22!important}
.bc-chip{border-left:3px solid var(--c,#d9d9de)!important}
.bc-chip .bc-t{color:var(--ct,#1d1d22)}
.bc-chip:hover{border-top-color:#bdbdc4!important;border-right-color:#bdbdc4!important;border-bottom-color:#bdbdc4!important}
.bc-chip.bc-g-cx .bc-t{color:#55555c}
.bc-cal .bc-chip.bc-chg,.bc-pop .bc-chip.bc-chg{border-left:3px dashed var(--bc-crfg,#b45309)!important}

.bc-arr{color:var(--bc-crfg,#b45309)}
.bc-tag{background:transparent!important;color:var(--bc-need-bg,#b45309)!important;border:1px solid var(--bc-need-bg,#b45309);padding:0 4px;font-weight:700}
.bc-cr{background:transparent!important}
.bc-dots .bc-badge .bc-tag{background:var(--bc-need-bg,#b45309)!important}

.bc-chip.bc-sel .bc-t,.bc-chip.bc-sel .bc-rs,.bc-chip.bc-sel .bc-arr{color:#fff!important}
.bc-chip.bc-sel .bc-tag{color:#fff!important;border-color:#fff}
/* 범례 토글: 흰 바탕 + 색 점, 켜짐 = 진한 글자 · 진한 테두리 */
.bc-sc.on{background:#fff!important;border-color:#9a9aa3!important;color:#1d1d22!important;font-weight:600}

.bc-chip.bc-sel .bc-cr{color:#fff!important;border-color:#fff!important}
.bc-cr{display:inline-block;font-size:10.5px;font-weight:700;line-height:15px;padding:0 4px;border:1px solid var(--bc-crfg,#b45309);border-radius:3px}

.bc-chip .bc-r1,.bc-chip .bc-r2{display:contents}

.bc-chip .bc-rs{order:1;flex:0 1 auto!important;min-width:0;max-width:none!important;display:block}
.bc-chip .bc-n,.bc-chip .bc-r2 .bc-n{order:2;flex:0 1000 auto!important;min-width:0!important}

.bc-chip .bc-x{order:4;flex:0 1 auto;min-width:0;overflow:hidden}
.bc-chip .bc-badge,.bc-dots .bc-chip:not(.bc-dchip) .bc-badge{order:5;margin-left:auto!important;flex:none;position:static!important}

.bc-chip.bc-sel .bc-pn{background:transparent;border-color:#fff;color:#fff}
.bc-li .bc-pn{margin-left:-2px}
/* 줄임: 점 단계에서는 변경 요청 · 요청 시간 배지(막대가 이미 주황)부터 없앰, 마지막 단계는 배지 점 전부 제거 */
.bc-dots .bc-chip .bc-badge .bc-cr{display:none}
.bc-nobadge .bc-chip .bc-badge{display:none!important}

.bc-viewseg{margin-left:auto!important;flex:none}
.bc-nav{flex:none}

.bc-srow-strip{margin:0 0 0 auto!important;padding:4px 8px;flex:0 1 auto}
.bc-sumstrip{flex-wrap:wrap}

.bc-viewseg>button{min-width:40px!important;padding-left:8px!important;padding-right:8px!important}
/* 칩 글자 14px (시각 600), 배지 12px · 짝 번호 12px, 칩 높이 28px */

.bc-chip .bc-rs,.bc-chip .bc-ms{color:#55555c}
.bc-chip .bc-tag,.bc-chip .bc-cr,.bc-chip .bc-mb{font-size:12px!important;line-height:17px!important}
.bc-chip .bc-pn,.bc-nobadge .bc-pn{width:18px!important;height:18px!important;font-size:12px!important}
.bc-pop{z-index:900!important;width:auto}
.bc-dn .bc-more{font-size:13px!important;font-weight:600!important;color:#33333a!important;height:20px!important;line-height:18px!important;padding:0 8px!important;border:1px solid #d0d0d6!important;border-radius:10px!important;background:#fff!important;cursor:default!important}
.bc-dn .bc-more:hover{background:#fff!important;color:#33333a!important}
.bc-dn{height:22px!important}
.bc-noarr .bc-chip{gap:2px!important;padding-left:3px!important;padding-right:2px!important}
.bc-noarr .bc-chip .bc-pn{width:16px!important;height:16px!important;font-size:11px!important}
.bc-noname .bc-chip .bc-n{display:none!important}
.bc-noname .bc-chip{border-left-width:2px!important;padding-left:2px!important;padding-right:1px!important}
.bc-noname .bc-chip .bc-pn{width:15px!important;height:15px!important}
.bc-noname .bc-wc,.bc-noname .bc-mcell{padding-left:2px!important;padding-right:2px!important}
/* 줄임 단계에서 배지가 빠져도 남는 표시: 처리 필요 = 칩 테두리 색, 수기 = 오른쪽 위 모서리 작은 삼각 */
.bc-cal .bc-chip.bc-need,.bc-pop .bc-chip.bc-need{border-top-color:var(--bc-need-bg,#b45309)!important;border-right-color:var(--bc-need-bg,#b45309)!important;border-bottom-color:var(--bc-need-bg,#b45309)!important}
.bc-chip.bc-manual::after{content:'';position:absolute;top:0;right:0;width:0;height:0;border-top:7px solid #8c8c94;border-left:7px solid transparent}

.bc-sw-need{background:#fff!important;border:1px solid var(--bc-need-bg,#b45309)!important;border-left:3px solid #3a3a42!important}
.bc-sw-man{position:relative;background:#fff!important;border:1px solid #e3e3e8!important;border-left:3px solid #3a3a42!important}

/* 왼쪽 메뉴 접기 */
.bc-lnb-ic{display:none}

.bc-lnb-c .bc-lnb .ant-menu-title-content,.bc-lnb-c .bc-lnb .ant-menu-submenu-arrow,.bc-lnb-c .bc-lnb .ant-menu-sub{display:none!important}

.bc-lnb-c .bc-lnb .ant-menu-root>li>.ant-menu-submenu-title,.bc-lnb-c .bc-lnb .ant-menu-root>.ant-menu-item{padding:0!important;margin-left:8px!important;margin-right:8px!important;width:48px!important;display:flex!important;align-items:center;justify-content:center}

.bc-sc.part{background:#fff!important;border-color:#55555c!important;color:#1d1d22!important;font-weight:600}

.bc-srow-list{margin:0 0 0 auto!important;flex:0 1 auto}
/* 새 줄임 순서: 스토어명이 이름보다 먼저 줄어듦, 배지는 이름이 다 사라진 뒤 점으로 */
.bc-chip .bc-rs{flex:0 1000 auto!important}
.bc-chip .bc-n,.bc-chip .bc-r2 .bc-n{flex:0 1 auto!important}

.bc-nav .bc-label{margin:0 2px!important}
