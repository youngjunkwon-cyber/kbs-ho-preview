<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영시간 확인요청 발송용</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --pink:#E84C88; --pinkbg:#FFE3EC; --warn:#FFF3B0; --line:#E5E7EB; }
  *{ box-sizing:border-box; }
  body{ font-family:"Malgun Gothic","맑은 고딕",sans-serif; margin:0; background:#F5F6F8; color:#222; }
  header{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
          padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1{ font-size:18px; margin:0; }
  header .prog{ font-size:14px; color:#555; }
  header button{ font-size:13px; padding:7px 12px; border:1px solid var(--line); background:#fff;
                 border-radius:8px; cursor:pointer; }
  header button:hover{ background:#f2f2f2; }
  .wrap{ max-width:980px; margin:0 auto; padding:20px; }
  .store{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px;
          margin-bottom:18px; }
  .store.done{ opacity:.5; }
  .store .top{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .store .idx{ font-weight:700; color:var(--pink); font-size:16px; }
  .store .nm{ font-weight:700; font-size:17px; }
  .store .chk{ margin-left:auto; font-size:13px; color:#555; display:flex; align-items:center; gap:6px; }
  .store .chk input{ width:18px; height:18px; }

  /* capture target */
  .cap{ background:#fff; padding:16px; display:inline-block; min-width:100%; }
  .cap .cap-title{ font-size:15px; font-weight:700; margin-bottom:8px; }
  table{ border-collapse:collapse; font-size:13px; }
  th,td{ border:1px solid #D7DAE0; padding:6px 9px; text-align:center; white-space:nowrap; }
  th{ background:#F1F3F5; font-weight:700; }
  td.src{ text-align:left; font-weight:600; background:#FAFBFC; }
  tr.kbs td{ background:var(--pinkbg); font-weight:700; }
  tr.kbs td.src{ color:var(--pink); }
  td.warn{ background:var(--warn); }
  tr.kbs td.warn{ background:#FBD7E4; }
  .cap .cap-note{ font-size:11px; color:#666; margin-top:8px; line-height:1.5; }
  .cap .cap-note b{ color:var(--pink); }

  .acts{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .acts button{ font-size:13px; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; }
  .b-text{ background:#222; color:#fff; }
  .b-img{ background:var(--pink); color:#fff; }
  .b-save{ background:#fff; color:#333; border:1px solid var(--line)!important; }
  .acts button:active{ transform:translateY(1px); }
  .msg{ margin-top:10px; width:100%; height:150px; font-family:inherit; font-size:13px;
        padding:10px; border:1px solid var(--line); border-radius:8px; resize:vertical; color:#333; }
  .hint{ max-width:980px; margin:0 auto; padding:0 20px 24px; color:#666; font-size:13px; line-height:1.6; }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#222; color:#fff;
          padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .2s; z-index:50; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <h1>운영시간 확인요청 발송용</h1>
  <span class="prog" id="prog">0 / 0 발송완료</span>
  <button id="btnAll">전체 이미지 저장(PNG)</button>
  <button id="btnReset">발송체크 초기화</button>
</header>
<div class="hint">
  위에서부터 한 곳씩 처리하세요 →
  <b>① 문구 복사</b> 눌러 카톡에 붙여넣기 ·
  <b>② 이미지 복사</b> 눌러 카톡에 붙여넣기(Ctrl+V) ·
  전송 후 우측 <b>발송완료 체크</b>.
  이미지 복사가 안 되면 <b>이미지 저장</b>으로 PNG를 받아 드래그하세요. (발송체크는 이 브라우저에 자동 저장됩니다.)
</div>
<div class="wrap" id="list"></div>
<div class="toast" id="toast"></div>

<script src="store-hours-data.js"></script>
<script>
const DAYS = ["월","화","수","목","금","토","일","공휴일"];
const KBS = "K-Beauty Station";

function norm(v){
  let s = String(v==null?"":v).trim();
  let low = s.toLowerCase().replace(/\s+/g,"");
  if(s==="" || low==="null" || low==="null~null") return "";
  return low; // 공백 무시 비교용
}
function disp(v){
  let s = String(v==null?"":v).trim();
  let low = s.toLowerCase().replace(/\s+/g,"");
  if(s==="" || low==="null" || low==="null~null") return "";
  return s.replace(/\s*~\s*/," ~ ");
}
function pad2(n){ return (n<10?"0":"")+n; }
function safeName(s){ return s.replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"_"); }

function buildTable(store){
  // 표시할 행: KBS 항상 + 비어있지 않은 출처행
  const rows = store.rows.filter(r => r.src===KBS || r.days.some(d=>norm(d)!==""));
  const kbs = store.rows.find(r=>r.src===KBS);
  const kbsNorm = DAYS.map((_,d)=> kbs ? norm(kbs.days[d]) : "");

  // 요일별 충돌 여부
  const conflict = DAYS.map((_,d)=>{
    const set = new Set();
    let kbsEmpty=false, othersHave=false;
    store.rows.forEach(r=>{
      const v = norm(r.days[d]);
      if(v==="") { if(r.src===KBS) kbsEmpty=true; return; }
      set.add(v);
      if(r.src!==KBS) othersHave=true;
    });
    return set.size>1 || (kbsEmpty && othersHave);
  });

  let html = '<table><thead><tr><th>출처</th>';
  DAYS.forEach(d=> html += '<th>'+d+'</th>');
  html += '</tr></thead><tbody>';
  rows.forEach(r=>{
    const isKbs = r.src===KBS;
    html += '<tr class="'+(isKbs?'kbs':'')+'">';
    html += '<td class="src">'+ r.src +'</td>';
    r.days.forEach((d,di)=>{
      const txt = disp(d);
      const cn = norm(d);
      let warn = false;
      if(conflict[di] && !isKbs && cn!=="" && cn!==kbsNorm[di]) warn=true;
      html += '<td class="'+(warn?'warn':'')+'">'+ (txt||'') +'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function message(name){
  return [
    "안녕하세요, K-Beauty Station입니다.",
    "",
    name+"의 운영시간이 채널마다 다르게 등록되어 있어 안내드립니다.",
    "",
    "첨부 이미지를 확인 부탁드립니다.",
    "- 맨 윗줄 : K-Beauty Station 노출 중인 운영시간",
    "- 노란색 칸: K-Beauty Station과 다른 운영시간",
    "- 빈 칸: 해당 채널에 정보 없음",
    "",
    "운영시간이 다르면 고객이 영업 여부를 오인할 수 있어 안내드립니다.",
    "번거로우시겠지만 정확한 운영시간을 확인하신 뒤, 각 채널의 정보를 동일하게 맞춰주시면 감사하겠습니다.",
    "",
    "감사합니다."
  ].join("\n");
}

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1600);
}

function updateProg(){
  const total = STORES.length;
  const done = document.querySelectorAll('.store.done').length;
  document.getElementById('prog').textContent = done+' / '+total+' 발송완료';
}

const DONE_KEY = 'kbs_hours_sent_v1';
function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY)||'[]'); }catch(e){ return []; } }
function saveDone(arr){ localStorage.setItem(DONE_KEY, JSON.stringify(arr)); }

function render(){
  const list = document.getElementById('list');
  const done = loadDone();
  STORES.forEach((store, i)=>{
    const id = i+1;
    const fileBase = pad2(id)+'_'+safeName(store.name);
    const card = document.createElement('div');
    card.className = 'store' + (done.includes(i)?' done':'');
    card.id = 'store-'+i;
    card.innerHTML =
      '<div class="top">'+
        '<span class="idx">'+pad2(id)+'</span>'+
        '<span class="nm">'+store.name+'</span>'+
        '<label class="chk"><input type="checkbox" data-i="'+i+'" '+(done.includes(i)?'checked':'')+'> 발송완료</label>'+
      '</div>'+
      '<div class="cap" id="cap-'+i+'">'+
        '<div class="cap-title">'+store.name+' 운영시간 등록 현황</div>'+
        buildTable(store)+
        '<div class="cap-note"><b>K-Beauty Station</b> = 저희 서비스 등록값 · 노란 칸 = 등록값과 다른 채널 정보 · 빈 칸 = 해당 채널 정보 없음</div>'+
      '</div>'+
      '<div class="acts">'+
        '<button class="b-text" data-act="text" data-i="'+i+'">① 문구 복사</button>'+
        '<button class="b-img" data-act="img" data-i="'+i+'">② 이미지 복사</button>'+
        '<button class="b-save" data-act="save" data-i="'+i+'" data-file="'+fileBase+'">이미지 저장(PNG)</button>'+
      '</div>'+
      '<textarea class="msg" id="msg-'+i+'">'+message(store.name)+'</textarea>';
    list.appendChild(card);
  });
  updateProg();
}

async function nodeToBlob(node){
  const canvas = await html2canvas(node, {scale:2, backgroundColor:'#ffffff', logging:false});
  return await new Promise(res=> canvas.toBlob(res, 'image/png'));
}
function download(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename+'.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const i = +btn.dataset.i;
  const act = btn.dataset.act;
  if(act==='text'){
    const txt = document.getElementById('msg-'+i).value;
    try{ await navigator.clipboard.writeText(txt); toast('문구 복사됨 — 카톡에 붙여넣기'); }
    catch(err){
      const ta = document.getElementById('msg-'+i); ta.focus(); ta.select();
      document.execCommand('copy'); toast('문구 복사됨');
    }
    return;
  }
  const node = document.getElementById('cap-'+i);
  if(act==='img'){
    btn.textContent='② 만드는 중…';
    try{
      const blob = await nodeToBlob(node);
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        toast('이미지 복사됨 — 카톡에서 Ctrl+V');
      }catch(err){
        download(blob, btn.parentElement.querySelector('[data-act="save"]').dataset.file);
        toast('복사 불가 → PNG로 저장했어요. 드래그해서 첨부하세요');
      }
    }catch(err){ toast('이미지 생성 실패: '+err.message); }
    btn.textContent='② 이미지 복사';
    return;
  }
  if(act==='save'){
    btn.textContent='저장 중…';
    try{ const blob = await nodeToBlob(node); download(blob, btn.dataset.file); toast('PNG 저장됨'); }
    catch(err){ toast('실패: '+err.message); }
    btn.textContent='이미지 저장(PNG)';
    return;
  }
});

document.addEventListener('change', (e)=>{
  const cb = e.target.closest('input[type=checkbox][data-i]');
  if(!cb) return;
  const i = +cb.dataset.i;
  const card = document.getElementById('store-'+i);
  const done = loadDone();
  if(cb.checked){ card.classList.add('done'); if(!done.includes(i)) done.push(i); }
  else { card.classList.remove('done'); const k=done.indexOf(i); if(k>=0) done.splice(k,1); }
  saveDone(done); updateProg();
});

document.getElementById('btnAll').addEventListener('click', async (e)=>{
  const btn = e.target; btn.disabled=true; const orig=btn.textContent;
  for(let i=0;i<STORES.length;i++){
    btn.textContent='저장 중… '+(i+1)+'/'+STORES.length;
    const node = document.getElementById('cap-'+i);
    const file = pad2(i+1)+'_'+safeName(STORES[i].name);
    try{ const blob = await nodeToBlob(node); download(blob, file); await new Promise(r=>setTimeout(r,350)); }catch(err){}
  }
  btn.textContent=orig; btn.disabled=false; toast('전체 PNG 저장 완료 — 다운로드 폴더 확인');
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  saveDone([]);
  document.querySelectorAll('.store').forEach(c=>c.classList.remove('done'));
  document.querySelectorAll('input[type=checkbox][data-i]').forEach(cb=>cb.checked=false);
  updateProg(); toast('발송체크 초기화됨');
});

render();
</script>
</body>
</html>
