<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FO 카탈로그·탐색 화면 스펙</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:13px;color:#1f1f1f;background:#f4f5f7;overflow:hidden}
.app{display:flex;height:100vh}
.left{flex:0 0 430px;display:flex;flex-direction:column;border-right:1px solid #dcdde0;background:#e9eaec}
.lbar{height:42px;flex:0 0 42px;background:#fff;border-bottom:1px solid #e4e4e4;display:flex;align-items:center;gap:6px;padding:0 10px}
.lbar .t{font-size:12px;font-weight:700;margin-right:auto}
.left iframe{flex:1;width:100%;border:0;background:#fff}
.right{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.tabsbar{flex:0 0 auto;border-bottom:1px solid #e4e4e4;padding:10px 20px 0;background:#fff;position:sticky;top:0;z-index:5}
.tabsbar h1{margin:0 0 3px;font-size:16px;font-weight:900;letter-spacing:-.4px}
.tabsbar .sub{font-size:11.5px;color:#8a8a8a;margin-bottom:9px}
.navs{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:9px}
.navs button{border:1px solid #e0e0e0;background:#fff;border-radius:15px;height:28px;padding:0 11px;
  font-family:inherit;font-size:11.5px;color:#555;cursor:pointer;white-space:nowrap}
.navs button:hover{border-color:#1f1f1f;color:#1f1f1f}
.navs button.on{background:#1f1f1f;border-color:#1f1f1f;color:#fff;font-weight:700}
.scroll{flex:1;overflow-y:auto;padding:0 20px 120px}
.btn{padding:4px 9px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;
  color:#434343;font-size:11.5px;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#eb517a;color:#eb517a}
.btn.pri{background:#eb517a;border-color:#eb517a;color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}

section{padding-top:26px;scroll-margin-top:8px}
section>h2{font-size:15px;font-weight:900;letter-spacing:-.3px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
section>h2 .sid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#fff;background:#1f1f1f;
  border-radius:4px;padding:2px 6px;font-weight:700;letter-spacing:0}
section>.lead{font-size:12px;color:#6b6b6b;line-height:1.75;margin:0 0 12px}
.meta{display:grid;grid-template-columns:96px 1fr;gap:0;border:1px solid #ececec;border-radius:8px;overflow:hidden;margin-bottom:16px}
.meta dt{background:#fafafa;padding:8px 11px;font-size:11.5px;color:#8a8a8a;border-bottom:1px solid #f2f2f2;font-weight:500}
.meta dd{margin:0;padding:8px 12px;font-size:12px;line-height:1.7;border-bottom:1px solid #f2f2f2}
.meta dt:last-of-type,.meta dd:last-of-type{border-bottom:0}
.meta code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f3f3f3;border-radius:3px;padding:1px 5px}

h3.blk{font-size:12.5px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:7px}
h3.blk::before{content:'';width:3px;height:13px;background:#eb517a;border-radius:2px}
h3.blk .c{font-weight:400;color:#a0a0a0;font-size:11px}

table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #ececec;border-radius:8px;overflow:hidden}
th{background:#fafafa;text-align:left;font-weight:700;font-size:11px;color:#767676;padding:8px 10px;border-bottom:1px solid #ececec;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f4f4f4;line-height:1.7;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfc}
td.no{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#fff;background:#1f1f1f;width:1%;
  text-align:center;padding:2px 0;line-height:1}
td .badge{display:inline-block;background:#1f1f1f;color:#fff;font-family:ui-monospace,Menlo,monospace;
  font-size:10.5px;border-radius:3px;padding:2px 6px;font-weight:700}
td.cid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8a8a8a;white-space:nowrap;width:1%}
td.act{width:1%;white-space:nowrap}
em{font-style:normal;color:#eb517a;font-weight:700}
b.k{font-weight:700}
.note{border:1px solid #f0dfe4;background:#fff8fa;border-radius:8px;padding:11px 13px;font-size:11.5px;
  color:#7a5560;line-height:1.8;margin-top:10px}
.note b{color:#c03a63}
code.q{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f3f3f3;border-radius:3px;padding:1px 5px}
.foot{padding:30px 0 0;font-size:11px;color:#a0a0a0;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="lbar">
      <span class="t">화면</span>
      <button class="btn" id="reset">시드 초기화</button>
      <button class="btn" id="reload">새로고침</button>
      <button class="btn" id="newwin">새 창</button>
    </div>
    <iframe id="prev" src="fo-catalog-explore.html"></iframe>
  </div>
  <div class="right">
    <div class="tabsbar">
      <h1>FO 카탈로그·탐색 화면 스펙</h1>
      <div class="sub">PRD v4.6 · 기능정의서 v1.5 기준. 왼쪽 화면은 실제로 동작하며, 표의 <b>보기</b>를 누르면 그 경우의 수 상태로 바로 섭니다.</div>
      <div class="navs" id="navs"></div>
    </div>
    <div class="scroll" id="scroll"></div>
  </div>
</div>

        '<th>화면 결과</th><th style="width:17%">다음 행동</th><th></th></tr></thead><tbody>';
      b.rows.forEach(function(r){
        html += '<tr><td class="cid">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td>'+
          '<td class="act">'+(r[4]?'<button class="btn pri" data-run="'+encodeURIComponent(r[4])+'">보기</button>':'')+'</td></tr>';
      });
      html += '</tbody></table>';
    } else if(b.ints){
      html += '<table><thead><tr><th style="width:17%">트리거</th><th style="width:26%">즉시 반응</th>'+
        '<th style="width:29%">결과</th><th>실패·예외</th></tr></thead><tbody>';
      b.rows.forEach(function(r){
        html += '<tr><td><b class="k">'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<table><thead><tr><th style="width:30px">#</th><th style="width:19%">요소</th>'+
        '<th style="width:31%">값 · 출처</th><th>규칙 · 상태</th></tr></thead><tbody>';
      b.rows.forEach(function(r){
        html += '<tr><td class="no">'+r[0]+'</td><td><b class="k">'+r[1]+'</b></td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    if(b.note) html += '<div class="note">'+b.note+'</div>';
  });
  html += '</section>';
});
html += '<div class="foot">기준 문서: KBS 카탈로그·탐색 개편 PRD v4.6 · 기능정의서 v1.5<br>'+
        '이 문서에 적힌 값은 왼쪽 화면에서 그대로 재현된다. 값이 서로 다르면 왼쪽 화면이 아니라 이 표를 기준으로 고친다.</div>';

scrollEl.innerHTML=html;
navs.innerHTML=navHtml;

navs.addEventListener('click', function(e){
  var b=e.target.closest('[data-go]'); if(!b) return;
  document.getElementById('sec-'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'});
});
scrollEl.addEventListener('click', function(e){
  var b=e.target.closest('[data-run]'); if(!b) return;
  run(decodeURIComponent(b.dataset.run));
});
document.getElementById('reset').addEventListener('click', function(){ run(''); });
document.getElementById('reload').addEventListener('click', function(){ frame.src=frame.src; });
document.getElementById('newwin').addEventListener('click', function(){ window.open('fo-catalog-explore.html','_blank'); });

/* 스크롤에 따라 상단 네비 강조 */
var secs=SPEC.map(function(s){ return document.getElementById('sec-'+s.id); });
scrollEl.addEventListener('scroll', function(){
  var base=scrollEl.getBoundingClientRect().top, cur=0;
  secs.forEach(function(el,i){ if(el.getBoundingClientRect().top-base<=40) cur=i; });
  navs.querySelectorAll('button').forEach(function(b,i){ b.classList.toggle('on', i===cur); });
});
navs.querySelector('button').classList.add('on');
</script>
</body>
</html>
