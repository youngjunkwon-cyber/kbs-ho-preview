<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Beauty Station</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--pk:#FB6F92;--ink:#2D2D2D;--sub:#555;--line:#E4E4E4;--ph:#C6C6C6}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.app{width:375px;min-height:812px;margin:0 auto;position:relative;overflow:hidden;background:#fff}
.hd{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;position:sticky;top:0;z-index:5}
.hd .t{font-size:14px;font-weight:500;color:var(--sub)}
.hd button{border:0;background:none;padding:0;width:24px;height:24px;cursor:pointer}
.hd svg{width:24px;height:24px;stroke:#555;fill:none;stroke-width:1.6}
.bd{padding:32px 20px 28px}
.lbl{font-size:14px;font-weight:500;margin:0 0 8px}.lbl i{color:var(--pk);font-style:normal}
input.in{width:100%;height:52px;border:1px solid var(--line);border-radius:8px;padding:0 16px;font:500 14px Pretendard,sans-serif;color:var(--ink);margin:0 0 20px;outline:none}
input.in::placeholder{color:var(--ph)}
input.in:focus{border-color:#BDBDBD}
input.in.err{border-color:#F04438;margin-bottom:6px}
input.in[readonly]{background:#FAFAFA}
.errt{font-size:12px;color:#F04438;margin:0 0 14px;line-height:1.5}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--sub);margin:0 0 20px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--pk)}
.btn{width:100%;height:44px;border-radius:8px;border:0;background:var(--pk);color:#fff;font:500 14px Pretendard,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.off,.btn:disabled{background:#F1F1F1;color:#B5B5B5;cursor:default}
.btn.gw{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gp{gap:10px}
.gdot{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.gl{width:18px;height:18px}
.notice{font-size:12px;line-height:1.5;color:#8A8A8A;margin:10px 0 0;text-align:center}
.notice a{color:#555}
.emlink{display:block;margin:28px auto 0;background:none;border:0;font:500 14px Pretendard,sans-serif;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.or{display:flex;align-items:center;gap:12px;margin:24px 0 16px;font-size:12px;color:#999}
.or::before,.or::after{content:"";flex:1;height:1px;background:#EBEBEB}
.links{display:flex;justify-content:center;align-items:center;gap:16px;margin:24px 0 0;font-size:13px;color:#8A8A8A}
.links b{width:1px;height:14px;background:var(--line)}
.links a{cursor:pointer}
.bk{background:var(--ink);border-radius:10px;padding:12px;margin:0 0 24px;box-shadow:0 0 20px rgba(0,0,0,.25),0 0 5px rgba(0,0,0,.15)}
.bk p{margin:0;color:#fff;font-size:16px;font-weight:700;line-height:1.3}
.bk small{display:block;color:#C6C6C6;font-size:12px;font-weight:500;margin-top:4px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dim.btm{align-items:flex-end;padding:0}
.md{background:#fff;border-radius:12px;width:100%;padding:24px 20px 20px}
.md.sheet{border-radius:16px 16px 0 0;padding:24px 20px 28px}
.md h4{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.4}
.md p.d{margin:0 0 20px;font-size:14px;color:var(--sub);line-height:1.55}
.two{display:flex;gap:8px}.two .btn{flex:1}
.stack .btn+.btn{margin-top:8px}
.toast{position:absolute;left:20px;right:20px;bottom:28px;background:var(--ink);color:#fff;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.45;z-index:30;box-shadow:0 0 20px rgba(0,0,0,.25)}
.sec{font-size:16px;font-weight:700;margin:0 0 16px}
.kv{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid #F0F0F0;font-size:14px}
.kv .k{color:var(--sub);font-weight:500}.kv .v{font-weight:500;display:flex;align-items:center;gap:8px}
.sbtn{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font:500 13px Pretendard,sans-serif;color:var(--ink);background:#fff;cursor:pointer}
.sbtn:disabled{color:#B5B5B5;background:#F7F7F7;cursor:default}
.pill{font-size:12px;font-weight:600;color:var(--ink);background:#F0F0F0;border-radius:4px;padding:2px 6px}
.hint{font-size:12px;color:#8A8A8A;margin:6px 0 0;line-height:1.5}
.tog{width:40px;height:24px;border-radius:12px;background:#D9D9D9;position:relative;border:0;cursor:pointer}.tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.tog.on{background:var(--pk)}.tog.on::after{left:19px}
.foot{display:flex;justify-content:center;gap:16px;margin:28px 0 0;font-size:13px;color:#8A8A8A}.foot a{cursor:pointer}
.card{border:1px solid #EFEFEF;border-radius:12px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0 0 12px;font-size:13px;color:#777}
.ph{background:#F2F2F2;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:13px;background:#fff;cursor:pointer}
.chip.on{border-color:var(--pk);color:var(--pk);font-weight:600}
.ver{font-size:12px;font-weight:600;color:#1E7B3A;margin-left:6px}
.title{font-size:20px;font-weight:700;text-align:center;margin:0 0 24px}
/* google */
.gpage{background:#fff;min-height:812px;font-family:Roboto,Arial,sans-serif;color:#202124}
.gtop{padding:28px 24px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.gtop .gl{width:28px;height:28px;margin-bottom:14px}
.gtop h1{font-size:22px;font-weight:400;margin:0 0 6px}
.gtop p{font-size:14px;margin:0 0 20px;color:#5F6368}
.gacc{border-top:1px solid #E8EAED;margin:0 24px}
.gacc button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid #E8EAED;background:#fff;text-align:left;cursor:pointer;font:14px Roboto,Arial,sans-serif;color:#3C4043}
.gav{width:30px;height:30px;border-radius:50%;background:#C9D7F2;display:flex;align-items:center;justify-content:center;font-size:13px;color:#1A3A7A;flex:none}
.gacc small{display:block;color:#5F6368;font-size:12px}
.gform{padding:0 24px}
.gform input{width:100%;height:52px;border:1px solid #DADCE0;border-radius:4px;padding:0 14px;font-size:15px;margin:0 0 20px}
.gnext{display:flex;justify-content:space-between;align-items:center;padding:8px 24px}
.gnext button{border:0;background:#1A73E8;color:#fff;border-radius:4px;padding:10px 22px;font-size:14px;cursor:pointer}
.gnext a{color:#1A73E8;font-size:14px;cursor:pointer}
.gerr{color:#D93025;font-size:12px;margin:-14px 0 16px}
.gbar{height:56px;display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid #E8EAED;font-size:13px;color:#5F6368}
.gbar button{border:0;background:none;cursor:pointer;font-size:20px;color:#5F6368;width:32px}
/* browser chrome for external */
.bchrome{height:44px;background:#F1F3F4;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#5F6368;gap:8px}
.bchrome span{flex:1;background:#fff;border-radius:16px;padding:6px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.inapp{height:44px;background:#fff;border-bottom:1px solid #E4E4E4;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#777;gap:8px}
.inapp b{color:#222;font-weight:600}
.spin{display:flex;flex-direction:column;align-items:center;justify-content:center;height:700px;color:#5F6368;font-size:13px;gap:12px}
.spin i{width:28px;height:28px;border:3px solid #E8EAED;border-top-color:#1A73E8;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const G_SVG='<svg class="gl" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const IC={back:'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',home:'<svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v10h-5v-6H9v6H4z"/></svg>',user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',menu:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'};

/* ---------- 데이터 ---------- */
function seed(){return{
 members:[
  {id:1,email:'verified@example.com',nickname:'Mina',verified:true,password:'pass1234',googleSub:null,status:'active',via:'email',marketing:false,linkNoticeShown:false},
  {id:2,email:'unverified@example.com',nickname:'Old User',verified:false,password:'pass1234',googleSub:null,status:'active',via:'email',marketing:false,linkNoticeShown:false},
  {id:3,email:'googleonly@gmail.com',nickname:'Jane Doe',verified:true,password:null,googleSub:'g-jane',status:'active',via:'google',marketing:false,linkNoticeShown:true},
  {id:4,email:'suspended@example.com',nickname:'Blocked',verified:true,password:'pass1234',googleSub:null,status:'suspended',via:'email',marketing:false,linkNoticeShown:false},
  {id:5,email:'linked@example.com',nickname:'Both Ways',verified:true,password:'pass1234',googleSub:'g-both',status:'active',via:'email',marketing:true,linkNoticeShown:true}
 ],
 google:[
  {sub:'g-new',name:'Alex Kim',email:'alex.new@gmail.com'},
  {sub:'g-noname',name:'',email:'noname@gmail.com'},
  {sub:'g-ver',name:'Mina Park',email:'verified@example.com'},
  {sub:'g-vercase',name:'Mina Park',email:'Verified@Example.com'},
  {sub:'g-unv',name:'Old User',email:'unverified@example.com'},
  {sub:'g-jane',name:'Jane Doe',email:'googleonly@gmail.com'},
  {sub:'g-sus',name:'Blocked',email:'suspended@example.com'},
  {sub:'g-both',name:'Both Ways',email:'linked@example.com'},
  {sub:'g-other',name:'Other Person',email:'other.person@gmail.com'}
 ],
 session:null, env:'web', envFrom:null, remembered:null, booking:null,
 nextGoogle:'ok', outbox:[], seq:100, pwFail:0
}}
let DB=seed();
let VIEW={page:'home',expanded:false,modal:null,toast:null,gFor:'login',err:{},form:{},returnTo:'home',pendingSub:null,pick:{date:null,time:null}};
window.DB=DB;window.VIEW=VIEW;
function resetDB(){DB=seed();window.DB=DB;VIEW={page:'home',expanded:false,modal:null,toast:null,gFor:'login',err:{},form:{},returnTo:'home',pendingSub:null,pick:{date:null,time:null}};window.VIEW=VIEW;clearTimeout(tt);render()}
const norm=e=>(e||'').trim().toLowerCase();
const me=()=>DB.members.find(m=>m.id===DB.session);
const live=m=>m&&m.status!=='deleted';
const gAcc=sub=>DB.google.find(g=>g.sub===sub);

/* ---------- 판정 (순수 함수) ---------- */
function judgeGoogle(db,sub){
 const g=db.google.find(x=>x.sub===sub);if(!g)return{result:'error',reason:'구글 계정 없음'};
 const linked=db.members.find(m=>m.googleSub===sub&&m.status!=='deleted');
 if(linked){if(linked.status==='suspended')return{result:'suspended',member:linked,reason:'연결된 회원이 정지 상태'};return{result:'login',member:linked,reason:'이미 연결된 구글'}}
 const same=db.members.find(m=>m.status!=='deleted'&&norm(m.email)===norm(g.email));
 if(!same)return{result:'signup',reason:'같은 이메일 회원 없음'};
 if(same.status==='suspended')return{result:'suspended',member:same,reason:'같은 이메일 회원이 정지 상태'};
 if(same.googleSub)return{result:'signup-blocked',member:same,reason:'같은 이메일 회원이 다른 구글에 연결됨'};
 if(same.verified)return{result:'autolink',member:same,reason:'같은 이메일 + 인증 완료'};
 return{result:'pwconfirm',member:same,reason:'같은 이메일 + 미인증'};
}
function judgeConnect(db,memberId,sub){
 const other=db.members.find(m=>m.googleSub===sub&&m.status!=='deleted'&&m.id!==memberId);
 if(other)return{result:'taken',reason:'다른 회원에 연결된 구글'};
 return{result:'link',reason:'연결 가능'};
}
function judgeEmailCheck(db,email,purpose){
 const m=db.members.find(x=>x.status!=='deleted'&&norm(x.email)===norm(email));
 if(purpose==='signup'){if(!m)return{result:'send'};if(!m.password&&m.googleSub)return{result:'google'};return{result:'dup'}}
 if(!m)return{result:'none'};if(!m.password)return{result:'google'};return{result:'send'};
}
function nickFor(g){if(g.name&&g.name.trim())return g.name.trim();return 'Member '+String(1000+Math.floor(Math.random()*9000))}
window.judgeGoogle=judgeGoogle;window.judgeConnect=judgeConnect;window.judgeEmailCheck=judgeEmailCheck;

/* ---------- 동작 ---------- */
let tt;
function toast(s){VIEW.toast=s;clearTimeout(tt);tt=setTimeout(()=>{VIEW.toast=null;render()},4000)}
function mail(to,type){DB.outbox.unshift({to,type,at:new Date().toLocaleTimeString('ko-KR')})}
function go(p,o={}){VIEW.page=p;VIEW.modal=null;VIEW.err={};Object.assign(VIEW,o);if(p==='login'){VIEW.expanded=!!DB.remembered;VIEW.form={email:DB.remembered||'',pw:'',rem:!!DB.remembered}}if(p==='login'&&DB.env==='alipay'){VIEW.page='home'}render()}
function afterLogin(m,msg){DB.session=m.id;DB.pwFail=0;if(msg)toast(msg);if(DB.booking){VIEW.page='bookinfo'}else{VIEW.page=VIEW.returnTo&&VIEW.returnTo!=='login'?VIEW.returnTo:'home'}VIEW.modal=null;VIEW.err={};render()}
function startGoogle(forWhat){VIEW.gFor=forWhat;
 if(forWhat==='login'&&(DB.env==='line'||DB.env==='kakao')){DB.envFrom=DB.env;VIEW.page='external';render();setTimeout(()=>{DB.env='browser';VIEW.page='login';VIEW.expanded=!!DB.remembered;render()},1200);return}
 VIEW.page='google';VIEW.gStep=(['ig-ios','ig-android','fb'].includes(DB.env))?'email':'choose';VIEW.gEmail='';VIEW.gErr='';render()}
function googleBack(){const back={login:'login',connect:'account',delete:'delete'}[VIEW.gFor];VIEW.page=back;render()}
function googlePick(sub){
 if(DB.nextGoogle==='error'){DB.nextGoogle='ok';VIEW.page={login:'login',connect:'account',delete:'delete'}[VIEW.gFor];toast('Google login failed. Please try again.');render();return}
 VIEW.page='spin';render();setTimeout(()=>googleDone(sub),500)}
function googleDone(sub){
 const g=gAcc(sub);
 if(VIEW.gFor==='connect'){const m=me();const j=judgeConnect(DB,m.id,sub);VIEW.page='account';if(j.result==='taken'){toast('This Google account is already linked to another K-Beauty Station account.')}else{m.googleSub=sub;m.linkNoticeShown=true;mail(m.email,'구글 연결 안내');toast('Your Google account is now linked.')}render();return}
 if(VIEW.gFor==='delete'){const m=me();if(m.googleSub!==sub){VIEW.page='delete';VIEW.modal='delGoogle';VIEW.err.del='Please log in with the Google account linked to this account.';render();return}m.status='deleted';m.googleSub=null;DB.session=null;VIEW.page='home';toast('Your account has been deleted.');render();return}
 const j=judgeGoogle(DB,sub);
 if(j.result==='login'){afterLogin(j.member);return}
 if(j.result==='suspended'){VIEW.page='login';VIEW.expanded=false;toast('This account has been suspended. Please contact customer support.');render();return}
 if(j.result==='signup-blocked'){VIEW.page='login';toast('This email is already linked to a different Google account. Please log in with your email.');render();return}
 if(j.result==='signup'){const m={id:++DB.seq,email:g.email.toLowerCase(),nickname:nickFor(g),verified:true,password:null,googleSub:sub,status:'active',via:'google',marketing:false,linkNoticeShown:true,termsAt:new Date().toLocaleString('ko-KR')};DB.members.push(m);afterLogin(m);return}
 if(j.result==='autolink'){const m=j.member;m.googleSub=sub;mail(m.email,'구글 연결 안내');let msg=null;if(!m.linkNoticeShown){msg='Your Google account is now linked. You can log in with Google or your email and password.';m.linkNoticeShown=true}afterLogin(m,msg);return}
 if(j.result==='pwconfirm'){VIEW.page='login';VIEW.pendingSub=sub;VIEW.modal='pwconfirm';VIEW.err={};VIEW.form.cpw='';render();return}
}
function confirmLink(){const g=gAcc(VIEW.pendingSub);const m=DB.members.find(x=>live(x)&&norm(x.email)===norm(g.email));const pw=document.getElementById('cpw').value;
 if(pw!==m.password){VIEW.err.cpw='Incorrect password.';VIEW.form.cpw=pw;render();return}
 m.googleSub=g.sub;m.verified=true;mail(m.email,'구글 연결 안내');m.linkNoticeShown=true;afterLogin(m,'Your Google account is now linked. You can log in with Google or your email and password.')}
function emailLogin(){const e=document.getElementById('le').value,p=document.getElementById('lp').value,rem=document.getElementById('lr').checked;VIEW.form={email:e,pw:p,rem};
 const m=DB.members.find(x=>live(x)&&norm(x.email)===norm(e));
 if(m&&m.status==='suspended'){toast('This account has been suspended. Please contact customer support.');render();return}
 if(m&&!m.password){VIEW.err.login='This account uses Google login. Please log in with Google.';render();return}
 if(!m||m.password!==p){VIEW.err.login='Incorrect email or password.';render();return}
 DB.remembered=rem?m.email:null;afterLogin(m)}
function sendCode(purpose){const id=purpose==='signup'?'se':'fe';const e=document.getElementById(id).value;VIEW.form[id]=e;if(!e.trim()){render();return}
 const j=judgeEmailCheck(DB,e,purpose);VIEW.err={};
 if(j.result==='google')VIEW.err[id]=purpose==='signup'?'This email is registered with Google. Please log in with Google.':'This account uses Google login. Please log in with Google.';
 else if(j.result==='dup')VIEW.err[id]='This email is already registered.';
 else if(j.result==='none')VIEW.err[id]='No account found with this email.';
 else toast('Verification code sent.');render()}
function setPw(){const a=document.getElementById('np').value,b=document.getElementById('cp').value;VIEW.err={};
 if(!a){VIEW.err.np='Please enter a password.';render();return}if(a!==b){VIEW.err.cp='Passwords do not match.';render();return}
 me().password=a;VIEW.modal=null;toast('Your password has been set.');render()}
function disconnect(){const m=me();m.googleSub=null;m.linkNoticeShown=false;mail(m.email,'구글 연결 해제 안내');VIEW.modal=null;toast('Google has been disconnected.');render()}
function delPw(){const m=me();const p=document.getElementById('dp').value;if(p!==m.password){VIEW.err.dp='Incorrect password.';render();return}m.status='deleted';m.googleSub=null;DB.session=null;VIEW.modal=null;VIEW.page='home';toast('Your account has been deleted.');render()}
function logout(){DB.session=null;VIEW.page='home';render()}
function toMy(){if(DB.session)go('account');else if(DB.env!=='alipay')go('login',{returnTo:'home'})}
function book(){VIEW.pick={date:null,time:null};go('store')}
function nextBook(){if(!VIEW.pick.date||!VIEW.pick.time)return;DB.booking={store:'DDYOU',date:VIEW.pick.date,time:VIEW.pick.time};if(DB.session)go('bookinfo');else go('login',{returnTo:'bookinfo'})}
function gLoginNext(){const v=document.getElementById('gi').value.trim();const g=DB.google.find(x=>norm(x.email)===norm(v));if(!g){VIEW.gErr="Couldn't find your Google Account";VIEW.gEmail=v;render();return}VIEW.gEmail=v;VIEW.gSub=g.sub;VIEW.gStep='pw';VIEW.gErr='';render()}

/* ---------- 화면 ---------- */
const hd=(t,l='back',r='home',lf,rf)=>`<div class="hd"><button onclick="${lf||"go('home')"}">${l?IC[l]:''}</button><span class="t">${t}</span><button onclick="${rf||"go('home')"}">${r?IC[r]:''}</button></div>`;
const gbtn=(pink=true,fn="startGoogle('login')")=>`<button class="btn ${pink?'gp':'gw'}" onclick="${fn}">${pink?`<span class="gdot">${G_SVG}</span>`:G_SVG}Continue with Google</button>`;
const notice='<p class="notice">By continuing with Google, you agree to our <a>Terms of Service</a> and <a>Privacy Policy</a>.</p>';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function envBar(){if(DB.env==='line')return'<div class="inapp"><b>LINE</b> k-beautystation.com</div>';if(DB.env==='kakao')return'<div class="inapp"><b>KakaoTalk</b> k-beautystation.com</div>';if(DB.env==='ig-ios'||DB.env==='ig-android')return'<div class="inapp"><b>Instagram</b> k-beautystation.com</div>';if(DB.env==='fb')return'<div class="inapp"><b>Facebook</b> k-beautystation.com</div>';if(DB.env==='browser'&&DB.envFrom)return'<div class="bchrome"><span>k-beautystation.com/en/auth/login'+(DB.booking?'?source=booking-schedule&amp;redirectUrl=…':'')+'</span></div>';return''}
const P={};
P.home=()=>`${hd('K-Beauty Station','menu','user','',"toMy()")}<div class="bd" style="padding-top:20px">
 <div class="ph" style="height:150px;margin-bottom:16px"></div>
 <div class="card"><h3>DDYOU</h3><p>Sinsa-dong, Gangnam-gu, Seoul</p><button class="btn" onclick="book()">Book</button></div>
 <div class="ph" style="height:90px"></div></div>`;
P.store=()=>{const d=['October 27, 2026','October 28, 2026','October 29, 2026'],t=['11:00','14:00','17:00'];return`${hd('DDYOU','back','home')}<div class="bd" style="padding-top:24px">
 <p class="lbl">Date</p><div class="chips">${d.map(x=>`<button class="chip ${VIEW.pick.date===x?'on':''}" onclick="VIEW.pick.date='${x}';render()">${x.replace(', 2026','')}</button>`).join('')}</div>
 <p class="lbl">Time</p><div class="chips">${t.map(x=>`<button class="chip ${VIEW.pick.time===x?'on':''}" onclick="VIEW.pick.time='${x}';render()">${x}</button>`).join('')}</div>
 <button class="btn" ${VIEW.pick.date&&VIEW.pick.time?'':'disabled'} onclick="nextBook()">Next</button></div>`};
P.login=()=>{const f=VIEW.form||{};const b=DB.booking?`<div class="bk"><p>Your selected date and time will be saved.</p><small>Booking ${DB.booking.store} for ${DB.booking.date} at ${DB.booking.time} (KST)</small></div>`:'';
 const email=VIEW.expanded?`<div class="or">or log in with email</div>
 <p class="lbl">Email <i>*</i></p><input class="in" id="le" placeholder="Email" value="${esc(f.email)}">
 <p class="lbl">Password <i>*</i></p><input class="in ${VIEW.err.login?'err':''}" id="lp" type="password" placeholder="Password" value="${esc(f.pw)}">
 ${VIEW.err.login?`<p class="errt">${VIEW.err.login}</p>`:''}
 <label class="chk"><input type="checkbox" id="lr" ${f.rem?'checked':''}>Remember Email</label>
 <button class="btn line" onclick="emailLogin()">Login</button>
 <div class="links"><a onclick="go('signup')">Sign up with email</a><b></b><a onclick="go('forgot')">Forgot Password</a></div>`:`<button class="emlink" onclick="VIEW.expanded=true;render()">Log in with email</button>`;
 let mdl='';if(VIEW.modal==='pwconfirm'){const g=gAcc(VIEW.pendingSub);mdl=`<div class="dim"><div class="md"><h4>You already have an account with this email</h4><p class="d">Enter your K-Beauty Station password once to link your Google account.</p>
 <input class="in" readonly value="${esc(g.email)}" style="margin-bottom:6px"><input class="in ${VIEW.err.cpw?'err':''}" id="cpw" type="password" placeholder="Password" value="${esc(VIEW.form.cpw)}" style="${VIEW.err.cpw?'':'margin-bottom:8px'}">${VIEW.err.cpw?`<p class="errt">${VIEW.err.cpw}</p>`:''}
 <p style="font-size:12px;margin:0 0 16px;text-align:right"><a style="text-decoration:underline;color:#555;cursor:pointer" onclick="go('forgot')">Forgot Password</a></p>
 <div class="two"><button class="btn line" onclick="VIEW.modal=null;VIEW.pendingSub=null;render()">Cancel</button><button class="btn" onclick="confirmLink()">Link and Log In</button></div></div></div>`}
 return`${hd('Login','back','home',"go('home')")}<div class="bd" style="padding-top:${DB.booking?20:32}px">${b}${gbtn()}${notice}${email}</div>${mdl}`};
P.google=()=>{if(VIEW.gStep==='choose'){return`<div class="gpage"><div class="gbar"><button onclick="googleBack()">✕</button>accounts.google.com</div><div class="gtop">${G_SVG}<h1>Choose an account</h1><p>to continue to K-Beauty Station</p></div>
 <div class="gacc">${DB.google.map(g=>`<button onclick="googlePick('${g.sub}')"><span class="gav">${esc((g.name||g.email)[0].toUpperCase())}</span><span>${esc(g.name||g.email)}<small>${esc(g.email)}</small></span></button>`).join('')}</div></div>`}
 if(VIEW.gStep==='email')return`<div class="gpage">${envBar()}<div class="gbar"><button onclick="googleBack()">✕</button>accounts.google.com</div><div class="gtop">${G_SVG}<h1>Sign in</h1><p>to continue to K-Beauty Station</p></div><div class="gform"><input id="gi" placeholder="Email or phone" value="${esc(VIEW.gEmail)}">${VIEW.gErr?`<p class="gerr">${VIEW.gErr}</p>`:''}</div><div class="gnext"><a onclick="googleBack()">Cancel</a><button onclick="gLoginNext()">Next</button></div></div>`;
 return`<div class="gpage">${envBar()}<div class="gbar"><button onclick="googleBack()">✕</button>accounts.google.com</div><div class="gtop">${G_SVG}<h1>Welcome</h1><p>${esc(VIEW.gEmail)}</p></div><div class="gform"><input type="password" placeholder="Enter your password"></div><div class="gnext"><a onclick="VIEW.gStep='email';render()">Back</a><button onclick="googlePick(VIEW.gSub)">Next</button></div></div>`};
P.spin=()=>'<div class="gpage"><div class="spin"><i></i>accounts.google.com</div></div>';
P.external=()=>`<div class="inapp"><b>${DB.envFrom==='line'?'LINE':'KakaoTalk'}</b> k-beautystation.com</div><div class="spin"><i></i>Opening in your browser</div>`;
P.signup=()=>{const e=VIEW.err.se;return`${hd('Sign Up','back','home',"go('login')")}<div class="bd">
 <p class="lbl">Nickname <i>*</i></p><input class="in" placeholder="Nickname">
 <p class="lbl">Email <i>*</i></p><input class="in ${e?'err':''}" id="se" placeholder="Email" value="${esc(VIEW.form.se)}" oninput="VIEW.form.se=this.value">${e?`<p class="errt">${e}</p>`:''}
 <button class="btn" style="margin-bottom:20px" onclick="sendCode('signup')">Get Verification Code</button>
 <p class="lbl">Password <i>*</i></p><input class="in" type="password" placeholder="Password"></div>`};
P.forgot=()=>{const e=VIEW.err.fe;return`<div class="hd"><button onclick="go('login')">${IC.back}</button><span></span><span style="width:24px"></span></div><div class="bd" style="padding:40px 16px"><p class="title">Forgot Password</p>
 <p class="lbl">Email <i>*</i></p><input class="in ${e?'err':''}" id="fe" placeholder="Email" value="${esc(VIEW.form.fe)}">${e?`<p class="errt">${e}</p>`:''}
 <button class="btn" style="margin-top:30px;height:50px" onclick="sendCode('forgot')">Get Verification Code</button></div>`};
P.bookinfo=()=>{const m=me();const b=DB.booking;return`${hd('Booking Information','back','home')}<div class="bd" style="padding-top:24px">
 ${b?`<div class="card"><h3>${b.store}</h3><p style="margin:0">${b.date} · ${b.time} (KST)</p></div>`:''}
 <p class="lbl">Email <i>*</i></p><input class="in" readonly value="${esc(m?m.email:'')}" style="margin-bottom:4px"><p style="margin:0 0 20px;font-size:12px"><span class="ver" style="margin:0">Verified</span></p>
 <p class="lbl">Passport name <i>*</i></p><input class="in" placeholder="Passport name">
 <p class="lbl">Mobile phone number <i>*</i></p><input class="in" placeholder="Phone number"></div>`};
P.account=()=>{const m=me();if(!m)return P.home();const g=!!m.googleSub,hasPw=!!m.password;
 let mdl='';
 if(VIEW.modal==='setpw')mdl=`<div class="dim btm"><div class="md sheet"><h4>Set Password</h4><p class="d">Create a password to also log in with your email.</p>
 <p class="lbl">New Password <i>*</i></p><input class="in ${VIEW.err.np?'err':''}" id="np" type="password" placeholder="Password">${VIEW.err.np?`<p class="errt">${VIEW.err.np}</p>`:''}
 <p class="lbl">Confirm Password <i>*</i></p><input class="in ${VIEW.err.cp?'err':''}" id="cp" type="password" placeholder="Confirm Password">${VIEW.err.cp?`<p class="errt">${VIEW.err.cp}</p>`:''}
 <div class="two"><button class="btn line" onclick="VIEW.modal=null;VIEW.err={};render()">Cancel</button><button class="btn" onclick="setPw()">Save</button></div></div></div>`;
 if(VIEW.modal==='disc')mdl=`<div class="dim"><div class="md"><h4>Disconnect Google?</h4><p class="d">You won't be able to log in with Google. Use your email and password to log in.</p><div class="two"><button class="btn line" onclick="VIEW.modal=null;render()">Cancel</button><button class="btn" onclick="disconnect()">Disconnect</button></div></div></div>`;
 return`${hd('Account Settings','back','home')}<div class="bd" style="padding-top:24px"><p class="sec">Account</p>
 <div class="kv"><span class="k">Email</span><span class="v">${esc(m.email)}</span></div>
 <div class="kv"><span class="k">Password</span><span class="v"><button class="sbtn" onclick="${hasPw?'':"VIEW.modal='setpw';VIEW.err={};render()"}">${hasPw?'Change Password':'Set Password'}</button></span></div>
 <div class="kv"><span class="k">Google</span><span class="v">${g?`<span class="pill">Connected</span><button class="sbtn" ${hasPw?'':'disabled'} onclick="VIEW.modal='disc';render()">Disconnect</button>`:`<button class="sbtn" onclick="startGoogle('connect')">Connect</button>`}</span></div>
 ${g&&!hasPw?'<p class="hint">Set a password before disconnecting Google.</p>':''}
 <div class="kv" style="margin-top:8px"><span class="k">Marketing emails</span><span class="v"><button class="tog ${m.marketing?'on':''}" onclick="me().marketing=!me().marketing;render()"></button></span></div>
 <div class="foot"><a onclick="logout()">Logout</a><a onclick="go('delete')">Delete Account</a></div></div>${mdl}`};
P.delete=()=>{const m=me();if(!m)return P.home();let mdl='';
 if(VIEW.modal==='delGoogle')mdl=`<div class="dim"><div class="md"><h4>Confirm with Google</h4><p class="d">To delete your account, log in with Google once more.</p>${VIEW.err.del?`<p class="errt">${VIEW.err.del}</p>`:''}<div class="stack">${gbtn(false,"startGoogle('delete')")}<button class="btn line" onclick="VIEW.modal=null;VIEW.err={};render()">Cancel</button></div></div></div>`;
 if(VIEW.modal==='delPw')mdl=`<div class="dim"><div class="md"><h4>Delete Account</h4><p class="d">Enter your password to delete your account.</p><input class="in ${VIEW.err.dp?'err':''}" id="dp" type="password" placeholder="Password">${VIEW.err.dp?`<p class="errt">${VIEW.err.dp}</p>`:''}<div class="two"><button class="btn line" onclick="VIEW.modal=null;VIEW.err={};render()">Cancel</button><button class="btn" onclick="delPw()">Delete</button></div></div></div>`;
 return`${hd('Delete Account','back','home',"go('account')")}<div class="bd" style="padding-top:20px"><div class="ph" style="height:180px;margin-bottom:20px"></div><div class="ph" style="height:60px;margin-bottom:24px"></div>
 <button class="btn" onclick="VIEW.modal='${m.password?'delPw':'delGoogle'}';VIEW.err={};render()">Delete Account</button></div>${mdl}`};

function render(){const a=document.getElementById('app');const fn=P[VIEW.page]||P.home;const bar=(VIEW.page==='google'||VIEW.page==='external')?'':envBar();
 a.innerHTML=bar+fn()+(VIEW.toast?`<div class="toast">${esc(VIEW.toast)}</div>`:'');
 try{parent.postMessage({type:'gl-render',page:VIEW.page},'*')}catch(e){}}
window.render=render;window.go=go;window.resetDB=resetDB;window.startGoogle=startGoogle;window.googlePick=googlePick;
render();
</script>
</body>
</html>
