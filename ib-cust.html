<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고객 메신저 (모의)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:#111;background:#b2c7da;display:flex;flex-direction:column}
.top{flex:none;height:52px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e5e7eb}
.top .av{width:32px;height:32px;border-radius:50%;background:#1f1f1f;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.top b{font-size:15px}
.top small{display:block;color:#888;font-size:11px}
.note{flex:none;background:#f5f5f5;color:#888;font-size:11px;text-align:center;padding:4px 8px}
.log{flex:1;overflow-y:auto;padding:12px 10px 16px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;flex-direction:column;max-width:82%}
.r.me{align-self:flex-end;align-items:flex-end}
.r.biz{align-self:flex-start}
.r .nm{font-size:11px;color:#3d4b5c;margin:0 0 3px 2px}
.b{padding:8px 11px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.me .b{background:#fee500;border-top-right-radius:4px}
.biz .b{background:#fff;border-top-left-radius:4px}
.t{font-size:10px;color:#4d5b6b;margin-top:2px}
.sys{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.25);border-radius:10px;padding:2px 10px}
.img{width:120px;height:90px;border-radius:10px;background:#dfe6ee;display:flex;align-items:center;justify-content:center;color:#667;font-size:12px}
.lk{margin-top:6px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;overflow:hidden;cursor:pointer}
.lk .h{padding:8px 10px;font-weight:700;font-size:13px}
.lk .u{padding:0 10px 8px;color:#1677ff;font-size:11px;word-break:break-all}
.in{flex:none;display:flex;gap:6px;padding:8px;background:#fff;border-top:1px solid #e5e7eb}
.in textarea{flex:1;height:38px;resize:none;border:1px solid #ddd;border-radius:18px;padding:9px 12px;font:inherit;font-size:13.5px}
.in button{border:0;border-radius:18px;padding:0 12px;background:#1f1f1f;color:#fff;font:inherit;font-size:13px;cursor:pointer}
.in .ph{background:#eef0f3;color:#333}
.sheet{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:16px 16px 20px;z-index:5}
.sheet h3{font-size:15px;margin-bottom:10px}
.sheet dl{display:grid;grid-template-columns:70px 1fr;gap:6px 8px;font-size:13px;line-height:1.45}
.sheet dt{color:#888}
.sheet p{font-size:11.5px;color:#888;margin-top:10px;line-height:1.5}
.sheet button{margin-top:12px;width:100%;height:40px;border:0;border-radius:8px;background:#e8537a;color:#fff;font:inherit;font-weight:700}
.mk [data-new]{outline:2px dashed #e91e63;outline-offset:2px}
</style>
</head>
<body>
<div class="top"><div class="av">KBS</div><div><b id="title">K-Beauty Station</b><small id="sub"></small></div></div>
<div class="note">고객 메신저 (모의 화면). 실제 메신저 앱 화면이 아닙니다.</div>
<div class="log" id="log"></div>
<div class="in"><button class="ph" id="photo" title="사진 보내기">사진</button><textarea id="tx" placeholder="메시지 입력 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea><button id="send">보내기</button></div>
<script>
'use strict';
var P=parent.IB;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hm(ts){return ts.slice(11,16);}
function draw(){
 if(!P||!P.DB)return;
 var S=P.S,r=P.room(P.CH_ROOM[S.ch]);
 document.body.classList.toggle('mk',!!S.mark);
 document.getElementById('sub').textContent=S.ch==='CS채팅'?'고객지원 채팅 (인앱)':S.ch+' 공식 계정';
 var h='',sess=0;
 r.msgs.forEach(function(m,i){
  if(m.newSession)h+='<div class="sys">새 상담</div>';
  if(m.who==='cust'){h+='<div class="r me">'+(m.kind==='image'?'<div class="img">사진</div>':'<div class="b">'+esc(m.text)+'</div>')+'<div class="t">'+hm(m.at)+'</div></div>';}
  else{
   h+='<div class="r biz"><div class="nm">K-Beauty Station</div><div class="b">'+esc(m.text)
    +(m.link?'<div class="lk" data-new data-link="'+i+'"><div class="h">예약하기</div><div class="u">'+esc(m.link.url)+'</div></div>':'')
    +'</div><div class="t">'+hm(m.at)+'</div></div>';
  }
 });
 var log=document.getElementById('log');log.innerHTML=h;
 var sh=document.querySelector('.sheet');if(sh)sh.remove();
 if(S.cust.sheet!=null&&r.msgs[S.cust.sheet]&&r.msgs[S.cust.sheet].link){
  var L=r.msgs[S.cust.sheet].link,d=document.createElement('div');d.className='sheet';d.setAttribute('data-new','');
  d.innerHTML='<h3>예약 화면 (링크로 열림)</h3><dl><dt>스토어</dt><dd>'+esc(P.DB.store.name)+'</dd><dt>날짜</dt><dd>'+esc(P.fmtDay(L.date,'ko'))+'</dd><dt>시간</dt><dd>'+esc(L.time)+' (선택됨)</dd><dt>요청사항</dt><dd>'+esc(L.memo)+'</dd></dl>'
   +'<p>정책 P2: 날짜·시간이 선택되고 요청사항(메모)이 채워진 상태로 열립니다. FO 예약 화면이 이 링크를 지원하는지는 개발 확인이 필요해, 실제 FO 화면 대신 담기는 값만 보여 줍니다.</p><button type="button" id="closeSheet">닫기</button>';
  document.body.appendChild(d);
 }
 log.scrollTop=log.scrollHeight;
}
function send(){var t=document.getElementById('tx'),v=t.value;if(!v.trim())return;t.value='';P.custSend(P.CH_ROOM[P.S.ch],v);}
document.getElementById('send').onclick=send;
document.getElementById('photo').onclick=function(){P.custSend(P.CH_ROOM[P.S.ch],'(사진)','image');};
document.getElementById('tx').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
document.addEventListener('click',function(e){var l=e.target.closest('[data-link]');if(l){P.S.cust.sheet=+l.getAttribute('data-link');draw();return;}if(e.target.id==='closeSheet'){P.S.cust.sheet=null;draw();}});
window.draw=draw;
if(P&&P.ready)P.ready();
</script>
</body>
</html>
