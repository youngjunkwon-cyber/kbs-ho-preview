<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알리페이 채널 분기 · 시안 검수</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px;color:#262626;background:#f5f6f8;overflow:hidden}
.app{display:flex;height:100vh}
.left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid #e0e0e0}
.left iframe{flex:1;width:100%;border:0;background:#fff}
.lbar{height:44px;flex:0 0 44px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:8px;padding:0 12px}
.lbar .t{font-size:13px;font-weight:600}
.lbar .sp{flex:1}
.right{flex:0 0 440px;display:flex;flex-direction:column;background:#fff;min-width:0}
.right.wide{flex-basis:640px}
.top{flex:0 0 auto;border-bottom:1px solid #e8e8e8;padding:12px 16px}
.top h1{margin:0 0 8px;font-size:15px;font-weight:700}
.top h1 .sub{font-size:11px;color:#8c8c8c;font-weight:400;margin-left:6px}
.btn{padding:5px 10px;border:1px solid #d9d9d9;background:#fff;border-radius:4px;cursor:pointer;color:#434343;font-size:12px;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#e8537a;color:#e8537a}
.btn.pri{background:#e8537a;border-color:#e8537a;color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.btn.on{background:#1f1f1f;border-color:#1f1f1f;color:#fff}
.row1{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.stat{display:flex;gap:12px;align-items:center;font-size:12px;color:#595959}
.stat b{color:#262626;font-size:14px}
.bar{height:5px;border-radius:3px;background:#f0f0f0;overflow:hidden;flex:1;min-width:80px;display:flex}
.bar i{display:block;height:100%}
.bar .p{background:#52c41a}.bar .f{background:#ff4d4f}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 60px}
.grp{margin-bottom:16px}
.grp h2{font-size:12px;margin:0 0 6px;color:#8c8c8c;font-weight:600;display:flex;gap:6px;align-items:center}
.grp h2 .n{font-weight:400;color:#bfbfbf}
.tc{border:1px solid #f0f0f0;border-radius:6px;padding:10px 12px;margin-bottom:6px;background:#fff}
.tc.pass{border-color:#b7eb8f;background:#fcfffa}
.tc.fail{border-color:#ffa39e;background:#fffafa}
.tc .hd{display:flex;gap:8px;align-items:flex-start}
.tc .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#8c8c8c;flex:0 0 52px;padding-top:2px}
.tc .ti{font-weight:600;flex:1;line-height:1.45;font-size:13px}
.tc .acts{display:flex;gap:4px;flex:0 0 auto}
.tc .acts .btn{padding:3px 8px;font-size:11px}
.tc .acts .btn.p.on{background:#52c41a;border-color:#52c41a;color:#fff}
.tc .acts .btn.f.on{background:#ff4d4f;border-color:#ff4d4f;color:#fff}
.tc dl{margin:8px 0 0 60px;display:grid;grid-template-columns:36px 1fr;gap:3px 8px;font-size:12px;line-height:1.55}
.tc dt{color:#8c8c8c}
.tc dd{margin:0}
.tc .go{margin:8px 0 0 60px}
.tc .go .btn{padding:3px 9px;font-size:11px}
.memo{margin:8px 0 0 60px;display:none}
.memo.show{display:block}
.memo textarea{width:100%;min-height:50px;padding:6px 8px;border:1px solid #d9d9d9;border-radius:4px;font-family:inherit;font-size:12px;resize:vertical;line-height:1.5}
.memo textarea:focus{outline:none;border-color:#e8537a}
.memo .lbl{font-size:11px;color:#8c8c8c;margin-bottom:3px}
.hint{font-size:11px;color:#8c8c8c;line-height:1.6;margin:0 0 12px}
.empty{border:1px dashed #d9d9d9;border-radius:6px;padding:24px;text-align:center;color:#8c8c8c;font-size:12px}
dialog{border:none;border-radius:8px;padding:0;max-width:720px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{padding:14px 18px;border-bottom:1px solid #f0f0f0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:14px 18px}
dialog .df{padding:10px 18px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}
dialog textarea{width:100%;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;padding:10px;border:1px solid #d9d9d9;border-radius:4px}
.x{background:none;border:none;font-size:15px;cursor:pointer;color:#8c8c8c}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="lbar">
      <span class="t">시안</span>
      <button class="btn" id="reload">새로고침</button>
      <button class="btn" id="resetPrev">시드 초기화</button>
      <span class="sp"></span>
      <button class="btn" id="widen">체크리스트 넓게</button>
      <button class="btn" id="newwin">새 창</button>
    </div>
    <iframe id="prev" src="bo-alipay-channel.html"></iframe>
  </div>
  <div class="right" id="right">
    <div class="top">
      <h1>검수 체크리스트<span class="sub" id="cnt"></span></h1>
      <div class="row1">
        <button class="btn on" data-f="all">전체</button>
        <button class="btn" data-f="todo">미확인</button>
        <button class="btn" data-f="fail">실패만</button>
        <span style="flex:1"></span>
        <button class="btn pri" id="copy">결과 복사</button>
        <button class="btn" id="reset">기록 초기화</button>
      </div>
      <div class="stat">
        <span>통과 <b id="nPass">0</b></span>
        <span>실패 <b id="nFail">0</b></span>
        <span>미확인 <b id="nTodo">0</b></span>
        <div class="bar"><i class="p" id="barP"></i><i class="f" id="barF"></i></div>
        <span id="pct">0%</span>
      </div>
    </div>
    <div class="scroll">
      <p class="hint">케이스의 <b>이 화면 열기</b>를 누르면 왼쪽 시안이 그 상태로 바로 맞춰집니다.<br>
      실패를 누르면 메모 칸이 열립니다. 기록은 이 브라우저에 저장됩니다.</p>
      <div id="list"></div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dh">결과<button class="x" onclick="document.getElementById('dlg').close()">✕</button></div>
  <div class="db"><textarea id="out" readonly></textarea></div>
  <div class="df">
    <button class="btn" onclick="document.getElementById('dlg').close()">닫기</button>
    <button class="btn pri" id="doCopy">클립보드로 복사</button>
  </div>
</dialog>

<script>
/* [id, 제목, 절차, 기대, 시안 세팅 코드] */

["P-04","알리페이 버튼이 없는 상품","P8 모공 타이트닝 수정","안내: 알리페이 앱 버튼이 없어 알리페이에 노출되지 않습니다. 아래 버튼 설정에서 1개 이상 켜면 노출됩니다. 노출 라디오는 조작 가능","VIEW.lang='중국어(간체)';go('p-list');openProduct('P8');VIEW.tab=1;render()"],
["P-05","소속 스토어가 미노출","언어 중국어(번체) · P4 눈매교정 상담 수정","노출 라디오와 알리페이 칸이 모두 잠김. 안내: 소속 스토어가 미노출입니다. 스토어 정보 관리 > 노출정보에서 변경할 수 있습니다. 목록 사유 = 스토어 설정","VIEW.lang='중국어(번체)';go('p-list');openProduct('P4');VIEW.tab=1;render()"],
["P-06","대상 언어가 아닌 상품","언어 일본어 · P6 수정","노출 라디오와 알리페이 칸이 모두 잠김. 안내 문구는 없음. 목록의 두 칼럼은 -","VIEW.lang='일본어';go('p-list');openProduct('P6');VIEW.tab=1;render()"],
["P-07","기본 설정 상품","언어 영어 · P3 아쿠아 필링 수정","스토어 설정 적용 = 기본 설정. 표 전체 잠금. 안내: 기본 설정 적용 중입니다. 개별 설정을 선택하면 수정할 수 있습니다.","VIEW.lang='영어';go('p-list');openProduct('P3');VIEW.tab=1;render()"],

["P-09","기본 설정 → 개별 설정","P3 수정 · 개별 설정으로 전환한 상태","알리페이 칸이 모두 꺼진 채 풀림. 웹 값은 스토어에서 가져옴","VIEW.lang='영어';go('p-list');openProduct('P3');VIEW.tab=1;setMode('개별 설정')"],
["P-10","외부링크·메신저는 알리페이 미지원","P2 수정 · 두 행의 알리페이 칸","두 칸 모두 회색 잠금. 안내: 알리페이 앱 미지원 항목입니다.","VIEW.lang='중국어(간체)';go('p-list');openProduct('P2');VIEW.tab=1;render()"],
["P-11","상담접수를 끄면 문의하기도 꺼진다","P2 수정에서 알리페이 상담접수 OFF","문의하기 통합도 함께 OFF","VIEW.lang='중국어(간체)';go('p-list');openProduct('P2');VIEW.tab=1;render()"],
["P-12","알리페이 칸을 비우고 저장","알리페이 칸 모두 OFF → OK","확인: 알리페이 앱 버튼이 없습니다. 저장하면 상품이 알리페이에 노출되지 않습니다. 저장할까요? 취소=모달 유지, 저장=닫힘","VIEW.lang='중국어(간체)';go('p-list');openProduct('P2');VIEW.tab=1;ROWS_PRODUCT.forEach(function(r){P('P2').btns[r.k].ali=false});render()"],
["P-13","세 번째 버튼은 막힌다","P2 수정에서 웹 외부링크 ON","경고: 웹 버튼은 2개까지 켤 수 있습니다. 현재 상담접수, 채팅이 켜져 있습니다. 토글이 원위치","VIEW.lang='중국어(간체)';go('p-list');openProduct('P2');VIEW.tab=1;render()"]
]],
["상품 목록", [
["PL-01","신규 칼럼 위치","상품정보관리","알리페이 노출·사유 칼럼이 히든 여부 바로 뒤","VIEW.lang='중국어(간체)';go('p-list')"],
["PL-02","사유 값 목록","사유 필터 열기","전체 / 직접 끔 / 스토어 설정 / 알리페이 버튼 없음","VIEW.lang='중국어(간체)';go('p-list')"],
["PL-03","사유로 거르기","사유 = 알리페이 버튼 없음","P8 모공 타이트닝만 남음","VIEW.lang='중국어(간체)';go('p-list')"],
["PL-04","대상 언어가 아닌 언어","언어 = 일본어","두 칼럼이 - 로 표시되고 두 필터가 잠김. 잠기기 전 고른 값은 전체로 되돌아감","VIEW.lang='중국어(간체)';go('p-list')"]
]],
["스토어 정보 수정", [
["S-01","노출 설정 위치","S1 준오헤어 명동점 · 노출정보","알리페이 노출이 언어 탭 위에 있음. 안내: 스토어는 언어 구분이 없습니다. 이 설정은 모든 언어에 적용됩니다.","go('s-edit','S1');VIEW.sect=2;render()"],
["S-02","미노출 선택","S1 노출정보에서 미노출 선택","안내: 미노출로 저장하면 이 스토어 상품 12건도 알리페이에 노출되지 않습니다. 이 시점에는 확인 창이 뜨지 않음","go('s-edit','S1');VIEW.sect=2;render()"],
["S-03","미노출 저장 확인","S-02에서 저장","확인 창에 등록된 상품 12건 + 배너 2건과 기획전 1건 + 지워지는 것은 없다 + 웹 노출에는 영향이 없습니다","go('s-edit','S1');VIEW.sect=2;setVis('store','미노출')"],

["S-05","같은 화면 두 번째 왕복","S-04를 한 번 더 반복","두 번째에도 확인 창이 뜸","go('s-edit','S4');VIEW.sect=2;setVis('store','노출');VIEW.savedVis='노출';render()"],

["S-10","스토어 목록은 언어 무관","상품 목록에서 언어를 일본어로 바꾼 뒤 스토어 목록","알리페이 노출·사유 필터가 잠기지 않음","VIEW.lang='일본어';go('p-list')"],
["S-11","버튼 설정 표 폭","S1 버튼 및 메신저 설정과 상품 수정 모달 비교","스토어는 웹·알리페이 각 220, 상품 모달은 각 180","go('s-edit','S1');VIEW.sect=11;render()"]

]],

var KEY = 'kbs_qa_alipay';
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
var filter = 'all';
var list = document.getElementById('list');
var frame = document.getElementById('prev');

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function get(id) { return state[id] || { v: '', m: '' }; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* 1차 검수(2026-09-11)에서 통과로 기록한 항목을 되살린다. 기기마다 한 번만 적용한다 */
var SEED1 = ['P-01', 'P-02', 'P-03', 'P-04', 'P-07', 'P-08', 'P-10', 'P-11', 'P-12', 'P-13', 'PL-02', 'PL-03', 'PL-04'];
if (!state.seed1) {
  SEED1.forEach(function (id) { if (!state[id]) state[id] = { v: 'p', m: '' }; });
  state.seed1 = 1;
  save();
}

function runInPreview(code, alsoReset) {
  var w = frame.contentWindow;
  try {
    if (alsoReset && w.resetDB) w.resetDB();
    if (code) w.eval(code);
    frame.contentWindow.focus();
    return true;
  } catch (e) {
    alert('시안을 제어하지 못했습니다.\n' + e.message + '\n\n파일을 직접 연 경우 브라우저가 막습니다. 배포 주소로 열어 주세요.');
    return false;
  }
}

function render() {
  list.innerHTML = '';
  var total = 0, pass = 0, fail = 0;
  DATA.forEach(function (g) { g[1].forEach(function (c) { total++; var v = get(c[0]).v; if (v === 'p') pass++; else if (v === 'f') fail++; }); });
  document.getElementById('nPass').textContent = pass;
  document.getElementById('nFail').textContent = fail;
  document.getElementById('nTodo').textContent = total - pass - fail;
  document.getElementById('barP').style.width = (pass / total * 100) + '%';
  document.getElementById('barF').style.width = (fail / total * 100) + '%';
  document.getElementById('pct').textContent = Math.round((pass + fail) / total * 100) + '%';
  document.getElementById('cnt').textContent = total + '건';

  var any = false;
  DATA.forEach(function (g) {
    var cards = [];
    g[1].forEach(function (c) {
      var st = get(c[0]);
      if (filter === 'fail' && st.v !== 'f') return;
      if (filter === 'todo' && st.v) return;
      any = true;
      var d = document.createElement('div');
      d.className = 'tc' + (st.v === 'p' ? ' pass' : st.v === 'f' ? ' fail' : '');
      d.innerHTML =
        '<div class="hd"><span class="id">' + c[0] + '</span><span class="ti">' + esc(c[1]) + '</span>' +
        '<span class="acts">' +
        '<button class="btn p' + (st.v === 'p' ? ' on' : '') + '" data-v="p">통과</button>' +
        '<button class="btn f' + (st.v === 'f' ? ' on' : '') + '" data-v="f">실패</button>' +
        '</span></div>' +
        '<dl><dt>절차</dt><dd>' + esc(c[2]) + '</dd><dt>기대</dt><dd>' + esc(c[3]) + '</dd></dl>' +
        (c[4] ? '<div class="go"><button class="btn goBtn">이 화면 열기</button></div>' : '') +
        '<div class="memo' + (st.v === 'f' || st.m ? ' show' : '') + '">' +
        '<div class="lbl">무엇이 어떻게 달랐나요</div>' +
        '<textarea placeholder="예: 안내 문구가 안 뜸 / 토글이 안 잠김 / 숫자가 12가 아니라 3">' + esc(st.m) + '</textarea></div>';
      d.querySelectorAll('.acts .btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var cur = get(c[0]);
          var nv = cur.v === b.dataset.v ? '' : b.dataset.v;
          state[c[0]] = { v: nv, m: cur.m || '' };
          save(); render();
          if (nv === 'f') { var el = document.querySelector('[data-focus="' + c[0] + '"]'); if (el) el.focus(); }
        });
      });
      var gb = d.querySelector('.goBtn');
      if (gb) gb.addEventListener('click', function () { runInPreview(c[4], true); });
      var ta = d.querySelector('textarea');
      ta.setAttribute('data-focus', c[0]);
      ta.addEventListener('input', function () { var cur = get(c[0]); state[c[0]] = { v: cur.v, m: ta.value }; save(); });
      cards.push(d);
    });
    if (!cards.length) return;
    var wrap = document.createElement('div');
    wrap.className = 'grp';
    var h = document.createElement('h2');
    h.innerHTML = esc(g[0]) + '<span class="n">' + cards.length + '</span>';
    wrap.appendChild(h);
    cards.forEach(function (x) { wrap.appendChild(x); });
    list.appendChild(wrap);
  });
  if (!any) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = filter === 'fail' ? '실패로 표시한 케이스가 없습니다.' : '미확인 케이스가 없습니다.';
    list.appendChild(e);
  }
}

function buildReport() {
  var lines = [], pass = 0, fail = 0, todo = 0;
  DATA.forEach(function (g) {
    var rows = [];
    g[1].forEach(function (c) {
      var st = get(c[0]);
      if (st.v === 'p') pass++; else if (st.v === 'f') fail++; else todo++;
      if (st.v !== 'f') return;
      rows.push('- ' + c[0] + ' ' + c[1] + (st.m ? '\n  ' + st.m.replace(/\n/g, '\n  ') : '\n  (메모 없음)'));
    });
    if (rows.length) { lines.push('[' + g[0] + ']'); lines.push(rows.join('\n')); lines.push(''); }
  });
  return '알리페이 채널 분기 시안 검수 결과\n통과 ' + pass + ' / 실패 ' + fail + ' / 미확인 ' + todo + '\n\n' +
    (lines.length ? '실패 건\n\n' + lines.join('\n') : '실패 건 없음');
}

document.querySelectorAll('[data-f]').forEach(function (b) {
  b.addEventListener('click', function () {
    filter = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });
});
document.getElementById('reload').addEventListener('click', function () { frame.src = frame.src; });
document.getElementById('resetPrev').addEventListener('click', function () { runInPreview('', true); });
document.getElementById('newwin').addEventListener('click', function () { window.open('bo-alipay-channel.html', '_blank'); });
document.getElementById('widen').addEventListener('click', function () {
  var r = document.getElementById('right');
  r.classList.toggle('wide');
  this.textContent = r.classList.contains('wide') ? '체크리스트 좁게' : '체크리스트 넓게';
});
document.getElementById('copy').addEventListener('click', function () {
  document.getElementById('out').value = buildReport();
  document.getElementById('dlg').showModal();
});
document.getElementById('doCopy').addEventListener('click', function () {
  var ta = document.getElementById('out');
  ta.removeAttribute('readonly'); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  if (navigator.clipboard) { navigator.clipboard.writeText(ta.value).catch(function () {}); }
  ta.setAttribute('readonly', '');
  var b = this; b.textContent = '복사했습니다';
  setTimeout(function () { b.textContent = '클립보드로 복사'; }, 1500);
});
document.getElementById('reset').addEventListener('click', function () {
  if (!confirm('기록한 통과·실패와 메모를 모두 지웁니다. 계속할까요?')) return;
  state = { seed1: 1 }; save(); render();
});
render();
</script>
</body>
