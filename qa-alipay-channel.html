<script>
/* 브라우저에 따라 confirm()이 항상 false이고 prompt()가 지원되지 않는다. 페이지 자체 모달을 쓴다 */
function askBox(opt, done) {
  var d = document.getElementById('ask');
  document.getElementById('askTitle').textContent = opt.title || '확인';
  document.getElementById('askMsg').textContent = opt.message || '';
  var ta = document.getElementById('askIn');
  ta.style.display = opt.input ? 'block' : 'none';
  ta.value = '';
  var yes = document.getElementById('askYes'), no = document.getElementById('askNo');
  yes.textContent = opt.okText || '확인';
  no.style.display = opt.alert ? 'none' : '';
  function cleanup() { yes.onclick = null; no.onclick = null; d.onclose = null; }
  yes.onclick = function () { var v = opt.input ? ta.value : true; cleanup(); d.close(); if (done) done(v); };
  no.onclick = function () { cleanup(); d.close(); if (done) done(null); };
  d.onclose = function () { cleanup(); };
  d.showModal();
  if (opt.input) setTimeout(function () { ta.focus(); }, 0);
}
function tellBox(msg, title) { askBox({ title: title || '알림', message: msg, alert: true, okText: '닫기' }); }

["S-01","노출 채널 위치","S1 준오헤어 명동점 · 기본정보","노출 채널 라디오가 지원언어 바로 아래. 안내: 지원언어와 무관하게 이 설정 하나가 모든 언어에 적용됩니다. 이 스토어의 상품과 칼럼도 같은 채널을 따릅니다.","go('s-edit','S1');VIEW.sect=0;render()"],

var KEY = 'kbs_qa_alipay_v3';
var state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
var filter = 'all';
var list = document.getElementById('list');
var frame = document.getElementById('prev');

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function get(id) { return state[id] || { v: '', m: '' }; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }


/* 필요한 시안 파일로 바꾼 뒤 세팅 코드를 실행한다 */
function openCase(src, code) {
  var cur = (frame.getAttribute('src') || '').split('/').pop();
  if (cur === src) { runInPreview(code, true); return; }
  frame.addEventListener('load', function once() {
    frame.removeEventListener('load', once);
    runInPreview(code, true);
  });
  frame.setAttribute('src', src);
}

function runInPreview(code, alsoReset) {
  var w = frame.contentWindow;
  try {
    if (alsoReset && w.resetDB) w.resetDB();
    if (code) w.eval(code);
    frame.contentWindow.focus();
    return true;
  } catch (e) {
    tellBox('시안을 제어하지 못했습니다.\n' + e.message + '\n\n파일을 직접 연 경우 브라우저가 막습니다. 배포 주소로 열어 주세요.');
    return false;
  }
}

function render() {
  list.innerHTML = '';
  var total = 0, pass = 0, fail = 0;
  DATA.forEach(function (g) {
    if (area !== 'all' && gmeta(g[0])[0] !== area) return;
    g[1].forEach(function (c) { total++; var v = get(c[0]).v; if (v === 'p') pass++; else if (v === 'f') fail++; });
  });
  document.getElementById('nPass').textContent = pass;
  document.getElementById('nFail').textContent = fail;
  document.getElementById('nTodo').textContent = total - pass - fail;
  document.getElementById('barP').style.width = (pass / total * 100) + '%';
  document.getElementById('barF').style.width = (fail / total * 100) + '%';
  document.getElementById('pct').textContent = Math.round((pass + fail) / total * 100) + '%';
  document.getElementById('cnt').textContent = total + '건';

  var any = false;
  DATA.forEach(function (g) {
    if (area !== 'all' && gmeta(g[0])[0] !== area) return;
    var cards = [];
    g[1].forEach(function (c) {
      var st = get(c[0]);
      if (filter === 'fail' && st.v !== 'f') return;
      if (filter === 'todo' && st.v) return;
      any = true;
      var d = document.createElement('div');
      d.className = 'tc' + (st.v === 'p' ? ' pass' : st.v === 'f' ? ' fail' : '');
      d.innerHTML =
        '<div class="hd"><span class="id">' + c[0] + '</span><span class="ti">' + esc(c[1]) + '</span>' +
        '<span class="acts">' +
        '<button class="btn p' + (st.v === 'p' ? ' on' : '') + '" data-v="p">통과</button>' +
        '<button class="btn f' + (st.v === 'f' ? ' on' : '') + '" data-v="f">실패</button>' +
        '</span></div>' +
        '<dl><dt>절차</dt><dd>' + esc(c[2]) + '</dd><dt>기대</dt><dd>' + esc(c[3]) + '</dd></dl>' +
        (c[4] ? '<div class="go"><button class="btn goBtn">이 화면 열기</button></div>' : '') +
        '<div class="memo' + (st.v === 'f' || st.m ? ' show' : '') + '">' +
        '<div class="lbl">무엇이 어떻게 달랐나요</div>' +
        '<textarea placeholder="예: 안내 문구가 안 뜸 / 토글이 안 잠김 / 숫자가 12가 아니라 3">' + esc(st.m) + '</textarea></div>';
      d.querySelectorAll('.acts .btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var cur = get(c[0]);
          var nv = cur.v === b.dataset.v ? '' : b.dataset.v;
          state[c[0]] = { v: nv, m: cur.m || '' };
          save(); render();
          if (nv === 'f') { var el = document.querySelector('[data-focus="' + c[0] + '"]'); if (el) el.focus(); }
        });
      });
      var gb = d.querySelector('.goBtn');
      if (gb) gb.addEventListener('click', function () { openCase(gmeta(g[0])[1], c[4]); });
      var ta = d.querySelector('textarea');
      ta.setAttribute('data-focus', c[0]);
      ta.addEventListener('input', function () { var cur = get(c[0]); state[c[0]] = { v: cur.v, m: ta.value }; save(); });
      cards.push(d);
    });
    if (!cards.length) return;
    var wrap = document.createElement('div');
    wrap.className = 'grp';
    var h = document.createElement('h2');
    h.innerHTML = esc(g[0]) + '<span class="n">' + cards.length + '</span>';
    wrap.appendChild(h);
    cards.forEach(function (x) { wrap.appendChild(x); });
    list.appendChild(wrap);
  });
  if (!any) {
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = filter === 'fail' ? '실패로 표시한 케이스가 없습니다.' : '미확인 케이스가 없습니다.';
    list.appendChild(e);
  }
}

function buildReport() {
  var lines = [], pass = 0, fail = 0, todo = 0;
  DATA.forEach(function (g) {
    var rows = [];
    g[1].forEach(function (c) {
      var st = get(c[0]);
      if (st.v === 'p') pass++; else if (st.v === 'f') fail++; else todo++;
      if (st.v !== 'f') return;
      rows.push('- ' + c[0] + ' ' + c[1] + (st.m ? '\n  ' + st.m.replace(/\n/g, '\n  ') : '\n  (메모 없음)'));
    });
    if (rows.length) { lines.push('[' + g[0] + ']'); lines.push(rows.join('\n')); lines.push(''); }
  });
  var passed = Object.keys(state).filter(function (k) { return state[k].v === 'p'; });
  return '알리페이 채널 분기 시안 검수 결과\n통과 ' + pass + ' / 실패 ' + fail + ' / 미확인 ' + todo + '\n\n' +
    (lines.length ? '실패 건\n\n' + lines.join('\n') : '실패 건 없음') +
    '\n\n통과 ID: ' + (passed.length ? passed.join(', ') : '없음') +
    '\n(이 줄을 기록 불러오기에 붙이면 통과 표시가 복원됩니다)';
}

    }

document.getElementById('resetKeep').addEventListener('click', function () {
  var targets = Object.keys(state).filter(function (k) { return state[k].v !== 'p'; });
  if (!targets.length) { tellBox('지울 것이 없습니다. 통과가 아닌 기록이 없습니다.'); return; }
  askBox({ title: '통과 외 초기화', message: '통과로 찍은 것은 그대로 두고, 실패와 메모 ' + targets.length + '건을 지웁니다. 계속할까요?', okText: '지우기' }, function (ok) {
    if (!ok) return;
    targets.forEach(function (k) { delete state[k]; });
    save(); render();
  });
});
render();
</script>
</body>
</html>
