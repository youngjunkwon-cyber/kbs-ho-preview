const D=()=>({
 res:{open:null,ch:'전체',store:'',cat:'',status:'',lang:'',reg:'',q:'',qd:'',per:'all',from:'',to:'',base:'visit',sort:'visit',page:1,size:10},
 cons:{per:'',from:'',to:'',member:'',status:'',lang:'',route:'',ch:'전체',cat:'',store:'',q:'',qd:'',page:1,size:10},
 chats:{base:'first',per:'week',from:'2026-10-01',to:T,room:'',route:'',ch:'전체',resp:'',lang:'',store:'',q:'',qd:'',page:1,size:10},
 prodchats:{base:'first',per:'week',from:'2026-10-01',to:T,room:'',resp:'',lang:'',ch:'전체',cat:'',store:'',q:'',qd:'',page:1,size:10},
 rev:{base:'reg',per:'',from:'',to:'',lang:'',store:'',img:'',ch:'전체',q:'',qd:'',page:1,size:10},
 stat:{mode:'day',lang:'',ch:'전체',active:'',store:'',has:'has',per:'today',from:T,to:T,chart:'bar',tab:'agg',mtype:'all',sortK:'total',sortD:-1},
 survey:{from:'',to:'',nat:'',gender:'',age:'',exp:'',interest:'',ch:'전체',page:1,size:20}
});
S=D();
function perRange(k){
  switch(k){
    case 'all':return ['',''];
    case 'today':return [T,T];
    case 'yest':return [add(T,-1),add(T,-1)];
    case 'week':return [add(T,-6),T];
    case 'month':return ['2026-10-01',T];
    case 'year':return ['2026-01-01',T];
    case '1w':return [add(T,-7),''];case '1m':return [add(T,-30),''];case '3m':return [add(T,-90),''];case '6m':return [add(T,-182),''];case '1y':return [add(T,-365),''];
  }
  return ['',''];
}

/* ========= 컴포넌트 ========= */
function sel(k,ph,opts,o={}){
  const v=S[_v][k];
  const os=opts.map(x=>Array.isArray(x)?x:[x,x]);
  return `<select class="ctl ${ph!=null&&v===''?'empty':''} ${o.cls||''}" data-k="${k}" style="${o.w?'width:'+o.w+'px':''}">${ph!=null?`<option value="">${esc(ph)}</option>`:''}${os.map(a=>`<option value="${esc(a[0])}" ${String(v)===String(a[0])?'selected':''}>${esc(a[1])}</option>`).join('')}</select>`;
}
function chSel(){
  const v=S[_v].ch;
  return `<label class="ctl fld new"><span>유입 채널</span><select data-k="ch">${['전체'].concat(CHS).map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select></label>`;
}
function perBtns(list,fill){
  const v=S[_v].per;
  return `<span class="seg ${fill?'fill':''}">${list.map(a=>`<button data-act="per" data-v="${a[1]}" class="${v===a[1]?'on':''}">${a[0]}</button>`).join('')}</span>`;
}
function rng(){
  const s=S[_v];
  return `<span class="rng"><input type="date" data-k="from" value="${s.from}"><i>→</i><input type="date" data-k="to" value="${s.to}"></span>`;
}
function txt(ph,w){return `<input class="ctl" data-q placeholder="${esc(ph)}" value="${esc(S[_v].qd)}" style="width:${w}px">`}
const srch='<button class="btnp" data-act="search">검색</button>';
function page(title,sub,inner){return `<div class="ph"><h1>${title}</h1><p>${sub}</p></div>${inner}`}
const MSGR={'일본어':'LINE','영어':'WhatsApp','중국어(간체)':'WeChat','중국어(번체)':'WhatsApp'};
function resDrawer(){
  const no=S.res.open;if(no==null)return '';const r=RES.find(x=>String(x.no)===String(no));if(!r)return '';
  const num=parseInt(String(r.no).replace(/\D/g,'').slice(-6),10)||7;
  const ph=r.phone;                                   /* 목록 데이터의 전화번호 그대로 */
  const local=ph.replace(/^\+\d+\s*/,'').replace(/\D/g,'');   /* 메신저 번호: 국가번호 없이 */
  const hm=t=>{const m=+t.slice(11,13)*60+(+t.slice(14,16));return m};
  const hh=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  const H=[['접수 ('+(r.reg==='관리자'?'관리자 등록':'고객 직접 예약')+')',r.recv]];
  if(r.status==='방문완료')H.push(['방문 완료',r.visit]);
  else if(r.status==='노쇼')H.push(['미방문',r.visit.slice(0,10)+' '+hh(Math.min(hm(r.visit)+60,1439))]);
  else if(r.status==='고객취소'){
    const rd=r.recv.slice(0,10),last=add(r.visit.slice(0,10),-1),end=last<T?last:T;
    const span=Math.max(0,Math.round((new Date(end)-new Date(rd))/864e5));
    const d=add(rd,span>0?num%(span+1):0);let tm;
    if(d===rd)tm=hh(Math.min(hm(r.recv)+90,1439));
    else if(d===T)tm=pad(9+num%6)+':'+pad((num*7)%60);
    else tm=pad(9+num%12)+':'+pad((num*7)%60);
    H.push(['고객 취소',d+' '+tm]);
  }
  const kv=(a,b)=>'<div class="dkv"><span>'+a+'</span><b>'+b+'</b></div>';
  return '<div class="dov" data-act="rclose"></div><aside class="dwr"><div class="dhd"><span class="dx" data-act="rclose">&times;</span>예약 상세</div>'
   +'<div class="dst"><span class="dstp"><i></i>'+r.status+'</span><span class="dchb new" title="유입 채널">'+r.cv+'</span></div>'
   +'<div class="dti">'+r.visit+'</div>'+kv('여권명',esc(r.name))+kv('국적',r.nat)+kv('언어',r.lang)+kv('전화번호',esc(ph))+kv('메신저',(MSGR[r.lang]||'WhatsApp')+' '+local)+kv('예약 번호',r.no)+kv('접수 시각',r.recv)+kv('등록 방식',r.reg)
   +'<div class="dlb">매장</div><div class="dbx">'+esc(r.store)+' ('+r.cat+')</div><div class="dlb">처리 이력</div>'+H.map(h=>'<div class="dhis"><b>'+h[0]+'</b><small>'+h[1]+'</small></div>').join('')
   +'<div class="dnote">시안 주석: 호스트 예약 상세 화면을 기준으로 그린 상세입니다. 어드민 라이브 상세의 나머지 구성은 이 시안에 그리지 않았습니다.</div></aside>';
}
function pager(total,withSize){
  const s=S[_v];const pages=Math.max(1,Math.ceil(total/s.size));if(s.page>pages)s.page=pages;const c=s.page;
  let nums;
  if(pages<=7)nums=Array.from({length:pages},(_,i)=>i+1);
  else if(c<=4)nums=[1,2,3,4,5,'…',pages];
  else if(c>=pages-3)nums=[1,'…',pages-4,pages-3,pages-2,pages-1,pages];
  else nums=[1,'…',c-1,c,c+1,'…',pages];
  return `<div class="pg ${withSize?'sz':''}" style="${withSize?'':''}"><div style="display:flex;gap:6px;align-items:center;${withSize?'margin:0 auto':''}">
  <button data-act="page" data-v="${c-1}" ${c<=1?'disabled':''}>‹</button>${nums.map(n=>n==='…'?'<span class="el">···</span>':`<button data-act="page" data-v="${n}" class="${n===c?'on':''}">${n}</button>`).join('')}<button data-act="page" data-v="${c+1}" ${c>=pages?'disabled':''}>›</button></div>
  ${withSize?`<select class="ctl" data-k="size" style="position:absolute;right:0;top:18px">${[10,20,50].map(n=>`<option value="${n}" ${s.size===n?'selected':''}>${n} / 페이지</option>`).join('')}</select>`:''}</div>`;
}
const sliceP=(rows)=>{const s=S[_v];const pages=Math.max(1,Math.ceil(rows.length/s.size));if(s.page>pages)s.page=pages;return rows.slice((s.page-1)*s.size,s.page*s.size)};
const count=(rows,fn)=>{const m={};rows.forEach(r=>{const k=fn(r);m[k]=(m[k]||0)+1});return m};
function chipGrp(title,items,cls){return `<span class="grp ${cls||''}"><strong>${title}</strong>${items.map(a=>`<span class="chip">${a[0]} ${a[1]}</span>`).join('')}</span>`}
function chipsBar(total,groups){return `<div class="blk flat" style="margin-top:10px"><div class="chips"><span class="grp"><strong>총</strong><span class="chip tot">${total}</span></span>${groups}</div></div>`}
const chGrp=rows=>{const m=count(rows,r=>r.cv);return chipGrp('유입 채널',CHS.map(c=>[c,m[c]||0]),'new')};
const EMPTY=n=>`<tr class="empty-row"><td colspan="${n}">데이터가 없습니다</td></tr>`;
const thc=(l,cls)=>`<th class="${cls||''}">${l}</th>`;

/* ========= 화면: 예약 ========= */
function resRows(){
  const s=S.res;
  const rows=RES.filter(r=>(s.ch==='전체'||r.cv===s.ch)&&(!s.store||r.store===s.store)&&(!s.cat||r.cat===s.cat)&&(!s.status||r.status===s.status)&&(!s.lang||r.lang===s.lang)&&(!s.reg||r.reg===s.reg)
    &&inRange(s.base==='visit'?r.visit:r.recv,s.from,s.to)&&(!s.q||r.hay.indexOf(s.q.toLowerCase())>=0));
  const k=s.sort==='visit'?'visit':'recv';
  return rows.sort((a,b)=>a[k]<b[k]?1:a[k]>b[k]?-1:0);
}
function vRes(){
  const s=S.res,rows=resRows();
  const up=rows.filter(r=>r.status==='예약').length,dn=rows.filter(r=>r.status==='방문완료').length,ns=rows.filter(r=>r.status==='노쇼').length;
  const rate=(dn+ns)?Math.round(ns/(dn+ns)*1000)/10:0;
  const cards=`<div class="cards">${[['전 매장 예약',rows.length,''],['방문 예정',up,''],['방문 완료',dn,''],['노쇼',ns,''],['노쇼율',rate,'%']].map(a=>`<div class="cd"><i>${a[0]}</i><b>${a[1]}${a[2]?`<u>${a[2]}</u>`:''}</b></div>`).join('')}</div>`;
  const f=`<div class="blk"><div class="fl col"><div class="r">
   ${sel('store','스토어 선택',STORES.map(x=>x.ko),{w:130})}${sel('cat','카테고리 선택',CATS,{w:130})}${sel('status','상태 선택',['예약','방문완료','노쇼','고객취소'],{w:110})}${sel('lang','언어 선택',LANGS,{w:116})}
   ${chSel()}${sel('reg','등록 주체',['고객','관리자'],{w:110})}${txt('여권명, 연락처, 예약번호, 요청사항, 매장메모',290)}</div>
   <div class="r">${perBtns([['전체','all'],['1주일','1w'],['1개월','1m'],['3개월','3m'],['6개월','6m'],['1년','1y']],true)}
   ${sel('base',null,[['visit','방문일 기준'],['recv','접수일 기준']],{w:118})}${sel('sort',null,[['visit','방문일순'],['recv','접수일순']],{w:104})}${rng()}${srch}</div></div></div>`;
  const body=sliceP(rows).map(r=>`<tr><td><b>${esc(r.store)}</b><small>${r.cat}</small></td><td>${r.visit}<small>접수 ${r.recv}</small></td><td>${esc(r.name)}</td><td class="new">${r.cv}</td><td>${r.no}</td><td>${r.nat}</td><td>${r.lang}</td>
   <td><span class="dot ${r.status==='예약'?'b':r.status==='방문완료'?'ok':r.status==='노쇼'?'r':'g'}">${r.status}</span></td><td><span class="mb" data-act="rdet" data-v="${r.no}">상세</span>${r.status==='예약'?'<span class="mb red" data-act="nop">강제취소</span>':''}</td></tr>`).join('');
  const tbl=`<div class="blk"><div class="tw"><table class="tbl"><thead><tr>${thc('매장명')}${thc('방문일시')}${thc('고객(여권명)')}${thc('유입 채널','new')}${thc('예약번호')}${thc('국적')}${thc('언어')}${thc('상태')}${thc('관리')}</tr></thead><tbody>${body||EMPTY(9)}</tbody></table></div>${pager(rows.length,false)}</div>`;
  return page('예약 관리','우리 경유 전 매장 예약을 모니터링·처리합니다.',cards+f+tbl);
}

/* ========= 화면: 상담 ========= */
function consRows(){
  const s=S.cons;
  return CONS.filter(r=>(s.ch==='전체'||r.cv===s.ch)&&(!s.member||r.member===s.member)&&(!s.status||r.status===s.status)&&(!s.lang||r.lang===s.lang)&&(!s.route||r.route===s.route)&&(!s.cat||r.cat===s.cat)&&(!s.store||r.store===s.store)
   &&inRange(r.recv,s.from,s.to)&&(!s.q||r.hay.indexOf(s.q.toLowerCase())>=0));
}
function vCons(){
  const rows=consRows();
  const f=`<div class="blk"><div class="fl">${perBtns([['오늘','today'],['어제','yest'],['이번주','week'],['이번달','month']])}${rng()}
   ${sel('member','회원 여부',['회원','비회원'],{w:96})}${sel('status','접수상태',CONS_ST,{w:104})}${sel('lang','언어',LANGS,{w:100})}${sel('route','유입 경로',['스토어','상품','외부(스토어)','외부(상품)'],{w:108})}${chSel()}
   ${sel('cat','카테고리 선택',CATS,{w:128})}${sel('store','스토어 선택',STORES.map(x=>x.ko),{w:128})}${txt('검색어',150)}${srch}</div></div>`;

  const body=sliceP(rows).map(r=>`<tr><td class="c">${r.no}</td><td>${r.recv.slice(0,16)}</td><td>${r.member}</td><td class="new">${r.cv}</td><td><select class="stsel" data-cn="${r.no}">${CONS_ST.map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td class="lnk">${esc(r.store)}</td><td class="lnk">${esc(r.prod)}</td><td>${r.route}</td><td>${r.memo?'<span class="lnk" data-act="nop" style="cursor:pointer">미리보기</span>':'-'}</td><td>${r.way}</td><td>${r.phone}</td><td>${r.sns}</td><td>${esc(r.snsId)}</td><td>${r.lang}</td><td>${esc(r.name)}</td><td>${esc(r.nick)}</td><td></td><td>-</td></tr>`).join('');
  const heads=[['No.','c'],['접수일시'],['회원구분'],['유입 채널','new'],['접수상태'],['스토어코드'],['상품명'],['유입경로'],['고객메모'],['연락수단'],['휴대폰번호'],['SNS'],['SNS ID'],['언어'],['이름'],['닉네임'],['QR'],['상담일시']];
  const tbl=`<div class="blk"><div class="tw"><table class="tbl dense"><thead><tr>${heads.map(h=>thc(h[0],h[1])).join('')}</tr></thead><tbody>${body||EMPTY(18)}</tbody></table></div>${pager(rows.length,true)}</div>`;
  return page('상담 관리','상품과 스토어에서 접수된 상담 내역을 조회하고 상태를 관리합니다.',f+chips+tbl);
}

/* ========= 화면: 채팅 공통 ========= */
function chatRows(src,s){
  const k=s.base==='first'?'first':'last';
  return src.filter(r=>(s.ch==='전체'||r.cv===s.ch)&&(!s.room||r.room===s.room)&&(!s.resp||r.resp===s.resp)&&(!s.lang||r.lang===s.lang)&&(!s.store||r.store===s.store)&&(!s.cat||r.cat===s.cat)&&(!s.route||r.route===s.route)
   &&inRange(r[k],s.from,s.to)&&(!s.q||r.hay.indexOf(s.q.toLowerCase())>=0));
}
function chatChips(rows){
  const mr=count(rows,r=>r.room),mp=count(rows,r=>r.resp),ml=count(rows,r=>r.lang);
  return chipsBar(rows.length,chipGrp('채팅방상태',[['챗봇',mr['챗봇']||0],['상담',mr['상담']||0]])+chipGrp('상담상태',[['응답',mp['응답']||0],['미응답',mp['미응답']||0]])+chipGrp('언어별',LANGS.map(x=>[x,ml[x]||0]))+chGrp(rows));
}
const staffTds=st=>[0,1,2].map(i=>`<td>${st[i]?esc(st[i][0]):''}</td><td>${st[i]?st[i][1]:''}</td>`).join('');

   ${sel('room','채팅방상태',['챗봇','상담'],{w:112})}${sel('route','유입경로',['스토어','외부(스토어)'],{w:108})}${chSel()}${sel('resp','응답여부',['응답','미응답'],{w:104})}${sel('lang','언어',LANGS,{w:100})}${sel('store','스토어 선택',STORES.map(x=>x.ko),{w:128})}${txt('검색어',150)}${srch}</div></div>`;

  const heads=[['No','c'],['첫대화날짜'],['마지막대화날짜'],['유입경로'],['유입 채널','new'],['채팅방상태'],['상담상태'],['마지막작성자'],['스토어코드'],['담당자 이름','st'],['담당자 연락처','st'],['담당자 이름','st'],['담당자 연락처','st'],['담당자 이름','st'],['담당자 연락처','st'],['스토어명'],['고객명'],['언어'],['이메일']];
  const tbl=`<div class="blk"><div class="sec-t" style="font-size:13px;padding-bottom:10px;border-bottom:1px solid var(--line);margin:-4px -16px 10px;padding-left:16px">스토어 채팅 목록</div><div class="tw"><table class="tbl dense"><thead><tr>${heads.map(h=>thc(h[0],h[1])).join('')}</tr></thead><tbody>${body||EMPTY(19)}</tbody></table></div>${pager(rows.length,true)}</div>`;
  return page('스토어 채팅 목록','스토어 채팅 목록을 확인할 수 있습니다.',f+chatChips(rows)+tbl);
}
function vProdChats(){

  const s=S.survey;

}
function vSurvey(){
  const s=S.survey,rows=svRows();
  const den=s.ch==='전체'?79:SV_RES[s.ch];const rate=Math.round(rows.length/den*1000)/10;
  const o=(k,ph,opts,w)=>`<select class="ctl ${s[k]===''?'empty':''}" data-k="${k}" style="width:${w}px"><option value="">${ph}</option>${opts.map(x=>`<option ${s[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
  const nats=Array.from(new Set(SURVEY.map(r=>r.nat)));
  const f=`<div class="blk"><div class="sv-f"><div class="sr"><label>응답시간: ${rng()}</label><label>국적: ${o('nat','전체',nats,124)}</label><label>성별: ${o('gender','전체',['FEMALE','MALE'],92)}</label><label>연령대: ${o('age','전체',['10대','20대','30대','40대','50대 이상'],98)}</label></div>
   <div class="sr"><label>방문경험: ${o('exp','전체',SV_EXP,120)}</label><label>관심항목: ${o('interest','전체',SV_INT,136)}</label><label class="ctl fld new"><span>유입 채널:</span><select data-k="ch">${['전체'].concat(CHS).map(c=>`<option ${c===s.ch?'selected':''}>${c}</option>`).join('')}</select></label><button class="btnp" data-act="search">검색</button></div></div></div>`;
  const ec=SV_EXP.map(x=>[x,rows.filter(r=>r.exp===x).length]),ic=SV_INT.map(x=>[x,rows.filter(r=>r.ints.indexOf(x)>=0).length]);
  const sum=`<div class="blk"><div style="display:flex;justify-content:space-between;align-items:center"><span class="sec-t" style="margin:0">응답 요약</span><button class="btnx" data-act="nop">엑셀다운로드</button></div>
   <div class="svline"><span>총 응답 <b class="big" id="svTotal">${rows.length}건</b></span><span>응답률 <b class="big blue" id="svRate">${rate}%</b></span></div>
   <div class="svboxes"><div class="sbox sbox1"><div class="sec-t">한국 방문 경험</div><div class="sitems">${ec.map(a=>`<div class="si"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div></div>
   <div class="sbox"><div class="sec-t">관심항목</div><div class="sitems">${ic.map(a=>`<div class="si"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div></div></div></div>`;
  const two='';
  const body=rows.map(r=>`<tr><td>${r.t}</td><td class="new">${r.cv}</td><td>${r.email}</td><td>${r.nat}</td><td>${r.gender}</td><td>${r.birth}</td><td>${r.exp}</td><td>${r.ints.map(t=>`<span class="tag">${t}</span>`).join('')}</td></tr>`).join('');
  const tbl=`<div class="blk"><div class="sec-t" style="margin-bottom:10px">답변목록</div><div class="tw"><table class="tbl"><thead><tr>${thc('응답일시')}${thc('유입 채널','new')}${thc('이메일')}${thc('국적')}${thc('성별')}${thc('생년월일')}${thc('방문 경험')}${thc('관심 항목')}</tr></thead><tbody>${body||EMPTY(8)}</tbody></table></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;font-size:12px;color:#666"><span>총 ${rows.length}건</span><select class="ctl" data-k="size" style="height:28px"><option value="20">20 / 페이지</option></select></div></div>`;
  return page('예약자 설문조사','예약자가 제출한 방문 경험과 관심 항목을 조회합니다.',f+sum+two+tbl);
}

/* ========= 사이드바 ========= */
const MENU=[
{t:'처음으로'},{t:'공지사항'},
{t:'예약',kids:[['예약 관리','res']]},{t:'고객지원',kids:[]},{t:'회원',kids:[]},{t:'스토어',kids:[]},{t:'상품',kids:[]},{t:'옵션 관리',kids:[]},{t:'매거진',kids:[]},{t:'스토어 칼럼',kids:[]},{t:'SEO',kids:[]},{t:'AI 관리',kids:[]},
{t:'채팅',kids:[['전체채팅조회',''],['고객1:1문의',''],['스토어채팅조회','chats'],['상품채팅조회','prodchats']]},
{t:'상담',kids:[['상담조회','cons'],['메신저 상담조회','']]},
{t:'리뷰',kids:[['리뷰조회','rev'],['외부 리뷰 관리','']]},
{t:'계정',kids:[]},{t:'광고정보관리'},{t:'쿠폰',kids:[]},{t:'기획전',kids:[]},{t:'인플루언서',kids:[]},
{t:'통계',kids:[['상담 · 채팅 통계',''],['스토어 문의 통계','stat'],['예약자 설문조사','survey']]},
{t:'카탈로그 관리',kids:[],alpha:1},{t:'장소 관리',kids:[],alpha:1}];
function sideHTML(){
  return MENU.map(m=>{
    const real=m.kids&&m.kids.some(k=>k[1]);
    const cv=m.kids?'<i class="cv"></i>':'';
    const lab=m.t+(m.alpha?'<span class="alpha">ALPHA</span>':'');
    if(!real)return `<div class="mi dis"><span>${lab}</span>${cv}</div>`;
    const open=!!OPEN[m.t];
    return `<div class="mi ${open?'open':''}" data-act="grp" data-v="${m.t}"><span>${lab}</span>${cv}</div>`+(open?`<div class="sub">${m.kids.map(k=>k[1]?`<div class="mi ${k[1]===_v?'on':''}" data-act="go" data-v="${k[1]}"><span>${k[0]}</span></div>`:`<div class="mi dis"><span>${k[0]}</span></div>`).join('')}</div>`:'');
  }).join('');
}

/* ========= 렌더·이벤트 ========= */
const VIEWS={res:vRes,cons:vCons,chats:vChats,prodchats:vProdChats,rev:vRev,stat:vStat,survey:vSurvey};
let _lastV=null,_rend=false,_dd=null;  /* _dd: 사용자가 값을 고치는 중인 날짜칸 */
/* 다시 그리기 전후로 포커스를 잡은 요소를 같은 data 속성 요소로 복원 */
function focusKey(){
  const a=document.activeElement,m=$('#main');if(!a||a===document.body||!m||!m.contains(a))return null;
  const q=(n,v)=>v!=null?'[data-'+n+'="'+String(v).replace(/"/g,'\\"')+'"]':'';
  const d=a.dataset||{};let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  return {sel:a.tagName.toLowerCase()+q('act',d.act)+q('k',d.k)+q('v',d.v)+q('cn',d.cn)+(d.q!==undefined?'[data-q]':''),ss,se};
}
function render(){
  const y=window.scrollY,same=_lastV===_v;
  const tws=same?Array.from(document.querySelectorAll('#main .tw')).map(e=>[e.scrollLeft,e.scrollTop]):[];
  if(same&&_dd&&_dd.isConnected&&_dd===document.activeElement)applyDate(_dd);  /* 입력 중이던 날짜가 있으면 같이 반영 */
  _dd=null;
  const fk=focusKey();
  $('#side').innerHTML=sideHTML();
  _rend=true;try{$('#main').innerHTML=VIEWS[_v]()+(_v==='res'?resDrawer():'')}finally{_rend=false}
  if(same)document.querySelectorAll('#main .tw').forEach((e,i)=>{if(tws[i]){e.scrollLeft=tws[i][0];e.scrollTop=tws[i][1]}});
  if(fk){let el=null;try{el=$('#main '+fk.sel)}catch(e){}
    if(el){el.focus({preventScroll:true});try{if(fk.ss!=null&&el.setSelectionRange)el.setSelectionRange(fk.ss,fk.se)}catch(e){}}}
  window.scrollTo(0,y);
  _lastV=_v;
}
function go(name){
  if(!VIEWS[name])return;_v=name;_lastV=null;
  MENU.forEach(m=>{if(m.kids&&m.kids.some(k=>k[1]===name))OPEN[m.t]=true});
  render();window.scrollTo(0,0);
}
function resetDB(){S=D();CONS.forEach(r=>r.status=r.st0);_lastV=null;render()}
function setCh(v){if(v==='알리페이 중국'||v==='알리페이 홍콩')v='알리페이';const s=S[_v];if(!('ch' in s))return;s.ch=v;if('qd' in s)s.q=s.qd;s.page=1;render()}
window.go=go;window.resetDB=resetDB;window.render=render;window.setCh=setCh;
Object.defineProperty(window,'VIEW',{get:()=>_v});
Object.defineProperty(window,'STATE',{get:()=>S});
let _tt;
function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=m;el.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('on'),2000)}
const isDate=t=>t&&t.tagName==='INPUT'&&t.type==='date'&&t.dataset.k;
/* 날짜칸은 입력 중에는 다시 그리지 않고, 포커스를 잃을 때나 Enter에서만 반영 */
function applyDate(t){_dd=null;const k=t.dataset.k,s=S[_v];if(s[k]===t.value)return false;s[k]=t.value;s.per='';if('page' in s)s.page=1;return true}
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.cn!==undefined){const r=CONS.find(x=>String(x.no)===t.dataset.cn);if(r){r.status=t.value;render()}return}
  const k=t.dataset.k;if(!k||isDate(t))return;const s=S[_v];
  s[k]=k==='size'?+t.value:t.value;
  if(k!=='size'&&k!=='mtype')s.page=1;
  if(k==='size')s.page=1;
  render();
});
document.addEventListener('focusout',e=>{
  const t=e.target;if(_rend||!isDate(t)||!applyDate(t))return;
  const n=e.relatedTarget;
  if(n&&$('#main').contains(n))return;  /* 다른 조작 대상으로 옮겨 간 경우에는 그 조작이 다시 그림 */
  setTimeout(render,0);
});
document.addEventListener('input',e=>{if(isDate(e.target))_dd=e.target;if(e.target.dataset&&e.target.dataset.q!==undefined)S[_v].qd=e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.dataset)return;
  if(e.target.dataset.q!==undefined){const s=S[_v];s.qd=e.target.value;s.q=s.qd;s.page=1;render()}
  else if(isDate(e.target)){applyDate(e.target);render()}
});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,v=a.dataset.v,s=S[_v];
  if(act==='go')go(v);
  else if(act==='nop')toast('시안에서는 동작하지 않습니다');
  else if(act==='grp'){OPEN[v]=!OPEN[v];render()}
  else if(act==='search'){s.q=s.qd;s.page=1;render()}
  else if(act==='per'){s.per=v;const r=perRange(v);s.from=r[0];s.to=r[1];s.page=1;render()}
  else if(act==='page'){s.page=+v;render()}
  else if(act==='set'){
    s[a.dataset.k]=v;
    if(a.dataset.k==='mode'){if(v==='day'){s.per='week';s.from='2026-10-01';s.to=T}else{s.per='';s.from='2026-05-01';s.to=T}}
    render();
  }
  else if(act==='rdet'){S.res.open=v;render()}
  else if(act==='rclose'){S.res.open=null;render()}
  else if(act==='sort'){if(s.sortK===v)s.sortD=-s.sortD;else{s.sortK=v;s.sortD=v==='name'?1:-1}render()}
});
OPEN['예약']=true;
render();
</script>
