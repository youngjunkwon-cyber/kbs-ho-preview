ааны өрөө<\/li><li data-list-item-id=\"ef3877f92a30090eb16ca4bfb6a8f1122\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ef34a7bc4fd7ffe12725ef6944da7c1c1\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"eefd16afa02967170ea6b4b02a7d1f7ec\">Явган 3 минут<\/li><li data-list-item-id=\"e9e4a7395ba8b04fb7ffe9c2847404c77\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e17d6dc196173cfa58fabbb6192e8f63c\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"e4ef9fa537d4941f50e3cb3b107628b13\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e67d0803c1ebd17edea1b8278decde103\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1896","title":"Program Rhinoplasty Comprehensive","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Human Plastic Surgery – Дээд зэрэглэлийн хамрын хагалгаа<\/strong><\/span><\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:415/713;\" src=\"https://image.kbstations.com/2026/02/12/535fc09b-51f5-4929-8df4-248210b1dbe6\" width=\"415\" height=\"713\"><\/figure><p><br>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Анхны хамрын хагалгаа<\/strong><\/span><\/p><p>&nbsp;<\/p><p>Үнэ: 385,000,000 KRW &nbsp;<\/p><p><br>Мэдээ алдуулалтын зардал, хагалгааны дараах арчилгаа, НӨАТ багтсан<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Хамрын дахин хагалгаа<\/strong><\/span><\/p><p>&nbsp;<\/p><p>Үнэ: 550,000,000 KRW &nbsp;<\/p><p><br>Мэдээ алдуулалтын зардал, хагалгааны дараах арчилгаа, НӨАТ багтсан<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Таны нүүрэнд тохирсон хамрын хагалгаа (Rhinoplasty)<\/strong><\/span><strong>&nbsp;<\/strong><\/p><p><br>Бид гурван үндсэн хүчин зүйлд нарийвчлалыг чухалчилдаг: &nbsp;<\/p><ul><li data-list-item-id=\"e0b3adfcab01e148eda5682334955eae5\">Хэлбэр &nbsp;<\/li><li data-list-item-id=\"ec32967c1dbecafa2df589c79faa0b91d\">Шугам &nbsp;<\/li><li data-list-item-id=\"e24fe9bdc8e1fc98b0f01a41b33886bd1\">Харьцаа &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Өвчтөн бүрт хамгийн тохиромжтой, сэтгэл ханамжтай үр дүн өгөхийн тулд ажилбар бүрийг хувь хүнд тохируулан төлөвлөдөг.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:421/532;\" src=\"https://image.kbstations.com/2026/02/12/49db0245-f5e8-4ee9-a77b-1ba92e389cf5\" width=\"421\" height=\"532\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Яагаад хамрын дахин хагалгаа хэрэгтэй вэ? &nbsp;<\/strong><\/span><\/p><ul><li data-list-item-id=\"e27b30fcf6ac55ef47cc2f83149af48dc\">Хамрын шугам хүлээлтэд нийцэхгүй (45%) &nbsp;<\/li><li data-list-item-id=\"ed59b8be13ed99dcee6f0b19f8668f293\">Тэгш бус байдал эсвэл сорви (30%) &nbsp;<\/li><li data-list-item-id=\"ef7f70b0991e5e3b25ef7ef2497fb2203\">Үйл ажиллагааны асуудал (15%) &nbsp;<\/li><li data-list-item-id=\"ef4e017234fe887bc74f14af0db392d5e\">Бусад (10%) &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Анхны хагалгааны дараа сэтгэл ханамжид нөлөөлөх янз бүрийн асуудал гарч болно. Зөвхөн гадаад үзэмжийг засах биш, үйл ажиллагаа болон гоо зүйн тэнцвэрийг нэгэн зэрэг сэргээх ёстой. Иймээс дахин хагалгааг туршлагатай гоо сайхны мэс заслын мэргэжлийн эмч гүйцэтгэдэг.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:417/584;\" src=\"https://image.kbstations.com/2026/02/12/1f58e8ed-1bfd-4d2e-b87e-22af89cd10d1\" width=\"417\" height=\"584\"><\/figure><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Зөвлөгөөнөөс хагалгааны дараах арчилгаа хүртэл&nbsp;<\/strong><\/span><\/p><p><br>Ким Гүг Хён ерөнхий захирал эмчийн удирдлаган дор шалтгааны шинжилгээ, хагалгааны төлөвлөлтөөс нөхөн сэргээх хүртэлх бүх үйл явцыг системтэй, мэргэжлийн аргаар гүйцэтгэдэг. Бид нарийн төвөгтэй хамрын дахин хагалгаа болон нөхөн сэргээх хагалгааг өндөр гоо зүйн мэдрэмжээр гүйцэтгэсэн арвин туршлагатай.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Human Plastic Surgery дахь хамрын хагалгааны давуу тал<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e7bc9a2d16cb133cff793eaf8b934df06\">Гаж нөлөөний эрсдэлийг багасгахын тулд суулгацыг хамгийн бага хэмжээгээр болон өөрийн эдийг ашиглана &nbsp;<\/li><li data-list-item-id=\"e79d5d4fcb09e304a39c6a6bf883351af\">Тогтвортой, удаан хадгалагдах хамрын хэлбэр &nbsp;<\/li><li data-list-item-id=\"e68845466d9918a84fe5e524974562c21\">Хэлбэрийг хадгалахын тулд хамрын багана болон хамрын үзүүрийн байрлалыг бат бэхэлнэ &nbsp;<\/li><li data-list-item-id=\"e0865e7b511183b13c58fb37fc12cb836\">Нүүрний хэлбэрт тохирсон төгс хамрын загвар: шулуун хамар, ялимгүй өргөгдсөн хамар, зөөлөн үзүүр хүртэл &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Ашиглах хагалгааны материал<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e0234c245bb769f023e6c8d7612386d6a\">Силикон / 3D силикон &nbsp;<\/li><li data-list-item-id=\"e1c731173834eea353cbc8987df0398df\">Чихний мөгөөрс / хамрын таславч / хавирганы мөгөөрс &nbsp;<\/li><li data-list-item-id=\"ef005a296586f12107a2b0ce190550aae\">Өөрийн арьсан давхарга &nbsp;<\/li><li data-list-item-id=\"e10bd87fc27417d7ce83f3864cd914514\">Шамархайн хальс &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:419/430;\" src=\"https://image.kbstations.com/2026/02/12/4ebdfd99-acce-4fcb-8ae3-e37cce385c27\" width=\"419\" height=\"430\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Нарийвчилсан 3D-CT шинжилгээ &nbsp;<\/strong><\/span><\/p><p><br>3D CT шинжилгээгээр далд асуудлыг ч орхигдуулалгүй, дахин хагалгааны амжилтын түвшинг ихээхэн нэмэгдүүлдэг.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Хамрын дахин хагалгааны гүнзгий шинжилгээ<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e12e80a2187e375527c37c8e6a6e9701f\">Хамрын таславчийн мөгөөрсний хэлбэр, хэмжээ &nbsp;<\/li><li data-list-item-id=\"e7d5e36d980a4217cb42e2059da30c56f\">Хамрын ясны байдал (хазайлт, остеотоми г.м) &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Дахин хагалгааг үйл ажиллагааны тогтвортой байдал болон гоо зүйн тэнцвэрийг нэгэн зэрэг тооцсон хувь хүнд тохирсон аргаар гүйцэтгэдэг.<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:416/613;\" src=\"https://image.kbstations.com/2026/02/12/013ea9c9-b1fe-4a72-b441-51719a2c051e\" width=\"416\" height=\"613\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Хамрын дахин хагалгаагаа Human Plastic Surgery-д даатгаарай<\/strong><\/span><\/p><p>&nbsp;<\/p><p>Бид өвчтөний сэтгэл ханамжийг дараахаар чухалчилдаг: &nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e140c1c098f71e80624dfd48be79c4f28\">1:1 зөвлөгөө ба төлөвлөлт &nbsp;<\/li><li data-list-item-id=\"ee2deb6db8d435dda932d53e66c5853ad\">Нарийн, нягт хагалгааны гүйцэтгэл &nbsp;<\/li><li data-list-item-id=\"e67fa72530e318f29cd88cb0a89933c1d\">Цогц хагалгааны дараах арчилгаа &nbsp;<\/li><li data-list-item-id=\"e55077c510f50048f3db23253eb25a636\">Эхнээс нь дуустал өвчтөний аюулгүй байдлыг нэн тэргүүнд &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>БНСУ-ын гоо сайхны мэс заслын мэргэжлийн эмч<\/strong><\/span><\/p><p><br>Kim Kookhyun, MD &nbsp;<\/p><p><br>Human Plastic Surgery-ийн захирал<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Human Plastic Surgery-ийн байршил<\/strong><\/span><\/p><p><br>Sky Medical B корпус 11 давхар, &nbsp;<\/p><p><br>Сөүл хот, Сочо дүүрэг, Каннам-дэро 509<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><ul><li data-list-item-id=\"ea229966424bbb39922f8fbac32a97d03\">Даваа–Пүрэв: 10:00 – 19:00 &nbsp;<\/li><li data-list-item-id=\"ea0083b4ebed66d661321ea060d30c493\">Баасан: 10:00 – 20:00 (оройн цаг)<\/li><li data-list-item-id=\"ee590c6518ebd822987081f830df71153\">Бямба: 10:00 – 16:00 &nbsp;<\/li><li data-list-item-id=\"e70a2b134882abecc066ee9b14e07f7b6\">Ням болон бүх нийтийн амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:399/920;\" src=\"https://image.kbstations.com/2026/02/12/a093a092-14b4-436f-9252-95aa8f3b5111\" width=\"399\" height=\"920\"><\/figure><p>&nbsp;<\/p><\/div>"},{"pid":"1900","title":"Juvelook Skin Booster Kolagen 2cc","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:640/730;\" src=\"https://image.kbstations.com/2026/02/12/fc0a0355-a145-4e39-bcb9-ad1e2be23993\" width=\"640\" height=\"730\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"background-color:hsl(210,75%,60%);color:hsl(0,0%,100%);font-size:22px;\"><strong>JUVELOOK Collagen арга хэмжээний үнэ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p><i>Үнэд НӨАТ багтсан<\/i><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Juvelook Collagen Filler 4cc<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>330,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\"><br>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Juvelook Collagen Skin Glow 2cc<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>220,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3422;\" src=\"https://image.kbstations.com/2026/02/12/91ea1ce7-67aa-44f7-b6da-a335e7bc4c99\" width=\"800\" height=\"3422\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системтэй 1:1 эмчилгээ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системчилсэн арьсны оношилгоо<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e440d8323eacae407c8a2243ac9d077d2\">Хувь хүний арьсны оношилгооны дараа ажилбар хийгдэнэ<\/li><li data-list-item-id=\"e613b1f9b223b4c796bbcba884817f525\">Туршлагатай эмчийн зөвлөгөө ба эмчилгээ<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e1cf57fe7874f10a84af861aac0a2e8b4\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"e7d3e819bc2effa2dacc973bd6e5ab3b6\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"e86965171322d501f41052069df84b891\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"e1ce887c908aff87e388cbeb6f6a4a87a\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"e3fcfc2247c47811eadce34d3db37ea1b\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"edfd10a1c0d6a04bbb906c2f373b48517\">Тав тухтай VIP арчилгааны өрөө<\/li><li data-list-item-id=\"ea8f93d845ec0c754299ec3231ef69d35\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e25a8667a0bd8913f47cfec1a58e1cd09\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"ee4f00c66005ecd4ee55a6905c01f8c26\">Явган 3 минут<\/li><li data-list-item-id=\"e24ac2791fbcca4d1f3b32ebaada6ccdb\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ed32cb009de7cef888e993094db7f783f\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"eecf04a9fdac0b3ff2a9a49f7006aa77b\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e34ccdb3f99d02f191580be36e05567a5\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1902","title":"Mentor Breast Implant Program","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Human Plastic Surgery – Дээд зэрэглэлийн цээж томруулах хагалгаа<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:363/644;\" src=\"https://image.kbstations.com/2026/02/12/32820542-5bb2-4973-81e2-eadca29cb01b\" width=\"363\" height=\"644\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>Бид Human Mentor цээж томруулах хагалгааг жижиг хэсэг бүрд нь анхааралтайгаар, нэгийг ч орхигдуулалгүй гүйцэтгэдэг. &nbsp;<\/p><p><br>Биеийн ерөнхий шугамын тэнцвэрийг чухалчилж, танд хамгийн тохиромжтой, байгалийн гоо зүйг урладаг. &nbsp;<\/p><p><br>Толинд харах бүртээ эв нэгдэлтэй үр дүнгээс төрөх сэтгэл ханамж, өөртөө итгэх итгэлийг мэдрээрэй.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Mentor имплантын сонголт:<\/strong><\/span><\/p><ul><li data-list-item-id=\"e070d3a2a3b00f204846e185a61ea2863\">Mentor Smooth — 5,500,000 KRW &nbsp;<\/li><li data-list-item-id=\"e1aed67ce9d8150daa66a657d684a877e\">Mentor Xtra — 8,800,000 KRW &nbsp;<\/li><li data-list-item-id=\"e3e756e3dd0f62421e17245bcbea8ee06\">Mentor Boost — 12,100,000 KRW &nbsp;<\/li><\/ul><p><br><strong>Мэдээ алдуулалтын зардал, хагалгааны дараах арчилгаа, НӨАТ багтсан.<\/strong><\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:528/283;\" src=\"https://image.kbstations.com/2026/02/12/dc1f2399-dcc5-4fbe-bb36-eb734d434515\" width=\"528\" height=\"283\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Human Mentor цээж томруулах хагалгааны давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e4e976838be0433ca9f24ce7a0ae5b356\">20-аас дээш жилийн туршлагатай Ким Гүг Хён ерөнхий захирал эмч биечлэн гүйцэтгэнэ. &nbsp;<\/li><li data-list-item-id=\"e319b91ef6aba2dcf76137b2ba525c7d9\">Таны биеийн галбир, хамгийн тохиромжтой шугамд нийцэх имплантын хэмжээ, загварыг чөлөөтэй сонгоно. &nbsp;<\/li><li data-list-item-id=\"ebc183c2799611931896b6f8c3474a1f6\">Хэлбэр, мэдрэмж, шугам, дүүргэлтийг чухалчилж, төгс бөгөөд гоёмсог цээжний галбирыг бүтээнэ.<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:537/471;\" src=\"https://image.kbstations.com/2026/02/12/a1ba39ea-b86a-4f7d-aa1a-5b0e25ac9ef7\" width=\"537\" height=\"471\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Шилдэг технологи ба арга:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e3fe0fc44fe714c398c662e1b0558714e\">Импланттай шууд хүрэлцэхийг багасгахын тулд тусгай уут ашигласан ариун цэвэр, хүрэлцэхгүй зарчим. &nbsp;<\/li><li data-list-item-id=\"e1067b8b772061e92966123163244bf0d\">Мэдрэл болон судсыг тодорхой харахын тулд FULL HD дуран. &nbsp;<\/li><li data-list-item-id=\"e001e6f194a4ca4185e091db2930323d1\">Орон зайг нарийн ялгах хэт авианы хутгаар эдийн гэмтэл, гаж нөлөөг багасгана. &nbsp;<\/li><li data-list-item-id=\"edf1300f6f8cb83e76da8b23238ff9fee\">Хагалгааны дараах төвлөрсөн менежментээр бүрхүүл хатуурахаас сэргийлэх арчилгаа.<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Хагалгааны дараах тусгай арчилгааны хөтөлбөр:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e5b3887bacde8005fb79dc4879867b9d8\">Нөхөн сэргэлтийг хурдасгах өндөр даралттай хүчилтөрөгчийн эмчилгээ. &nbsp;<\/li><li data-list-item-id=\"e049f3372313a9ede048b02e11287a2c4\">Оновчтой сорвины арчилгаа. &nbsp;<\/li><li data-list-item-id=\"e125b58e17ffaa2d05f36ee1bd002a8ef\">Ерөнхий захирал эмч нөхөн сэргэлтийн байдлыг биечлэн хянана.<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Human Plastic Surgery<\/strong><\/span><\/p><p><br>Байршил: Sky Medical Tower B корпус 11 давхар, Сөүл хот, Сочо дүүрэг, Каннам-дэро 509 &nbsp;<\/p><p><br>Ажиллах цаг: &nbsp;<\/p><ul><li data-list-item-id=\"ea917db9c37ceb092037599c89b680d8a\">Даваа–Пүрэв: 10:00 – 19:00 &nbsp;<\/li><li data-list-item-id=\"eec9c2b5ba16421e01e2ddaded51b34d0\">Баасан: 10:00 – 20:00 (оройн цаг) &nbsp;<\/li><li data-list-item-id=\"ec6be3fcf247c3cc68365df7ce49b7592\">Бямба: 10:00 – 16:00 &nbsp;<br><strong>Ням болон амралтын өдөр хаалттай.<\/strong><\/li><\/ul><p>&nbsp;<\/p><p>Бид таны аюулгүй байдал, сэтгэл ханамжийн төлөө 1:1 зөвлөгөө, дизайн, нарийн хагалгаа, цогц хагалгааны дараах арчилгаагаар өвчтөнийг үргэлж дагалддаг.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:364/925;\" src=\"https://image.kbstations.com/2026/02/12/6e102a9f-40ca-427b-b9eb-057eec0fac8a\" width=\"364\" height=\"925\"><\/figure><\/div>"},{"pid":"1905","title":"Oligio Kiss RF Lifting","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:366/944;\" src=\"https://image.kbstations.com/2026/02/12/58902cf0-7fff-4c1e-b319-27aa7b1839aa\" width=\"366\" height=\"944\"><\/figure><p><strong>*Үнэд НӨАТ багтсан* &nbsp;<\/strong><\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3422;\" src=\"https://image.kbstations.com/2026/02/12/91ea1ce7-67aa-44f7-b6da-a335e7bc4c99\" width=\"800\" height=\"3422\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системтэй 1:1 эмчилгээ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системчилсэн арьсны оношилгоо<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e4e3ae04c92bb48e0d363c75822d36523\">Хувь хүний арьсны оношилгооны дараа ажилбар хийгдэнэ<\/li><li data-list-item-id=\"e5bfbf46efac3f90e806aec1c060f0ca0\">Туршлагатай эмчийн зөвлөгөө ба эмчилгээ<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e068dc6f20470398fdf65d5c6223b40c4\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"eb1f996f468d40f6f1fa9caceba609a58\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"e1d5db85ded777d451a30cd81ba8dd3da\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"e998e1af7c2864039dd582e4b27510b26\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"eeaaaf8525817430912454e8bf6d5ad5a\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"e15d3c56a <script>
const P = window.PRODUCTS || [], DES = window.DESIGNER || [], TOTAL = window.TOTAL_NORMAL || P.length;
const DONE = JSON.parse(localStorage.getItem('kbs_mn_done') || '{}');
let tab = 'gen';
function saveDone(){ localStorage.setItem('kbs_mn_done', JSON.stringify(DONE)); }
function setTab(t){ tab=t; document.getElementById('tabGen').classList.toggle('active',t==='gen'); document.getElementById('tabDes').classList.toggle('active',t==='des'); document.getElementById('ctrls').style.display=t==='gen'?'flex':'none'; render(); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

async function copyRich(html){
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html],{type:'text/plain'})})]); return true; }
  catch(e){ const d=document.createElement('div'); d.contentEditable='true'; d.style.cssText='position:fixed;left:-9999px;top:0'; d.innerHTML=html; document.body.appendChild(d); const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r); let ok=false; try{ok=document.execCommand('copy');}catch(_){} s.removeAllRanges(); d.remove(); return ok; }
}
function doCopy(pid, btn){
  const it=P.find(x=>x.pid===pid); if(!it) return;
  copyRich(it.html).then(ok=>{ if(ok){ toast('📋 복사됨 — 에디터에서 Ctrl+V'); btn.classList.add('copied'); btn.textContent='✓ 복사됨'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1500); if(!DONE[pid]){DONE[pid]=true;saveDone();render();} } else toast('복사 실패 — 미리보기에서 수동 복사하세요'); });
}
function togglePrev(pid){ const el=document.getElementById('prev-'+pid); if(!el)return; if(el.classList.contains('open')){el.classList.remove('open');return;} const it=P.find(x=>x.pid===pid); el.innerHTML='<iframe srcdoc="'+(it.html.replace(/"/g,'&quot;'))+'"></iframe>'; el.classList.add('open'); }
function toggleDone(pid){ DONE[pid]=!DONE[pid]; saveDone(); render(); }

function render(){
  const doneN = P.filter(x=>DONE[x.pid]).length;
  document.getElementById('pbar').style.width = (P.length?doneN/P.length*100:0)+'%';
  document.getElementById('stat').textContent = '완료 '+doneN+' / 생성 '+P.length+'  (정상 전체 '+TOTAL+' · 디자이너 '+DES.length+')';
  const list=document.getElementById('list');
  if(tab==='des'){
    list.innerHTML = DES.length? DES.map(d=>'<div class="card"><div class="row"><span class="pid">'+d.pid+'</span><span class="title">'+esc(d.title)+'</span><a class="dlink" href="'+d.url+'" target="_blank">FO 페이지 ↗</a></div></div>').join('') : '<div class="empty">없음</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstatus').value, fd=document.getElementById('fdone').value;
  let items=P.filter(x=>{
    if(q && !((x.title||'').toLowerCase().includes(q) || x.pid.includes(q))) return false;
    if(fs && x.status!==fs) return false;
    if(fd==='done' && !DONE[x.pid]) return false;
    if(fd==='todo' && DONE[x.pid]) return false;
    return true;
  });
  list.innerHTML = items.length? items.map(x=>
    '<div class="card'+(DONE[x.pid]?' done':'')+'">'+
      '<div class="row">'+
        '<span class="pid">'+x.pid+'</span>'+
        '<span class="title">'+esc(x.title)+'</span>'+
        '<span class="badge '+x.source+'">'+(x.source==='sheet'?'시트':'AI')+'</span>'+
        (x.status==='review'?'<span class="badge review">검토</span>':'')+
        '<button class="btn copy" onclick="doCopy(\''+x.pid+'\',this)">📋 복사</button>'+
        '<button class="btn" onclick="togglePrev(\''+x.pid+'\')">👁 미리보기</button>'+
        '<label class="chk"><input type="checkbox" '+(DONE[x.pid]?'checked':'')+' onchange="toggleDone(\''+x.pid+'\')">완료</label>'+
      '</div>'+
      '<div class="prev" id="prev-'+x.pid+'"></div>'+
    '</div>').join('') : '<div class="empty">결과 없음</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
render();
</script>
