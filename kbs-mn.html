;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ee576e1bcaeebd149d5c5ba070fa38efc\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"eb7aa869d6b14893dc5461e2e43840d52\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"e0b6f7104d4b01da12c5faa6bd78783b7\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"ef35b3584bd764a4a5dfe77ac2dd12655\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"e89b800ca475ec810384f92044b1413c1\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"e6a8785c36f4ffdd937923b5fb86a05a2\">Тав тухтай VIP арчилгааны өрөө<\/li><li data-list-item-id=\"e8f0e86e4eb06b6a5fb5b227656e6968a\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e6da38536210b325896f8eef825ad0626\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"ee95ad2fec9ed9f059461d1430bf04aee\">Явган 3 минут<\/li><li data-list-item-id=\"e58bb71a31fdf3a8d02d77d06dbe5fb6e\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ea58434707bc17076eb73798f5392ec4f\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"e5082434d21b556c7895bff81768d27fb\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"ee01cea474005479fa8a71f9ea4b4d597\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1856","title":"Eye Beauty Enhancement","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p><strong>Luho Plastic Surgery дахь нүдний засварын мэс засал<\/strong> ✨<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1711;\" src=\"https://image.kbstations.com/2026/02/12/5b932bb9-2aaa-46ec-abce-e8a73a1ac278\" width=\"800\" height=\"1711\"><\/figure><p>&nbsp;<\/p><p>Та хэдэн удаа мэс засал хийлгэсэн бэ? &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"efa0a8f42943e7e0cf77da49b3b42bb50\">Анхны засварын мэс засал: 47% &nbsp;<\/li><li data-list-item-id=\"e001e7b5c4f017a890b375da8c2104544\">2-3 дахь засварын мэс засал: 40% &nbsp;<\/li><li data-list-item-id=\"e01c7a4f41435765cf46086a9e536f8fd\">4 ба түүнээс дээш удаагийн засвар: 13% &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>Luho Plastic Surgery нь зөвхөн анхны засварын мэс заслыг хийдэг төдийгүй, дахин засвар хийлгэдэг үйлчлүүлэгчдийн эзлэх хувь өндөр байгаа нь үйлчлүүлэгчдийн итгэл улам бэхжиж байгааг харуулж байна.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>Таны хүссэнээр нүдний хэлбэрийн сонголт<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ef909bf599422634319a9b33119d43119\">Байгалийн In-line &nbsp;<\/li><li data-list-item-id=\"edbeb6feae64ee951a2deccf6224af6b3\">Гламур Out-line &nbsp;<\/li><li data-list-item-id=\"edf027e6515e7cdfae300ea9ba8b7ee15\">Байгалийн харагдах Semi-out line &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Бид 1:1 хувийн дизайнаар дараах зүйлсийг харгалзан танд хамгийн тохирох нүдний хэлбэрийг олоход тусална: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e4a7ea30225f3805d3770ad1d671ec23f\">Хувь хүний арьсны зузаан &nbsp;<\/li><li data-list-item-id=\"e9be3e3cd7a3deb62113859560d50c96a\">Нүд нээх хүч &nbsp;<\/li><li data-list-item-id=\"e5450847e828836eea1cb684861a68617\">Нүд унжсан байдал болон бусад &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Luho Plastic Surgery-ийн давуу тал<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ebddc3657909873635f4cc72c4d7215bd\">Хурдан эдгэрэлтийн тулд ажилбарын дараах чанд хяналт &nbsp;<\/li><li data-list-item-id=\"e3477c462f3c11a3250c37a646cab6c3d\">Сорви болон гаж нөлөөний санаа зовнилгүйгээр эд эсийн гэмтлийг бууруулна &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Нүдний засварын мэс засал бүтэлгүйтэх шалтгааны шинжилгээ<br>&nbsp;<\/p><ul><li data-list-item-id=\"e814c77ddb2f3f72c742f7545b3422453\">Давхар атираатай зовхины шугам &nbsp;<\/li><li data-list-item-id=\"e518e2d31a42483e71386bd124b468af5\">Птозын засвар хангалтгүй эсвэл хэт их &nbsp;<\/li><li data-list-item-id=\"e4e09918e2bb1ecf0aa4d13be8fe1c1be\">Зовхины атираа тэгш бус &nbsp;<\/li><li data-list-item-id=\"e25f64c11e6499312adc5309d9e1a8ff6\">Зовхины шугам сулирсан &nbsp;<\/li><li data-list-item-id=\"ebeb681cc41aa33906dc07ce5d2e3a0b3\">Зовхины атираа хэт өндөр эсвэл нам &nbsp;<\/li><li data-list-item-id=\"efe10275c2de516ce8bae7b5ed8ca278c\">Хэт их зүслэгээс үүдэн тод сорви &nbsp;<\/li><li data-list-item-id=\"e305d2f739a5de3b2025ed4ceb80bed5a\">Зовхины шугамд үйлчлүүлэгчийн сэтгэл ханамжгүй байдал &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/433;\" src=\"https://image.kbstations.com/2026/02/12/f0a7f93d-fbda-4276-a4dd-9fd2fa94c941\" width=\"800\" height=\"433\"><\/figure><p>&nbsp;<\/p><p>Luho Plastic Surgery нь бүх мэс заслын өрөөг CCTV-ээр тоноглосон ил тод эмчилгээний үйлчилгээ явуулдаг. Ажилбараа бидэнд даатгаж, санаа зоволтгүйгээр тайван мэс засал хийлгээрэй.<\/p><\/div>"},{"pid":"1857","title":"Natural Eye Beautification","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p>Luho 612 байгалийн наалдуулах арга: Зүсэлтгүй зовхины мэс заслын шинэчлэл<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:1600/5929;\" src=\"https://image.kbstations.com/2026/02/12/2ccf0003-fb9d-4789-a8ff-08706ae85106\" width=\"1600\" height=\"5929\"><\/figure><p>&nbsp;<\/p><p>Luho 612 байгалийн наалдуулах арга нь 6 бэхэлгээний цэг дээр 12 зангилааг зигзаг хэлбэрээр холбож, арьсыг зүсэхгүйгээр бат бөх наалддаг зовхи үүсгэдэг. Luho-гийн онцгой мэс заслын техникээр арьс ба булчинг бат бөх холбосноор удаан хадгалагдах үр дүнг өгнө.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>6 цэг 12 бэхэлгээний техникийн давуу тал:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ea660738bf88b54f755f6bf2078d9161c\">Давхар наалдуулалттай 6 бэхэлгээний цэг нь холболтын бат бөх байдлыг нэмэгдүүлнэ<\/li><li data-list-item-id=\"ebdf3a2daf048b29836040b00f192354f\">Утас тайрагдах эрсдэлийг мэдэгдэхүйц бууруулна<\/li><li data-list-item-id=\"e4d431810faf5a4c0e6623820d298e056\">Анзаарагдам сорвигүй байгалийн зовхины үр дүн<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>612 байгалийн наалдуулах мэс заслын ажиллагаа:<\/strong><br>&nbsp;<\/p><ol><li data-list-item-id=\"e2d3ede624630949fda14a14a5431a4fb\">Зовхины шугамын дизайныг тохируулж, 6 бэхэлгээний цэгийг тогтооно<\/li><li data-list-item-id=\"efd05a5c4a265c2c03c2227f0d44f35bb\">12 зангилааг зигзаг хэлбэрээр уяж, арьс ба булчинг бат бөх нэгтгэнэ<\/li><li data-list-item-id=\"e94bd438c540d29bcd60616261d5eff8b\">Сорвигүй байгалийн зовхины эцсийн төрх<\/li><\/ol><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>Ажилбарын дэлгэрэнгүй:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ed59197b665a93ce08c37ee9755f09166\">Мэс заслын хугацаа: 30 минут<\/li><li data-list-item-id=\"e5c11003321b442bce31492cec40fefab\">Мэдээ алдуулалт: хэсэгчилсэн эсвэл унтуулах<\/li><li data-list-item-id=\"e8f348088cad2b3e3416ded3170af7a37\">Хэвтэн эмчлүүлэх: шаардлагагүй<\/li><li data-list-item-id=\"ea77171cb3d92c0fcbe92d7ef5c33cec5\">Эдгэрэх хугацаа: 3–7 хоног<\/li><li data-list-item-id=\"e36ad0bd8517e2ac3a754b303ebb13169\">Утас авах: шаардлагагүй<\/li><li data-list-item-id=\"e42e53e98f6367b7f675c1d990d647a20\">Ажилбарын дараах хяналт: шаардлагагүй<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>Үйлчлүүлэгчид зориулсан зөвлөмж:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e1d5cb56c2c4bde4164cfb29510464ab3\">Дээд зовхинд өөх багатай нимгэн зовхитой<\/li><li data-list-item-id=\"e4070dba865e4c980aae4c41534f57d38\">Хурдан эдгэрч, шууд хэвийн амьдралдаа эргэн орохыг хүсдэг<\/li><li data-list-item-id=\"e0a181a6b7e8f073b284aed019d76e998\">Мэс заслын дараах сорвиос болгоомжилдог<\/li><li data-list-item-id=\"e931e8f684e491c3633c0864095c74ff0\">Зүсэлтгүй байгалийн зовхи хүсдэг<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>612 байгалийн наалдуулах аргын давуу тал:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"edb1e3e4b84d009dfa0d9fe6022a7d33e\">Зовхины шугам тайрагдахаас сэргийлэх өндөр нарийвчлалтай техник<\/li><li data-list-item-id=\"e4d4fb58a92a69a35973b8ab400f095d3\">Илүү хурдан эдгэрэлтийг дэмжих мэс заслын дараах арчилгааны хөтөлбөр<\/li><li data-list-item-id=\"e1464a6ffe7f31e880dd46c13d4a0ad31\">Үйлчлүүлэгчийн хүслээр захиалгат зовхины дизайн<\/li><li data-list-item-id=\"eb53efdf5bb9abf81d0bc88186fff508f\">Нүд аньсан үед ч сорви тод харагддаггүй<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:1600/862;\" src=\"https://image.kbstations.com/2026/02/12/6c8fc91f-278e-4978-8a9a-ede1332d51cd\" width=\"1600\" height=\"862\"><\/figure><p>&nbsp;<\/p><p>Luho Plastic Surgery нь мэс заслын өрөөг CCTV-ээр тоноглосон ил тод эмчилгээний системийг хэрэгжүүлдэг. Ажилбараа бидэнд даатгаж, Luho Plastic Surgery-тэй хамт тайван, аюулгүй мэс засал хийлгээрэй.<\/p><\/div>"},{"pid":"1859","title":"Ulthera 100 Shot","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/799;\" src=\"https://image.kbstations.com/2026/02/12/6596d39f-a622-4c2f-8cf8-3aa74d74de64\" width=\"800\" height=\"799\"><\/figure><p>&nbsp;<\/p><p>Ulthera-гийн албан ёсны эрхтэй эмчилгээний эмнэлэг &nbsp;<\/p><p>✨ Ulthera-гийн үнийн талаар дахин санаа зовох хэрэггүй &nbsp;<\/p><p>Хамгийн сайн үнэ: 420,000 KRW (НӨАТ багтсан) &nbsp;<br>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/654;\" src=\"https://image.kbstations.com/2026/02/12/59b387c7-fcd6-4111-ab3e-ef9f82438ad9\" width=\"800\" height=\"654\"><\/figure><p>&nbsp;<\/p><p>Бид аюулгүй байдал, үр дүнг хангахын тулд зөвхөн Америкийн FDA-аас баталгаажсан жинхэнэ Ulthera хошуу ашигладаг. Хошуу бүр ашиглах хязгаартай бөгөөд хязгаараас хэтрүүлбэл хэт авианы нэвтрэх чадвар буурч, түлэгдэх эрсдэл нэмэгддэг. Ажилбарын өмнө хошууны жинхэнэ эсэхийг үргэлж шалгаарай. &nbsp;<\/p><p>&nbsp;<\/p><p>Унтуулах мэдээ алдуулалт сонгоход нэмэлт 220,000 KRW. &nbsp;<\/p><p>&nbsp;<\/p><p><strong>AllLiting дахь Ulthera-гийн давуу тал<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e36b4ae1fd6c6554a52da74bca848db31\">Ulthera түгээмэл болсноор үнэ илүү боломжийн болсон &nbsp;<\/li><li data-list-item-id=\"e821d06de27bf2332e30a5b5462dae32d\">Үр дүн 6 сараас 1 жил хүртэл удаан үргэлжилнэ, дараахаас илүү удаан —<\/li><li data-list-item-id=\"ef813dc4370f00690dc8eb2e62dfe2137\">1–2 сар тутамд давтах шаардлагатай бусад эмчилгээ &nbsp;<\/li><li data-list-item-id=\"edd02e2033e70a958b71f35a56f51a46f\">Арьсны зузаан, унжилтад тохируулан бодит хугацаанд гүн ажиглаж нарийн эмчилгээ хийнэ &nbsp;<\/li><li data-list-item-id=\"e6002ca61f5d5ae75013d224d75f2bbee\">1.5mm, 3.0mm, 4.5mm зориулалтын хошуу ашиглан арьсны өөр өөр давхаргыг нарийн онилно &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Танд Ulthera-г санал болгох тохиолдол<\/strong> &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e0dad8b2845eba26f3be1d2eadd0515ee\">Мэс засалгүйгээр лифтинг хийлгэхийг хүсвэл &nbsp;<\/li><li data-list-item-id=\"ef1a14984cb00db62b4d36d6fe0e6a024\">Очсон өдрөө шууд үр дүн авахыг хүсвэл &nbsp;<\/li><li data-list-item-id=\"ed70d3c46e7d28f34e754bfda1a572707\">Нүүр, хүзүүний үрчлээг арилгахыг хүсвэл &nbsp;<\/li><li data-list-item-id=\"ebfd0fc08ac11b392a404b0b7c0eb43f2\">Маргааш нь шууд үр дүнг харахыг хүсвэл &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3062;\" src=\"https://image.kbstations.com/2026/02/12/2f1bad5d-a399-4a29-9691-b28cf6ff2602\" width=\"800\" height=\"3062\"><\/figure><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1377;\" src=\"https://image.kbstations.com/2026/02/12/df310385-f685-401d-b3c1-cc53615fc6f9\" width=\"800\" height=\"1377\"><\/figure><p>&nbsp;<\/p><p><strong>Ulthera-гийн талаарх түгээмэл асуултууд<\/strong>&nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ecaee5a29bd64813eeb1d21c545adeb94\">Ажилбар өвдөлттэй юу? &nbsp;<br>&nbsp;<ul><li data-list-item-id=\"ed1d18ba445522225ab8397aa8ef51ec1\">Ulthera нь энергийг арьсны гүн давхаргад хүргэдэг тул гадаргуу дээр бараг өвдөлтгүй. Хэрэв тав тухгүй бол унтуулах мэдээ алдуулалтыг нэмэлт 220,000 KRW-ээр сонгож болно. &nbsp;<\/li><\/ul><\/li><li data-list-item-id=\"eab42b67c4409a8029213c1c179373d0a\">Бусад ажилбартай хослуулж болох уу? &nbsp;<ul><li data-list-item-id=\"e19d6955bdd87fc145bfb46d3fd91c39c\">Болно, гэхдээ аюулгүй байдлын үүднээс мэргэжлийн эмчтэй заавал зөвлөлдөнө. Thermage болон Titanium Lifting-тэй хослуулахыг \"Ulthermage\" гэж нэрлэдэг бөгөөд харилцан үр нөлөөг өгдөг. &nbsp;<\/li><\/ul><\/li><li data-list-item-id=\"e5f45273861fb9ac10dd458bad414e31d\">Үр дүн хэр удаан үргэлжлэх вэ? &nbsp;<ul><li data-list-item-id=\"ec5ca2a21a216b411c4f0f61ccdb00edd\">Үр дүн ойролцоогоор 1 долоо хоногоос мэдрэгдэж, 1 сарын дараа оновчтой үр дүн харагдаж, 6 сараас 1 жил үргэлжилнэ. Арьс илүү чанга, нарийн үрчлээ багасаж, арьсны бүтэц сайжирна. &nbsp;<\/li><\/ul><\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>Ulthera эмчилгээгээ албан ёсны, итгэлтэй эмнэлэг AllLiting-тэй хийлгэхээ баталгаажуулаарай!<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1044;\" src=\"https://image.kbstations.com/2026/02/12/0622f918-c479-4e38-85d2-7f3d6a8d8a80\" width=\"800\" height=\"1044\"><\/figure><p>&nbsp;<\/p><\/div>"},{"pid":"1863","title":"Botox Area Khusus","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:640/730;\" src=\"https://i rong>Elastic Lifting тариа – German Sima&nbsp;<\/strong><\/span><\/p><p>&nbsp;<\/p><p style=\"text-align:right;\"><span style=\"font-size:20px;\"><strong>77,000 KRW&nbsp;<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br><span style=\"font-size:22px;\"><strong>Elastic Lifting тариа – Botox&nbsp;<\/strong><\/span><\/p><p>&nbsp;<\/p><p style=\"text-align:right;\"><span style=\"font-size:20px;\"><strong>130,000 KRW&nbsp;<\/strong><\/span><\/p><p><br><br><span style=\"font-size:10pt;\"><strong>Бүх үнэд НӨАТ багтсан&nbsp;<\/strong><\/span><br><br><br>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3422;\" src=\"https://image.kbstations.com/2026/02/12/91ea1ce7-67aa-44f7-b6da-a335e7bc4c99\" width=\"800\" height=\"3422\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системтэй 1:1 эмчилгээ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системчилсэн арьсны оношилгоо<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e6d56bbf22d1b36e4617726b9dae88f03\">Хувь хүний арьсны оношилгооны дараа ажилбар хийгдэнэ<\/li><li data-list-item-id=\"e1139f34e5443acb2c11e381775aeffa8\">Туршлагатай эмчийн зөвлөгөө ба эмчилгээ<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e915fa30a5c64529ad69e2dba0ee4003d\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"e831b8bbce12932dce7625343fc9c3b32\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"ea08cbf514905fbcbd7d7f7d0a99c99e8\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"e82953bd117e637d702fdc6048714c87d\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"e96ecb0bdee8afa4665e48f551b8de2e1\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"ede356369476006b225cc5de47d57610b\">Тав тухтай VIP арчилгааны өрөө<\/li><li data-list-item-id=\"e253d907d2fbb7c75ec935628460b80f2\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e34079c2771dce543062d3bcb33447db8\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"eca76e1efb95f80c0aeaa71533e0240c5\">Явган 3 минут<\/li><li data-list-item-id=\"ef884a3016d832d5c2c45332eb3380a70\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e9de150f384556bf330ebde4ca4cbd9b0\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"e62a8f21c84bbda1d7727c869ceefbe23\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e5f94165def8d60733bd1d5443f179c64\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1865","title":"Radiesse 4.5cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/799;\" src=\"https://image.kbstations.com/2026/02/12/ee032321-d68f-4f9e-86ca-27fc81170eab\" width=\"800\" height=\"799\"><\/figure><p>4.5 миллилитрийн эзэлхүүнтэйгээр нэг удаагийн эмчилгээгээр оновчтой чийгшил өгөхийн зэрэгцээ чийгийг түгжинэ.<\/p><p>&nbsp;<\/p><p><strong>REDIESSE-ийг бусад бүтээгдэхүүнтэй харьцуулах нь<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ebc732c4bed5b4d0e200502c550c97b85\">Бусад бүтээгдэхүүн нь арьсанд шарх, гэмтэл учруулж коллагены нийлэгжилтийг өдөөдөг. &nbsp;<\/li><li data-list-item-id=\"e9ed6010f00b27da6df854f32c996453e\">REDIESSE нь коллагены нийлэгжилтийг өдөөх тусгай хэмжээтэй найрлага, мөн коллагеныг удаан хадгалахад тусалдаг кальцийн найрлага агуулдаг.<\/li><\/ul><p>&nbsp;<\/p><p><strong>REDIESSE-ийн давуу тал<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ea6b2c1f79cd326ff33c3152c232a4ac8\">Шингэн хэлбэртэй, нунтаг биш бөгөөд уусгах процесс шаардахгүй тул зангилаа үүсгэдэггүй. &nbsp;<\/li><li data-list-item-id=\"e2d1e149a5bc08ded7277695c2a4a8533\">Шууд үр нөлөө өгөх ба үүссэн коллаген нь эхний шимэгдэлтийн дараа байгалийн үр дүнг харуулдаг. &nbsp;<\/li><li data-list-item-id=\"e4c05090c4e53086d284dc2d550022899\">Сард 2 удаа тариулснаар үр нөлөө 1 жил хүртэл хадгалагдана. <strong>Үр дүн хүн бүрт өөр байж болно.<\/strong><\/li><\/ul><p>&nbsp;<\/p><p><strong>REDIESSE-ийн талаарх чухал мэдээлэл<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eceed91bbdbda51c082c80945a7dbd32a\">Коллаген нь коллагеныг үндсэн найрлага болгон ашигладаг арьс сайжруулагч юм. &nbsp;<\/li><li data-list-item-id=\"e1dd1a6984f1f3c241d5d16dba511ea61\">CaHa нь коллагеныг удаан хадгалахад тусалдаг кальци агуулдаг. &nbsp;<\/li><li data-list-item-id=\"e96001dd22e5cd89ee4d3bd619c9c9d12\">4.5cc эзэлхүүн нь ерөнхийдөө нүүрийг бүхэлд нь хамрахад хангалттай боловч арьсны байдлаас хамаарч хэрэгцээ өөр байж болно. Зөвлөгөө авахыг зөвлөнө. &nbsp;<\/li><li data-list-item-id=\"ed3b289669c4cf0cc7c54d185bcb4c5c4\">Нэг удаа тариулахад үр дүнтэй боловч удаан хадгалагдах үр дүнгийн тулд сард 2 удаа тариулахыг зөвлөнө.<\/li><\/ul><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery-ийн байршил<\/strong><br>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1039;\" src=\"https://image.kbstations.com/2026/02/12/74e25675-3f59-445f-8eb2-4ed02197be75\" width=\"800\" height=\"1039\"><\/figure><p>&nbsp;<\/p><p>REDIESSE-ийн талаар нэмэлт асуулт байвал бидэнтэй шууд холбогдоно уу.<\/p><\/div>"},{"pid":"1866","title":"Belotero Revive 1cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:800/795;\" src=\"https://image.kbstations.com/2026/02/12/8385ba96-9159-4c72-b978-bbb72a3caa23\" width=\"800\" height=\"795\"><\/figure><p><strong>AllLiting арьс чангалагч<\/strong><br>Арьсны хамгийн гүн давхарга хүртэлх хуурайшилтыг сайжруулах арьс чангалалт &nbsp;<\/p><p>&nbsp;<\/p><p><strong>BELOTERO REVIVE &nbsp;<\/strong><br>1 удаагийн тарилгаар давхар үр нөлөө &nbsp;<br>Шинэ үеийн дээд зэрэглэлийн арьс чангалагч &nbsp;<\/p><p>&nbsp;<\/p><p><strong>Соён-жүсагийн найрлага:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e3e2f78146ed0605744c704481f2a139e\">Гиалуроны хүчил (чийгшүүлэх) &nbsp;<\/li><li data-list-item-id=\"e0bc6c55487cd9ed6f139cdbb44974331\">Глицерин (чийг түгжих) &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Нэг удаагийн ажилбараар дараахыг өгнө: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e97ba6bfc134f5732ab6e41a10caacc44\">Гүн чийгшил &nbsp;<\/li><li data-list-item-id=\"eec6690203b5e883b367869a3a4e77936\">Зэрэг чийг түгжих &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Соён-жүсагийн үр нөлөө:<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eb2d4b34125a9ec940146f77d7338fff1\">Арьсны өнгийг сайжруулж, уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><li data-list-item-id=\"ef576e41d95ec45826f4bd01cc7b79c48\">Арьсны хамгаалалтын давхаргыг бэхжүүлэх &nbsp;<\/li><li data-list-item-id=\"e980d9f7c778853d75193d85d11ee4682\">Тод харагдах гялалзсан арьсны үр нөлөө &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/749;\" src=\"https://image.kbstations.com/2026/02/12/06afb34c-5966-401e-bec6-499a3b1559cd\" width=\"800\" height=\"749\"><\/figure><p><strong>Соён-жүсагийн тухай Q&amp;A<\/strong> &nbsp;<\/p><p>Q: Соён-жүса бусад арьс чангалагчаас юугаараа ялгаатай вэ? &nbsp;<br>A: Ердийн арьс чангалагч ихэвчлэн зөвхөн гиалуроны хүчил агуулдаг. Соён-жүса нь глицерин нэмж агуулснаар нэг удаагийн ажилбараар чийгшүүлж, зэрэг чийгийг түгждэг. Энэ ажилбар бараг өвдөлтгүй, тодорхой үр дүн өгч, нүүр будалтын наалдацыг сайжруулдаг. &nbsp;<\/p><p>Q: Глицерин гэж юу вэ? &nbsp;<br>A: Глицерин бол чийгийг түгжих чухал найрлага юм. Гиалуроны хүчил нь чийгшүүлэх үүрэгтэй бол глицерин нь чийгийг түгждэг. Энэ хоёр найрлага хамтран Соён-жүсаг бүрдүүлдэг. &nbsp;<\/p><p>Q: Хэр их хэмжээ шаардлагатай вэ? &nbsp;<br>A: Нүүрний бүтэн эмчилгээнд хамгийн багадаа 2–3 cc-ийг зөвлөдөг. Тун нь хүн бүрт өөр өөр байж болох тул биечлэн ирж зөвлөгөө авахыг зөвлөнө. &nbsp;<\/p><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery эмнэлгийн байршил<\/strong><\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1039;\" src=\"https://image.kbstations.com/2026/02/12/1d61b884-ec60-47a2-9aea-7a4edf2e58e5\" width=\"800\" height=\"1039\"><\/figure><\/div>"},{"pid":"1868","title":"Chin Filler","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:640/730;\" src=\"https://image.kbstations.com/2026/02/12/fc0a0355-a145-4e39-bcb9-ad1e2be23993\" width=\"640\" height=\"730\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"background-color:hsl(210,75%,60%);color:hsl(0,0%,100%);font-size:22px;\"><strong>Гиалурон хүчлийн филлерийн онцгой урамшуулал<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p><i>Үнэд НӨАТ багтсан<\/i><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>QTfill – Солонгос бүтээгдэхүүн<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>75,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\"><br>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Neuramis – Солонгос бүтээгдэхүүн<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>130,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Voluti<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>330,000KRW<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Juvederm / Reblanc<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>350,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3422;\" src=\"https://image.kbstations.com/2026/02/12/91ea1ce7-67aa-44f7-b6da-a335e7bc4c99\" width=\"800\" height=\"3422\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системтэй 1:1 эмчилгээ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системчилсэн арьсны оношилгоо<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e4793e9c5ee07e8f242a4633bc1d28a35\">Хувь хүний арьсны оношилгооны дараа ажилбар хийгдэнэ<\/li><li data-list-item-id=\"e226ef97ecb48bbf466038c42bca2c37e\">Туршлагатай эмчийн зөвлөгөө ба эмчилгээ<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ec95976a595834b3b880566e2e2b4a0de\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"ef54d2e22cfe4b377229e2c0cb347cb41\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"e51536691fee1279954c34967a45bcd25\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"ea3df4e2921fdad7fdcb651bfdcf9aacd\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"e2361949033516cc9c3a10c65c07bfb3c\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"e0e4518bbc0153114c56622faffb12aeb\">Тав тухтай VIP арчилгааны өрөө<\/li><li data-list-item-id=\"e03390fc903b6ac71a7667c7e116f3a18\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e70b29328f2f06910dca24dcef8a4f1a5\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"e768539a377bbef1a78da9e3f963db778\">Явган 3 минут<\/li><li data-list-item-id=\"e347aa405c26be1078d396ae1cf01be0c\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ea4cce2812851b633156f0d37f89b7147\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"ebfa7908d2dc79dbcb295187099b0ba68\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e1c9cf28ee2051d94b8b23423dde39472\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1869","title":"Skin Booster 2.5cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/800;\" src=\"https://image.kbstations.com/2026/02/12/90dac4e4-9409-4cd8-b0b7-b9dac46f9db9\" width=\"800\" height=\"800\"><\/figure><p><strong>Сүгван тариагаар арьсны чийгийг дахин цэнэглээрэй 💧<\/strong><br>Мэдээ алдуулах тос, ажилбарын дараах арчилгааны зардал, НӨАТ багтсан &nbsp;<\/p><p>&nbsp;<\/p><p><strong>Сүгван тариа гэж юу вэ?<\/strong><br>Сүгван тариа нь гиалуроны хүчил агуулсан бөгөөд арьсны гүн давхаргад тарьж дараахыг хийдэг: &nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ef4185308c101654982f936ab3c594e8c\">Арьсны чийгийг татаж, барьж байх &nbsp;<\/li><li data-list-item-id=\"ec1e7a6f709cefd5def9514c965277093\">Оновчтой чийгшлийг хадгалах &nbsp;<\/li><li data-list-item-id=\"efbd3bab27bc56ef30353920f2decb99a\">Арьсны гялбаа болон уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/776;\" src=\"https://image.kbstations.com/2026/02/12/e7ec567b-68a4-4350-8be2-71446d0e35a5\" width=\"800\" height=\"776\"><\/figure><p>&nbsp;<\/p><p><strong>Сүгван тариаг дараах хүмүүст санал болгоно:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e73484e334ab221df01481cd0808b0d4f\">Арьс барзгар, хуурайшсан &nbsp;<\/li><li data-list-item-id=\"e79cb07d850b1b347db0c2591dcb122eb\">Арьс бүрхэг, бараан &nbsp;<\/li><li data-list-item-id=\"e1e167101779ba2538988a90be4628e41\">Чийглэг, гялалзсан арьстай болохыг хүссэн &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Сүгван тарианы үр нөлөө:<br>&nbsp;<\/p><ul><li data-list-item-id=\"efe3e60cb44a5d011a5f14743f7c8b6ab\">Арьсны чийгийг хадгалах &nbsp;<\/li><li data-list-item-id=\"ea560fb5763d845fa87264e5cdbb7a792\">Уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><li data-list-item-id=\"eae61f4271b555d2835b42d9b905a23e3\">Нарийн үрчлээг сайжруулах &nbsp;<\/li><li data-list-item-id=\"eeaefe7a3dccc6c32dc08bc9be9b2c9a6\">Арьсны өнгийг жигдрүүлэх &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Түгээмэл асуултууд:<\/strong> &nbsp;<br>&nbsp;<\/p><ul><li class=\"ck-list-marker-bold\" data-list-item-id=\"eb3ed80094bf2dfe3f3298fdf425bc19f\"><strong>Үр дүн нь хэр удаан үргэлжлэх вэ?<\/strong><br>&nbsp;<ul><li data-list-item-id=\"ec1a85dce6ca5dcf1c547ccd0ba91f0a1\">Үр дүн 2–3 хоногийн дотор харагдаж эхэлдэг бөгөөд бүтээгдэхүүний төрөл, хувь хүний онцлогоос хамаарч 3–4 долоо хоногоос 6 сараас дээш хугацаагаар үргэлжилж болно. &nbsp;<\/li><\/ul><\/li><li class=\"ck-list-marker-bold\" data-list-item-id=\"e7b1d812c68eeb9e2ec2662cfd2a12d09\"><strong>Тогтмол эмчилгээ шаардлагатай юу?<\/strong><ul><li data-list-item-id=\"e7886e68076e9eb9332977b4b8e7c1525\">Гиалуроны хүчил байнгын биш тул урт хугацааны үр дүнгийн тулд тогтмол эмчилгээг зөвлөдөг. &nbsp;<\/li><\/ul><\/li><li class=\"ck-list-marker-bold\" data-list-item-id=\"e797b88a722501fe5d96e14dc38f69a7a\"><strong>Эмчилгээний дараа юунд анхаарах вэ?<\/strong><ul><li data-list-item-id=\"e454ba66afebe30fb04b5df146c044556\">Ажилбараас хойш 3–5 хоног эрчимтэй дасгал, саун зэрэг биеийн халууныг нэмэгдүүлэх үйл ажиллагаанаас зайлсхий. &nbsp;<\/li><\/ul><\/li><\/ul><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery эмнэлгийн байршил<\/strong><\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1040;\" src=\"https://image.kbstations.com/2026/02/12/c8a630d7-3121-4b56-8bec-5c6e230b772b\" width=\"800\" height=\"1040\"><\/figure><p>Танай тав тухын тулд эмнэлэгт ирэх хялбар зам бэлэн.<\/p><\/div>"},{"pid":"1871","title":"Rejuran Healer 2cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><p><strong>AllLiting Рижюран HEALER<\/strong>✨<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1106;\" src=\"https://image.kbstations.com/2026/02/12/22ef381c-c304-446c-89dc-57c574228176\" width=\"800\" height=\"1106\"><\/figure><p>DOT DMA Optimizing Technology технологиор арьсыг үндсээс нь нөхөн сэргээх эмчилгээ.<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1114;\" src=\"https://image.kbstations.com/2026/02/12/fee1880d-126c-47ad-9d76-22f800514f1c\" width=\"800\" height=\"1114\"><\/figure><p><strong>Рижюран HEALER-ийн үр нөлөө:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e34e7eb10e26ea721ac8efbc731dc6c10\">Арьсны уян хатан байдлыг сайжруулах<\/li><li data-list-item-id=\"e7769c233477616aec0c8fa673ba66019\">Арьсны бүтцийг сайжруулах<\/li><li data-list-item-id=\"e5bd4d85f3b323f97cca5c46c195f588d\">Арьсны өнгийг жигдрүүлэх<\/li><li data-list-item-id=\"e8125cf71d614fd6c3cf4041063ab9579\">Тос ялгаралтыг зохицуулах<\/li><li data-list-item-id=\"ec799ba88e79bdec1b531232eac4618ed\">Нүх сүвийг багасгах<\/li><li data-list-item-id=\"e36d7ceab9094d8e03b39d4a70684582e\">Арьсны тос-чийгний тэнцвэрийг сэргээх<\/li><\/ul><p>&nbsp;<\/p><p><strong>Рижюран HEALER гэж юу вэ?<\/strong><br>Рижюран HEALER нь полинуклеотид (PN) гэх биологийн нийцтэй бодис агуулсан өсөлтийн хүчин зүйлийн цогцолбор юм. Зөвхөн арьсны гадна давхаргыг чийгшүүлдэг масктаас ялгаатай нь суларч унжсан эпидермис болон дермисийн давхаргыг нөхөн сэргээж, арьсны бүтцийг үндсээр нь сайжруулж, арьсыг илүү эрүүл, уян хатан болгодог.<\/p><p>&nbsp;<\/p><p><strong>Яагаад \"Healer\" гэж нэрлэдэг вэ?<\/strong><br>Дотроос нь өөрчлөлт хийж арьсыг бүхэлд нь илүү эрүүл болгодог учраас. Одоо бол дараахад төвлөрсөн арьс анагаах (healing) үе юм: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e270cdfa82a1df58c11a100c54ad7345c\">Арьс сайжруулах &nbsp;<\/li><li data-list-item-id=\"ecc1c5022390d8d9f46608737c6fae25a\">Нөхөн сэргээх &nbsp;<\/li><li data-list-item-id=\"e97f537e764aad87f4ea0b60013f8c3dc\">Тос ялгаралтыг зохицуулах &nbsp;<\/li><li data-list-item-id=\"e9f460779311eb98e35c26eb9f1827330\">Уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><li data-list-item-id=\"e530cc181709af3db8d4e8addea516891\">Арьсны бүтэц болон өнгийг сайжруулах &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/688;\" src=\"https://image.kbstations.com/2026/02/12/721ab62a-350c-4cc9-85a7-2ba88050e51f\" width=\"800\" height=\"688\"><\/figure><p>&nbsp;<\/p><p><strong>Дараах хүмүүст санал болгоно:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e82ab773d3842163ce1d8979833d7caa7\">Нүх сүв томорсон, нарийн үрчлээтэй арьс &nbsp;<\/li><li data-list-item-id=\"eef90dc36495f338c8709aaa3097e2ed5\">Унжсан, хөгшрөлтийн анхны шинжтэй арьс &nbsp;<\/li><li data-list-item-id=\"e12eac90cbeb83b8010a0a6aabaec2c26\">Хэт тостой арьс &nbsp;<\/li><li data-list-item-id=\"eb945a7b0481188980f7f7826f61100ef\">Арьсны байдлыг дотроос нь бүхэлд нь сайжруулахыг хүссэн &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery эмнэлгийн байршил:<\/strong><\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1042;\" src=\"https://image.kbstations.com/2026/02/12/49202cd7-eb00-4ece-8fb1-88420f19bdc0\" width=\"800\" height=\"1042\"><\/figure><p>&nbsp;<\/p><\/div>"},{"pid":"1872","title":"Rejuran Skin Booster","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:640/730;\" src=\"https://image.kbstations.com/2026/02/12/fc0a0355-a145-4e39-bcb9-ad1e2be23993\" width=\"640\" height=\"730\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"background-color:hsl(210,75%,60%);color:hsl(0,0%,100%);font-size:22px;\"><strong>WJ REJURAN ОНЦГОЙ ЭВЕНТ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p><i>Үнэд НӨАТ багтсан<\/i><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Rejuran Black Box 2cc&nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>260,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\"><br>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Rejuran Red Box 1cc<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>260,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Rejuran нүдний хэсэг 1cc&nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>180,000KRW<\/strong><\/span><\/p><p>&nbsp;<\/p><figure class=\"image\"><img d=\"e84c3de6338d51c105337abe1fe0d60c0\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eb7b0e33c627fcfac2efb4111231a49f4\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"e7bf07250865221ec03ba9a747e0ea7c1\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e97021bc7fef8bdc599479ba564fe2a45\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1873","title":"Filler Aegyo Sal","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:640/730;\" src=\"https://image.kbstations.com/2026/02/12/fc0a0355-a145-4e39-bcb9-ad1e2be23993\" width=\"640\" height=\"730\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"background-color:hsl(210,75%,60%);color:hsl(0,0%,100%);font-size:22px;\"><strong>WJ дахь танд зориулсан онцгой өдөр<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p><i>Үнэд НӨАТ багтсан<\/i><\/p><p>&nbsp;<\/p><p><strong>Нүдний доорх хэсэг, нулимсны ховил болон хамрын филлер эмчилгээний онцгой үнийн саналыг&nbsp;<\/strong><\/p><p><strong>Солонгосын чанартай бүтээгдэхүүнээр эдлээрэй: &nbsp;<\/strong><\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>QTFILL&nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>120,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\"><br>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Neuramis&nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>260,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Voluti &nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>370,000KRW<\/strong><\/span><\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p style=\"text-align:right;\">&nbsp;<\/p><p><span style=\"color:hsl(210,75%,60%);font-size:22px;\"><strong>Juvederm / Reblanc&nbsp;<\/strong><\/span><\/p><p style=\"text-align:right;\"><span style=\"color:hsl(210,75%,60%);font-size:20px;\"><strong>400,000KRW<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/3422;\" src=\"https://image.kbstations.com/2026/02/12/91ea1ce7-67aa-44f7-b6da-a335e7bc4c99\" width=\"800\" height=\"3422\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системтэй 1:1 эмчилгээ<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Системчилсэн арьсны оношилгоо<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ebd4c9c642bcaf1bd2408159493097506\">Хувь хүний арьсны оношилгооны дараа ажилбар хийгдэнэ<\/li><li data-list-item-id=\"ebbd06df8243c50efe75019458bbdd7d7\">Туршлагатай эмчийн зөвлөгөө ба эмчилгээ<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>WJ ANTI-AGING CENTER<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e005f4c60a06276eded9134e4f9af4b89\">Эмчтэй 1:1 зөвлөгөө<\/li><li data-list-item-id=\"eb4a026e772ad3381e498a3822ebf1b0f\">Таны тав тухын тулд тусгаарласан хувийн өрөө<\/li><li data-list-item-id=\"e6bfcb7ecfa073abdf9a6fc422359347c\">Мэргэжлийн арьсны оношилгоо<\/li><li data-list-item-id=\"e81c58a4472a2d679877d69dc101ba538\">Дээд зэрэглэлийн эмнэлгийн орчинтой хөгшрөлтийн эсрэг арчилгааны төв<\/li><li data-list-item-id=\"e126b55accc91c693ba2da81571df21a2\">Ажилбарын өмнө болон дараах мэргэжлийн арчилгаа<\/li><li data-list-item-id=\"efb8c02a33215cb7a6fdd472b1cf03cd2\">Тав тухтай VIP арчилгааны өрөө<\/li><li data-list-item-id=\"ed637ab941b5874ea4e802394bb4f7f39\">Эмнэлэг доторх кафе болон өргөн хүлээлгийн талбай<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>Байршил ба зам<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eaebcc80db8a650dd98bbcbc4a6f49fa0\">2-р шугам Каннам өртөөний 10-р гарц<\/li><li data-list-item-id=\"efe9b36bc94913c6a36bef6212b3f5eba\">Явган 3 минут<\/li><li data-list-item-id=\"ec2f5c657cbc8c57b2f83eaf3300bfa5e\">10-р гарцаар гарсны дараа PAGODA барилгыг олоод цахилгаан шатаар 17 давхарт гарна<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:18px;\"><strong>Ажиллах цаг<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e7390d3922a9aada66a3aa377d5516a25\">Даваа–Баасан: 09:00 – 18:00<\/li><li data-list-item-id=\"e88d57090af7441b63c4b8553fa47a6ba\">Бямба: 09:00 – 16:00<\/li><li data-list-item-id=\"e3e15682d8554b25e00aab3a81dc378aa\">Ням болон амралтын өдөр: Хаалттай<\/li><\/ul><p>&nbsp;<\/p><\/div>"},{"pid":"1877","title":"Rejuviel 1cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><p><strong>AllLiting – Дээд зэрэглэлийн нүүрний филлер шийдэл<\/strong> ✨<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1344;\" src=\"https://image.kbstations.com/2026/02/12/19cdb6bd-34ca-4523-87a1-1c87d2e82bd7\" width=\"800\" height=\"1344\"><\/figure><p>Эмчилгээний хэсэг: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"efb04e2e10b285f1d5b979fe6a1426466\">Инээмсэглэлийн шугам (хамрын хажуугийн үрчлээ) &nbsp;<\/li><li data-list-item-id=\"ecfda5f9d0721797507d85f1795e7c860\">Хацрын урд ба хажуу хэсэг &nbsp;<\/li><li data-list-item-id=\"ecab3352db70a74d77e3c1f4b5cfac47c\">Дух &nbsp;<\/li><li data-list-item-id=\"e601f8594d77e773787a53b04de137186\">Чамархай &nbsp;<\/li><li data-list-item-id=\"e9b4657d1dc0b90375ea1cb68a5d7113f\">Эрүү &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Гиалуроны хүчил Rejuviel<\/strong><br>Лижюран компаниас хөгжүүлсэн шинэлэг филлер бөгөөд Францаас импортолсон түүхий эд ашиглан Солонгост үйлдвэрлэсэн. Импортын чанартай дүйцэхүйц дотоодын бүтээгдэхүүн<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1196;\" src=\"https://image.kbstations.com/2026/02/12/ca7cc069-5cbb-4aa6-8836-65bc3ddfcc65\" width=\"800\" height=\"1196\"><\/figure><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/713;\" src=\"https://image.kbstations.com/2026/02/12/2cb6819b-53ab-4b71-8a04-9fb816336552\" width=\"800\" height=\"713\"><\/figure><p><strong>Rejuviel-ийн давуу тал:<\/strong>&nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ead200b240ae8ba0243629dc4777f9cfb\">Энгийн дотоодын филлертэй харьцуулахад илүү удаан тогтвортой &nbsp;<\/li><li data-list-item-id=\"eda1fc5469f8de2d0ad909bff1dede252\">Ажилбарын үед өвдөлтийг бууруулах лидокаин агуулсан &nbsp;<\/li><li data-list-item-id=\"e1fa3b01e364c2720716ac6a594ca1ecf\">Арьсыг залуужуулж, гялалзсан болгон нөхөн сэргээхэд тохиромжтой &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Чухал мэдээлэл:<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e1b695c3b6b000723345c997278b6bcf5\">Хавагнахаас зайлсхийхийн тулд чухал арга хэмжээнээс хамгийн багадаа 1–2 долоо хоногийн өмнө филлер хийлгэхийг зөвлөнө &nbsp;<\/li><li data-list-item-id=\"ebdd4c0e6cdda0b8a212d9ecca0d2cbaa\">Уруулын филлерийн хувьд дахин хийлгэхээс өмнө хамгийн багадаа 2 долоо хоног хүлээнэ үү &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>AllLiting эмнэлгийн байршил:<\/strong><br>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1042;\" src=\"https://image.kbstations.com/2026/02/12/e776ae5a-06be-4d36-b43b-abb0ca3b65cb\" width=\"800\" height=\"1042\"><\/figure><p>&nbsp;<\/p><p>Өндөр чанартай технологи, материалаар хийгдэх хамгийн сайн нүүрний филлерийн туршлагыг авахын тулд AllLiting-д ирээрэй.<\/p><\/div>"},{"pid":"1879","title":"Juvelook Skin 1cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><p><strong>AllLiting – Дээд зэрэглэлийн арьс сайжруулах шийдэл<\/strong><\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1587;\" src=\"https://image.kbstations.com/2026/02/12/f1295835-d9c5-426e-afbc-5e9c5d75bf4f\" width=\"800\" height=\"1587\"><\/figure><p>✨ AllLiting Juvelook-ийн үр нөлөө: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e9f1d87bd6625cc669287b9a4fbcfdc52\">Нарийн үрчлээг сайжруулах &nbsp;<\/li><li data-list-item-id=\"ec6d3b03e8d46e6b39d86d66bbaa0ab0f\">Арьсны хонхорхойг сайжруулах &nbsp;<\/li><li data-list-item-id=\"e38247e7d19645fbdf0eb002ea2dbe73d\">Унжсан арьсыг чангалах &nbsp;<\/li><li data-list-item-id=\"ede06cab4802736f27c0760809958f852\">Арьсны уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Juvelook AllLiting<\/strong> нь өндөр молекулт полилактик хүчил болон гиалуроны хүчлийг хослуулсан PLA/HA Hybrid filler технологи ашиглан байгалийн коллагены нөхөн төлжилтийг идэвхжүүлдэг. Үр дүнд нь арьс байгалийн эзэлхүүнтэй, бүтэц нь илүү толигор болно.<\/p><p>&nbsp;<\/p><p><strong>Холих ба хэрэглэх үйл явц:<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e11b0307e03d75df98f1a92fde5a9dcf0\">Juvelook нунтаг хэлбэртэй бөгөөд физиологийн уусмалтай тодорхой харьцаагаар холиж 6cc эсвэл 8cc эзэлхүүн гаргадаг. &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"e7f0355542d88747df9d9881dd37979c1\">Холих үйл явцыг зориулалтын хутгагчаар хийх ба өрөөний температурт дор хаяж 24 цаг боловсруулах хугацаа шаардана. &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"e2012ecfa3c8bc8db0c06898d064191c2\">Бүтээгдэхүүнийг дермисийн давхаргад шууд тарьж коллаген үүсэлтийг идэвхжүүлж, арьсны чанарыг сайжруулна. &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>AllLiting Juvelook-ийн үнэ:<\/strong><\/p><p><strong><img src=\"https://image.kbstations.com/2026/02/12/1253ab2d-56e9-4d2f-bcb6-e2a5f510b94e\" width=\"800\" height=\"376\"><\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e9f677c210c092bd5695d96f51585a3e6\">Juvelook 1cc — 110,000 KRW (НӨАТ багтсан) &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"ea3e18cc742a2272c629ee841e003e0cd\">Juvelook 8cc — 880,000 KRW (НӨАТ багтсан) &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Чухал мэдээлэл:<\/strong><br>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/302;\" src=\"https://image.kbstations.com/2026/02/12/6a848d4f-a07d-4236-8e6b-bb66c5b6b0ea\" width=\"800\" height=\"302\"><\/figure><ul><li data-list-item-id=\"e5ddd6388855abaab38cb03575a1787a8\">Juvelook-ийг нүүрний бүх хэсгийн филлер болгож биш, арьсны чанар сайжруулахад зориулж санал болгодог. &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"e355faf46142abd9bde70e0cd698e628e\">Боловсруулах хугацаа шаардагддаг тул холих үйл явцыг газар дээр нь хийх боломжгүй. &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"e5a89947ba0faf59f05bd5f29480a9b07\">Juvelook нь эд эсийн нөхөн төлжилтөд төвлөрдөг бөгөөд уруул зэрэг хэлбэр засдаг филлерээс ялгаатай.<\/li><\/ul><p>&nbsp;<\/p><p><strong>Албан ёсны, итгэлтэй эмнэлэг<\/strong><br>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1036;\" src=\"https://image.kbstations.com/2026/02/12/83cf5193-0615-45f9-82ec-39a22e81c7b1\" width=\"800\" height=\"1036\"><\/figure><p>AllLiting Plastic Surgery эмнэлэг нь баталгаажсан эмнэлгийн байгууллага бөгөөд 2024 оны 8 сарын 31-ний байдлаар Juvelook-ийг 1 сая гаруй лонх ашигласан туршлагатай. &nbsp;<\/p><p>&nbsp;<\/p><p><strong>Байршил ба ажиллах цаг:<\/strong>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1041;\" src=\"https://image.kbstations.com/2026/02/12/40d3ea35-3fab-4103-a3d5-178525aa17db\" width=\"800\" height=\"1041\"><\/figure><p>&nbsp;<\/p><p>Juvelook-тэй холбоотой асуулты <script>
const P = window.PRODUCTS || [], DES = window.DESIGNER || [], TOTAL = window.TOTAL_NORMAL || P.length;
const DONE = JSON.parse(localStorage.getItem('kbs_mn_done') || '{}');
let tab = 'gen';
function saveDone(){ localStorage.setItem('kbs_mn_done', JSON.stringify(DONE)); }
function setTab(t){ tab=t; document.getElementById('tabGen').classList.toggle('active',t==='gen'); document.getElementById('tabDes').classList.toggle('active',t==='des'); document.getElementById('ctrls').style.display=t==='gen'?'flex':'none'; render(); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

async function copyRich(html){
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html],{type:'text/plain'})})]); return true; }
  catch(e){ const d=document.createElement('div'); d.contentEditable='true'; d.style.cssText='position:fixed;left:-9999px;top:0'; d.innerHTML=html; document.body.appendChild(d); const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r); let ok=false; try{ok=document.execCommand('copy');}catch(_){} s.removeAllRanges(); d.remove(); return ok; }
}
function doCopy(pid, btn){
  const it=P.find(x=>x.pid===pid); if(!it) return;
  copyRich(it.html).then(ok=>{ if(ok){ toast('📋 복사됨 — 에디터에서 Ctrl+V'); btn.classList.add('copied'); btn.textContent='✓ 복사됨'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1500); if(!DONE[pid]){DONE[pid]=true;saveDone();render();} } else toast('복사 실패 — 미리보기에서 수동 복사하세요'); });
}
function togglePrev(pid){ const el=document.getElementById('prev-'+pid); if(!el)return; if(el.classList.contains('open')){el.classList.remove('open');return;} const it=P.find(x=>x.pid===pid); el.innerHTML='<iframe srcdoc="'+(it.html.replace(/"/g,'&quot;'))+'"></iframe>'; el.classList.add('open'); }
function toggleDone(pid){ DONE[pid]=!DONE[pid]; saveDone(); render(); }

function render(){
  const doneN = P.filter(x=>DONE[x.pid]).length;
  document.getElementById('pbar').style.width = (P.length?doneN/P.length*100:0)+'%';
  document.getElementById('stat').textContent = '완료 '+doneN+' / 생성 '+P.length+'  (정상 전체 '+TOTAL+' · 디자이너 '+DES.length+')';
  const list=document.getElementById('list');
  if(tab==='des'){
    list.innerHTML = DES.length? DES.map(d=>'<div class="card"><div class="row"><span class="pid">'+d.pid+'</span><span class="title">'+esc(d.title)+'</span><a class="dlink" href="'+d.url+'" target="_blank">FO 페이지 ↗</a></div></div>').join('') : '<div class="empty">없음</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstatus').value, fd=document.getElementById('fdone').value;
  let items=P.filter(x=>{
    if(q && !((x.title||'').toLowerCase().includes(q) || x.pid.includes(q))) return false;
    if(fs && x.status!==fs) return false;
    if(fd==='done' && !DONE[x.pid]) return false;
    if(fd==='todo' && DONE[x.pid]) return false;
    return true;
  });
  list.innerHTML = items.length? items.map(x=>
    '<div class="card'+(DONE[x.pid]?' done':'')+'">'+
      '<div class="row">'+
        '<span class="pid">'+x.pid+'</span>'+
        '<span class="title">'+esc(x.title)+'</span>'+
        '<span class="badge '+x.source+'">'+(x.source==='sheet'?'시트':'AI')+'</span>'+
        (x.status==='review'?'<span class="badge review">검토</span>':'')+
        '<button class="btn copy" onclick="doCopy(\''+x.pid+'\',this)">📋 복사</button>'+
        '<button class="btn" onclick="togglePrev(\''+x.pid+'\')">👁 미리보기</button>'+
        '<label class="chk"><input type="checkbox" '+(DONE[x.pid]?'checked':'')+' onchange="toggleDone(\''+x.pid+'\')">완료</label>'+
      '</div>'+
      '<div class="prev" id="prev-'+x.pid+'"></div>'+
    '</div>').join('') : '<div class="empty">결과 없음</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
render();
