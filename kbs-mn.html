p;<\/li><\/ul><p>&nbsp;<\/p><p>Бид 1:1 хувийн дизайнаар дараах зүйлсийг харгалзан танд хамгийн тохирох нүдний хэлбэрийг олоход тусална: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e4a7ea30225f3805d3770ad1d671ec23f\">Хувь хүний арьсны зузаан &nbsp;<\/li><li data-list-item-id=\"e9be3e3cd7a3deb62113859560d50c96a\">Нүд нээх хүч &nbsp;<\/li><li data-list-item-id=\"e5450847e828836eea1cb684861a68617\">Нүд унжсан байдал болон бусад &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Luho Plastic Surgery-ийн давуу тал<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ebddc3657909873635f4cc72c4d7215bd\">Хурдан эдгэрэлтийн тулд ажилбарын дараах чанд хяналт &nbsp;<\/li><li data-list-item-id=\"e3477c462f3c11a3250c37a646cab6c3d\">Сорви болон гаж нөлөөний санаа зовнилгүйгээр эд эсийн гэмтлийг бууруулна &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Нүдний засварын мэс засал бүтэлгүйтэх шалтгааны шинжилгээ<br>&nbsp;<\/p><ul><li data-list-item-id=\"e814c77ddb2f3f72c742f7545b3422453\">Давхар атираатай зовхины шугам &nbsp;<\/li><li data-list-item-id=\"e518e2d31a42483e71386bd124b468af5\">Птозын засвар хангалтгүй эсвэл хэт их &nbsp;<\/li><li data-list-item-id=\"e4e09918e2bb1ecf0aa4d13be8fe1c1be\">Зовхины атираа тэгш бус &nbsp;<\/li><li data-list-item-id=\"e25f64c11e6499312adc5309d9e1a8ff6\">Зовхины шугам сулирсан &nbsp;<\/li><li data-list-item-id=\"ebeb681cc41aa33906dc07ce5d2e3a0b3\">Зовхины атираа хэт өндөр эсвэл нам &nbsp;<\/li><li data-list-item-id=\"efe10275c2de516ce8bae7b5ed8ca278c\">Хэт их зүслэгээс үүдэн тод сорви &nbsp;<\/li><li data-list-item-id=\"e305d2f739a5de3b2025ed4ceb80bed5a\">Зовхины шугамд үйлчлүүлэгчийн сэтгэл ханамжгүй байдал &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/433;\" src=\"https://image.kbstations.com/2026/02/12/f0a7f93d-fbda-4276-a4dd-9fd2fa94c941\" width=\"800\" height=\"433\"><\/figure><p>&nbsp;<\/p><p>Luho Plastic Surgery нь бүх мэс заслын өрөөг CCTV-ээр тоноглосон ил тод эмчилгээний үйлчилгээ явуулдаг. Ажилбараа бидэнд даатгаж, санаа зоволтгүйгээр тайван мэс засал хийлгээрэй.<\/p><\/div>"},{"pid":"1857","title":"Natural Eye Beautification","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p>Luho 612 байгалийн наалдуулах арга: Зүсэлтгүй зовхины мэс заслын шинэчлэл<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:1600/5929;\" src=\"https://image.kbstations.com/2026/02/12/2ccf0003-fb9d-4789-a8ff-08706ae85106\" width=\"1600\" height=\"5929\"><\/figure><p>&nbsp;<\/p><p>Luho 612 байгалийн наалдуулах арга нь 6 бэхэлгээний цэг дээр 12 зангилааг зигзаг хэлбэрээр холбож, арьсыг зүсэхгүйгээр бат бөх наалддаг зовхи үүсгэдэг. Luho-гийн онцгой мэс заслын техникээр арьс ба булчинг бат бөх холбосноор удаан хадгалагдах үр дүнг өгнө.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>6 цэг 12 бэхэлгээний техникийн давуу тал:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ea660738bf88b54f755f6bf2078d9161c\">Давхар наалдуулалттай 6 бэхэлгээний цэг нь холболтын бат бөх байдлыг нэмэгдүүлнэ<\/li><li data-list-item-id=\"ebdf3a2daf048b29836040b00f192354f\">Утас тайрагдах эрсдэлийг мэдэгдэхүйц бууруулна<\/li><li data-list-item-id=\"e4d431810faf5a4c0e6623820d298e056\">Анзаарагдам сорвигүй байгалийн зовхины үр дүн<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>612 байгалийн наалдуулах мэс заслын ажиллагаа:<\/strong><br>&nbsp;<\/p><ol><li data-list-item-id=\"e2d3ede624630949fda14a14a5431a4fb\">Зовхины шугамын дизайныг тохируулж, 6 бэхэлгээний цэгийг тогтооно<\/li><li data-list-item-id=\"efd05a5c4a265c2c03c2227f0d44f35bb\">12 зангилааг зигзаг хэлбэрээр уяж, арьс ба булчинг бат бөх нэгтгэнэ<\/li><li data-list-item-id=\"e94bd438c540d29bcd60616261d5eff8b\">Сорвигүй байгалийн зовхины эцсийн төрх<\/li><\/ol><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>Ажилбарын дэлгэрэнгүй:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ed59197b665a93ce08c37ee9755f09166\">Мэс заслын хугацаа: 30 минут<\/li><li data-list-item-id=\"e5c11003321b442bce31492cec40fefab\">Мэдээ алдуулалт: хэсэгчилсэн эсвэл унтуулах<\/li><li data-list-item-id=\"e8f348088cad2b3e3416ded3170af7a37\">Хэвтэн эмчлүүлэх: шаардлагагүй<\/li><li data-list-item-id=\"ea77171cb3d92c0fcbe92d7ef5c33cec5\">Эдгэрэх хугацаа: 3–7 хоног<\/li><li data-list-item-id=\"e36ad0bd8517e2ac3a754b303ebb13169\">Утас авах: шаардлагагүй<\/li><li data-list-item-id=\"e42e53e98f6367b7f675c1d990d647a20\">Ажилбарын дараах хяналт: шаардлагагүй<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>Үйлчлүүлэгчид зориулсан зөвлөмж:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e1d5cb56c2c4bde4164cfb29510464ab3\">Дээд зовхинд өөх багатай нимгэн зовхитой<\/li><li data-list-item-id=\"e4070dba865e4c980aae4c41534f57d38\">Хурдан эдгэрч, шууд хэвийн амьдралдаа эргэн орохыг хүсдэг<\/li><li data-list-item-id=\"e0a181a6b7e8f073b284aed019d76e998\">Мэс заслын дараах сорвиос болгоомжилдог<\/li><li data-list-item-id=\"e931e8f684e491c3633c0864095c74ff0\">Зүсэлтгүй байгалийн зовхи хүсдэг<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><strong>612 байгалийн наалдуулах аргын давуу тал:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"edb1e3e4b84d009dfa0d9fe6022a7d33e\">Зовхины шугам тайрагдахаас сэргийлэх өндөр нарийвчлалтай техник<\/li><li data-list-item-id=\"e4d4fb58a92a69a35973b8ab400f095d3\">Илүү хурдан эдгэрэлтийг дэмжих мэс заслын дараах арчилгааны хөтөлбөр<\/li><li data-list-item-id=\"e1464a6ffe7f31e880dd46c13d4a0ad31\">Үйлчлүүлэгчийн хүслээр захиалгат зовхины дизайн<\/li><li data-list-item-id=\"eb53efdf5bb9abf81d0bc88186fff508f\">Нүд аньсан үед ч сорви тод харагддаггүй<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:1600/862;\" src=\"https://image.kbstations.com/2026/02/12/6c8fc91f-278e-4978-8a9a-ede1332d51cd\" width=\"1600\" height=\"862\"><\/figure><p>&nbsp;<\/p><p>Luho Plastic Surgery нь мэс заслын өрөөг CCTV-ээр тоноглосон ил тод эмчилгээний системийг хэрэгжүүлдэг. Ажилбараа бидэнд даатгаж, Luho Plastic Surgery-тэй хамт тайван, аюулгүй мэс засал хийлгээрэй.<\/p><\/div>"},{"pid":"1865","title":"Radiesse 4.5cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/799;\" src=\"https://image.kbstations.com/2026/02/12/ee032321-d68f-4f9e-86ca-27fc81170eab\" width=\"800\" height=\"799\"><\/figure><p>4.5 миллилитрийн эзэлхүүнтэйгээр нэг удаагийн эмчилгээгээр оновчтой чийгшил өгөхийн зэрэгцээ чийгийг түгжинэ.<\/p><p>&nbsp;<\/p><p><strong>REDIESSE-ийг бусад бүтээгдэхүүнтэй харьцуулах нь<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ebc732c4bed5b4d0e200502c550c97b85\">Бусад бүтээгдэхүүн нь арьсанд шарх, гэмтэл учруулж коллагены нийлэгжилтийг өдөөдөг. &nbsp;<\/li><li data-list-item-id=\"e9ed6010f00b27da6df854f32c996453e\">REDIESSE нь коллагены нийлэгжилтийг өдөөх тусгай хэмжээтэй найрлага, мөн коллагеныг удаан хадгалахад тусалдаг кальцийн найрлага агуулдаг.<\/li><\/ul><p>&nbsp;<\/p><p><strong>REDIESSE-ийн давуу тал<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"ea6b2c1f79cd326ff33c3152c232a4ac8\">Шингэн хэлбэртэй, нунтаг биш бөгөөд уусгах процесс шаардахгүй тул зангилаа үүсгэдэггүй. &nbsp;<\/li><li data-list-item-id=\"e2d1e149a5bc08ded7277695c2a4a8533\">Шууд үр нөлөө өгөх ба үүссэн коллаген нь эхний шимэгдэлтийн дараа байгалийн үр дүнг харуулдаг. &nbsp;<\/li><li data-list-item-id=\"e4c05090c4e53086d284dc2d550022899\">Сард 2 удаа тариулснаар үр нөлөө 1 жил хүртэл хадгалагдана. <strong>Үр дүн хүн бүрт өөр байж болно.<\/strong><\/li><\/ul><p>&nbsp;<\/p><p><strong>REDIESSE-ийн талаарх чухал мэдээлэл<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eceed91bbdbda51c082c80945a7dbd32a\">Коллаген нь коллагеныг үндсэн найрлага болгон ашигладаг арьс сайжруулагч юм. &nbsp;<\/li><li data-list-item-id=\"e1dd1a6984f1f3c241d5d16dba511ea61\">CaHa нь коллагеныг удаан хадгалахад тусалдаг кальци агуулдаг. &nbsp;<\/li><li data-list-item-id=\"e96001dd22e5cd89ee4d3bd619c9c9d12\">4.5cc эзэлхүүн нь ерөнхийдөө нүүрийг бүхэлд нь хамрахад хангалттай боловч арьсны байдлаас хамаарч хэрэгцээ өөр байж болно. Зөвлөгөө авахыг зөвлөнө. &nbsp;<\/li><li data-list-item-id=\"ed3b289669c4cf0cc7c54d185bcb4c5c4\">Нэг удаа тариулахад үр дүнтэй боловч удаан хадгалагдах үр дүнгийн тулд сард 2 удаа тариулахыг зөвлөнө.<\/li><\/ul><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery-ийн байршил<\/strong><br>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/1039;\" src=\"https://image.kbstations.com/2026/02/12/74e25675-3f59-445f-8eb2-4ed02197be75\" width=\"800\" height=\"1039\"><\/figure><p>&nbsp;<\/p><p>REDIESSE-ийн талаар нэмэлт асуулт байвал бидэнтэй шууд холбогдоно уу.<\/p><\/div>"},{"pid":"1866","title":"Belotero Revive 1cc","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:800/795;\" src=\"https://image.kbstations.com/2026/02/12/8385ba96-9159-4c72-b978-bbb72a3caa23\" width=\"800\" height=\"795\"><\/figure><p><strong>AllLiting арьс чангалагч<\/strong><br>Арьсны хамгийн гүн давхарга хүртэлх хуурайшилтыг сайжруулах арьс чангалалт &nbsp;<\/p><p>&nbsp;<\/p><p><strong>BELOTERO REVIVE &nbsp;<\/strong><br>1 удаагийн тарилгаар давхар үр нөлөө &nbsp;<br>Шинэ үеийн дээд зэрэглэлийн арьс чангалагч &nbsp;<\/p><p>&nbsp;<\/p><p><strong>Соён-жүсагийн найрлага:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e3e2f78146ed0605744c704481f2a139e\">Гиалуроны хүчил (чийгшүүлэх) &nbsp;<\/li><li data-list-item-id=\"e0bc6c55487cd9ed6f139cdbb44974331\">Глицерин (чийг түгжих) &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Нэг удаагийн ажилбараар дараахыг өгнө: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e97ba6bfc134f5732ab6e41a10caacc44\">Гүн чийгшил &nbsp;<\/li><li data-list-item-id=\"eec6690203b5e883b367869a3a4e77936\">Зэрэг чийг түгжих &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Соён-жүсагийн үр нөлөө:<\/strong><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eb2d4b34125a9ec940146f77d7338fff1\">Арьсны өнгийг сайжруулж, уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><li data-list-item-id=\"ef576e41d95ec45826f4bd01cc7b79c48\">Арьсны хамгаалалтын давхаргыг бэхжүүлэх &nbsp;<\/li><li data-list-item-id=\"e980d9f7c778853d75193d85d11ee4682\">Тод харагдах гялалзсан арьсны үр нөлөө &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:800/749;\" src=\"https://image.kbstations.com/2026/02/12/06afb34c-5966-401e-bec6-499a3b1559cd\" width=\"800\" height=\"749\"><\/figure><p><strong>Соён-жүсагийн тухай Q&amp;A<\/strong> &nbsp;<\/p><p>Q: Соён-жүса бусад арьс чангалагчаас юугаараа ялгаатай вэ? &nbsp;<br>A: Ердийн арьс чангалагч ихэвчлэн зөвхөн гиалуроны хүчил агуулдаг. Соён-жүса нь глицерин нэмж агуулснаар нэг удаагийн ажилбараар чийгшүүлж, зэрэг чийгийг түгждэг. Энэ ажилбар бараг өвдөлтгүй, тодорхой үр дүн өгч, нүүр будалтын наалдацыг сайжруулдаг. &nbsp;<\/p><p>Q: Глицерин гэж юу вэ? &nbsp;<br>A: Глицерин бол чийгийг түгжих чухал найрлага юм. Гиалуроны хүчил нь чийгшүүлэх үүрэгтэй бол глицерин нь чийгийг түгждэг. Энэ хоёр найрлага хамтран Соён-жүсаг бүрдүүлдэг. &nbsp;<\/p><p>Q: Хэр их хэмжээ шаардлагатай вэ? &nbsp;<br>A: Нүүрний бүтэн эмчилгээнд хамгийн багадаа 2–3 cc-ийг зөвлөдөг. Тун нь хүн бүрт өөр өөр байж болох тул биечлэн ирж зөвлөгөө авахыг зөвлөнө. &nbsp;<\/p><p>&nbsp;<\/p><p><strong>AllLiting Plastic Surgery эмнэлгийн байршил<\/strong><\/p><figure class=\"image\"><img style=\"aspect-ratio:800/1039;\" src=\"https://image.kbstations.com/2026/02/12/1d61b884-ec60-47a2-9aea-7a4edf2e58e5\" width=\"800\" height=\"1039\"><\/figure><\/div>"}];window.DESIGNER=[{"pid":"3001","title":"Shurink Universe 600 Shot","url":"https://www.k-beautystation.com/id/products/3001-shurink-universe-600-shot"},{"pid":"3004","title":"Onda Lifting","url":"https://www.k-beautystation.com/id/products/3004-onda-lifting"},{"pid":"3028","title":"Titanium Lifting 80KJ","url":"https://www.k-beautystation.com/id/products/3 <script>
const P = window.PRODUCTS || [], DES = window.DESIGNER || [], TOTAL = window.TOTAL_NORMAL || P.length;
const DONE = JSON.parse(localStorage.getItem('kbs_mn_done') || '{}');
let tab = 'gen';
function saveDone(){ localStorage.setItem('kbs_mn_done', JSON.stringify(DONE)); }
function setTab(t){ tab=t; document.getElementById('tabGen').classList.toggle('active',t==='gen'); document.getElementById('tabDes').classList.toggle('active',t==='des'); document.getElementById('ctrls').style.display=t==='gen'?'flex':'none'; render(); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

async function copyRich(html){
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html],{type:'text/plain'})})]); return true; }
  catch(e){ const d=document.createElement('div'); d.contentEditable='true'; d.style.cssText='position:fixed;left:-9999px;top:0'; d.innerHTML=html; document.body.appendChild(d); const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r); let ok=false; try{ok=document.execCommand('copy');}catch(_){} s.removeAllRanges(); d.remove(); return ok; }
}
function doCopy(pid, btn){
  const it=P.find(x=>x.pid===pid); if(!it) return;
  copyRich(it.html).then(ok=>{ if(ok){ toast('📋 복사됨 — 에디터에서 Ctrl+V'); btn.classList.add('copied'); btn.textContent='✓ 복사됨'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1500); if(!DONE[pid]){DONE[pid]=true;saveDone();render();} } else toast('복사 실패 — 미리보기에서 수동 복사하세요'); });
}
function togglePrev(pid){ const el=document.getElementById('prev-'+pid); if(!el)return; if(el.classList.contains('open')){el.classList.remove('open');return;} const it=P.find(x=>x.pid===pid); el.innerHTML='<iframe srcdoc="'+(it.html.replace(/"/g,'&quot;'))+'"></iframe>'; el.classList.add('open'); }
function toggleDone(pid){ DONE[pid]=!DONE[pid]; saveDone(); render(); }

function render(){
  const doneN = P.filter(x=>DONE[x.pid]).length;
  document.getElementById('pbar').style.width = (P.length?doneN/P.length*100:0)+'%';
  document.getElementById('stat').textContent = '완료 '+doneN+' / 생성 '+P.length+'  (정상 전체 '+TOTAL+' · 디자이너 '+DES.length+')';
  const list=document.getElementById('list');
  if(tab==='des'){
    list.innerHTML = DES.length? DES.map(d=>'<div class="card"><div class="row"><span class="pid">'+d.pid+'</span><span class="title">'+esc(d.title)+'</span><a class="dlink" href="'+d.url+'" target="_blank">FO 페이지 ↗</a></div></div>').join('') : '<div class="empty">없음</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstatus').value, fd=document.getElementById('fdone').value;
  let items=P.filter(x=>{
    if(q && !((x.title||'').toLowerCase().includes(q) || x.pid.includes(q))) return false;
    if(fs && x.status!==fs) return false;
    if(fd==='done' && !DONE[x.pid]) return false;
    if(fd==='todo' && DONE[x.pid]) return false;
    return true;
  });
  list.innerHTML = items.length? items.map(x=>
    '<div class="card'+(DONE[x.pid]?' done':'')+'">'+
      '<div class="row">'+
        '<span class="pid">'+x.pid+'</span>'+
        '<span class="title">'+esc(x.title)+'</span>'+
        '<span class="badge '+x.source+'">'+(x.source==='sheet'?'시트':'AI')+'</span>'+
        (x.status==='review'?'<span class="badge review">검토</span>':'')+
        '<button class="btn copy" onclick="doCopy(\''+x.pid+'\',this)">📋 복사</button>'+
        '<button class="btn" onclick="togglePrev(\''+x.pid+'\')">👁 미리보기</button>'+
        '<label class="chk"><input type="checkbox" '+(DONE[x.pid]?'checked':'')+' onchange="toggleDone(\''+x.pid+'\')">완료</label>'+
      '</div>'+
      '<div class="prev" id="prev-'+x.pid+'"></div>'+
    '</div>').join('') : '<div class="empty">결과 없음</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
render();
</script>
