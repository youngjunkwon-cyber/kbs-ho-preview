/p><ul><li data-list-item-id=\"ed374141b5859d065282eb50e85a9dad5\">Хурдан эмчилгээний өргөн цацрагийн хэмжээ <\/li><li data-list-item-id=\"eac0bc076d8ddcba199c0a449b86d38ee\">Нөхөн сэргэлтийг хурдасгаж, өвдөлтийг бууруулдаг бага температурын сапфир хөргөх систем &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Танд дараах асуудал байна уу: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e0eafe260d5763f3aebb63cbaabe5ec0e\">Нүүрний улайлт эсвэл улаан нарийн судас? <\/li><li data-list-item-id=\"e80757e4728c515496371125319d774cb\">Мелазма эсвэл пигментацийн толбо? <\/li><li data-list-item-id=\"ed189ddd32a3ee8becd69f9286dc09ee8\">Венийн асуудал? &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>CUTERA CoolView&nbsp;<\/strong><br>Эмчилгээний явцад нөхөн сэргэлтийг хурдасгаж, өвдөлтийг бууруулдаг сапфир хөргөх технологи.<\/p><p>&nbsp;<\/p><p><strong>Accolade лазер CYNOSURE — 185,900 KRW<\/strong><br>755 нм долгионы урттай Q-switched Alexandrite лазер, Зүүн Азийн арьсны пигментацийн эмчилгээнд тохиромжтой. &nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:458/317;\" src=\"https://image.kbstations.com/2026/02/13/01601fc5-3a67-4a3e-857c-58c333ccf6b3\" width=\"458\" height=\"317\"><\/figure><p>Accolade-ийн давуу тал: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e408f441f477f9d3070ee60be6e0f9bce\">Меланинд өндөр сонгомол байдлаар хэвийн арьсны эдийн гэмтлийг хамгийн бага болгоно <\/li><li data-list-item-id=\"e47ba795ce83726469fa0750f3649afcf\">Лазер технологийн дэлхийн тэргүүлэгчдийн нэг Cynosure-ийн лазер<\/li><li data-list-item-id=\"e9ec6aae7d44fbabbcedc395ea7fc68c4\">Сэвх, толбо, мэнгэ зэрэг эмчлэхэд хэцүү пигментацид байгалийн цайруулах нөлөө үзүүлнэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Дараах хүмүүст тохирно:<\/p><ul><li data-list-item-id=\"e56e4e473022a5dea994a5d61c8484e1d\">Мелазма, сэвх, пигментацийн толботой <\/li><li data-list-item-id=\"e0f7f17c490c43889cd1b4de5d944594d\">Улаан судас эсвэл нүүрний улайлттай <\/li><li data-list-item-id=\"ef037c27dd21451b5ef6b928dc7762cf3\">Батга, батганы сорвитой <\/li><li data-list-item-id=\"e331418c7e45bcb107b27addee72b94cc\">Арьсны уян хатан байдал, том нүх сүвийг сайжруулахыг хүсдэг <\/li><li data-list-item-id=\"e677c907c3fbfa8cf2b63a40c60c20cdc\">Нийлмэл арьсны асуудалд шийдэл хэрэгтэй &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:740/766;\" src=\"https://image.kbstations.com/2026/02/13/4597791a-1ac5-4383-bd18-8c914058e854\" width=\"740\" height=\"766\"><\/figure><p>Ажилбарын дараах анхаарах зүйлс:<\/p><ul><li data-list-item-id=\"ef3a33da350c913b1250571cbff81de35\">&nbsp;Судасны эмчилгээний дараа 1–2 хоног нүүр хавагнаж болзошгүй <\/li><li data-list-item-id=\"ecd11e0611ed273dc16e2999f0cee3cbd\">Халуун сауна, нийтийн рашаан, уурын өрөө, архи, тамхинаас зайлсхий <\/li><li data-list-item-id=\"e674541ddbc9de8246d45b3d7e40ec3a0\">Нүүрээ бүлээн усаар зөөлөн угаа <\/li><li data-list-item-id=\"ea6481edb0a6e35399f97ebfad0946758\">Пигментацийн эмчилгээний дараа арьсны өнгө бараантаж эсвэл цэр тогтож болзошгүй; хүчээр хуулахгүй, байгалийн жамаар унатал нь хүлээ &nbsp;<\/li><\/ul><p>Хамгийн сайн үр дүн, тухтай нөхөн сэргэлтийн төлөө тэргүүлэх лазер технологиор арьсаа арчлаарай.<\/p><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/13/911dc3ae-b399-4774-8fae-5404fae983f9\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"1993","title":"Full Face Volnewmer Lifting Treatment","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:721/714;\" src=\"https://image.kbstations.com/2026/02/13/42d92b07-9772-4106-ba2a-5c5e0c3a79bf\" width=\"721\" height=\"714\"><\/figure><p><strong>Давтагдашгүй RF радио давтамжийн туршлагыг мэдрээрэй<\/strong>✨<\/p><p>&nbsp;<\/p><p><strong>Volumer Lifting<\/strong><\/p><p><br>Volumer нь монополяр RF (радио давтамж) технологиор дулааны энергийг арьсны дермисийн давхаргад хүргэж, эдийн коагуляцийг өдөөхийн зэрэгцээ радио давтамжийн лифтинг технологиор коллагены нөхөн төлжилтийг идэвхжүүлдэг.<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ef841eac57459ec9dc52a373987da6e3c\">Дулааны энергийг нарийн, үр дүнтэй дамжуулна <\/li><li data-list-item-id=\"eb2a967fb386dcfdc04385282d28eba21\">Хөргөх ба чичиргээний горим ажилбарын үед өвдөлтийг бууруулна<\/li><li data-list-item-id=\"e00de26944c42dcf75cd75f39d2881d42\">Солонгосын Хүнс, эмийн аюулгүй байдлын яам (MFDS)-аар баталгаажсан монополяр RF төхөөрөмж <\/li><li data-list-item-id=\"e5724a23b9fcb3c7fb444ea7cb38ad294\">Эмчилгээний хэсэг бүрт тохирсон төрөл бүрийн тип <\/li><li data-list-item-id=\"e0c847fdeab3fde5c41945e0a43af4374\">Нөхөн сэргэх хугацаагүй&nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:709/433;\" src=\"https://image.kbstations.com/2026/02/13/cc9a7bd1-53fd-46cd-8b4c-415e6764edee\" width=\"709\" height=\"433\"><\/figure><p>&nbsp;<\/p><p><strong>Эмчилгээний сонголт ба үнэ<\/strong><\/p><ul><li data-list-item-id=\"e150ddb7e6ee64ae1d762d0a50a801ae7\">Volumer 600 шот — 825,000 KRW (НӨАТ багтсан) <\/li><li data-list-item-id=\"e726037baa18c69ac3c325fed98334f05\">Нүдний орчим Volumer 200 шот — 638,000 KRW (НӨАТ багтсан)&nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:700/570;\" src=\"https://image.kbstations.com/2026/02/13/92daf174-7a97-437b-9dc9-ecb10e97d4d3\" width=\"700\" height=\"570\"><\/figure><p><strong>Volumer-ийн дэвшилтэт технологи<\/strong><\/p><ul><li data-list-item-id=\"e6249a0e544ead9e4ceaa67e58b33f2e2\">Хувь хүнд тохируулан 4.5 мм гүн хүртэл нарийн лифтинг<\/li><li data-list-item-id=\"e5acb393e42c8d84b5d1e0c270ef8579f\">Volumer Boundaryless Tip: &nbsp;<br>&nbsp;-TILTING TIP: энергийн гаралтын өнцгийг эмчилгээний хэсэгт тохируулан өөрчилнө &nbsp;<br>&nbsp; -FLEXIBLE TIP: агаарын дэрэвчтэй муруй хүрэлцэх гадаргуугаар хувийн эмчилгээ &nbsp;<br>&nbsp;<\/li><li data-list-item-id=\"e3be348362c726a2d37a79a8b043d7643\">Volumer хөргөх систем: &nbsp;<br>&nbsp; -Усан суурьтай хөргөх горим ба сэргээх чичиргээний горим &nbsp;<br>&nbsp; -Тусдаа импульсгүй тогтмол хөргөх температур &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:672/568;\" src=\"https://image.kbstations.com/2026/02/13/602ba58b-5f5d-4719-b062-c2d62ea3d61d\" width=\"672\" height=\"568\"><\/figure><p><strong>Volumer-ийг хэнд санал болгох вэ<\/strong><br>Дараах хүмүүст тохирно: &nbsp;<\/p><ul><li data-list-item-id=\"eda51ff4b4980a662c36e17cf81dd7d31\">Жигд бус нүүрний галбирыг засахыг хүсдэг <\/li><li data-list-item-id=\"ea5f20b0e896ab1ea79efb03edf002eed\">Уян хатан байдлаа алдсан арьстай <\/li><li data-list-item-id=\"e755c5ba454a7d9f885dbbdba36b8d59c\">Хөгшрөлтийн эсрэг арчилгаа хүсдэг <\/li><li data-list-item-id=\"e52c2422f87017724763f205857b588f0\">Эрүүний шугам, нүүрний галбир сулрах <\/li><li data-list-item-id=\"e2503518c7d9fc96b943e3b714ff6065c\">Хувь хүнд тохирсон 1:1 лифтинг хүсдэг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Volumer эмчилгээний дараах анхаарах зүйлс<\/strong><\/p><ul><li data-list-item-id=\"e2f123a7158860d0d9d226cc81943f696\">Дулаан суурьтай RF эмчилгээ тул улайлт ойролцоогоор 1 долоо хоног үргэлжилж болно <\/li><li data-list-item-id=\"edfda142c128a6c5ef11a6f26474de354\">Халуун сауна, нийтийн рашаан, жимжилбан, архи, тамхинаас зайлсхий <\/li><li data-list-item-id=\"eb489a31f642091b55c6f8105c7ea6aae\">Улайлт, загатнаа гарч болзошгүй; арьсаа маажихаас зайлсхий<\/li><li data-list-item-id=\"e8873592e33cd9f866d4c1fa5c43e01b5\">Хэт ягаан туяанаас хамгаалахын тулд нарны тосыг тогтмол хэрэглэ<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/13/b492738f-6b83-4bf4-b4b1-ade222eb1c58\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"1994","title":"Juvelook Skin Repair Injection","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:773/771;\" src=\"https://image.kbstations.com/2026/02/13/b6dad1c9-2323-4465-9d14-70b78f54e55d\" width=\"773\" height=\"771\"><\/figure><p><strong>JUVELOOK SKIN BOOSTER&nbsp;<\/strong><br>Илүү эрүүл, гэрэлтэй арьсны төлөө байгалийн коллаген үүсэлтийг нэмэгдүүлнэ. &nbsp;<\/p><p>&nbsp;<\/p><p>✨ Ач тус: &nbsp;<br>&nbsp;<\/p><p>Нүх сүвийг багасгах &nbsp;<br>Арьсны уян хатан байдлыг сайжруулах &nbsp;<br>Нарийн үрчлээг бууруулах &nbsp;<br>Арьсны бүтэц, сорвийг сайжруулах &nbsp;<br>Дермисийн давхаргын коллаген нөхөн төлжилтийг нэмэгдүүлэх &nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:756/516;\" src=\"https://image.kbstations.com/2026/02/13/90147fbf-66a2-4782-a88e-902943e528e9\" width=\"756\" height=\"516\"><\/figure><p><strong>JUVELOOK Skin Booster тарианы багцын сонголт:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e1245ddbf2926d8ea2a8406e246de8620\">1 cc — 99,000 KRW <\/li><li data-list-item-id=\"e26c8c49fcc89d61beb7e677aadeb4bef\">2 cc — 275,000 KRW (нүүр бүхэлд арьс чангалах гялбаа) <\/li><li data-list-item-id=\"eaf435328a470ad4a8a6faead880c6644\">4 cc — 330,000 KRW <\/li><li data-list-item-id=\"eca33b7c611363251b821e691f4de8b38\">8 cc — 649,000 KRW &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p><strong>Хүзүүний үрчлээний эмчилгээ INMODE (FORMA):<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e418b05fbdcda9e76a8d57ebef53d8ea7\">2 cc — 231,000 KRW&nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:773/585;\" src=\"https://image.kbstations.com/2026/02/13/f7ef8a80-a764-4d17-a1dd-1b7c14b3bee0\" width=\"773\" height=\"585\"><\/figure><p>JUVELOOK нь Америкийн FDA болон Солонгосын KFDA баталгаажуулсан P(DL)LA полимер ба гиалуроны хүчил (HA)-ийн хослол юм. Энэ бүтээгдэхүүн нь үлдэгдэлгүйгээр биед бүрэн шингэж, байгалийн эзлэхүүн, уян хатан байдал, арьсны бүтцийг сайжруулах нөлөө үзүүлдэг. &nbsp;<\/p><p>&nbsp;<\/p><p><strong>JUVELOOK-ийн давуу тал:<\/strong><br>&nbsp;<\/p><ul><li data-list-item-id=\"e717ccd816fd42b236cd1dc57bd0e9821\">Дермисийн давхаргад коллаген үүсэлтийг идэвхжүүлнэ <\/li><li data-list-item-id=\"ea83d71043e7c42 <script>
const P = window.PRODUCTS || [], DES = window.DESIGNER || [], TOTAL = window.TOTAL_NORMAL || P.length;
const DONE = JSON.parse(localStorage.getItem('kbs_mn_done') || '{}');
let tab = 'gen';
function saveDone(){ localStorage.setItem('kbs_mn_done', JSON.stringify(DONE)); }
function setTab(t){ tab=t; document.getElementById('tabGen').classList.toggle('active',t==='gen'); document.getElementById('tabDes').classList.toggle('active',t==='des'); document.getElementById('ctrls').style.display=t==='gen'?'flex':'none'; render(); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

async function copyRich(html){
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html],{type:'text/plain'})})]); return true; }
  catch(e){ const d=document.createElement('div'); d.contentEditable='true'; d.style.cssText='position:fixed;left:-9999px;top:0'; d.innerHTML=html; document.body.appendChild(d); const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r); let ok=false; try{ok=document.execCommand('copy');}catch(_){} s.removeAllRanges(); d.remove(); return ok; }
}
function doCopy(pid, btn){
  const it=P.find(x=>x.pid===pid); if(!it) return;
  copyRich(it.html).then(ok=>{ if(ok){ toast('📋 복사됨 — 에디터에서 Ctrl+V'); btn.classList.add('copied'); btn.textContent='✓ 복사됨'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1500); if(!DONE[pid]){DONE[pid]=true;saveDone();render();} } else toast('복사 실패 — 미리보기에서 수동 복사하세요'); });
}
function togglePrev(pid){ const el=document.getElementById('prev-'+pid); if(!el)return; if(el.classList.contains('open')){el.classList.remove('open');return;} const it=P.find(x=>x.pid===pid); el.innerHTML='<iframe srcdoc="'+(it.html.replace(/"/g,'&quot;'))+'"></iframe>'; el.classList.add('open'); }
function toggleDone(pid){ DONE[pid]=!DONE[pid]; saveDone(); render(); }

function render(){
  const doneN = P.filter(x=>DONE[x.pid]).length;
  document.getElementById('pbar').style.width = (P.length?doneN/P.length*100:0)+'%';
  document.getElementById('stat').textContent = '완료 '+doneN+' / 생성 '+P.length+'  (정상 전체 '+TOTAL+' · 디자이너 '+DES.length+')';
  const list=document.getElementById('list');
  if(tab==='des'){
    list.innerHTML = DES.length? DES.map(d=>'<div class="card"><div class="row"><span class="pid">'+d.pid+'</span><span class="title">'+esc(d.title)+'</span><a class="dlink" href="'+d.url+'" target="_blank">FO 페이지 ↗</a></div></div>').join('') : '<div class="empty">없음</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstatus').value, fd=document.getElementById('fdone').value;
  let items=P.filter(x=>{
    if(q && !((x.title||'').toLowerCase().includes(q) || x.pid.includes(q))) return false;
    if(fs && x.status!==fs) return false;
    if(fd==='done' && !DONE[x.pid]) return false;
    if(fd==='todo' && DONE[x.pid]) return false;
    return true;
  });
  list.innerHTML = items.length? items.map(x=>
    '<div class="card'+(DONE[x.pid]?' done':'')+'">'+
      '<div class="row">'+
        '<span class="pid">'+x.pid+'</span>'+
        '<span class="title">'+esc(x.title)+'</span>'+
        '<span class="badge '+x.source+'">'+(x.source==='sheet'?'시트':'AI')+'</span>'+
        (x.status==='review'?'<span class="badge review">검토</span>':'')+
        '<button class="btn copy" onclick="doCopy(\''+x.pid+'\',this)">📋 복사</button>'+
        '<button class="btn" onclick="togglePrev(\''+x.pid+'\')">👁 미리보기</button>'+
        '<label class="chk"><input type="checkbox" '+(DONE[x.pid]?'checked':'')+' onchange="toggleDone(\''+x.pid+'\')">완료</label>'+
      '</div>'+
      '<div class="prev" id="prev-'+x.pid+'"></div>'+
    '</div>').join('') : '<div class="empty">결과 없음</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
render();
</script>
