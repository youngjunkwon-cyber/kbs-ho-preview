"font-size:20px;\"><strong>GUNGSEOCHAE Seolleung-д байгалийн шинэ хэв маяг,<\/strong><\/span><\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>мэргэжлийн арчилгааны туршлагыг эдлээрэй.<\/strong><\/span><\/p><\/div>"},{"pid":"2125","title":"Injection Kontur + Botox Dagu","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Reverse арьсны эмнэлэг Хун дэ салбар<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:446/486;\" src=\"https://image.kbstations.com/2026/02/20/57dff6e8-6f30-43cd-817f-9618eab6efbf\" width=\"446\" height=\"486\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>Давхар эрүү, хацрын өөх, тод доод эрүүний шугамыг арилгаж илүү туранхай нүүртэй болохыг хүсэж байна уу? &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><br><span style=\"font-size:20px;\"><strong>Contour TOX<\/strong><\/span><\/p><p>&nbsp;нь дараах зорилгод зориулсан шинэлэг тарианы шийдэл юм: &nbsp;<\/p><ul><li data-list-item-id=\"e9f105208f85958a94a5198d384931bf9\">Давхар эрүү, хацрын өөх, доод эрүүний шугамын илүүдэл эзлэхүүнийг бууруулна &nbsp;<\/li><li data-list-item-id=\"e375c4e6ed009a9301a94cf30b093757a\">Дэгжин V-line нүүрний контур бүрдүүлнэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Contour TOX нь давхар эрүү, хацрын хэсгийн өөхийг хайлуулж, захын цусны судас болон лимфийн эргэлтийг идэвхжүүлдэг. Энэ үйл явц нь илүүдэл өөхний хаягдлыг солилцоо болон гадагшлуулахад тусалж, зэрэгцэн зажлах булчинг багасгаж нүүрийг илүү туранхай, тэнцвэртэй харагдуулна.<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:153/189;\" src=\"https://image.kbstations.com/2026/02/20/923db090-6b3e-4e47-8a2b-8e805977ea2d\" width=\"153\" height=\"189\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Contour TOX-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ec465e571a7a7e2f93617e11dec866399\">Хацрын өөх, давхар эрүү, шанааны өөхийг бууруулна &nbsp;<\/li><li data-list-item-id=\"ed3bb984b567689fabeee9bf3f698ed01\">Зажлах булчинг багасгаж доод эрүүний шугамыг гөлгөр болгоно &nbsp;<\/li><li data-list-item-id=\"e0d24f0e5e3b8f8e39e03646f994790b9\">Байгалийн, идеал V-line нүүр бүрдүүлнэ &nbsp;<\/li><li data-list-item-id=\"ed344a020e8fe8a284f17d2a98f8c7223\">Стероид нэмээгүй &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Онцгой үнэ: 55,000 KRW (Үндсэн үнэ: 77,000 KRW) &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Contour TOX хэнд тохиромжтой вэ?<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e3d20b73ec1db676d37dd73e2533b7451\">Нүүрний уян хатан байдал буурч, эрүүний шугам унжсанд санаа зовдог &nbsp;<\/li><li data-list-item-id=\"e5d302598b13da4b74c383b16bc81fcad\">Шанааны эргэн тойронд товойсон өөхтэй &nbsp;<\/li><li data-list-item-id=\"ef9c6242772db619106d992ffc5afe1ca\">Хацрын өөх унжих, нүүрний шугам жигд бусаас болж нүүр хөгшин харагддаг<\/li><li data-list-item-id=\"e6f2d1f5c3da3b608f98b393855f1595f\">Давхар эрүү, эрүүний доод хэсэг, шанаа, хацарт илүүдэл өөхтэй &nbsp;<\/li><li data-list-item-id=\"ecd883646b905d591e1b77bb6c7b2d01b\">Зажлах булчин том тул нүүр өнцөгтэй харагддаг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:447/260;\" src=\"https://image.kbstations.com/2026/02/20/61fcd0d0-7dd7-4fa7-baa7-ed73d8243f83\" width=\"447\" height=\"260\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Чухал мэдээлэл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eb3a0109a572d5463c5239d2008dabaef\">Ажилбарын дараа хавдар, хөхрөлт, улайлт зэрэг түр зуурын урвал үүсч болно &nbsp;<\/li><li data-list-item-id=\"e6e1e60406e11a65ec0236237a7c5c426\">Санал болгох сессийн тоо: хувь хүний байдлаас хамаарч 3–5 удаа &nbsp;<\/li><li data-list-item-id=\"e229b2a91e90b567266948beed8c2353a\">Дахин ажилбарын зай: өмнөх сессээс хойш 1–2 сар &nbsp;<\/li><li data-list-item-id=\"e5d41207be04860a9788d467e40d573f2\">Ажилбарын үеийн өвдөлт ихэвчлэн зүү шиг бага &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Reverse арьсны эмнэлэг Хун дэ салбарт Contour TOX-оор илүү туранхай нүүр, байгалийн V-line контуртай болоорой! &nbsp;<br>#ReverseАрьснийЭмнэлэг #ContourTOX<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><\/div>"},{"pid":"2126","title":"Contour Injection + Botox Combo","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:952/950;\" src=\"https://image.kbstations.com/2026/02/20/21dcceb1-8e43-41c0-9693-eec567623f8b\" width=\"952\" height=\"950\"><\/figure><p style=\"text-align:center;\"><strong>Kontur TOX: Илүү туранхай нүүр, идеал V-Line-ийн дээд зэрэглэлийн шийдэл ✨<\/strong><\/p><p>&nbsp;<\/p><p>Kontur TOX нь дөрвөлжин эрүү, өөхлөг хацар, давхар эрүү зэрэг дүүрэн V-line нүүрийг багасгахад зориулсан шинэлэг тариа юм. Энэ ажилбар нь давхар эрүү, хацар, шанааны хэсгийн өөхийг хайлуулахаас гадна цусны судас болон лимфийн эргэлтийг идэвхжүүлж, биеийн хаягдлыг оновчтой гадагшлуулахад тусалдаг.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Kontur TOX-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e65483f74c0da2cda2bd5f8a7b6c63d08\">Хоёр талын эрүүний булчингийн эзлэхүүнийг бууруулж, нүүрийг илүү урт, туранхай харагдуулна <\/li><li data-list-item-id=\"e9409dd921544cb222d02ce7000e25684\">Хацрын өөх, давхар эрүү, шанааны хэсгийн өөхийг хайлуулна <\/li><li data-list-item-id=\"eba79416c4373340c8d30202457b91e3a\">Нүүрийг илүү жижиг, төгс контуртай харагдуулахад тусална <\/li><li data-list-item-id=\"e17fcdf6b6b4c6ffb855e653bdd0daec3\">Цус болон лимфийн эргэлтийг идэвхжүүлж байгалийн хоргүйжүүлэлт хийнэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:930/616;\" src=\"https://image.kbstations.com/2026/02/20/3bc9d607-1331-4e9c-b179-62d0658765af\" width=\"930\" height=\"616\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Дараах хүмүүст санал болгоно:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ea5af912511ebd6410d589ce173df7b5d\">Дөрвөлжин эрүү буюу том эрүүний булчинтай <\/li><li data-list-item-id=\"ec244329dd4b2cd0489de405fd48050bd\">Нүүрний уян хатан байдал буурч эрүүний шугам тод бус болсон <\/li><li data-list-item-id=\"e2896a4c27c7060024025ff3b71b6675f\">Хацар, давхар эрүү буюу шанаандаа илүүдэл өөхтэй <\/li><li data-list-item-id=\"eebafa450efdbcece8b2a9a37cb11c2b9\">Мэс заслын нөлөөгүйгээр илүү гөлгөр нүүр хүсдэг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Ажилбар ба үр дүн:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ed703a101c1f6db872c83606165cbbb27\">Contour тариа 12cc + Эрүүний Botox 50u <\/li><li data-list-item-id=\"ee6164381bc922c7541b8bcdbf08953d2\">Стероидгүй, аюулгүй бөгөөд хурдан <\/li><li data-list-item-id=\"e79a9b767d283d0835dc66414330a589c\">Ажилбарын дараа түр зуурын хавдар, хөхрөлт буюу улайлт үүсч болно &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:849/931;\" src=\"https://image.kbstations.com/2026/02/20/a6b152d6-6f28-4395-8446-3b3e15a2c3c5\" width=\"849\" height=\"931\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Түгээмэл асуултууд:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e142c19404528efc3e27ed0e91086ae1a\"><strong>Хэдэн удаа эмчилгээ хийх вэ?<\/strong> Хувь хүний байдлаас хамаарч 3-5 удаагийн сесс санал болгоно <\/li><li data-list-item-id=\"ee399b70096f4d88f12041c43558a58a4\"><strong>Сессийн хоорондын зай?<\/strong> Эхний сессээс хойш 1-2 сарын дараа дахин хийж болно <\/li><li data-list-item-id=\"e3ac2654dd2eba505a439aa9f2c5f428e\"><strong>Өвддөг үү?<\/strong> Өвдөлт хамгийн бага, жижиг зүү шиг &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:571/1175;\" src=\"https://image.kbstations.com/2026/02/20/eaf20498-9d9d-4dfd-8699-654d0a0a412b\" width=\"571\" height=\"1175\"><\/figure><p>Kontur TOX-оор нүүрээ байгалийн #КонтурVLine болгон хувиргах нь одоо илүү хялбар боллоо. Илүү туранхай нүүр, илүү тод эрүүний шугам, илүү өөртөө итгэлтэй төрх. &nbsp;<br>Зөвлөгөө авах, ажилбараа товлохын тулд бидэнтэй холбогдоорой!<\/p><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/20/c393de98-accd-4b1b-ba9e-0405e7c6c46f\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"2128","title":"Violet Korea 2cc × InMode FX Program Double Chin &amp; Jawline","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Солонгос дахь шилдэг давхар эрүүний өөх задлах тариа — V-OLET<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:522/356;\" src=\"https://image.kbstations.com/2026/02/20/b9b52c71-80bf-461a-911f-7b6afe920a66\" width=\"522\" height=\"356\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>Давхар эрүү болон унжсан эрүүний арьсандаа санаа зовдог уу? &nbsp;<br>V-OLET нь давхар эрүү болон доод эрүүний шугамыг сайжруулахаар Солонгост зөвшөөрөгдсөн давхар эрүүнд зориулсан цорын ганц өөх задлах тариа юм.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>V-OLET-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e344a8b0b94e725bcc25270eb65b7f827\">Өөхний эсийн мембраныг үр дүнтэй задалж давхар эрүү болон эрүүний доорх өөхийг бууруулна &nbsp;<\/li><li data-list-item-id=\"edfdbbfa2f49ce69262255c12532e4b6d\">Эрүүний шугамыг илүү туранхай, тод болгоход тусална &nbsp;<\/li><li data-list-item-id=\"ecd13c81f797875ff3b785dd23588caec\">Стероидгүй тул буцах урвалын эрсдэл бага &nbsp;<\/li><li data-list-item-id=\"e3c8f1827baa98bd4f4986927cb2be08a\">Коллаген нийлэгжилтийг идэвхжүүлж арьсны уян хатан байдлыг нэмэгдүүлнэ &nbsp;<\/li><li data-list-item-id=\"e297fda5ec2b93093bbd05edb81daef1f\">Өөхийг байгалийн жамаар задалдаг хоёрдогч цөсний хүчил болох Deoxycholic Acid (DCA) ашигладаг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Гол давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e36f501a782df517d83266d210ab45508\">Зүгээр өөх бууруулах биш, өөхний эсийг задлах замаар унжсан эрүү, давхар эрүүг сайжруулна &nbsp;<\/li><li data-list-item-id=\"ed4c96c633c39f76dab74bc31336c9a10\">Макрофагийн нэвчилт болон фибробластын өсөлтөөр арьсны нөхөн төлжилтийг дэмжинэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:502/267;\" src=\"https://image.kbstations.com/2026/02/20/ac1bf910-2f26-4522-a52f-841f66b7458a\" width=\"502\" height=\"267\"><\/figure><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>V-OLET хэнд тохиромжтой вэ?<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ecf90a74563724b97dfd74e188814b953\">Эрүүний хэсэгт илүүдэл өөхтэй &nbsp;<\/li><li data-list-item-id=\"e82123dc823bd557318c4a59f34871c49\">Буурсан нүүрний уян хатан байдлыг сайжруулахыг хүсдэг &nbsp;<\/li><li data-list-item-id=\"ed02894b7859838c8108f3660fcf01020\">Эрүү, хүзүүний хил тод бус &nbsp;<\/li><li data-list-item-id=\"e5fb87f15f0631248dd09d75b58dfb099\">Давхар эрүүнээс үүдэх хүнд төрхийг арилгахыг хүсдэг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:523/216;\" src=\"https://image.kbstations.com/2026/02/20/82f2a575-3863-45b9-ad94-9d47787ed311\" width=\"523\" height=\"216\"><\/figure><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:519/235;\" src=\"https://image.kbstations.com/2026/02/20/b7188d9b-43f5-42e7-a142-785f8147f8d3\" width=\"519\" height=\"235\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>V-OLET багц:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e0a0c7dcc9ade6218a318e0f630d22981\">V-OLET 2cc + InMode FX (давхар эрүү + доод эрүүний шугам) — 266,200 KRW &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Ажилбарын дараах анхаарах зүйл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e5bd3527a8ab5cda7547a00469b39b03b\">Бага зэргийн өвдөлт, хавдар, хөхрөлт үүсч болно &nbsp;<\/li><li data-list-item-id=\"e71151e12f60e4a9b396376447ca9f76a\">DCA-ийн өөхний эс задлах нөлөөгөөр хавдар 1 долоо хоногоос дээш үргэлжилж болно &nbsp;<\/li><li data-list-item-id=\"e136450ece6d7d94a90c47394c950e00f\">Нөхөн сэргэх хугацаанд сауна, жимжилбан, халуун усанд орох, дулаан жин тавих болон бусад өндөр температуртай орчноос зайлсхий &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Давхар эрүүгээ сайжруулахдаа Солонгосын шинэлэг, найдвартай шийдэл V-OLET-д даатгаарай.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><\/div>"},{"pid":"2129","title":"InMode Full Face 10 Menit FX + FORMA Firming Cepat","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>REVERSE нь INMODE-ийг Long Mode-оор ашигладаг!<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>Ажилбарын хугацааны талаар санаа зовохгүйгээр 2-р үеийн хамгийн сүүлийн үеийн InMode лифтинг арчилгааг эдлээрэй.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>InMode Long Mode багцын сонголт:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eaba8a4bc211c71ca301908426b6848ba\">InMode бүтэн нүүр FX 10 минут — 99,000 KRW &nbsp;<\/li><li data-list-item-id=\"e294b601e2d837d3e4385ab9272c943b9\">InMode бүтэн нүүр FORMA 10 минут — 121,000 KRW &nbsp;<\/li><li data-list-item-id=\"e68e337b3b941560edac44b25d2daf68e\">InMode бүтэн нүүр FX+FORMA 20 минут — 209,000 KRW &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>InMode Long Mode-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e2236cb848c9c05b495e0310d40f6b1c4\">Ажиллах хэсэг: урд хацар, хажуу хацар, доод эрүүний шугам, давхар эрүү &nbsp;<\/li><li data-list-item-id=\"ea0fb575a8c02ad9ad1e54d163483fd11\">Энгийн InMode-той харьцуулахад 2–2.5 дахин үр дүнтэй &nbsp;<\/li><li data-list-item-id=\"efbf6336b25243c8d11400d6bbcb64f4b\">Хоёр горимоор өөх болон арьсны уян хатан байдлыг зэрэг арилгана &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:207/190;\" src=\"https://image.kbstations.com/2026/02/20/f84e2938-3262-4b42-890d-d35dc277fc6a\" width=\"207\" height=\"190\"><\/figure><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>InMode Lifting технологи:<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br><span style=\"font-size:20px;\"><strong>MINI FX:&nbsp;<\/strong><\/span> Температурыг 45–47°C болгож өөрчилдөг HVP энергиэр илүүдэл өөхийг арилгаж, өөхний эсийн апоптозыг үр дүнтэй өдөөнө &nbsp;<\/p><p>&nbsp;<\/p><p><br><span style=\"font-size:20px;\"><strong>FORMA:&nbsp;<\/strong><\/span> Коллаген болон гиалуроны хүчлийн үүсэлтийг идэвхжүүлдэг MULTI-POLAR энергиэр дермис давхаргыг лифтинг хийж, арьсны гадаргуугийн температурыг 43°C хүртэл өсгөж унжсан арьс, нарийн үрчлээг сайжруулна &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>2-р үеийн InMode RF-ийн онцлог:<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>- Секундэд 1000 удаа хэмждэг температур мэдрэгч технологитой &nbsp;<br>- Тогтвортой дулааны гаралт, илүү аюулгүй арчилгааны төлөө бодит цагийн температурын хяналт &nbsp;<br>- Өөхний эсийн апоптозыг үндсээр нь өдөөдөг онцгой High Voltage Pulse (HVP) технологи &nbsp;<br>- Энерги авсан өөхний эсүүд 2–4 долоо хоногт байгалийн жамаар гадагшилж, буцах нөлөөгүйгээр удаан хадгалагдах өөх бууруулах нөлөө өгнө &nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:618/277;\" src=\"https://image.kbstations.com/2026/02/20/bee61bec-e9f0-486d-b8da-aa4945aad76d\" width=\"618\" height=\"277\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>InMode Long Mode Lifting хэнд тохиромжтой вэ?<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e1e7bf03d3cd0b16ce8e40ee862c18c51\">InMode хийлгэж үзсэн ч үр дүн нь хангалтгүй санагдсан &nbsp;<\/li><li data-list-item-id=\"e693f8c71d23b30bc2bf21897a3402c4c\">Жигд бус нүүрний контурт санаа зовдог &nbsp;<\/li><li data-list-item-id=\"e10794d0bfa5efe1befb3a04d7d3417d1\">Зузаан доод эрүүний шугам буюу хацар, давхар эрүү, шанааны өөхөнд санаа зовдог &nbsp;<\/li><li data-list-item-id=\"e2a9c2e3d105b3ff6ffbc7f3925e5a6ef\">Нүүрний доод хэсэг өргөн тул том харагддаг &nbsp;<\/li><li data-list-item-id=\"ee1bc632bb5cff4de14c4bee54bd1d25d\">Унжсан доод эрүүний шугам, буурсан уян хатан байдлыг засах V-line лифтинг хүсдэг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:610/186;\" src=\"https://image.kbstations.com/2026/02/20/4c0c4d6e-be56-4d81-91dd-0a0bdf0f83e9\" width=\"610\" height=\"186\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>InMode Lifting ажилбарын дараах анхаарах зүйл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e9c1b07b1656b634f5a5e6b7206ca2fe7\">Ажилбар хийсэн хэсгийг хүчтэй үрэх буюу цочроохоос зайлсхий &nbsp;<\/li><li data-list-item-id=\"ec1819f4afb0c9b3dbcb8ab81428a284d\">Сауна, нийтийн халуун ус, уурын өрөө, архи, тамхинаас зайлсхий &nbsp;<\/li><li data-list-item-id=\"e16d2fd06777e1d156152c7054522049b\">Хавдар, хөхрөлт, загатнаа түр зуур үүсч болох ба байгалийн жамаар арилна &nbsp;<\/li><li data-list-item-id=\"e8ca5297dea8ae4f82f531828b19c7539\">Жирэмсэн эмэгтэй, арьсны өвчтэй, цусны бүлэгнэлтийн эмгэгтэй хүмүүст тохиромжгүй &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>Оновчтой, аюулгүй үр дүнгийн төлөө нүүрний арчилгаагаа хамгийн сүүлийн үеийн InMode технологид даатгаарай.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><\/div>"},{"pid":"2136","title":"Potenza Laser","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Potenza – Таны арьсны асуудалд тохируулсан радио давтамжийн лазер арчилгаа<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:284/383;\" src=\"https://image.kbstations.com/2026/02/20/655d948c-f374-4618-a605-3d59038f0082\" width=\"284\" height=\"383\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>Potenza нь 14 төрлийн пробоор дамжуулан дараах арьсны янз бүрийн асуудлыг арилгахаар тусгайлан зохион бүтээсэн хувийн арьсны арчилгааны шийдлийг санал болгодог:<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ee00dd4243f1e967123f682d440e549ef\">Батга болон нүх сүв сайжруулах &nbsp;<\/li><li data-list-item-id=\"e38c4ce0b4c60d114ceabf0082020c21f\">Улайлтыг намжаах &nbsp;<\/li><li data-list-item-id=\"e76c31c2929937bd7d4f621ad18c42cc7\">Үрчлээг бууруулж, арьсны уян хатан байдлыг нэмэгдүүлэх &nbsp;<\/li><li data-list-item-id=\"e10a9440ae44003ec3df00678f49c1946\">Шарх style=\"font-size:16px;\"><strong>Ulfit-ийн давуу тал:<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><ul><li data-list-item-id=\"ed2f58b7372dbde2d873183e94f4ce00c\">6мм болон 9мм гэсэн хоёр гүнд хоёр шатлалт лифтинг<\/li><li data-list-item-id=\"ea67096c82f3490885a4fef3dd21f7a49\">Төвлөрсөн хэт авианы энерги дермис болон арьсан доорх өөхөнд коагуляцийн бүс үүсгэнэ<\/li><li data-list-item-id=\"e066c8b80290dfe6c41b95b6052b26a6f\">Жигд бус өөхний эсийг дахин зохицуулж оновчтой үр дүн өгнө<\/li><li data-list-item-id=\"edf38569e109dc6475912bd7eed813f09\">Халдашгүй, өвдөлт бага, хугацаа богино ажилбар<\/li><li data-list-item-id=\"e177b33233ab581b03fcd9cf8455f8292\">Хурдан сэргэж, тэр даруй үйл ажиллагаандаа эргэн орно<\/li><li data-list-item-id=\"edd7474cc47f3cac93f38c664f7aae172\">Уян хатан эмчлэх хэсэг: гэдэс, гуя, гар, дотуур хувцасны шугам гэх мэт<\/li><li data-list-item-id=\"eb628720f6641b9472d009227d6b517ed\">Солонгосын Хүнс, эмийн аюулгүй байдлын яам (MFDS)-наас албан ёсны зөвшөөрөл авсан &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><strong>Slim тариа — Зөрүүд өөхийг хурдан арилгах<\/strong><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>&nbsp;&nbsp;<br>Slim тариа нь гэдэс, гуя, тулай, гарын хэсгийн илүүдэл өөхний эсийг үр дүнтэй бууруулж, хооллолт, дасгалаар арилгахад хэцүү биеийн шугамыг гөлгөр, чанга болгоно.<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:745/409;\" src=\"https://image.kbstations.com/2026/02/20/669c0ae4-972e-460e-9177-05bde7a6a37f\" width=\"745\" height=\"409\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Slim тарианы ажиллах хэсэг:<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e27bc801c34c04d89cf74e1fd2c191830\">Дотуур хувцасны шугам<\/li><li data-list-item-id=\"eac7b77964ebca2cfac8c48c62feed9a5\">Суганы өөх<\/li><li data-list-item-id=\"ef8cc0ae6747e7867154e77cd03663a58\">Гар<\/li><li data-list-item-id=\"eb8510a278d08dd694932192ed5f02c6f\">Гэдэсний дээд/доод хэсэг<\/li><li data-list-item-id=\"e7b5f71df3c42f2fc866776aeba10d0b3\">Гэдэсний хажуу<\/li><li data-list-item-id=\"eed589eb9c82bbed55253ed15a1d98b41\">Бэлхүүсний доод хэсэг<\/li><li data-list-item-id=\"ea95e616f5e0e1e874d66449cd1a86e91\">Өгзөгний өөх<\/li><li data-list-item-id=\"e4cafdb1228368b9aa3e83990ee05ed76\">Гуяны дотор/гадна тал<\/li><li data-list-item-id=\"e172b6ca47c4eeae5b2b4aea2feb6b4d4\">Тулай &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:821/883;\" src=\"https://image.kbstations.com/2026/02/20/61b8f2b2-25c2-4bf5-8f77-5e970a46b84b\" width=\"821\" height=\"883\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Дараах хүмүүст санал болгоно:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eb8bc88989230c309c5f0be64eeb2698a\">Хооллолт, дасгал хийсэн ч зөрүүд өөхтэй<\/li><li data-list-item-id=\"e6415aaf376eb4ecbd0d662631bc309cc\">Илүүдэл өөхнөөс болж долгиолсон биеийн шугамд санаа зовдог<\/li><li data-list-item-id=\"ecf77f89a66b0733fc1f6b221e534101f\">Арьс унжих, суларсан<\/li><li data-list-item-id=\"e8ec8b8f32d6476663070c95318e6b6f0\">Тодорхой хэсэгт төвлөрсөн арчилгаа хүсдэг<\/li><li data-list-item-id=\"eeeaa30b79f8c754644c0ac47a1c34989\">Хурдан сэргэж үйл ажиллагаандаа эргэн орохыг хүсдэг &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Анхаарах зүйл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ea0ad94dd5a18ec6b208558403a92fcca\">Арчилгааны дараа улайлт, хавдар буюу хөхрөлт үүсч болох ба 2–3 хоногт арилдаг<\/li><li data-list-item-id=\"e5ab114189c68043ec71b820875377633\">Халуун сауна, нийтийн халуун ус, жимжилбангаас зайлсхий<\/li><li data-list-item-id=\"e9f013b3c34da4a831aebbd836e1492db\">Арчилгааны дараа 1 долоо хоног архи, тамхинаас зайлсхий<\/li><li data-list-item-id=\"ecb5d6d94f32d295044319c04d5732037\">Хэт их дасгалаас зайлсхий<\/li><li data-list-item-id=\"ea4339e3093218fd6275f3687364619a0\">Өөрчлөлт 1 долоо хоногийн дараа мэдрэгдэж эхэлж, өөх задрах оновчтой нөлөө арчилгаанаас хойш 3 сар хүртэл үргэлжилнэ<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/20/b45c53cd-35ce-4614-a38c-602695c57695\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"2156","title":"Thermage FLX 600 Shot Official Certified","source":"ai","status":"ok","html":"<div class=\"editor-content\"><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:22px;\"><strong>Rejuran FLX – Дотроос коллаген нөхөн төлжилт<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\">&nbsp;<\/p><p>4-р үеийн Rejuran FLX нь дермис болон арьсан доорх өөхний давхаргад энергийг жигд хүргэдэг радио давтамжийн технологийг авчирдаг. Энэ ажилбар нь шинэ коллаген үүсэлтийг идэвхжүүлж, арьсны уян хатан байдлыг нэмэгдүүлж, нарийн үрчлээг сайжруулна.<\/p><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:243/360;\" src=\"https://image.kbstations.com/2026/02/20/1a5e122f-fc67-40e1-b077-4df73c116090\" width=\"243\" height=\"360\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Rejuran FLX-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e5b62ca5af5338a1feec3c250d39f18b3\">Энергийг илүү хурдан, хүчтэй хүргэнэ<\/li><li data-list-item-id=\"ece87ac746017bed5638c4f08bd6e941e\">Шот бүрийн нарийвчлалд зориулсан автомат тохируулгын алгоритм<\/li><li data-list-item-id=\"ee3a76cff7398296605b7d367d72767eb\">Давхар хөргөлт ба чичиргээтэй AccuREP систем өвдөлтийг бууруулна<\/li><li data-list-item-id=\"eb2c46673cb5a70b8ac1a7157ee5893eb\">Нүүрний tip-ийн хэмжээ 4.0 см², өмнөх үеэс том<\/li><li data-list-item-id=\"e45a4b29831b5e39c0c50dce3a47c8524\">Үргэлжилсэн хөргөлт ба идэвхтэй чичиргээгээр ажилбарын явцад арьсыг оновчтой хамгаална<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image image_resized\" style=\"width:100%;\"><img style=\"aspect-ratio:682/207;\" src=\"https://image.kbstations.com/2026/02/20/5b36f5ef-ec43-4b4f-ade0-7b4a5ad36ed4\" width=\"682\" height=\"207\"><\/figure><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Хүлээгдэх үр дүн:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ec0c3dfc798fa0f920ce8235eab212f2e\">Арьсны уян хатан байдал нэмэгдэх<\/li><li data-list-item-id=\"e78ca35ef499350d4a2c740e841cb6b1f\">Нарийн үрчлээ сайжрах<\/li><li data-list-item-id=\"eeaea80323e3546f625f3017c9fe0bc50\">Нүх сүв багасах<\/li><li data-list-item-id=\"ed0300f07263d56f855227f69cba2227e\">Арьсны бүтэц сайжрах<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:552/299;\" src=\"https://image.kbstations.com/2026/02/20/f981ae7c-d539-4625-a6a9-e986d3b906e2\" width=\"552\" height=\"299\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Rejuran FLX-ийн ажилбар:<\/strong><\/span><\/p><p>&nbsp;<\/p><ol><li data-list-item-id=\"e4261514fcc022df16b3123bbc52fad23\">Tip арьсанд нягт наалдана<\/li><li data-list-item-id=\"e27b207f0ca98143c30b4484d4dfff01b\">Үргэлжилсэн хөргөлтийн системтэйгээр радио давтамжийг дермис давхаргад хүргэнэ<\/li><li data-list-item-id=\"e27bf01e5c4fe138d5c5ccc482b3f8422\">Ажилбарын явцад болон дараа чичиргээ, хөргөлтөөр арьсыг хамгаална<\/li><\/ol><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:553/141;\" src=\"https://image.kbstations.com/2026/02/20/e8ed6b09-a0cc-48a9-a09a-8f28365b036f\" width=\"553\" height=\"141\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Rejuran FLX дараах хүмүүст санал болгоно:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e4fb718194e4140e3dfcea571bf489283\">Rejuran CPT-ийн дараа хүчтэй өвдөлт мэдэрсэн<\/li><li data-list-item-id=\"ea99a4a299c2cb156109674b0105b4cfd\">Нүүрний уян хатан байдлыг сайжруулахыг хүсдэг<\/li><li data-list-item-id=\"ee28e7465f6b0f9427c01266d9e07162d\">Арьсны бүтэц сайжруулах, нүх сүв багасгах хэрэгтэй<\/li><li data-list-item-id=\"e2fb6dda588566be81187fe9e3a85f309\">Нарийн үрчлээ нэмэгдэхэд санаа зовдог<\/li><li data-list-item-id=\"e4e5beb8af251b7b3cfea5e24521ca88d\">Хэт олон удаа лифтинг хийлгэхээс зайлсхийхийг хүсдэг<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:796/399;\" src=\"https://image.kbstations.com/2026/02/20/9fbf87e6-7d4f-4fec-b552-e51d09fa9d47\" width=\"796\" height=\"399\"><\/figure><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Түгээмэл асуултууд:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e9b7b10bf6964dcabff454a994a5fec3b\">3-р үеийн Rejuran CPT-ээс юугаараа ялгаатай вэ? &nbsp;<br>&nbsp;Tip-ийн хэмжээ том, ажилбар хурдан, өвдөлт бага, үр дүн удаан хадгалагдана.<\/li><li data-list-item-id=\"e92b06b8764359a3649cf40c3f4c84597\">Өвдөлт нь ямар вэ? &nbsp;<br>&nbsp;Сайжруулсан хөргөлт ба чичиргээний систем өвдөлтийг эрс бууруулна.<\/li><li data-list-item-id=\"edb086ccccfe58f5fe5a82c3ea0e17e7f\">Үр дүн хэзээ харагдах вэ? &nbsp;<br>&nbsp;Ажилбарын дараа арьс шууд чанга мэдрэгдэж, коллаген нөхөн төлжилт 2–3 сар үргэлжлэн оновчтой үр дүн өгнө.<\/li><li data-list-item-id=\"e1da1fe33f18a1556fd9e3bcef9e1c78b\">Бусад ажилбартай хослуулж болох уу? &nbsp;<br>&nbsp;Хэт авианы лифтинг, утсан лифтинг буюу тарилгатай хослуулж илүү синерги үр дүн авч болно.<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p><span style=\"font-size:20px;\"><strong>Үнэ:<\/strong><\/span><\/p><p><br>Rejuran FLX 600 shots — 2,200,000 KRW (НӨАТ багтсан)<\/p><p>&nbsp;<\/p><p>Зөвхөн Reverse Dermatology Clinic-т Солонгосын MFDS-ээс зөвшөөрөгдсөн жинхэнэ төхөөрөмж, tip-ээр хийгдэнэ.<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><\/div>"},{"pid":"2161","title":"ULTRACOL Collag pan style=\"font-size:16px;\"><strong>Арчилгааны сонголт:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e6ca52ff187f7c059ee868c12d959f9a4\">4cc нэг удаагийн тариа — 660,000 KRW (татвар багтсан) <\/li><li data-list-item-id=\"e3c4925778868cecfdd49ed0d43588da1\">6cc нэг удаагийн тариа — 880,000 KRW <\/li><li data-list-item-id=\"e4b0342c014003e9903dcda9db6976269\">8cc нэг удаагийн тариа — 1,100,000 KRW <\/li><li data-list-item-id=\"e284f0fff085b5e47c06ed449052f55a0\">10cc нэг удаагийн тариа — 1,320,000 KRW &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Skinny Body Vivle тарианы давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eba894283beb0f30b6e62ff0b3fc1aa28\">Эсийн мембраныг гэмтээхгүйгээр өөхний эсийг сонгомлоор задалдаг тул үрэвслийн урвалаас зайлсхийнэ. <\/li><li data-list-item-id=\"e1c530fda6fcf4bb2332309f11e43977a\">Өөхний хэмжээг бууруулах биш, өөхний эсийн тоог байнга бууруулна. <\/li><li data-list-item-id=\"eaf18c438b231a82f310c99e93a04ed77\">Удаан хадгалагдах хагас байнгын нөлөө. <\/li><li data-list-item-id=\"ec09c09cc4f9410d7e2fad5ac81d5e8d4\">Илүү сайн арьс сайжруулахын тулд коллаген нийлэгжилтийг идэвхжүүлнэ. <\/li><li data-list-item-id=\"e0bb766123c1595a06dd13d702dd167ec\">Аюулгүй, үр дүнтэй Deoxycholic Acid агуулсан, Хүнс эмийн аюулгүй байдлын яамаар зөвшөөрөгдсөн. &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:809/803;\" src=\"https://image.kbstations.com/2026/02/20/8e442430-2692-4830-806e-e06bca5fe70b\" width=\"809\" height=\"803\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Vivle тариа гэж юу вэ?<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>Vivle тариа нь өөхний эсийг задалснаар дахин өөх хадгалах боломжгүй болгодог Deoxycholic Acid-ийг ашигладаг. Энэ үйл явц нь ердийн өөх задлахаас ялгаатай бөгөөд өөхний эсийг биеэр задалж, эсийн үхлийг өдөөн эргэшгүй өөхний эсийн бууралтыг бий болгодог. &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Зорилтот хэсэг:<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>Хооллолт, дасгалаар арилгахад хэцүү давхар эрүү, гар, гэдэс, гуя, тулай зэрэг хэсэгт тохиромжтой. &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Давтан арчилгаа:<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>Давтан арчилгаагаар туранхай биеийн шугам улам тодорхой харагдана&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:1015/626;\" src=\"https://image.kbstations.com/2026/02/20/3908b5c8-a266-4fb3-87bc-a02a7688ab12\" width=\"1015\" height=\"626\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Түгээмэл асуултууд:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e55e9941a92013589ab4ab933f6cf8e2c\">Vivle нь өөхийг эмульсжүүлж задлахад тусалдаг FDA гэрчилгээтэй Deoxycholic Acid тариа юм. <\/li><li data-list-item-id=\"e8312a7ac7145ce9abbfe8d91cba31704\">Тариаг арьсан дор хийх бөгөөд өөхний эдийн мембранд өндөр хамааралтайгаар өөхний эсийг задална. <\/li><li data-list-item-id=\"e407b760878ede28e3827d8cf11c57f59\">Оновчтой үр дүн ихэвчлэн 3 удаагийн арчилгааны дараа харагдаж, 92.8% өөхний бууралтад хүрдэг. &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Ажилбарын дараах анхаарах зүйл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ecdd6ad4a40b2e2472364da323b36224b\">Хавдар, хөхрөлт 2–3 хоног үргэлжилж болно. <\/li><li data-list-item-id=\"e161e504364add42fc3c61852093fa552\">Хүйтэн, дулаан жинг ээлжлэн тавьснаар сэргэлтийг хурдасгана.<\/li><li data-list-item-id=\"ed2fa12620c2e711142e997df67f50ece\">1 долоо хоног сауна, уурын өрөө, массажаас зайлсхий. <\/li><li data-list-item-id=\"e965eee404ccadf645a80a9e121344272\">Маргааш өдөр нь шүршүүрт орохыг зөвшөөрнө. <\/li><li data-list-item-id=\"e0a5c09748fdae8fd0f95f8d08f16ea3a\">Түр зуурын мэдрэхүйн бууралт үүсч болох ч аажмаар сэргэнэ. &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Skinny Body Vivle тариагаар илүүдэл өөхгүй идеал биетэй болоорой — илүү туранхай, эрүүл биеийн хэлбэрийн ухаалаг шийдэл.<\/p><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/20/e955ac85-73dd-4d61-96b1-2bcf9b2a333a\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"2178","title":"Density High Official Tip Treatment","source":"ai","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:820/817;\" src=\"https://image.kbstations.com/2026/02/20/913a63b3-65b7-47fd-b1ac-d825031ad6e7\" width=\"820\" height=\"817\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:12px;\"><strong>DENSITY HIGH – Илүү өөртөө итгэлтэй арьсны төлөө давхар радио давтамжийн технологи ✨<\/strong><\/span><\/p><p>&nbsp;<\/p><p>DENSITY HIGH нь хамгийн гүн арьсан доорх давхаргад чиглэдэг монополяр радио давтамж болон арьсны гадаргуу давхаргад үйлчилдэг биполяр радио давтамжийг хослуулдаг. Хоёр төрлийн радио давтамжийн энергийг зэрэг хүргэснээр энэ арчилгаа оновчтой үр дүн өгдөг.<\/p><p>&nbsp;<\/p><p>5 түвшний нарийвчилсан хөргөлтийн систем болон импедансын эргэх холбооны технологитой DENSITY HIGH нь арьсыг хамгаалахын зэрэгцээ 400W хүртэлх өндөр чадлын радио давтамжийн энергийг алгасах хэсэггүйгээр хүргэдэг.<\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:1033/374;\" src=\"https://image.kbstations.com/2026/02/20/02244a80-b736-4f05-924a-4bb798e360f8\" width=\"1033\" height=\"374\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>DENSITY HIGH-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e9531e3943d47ef063d4fd74a183e8bd8\">Хамгийн ихдээ 400W чадалтай монополяр ба биполяр радио давтамж <\/li><li data-list-item-id=\"ec3477b415e5a8331558b94a61ddb30a6\">5 түвшний нарийвчилсан хөргөлтийн систем <\/li><li data-list-item-id=\"eaa0c054e1252446ce831db07de468d44\">Энергийг жигд хүргэх импедансын эргэх холбооны технологи <\/li><li data-list-item-id=\"e5ea85b2ceebc96350522b3759121dfc9\">Халдашгүй, практик ажилбар <\/li><li data-list-item-id=\"e064a44c60e7bd17d8709328abeaacada\">Хийн шүршилт болон бодит цагийн температурын хяналтаар эпидермис давхаргыг хамгаална &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Арчилгааны давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ed6d0330dea03fb1904fba4837159690c\">Нарийн үрчлээ сайжруулах <\/li><li data-list-item-id=\"eee0afde525aa2fa907e81a62dd92e310\">Нүх сүв сайжруулах <\/li><li data-list-item-id=\"e5410aad44082a3e1c615be3551b0c20e\">Арьсны өнгийг тэгшлэх <\/li><li data-list-item-id=\"eb5e3756352c1972fb056452ad7e6f14e\">Арьсыг гэрэлтүүлэх &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:815/778;\" src=\"https://image.kbstations.com/2026/02/20/85883979-adee-456a-95ac-0500983a40f7\" width=\"815\" height=\"778\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Ажиллах зарчим:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e1721e1b40061465a2a9f562ab8301d11\">Шууд нээлттэй жинхэнэ проб арьсны гүн давхаргад нэвтэрнэ <\/li><li data-list-item-id=\"eee61e88381ede9b870f7ac9f70391a7c\">Радио давтамжийн энергийг 5 импульсээр ээлжлэн цацаж, 2 ба 4-р импульс дээр хөргөнө <\/li><li data-list-item-id=\"e787247d4e074e92ecb74e8a65d70af18\">Арьсны төрөл бүрт тохируулан хөргөлтийн түвшин ба төрлийг тохируулна &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:926/393;\" src=\"https://image.kbstations.com/2026/02/20/f092193e-3caf-40f0-bf56-d3fe26be49b6\" width=\"926\" height=\"393\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Дараах хүмүүст санал болгоно:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e55d4bfeedc5f708d8eee1eb836788b11\">Хөгшрөлт буюу өмнөх арчилгаанаас болж хацар унжсанд санаа зовдог &nbsp;<br>Жигд бус нүүрний контурыг сайжруулахыг хүсдэг <\/li><li data-list-item-id=\"ee0406d9fd5aefcdf791a1d919dd31db7\">Нарийн үрчлээ, нүх сүвний асуудалтай <\/li><li data-list-item-id=\"e12bdb076ed59396d6b7649b1db0db88e\">Хурдан, практик лифтинг хүсдэг &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:937/374;\" src=\"https://image.kbstations.com/2026/02/20/186fe259-dd30-43d9-9393-d16609fb0a0d\" width=\"937\" height=\"374\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Арчилгааны дараах чухал мэдээлэл:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ed1c0f2dd049ede2394c56c0727002d67\">Гадаа явахдаа нарны тос хэрэглэ <\/li><li data-list-item-id=\"e5d44d5f3746606911217619593b7474b\">Хөнгөн дасгал хийж, хангалттай унт <\/li><li data-list-item-id=\"ee19ac56d8285fd2cbbc32b5b2f9c8eed\">Чийгшлээ хадгалахын тулд өдөрт 2L-ээс дээш ус уу <\/li><li data-list-item-id=\"efb3cbf4b625f481adcccad61c5aa0a37\">Хэдэн өдөр арьсыг цочроодог гуужуулагч бүтээгдэхүүнээс зайлсхий &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:913/689;\" src=\"https://image.kbstations.com/2026/02/20/4c10e21f-e9f2-4df3-a676-356540304495\" width=\"913\" height=\"689\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Богино FAQ:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ea76aff46966791936996c116d3660f17\">Үр дүн: Давхар радио давтамжийн нэвтрэлтээр арьс илүү чанга мэдрэгдэж өөртөө итгэлтэй болно <\/li><li data-list-item-id=\"e7e1ad2f776888b5d48901e0c85dd3553\">Арчилгааны тоо: Арьсны байдал, хэсгээс хамаарч тохируулна, эмнэлгийн мэргэжилтэнтэй зөвлөлдөнө <\/li><li data-list-item-id=\"eceee896784c9e3672dec01f6a0717d83\">Сэргэх хугацаа: Арчилгааны дараа тэр даруй өдөр тутмын үйл ажиллагаагаа хийх боломжтой &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>DENSITY HIGH 300 удаа — 649,000 KRW (НӨАТ багтсан) &nbsp;<br>Оновчтой үр дүнгийн төлөө шууд нээлттэй жинхэнэ пробоор арчилгааны жинхэнэ эх байдлыг баталгаажуул.<\/p><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/20/7c600c12-dbdb-47d2-944b-fb22d67076c9\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"2180","title":"InMode FX + Shurink","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:680/456;\" src=\"https://image.kbstations.com/2026/02/20/94a155a9-6cf5-48d7-9b61-c561698ae9e0\" width=\"680\" height=\"456\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Шугаман — Таны мөрөөдлийн V-line төрх✨<\/strong><\/span><\/p><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:690/321;\" src=\"https://image.kbstations.com/2026/02/20/38b717b8-ebcc-4bcb-8ec6-69d02b3ec037\" width=\"690\" height=\"321\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>INMODE Lifting<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;<br>INMODE Lifting нь радио давтамжийн энерги ашиглан илүүдэл өөхийг арилгаж, зэрэгцэн арьсны нөхөн төлжилтийг идэвхжүүлдэг. Энэ эмчилгээ нь уян хатан байдлыг бэхжүүлж, нарийн үрчлээг сайжруулж, коллагенийг дахин бүтээснээр нүүрний ерөнхий уян хатан байдал болон V-line төрхийг сайжруулна. &nbsp;<\/p><p>Мэс заслын бус лифтинг ажилбарын хувьд INMODE Lifting нь FDA, KFDA-аас давхар гэрчилгээ авсан, аюулгүй бөгөөд эмнэлзүйгээр үр нөлөө нь батлагдсан төхөөрөмж ашигладаг. &nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e5774266f12809a634774f733bf6f01f0\">Илүүдэл өөхийг арилгана <\/li><li data-list-item-id=\"e9d043c69fc48c7d63df45394efa2b810\">Арьсны уян хатан байдлыг сайжруулна <\/li><li data-list-item-id=\"e2d039c21b3a16462151a505a49c7fb77\">FDA, KFDA гэрчилгээтэй <\/li><li data-list-item-id=\"ef890e89f186e82612374df1febb5918b\">2-р үеийн хамгийн сүүлийн үеийн INMODE Lifting төхөөрөмж <\/li><li data-list-item-id=\"ed94167f6e7177ef02ab486c1eeb1fc9b\">FX болон FORMA ажилбарыг эмнэлгийн мэргэжилтэн шууд гүйцэтгэнэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:704/635;\" src=\"https://image.kbstations.com/2026/02/20/f792f2d2-eaac-4ba7-9554-b9745d3b60a7\" width=\"704\" height=\"635\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>REVERSE 2-р үеийн хамгийн сүүлийн үеийн<\/strong><\/span><\/p><p style=\"text-align:center;\">&nbsp;<\/p><p><br>REVERSE эмнэлэгт температур мэдрэгч технологийг хэрэглэн бодит цагийн температурын хяналтаар дамжуулан дулааны энергийн аюулгүй гаралтыг хангадаг. REVERSE нь оновчтой үр дүнгийн төлөө 2-р үеийн хамгийн сүүлийн үеийн INMODE RF-ийг ашигладаг. &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:20px;\"><strong>INMODE ба Shurink<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;<br>Дараах хүмүүст санал болгоно: &nbsp;<\/p><ul><li data-list-item-id=\"ef7924cba17249c27763cacc57b5745de\">Тэгш бус нүүрний хэлбэрээсээ болж өөртөө итгэлгүй байдаг <\/li><li data-list-item-id=\"ea7a13839f654cbccb706c3683135c55f\">Зузаан эрүүний шугамаас болж нүүр том харагдахаас санаа зовдог <\/li><li data-list-item-id=\"e7ebc76e82c1704b3ba5e6afada163d53\">Хацар, давхар эрүү, шанааны өөх зэрэг нүүрний өөхний асуудалтай <\/li><li data-list-item-id=\"e8485e68ef8c377979ffc6153883a0fbf\">Эрүү өргөн тул нүүр дүүрэн харагддаг <\/li><li data-list-item-id=\"ea9716be289c1d3312e694d427b9348d7\">Эрүүний шугам унжих, арьсны уян хатан байдал буурснаас болж V-line лифтинг хүсдэг &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:525/743;\" src=\"https://image.kbstations.com/2026/02/20/d2d29d38-6f54-4b19-a7df-9a07168a0464\" width=\"525\" height=\"743\"><\/figure><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Shurink Universe 2-р үе<\/strong><\/span><\/p><p>&nbsp;<\/p><p>&nbsp;&nbsp;<br>Shurink Lifting нь өндөр эрчмийн хэт авиа ашиглан арьсны тодорхой гүнд дулааны коагуляцийн цэг үүсгэж, унжсан эдийг агшааж лифтингийн нөлөө өгдөг. Энерги нь гүн фасци давхарга хүртэл нэвтэрч арьсыг чангалж, өргөдөг. &nbsp;<\/p><p>&nbsp;<\/p><p>Сайжруулсан Shurink Universe нь Ultra F (шугаман) болон Ultra Booster Pen-type (дугуй)-тай тул нүүрний муруйд тохируулан нарийн ажилбар хийх боломжтой. &nbsp;<\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e7557fe7fcdc9c718c7f4cd376692d1bd\">Ажилбарын хугацаа богино <\/li><li data-list-item-id=\"e455af83e9029aec01c8363480d3cd624\">Өвдөлт багасна <\/li><li data-list-item-id=\"e72ee9fca1c15e9061480ae22da8dd8d4\">Муруй хэсэгт нарийн ажиллах төрөл бүрийн handle <\/li><li data-list-item-id=\"e562486e9557c4a71add6605d721cfe7e\">Лифтингийг сайжруулахын зэрэгцээ арьсыг цайруулж, гэрэлтүүлэх тусгай ампул &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:959/533;\" src=\"https://image.kbstations.com/2026/02/20/09c550a6-1d3d-4bf4-910e-fb0b3580dd8a\" width=\"959\" height=\"533\"><\/figure><figure class=\"image\"><img style=\"aspect-ratio:975/610;\" src=\"https://image.kbstations.com/2026/02/20/4c771aaf-6100-4dea-b6d8-0348e8a792ef\" width=\"975\" height=\"610\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Normal ба MP горим<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>MPT технологиор хоёр төрлийн ажилбар хийх боломжтой: &nbsp;<\/p><ul><li data-list-item-id=\"e041874937643ae2e577c78975c229b91\">Шугаман болон цэгэн — хугацаа богино, хурдан, өвдөлт хамгийн бага <\/li><li data-list-item-id=\"ef8b0e65fa0283618ce6819b462ab4e61\">Дугуй шугам болон дугуй цэг — муруй хэсэгт нягт наалдаж нарийн ажиллана<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:1080/4110;\" src=\"https://image.kbstations.com/2026/02/20/ba4b5b85-b0c8-4050-b3d7-fa72e443ed1e\" width=\"1080\" height=\"4110\"><\/figure><\/div>"},{"pid":"2181","title":"InMode Lifting","source":"sheet","status":"ok","html":"<div class=\"editor-content\"><figure class=\"image\"><img style=\"aspect-ratio:680/456;\" src=\"https://image.kbstations.com/2026/02/20/54e66aa0-6ebc-4607-9938-28d9ee96b22a\" width=\"680\" height=\"456\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>Хязгаарлагдмал туршилтын үнэ<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"ebdde58549bee957d3e55ec90b2255df0\">1 хүн, 1 удаагийн эмчилгээ <\/li><li data-list-item-id=\"e7e6be2c7138ce9a0967cfbfa3f5a8016\">2 удаагийн лифтинг сесс <\/li><li data-list-item-id=\"e9e0b66b9c89fd14861ce4d53fa1c5e0b\">Илүү чангарсан үр дүн &nbsp;<\/li><\/ul><figure class=\"image\"><img style=\"aspect-ratio:857/396;\" src=\"https://image.kbstations.com/2026/02/20/9695246e-333b-4850-8fc5-b39979a06648\" width=\"857\" height=\"396\"><\/figure><p style=\"text-align:center;\">&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>INMODE Lifting<\/strong><\/span><\/p><p>&nbsp;<\/p><p><br>INMODE 1 хэсэг (FX эсвэл FORMA горим) — 69,000 KRW &nbsp;<br>※ Үндсэн үнэ 75,900 KRW, 1 хүн 1 удаа (1 хэсэг) хязгаарлагдмал туршилтын үнэ. &nbsp;<\/p><p>Мэс заслын бус лифтингийн технологи INMODE Lifting-ээр мөрөөдлийн V-line-аа бүтээгээрэй: &nbsp;<br>&nbsp;<\/p><ul><li data-list-item-id=\"e5569fe6b47ee939d78ea03e42419e20b\">Илүүдэл өөхийг арилгана <\/li><li data-list-item-id=\"e12b99f47d4f639e9b64a3cf19108f1bc\">Арьсны нөхөн төлжилтийг идэвхжүүлнэ <\/li><li data-list-item-id=\"efc2ea0e28db4bb13853ad801170ddc8b\">Арьсны уян хатан байдлыг сайжруулна <\/li><li data-list-item-id=\"ea8992c62a272255ec93dfc4904692159\">Нарийн үрчлээг сайжруулна <\/li><li data-list-item-id=\"e7ac8b9c5cc139bf8e5773840e23e0f7d\">Радио давтамжийн энергиэр коллаген үйлдвэрлэлийг идэвхжүүлнэ &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>Үр нөлөө нь батлагдсан бөгөөд FDA, KFDA-аас давхар гэрчилгээ авсан. &nbsp;<\/p><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>INMODE Lifting-ийн давуу тал:<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"e3575b3f46d3e539316c613ba5facec53\">Өөх арилгах болон арьсны уян хатан байдлыг зэрэг сайжруулна <\/li><li data-list-item-id=\"ed110a41d701ed0c219c07d34307f737c\">2-р үеийн хамгийн сүүлийн үеийн төхөөрөмж <\/li><li data-list-item-id=\"e447adc5fca0c7b8b880e950bacb2df72\">Ажилбарыг эмнэлгийн мэргэжилтэн шууд гүйцэтгэнэ&nbsp;<\/li><li data-list-item-id=\"ea71b0698ae718dfd798a871767beec90\"><p>Хоёр төрлийн эмчилгээний горим:<\/p><p>- MINI FX: 45–47°C температурт HVP энергиэр илүүдэл өөхийг арилгана, 2000V энергийг өөхний давхаргад дамжуулж өөхний эсийг үндсээр нь устгана &nbsp;<br>&nbsp;- FORMA: MULTI-POLAR энергиэр дермисийг лифтинг хийж, коллаген, гиалуроны хүчлийн үйлдвэрлэлийг идэвхжүүлж, арьсны температурыг 43°C хүртэл өсгөж уян хатан ширхэг нөхөн төлжүүлж, нарийн үрчлээг сайжруулна &nbsp;<\/p><\/li><\/ul><p>&nbsp;<\/p><figure class=\"image\"><img style=\"aspect-ratio:865/780;\" src=\"https://image.kbstations.com/2026/02/20/fb00ec2d-c1f7-4e5c-8a54-1daa17da2458\" width=\"865\" height=\"780\"><\/figure><p style=\"text-align:center;\"><span style=\"font-size:16px;\"><strong>REVERSE эмнэлгийн хамгийн сүүлийн үеийн технологи<\/strong><\/span><\/p><p>&nbsp;<\/p><ul><li data-list-item-id=\"eed14d21372f50e319c54d37d7df4457c\">Секундэд 1,000 удаа шалгадаг бодит цагийн температур мэдрэгч <\/li><li data-list-item-id=\"eaf4f57ca2d9c881c4c05385825f64f5d\">Хэт улаан туяаны дулаан мэдрэгчээр тогтвортой, жигд дулааны гаралт <\/li><li data-list-item-id=\"e021382cc843973db628326c3cc96001d\">Оновчтой үр дүнгийн төлөө 2-р үеийн хамгийн сүүлийн үеийн INMODE RF ашиглана &nbsp;<\/li><\/ul><p>&nbsp;<\/p><p>&nbsp;<\/p><p style=\"text-align:center;\"><spa <script>

  const ta=document.getElementById('exportTa'); ta.value=txt;
  document.getElementById('exportBox').style.display='flex';
  ta.focus(); ta.select();

}
function closeExport(){ document.getElementById('exportBox').style.display='none'; }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }

async function copyRich(html){
  try{ await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([html],{type:'text/plain'})})]); return true; }
  catch(e){ const d=document.createElement('div'); d.contentEditable='true'; d.style.cssText='position:fixed;left:-9999px;top:0'; d.innerHTML=html; document.body.appendChild(d); const r=document.createRange(); r.selectNodeContents(d); const s=getSelection(); s.removeAllRanges(); s.addRange(r); let ok=false; try{ok=document.execCommand('copy');}catch(_){} s.removeAllRanges(); d.remove(); return ok; }
}
function doCopy(pid, btn){
  const it=P.find(x=>x.pid===pid); if(!it) return;
  copyRich(it.html).then(ok=>{ if(ok){ toast('📋 복사됨 — 에디터에서 Ctrl+V'); btn.classList.add('copied'); btn.textContent='✓ 복사됨'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='📋 복사';},1500); if(!DONE[pid]){DONE[pid]=true;saveDone();render();} } else toast('복사 실패 — 미리보기에서 수동 복사하세요'); });
}
function togglePrev(pid){ const el=document.getElementById('prev-'+pid); if(!el)return; if(el.classList.contains('open')){el.classList.remove('open');return;} const it=P.find(x=>x.pid===pid); el.innerHTML='<iframe srcdoc="'+(it.html.replace(/"/g,'&quot;'))+'"></iframe>'; el.classList.add('open'); }
function toggleDone(pid){ DONE[pid]=!DONE[pid]; saveDone(); render(); }

    items.map(x=>'<tr class="'+(REVIEW[x.pid]?'reviewed':'')+'"><td>'+esc(x.store)+'</td><td>'+esc(x.eng)+'</td><td>'+esc(x.mn||'-')+'</td><td>'+x.pid+'</td><td><span class="stx '+statClass(x.status)+'">'+esc(x.status)+'</span></td>'+
      '<td><span class="stx '+thumbClass(x.thumb)+'">'+esc(x.thumb||'?')+'</span></td>'+
      '<td class="rvw"><input type="checkbox" class="rvchk" '+(REVIEW[x.pid]?'checked':'')+' onchange="saveReview(\''+x.pid+'\',this.checked);this.closest(\'tr\').classList.toggle(\'reviewed\',this.checked)"></td>'+
      '<td class="issue">'+esc(x.issue||'-')+'</td>'+
      '<td><input class="noteinp" value="'+escAttr(NOTES[x.pid]||'')+'" placeholder="비고 입력" onchange="saveNote(\''+x.pid+'\',this.value)"></td></tr>').join('')+
    '</tbody></table>' : '<div class="empty">결과 없음</div>';
  syncHdr();
}
function thumbClass(t){ if(t==='정품')return 'st-done'; if(t==='더미')return 'st-amb'; if(t==='미발견')return 'st-none'; return 'st-thumb'; }
function renderHistory(){
  const H=window.HISTORY||[];
  document.getElementById('stat').textContent='변경 이력 '+H.length+'건';
  const list=document.getElementById('list');
  list.innerHTML='<div class="hist">'+H.map(h=>'<div class="hitem"><div class="hd2"><span class="hdate">'+esc(h.d)+'</span><b>'+esc(h.t)+'</b></div><div class="hx">'+esc(h.x)+'</div></div>').join('')+'</div>';
}
function syncHdr(){ const h=document.querySelector('header'); if(h) document.documentElement.style.setProperty('--hdr-h', h.offsetHeight+'px'); }
window.addEventListener('resize', syncHdr);
function render(){
  if(tab==='hist'){ renderHistory(); return; }
  if(tab==='stat'){ renderStatus(); return; }
  const doneN = P.filter(x=>DONE[x.pid]).length;
  document.getElementById('pbar').style.width = (P.length?doneN/P.length*100:0)+'%';
  document.getElementById('stat').textContent = '완료 '+doneN+' / 생성 '+P.length+'  (정상 전체 '+TOTAL+' · 디자이너 '+DES.length+')';
  const list=document.getElementById('list');
  if(tab==='des'){
    list.innerHTML = DES.length? DES.map(d=>'<div class="card"><div class="row"><span class="pid">'+d.pid+'</span><span class="title">'+esc(d.title)+'</span><a class="dlink" href="'+d.url+'" target="_blank">FO 페이지 ↗</a></div></div>').join('') : '<div class="empty">없음</div>';
    return;
  }
  const q=document.getElementById('q').value.trim().toLowerCase();
  const fs=document.getElementById('fstatus').value, fd=document.getElementById('fdone').value;
  let items=P.filter(x=>{
    if(q && !((x.title||'').toLowerCase().includes(q) || x.pid.includes(q))) return false;
    if(fs && x.status!==fs) return false;
    if(fd==='done' && !DONE[x.pid]) return false;
    if(fd==='todo' && DONE[x.pid]) return false;
    return true;
  });
  list.innerHTML = items.length? items.map(x=>
    '<div class="card'+(DONE[x.pid]?' done':'')+'">'+
      '<div class="row">'+
        '<span class="pid">'+x.pid+'</span>'+
        '<span class="title">'+esc(x.title)+'</span>'+
        '<span class="badge '+x.source+'">'+(x.source==='sheet'?'시트':'AI')+'</span>'+
        (x.status==='review'?'<span class="badge review">검토</span>':'')+
        '<button class="btn copy" onclick="doCopy(\''+x.pid+'\',this)">📋 복사</button>'+
        '<button class="btn" onclick="togglePrev(\''+x.pid+'\')">👁 미리보기</button>'+
        '<label class="chk"><input type="checkbox" '+(DONE[x.pid]?'checked':'')+' onchange="toggleDone(\''+x.pid+'\')">완료</label>'+
      '</div>'+
      '<div class="prev" id="prev-'+x.pid+'"></div>'+
    '</div>').join('') : '<div class="empty">결과 없음</div>';
}
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
render();
</script>
</body>
</html>
